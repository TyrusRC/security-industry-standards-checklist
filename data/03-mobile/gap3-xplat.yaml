- id: MOB-XPLAT-003
  sheet: MOB
  category: XPLAT
  title: Check hybrid app WebViews, plugins and allowed origins
  objective: Find hybrid apps that load untrusted origins in a WebView with native bridges, or that ship vulnerable web libraries and plugins.
  preconditions:
  - The app package and the framework configuration files, such as config.xml or capacitor.config.
  steps:
  - List the origins that the app may load in its WebView. Read the allowed origin and navigation settings of the framework.
  - Make sure the list holds only the origins that the app needs and has no wildcard.
  - Make sure JavaScript is on only for content that the app controls.
  - Look at the native plugins that the page can call. Make sure untrusted content cannot reach sensitive plugins.
  - Try to load a page from another origin in the WebView, for example by a link or a redirect. Make sure the app blocks it.
  - List the plugins and the JavaScript libraries in the package. Compare their versions with known vulnerabilities.
  - Make sure external content opens in Custom Tabs when the app does not need a WebView for it.
  example: 'grep -rn "loadUrl\|allow" config.xml capacitor.config.*; npm audit; retire --path www/'
  expected: The WebView loads only listed origins. Untrusted content cannot call sensitive plugins, and plugins and web libraries have no known vulnerabilities.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: MASVS L1
