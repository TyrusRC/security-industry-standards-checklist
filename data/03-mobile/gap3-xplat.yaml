- id: MOB-XPLAT-002
  sheet: MOB
  category: XPLAT
  title: Check the integrity of React Native bundles and over-the-air updates
  objective: Find apps that run a changed or downloaded JavaScript bundle without an integrity check.
  preconditions:
  - A test build and the tools to unpack and repack the package on a test device.
  - Knowledge of the update service that the app uses, if any.
  steps:
  - Unpack the package. Find assets/index.android.bundle on Android or main.jsbundle on iOS.
  - Look at the bundle. Note if it is minified JavaScript or Hermes bytecode.
  - Change a harmless string in the bundle. Repack and re-sign the app. Install it on the test device.
  - Start the app. Look for an integrity check or tamper detection that stops the app.
  - Find the code that downloads a new bundle or update. Make sure the app checks a signature or a hash before it runs the update.
  - Replace the downloaded bundle in a test environment. Make sure the app rejects it.
  - Make sure the app does not run a bundle after a failed integrity check.
  example: 'unzip app.apk -d out; file out/assets/index.android.bundle; hermes-dec out/assets/index.android.bundle; apktool b out; apksigner sign --ks test.jks app.apk'
  expected: The app detects a changed bundle and refuses to run an unsigned or changed update. A failed integrity check stops the use of the resource.
  severity: Medium
  test_type:
  - Manual
  level: MASVS R
  refs:
    mobile_top10:
