- id: MOB-XPLAT-001
  sheet: MOB
  category: XPLAT
  title: Check pinning and TLS in the own network stack of cross-platform apps
  objective: Find cross-platform apps whose own HTTP stack ignores the platform pinning, trust and cleartext settings.
  preconditions:
  - A test build, a rooted or jailbroken test device and an interception proxy. Do not test other parties' servers.
  - A written list of first-party domains.
  steps:
  - Identify the framework from the app package. Find out if the app uses the platform HTTP stack or its own.
  - For Flutter, look for pinning in Dart code with SecurityContext or a badCertificateCallback. NSC and ATS pins do not apply to Dart.
  - Look in the Dart code for a badCertificateCallback that returns true without a check.
  - For React Native on iOS, check if the pins in ATS or the URLSession code cover the traffic. For Cordova, check the native pinning plugin.
  - Set a system proxy and start the app. A Flutter app does not use the system proxy, so route its traffic by iptables or DNS.
  - Look at the traffic to first-party domains with a proxy certificate that the device trusts. Make sure the connection fails.
  - Look for HTTP URLs and cleartext traffic that the framework allows when the platform settings forbid it.
  example: 'reflutter app.apk (test device only); frida -U -f com.example.app -l disable-flutter-tls.js; iptables -t nat -A OUTPUT -p tcp --dport 443 -j DNAT --to <proxy>:8080; grep -rn "badCertificateCallback\|SecurityContext" lib/'
  expected: The app pins first-party domains in the code path that the framework uses. A trusted proxy certificate does not give access to traffic, and cleartext is not allowed.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS L2
