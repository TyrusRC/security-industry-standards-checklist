- id: MOB-AUTH-012
  sheet: MOB
  category: AUTH
  title: Check that critical actions give signed proof of user approval
  objective: Finds critical actions that the user can later deny, or that a tampered app can show differently from what it runs.
  steps:
  - List the critical actions, such as money transfers and legal consent.
  - Check if the app shows a confirmation that is tied to the exact data of the action.
  - Check if the confirmation produces a signature from a hardware-backed, user-authenticated key.
  - Check that the server validates the signature and the key attestation, and keeps the signature as evidence.
  - Change the displayed data in a hooked app and see if the server detects the change.
  example: 'jadx -d src app.apk; grep -rn "setAttestationChallenge\|Signature" src/; frida -U -f <package> -l change-amount.js; burp: Repeater'
  expected: Each critical action carries a hardware-backed signature over the exact approved data. The server checks it and keeps it as evidence.
  severity: Low
  test_type:
  - Manual
  - Code Review
  level: MASVS L2
