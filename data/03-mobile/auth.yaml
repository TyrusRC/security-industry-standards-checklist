- id: MOB-AUTH-009
  sheet: MOB
  category: AUTH
  title: Check that login fields support password managers and one-time code fill
  objective: Finds login screens that block password managers and so push users to weak or reused passwords.
  steps:
  - Open the login screen and try to fill the credentials with the system password manager.
  - Check the autofill hints on Android and the textContentType values on iOS for the credential fields.
  - Check that one-time code fields support code autofill.
  - Check that the app is linked to its website with website association files.
  - Check if the app offers passkeys where the service supports them.
  example: jadx -d src app.apk; grep -rn "autofillHints\|importantForAutofill" src/res/layout; plutil -p Payload/App.app/Info.plist | grep -i associated; grep -r "textContentType" Payload/ (storyboard or code); curl -s https://example.com/.well-known/assetlinks.json
  expected: Credential and code fields accept autofill. The app is linked to its domain and offers passkeys where possible.
  severity: Info
  test_type:
  - Manual
  level: MASVS L1
  refs:
    mobile_top10:
    - M3:2024
    masvs:
    - MASVS-AUTH-1
    - MASVS-AUTH-3
    maswe:
    - MASWE-0019
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    cwe:
    - CWE-287
    - CWE-522
  notes: No MASTG v2 test exists for MASWE-0019. This is a usability and hardening item.
