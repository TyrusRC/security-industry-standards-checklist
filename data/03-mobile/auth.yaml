- id: MOB-AUTH-001
  sheet: MOB
  category: AUTH
  title: Check that biometric authentication is bound to a key or Keychain item
  objective: Finds local authentication that depends only on a success callback that an attacker can bypass with hooking.
  preconditions:
  - A list of the sensitive resources that local authentication protects (tokens, keys, data) is ready.
  - Biometrics are set up on the test device.
  steps:
  - 'Android: Search for BiometricPrompt.authenticate calls and see if they pass a CryptoObject.'
  - 'Android: Search for keys generated with setUserAuthenticationRequired(true) that the protected operation uses.'
  - 'iOS: Search for LAContext.evaluatePolicy and SecAccessControlCreateWithFlags with user presence or biometry flags.'
  - 'iOS: Hook both APIs at run time and use every flow that the biometric check protects.'
  - Hook the callback or evaluatePolicy reply to return success and try to open the protected resource.
  - Find sensitive resources that open after the forced success without a key operation.
  example: 'jadx -d src app.apk; grep -rn "BiometricPrompt\|CryptoObject\|setUserAuthenticationRequired" src/; frida -U -f <package> -l bypass-biometric.js (objection: android ui biometrics_bypass); r2 -qc "aaa; axt sym.imp.SecAccessControlCreateWithFlags" Payload/App.app/App; objection -g <bundle> explore -> ios ui biometrics_bypass; frida-trace -U -f <bundle> -m "-[LAContext evaluatePolicy:localizedReason:reply:]" -i SecAccessControlCreateWithFlags'
  expected: Each sensitive resource is protected by a Keystore key or Keychain item that needs authentication. A forced success callback does not open it.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS L2
  refs:
    mobile_top10:
    - M3:2024
    masvs:
    - MASVS-AUTH-2
