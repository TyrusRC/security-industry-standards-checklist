- id: MOB-AUTH-010
  sheet: MOB
  category: AUTH
  title: Check that sensitive actions need step-up authentication
  objective: Finds high-risk actions that need no fresh authentication, or whose approval can be reused for another action.
  steps:
  - Make a list of the high-risk actions, such as payments, password changes and display of sensitive data.
  - Run each action in a signed-in session and see if the app asks for a new factor.
  - Replay the approval request with changed amount or target and see if the server accepts it.
  - Skip the step-up screen in the client and call the server API directly.
  - See if the approval is tied to the specific transaction.
  example: 'burp: Repeater (change the amount in the approved request and replay it); frida -U -f <package> -l skip-stepup.js; mitmproxy'
  expected: The server demands a fresh factor for each high-risk action and ties the approval to that action. The client alone cannot skip the step.
  severity: Medium
  test_type:
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M3:2024
    masvs:
    - MASVS-AUTH-3
    maswe:
    - MASWE-0023
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    cwe:
    - CWE-306
  see:
  - WEB-SESS-026
  - WEB-SESS-025
  notes: No MASTG v2 test exists for MASWE-0023.
