- id: MOB-AUTH-003
  sheet: MOB
  category: AUTH
  title: Check that biometric keys become invalid when new biometrics are enrolled
  objective: Finds protected keys and Keychain items that a newly enrolled fingerprint or face can unlock.
  preconditions:
  - A list of the sensitive resources that local authentication protects (tokens, keys, data) is ready.
  - Use a test device where you can add a new biometric.
  steps:
  - 'Android: Search KeyGenParameterSpec.Builder for setInvalidatedByBiometricEnrollment and flag the value false.'
  - 'iOS: Search SecAccessControlCreateWithFlags and flag items that do not use kSecAccessControlBiometryCurrentSet.'
  - 'iOS: Hook SecAccessControlCreateWithFlags at run time and list the flags.'
  - Set up the biometric protection in the app, then enroll a new fingerprint or face on the test device.
  - Try to open the protected resource with the new biometric.
  example: jadx -d src app.apk; grep -rn "setInvalidatedByBiometricEnrollment" src/; r2 -qc "aaa; axt sym.imp.SecAccessControlCreateWithFlags" Payload/App.app/App; frida-trace -U -f <bundle> -i SecAccessControlCreateWithFlags (look for biometryCurrentSet)
  expected: The key or item becomes unusable after a new biometric enrollment. The user must authenticate again with the app credentials.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
