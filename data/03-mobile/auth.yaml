- id: MOB-AUTH-004
  sheet: MOB
  category: AUTH
  title: Check that Android biometric prompts need explicit user confirmation
  objective: Finds sensitive actions that a passive biometric, such as face recognition, approves without a user action.
  preconditions:
  - A list of the sensitive resources that local authentication protects (tokens, keys, data) is ready.
  - Android only.
  steps:
  - Search the code for BiometricPrompt.PromptInfo.Builder and setConfirmationRequired.
  - Flag every call that sets the value to false.
  - Check if the call protects a sensitive action such as a payment or data access.
  - Run the action with face recognition and see if it completes without a tap.
  example: jadx -d src app.apk; grep -rn "setConfirmationRequired" src/
  expected: Sensitive actions use setConfirmationRequired(true) or the default value, so the user confirms the action explicitly.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
  refs:
