    maswe:
    - MASWE-0021
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    cwe:
    - CWE-288
    - CWE-287
  notes: MASTG calls this a hardening issue and not a critical vulnerability. Apply it to high-security apps such as finance, government and health.
