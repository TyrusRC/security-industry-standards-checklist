- id: MOB-AUTH-011
  sheet: MOB
  category: AUTH
  title: Check that logout and timeout end the session and clear local data
  objective: Finds sessions that stay valid on the server, or tokens and personal data that stay on the device after logout.
  steps:
  - Sign in and note the access and refresh tokens that the app uses.
  - Log out in the app and replay the old tokens against the API.
  - Copy the app data directory and search for tokens, cached personal data and the user profile.
  - Wait for the inactivity timeout and see if the app asks for a new login.
  - Send the app to the background and bring it back after a sensitive flow. See if it asks for a new login.
  example: 'mitmproxy; curl -H "Authorization: Bearer <old-token>" https://api.example.com/v1/me; objection -g <package> explore -> env; adb pull /data/data/<package>; grep -rniE "token|session" data/; objection: ios keychain dump'
  expected: The server rejects old tokens after logout and timeout. The device holds no tokens or cached personal data of the ended session.
