- id: MOB-AUTH-007
  sheet: MOB
  category: AUTH
  title: Check that the backend enforces authentication for app requests
  objective: Finds backend functions that the app can call without a valid token, which local checks cannot protect.
  steps:
  - Record the requests that the app sends for each protected function with an interception proxy.
  - Replay each request without the token or session cookie.
  - Replay each request with the token of a different user.
  - Hook the local authentication result to success and check what the backend still requires.
  - Search the app for user roles or permissions that it sends to the backend.
  example: 'mitmproxy -s save_flows.py; burp: Repeater (delete the Authorization header, then replay); frida -U -f <package> -l bypass-local-auth.js; curl -i https://api.example.com/v1/me (no token)'
  expected: The backend rejects requests without a valid token. A local bypass gives no access to server data, and the server decides roles and permissions.
  severity: High
  test_type:
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M3:2024
    masvs:
    - MASVS-AUTH-1
    - MASVS-AUTH-2
    maswe:
    - MASWE-0020
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    cwe:
    - CWE-285
    - CWE-287
    - CWE-312
    - CWE-319
    - CWE-326
    - CWE-602
    - CWE-603
    - CWE-863
    - CWE-922
  see:
  - WEB-AUTHN-009
  - WEB-SESS-004
  notes: Server-side authorization tests are in the WEB and API sheets. This test shows that the mobile client cannot replace them.
