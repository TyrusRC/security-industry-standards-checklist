- id: MOB-AUTH-005
  sheet: MOB
  category: AUTH
  title: Check the validity time of Android keys that biometrics unlock
  objective: Finds keys that stay usable for minutes or hours after one biometric authentication.
  preconditions:
  - A list of the sensitive resources that local authentication protects (tokens, keys, data) is ready.
  - Android only.
  steps:
  - Search for setUserAuthenticationParameters and setUserAuthenticationValidityDurationSeconds in key generation code.
  - Note the duration value for each key.
  - Flag every key for a sensitive action that has a duration above zero.
  - Authenticate once, then run the sensitive operation again inside the validity window.
  - See if the operation succeeds without a new authentication.
  example: jadx -d src app.apk; grep -rnE "setUserAuthenticationParameters|setUserAuthenticationValidityDurationSeconds" src/
  expected: Keys for sensitive operations need authentication for every use (duration 0), or the validity is only a few seconds and the team accepts it.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M3:2024
    masvs:
    - MASVS-AUTH-2
    mastg:
    - MASTG-TEST-0330
    maswe:
    - MASWE-0020
    cheatsheet:
