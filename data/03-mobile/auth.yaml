- id: MOB-AUTH-006
  sheet: MOB
  category: AUTH
  title: Check that a custom app PIN or password resists guessing
  objective: Finds app-defined PINs and passwords that the code compares in plain text or that allow unlimited guesses.
  preconditions: *id001
  steps:
  - Find the screens and code where the app asks for its own PIN or password.
  - Search the code for a plain string comparison against a stored or hardcoded value.
  - Enter wrong values many times and see if the app limits or delays the attempts.
  - Restart the app and clear its data between attempts to see if the counter resets.
  - Check that the app binds the secret to key material from the Keystore or Keychain.
  - Check that the app rejects short PINs, such as 4 digits.
  example: 'jadx -d src app.apk; grep -rnE "equals\(.*(pin|passcode)|compareTo" src/; frida-trace -U -f <package> -j "java.lang.String!equals"; objection: android keystore list; ios keychain dump'
  expected: The app has no plain comparison and no hardcoded PIN. It limits wrong guesses and ties the secret to hardware-backed key material.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS L2
  refs:
    mobile_top10:
    - M3:2024
    masvs:
    - MASVS-AUTH-2
    maswe:
    - MASWE-0020
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    cwe:
    - CWE-285
    - CWE-287
    - CWE-312
    - CWE-319
    - CWE-326
