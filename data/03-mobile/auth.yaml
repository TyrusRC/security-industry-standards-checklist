- id: MOB-AUTH-002
  sheet: MOB
  category: AUTH
  title: Check for fallback to device credentials on sensitive actions
  objective: Finds sensitive actions that accept the weaker device PIN, pattern or passcode instead of a biometric.
  preconditions: &id001
  - A list of the sensitive resources that local authentication protects (tokens, keys, data) is ready.
  steps:
  - 'Android: Search for BiometricPrompt, setAllowedAuthenticators and setDeviceCredentialAllowed.'
  - 'Android: Flag the DEVICE_CREDENTIAL constant, alone or combined with a biometric constant.'
  - 'iOS: Search for SecAccessControlCreateWithFlags and flag kSecAccessControlUserPresence and kSecAccessControlDevicePasscode.'
  - 'iOS: Hook SecAccessControlCreateWithFlags at run time and list the flags that the app uses.'
  - Decide for each sensitive resource if a fallback fits the risk level of the app.
  example: jadx -d src app.apk; grep -rnE "DEVICE_CREDENTIAL|setDeviceCredentialAllowed|setAllowedAuthenticators" src/; r2 -qc "aaa; axt sym.imp.SecAccessControlCreateWithFlags" Payload/App.app/App; frida-trace -U -f <bundle> -i SecAccessControlCreateWithFlags
  expected: High-risk actions need biometrics alone, without fallback to the device credential, or the team accepts and documents the risk.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M3:2024
    masvs:
    - MASVS-AUTH-2
    mastg:
    - MASTG-TEST-0326
