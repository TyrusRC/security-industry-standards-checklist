- id: MOB-AUTH-008
  sheet: MOB
  category: AUTH
  title: Check that the app uses system flows for OAuth and third-party login
  objective: Finds logins in embedded WebViews, OAuth without PKCE and tokens that the app accepts without checks.
  steps:
  - Find all login flows that use OAuth, OpenID Connect or a third-party identity provider.
  - Check if the app opens the login page in the system browser, a custom tab or ASWebAuthenticationSession.
  - Flag logins that load the identity provider in an embedded WebView.
  - Capture the authorization request and see if it carries a state value and a PKCE code challenge.
  - Open the app deep links with a changed authorization response and see if the app accepts it.
  - Check that the app validates the token signature, issuer, audience and expiry, or that the backend does.
  example: 'mitmproxy; burp: look for code_challenge, state, redirect_uri; adb shell am start -a android.intent.action.VIEW -d "app://callback?code=attacker" <package>; xcrun simctl openurl booted "app://callback?code=attacker"; grep -rn "ASWebAuthenticationSession\|CustomTabsIntent\|WebView" src/'
  expected: The app signs in users with system browser flows and PKCE. It rejects forged or replayed responses and accepts only validated tokens.
  severity: High
  test_type:
  - Manual
  level: MASVS L1
  refs:
    mobile_top10:
    - M3:2024
    masvs:
    - MASVS-AUTH-1
    maswe:
    - MASWE-0018
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    cwe:
    - CWE-306
    - CWE-749
    - CWE-862
    - CWE-863
    - CWE-923
    - CWE-926
    - CWE-939
    - CWE-940
  see:
  - WEB-OAUTH-003
  - WEB-OAUTH-011
  - WEB-OAUTH-015
  notes: MASWE-0018 also lists exported components and IPC checks. Those modes belong to the PLATFORM slice and are not tested here. This test covers only the authentication modes of MASWE-0018.
