- id: MOB-STORAGE-003
  sheet: MOB
  category: STORAGE
  title: Check the data protection class of iOS files with sensitive data
  objective: Finds files with sensitive data that have the data protection class NSFileProtectionNone.
  preconditions:
  - A list of the sensitive data the app handles is ready (tokens, passwords, personal data, keys). The app is installed on a test device or emulator.
  steps:
  - Start the test from a clean install and use every workflow of the app with sensitive data.
  - List the files in the app sandbox with their data protection classes.
  - List the files in the App Group shared containers that the app and its extensions use, with their classes.
  - Mark the files that hold sensitive data.
  - Find the marked files that have the class NSFileProtectionNone.
  example: objection -g <bundle> explore -> env (shows the data and App Group paths); cd <path>; ls (the NSFileProtection column shows the class of each file); look for NSFileProtectionNone
  expected: Files with sensitive data use a protection class that locks them when the device is locked. No such file has the class NSFileProtectionNone.
  severity: Medium
  test_type:
  - Manual
  level: MASVS L2
