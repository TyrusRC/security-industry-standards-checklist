- id: MOB-STORAGE-005
  sheet: MOB
  category: STORAGE
  title: Check that sensitive data is not written to shared storage
  objective: Finds sensitive data that the app writes unencrypted to Android external storage or to iOS folders that the user can reach.
  preconditions:
  - A list of the sensitive data the app handles is ready (tokens, passwords, personal data, keys). The app is installed on a test device or emulator.
  steps:
  - 'Android: List the files in external storage before and after you use the app.'
  - 'Android: Hook the external storage APIs and FileOutputStream with Frida and use every workflow of the app.'
  - 'Android: Reverse engineer the app and look for these APIs and for the WRITE_EXTERNAL_STORAGE and MANAGE_EXTERNAL_STORAGE permissions.'
  - 'iOS: Read Info.plist and look at UIFileSharingEnabled and LSSupportsOpeningDocumentsInPlace.'
  - 'iOS: Search the binary for writes to the Documents directory and look at the data that the code writes.'
  - Look at each new file or code location to see if it holds sensitive data without encryption.
  example: adb shell ls -R /sdcard/Android/data/<package> /sdcard/Download > before.txt (repeat after use, then diff); frida-trace -U -f <package> -j "android.os.Environment!getExternalStorageDirectory" -j "android.content.Context!getExternalFilesDir"; apktool d app.apk; grep -R "getExternalStorage\|MediaStore" smali*/; aapt d permissions app.apk; plutil -p Payload/App.app/Info.plist | grep -E "UIFileSharing|LSSupportsOpening"
  expected: The app writes no sensitive data unencrypted to shared storage. The iOS app does not expose a Documents folder that holds sensitive data.
  severity: Medium
  test_type:
  - Manual
  - Automated
  level: MASVS L1
