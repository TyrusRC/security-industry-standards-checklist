- id: MOB-STORAGE-008
  sheet: MOB
  category: STORAGE
  title: Check that iOS text fields with sensitive input disable keyboard caching
  objective: Finds iOS input fields that let the keyboard cache or suggest sensitive text.
  preconditions:
  - A list of the sensitive data the app handles is ready (tokens, passwords, personal data, keys). The app is installed on a test device or emulator.
  steps:
  - Search the binary for UITextField, UITextView and UISearchBar and the input trait settings.
  - Look at isSecureTextEntry, autocorrectionType and spellCheckingType at each location, and in storyboards.
  - Hook the text field classes with Frida and use every input screen with sensitive data.
  - Note the trait values and the entered value of each field.
  - Find the fields with sensitive data where isSecureTextEntry is off or autocorrection or spell checking is on or default.
  example: r2 -qc "aaa; iz~autocorrectionType" Payload/App.app/App; plutil -p Payload/App.app/Base.lproj/*.storyboardc/*.nib; frida-trace -U -f <bundle> -m "-[UITextField setSecureTextEntry:]" -m "-[UITextField setAutocorrectionType:]" -m "-[UITextField setSpellCheckingType:]"
  expected: Each field for sensitive input has isSecureTextEntry on, or autocorrection and spell checking off. The keyboard does not cache the entered text.
  severity: Low
  test_type:
  - Manual
  - Code Review
  level: MASVS L2
  refs:
    mobile_top10:
    - M9:2024
    masvs:
    - MASVS-STORAGE-2
    mastg:
    - MASTG-TEST-0313
    - MASTG-TEST-0314
