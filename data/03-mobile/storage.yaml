- id: MOB-STORAGE-009
  sheet: MOB
  category: STORAGE
  title: Check that the app package holds no hardcoded secrets
  objective: Finds API keys, passwords, tokens and private keys that ship inside the APK or IPA.
  steps:
  - Unpack the APK or IPA and decompile the code.
  - Search code, resources, plists, JSON files, native libraries and bundled frameworks for secrets.
  - Run a secret scanner over the unpacked package.
  - Look at each hit to see if it is a live API key, credential or private key.
  - Check the scope and the permissions of each secret that you find.
  - Make sure the app gets static secrets from a backend at run time or uses scoped tokens that expire.
  example: apktool d app.apk -o out; jadx -d src app.apk; unzip app.ipa -d ipa; strings -n 8 ipa/Payload/App.app/App | grep -iE "api[_-]?key|secret|passw|BEGIN (RSA|EC|PRIVATE)"; grep -riE "api[_-]?key|secret|token" out/res src/; gitleaks detect --no-git -s out; trufflehog filesystem out ipa
  expected: The package holds no live secrets, credentials or private keys. Unavoidable static keys have the least permissions and can be rotated.
  severity: High
  test_type:
  - Automated
  - Code Review
  level: MASVS L1
