- id: MOB-STORAGE-001
  sheet: MOB
  category: STORAGE
  title: Check that Android private storage holds no plaintext sensitive data
  objective: Finds sensitive data that the app writes unencrypted to its Android private data directory or to SharedPreferences.
  preconditions:
  - A list of the sensitive data the app handles is ready (tokens, passwords, personal data, keys). The app is installed on a test device or emulator.
  - Run only on test devices. Use test accounts.
  steps:
  - Install the app and make a first copy of its private data directory.
  - Hook the SharedPreferences write methods and the Cipher classes with Frida.
  - Use every workflow of the app and enter sensitive data wherever possible.
  - Make a second copy of the private data directory and find the files that are new or changed.
  - Search the new files and the hook output for the sensitive values.
  - Decode base64, hex, URL-encoded and compressed content, because these methods hide data but do not protect it.
  - Look at the hook trace to see if each write of a sensitive value follows a Cipher operation.
  example: adb install app.apk; objection -g <package> explore -> env (shows data paths); adb shell run-as <package> tar cf - . > data1.tar (debuggable builds) or adb pull /data/data/<package>; diff -r data1 data2; grep -rniE "token|passw|secret" data2/shared_prefs data2/databases; frida-trace -U -f <package> -j "android.content.SharedPreferences$Editor!putString" -j "javax.crypto.Cipher!*"; trufflehog filesystem data2/
  expected: The app stores no sensitive data in plaintext or in trivially encoded form. Sensitive values are encrypted with keys that the Android Keystore protects.
  severity: High
  test_type:
  - Manual
  - Automated
  level: MASVS L2
  refs:
