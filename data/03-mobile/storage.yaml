- id: MOB-STORAGE-007
  sheet: MOB
  category: STORAGE
  title: Check that sensitive files are excluded from backups
  objective: Finds sensitive data that the system copies to a cloud backup, a device transfer or a local backup.
  preconditions:
  - A list of the sensitive data the app handles is ready (tokens, passwords, personal data, keys). The app is installed on a test device or emulator.
  - 'Android: A rooted or debuggable test device is needed for the backup step.'
  steps:
  - 'Android: Read AndroidManifest.xml and note the values of allowBackup, fullBackupContent and dataExtractionRules.'
  - 'Android: Read backup_rules.xml or data_extraction_rules.xml and see if all sensitive files are excluded.'
  - 'Android: Use the app with sensitive data, then back up and restore its data with the backup daemon.'
  - 'Android: Reinstall the app, restore the data and list the restored files.'
  - 'iOS: Search the binary for isExcludedFromBackup and list the files that the code marks.'
  - 'iOS: Hook the file APIs and list the files that the app creates outside tmp and Library/Caches.'
  - Find the sensitive files in these lists.
  example: apktool d -s -f app.apk; grep -E "allowBackup|fullBackupContent|dataExtractionRules" AndroidManifest.xml; cat res/xml/data_extraction_rules.xml; adb root; adb shell bmgr backupnow <package>; adb pull /data/data/com.android.localtransport/files/1/_full/<package> app.ab; tar xvf app.ab; r2 -qc "aaa; iz~isExcludedFromBackup" Payload/App.app/App; frida-trace -U -f <bundle> -m "-[NSFileManager createFileAtPath:*]"
  expected: Sensitive files are not in the backup or the restored set. iOS files that need exclusion are also encrypted, because isExcludedFromBackup gives no guarantee.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  level: MASVS L1
