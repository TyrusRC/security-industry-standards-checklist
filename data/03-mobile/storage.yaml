- id: MOB-STORAGE-002
  sheet: MOB
  category: STORAGE
  title: Check that iOS private storage and Keychain hold no plaintext secrets
  objective: Finds sensitive data that the app writes unencrypted to the iOS sandbox, UserDefaults or the Keychain with weak settings.
  preconditions:
  - A list of the sensitive data the app handles is ready (tokens, passwords, personal data, keys). The app is installed on a test device or emulator.
  - A jailbroken device or a simulator gives access to the sandbox. Use test accounts.
  steps:
  - Extract the app binaries from the IPA and search them for file, UserDefaults, Core Data, SQLite and Keychain APIs.
  - List the Keychain calls with their access control and accessibility attributes.
  - Install the app, list the files in the sandbox and take a first snapshot of the Keychain.
  - Hook the file and Keychain APIs with Frida and use every workflow of the app with sensitive data.
  - List the files and the Keychain again and compare both snapshots.
  - Search new and changed files for sensitive values in plaintext, base64, hex and binary plist forms.
  - Make sure each secret is in the Keychain or encrypted with a Keychain key before the app writes it.
  example: unzip app.ipa; r2 -qc "aaa; afl~SecItem" Payload/App.app/App; objection -g <bundle> explore -> env; ios keychain dump; ios plist cat Library/Preferences/<bundle>.plist; frida-trace -U -f <bundle> -m "-[NSUserDefaults setObject:forKey:]" -m "-[NSFileManager createFileAtPath:*]" -i SecItemAdd -i SecItemUpdate; diff -r sandbox1 sandbox2
  expected: The app stores no sensitive data in plaintext in the sandbox. Secrets are in the Keychain or encrypted with keys from the Keychain.
  severity: High
  test_type:
  - Manual
  - Automated
  level: MASVS L2
