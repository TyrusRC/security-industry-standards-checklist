- id: MOB-STORAGE-004
  sheet: MOB
  category: STORAGE
  title: Check that iOS App Group containers hold no unprotected secrets
  objective: Finds secrets in shared UserDefaults or shared files that the app and all its extensions can read.
  preconditions:
  - A list of the sensitive data the app handles is ready (tokens, passwords, personal data, keys). The app is installed on a test device or emulator.
  steps:
  - Extract the main binary and every extension binary in PlugIns/*.appex.
  - Search them for UserDefaults(suiteName:), containerURL(forSecurityApplicationGroupIdentifier:) and shared Core Data stores.
  - Look at the code at each location and find the values that the app writes to the shared container.
  - Mark the values that are credentials, tokens or keys.
  - Make sure the app keeps each secret in a shared Keychain and does not write it to the container.
  - Look at the entitlements for keychain-access-groups and the protection class of the shared files.
  example: unzip app.ipa; find Payload -name "*.appex"; r2 -qc "aaa; iz~suiteName" Payload/App.app/PlugIns/X.appex/X; codesign -d --entitlements :- Payload/App.app; grep -a "group\." on the entitlements output
  expected: The shared container holds no secrets in plaintext. Secrets are in a shared Keychain or are encrypted and protected with a strong protection class.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
