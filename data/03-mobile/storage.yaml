- id: MOB-STORAGE-006
  sheet: MOB
  category: STORAGE
  title: Check that the app does not write sensitive data to logs
  objective: Finds sensitive data in Android logcat output or in iOS device logs.
  preconditions:
  - A list of the sensitive data the app handles is ready (tokens, passwords, personal data, keys). The app is installed on a test device or emulator.
  steps:
  - Reverse engineer the app and list the uses of logging APIs.
  - 'Android: Look for Log, Logger, System.out.print, System.err.print and printStackTrace.'
  - 'iOS: Look for NSLog, NSAssert, NSCAssert, print and printf in the binary.'
  - Monitor the device log while you use every workflow of the app with sensitive data.
  - Close the app and search the log for the sensitive values.
  - Look at the code of each match to find which log call writes the data.
  example: adb logcat --pid=$(adb shell pidof -s <package>) > app.log; grep -iE "token|passw|secret|card" app.log; frida-trace -U -f <package> -j "android.util.Log!*"; apktool d app.apk; grep -R "Landroid/util/Log;" smali*/; xcrun simctl spawn booted log stream --style compact --predicate 'process CONTAINS[c] "App"'; frida-trace -U -f <bundle> -i NSLog
  expected: Logs contain no passwords, tokens, personal data or other sensitive values. Release builds remove or disable such log calls.
  severity: Low
  test_type:
  - Manual
  - Automated
  level: MASVS L1
  refs:
