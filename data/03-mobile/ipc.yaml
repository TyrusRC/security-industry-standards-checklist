- id: MOB-IPC-012
  sheet: MOB
  category: IPC
  title: Check the app for unsafe object deserialization of untrusted data
  objective: Finds deserialization of data from other apps or the network that can lead to code execution.
  preconditions:
  - Decompiled app code or extracted IPA.
  steps:
  - 'Android: Search for ObjectInputStream, Serializable and Parcelable reads in Intent extras, Bundles, files and network data.'
  - 'iOS: Search the binary for decodeObject(forKey:), unarchiveObject(with:) and unarchiveTopLevelObjectWithData.'
  - 'iOS: Check that NSKeyedUnarchiver uses secure coding and a list of allowed classes.'
  - Follow the data back to its source. Find sources that other apps or attackers control.
  - Make sure the app uses a data-only format such as JSON, or checks a signature, before it deserializes.
  example: jadx -d out app.apk ; grep -rn "ObjectInputStream\|readSerializable\|getSerializableExtra" out/ ; r2 -A <app_binary> ; afl~unarchive
  expected: The app does not deserialize native objects from untrusted sources. If it must, it restricts the classes and checks integrity first.
  severity: High
  test_type:
  - Code Review
  level: MASVS L1
  refs:
