- id: MOB-IPC-008
  sheet: MOB
  category: IPC
  title: Check input validation in deep link and URL scheme handlers
  objective: Finds deep link handlers that use attacker-controlled parameters without checks.
  preconditions:
  - Know the schemes and hosts from the manifest and Info.plist.
  steps:
  - 'Android: Find the code for each intent-filter that has a VIEW action and a custom scheme or http scheme.'
  - 'iOS: Find the code for each custom URL scheme and each Universal Link handler in the binary.'
  - Read how the handler converts, limits and sanitizes each path and query parameter.
  - Look for raw strings used for amounts, file paths, SQL queries, WebView URLs or navigation.
  - Open the deep link on the device with a negative number, a path traversal value and a script value.
  - Make sure the handler rejects each value and keeps the app stable.
  example: adb shell am start -W -a android.intent.action.VIEW -d "myapp://open?path=../../data/x" ; adb shell am start -W -a android.intent.action.VIEW -d "myapp://transfer?amount=-1" ; xcrun devicectl device process launch --device <UDID> --payload-url 'mastgtest://open?path=../../x' <bundle_id> ; xcrun simctl openurl booted "https://example.com/open?path=../../x"
  expected: Handlers convert each parameter to its expected type, check ranges and allowlists, and sanitize special characters before the value reaches a sink.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
