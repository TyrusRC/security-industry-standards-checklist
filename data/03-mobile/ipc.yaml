- id: MOB-IPC-013
  sheet: MOB
  category: IPC
  title: Check SQL queries built from content provider URIs for injection
  objective: Finds content providers that put URI or selection input into SQL text.
  preconditions:
  - Exported or reachable content provider.
  steps:
  - 'Android: Find every ContentProvider class in the decompiled code.'
  - 'Android: Look at the query, update and delete methods for uses of Uri.getPathSegments and appendWhere.'
  - 'Android: Find SQL text that joins strings from the URI or the selection argument.'
  - 'Android: Send a quote character or an OR clause through the URI from the shell.'
  - 'Android: Make sure the provider uses selection arguments or a query builder with bound parameters.'
  example: adb shell content query --uri content://<authority>/students/1%20OR%201=1 ; adb shell content query --uri content://<authority>/students --where "name='a' OR '1'='1" ; grep -rn "appendWhere\|getPathSegments\|rawQuery" out/
  expected: The provider binds all input from URIs and selection arguments as parameters. No input becomes part of the SQL text.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
