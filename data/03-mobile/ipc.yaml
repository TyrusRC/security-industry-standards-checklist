- id: MOB-IPC-005
  sheet: MOB
  category: IPC
  title: Check implicit intents used for internal communication and sensitive extras
  objective: Finds implicit intents that another app can intercept to read data or take over a flow.
  preconditions:
  - Decompiled app code.
  steps:
  - 'Android: Find all places where the app builds an Intent and sends it with startActivity, startService, bindService or sendBroadcast.'
  - 'Android: Mark the intents that have no setPackage, setClass, setClassName or setComponent call.'
  - 'Android: Check if the intent is for an internal component and not a user-selected app or chooser.'
  - 'Android: Look for putExtra calls with tokens, session IDs, one-time codes or personal data.'
  - 'Android: Make sure another app cannot register an intent-filter that matches the action, data and categories.'
  - 'Android: Make sure each broadcast with sensitive data requires a receiver permission.'
  example: jadx -d out app.apk ; grep -rn "new Intent(\"\|setAction(\|putExtra(\|sendBroadcast(" out/ ; semgrep --config <rules> out/
  expected: Intents for internal communication name an explicit component or package. Intents that carry sensitive extras go only to a known recipient.
  severity: Medium
  test_type:
  - Code Review
  level: MASVS L1
