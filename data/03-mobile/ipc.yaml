- id: MOB-IPC-007
  sheet: MOB
  category: IPC
  title: Check deep links for App Links or Universal Links verification
  objective: Finds deep links that another app can claim and use to capture tokens or links.
  preconditions:
  - Decoded APK and IPA.
  steps:
  - 'Android: List the intent-filters with http or https data and the VIEW and BROWSABLE entries in the AndroidManifest.xml.'
  - 'Android: Find filters that miss android:autoVerify="true".'
  - 'Android: Check on the device that each declared domain has the verified state.'
  - 'Android: Look for custom URL schemes used for login, reset or payment flows.'
  - 'iOS: Read the Associated Domains entitlement of the app binary.'
  - 'iOS: Fetch the apple-app-site-association file of each domain and compare its paths with the app.'
  - Make sure no deep link carries a long-lived token or other secret.
  example: adb shell pm get-app-links <pkg> ; python3 deeplink_analyser.py -op verify-applinks -apk app.apk ; rabin2 -OC app_binary | grep -A3 associated-domains ; curl https://<domain>/.well-known/apple-app-site-association
  expected: Sensitive flows use only verified Android App Links and iOS Universal Links. Custom URL schemes do not start sensitive actions, and links carry no long-lived secrets.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  level: MASVS L1
  refs:
    mobile_top10:
    - M4:2024
    masvs:
    - MASVS-PLATFORM-1
