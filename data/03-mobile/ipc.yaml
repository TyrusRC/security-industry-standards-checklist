- id: MOB-IPC-010
  sheet: MOB
  category: IPC
  title: Check the use of the general pasteboard and the clipboard
  objective: Finds sensitive data on the system clipboard that other apps or devices can read.
  preconditions:
  - Jailbroken iOS device with Frida, or an instrumented build.
  steps:
  - 'iOS: Search the binary for UIPasteboard.general and the calls addItems, setItems, string and items.'
  - 'iOS: Run the app. Copy a password or personal data. Monitor the general pasteboard with Frida.'
  - 'iOS: Make sure setItems uses the localOnly and expirationDate options for sensitive data.'
  - 'iOS: Check that the app clears the pasteboard with items = [] when it goes to the background or ends.'
  - 'Android: Search the code for ClipboardManager.setPrimaryClip and ClipDescription.EXTRA_IS_SENSITIVE.'
  - 'Android: Make sure sensitive fields cannot be copied, or that copied values have the sensitive flag and a short life.'
  - Treat pasted clipboard data as untrusted input.
  example: r2 -A <app_binary> ; afl~UIPasteboard ; frida -U -n <app> -l monitor_pasteboard.js (poll UIPasteboard.generalPasteboard().changeCount()) ; grep -rn "setPrimaryClip\|EXTRA_IS_SENSITIVE" out/
  expected: The app does not put secrets on the clipboard. If it must, the data is local only, expires soon, is marked sensitive and is cleared.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
