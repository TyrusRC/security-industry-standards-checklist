- id: MOB-IPC-002
  sheet: MOB
  category: IPC
  title: Check exported content providers for missing permissions and data leaks
  objective: Finds content providers that give other apps read or write access to private app data.
  preconditions:
  - Android device with the app installed and test data entered.
  steps:
  - 'Android: Read the AndroidManifest.xml. List each provider with android:exported, readPermission and writePermission.'
  - 'Android: Find exported providers that have no android:permission, readPermission or writePermission.'
  - 'Android: Look at the protection level of each declared permission. Normal and dangerous levels do not limit access.'
  - 'Android: Use the app until the database holds sensitive test data.'
  - 'Android: Query each exported provider from the shell without any permission.'
  - 'Android: Look at the rows that come back for sensitive data.'
  example: adb shell content query --uri content://<authority>/<path> ; adb shell content query --uri content://<authority>/<path> --where "name='Bob'" ; xmlstarlet sel -t -m "//provider" -v "@android:name" -o " exported=" -v "@android:exported" -n AndroidManifest.xml
  expected: No exported content provider returns or changes sensitive data for a caller without a signature-level permission. Providers for internal use are not exported.
  severity: High
  test_type:
  - Config Review
  - Manual
  level: MASVS L1
