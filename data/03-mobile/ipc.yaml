- id: MOB-IPC-001
  sheet: MOB
  category: IPC
  title: Check exported Android components for missing permissions
  objective: Finds activities, services and receivers that other apps can start or call without permission.
  preconditions:
  - Android device or emulator with the app installed.
  - A second test app or the shell as an untrusted caller.
  steps:
  - 'Android: Decode the APK and read the AndroidManifest.xml.'
  - 'Android: List every activity, service and receiver with android:exported and android:permission.'
  - 'Android: Find components that are exported without a permission or with a normal protection level.'
  - 'Android: Read the code of each exported component for sensitive data or actions.'
  - 'Android: Start each exported component from the shell. Send a crafted intent to each receiver.'
  - 'Android: Make sure each service checks the caller permission at runtime before it acts.'
  example: 'apktool d app.apk -o out ; aapt2 d xmltree app.apk --file AndroidManifest.xml | grep -A20 -E "E: (activity|service|receiver)" ; adb shell am start -n <pkg>/<exported.Activity> ; adb shell am startservice -n <pkg>/<exported.Service> ; adb shell am broadcast -a <action> -n <pkg>/<exported.Receiver> --es key value'
  expected: The app exports only components that must be public. Each exported component that handles sensitive data needs a signature-level permission, and no unauthenticated caller can reach it.
  severity: Medium
  test_type:
  - Config Review
  - Code Review
  - Manual
  level: MASVS L1
  refs:
    mobile_top10:
    - M8:2024
    masvs:
    - MASVS-PLATFORM-1
