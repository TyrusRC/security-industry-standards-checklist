- id: MOB-IPC-003
  sheet: MOB
  category: IPC
  title: Check FileProvider paths for access outside the shared directory
  objective: Finds FileProvider path settings that let other apps open private files through content URIs.
  preconditions:
  - Decompiled app code.
  steps:
  - 'Android: Decode the APK. Find each exported FileProvider in the AndroidManifest.xml.'
  - 'Android: Open the file paths XML resource that the provider uses.'
  - 'Android: Look for root-path entries and for path values of "/", "." or an empty string.'
  - 'Android: Find calls to FileProvider.getUriForFile in the code.'
  - 'Android: Make sure no attacker-controlled input, such as a URI query value, reaches the file argument.'
  - 'Android: Make sure the provider requires a permission with a dangerous or signature protection level.'
  example: jadx -d out app.apk ; grep -rn "getUriForFile\|root-path" out/ ; cat out/resources/res/xml/file_paths.xml
  expected: The FileProvider shares only the intended directory. Path settings do not expose root or private storage, and attacker-controlled input never selects the file.
  severity: High
  test_type:
  - Config Review
  - Code Review
  level: MASVS L1
