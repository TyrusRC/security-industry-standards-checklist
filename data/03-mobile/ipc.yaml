- id: MOB-IPC-009
  sheet: MOB
  category: IPC
  title: Check source validation in iOS custom URL scheme handlers
  objective: Finds URL scheme handlers that act on sensitive requests without checking the calling app.
  preconditions:
  - Extracted IPA binary.
  steps:
  - 'iOS: Find the scene(_:openURLContexts:) method in the app binary.'
  - 'iOS: Look for reads of UIOpenURLContext.options.sourceApplication.'
  - 'iOS: Check if the handler compares the source with an allowlist before it acts.'
  - 'iOS: Find out if the scheme starts a privileged or irreversible action.'
  - 'Android: Note that Android gives no caller identity for scheme intents. Check that the handler needs a separate user approval or token for sensitive actions.'
  example: r2 -A <app_binary> ; afl~openURLContexts ; izz~sourceApplication
  expected: Handlers that start security-sensitive actions read the source application and check it against an allowlist. Sensitive actions also need another check, as the source is often nil.
  severity: Low
  test_type:
  - Code Review
  level: MASVS L1
