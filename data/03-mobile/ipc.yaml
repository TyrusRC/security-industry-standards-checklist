- id: MOB-IPC-011
  sheet: MOB
  category: IPC
  title: Check that the app restricts custom keyboards for sensitive input
  objective: Finds apps that let third-party keyboards read passwords and other secrets.
  preconditions:
  - Extracted IPA.
  steps:
  - 'iOS: Look for application:shouldAllowExtensionPointIdentifier: in the app delegate of the binary.'
  - 'iOS: Check that the method returns false for UIApplicationKeyboardExtensionPointIdentifier.'
  - 'iOS: Check that password, PIN and OTP fields use isSecureTextEntry, so that they use the system keyboard.'
  - 'iOS: Open the Info.plist of each bundled keyboard extension. Look at RequestsOpenAccess.'
  - 'iOS: Find keyboard code that sends typed text off the device or writes it to a shared container.'
  - 'Android: Note that this control has no MASTG test for Android. Check that sensitive fields use a non-caching text input type.'
  example: unzip app.ipa ; plutil -p Payload/App.app/PlugIns/*.appex/Info.plist | grep -i RequestsOpenAccess ; r2 -A <app_binary> ; afl~shouldAllowExtensionPointIdentifier
  expected: The app rejects custom keyboards app-wide when it handles sensitive input. A bundled keyboard asks for Full Access only with a feature that needs it.
  severity: Medium
  test_type:
  - Code Review
  - Config Review
  level: MASVS L1
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PLATFORM-1
    - MASVS-PRIVACY-1
    mastg:
