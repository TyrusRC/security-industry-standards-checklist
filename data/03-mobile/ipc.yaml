- id: MOB-IPC-004
  sheet: MOB
  category: IPC
  title: Check PendingIntent objects for mutable flags and implicit base intents
  objective: Finds PendingIntent objects that other apps can change or redirect.
  preconditions:
  - Decompiled app code.
  steps:
  - 'Android: Search the decompiled code for PendingIntent.getActivity, getActivities, getService, getForegroundService and getBroadcast.'
  - 'Android: Read the flags argument of each call for FLAG_IMMUTABLE or FLAG_MUTABLE.'
  - 'Android: Read the minSdkVersion in the AndroidManifest.xml.'
  - 'Android: Check if the base intent names its target with setClass, setClassName or setComponent.'
  - 'Android: Find a valid use case for each mutable PendingIntent, such as an inline reply.'
  example: jadx -d out app.apk ; grep -rn "PendingIntent\.\(getActivity\|getActivities\|getService\|getForegroundService\|getBroadcast\)" out/ ; grep -rn "FLAG_MUTABLE\|FLAG_IMMUTABLE" out/
  expected: Each PendingIntent uses FLAG_IMMUTABLE unless mutability is required and documented. Each base intent is explicit and names its target component.
  severity: Medium
  test_type:
  - Code Review
  level: MASVS L1
  refs:
    mobile_top10:
    - M8:2024
    masvs:
