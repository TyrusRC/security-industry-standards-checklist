- id: MOB-IPC-006
  sheet: MOB
  category: IPC
  title: Check validation of data that other apps return to the app
  objective: Finds flows where data from an external intent result reaches a sensitive operation without checks.
  preconditions:
  - Android device with Frida server.
  - A test app that returns crafted results.
  steps:
  - 'Android: Install the app and attach a Frida hook to startActivityForResult, ActivityResultLauncher and onActivityResult.'
  - 'Android: Use the app to start each flow that asks another app for a file, a document or an account.'
  - 'Android: Install a test app that answers with a crafted URI scheme or a file name with path separators.'
  - 'Android: Record the reads of Intent.getData, ClipData, extras and ContentResolver calls.'
  - 'Android: Look at the backtraces. Find returned data that reaches file, parse, storage, network or authorization code.'
  - 'Android: Make sure the app checks the data before each use.'
  example: frida -U -f <pkg> -l hook_intent_results.js ; objection -g <pkg> explore, then android hooking watch class_method android.app.Activity.onActivityResult --dump-args --dump-backtrace
  expected: The app treats data returned from other apps as untrusted. It checks scheme, path, name and type before it uses the data.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS L1
