- id: MOB-RESIL-010
  sheet: MOB
  category: RESIL
  title: Check detection of malware and risky apps on the device
  objective: Finds apps that handle high-risk flows without any check for a hostile environment.
  preconditions:
  - Test app with accessibility rights.
  steps:
  - Find uses of platform threat signals, such as Play Protect status or Play Integrity verdicts.
  - Check if the app considers apps with accessibility or overlay rights in risk decisions.
  - Install a test app with accessibility rights. Start a sensitive flow.
  - Check if the app warns the user, asks for more checks or restricts the flow.
  - Check if the backend restricts the account and not only the local client.
  example: adb shell settings get secure enabled_accessibility_services ; adb shell dumpsys window | grep -i overlay
  expected: For high-risk flows, the app uses threat signals and reacts in proportion. Restrictions apply to the account and not only to the device.
  severity: Info
  test_type:
  - Manual
  level: MASVS R
  refs:
    mobile_top10:
    - M7:2024
    masvs:
    - MASVS-RESILIENCE-2
    maswe:
    - MASWE-0055
    cwe:
    - CWE-693
