- id: MOB-RESIL-003
  sheet: MOB
  category: RESIL
  title: Check detection of app cloning and virtual app environments
  objective: Finds apps that run inside a virtual container where another app can read and change them.
  preconditions:
  - A virtualization or dual-app tool on the test device.
  steps:
  - 'Android: Run the app inside a known app-virtualization or dual-app tool.'
  - 'Android: Look at the process path, data folder and package structure that the app reads at runtime.'
  - Check if the app compares these values with the expected ones.
  - Check if the app restricts sensitive functions, informs the backend or ends when it finds a container.
  example: adb shell pm list packages | grep <container> ; adb shell ps -A | grep <pkg> ; frida -U -f <pkg> -l hook_process_path.js
  expected: The app finds that it runs in a virtual container, and it limits sensitive functions or informs the backend.
  severity: Info
  test_type:
  - Manual
  level: MASVS R
  refs:
    mobile_top10:
    - M7:2024
    masvs:
    - MASVS-RESILIENCE-1
    maswe:
    - MASWE-0052
    cwe:
    - CWE-693
