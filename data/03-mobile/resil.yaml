- id: MOB-RESIL-014
  sheet: MOB
  category: RESIL
  title: Check release builds for debug logging and StrictMode
  objective: Finds logs that show implementation details to attackers.
  preconditions:
  - Release build of the app.
  steps:
  - 'Android: Search the code for StrictMode setVmPolicy and setThreadPolicy.'
  - 'Android: Run the release build and read the logcat output for StrictMode messages.'
  - 'iOS: Search the binary for NSLog, print, dump, debugPrint and os_log calls and their strings.'
  - Run the release build and trigger errors, such as network failures and invalid input.
  - Read the device logs for stack traces, endpoints, internal paths and verbose messages.
  example: adb logcat | grep -i StrictMode ; adb logcat --pid=$(adb shell pidof <pkg>) ; xcrun simctl spawn booted log stream --style compact --level debug --predicate 'process CONTAINS[c] "App"'
  expected: Release builds do not use StrictMode. Logs show no implementation details, debug messages or detailed errors.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS R
