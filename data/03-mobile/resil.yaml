- id: MOB-RESIL-008
  sheet: MOB
  category: RESIL
  title: Check integrity checks on data that the app stores locally
  objective: Finds apps that trust local data for security decisions without an integrity check.
  preconditions:
  - Rooted or jailbroken test device.
  steps:
  - Find data in SharedPreferences, UserDefaults, files and databases that drives a security decision.
  - Examples are login state, feature access, limits and server settings.
  - Search the code for HMAC, Signature and digest APIs around the reads of that data.
  - Change the stored value on a rooted or jailbroken device. Start the app.
  - Check that the app finds the change and reacts.
  example: grep -rn "javax.crypto.Mac\|SharedPreferences" out/ ; r2 -A <app_binary> ; afl~CCHmac ; adb shell run-as <pkg> cat shared_prefs/<file>.xml
  expected: The app signs or authenticates data that drives a security decision, checks it on each read and reacts to a change.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS R
  refs:
    mobile_top10:
    - M7:2024
    masvs:
    - MASVS-RESILIENCE-2
