- id: MOB-RESIL-009
  sheet: MOB
  category: RESIL
  title: Check detection of hooking tools and code changes at runtime
  objective: Finds apps that let attackers hook sensitive APIs and read secrets without any reaction.
  preconditions:
  - Test device with Frida server.
  steps:
  - Install the app and attach Frida to it.
  - Hook sensitive APIs, such as AccountManager, KeyStore, SecItemCopyMatching and SecKey functions.
  - Record whether the hook runs and returns data, or whether the app ends or blocks it.
  - Look in the code for checks of loaded libraries, named pipes, ports and function prologues.
  - Check that the app reacts, for example by ending the session or warning the backend.
  example: frida -U -f <pkg> -l hook_keystore_getkey.js ; frida -U -f <bundle_id> -l hook_secitemcopymatching.js ; objection -g <pkg> explore
  expected: The hook fails or the app reacts. The app detects hooking tools and changed code with several checks.
  severity: Low
  test_type:
  - Manual
  level: MASVS R
  refs:
    mobile_top10:
    - M7:2024
    masvs:
    - MASVS-RESILIENCE-2
    - MASVS-RESILIENCE-4
