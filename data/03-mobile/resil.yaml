- id: MOB-RESIL-018
  sheet: MOB
  category: RESIL
  title: Check application-level encryption of API payloads
  objective: Finds apps whose API payloads show in clear text once an attacker defeats TLS pinning.
  preconditions:
  - Test device with an intercepting proxy.
  steps:
  - Defeat certificate pinning on a test device. Capture the app traffic.
  - Read the request and response bodies of security-relevant calls.
  - Check if the app encrypts or signs the payloads in a second layer.
  - Check that the keys come from the platform keystore.
  - Change a captured request and replay it. Check that the server rejects it.
  example: 'objection -g <pkg> explore, then android sslpinning disable ; Burp Suite: capture, edit and replay requests'
  expected: Security-relevant payloads have a second layer of encryption or signature on top of TLS. The server rejects changed requests.
  severity: Info
  test_type:
  - Manual
  level: MASVS R
