- id: MOB-RESIL-004
  sheet: MOB
  category: RESIL
  title: Check device attestation in the backend
  objective: Finds backends that cannot tell real devices from rooted, emulated or automated ones.
  preconditions:
  - Test backend that you may send replayed tokens to.
  steps:
  - Find the code that asks the platform for a device attestation, such as Play Integrity or hardware key attestation.
  - 'iOS: Find the use of DeviceCheck and App Attest.'
  - Capture the request that carries the attestation. Look for a server-issued nonce.
  - Replay an old attestation and send a changed one. Check that the backend rejects both.
  - Check that the backend checks the verdict itself and gates sensitive operations on it.
  example: 'Burp Suite: capture and replay the attestation request ; grep -rn "IntegrityManager\|requestIntegrityToken\|DCAppAttestService" out/'
  expected: The backend checks device attestation evidence with a fresh nonce. It blocks sensitive operations when the evidence is missing or bad.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS R
  refs:
    mobile_top10:
    - M7:2024
    masvs:
    - MASVS-RESILIENCE-1
    maswe:
    - MASWE-0054
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
  sources_read:
  - sources/masvs/controls-master/MASVS-RESILIENCE-1.md
