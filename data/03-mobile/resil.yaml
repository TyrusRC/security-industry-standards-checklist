- id: MOB-RESIL-011
  sheet: MOB
  category: RESIL
  title: Check code obfuscation of security-relevant logic
  objective: Finds readable security logic that helps attackers to find and remove checks.
  steps:
  - 'Android: Decompile the DEX code. Look for readable class and method names in security logic.'
  - 'Android: Extract the native libraries. Look for readable strings, symbols and constants.'
  - 'iOS: Extract the main binary and bundled Mach-O files. Read the symbols and strings, and demangle Swift names.'
  - Find root checks, attestation, integrity checks and key handling.
  - Check that an attacker cannot find and understand these parts with reasonable effort.
  example: jadx-gui app.apk ; strings -a lib/arm64-v8a/lib.so | head -100 ; r2 -A <app_binary> ; izz ; xcrun swift-demangle <symbol>
  expected: Security-relevant code is obfuscated in the Java, Kotlin and native layers. An attacker needs much effort to find and understand it.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS R
