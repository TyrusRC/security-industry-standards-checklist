- id: MOB-RESIL-001
  sheet: MOB
  category: RESIL
  title: Check root and jailbreak detection
  objective: Finds apps that run with sensitive functions on a rooted or jailbroken device.
  preconditions:
  - Rooted or jailbroken test device with Frida.
  steps:
  - 'Android: Search the code for root checks, such as su paths, test-keys, root packages and system property reads.'
  - 'iOS: Search the binary for jailbreak checks, such as Cydia paths, writable system folders and URL scheme tests.'
  - Hook the file, property and system calls at runtime and record the checks that run.
  - Run the app on a rooted or jailbroken test device. Check how the app reacts.
  - Try an automated bypass tool. Note which checks it must bypass.
  - Make sure the app restricts sensitive functions or warns the backend when it detects the change.
  example: frida -U -f <pkg> -l hook_root_checks.js ; objection -g <pkg> explore, then android root disable ; objection -g <bundle_id> explore, then ios jailbreak disable ; frida-trace -U -f <pkg> -i "access" -i "fopen"
  expected: The app detects a rooted or jailbroken device with several checks. It limits sensitive functions or informs the backend when it finds one.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS R
  refs:
