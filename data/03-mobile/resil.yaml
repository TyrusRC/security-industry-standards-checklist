- id: MOB-RESIL-015
  sheet: MOB
  category: RESIL
  title: Check that release builds are not debuggable
  objective: Finds builds that let an attacker attach a debugger and read app memory and data.
  preconditions:
  - Release build of the app.
  steps:
  - 'Android: Read the android:debuggable attribute in the AndroidManifest.xml.'
  - 'Android: Flag the value true.'
  - 'iOS: Extract the entitlements of the main binary and look for get-task-allow.'
  - 'iOS: Flag the value true.'
  - Try to attach a debugger to the release build.
  example: aapt2 d badging app.apk | grep -i debuggable ; apktool d app.apk ; grep debuggable out/AndroidManifest.xml ; rabin2 -OC App | grep -A1 get-task-allow ; adb jdwp
  expected: The release build is not debuggable. The debuggable flag and the get-task-allow entitlement are false or missing.
  severity: Medium
  test_type:
