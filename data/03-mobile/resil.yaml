- id: MOB-RESIL-006
  sheet: MOB
  category: RESIL
  title: Check the app signature scheme, key size and code signature format
  objective: Finds weak or old signatures that attackers can abuse to repackage the app.
  preconditions:
  - APK or IPA of the release build.
  steps:
  - 'Android: Read minSdkVersion in the AndroidManifest.xml.'
  - 'Android: List the signature schemes of the APK. Flag a v1-only signature when minSdkVersion is 24 or higher.'
  - 'Android: Read the key size of each signer. Flag RSA keys below 2048 bits.'
  - 'iOS: Extract the binary and read the CodeDirectory version of the code signature.'
  - 'iOS: Compare it with the latest code signature format that Apple recommends.'
  example: apksigner verify --verbose --print-certs app.apk ; apksigner verify -v app.apk | grep -i "scheme" ; codesign -dv --verbose=4 App.app | grep -E "CodeDirectory|Format"
  expected: The APK uses v2 or newer signatures with strong keys. The iOS app uses the current code signature format.
  severity: Low
  test_type:
  - Config Review
  - Automated
  level: MASVS R
  refs:
