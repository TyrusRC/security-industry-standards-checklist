- id: MOB-RESIL-016
  sheet: MOB
  category: RESIL
  title: Check that WebView debugging is off in release builds
  objective: Finds WebViews that let attackers inspect and change web content with remote tools.
  preconditions:
  - Release build on a device with USB debugging.
  steps:
  - 'Android: Search the code for WebView.setWebContentsDebuggingEnabled.'
  - 'Android: Flag calls with true that do not check ApplicationInfo.FLAG_DEBUGGABLE.'
  - 'Android: Open chrome://inspect with the release build running. Look for WebViews to inspect.'
  example: grep -rn "setWebContentsDebuggingEnabled" out/ ; open chrome://inspect on the host with the device connected by USB
  expected: The app calls setWebContentsDebuggingEnabled with true only when FLAG_DEBUGGABLE is set. The release build offers no WebView to inspect.
