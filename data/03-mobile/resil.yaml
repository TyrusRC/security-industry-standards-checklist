- id: MOB-RESIL-002
  sheet: MOB
  category: RESIL
  title: Check emulator and virtual device detection
  objective: Finds apps that run sensitive functions in an emulator where attackers have full control.
  preconditions:
  - Emulator or virtual device with Frida.
  steps:
  - 'Android: Search the code for checks of Build properties, QEMU files and emulator sensors.'
  - 'iOS: Look for hooks on the checks that find a simulator or virtual device.'
  - Run the app in an emulator or virtual device. Hook the checks and trace the system calls.
  - Record which checks run and how the app reacts.
  - Make sure the app limits sensitive functions when it detects the virtual device.
  example: frida -U -f <pkg> -l hook_build_props.js ; frida-trace -U -f <pkg> -i "__system_property_get" ; run the app in an Android Virtual Device or an iOS simulator
  expected: The app detects emulators and virtual devices with several checks. It limits sensitive functions when it detects one.
  severity: Low
  test_type:
  - Manual
