- id: MOB-RESIL-012
  sheet: MOB
  category: RESIL
  title: Check obfuscation of resources and identifiers
  objective: Finds readable resources and strings that show how the app works.
  steps:
  - Unpack the APK or IPA. List strings, layouts, configuration files and bundled data.
  - Look for descriptive resource and string names that map to security features.
  - Look for sensitive strings and settings in clear form.
  - Check if integrity checks protect the obfuscated resources from replacement.
  example: apktool d app.apk -o out ; cat out/res/values/strings.xml ; unzip app.ipa ; plutil -p Payload/App.app/Info.plist
  expected: Resources that reveal security behavior are obfuscated or encrypted. Their identifiers carry no meaning in release builds.
  severity: Info
  test_type:
  - Manual
  level: MASVS R
  refs:
    mobile_top10:
