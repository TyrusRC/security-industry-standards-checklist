- id: MOB-RESIL-005
  sheet: MOB
  category: RESIL
  title: Check that the app detects a device without a secure screen lock
  objective: Finds apps that keep sensitive data and keys on devices that have no passcode.
  preconditions:
  - Test device where you can remove the lock.
  steps:
  - 'Android: Search the code for KeyguardManager.isDeviceSecure and BiometricManager.canAuthenticate.'
  - 'iOS: Search the binary for LAContext canEvaluatePolicy with deviceOwnerAuthentication.'
  - 'iOS: Check the Keychain items for kSecAttrAccessibleWhenPasscodeSetThisDeviceOnly.'
  - Hook these calls at runtime. Remove the device lock and use the app.
  - Check that the app checks the lock again before it enables sensitive functions.
  example: frida -U -f <pkg> -l hook_keyguard.js ; objection -g <pkg> explore, then android hooking watch class_method android.app.KeyguardManager.isDeviceSecure --dump-return
  expected: The app checks that a secure screen lock exists before it enables sensitive functions. Keys bind to the device lock.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
  refs:
