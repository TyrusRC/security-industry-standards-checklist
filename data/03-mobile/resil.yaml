- id: MOB-RESIL-007
  sheet: MOB
  category: RESIL
  title: Check app attestation in the backend
  objective: Finds backends that accept requests from modified or repackaged copies of the app.
  preconditions:
  - Test backend. Do not run on production.
  steps:
  - Find the code that checks the signing identity, the package identity and the packaged files at runtime.
  - Find the use of App Attest or the Play Integrity app verdict.
  - Repackage the app with a test change. Send its requests to a test backend.
  - Check that the backend rejects requests from the changed app.
  - Check how the app reacts when its own checks fail.
  example: apktool d app.apk ; apktool b -o repack.apk ; apksigner sign --ks test.jks repack.apk ; adb install repack.apk
  expected: The backend checks an app integrity signal and rejects modified or repackaged clients. The app reacts to failed checks.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS R
  refs:
    mobile_top10:
    - M7:2024
    masvs:
    - MASVS-RESILIENCE-2
    maswe:
