- id: MOB-RESIL-013
  sheet: MOB
  category: RESIL
  title: Check native binaries for debug symbols
  objective: Finds binaries with symbols that show names and structure of the code.
  preconditions:
  - Extracted release package.
  steps:
  - 'Android: Extract the native libraries and read their symbol and line number information.'
  - 'Android: Flag libraries that are not stripped or that have line numbers.'
  - 'iOS: Extract the binaries. List the symbols of each executable and library.'
  - 'iOS: Flag symbols that are marked as debug symbols.'
  - Check that release builds keep dSYM files out of the app package.
  example: r2 -A lib.so ; i~stripped,linenum,lsyms ; r2 -A <app_binary> ; is~debug ; nm -a lib.so | head
  expected: Release binaries are stripped. They hold no debug symbols or line numbers.
  severity: Low
  test_type:
  - Automated
  - Config Review
