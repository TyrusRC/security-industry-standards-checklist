- id: MOB-RESIL-017
  sheet: MOB
  category: RESIL
  title: Check detection of attached debuggers
  objective: Finds apps that keep running while a debugger controls them.
  preconditions:
  - Release build and a test device.
  steps:
  - 'Android: Search for Debug.isDebuggerConnected, ptrace, TracerPid reads and JDWP checks.'
  - 'iOS: Search the binary for ptrace with PT_DENY_ATTACH, sysctl P_TRACED, getppid and exception port checks.'
  - Hook the detection calls at runtime. Record return values and backtraces.
  - Attach a debugger to the running app.
  - Check that the app ends, limits functions or informs the backend.
  example: adb jdwp ; adb forward tcp:7777 jdwp:<pid> ; jdb -attach localhost:7777 ; grep -rn "isDebuggerConnected\|TracerPid" out/ ; frida -U -f <pkg> -l hook_debug_detect.js
  expected: The app detects an attached debugger in the Java, Kotlin, native and iOS code. It reacts when it finds one.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS R
