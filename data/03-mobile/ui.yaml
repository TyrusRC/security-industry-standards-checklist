- id: MOB-UI-005
  sheet: MOB
  category: UI
  title: Check sensitive screens for overlay attack protection
  objective: Finds screens where a malicious app can cover or imitate the UI and steal taps.
  preconditions:
  - Android device with a test overlay app.
  steps:
  - 'Android: List the screens for login, payment approval, permission requests and security settings.'
  - 'Android: Search for setFilterTouchesWhenObscured, android:filterTouchesWhenObscured and onFilterTouchEventForSecurity.'
  - 'Android: Search for FLAG_WINDOW_IS_OBSCURED checks in touch handlers.'
  - 'Android: Read targetSdkVersion. If it is 31 or higher, look for setHideOverlayWindows and the HIDE_OVERLAY_WINDOWS permission.'
  - 'Android: Draw a test overlay over each sensitive screen. Tap through it.'
  example: grep -rn "setFilterTouchesWhenObscured\|filterTouchesWhenObscured\|onFilterTouchEventForSecurity\|setHideOverlayWindows" out/ ; aapt2 d permissions app.apk | grep HIDE_OVERLAY_WINDOWS
  expected: Sensitive screens ignore touches when another window covers them. The app hides external overlays on API level 31 and higher.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M8:2024
    masvs:
    - MASVS-PLATFORM-3
