- id: MOB-UI-003
  sheet: MOB
  category: UI
  title: Check that password, PIN and code fields hide the typed text
  objective: Finds secret input fields that show characters to bystanders and screen recordings.
  preconditions:
  - Decompiled app code or extracted IPA.
  steps:
  - 'Android: Find text fields for passwords, PINs and one-time codes in XML and in Compose code.'
  - 'Android: Flag a plain TextField, and flag a SecureTextField that uses TextObfuscationMode.Visible.'
  - 'iOS: Check that each UITextField for a secret sets isSecureTextEntry to true.'
  - 'iOS: Check that SwiftUI code uses SecureField and not TextField for secrets.'
  - Type test secrets into each field at runtime. Look at the screen for visible characters.
  example: grep -rn "textPassword\|TextObfuscationMode\|SecureTextField" out/ ; r2 -A <app_binary> ; izz~isSecureTextEntry ; frida -U -f <bundle_id> -l hook_uitextfield.js
  expected: Every field for a password, PIN or code masks the typed characters. Full values show only after a user action and for a short time.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
  refs:
