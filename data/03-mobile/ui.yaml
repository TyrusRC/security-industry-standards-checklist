- id: MOB-UI-002
  sheet: MOB
  category: UI
  title: Check that Android keyboards do not cache sensitive input
  objective: Finds input fields that let the keyboard learn and suggest sensitive text.
  preconditions:
  - Decoded APK.
  steps:
  - 'Android: Extract the layout files from the app package.'
  - 'Android: List every android:inputType attribute and every setInputType call.'
  - 'Android: Find fields for passwords, PINs, card data and other secrets.'
  - 'Android: Check that these fields use a non-caching type such as textPassword or textNoSuggestions.'
  example: apktool d app.apk -o out ; grep -rn "android:inputType" out/res/layout ; grep -rn "setInputType" out/
  expected: Every field that takes sensitive data uses an input type that stops keyboard caching and suggestions.
  severity: Low
  test_type:
  - Code Review
  level: MASVS L2
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PLATFORM-3
    mastg:
