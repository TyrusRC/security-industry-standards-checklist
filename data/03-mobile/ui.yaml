- id: MOB-UI-004
  sheet: MOB
  category: UI
  title: Check that notifications hold no sensitive data
  objective: Finds notifications that show secrets or personal data on the lock screen or to other apps.
  preconditions:
  - Android device. Test data that triggers each notification.
  steps:
  - 'Android: Read minSdkVersion and the POST_NOTIFICATIONS permission in the AndroidManifest.xml.'
  - 'Android: Find notification code that uses setContentTitle, setContentText or setStyle.'
  - 'Android: Check the visibility setting and setPublicVersion of each notification.'
  - Trigger each notification with test data. Look at the lock screen and at the notification list.
  - Look for one-time codes, message text, balances or other personal data.
  example: aapt2 d permissions app.apk | grep POST_NOTIFICATIONS ; grep -rn "setContentText\|setContentTitle\|setVisibility\|setPublicVersion" out/
  expected: Notifications only say that an event occurred. They show no sensitive values, and the lock screen shows a redacted version.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PLATFORM-3
    mastg:
