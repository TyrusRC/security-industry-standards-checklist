- id: MOB-UI-007
  sheet: MOB
  category: UI
  title: Check that screens show only the sensitive data that the task needs
  objective: Finds screens that show full secrets or personal data without need.
  steps:
  - Open each screen that shows card numbers, identifiers, account data or personal data.
  - Look for values that the app could show in part, such as the last four digits.
  - Check that the app shows full values only after an explicit user action.
  - Check that the full value hides again after a short time or when the screen closes.
  example: Manual review with screenshots of each screen ; compare displayed values with the stored data
  expected: The app shows only the part of a sensitive value that the task needs. Full values need a user action and hide again.
  severity: Low
  test_type:
  - Manual
  level: MASVS L2
