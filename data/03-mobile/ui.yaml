- id: MOB-UI-001
  sheet: MOB
  category: UI
  title: Check that sensitive screens stay out of screenshots and the app switcher
  objective: Finds screens that leak sensitive data through task snapshots, screenshots or screen recordings.
  preconditions:
  - Rooted Android device or emulator, and a jailbroken iOS device, to read snapshot files.
  steps:
  - List the screens that show sensitive data, such as login, payment, health and personal data.
  - 'Android: Search the code for FLAG_SECURE, setRecentsScreenshotEnabled, setSecure on SurfaceView and SecureOn in Compose dialogs.'
  - 'Android: Open each sensitive screen. Press Home. Pull the system task snapshot files from the device.'
  - 'Android: Try a screenshot and a screen recording on each sensitive screen.'
  - 'iOS: Open each sensitive screen. Press Home. Pull the snapshot files from the SplashBoard folder of the app.'
  - Look at each snapshot image for passwords, tokens, personal data or other secrets.
  example: 'adb shell ls /data/system_ce/0/snapshots (root) ; adb pull /data/system_ce/0/snapshots ; adb exec-out screencap -p > shot.png ; grep -rn "FLAG_SECURE\|setRecentsScreenshotEnabled" out/ ; iOS: scp the Library/SplashBoard/Snapshots folder of the app container'
  expected: No snapshot, screenshot or recording shows sensitive data. The app hides or protects sensitive screens when it moves to the background.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS L2
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PLATFORM-3
    mastg:
    - MASTG-TEST-0289
    - MASTG-TEST-0291
    - MASTG-TEST-0290
    - MASTG-TEST-0292
    - MASTG-TEST-0293
    - MASTG-TEST-0294
    maswe:
    - MASWE-0038
    cwe:
    - CWE-200
    - CWE-359
