- id: MOB-UI-006
  sheet: MOB
  category: UI
  title: Check that sensitive views are hidden from accessibility services
  objective: Finds views that any accessibility service can read or control.
  preconditions:
  - Android 14 (API 34) or newer for the runtime part.
  steps:
  - 'Android: Search the layouts and code for accessibilityDataSensitive and setAccessibilityDataSensitive.'
  - 'Android: Search for filterTouchesWhenObscured, because it also makes a view data sensitive.'
  - 'Android: Hook the setters at runtime and use the app on every sensitive screen.'
  - 'Android: Dump the UI hierarchy of each sensitive screen. Look at the isAccessibilityDataSensitive value of each view.'
  - 'Android: Take a screenshot of each screen. Find the views with secrets or personal data.'
  example: adb shell uiautomator dump /sdcard/ui.xml ; adb pull /sdcard/ui.xml ; adb shell dumpsys activity top ; adb exec-out screencap -p > screen.png ; frida -U -f <pkg> -l hook_a11y_sensitive.js
  expected: Each view that shows or takes sensitive data is accessibility data sensitive. Only declared accessibility tools can read it.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PLATFORM-3
    mastg:
    - MASTG-TEST-0403
