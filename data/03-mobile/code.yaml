- id: MOB-CODE-001
  sheet: MOB
  category: CODE
  title: Check the minimum platform version that the app supports
  objective: Finds apps that run on old OS versions that lack current security patches and features.
  preconditions:
  - Decoded APK and extracted IPA.
  steps:
  - 'Android: Read minSdkVersion in the AndroidManifest.xml.'
  - 'iOS: Read MinimumOSVersion in the Info.plist.'
  - Compare the value with the platform versions that still get security updates.
  - 'Android: Search the code for Build.VERSION.SDK_INT checks and the sensitive features that they protect.'
  - Make sure the app refuses or limits sensitive features on unsupported platform versions.
  example: aapt2 d badging app.apk | grep -E "sdkVersion|targetSdkVersion" ; plutil -p Payload/App.app/Info.plist | grep MinimumOSVersion ; grep -rn "Build.VERSION.SDK_INT" out/
  expected: The app sets a minimum platform version that still gets security updates. It limits sensitive features on older versions.
  severity: Low
  test_type:
  - Config Review
  - Code Review
  level: MASVS L2
  refs:
    masvs:
    - MASVS-CODE-1
    mastg:
    - MASTG-TEST-0245
