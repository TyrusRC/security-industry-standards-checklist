- id: MOB-CODE-005
  sheet: MOB
  category: CODE
  title: Check native binaries for compiler security features
  objective: Finds native code built without PIE, stack canaries or ARC, which makes memory bugs easier to use.
  preconditions:
  - Extracted APK and IPA.
  steps:
  - 'Android: Extract the native libraries from the APK.'
  - 'Android: Read the canary and pic values of each library.'
  - 'iOS: Extract the main binary and list the bundled libraries and frameworks.'
  - 'iOS: Check the main binary and each library for pic, stack canary symbols and ARC symbols.'
  - Flag a library that mixes Objective-C or C code with no canary symbols.
  - Check false positives, such as memory-safe code, with the source code and the build flags.
  example: unzip -o app.apk "lib/*" -d app ; rabin2 -I app/lib/arm64-v8a/lib.so | grep -E "canary|pic" ; r2 -A <app_binary> ; i~canary,pic ; is~release,retain
  expected: All native libraries use position independent code and stack canaries. iOS code that is not Swift-only uses ARC.
  severity: Low
  test_type:
  - Automated
  - Config Review
  level: MASVS L2
  refs:
    mobile_top10:
