- id: MOB-CODE-003
  sheet: MOB
  category: CODE
  title: Check that the app can force users to update
  objective: Finds apps that cannot block old, vulnerable versions after a security fix.
  preconditions:
  - Test build or test backend that reports a minimum version.
  steps:
  - 'Android: Search the code for AppUpdateManager, getAppUpdateInfo and startUpdateFlowForResult.'
  - 'iOS: Search the binary for CFBundleShortVersionString, the iTunes lookup URL and a minimum version policy.'
  - Check that the version check runs before access to protected functions and cannot be skipped.
  - Check that the app uses an immediate update or a screen that the user cannot dismiss.
  - Run the app with a version below the minimum. Capture the traffic and hook the update calls.
  - Make sure the app blocks use until the user updates.
  example: 'grep -rn "AppUpdateManager\|startUpdateFlowForResult\|BuildConfig.VERSION" out/ ; frida -U -f <pkg> -l hook_update.js ; r2 -A <app_binary> ; izz~itunes.apple.com/lookup ; Burp: change the version in the request or the response'
  expected: The app checks its version at start. It blocks use of an outdated version with a non-dismissible update flow.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
