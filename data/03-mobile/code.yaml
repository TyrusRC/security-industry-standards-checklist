- id: MOB-CODE-006
  sheet: MOB
  category: CODE
  title: Check the app for deprecated APIs in security functions
  objective: Finds use of deprecated APIs that lack fixes or have safer replacements.
  steps:
  - Build the app with deprecation warnings on. List the warnings.
  - Find deprecated keystore, crypto, networking and authentication APIs in the code.
  - Check the release notes of each supported platform version for removed or changed features.
  - Check that the team tracks the move off each deprecated security API.
  - Run the app on all supported platform versions.
  example: ./gradlew build --warning-mode all ; xcodebuild build 2>&1 | grep -i deprecated ; grep -rn "@Deprecated\|deprecated" out/ | head
  expected: Security-relevant code uses no deprecated APIs, and the team treats deprecation warnings as work items.
  severity: Low
  test_type:
  - Code Review
  level: MASVS L2
  refs:
    masvs:
    - MASVS-CODE-3
    maswe:
    - MASWE-0046
    cwe:
    - CWE-327
    - CWE-477
    - CWE-522
  sources_read:
