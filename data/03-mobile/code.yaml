- id: MOB-CODE-008
  sheet: MOB
  category: CODE
  title: Check the app supply chain for malicious or unexpected code
  objective: Finds trojanized SDKs, build changes or hidden features that ship in the app.
  preconditions:
  - Access to the build files and the release package.
  steps:
  - Compare the SBOM of the release with the declared dependencies. List components that are not declared.
  - Check that the build pins dependency versions with a lockfile and takes packages from a controlled repository.
  - Check that code review and strong sign-in protect the source repository and the build system.
  - Scan the release binary for unexpected code, permissions, secrets and network endpoints.
  - Run the release build and look for unexpected network traffic.
  - Check that the signing keys are protected and that releases carry a signature.
  example: cdxgen -o sbom.json ; apksigner verify --print-certs app.apk ; mitmproxy to capture the first start traffic ; grep -rn "http" out/resources | sort -u
  expected: The release contains only reviewed and declared components. The build pins dependencies and protects signing keys, and the release shows no unexpected behavior.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: MASVS L1
