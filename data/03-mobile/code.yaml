- id: MOB-CODE-007
  sheet: MOB
  category: CODE
  title: Check that security functions use platform APIs and vetted libraries
  objective: Finds custom crypto, TLS, DNS or authentication code that is likely to have flaws.
  steps:
  - Search the code for custom cryptographic algorithms, custom TLS stacks and custom DNS resolvers.
  - Search for custom authentication flows next to the platform credential APIs.
  - List third-party security libraries. Check the release date and the maintenance state of each.
  - Compare the libraries with standards such as FIPS 140-2 or 140-3 where the app must follow them.
  example: jadx -d out app.apk ; grep -rn "implements X509TrustManager\|MessageDigest\|Cipher.getInstance\|new Socket(" out/ ; list libraries with cdxgen -t java
  expected: The app uses platform APIs or vetted, maintained libraries for crypto, networking, DNS and authentication. It has no home-made security code.
  severity: Medium
  test_type:
  - Code Review
  level: MASVS L1
  refs:
    masvs:
    - MASVS-CODE-3
    maswe:
    - MASWE-0047
    cwe:
