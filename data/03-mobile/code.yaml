- id: MOB-CODE-004
  sheet: MOB
  category: CODE
  title: Scan app dependencies for known vulnerabilities
  objective: Finds third-party libraries and SDKs with public vulnerabilities.
  preconditions:
  - Access to the project build files, or an SBOM from the developer.
  steps:
  - 'Android: Run a Software Composition Analysis scan on the Gradle build, or create a CycloneDX SBOM.'
  - 'iOS: Collect Package.resolved, Podfile.lock and Cartfile.resolved. Scan them, or create a CycloneDX SBOM.'
  - Upload each SBOM to a vulnerability tool such as Dependency-Track.
  - List dependencies with CVE identifiers. Include transitive dependencies and bundled native libraries.
  - Check the exploitability and the exposure of each finding in the app.
  - Check that a process updates or replaces vulnerable libraries.
  example: ./gradlew dependencyCheckAnalyze ; cdxgen -t java -o sbom.json ; cdxgen -o sbom.json (iOS project) ; dependency-check --enableExperimental -f SARIF -s Podfile.lock ; upload sbom.json to Dependency-Track
  expected: The app has no dependency with a known high-impact vulnerability. A process finds and fixes new vulnerable dependencies.
  severity: High
  test_type:
  - Automated
  - Config Review
  level: MASVS L1
