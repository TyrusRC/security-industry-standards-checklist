- id: MOB-CODE-002
  sheet: MOB
  category: CODE
  title: Check that the app targets the latest platform version
  objective: Finds apps that miss platform protections because they target an old SDK.
  preconditions:
  - Decoded APK and extracted IPA.
  steps:
  - 'Android: Read targetSdkVersion in the AndroidManifest.xml.'
  - 'Android: Compare it with the current Google Play target API requirement.'
  - 'iOS: Find the Xcode and SDK version that built the app, and compare it with the current App Store requirement.'
  - Look for legacy behavior that works only because of the old target, such as broad storage access.
  example: aapt2 d badging app.apk | grep targetSdkVersion ; plutil -p Payload/App.app/Info.plist | grep -E "DTSDKName|DTXcode"
  expected: The app targets the latest platform version that the store requires. It does not depend on legacy compatibility behavior.
  severity: Low
  test_type:
  - Config Review
  level: MASVS L1
  refs:
    masvs:
    - MASVS-CODE-1
    maswe:
    - MASWE-0042
    cwe:
    - CWE-693
    - CWE-1357
