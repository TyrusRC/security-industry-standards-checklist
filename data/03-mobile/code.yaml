- id: MOB-CODE-010
  sheet: MOB
  category: CODE
  title: Check input validation on all entry points of the app
  objective: Finds input from the UI, IPC, files or network that reaches a sensitive sink unchecked.
  steps:
  - 'List the entry points: UI fields, deep links, IPC, files, the clipboard and network data.'
  - Follow the data from each entry point to its sinks, such as SQL, file paths, WebViews and parsers.
  - Check that the code validates type, length, range and format against an allowlist.
  - Check that validation runs on the server too, as client checks are easy to bypass.
  - Send malformed, oversized and malicious values to each entry point. Look for crashes and injection.
  - Check that the parsers limit size and nesting depth.
  example: 'semgrep --config <rules> out/ ; mobsf: upload the APK or IPA for the static scan ; adb shell monkey -p <pkg> 5000 ; Burp Suite Intruder on the API calls of the app'
  expected: The app treats all outside data as untrusted. It validates data against allowlists before use, and malformed input causes no crash or injection.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
