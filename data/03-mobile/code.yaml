- id: MOB-CODE-009
  sheet: MOB
  category: CODE
  title: Check the app for unsafe dynamic code loading
  objective: Finds code that the app loads at runtime from places that attackers control.
  steps:
  - 'Android: Search for DexClassLoader, PathClassLoader, System.load and System.loadLibrary with a path.'
  - 'iOS: Search for dlopen and downloaded scripts or plugins.'
  - Find the folder that the loaded code comes from. Check if it is writable or on external storage.
  - Check that the app verifies a signature on downloaded code against a pinned key.
  - Check that the code arrives over a secure channel.
  example: grep -rn "DexClassLoader\|PathClassLoader\|System.load" out/ ; r2 -A <app_binary> ; afl~dlopen
  expected: The app loads no code from writable or external folders. Downloaded code is signed and the app checks the signature before it runs the code.
  severity: High
  test_type:
  - Code Review
  level: MASVS L2
  refs:
    mobile_top10:
    - M4:2024
    masvs:
