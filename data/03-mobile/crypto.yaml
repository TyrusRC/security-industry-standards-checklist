- id: MOB-CRYPTO-009
  sheet: MOB
  category: CRYPTO
  title: Check that the app uses no broken hash functions
  objective: Finds MD5 and SHA-1 in security-relevant uses such as signatures, integrity checks and fingerprints.
  steps:
  - 'Android: Search the decompiled code for MessageDigest.getInstance with MD5, MD2, MD4 or SHA-1.'
  - 'iOS: Search the binary for CC_MD2, CC_MD4, CC_MD5, CC_SHA1 and CryptoKit Insecure.MD5 and Insecure.SHA1.'
  - Look at the code at each hit and note what the hash protects.
  - Check that the app does not hash passwords or passphrases with a fast hash. A password KDF is needed.
  - Check that digests are not truncated below the security strength that the use case needs.
  example: jadx -d src app.apk; grep -rnE "MessageDigest.getInstance\(\"(MD5|MD2|MD4|SHA-?1)\"" src/; r2 -qc "aaa; afl~CC_MD5; afl~CC_SHA1" Payload/App.app/App; strings Payload/App.app/App | grep -E "Insecure.*(MD5|SHA1)"
  expected: The app uses SHA-256 or stronger for security purposes. MD5 and SHA-1 appear only in non-security uses.
  severity: Medium
  test_type:
  - Code Review
  - Automated
  level: MASVS L1
  refs:
    mobile_top10:
    - M10:2024
    masvs:
    - MASVS-CRYPTO-1
    mastg:
    - MASTG-TEST-0211
    maswe:
