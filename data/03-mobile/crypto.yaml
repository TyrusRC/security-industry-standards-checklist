- id: MOB-CRYPTO-012
  sheet: MOB
  category: CRYPTO
  title: Check that the app verifies signatures and acts on the result
  objective: Finds signature checks that are skipped, ignored or trust keys that an attacker can replace.
  steps:
  - List the data that the app must check with signatures, such as updates, configuration, licenses and tokens.
  - Search the code for the Signature class, SecKeyVerifySignature and token validation calls.
  - Check that a failed check stops the operation and that the code does not swallow the result.
  - Check that the public key comes from a trusted set and not from the same download as the data.
  - Change signed data in transit with a proxy and make sure the app rejects it.
  example: jadx -d src app.apk; grep -rn "\.verify(" src/; r2 -qc "aaa; axt sym.imp.SecKeyVerifySignature" Payload/App.app/App; frida -U -f <package> -l hook-signature-verify.js (return false and see the app behavior); mitmproxy -s tamper.py
  expected: The app rejects every item with a wrong, missing or foreign signature. It enforces the expected algorithm and trusted keys.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
  refs:
