- id: MOB-CRYPTO-013
  sheet: MOB
  category: CRYPTO
  title: Check that keys derived from passwords use a password KDF
  objective: Finds keys derived with a plain hash, a low work factor, a missing salt or a low-entropy input.
  steps:
  - Search the code for key derivation from passwords, PINs and passphrases.
  - Flag plain hashes such as SHA-256 of a password, used as a key.
  - Look for PBKDF2, scrypt or Argon2 and note the iterations, memory and parallelism values.
  - Check that each derivation uses a unique random salt that is not hardcoded.
  - Check that a short PIN is combined with a random key from the Keystore or Keychain.
  example: jadx -d src app.apk; grep -rnE "PBKDF2|SecretKeyFactory.getInstance|scrypt|Argon2" src/; r2 -qc "aaa; afl~CCKeyDerivationPBKDF" Payload/App.app/App; frida-trace -U -f <package> -j "javax.crypto.spec.PBEKeySpec!*"
  expected: The app derives keys from passwords only with PBKDF2, scrypt or Argon2. It uses a current work factor and a unique random salt.
  severity: Medium
  test_type:
  - Code Review
  level: MASVS L1
