- id: MOB-CRYPTO-015
  sheet: MOB
  category: CRYPTO
  title: Check that key use needs authentication and an unlocked device
  objective: Finds keys that any code in the app, or anyone with the unlocked device, can use without limits.
  steps:
  - 'Android: Search KeyGenParameterSpec.Builder for setUserAuthenticationRequired, setUnlockedDeviceRequired and the validity duration.'
  - 'iOS: Search SecAccessControlCreateWithFlags and the kSecAttrAccessible values of Keychain items.'
  - Flag keys for sensitive data that need no authentication, or that work while the device is locked.
  - Flag iOS items with kSecAttrAccessibleAlways or without the ThisDeviceOnly suffix.
  - Flag keys in StrongBox or the Secure Enclave that have no use restrictions.
  example: jadx -d src app.apk; grep -rnE "setUserAuthenticationRequired|setUnlockedDeviceRequired|setUserAuthenticationParameters" src/; r2 -qc "aaa; axt sym.imp.SecAccessControlCreateWithFlags" Payload/App.app/App; objection -g <bundle> explore -> ios keychain dump (read the Accessible column)
  expected: Keys for sensitive data need user authentication and an unlocked device, are bound to the device and have a short or zero validity.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L2
