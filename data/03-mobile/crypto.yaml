- id: MOB-CRYPTO-016
  sheet: MOB
  category: CRYPTO
  title: Check that the app needs a secure device lock for sensitive features
  objective: Finds sensitive features that work on devices with no PIN, pattern, password or biometric lock.
  preconditions:
  - Use a test device. Do not clear the lock of a personal device.
  steps:
  - Search the code for KeyguardManager.isDeviceSecure and LAContext canEvaluatePolicy.
  - Search iOS Keychain items for kSecAttrAccessibleWhenPasscodeSetThisDeviceOnly.
  - Remove the screen lock on a test device and start the sensitive feature.
  - Remove the screen lock while the app runs and use the feature again.
  - See if the app blocks the feature or the key access in both cases.
  example: jadx -d src app.apk; grep -rn "isDeviceSecure\|isKeyguardSecure" src/; r2 -qc "aaa; axt sym.imp.SecAccessControlCreateWithFlags" Payload/App.app/App; adb shell locksettings clear --old <PIN> (test device)
  expected: The app checks the device lock state at each use of sensitive features. It blocks the feature or the key use when no lock is set.
  severity: Low
  test_type:
  - Manual
  - Code Review
  level: MASVS L2
