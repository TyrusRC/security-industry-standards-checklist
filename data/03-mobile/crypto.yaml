- id: MOB-CRYPTO-010
  sheet: MOB
  category: CRYPTO
  title: Check that the app uses MACs correctly
  objective: Finds missing, weak or reused message authentication codes.
  steps:
  - List the places where the app must protect the integrity of data, such as stored files, messages and tokens.
  - Search the code for Mac, HMAC, CCHmac, CRC32 and hash(key + message) constructions.
  - Flag CRC checksums, MD5 or SHA-1 based MACs and plain hash(key || message) patterns.
  - Check the key source, the key reuse, the tag length and the order of encryption and MAC.
  - Check that the app compares tags in constant time and rejects replayed messages.
  example: jadx -d src app.apk; grep -rnE "javax.crypto.Mac|HmacMD5|HmacSHA1|CRC32" src/; r2 -qc "aaa; afl~CCHmac" Payload/App.app/App; frida-trace -U -f <package> -j "javax.crypto.Mac!*"
  expected: The app uses HMAC with SHA-256 or stronger, or an AEAD mode. Keys have one purpose, tags are full length and replays fail.
  severity: Medium
  test_type:
  - Code Review
  level: MASVS L1
