- id: MOB-CRYPTO-002
  sheet: MOB
  category: CRYPTO
  title: Check that the app uses no broken block modes such as ECB
  objective: Finds symmetric encryption in ECB mode that leaks patterns in the data.
  steps:
  - 'Android: Decompile the app and list all Cipher.getInstance transformation strings.'
  - 'Android: Mark the strings "AES", AES/ECB/NoPadding, AES/ECB/PKCS5Padding and AES/ECB/ISO10126Padding. Ignore RSA/ECB strings.'
  - 'iOS: Search the binary for CCCrypt calls and look for kCCOptionECBMode (value 2) in the options argument.'
  - Hook Cipher.getInstance or CCCrypt at run time and use every workflow of the app with sensitive data.
  - Use the backtraces to see if the encrypted data is sensitive.
  example: jadx -d src app.apk; grep -rnE "Cipher.getInstance\(\"[A-Za-z0-9]+(/ECB/[A-Za-z0-9]+)?\"\)" src/; frida-trace -U -f <package> -j "javax.crypto.Cipher!getInstance"; r2 -qc "aaa; axt sym.imp.CCCrypt" Payload/App.app/App; frida-trace -U -f <bundle> -i CCCrypt
  expected: The app does not use ECB for sensitive data. It uses an authenticated mode such as GCM.
  severity: Medium
  test_type:
  - Code Review
  - Automated
  - Manual
  level: MASVS L1
