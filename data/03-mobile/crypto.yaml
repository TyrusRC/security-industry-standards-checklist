- id: MOB-CRYPTO-006
  sheet: MOB
  category: CRYPTO
  title: Check that keys live only in the platform keystore
  objective: Finds cryptographic keys that the app stores in preferences, files or code instead of the Android Keystore or iOS Keychain.
  steps:
  - List all keys, key pairs and secrets that the app creates, imports or receives.
  - 'Android: Look for KeyStore.getInstance("AndroidKeyStore") and for keys written to files or SharedPreferences.'
  - 'iOS: Look for SecKeyCreateRandomKey with kSecAttrTokenIDSecureEnclave and for keys in UserDefaults or files.'
  - Compare the app data directory before and after use, and search for key material.
  - Check how the app imports keys and see if it wraps them before import.
  example: 'jadx -d src app.apk; grep -rnE "AndroidKeyStore|KeyGenParameterSpec|setIsStrongBoxBacked" src/; objection -g <package> explore -> android keystore list; objection: ios keychain dump; grep -rE "[A-Za-z0-9+/=]{32,}" data/shared_prefs/'
  expected: The app keeps all keys in the Android Keystore or iOS Keychain. Key material never sits in preferences, plain files or code.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: MASVS L1
