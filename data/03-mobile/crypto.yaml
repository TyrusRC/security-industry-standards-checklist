- id: MOB-CRYPTO-014
  sheet: MOB
  category: CRYPTO
  title: Check that the app can rotate its cryptographic keys
  objective: Finds keys with no cryptoperiod, no versioning and no way to replace them.
  steps:
  - Read the design documents and find how the app stores and uses long-lived keys.
  - Search the code for key versions, keysets and key identifiers in the stored data format.
  - Find the cryptoperiod that the team defined for each key type.
  - Replace a key in a test build. Old data must stay readable and new data must use the new key.
  - Make sure the app restricts old keys to decryption and then destroys them.
  example: jadx -d src app.apk; grep -rnE "keyVersion|KeysetHandle|rotate" src/; adb shell run-as <package> ls files shared_prefs (look for key version markers)
  expected: The data format supports key versions. The team defines cryptoperiods, and rotation works without data loss.
  severity: Low
  test_type:
  - Config Review
  - Manual
  level: MASVS L2
