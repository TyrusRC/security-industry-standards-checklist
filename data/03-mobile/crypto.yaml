- id: MOB-CRYPTO-004
  sheet: MOB
  category: CRYPTO
  title: Check that cryptographic keys have a sufficient size
  objective: Finds symmetric and asymmetric keys that are too short for current guidance.
  steps:
  - 'Android: Search for KeyGenerator.init, KeyPairGenerator.initialize and key sizes in KeyGenParameterSpec.'
  - 'iOS: Search for CCCrypt key length arguments and for SecKeyCreateRandomKey with kSecAttrKeyType and kSecAttrKeySizeInBits.'
  - Write down the algorithm and the key size at each location.
  - Compare the sizes with the current NIST guidance, for example RSA 2048 bits or more and AES 256 bits.
  - Flag RSA keys of 1024 bits and AES keys of 128 bits or less for the product policy.
  example: jadx -d src app.apk; grep -rnE "KeyGenerator|KeyPairGenerator|\.init\([0-9]+\)|\.initialize\([0-9]+\)" src/; r2 -qc "aaa; axt sym.imp.SecKeyCreateRandomKey" Payload/App.app/App; frida-trace -U -f <bundle> -i SecKeyCreateRandomKey
  expected: Every key meets the current size guidance for its algorithm. The app uses no RSA 1024 bit keys and no keys shorter than the policy allows.
  severity: Medium
  test_type:
  - Code Review
  level: MASVS L1
