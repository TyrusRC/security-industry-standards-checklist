- id: MOB-CRYPTO-008
  sheet: MOB
  category: CRYPTO
  title: Check that Android crypto calls use no explicit security provider
  objective: Finds getInstance calls that name a provider other than the default Conscrypt provider.
  preconditions:
  - Android only.
  steps:
  - Search the decompiled code for getInstance calls with a second provider argument.
  - Note the provider names, such as Crypto, BC or BouncyCastle.
  - Flag every provider except AndroidKeyStore in KeyStore.getInstance calls.
  - Check the targetSdkVersion, because apps for Android 9 and higher fail when they name a provider.
  example: jadx -d src app.apk; grep -rnE "getInstance\([^)]*,\s*\"(BC|Crypto|SC|SunJCE)\"" src/; grep -rn "Security.addProvider\|BouncyCastleProvider" src/; aapt2 d badging app.apk | grep targetSdkVersion
  expected: No getInstance call names a provider other than the default. Only KeyStore calls name AndroidKeyStore.
  severity: Low
  test_type:
  - Code Review
  level: MASVS L1
