- id: MOB-CRYPTO-001
  sheet: MOB
  category: CRYPTO
  title: Check that the app uses no broken symmetric encryption algorithms
  objective: Finds use of DES, 3DES, RC2, RC4, Blowfish and other broken ciphers in the app or its libraries.
  steps:
  - 'Android: Decompile the app and search for Cipher.getInstance, SecretKeyFactory.getInstance and KeyGenerator.getInstance.'
  - 'iOS: Extract the binaries and search for CCCrypt and the algorithm constants kCCAlgorithmDES, 3DES, RC4, RC2, CAST and Blowfish.'
  - Search bundled libraries such as OpenSSL, BoringSSL and libsodium for the same algorithms.
  - Look at the code at each hit and find the algorithm and the data that it protects.
  - Compare the algorithms with the current NIST and BSI guidance.
  example: jadx -d src app.apk; grep -rnE "Cipher.getInstance\(\"(DES|DESede|RC2|RC4|Blowfish|ARC4)" src/; semgrep --config p/mobsfscan src/; mobsf scan (static analyzer); unzip app.ipa; r2 -qc "aaa; afl~CCCrypt; axt sym.imp.CCCrypt" Payload/App.app/App; strings Payload/App.app/App | grep -iE "rc4|des-|blowfish"
  expected: The app uses no DES, 3DES, RC2, RC4 or Blowfish for sensitive data. It uses AES-GCM or ChaCha20-Poly1305 instead.
  severity: Medium
  test_type:
  - Code Review
  - Automated
  level: MASVS L1
