- id: MOB-CRYPTO-003
  sheet: MOB
  category: CRYPTO
  title: Check that security-relevant values come from a secure random generator
  objective: Finds tokens, keys, IVs and nonces that come from a predictable random number generator or from the clock.
  steps:
  - 'Android: Search the code for java.util.Random, Math.random, SecureRandom with a fixed seed, and Date().getTime or Calendar.MILLISECOND as value sources.'
  - 'iOS: Search the binary for rand, random, srand and the *rand48 functions.'
  - Hook these APIs at run time and use every workflow of the app.
  - Look at the backtraces and the code to find what the value is used for.
  - Flag keys, IVs, nonces, tokens, session IDs, passwords and PINs.
  - Ignore uses that are not security-relevant, such as UI effects or game logic.
  example: jadx -d src app.apk; grep -rnE "java\.util\.Random|Math\.random|new SecureRandom\(|getTime\(\)" src/; frida-trace -U -f <package> -j "java.util.Random!*"; r2 -qc "aaa; afl~rand" Payload/App.app/App; frida-trace -U -f <bundle> -i rand -i random -i arc4random
  expected: The app uses SecureRandom (Android) or SecRandomCopyBytes and arc4random (iOS) for all security-relevant values. Seeds are not fixed.
  severity: Medium
  test_type:
  - Code Review
  - Automated
  - Manual
  level: MASVS L1
