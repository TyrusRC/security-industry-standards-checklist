- id: MOB-CRYPTO-011
  sheet: MOB
  category: CRYPTO
  title: Check how the app generates cryptographic signatures
  objective: Finds weak signature algorithms, short signing keys and weak nonces.
  steps:
  - Search the code for Signature.getInstance, SecKeyCreateSignature and CryptoKit signing calls.
  - Note the signature algorithm and digest, for example SHA1withRSA.
  - Note the key length of each signing key.
  - Check that (EC)DSA nonces come from a secure random generator or use a deterministic scheme.
  - Check that signing keys are not used for encryption or key agreement.
  example: jadx -d src app.apk; grep -rn "Signature.getInstance" src/; r2 -qc "aaa; axt sym.imp.SecKeyCreateSignature" Payload/App.app/App; frida-trace -U -f <package> -j "java.security.Signature!getInstance"
  expected: The app uses ECDSA, RSA-PSS or EdDSA with approved digests and key lengths. Nonces are unpredictable and signing keys have one purpose.
  severity: Medium
  test_type:
  - Code Review
  level: MASVS L1
