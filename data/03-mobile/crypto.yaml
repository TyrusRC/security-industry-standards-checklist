- id: MOB-CRYPTO-007
  sheet: MOB
  category: CRYPTO
  title: Check that Android asymmetric key pairs have one purpose
  objective: Finds key pairs that the app uses for more than one role, such as encryption and signing.
  preconditions:
  - Android only. The MASTG tests have no iOS counterpart.
  steps:
  - Search the code for KeyGenParameterSpec.Builder and note the purposes argument.
  - 'Decode the purposes bitmask: 1 encrypt, 2 decrypt, 4 sign, 8 signature check, 32 wrap key.'
  - Flag every purposes value that mixes encryption, signing and wrapping roles.
  - Hook Cipher.init, Signature.initSign and Signature.initVerify and use every workflow of the app.
  - Check that no key is used in more than one group of operations.
  example: jadx -d src app.apk; grep -rn "KeyGenParameterSpec" src/; frida-trace -U -f <package> -j "javax.crypto.Cipher!init" -j "java.security.Signature!initSign" -j "java.security.Signature!initVerify"
  expected: 'Each key pair has exactly one role: encryption, signing or key wrapping. The value 15 or any mixed value does not appear.'
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
