- id: MOB-CRYPTO-005
  sheet: MOB
  category: CRYPTO
  title: Check that no cryptographic keys are hardcoded in code or files
  objective: Finds symmetric keys, private keys and key files that ship inside the app.
  steps:
  - 'Android: Search the decompiled code for SecretKeySpec and other calls that take raw key bytes or strings.'
  - 'iOS: Search for SecKeyCreateWithData, CCCrypt with a literal key and CryptoKit init(rawRepresentation:) calls.'
  - Search resources and bundle files for .key, .pem, .p12, .der and .cer files and for BEGIN PRIVATE KEY markers.
  - Search plist and JSON files for Base64 or hex strings next to names such as key, secret or privateKey.
  - Look at each hit to see if it is a real key that protects data or authenticates a user.
  example: jadx -d src app.apk; grep -rn "SecretKeySpec" src/; find out/ ipa/ -name "*.pem" -o -name "*.p12" -o -name "*.key" -o -name "*.der"; grep -rl "BEGIN .*PRIVATE KEY" out/ ipa/; strings -n 16 Payload/App.app/App | grep -E "^[A-Za-z0-9+/=]{24,}$"; r2 -qc "aaa; axt sym.imp.SecKeyCreateWithData" Payload/App.app/App; trufflehog filesystem out ipa
  expected: The app contains no hardcoded keys. The app creates keys on the device or gets them from a backend and stores them in the Keystore or Keychain.
  severity: High
  test_type:
  - Code Review
  - Automated
  level: MASVS L1
