- id: MOB-WEBVIEW-002
  sheet: MOB
  category: WEBVIEW
  title: Check Android WebViews for content provider access
  objective: Finds WebViews that let script read content providers of the app.
  preconditions:
  - Decompiled app code.
  steps:
  - 'Android: Search the decompiled code for setAllowContentAccess and setJavaScriptEnabled.'
  - 'Android: Note that setAllowContentAccess defaults to true when the code does not set it.'
  - 'Android: List all content providers in the AndroidManifest.xml, also those that are not exported.'
  - 'Android: Hook the WebSettings setters at runtime. Record the values and backtraces.'
  - 'Android: Find out if the providers hold sensitive data.'
  - 'Android: Check if setAllowUniversalAccessFromFileURLs is true.'
  example: 'grep -rn "setAllowContentAccess\|setAllowUniversalAccessFromFileURLs" out/ ; aapt2 d xmltree app.apk --file AndroidManifest.xml | grep -A8 "E: provider" ; frida -U -f <pkg> -l hook_websettings.js'
  expected: WebViews that run JavaScript disable content access, or no content provider holds sensitive data. Universal access from file URLs stays off.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
  refs:
