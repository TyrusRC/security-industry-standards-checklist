- id: MOB-WEBVIEW-008
  sheet: MOB
  category: WEBVIEW
  title: Check that Android SafeBrowsing stays on for WebViews
  objective: Finds WebViews that skip the Safe Browsing check for known bad sites.
  preconditions:
  - Decoded APK.
  steps:
  - 'Android: Read the AndroidManifest.xml for the android.webkit.WebView.EnableSafeBrowsing meta-data.'
  - 'Android: Flag the value false.'
  - 'Android: Search the code for WebSettings.setSafeBrowsingEnabled(false).'
  - 'Android: Remember that the code setting wins over the manifest value.'
  example: aapt2 d xmltree app.apk --file AndroidManifest.xml | grep -B2 -A2 EnableSafeBrowsing ; grep -rn "setSafeBrowsingEnabled" out/
  expected: The manifest does not turn off SafeBrowsing and no code calls setSafeBrowsingEnabled with false.
