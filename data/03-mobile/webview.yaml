- id: MOB-WEBVIEW-007
  sheet: MOB
  category: WEBVIEW
  title: Check that WebViews load only trusted URLs
  objective: Finds WebViews that open attacker-controlled or arbitrary URLs.
  preconditions:
  - Android device with Frida server.
  steps:
  - 'Android: Find setWebViewClient calls and classes that extend WebViewClient.'
  - 'Android: Read shouldOverrideUrlLoading and shouldInterceptRequest. Check that they match the host against an allowlist.'
  - 'Android: Hook both methods at runtime. Record the URLs and the return values.'
  - 'iOS: Search for WKWebView load, loadFileURL, loadHTMLString and loadRequest calls. Trace the URL source.'
  - 'iOS: Check if a deep link, a pasteboard value or a network response can set the URL.'
  - Send the app a URL on an untrusted host and see if the WebView opens it.
  example: jadx -d out app.apk ; grep -rn "shouldOverrideUrlLoading\|shouldInterceptRequest\|setWebViewClient" out/ ; frida -U -f <pkg> -l hook_webviewclient.js ; r2 -A <app_binary> ; afl~WKWebView
  expected: WebViews open only URLs on allowed hosts. The code checks the full host, not a substring, and external links open in the system browser.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
