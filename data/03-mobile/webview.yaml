- id: MOB-WEBVIEW-011
  sheet: MOB
  category: WEBVIEW
  title: Check third-party scripts that run in WebViews
  objective: Finds WebView pages that load scripts from outside parties without limits.
  preconditions:
  - Intercepting proxy set up on the test device.
  steps:
  - List the pages that the app loads in WebViews and the remote scripts on each page.
  - Check if the script tags use Subresource Integrity with an integrity value.
  - Check if the vendor host sends CORS headers, as Subresource Integrity needs them.
  - Check if the page keeps third-party scripts away from sensitive fields and URL parameters.
  - Check if the page isolates untrusted tags in a sandboxed iframe.
  - Look at the vendor scripts for changes at regular times.
  example: 'Burp Suite: proxy the WebView traffic and list the script hosts ; curl -s https://<page> | grep -i "<script" ; openssl dgst -sha384 -binary script.js | openssl base64 -A'
  expected: Third-party scripts in WebViews carry integrity values or run in a sandbox. They cannot read sensitive page data.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS L1
  refs:
    mobile_top10:
    - M2:2024
    masvs:
    - MASVS-PLATFORM-2
    maswe:
    - MASWE-0035
    cheatsheet:
    - Third_Party_Javascript_Management_Cheat_Sheet
    cwe:
    - CWE-79
