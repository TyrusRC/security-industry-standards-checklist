- id: MOB-WEBVIEW-003
  sheet: MOB
  category: WEBVIEW
  title: Check JavaScript bridges between WebViews and native code
  objective: Finds bridges that give web content access to sensitive native functions or data.
  preconditions:
  - Decompiled APK and extracted IPA.
  steps:
  - 'Android: Search the code for addJavascriptInterface and setJavaScriptEnabled(true).'
  - 'Android: Read each object that the code registers. List its public methods that have @JavascriptInterface.'
  - 'iOS: Search the binary for WKUserContentController add(_:name:) and WKScriptMessageHandler classes.'
  - 'iOS: Read each userContentController(_:didReceive:) method. List the actions that a message can start.'
  - Check if a bridge method returns credentials, changes app state or runs a privileged action.
  - Check if the bridge checks the message input and the origin of the page.
  example: jadx -d out app.apk ; grep -rn "addJavascriptInterface\|@JavascriptInterface" out/ ; r2 -A <app_binary> ; afl~WKUserContentController ; izz~addScriptMessageHandler
  expected: The app exposes no sensitive native function or data through a WebView bridge. Each remaining bridge checks its input and serves only trusted pages.
  severity: High
  test_type:
  - Code Review
  level: MASVS L1
  refs:
