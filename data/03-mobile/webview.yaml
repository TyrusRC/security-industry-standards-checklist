- id: MOB-WEBVIEW-001
  sheet: MOB
  category: WEBVIEW
  title: Check Android WebViews for JavaScript with local file access
  objective: Finds WebViews where injected script can read local files and send them out.
  preconditions:
  - Android device with Frida server for the runtime part.
  steps:
  - 'Android: Search the decompiled code for WebView, WebSettings and setJavaScriptEnabled.'
  - 'Android: Read the values of setAllowFileAccess, setAllowFileAccessFromFileURLs and setAllowUniversalAccessFromFileURLs.'
  - 'Android: Read minSdkVersion. Below API 30 setAllowFileAccess defaults to true. Below API 16 the two file URL settings default to true.'
  - 'Android: Hook the setters at runtime to see the real values and backtraces.'
  - 'Android: Find the WebViews that load file:// content or handle sensitive data.'
  - 'Android: Look for a way to inject HTML or script into those WebViews.'
  example: jadx -d out app.apk ; grep -rn "setJavaScriptEnabled\|setAllowFileAccess\|setAllowUniversalAccessFromFileURLs\|setAllowFileAccessFromFileURLs" out/ ; frida -U -f <pkg> -l hook_websettings.js
  expected: No WebView enables JavaScript together with file access and file URL access. WebViews that load local content do not render untrusted content.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
  refs:
    mobile_top10:
    - M4:2024
    masvs:
    - MASVS-PLATFORM-2
    - MASVS-CODE-4
