- id: MOB-WEBVIEW-006
  sheet: MOB
  category: WEBVIEW
  title: Check iOS WKWebView local file access and file origin settings
  objective: Finds WKWebViews where script from file URLs can read other local files.
  preconditions:
  - Extracted IPA; jailbroken device for the runtime part.
  steps:
  - 'iOS: Search the binary for loadFileURL(_:allowingReadAccessTo:). Read the readAccessURL argument of each call.'
  - 'iOS: Flag read access to the whole Documents directory or the app container root.'
  - 'iOS: Search for allowFileAccessFromFileURLs and allowUniversalAccessFromFileURLs set with setValue:forKey:.'
  - 'iOS: Hook the setting calls at runtime. Record values and backtraces.'
  - 'iOS: Check if attacker-controlled input selects the loaded file or injects script.'
