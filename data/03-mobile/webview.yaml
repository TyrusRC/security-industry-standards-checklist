- id: MOB-WEBVIEW-010
  sheet: MOB
  category: WEBVIEW
  title: Check that the app cleans WebView storage with sensitive data
  objective: Finds WebView caches, cookies and storage that keep sensitive data after use.
  preconditions:
  - Android device. A debug build or root access to read the app data folder.
  steps:
  - 'Android: List the WebView storage settings that the app enables, such as cache, DOM storage and database.'
  - 'Android: Hook the cleanup calls, such as clearCache with includeDiskFiles, and record them.'
  - 'Android: Use the app with sensitive test data in the WebView. Close the app.'
  - 'Android: Pull the app_webview directory from the app data folder.'
  - 'Android: Search the files for the sensitive test data.'
  - 'Android: Check for the cleanup of cookies and WebStorage when the user logs out.'
  example: adb shell run-as <pkg> ls app_webview ; adb exec-out run-as <pkg> tar c app_webview | tar x ; grep -rl "<test data>" app_webview ; frida -U -f <pkg> -l hook_webview_cleanup.js
  expected: The app_webview folder holds no sensitive data after the app closes. The app calls the cleanup APIs for each storage area that it enables.
  severity: Medium
  test_type:
  - Manual
  level: MASVS L1
