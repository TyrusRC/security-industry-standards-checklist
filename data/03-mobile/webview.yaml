- id: MOB-WEBVIEW-005
  sheet: MOB
  category: WEBVIEW
  title: Check iOS WebViews for password fields in loaded HTML
  objective: Finds password inputs in web pages where script can read the typed value.
  preconditions:
  - Extracted IPA.
  steps:
  - 'iOS: Search the binary strings for type="password" and type=''password''.'
  - 'iOS: Check if the HTML loads into a WKWebView.'
  - 'iOS: Look for a WKUserScript that sends focus to a native secure text field.'
  - 'iOS: Check if third-party scripts or user content can run on the same page.'
  example: unzip app.ipa ; strings -a Payload/App.app/App | grep -i "type=.password" ; grep -rn "type=\"password\"" Payload/App.app/*.html
  expected: The app does not collect passwords in WebView HTML. If it does, a native input overlay reads the value and the page cannot read it.
