- id: MOB-WEBVIEW-004
  sheet: MOB
  category: WEBVIEW
  title: Check iOS evaluateJavaScript calls for data leaks to web content
  objective: Finds uses of evaluateJavaScript that expose sensitive data to script in the page.
  preconditions:
  - Extracted IPA binary.
  steps:
  - 'iOS: Search the binary for evaluateJavaScript:completionHandler: and list the enclosing functions.'
  - 'iOS: Find calls inside userContentController(_:didReceive:) that send bridge replies as a JavaScript callback.'
  - 'iOS: Find calls that assign sensitive data to innerHTML, textContent, innerText or value.'
  - 'iOS: Find calls that read DOM values, and check if they use the content world variant.'
  - 'iOS: Make sure the page cannot override the callback function or read the injected DOM data.'
  example: r2 -A <app_binary> ; afl~evaluateJavaScript ; axt sym.imp.evaluateJavaScript ; izz~innerHTML
  expected: The app does not pass sensitive data to the page through evaluateJavaScript. DOM reads use an isolated content world.
  severity: Medium
  test_type:
  - Code Review
  level: MASVS L1
