- id: MOB-PRIV-013
  sheet: MOB
  category: PRIV
  title: Check that the build is reproducible
  objective: Finds apps whose published binary cannot be matched to the claimed source code.
  preconditions:
  - Source code and build environment of the app.
  steps:
  - Find the source, the build scripts and the pinned toolchain versions for the release.
  - Build the app twice in the same environment. Compare the two outputs.
  - Look for timestamps, absolute paths and unstable ordering in the artifacts.
  - Look for published provenance for the release, such as a SLSA statement.
  - Check if the obfuscation settings give the same result on each build.
  example: sha256sum build1.apk build2.apk ; diffoscope build1.apk build2.apk
  expected: Builds of the same source in the same environment give identical binaries. The release has provenance that others can check.
  severity: Info
  test_type:
  - Manual
  - Config Review
  level: MASVS P
  refs:
    mobile_top10:
    - M2:2024
    masvs:
    - MASVS-PRIVACY-3
    maswe:
    - MASWE-0075
    cheatsheet:
