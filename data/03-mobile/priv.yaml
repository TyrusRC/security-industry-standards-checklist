- id: MOB-PRIV-015
  sheet: MOB
  category: PRIV
  title: Check privacy settings for control over data visibility
  objective: Finds apps that offer no fine control over who sees user data.
  preconditions:
  - Two test accounts.
  steps:
  - Open the privacy settings. List the controls for location, contacts and profile data.
  - Check that each data category has its own control.
  - Change each control. Check with a second test account that the change takes effect.
  - Check that help text explains each option.
  example: Manual test with two test accounts
  expected: Users control each data category on its own, and a change takes effect for other users and for sharing partners.
  severity: Low
  test_type:
  - Manual
