- id: MOB-PRIV-002
  sheet: MOB
  category: PRIV
  title: Check iOS purpose strings against the protected resources that the app uses
  objective: Finds access to protected resources without a clear and accurate purpose string.
  preconditions:
  - Extracted IPA and a test device.
  steps:
  - 'iOS: Read the Info.plist and list all UsageDescription keys with their strings.'
  - 'iOS: Search the binary for the APIs that request or use each protected resource.'
  - 'iOS: Flag an API with no matching key, and a string that is vague or wrong.'
  - 'iOS: Hook the protected resource APIs at runtime. Use all app flows.'
  - 'iOS: Check that each system prompt shows a purpose string that matches the visible feature.'
  example: plutil -p Payload/App.app/Info.plist | grep UsageDescription ; r2 -A <app_binary> ; afl~requestAuthorization ; frida -U -f <bundle_id> -l hook_protected_apis.js
  expected: Each protected resource has a specific and true purpose string. The app asks only when a visible feature needs the resource.
  severity: Low
  test_type:
  - Config Review
  - Manual
  level: MASVS P
  refs:
    mobile_top10:
    - M6:2024
    masvs:
