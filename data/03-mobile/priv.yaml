- id: MOB-PRIV-006
  sheet: MOB
  category: PRIV
  title: Check that iOS tracking domains appear in the privacy manifests
  objective: Finds tracking domains that the app contacts but does not declare.
  preconditions:
  - Extracted IPA and a test device.
  steps:
  - 'iOS: Extract every PrivacyInfo.xcprivacy file of the app, also those from SDKs and frameworks.'
  - 'iOS: Read NSPrivacyTrackingDomains in each file.'
  - 'iOS: Search the binary for strings of known tracking domains.'
  - 'iOS: Capture the traffic during use. List all contacted domains.'
  - 'iOS: Compare the domains found with a list of known trackers and with the declared domains.'
  example: find . -name PrivacyInfo.xcprivacy ; plutil -convert json -o PrivacyInfo.json PrivacyInfo.xcprivacy ; jq .NSPrivacyTrackingDomains PrivacyInfo.json ; strings -a App | grep -i -E "doubleclick|facebook|adjust"
  expected: The privacy manifests declare every tracking domain that the code contains or that the app contacts at runtime.
  severity: Low
  test_type:
  - Config Review
  - Manual
  level: MASVS P
