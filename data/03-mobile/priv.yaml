- id: MOB-PRIV-004
  sheet: MOB
  category: PRIV
  title: Check network traffic for personal data that the app does not declare
  objective: Finds personal data that leaves the device but is missing from the privacy declarations.
  preconditions:
  - Test device with a trusted proxy certificate.
  - Store privacy declarations of the app.
  steps:
  - Write down the sensitive and personal test data that you enter into the app.
  - Capture and decrypt the HTTPS traffic of the app while you use all workflows.
  - Search the traffic for the test data, also in background requests.
  - Compare the found data with the Data Safety section, the Privacy Nutrition Label and the privacy policy.
  - Find the code that sends each undeclared item.
  example: 'mitmproxy -s mitm_sensitive_logger.py ; Burp Suite: filter on the test data ; adb shell settings put global http_proxy <host>:8080'
  expected: All personal data in the traffic matches the store declarations and the privacy policy. The app sends nothing undeclared, also in the background.
  severity: Medium
  test_type:
  - Manual
  level: MASVS P
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PRIVACY-3
    - MASVS-PRIVACY-1
