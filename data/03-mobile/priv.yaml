- id: MOB-PRIV-011
  sheet: MOB
  category: PRIV
  title: Check that default settings expose the least data
  objective: Finds defaults that share more data or reach a wider audience than needed.
  steps:
  - Install the app fresh. Complete the first run without a change to any setting.
  - List the defaults for audience, visibility, retention, analytics and recipients.
  - Compare each default with the narrowest option that still gives the feature.
  - Check that the app asks the user before it widens an audience or shares more data.
  example: Manual review of the first-run flow and the privacy settings screen
  expected: Defaults use the narrowest audience, the least data and the shortest retention that the feature allows.
  severity: Low
  test_type:
  - Manual
  level: MASVS P
  refs:
    mobile_top10:
    - M6:2024
