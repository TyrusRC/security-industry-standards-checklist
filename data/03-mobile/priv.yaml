- id: MOB-PRIV-005
  sheet: MOB
  category: PRIV
  title: Check third-party SDKs for sensitive data sharing and consent
  objective: Finds SDKs that receive personal data, or start to collect before the user consents.
  preconditions:
  - Fresh install with no consent given.
  steps:
  - 'Android: List the SDKs in the app. Find the APIs that send user data, such as analytics events and user properties.'
  - 'Android: Hook these API calls at runtime. Record the arguments and backtraces.'
  - Start the app for the first time. Capture the traffic before you answer any consent prompt.
  - Look for SDK requests that carry identifiers or personal data before consent.
  - Check that each SDK follows the consent signal and the data that the app declares.
  example: 'jadx -d out app.apk ; grep -rn "logEvent\|setUserProperty\|setUserId" out/ ; frida -U -f <pkg> -l hook_sdk_calls.js ; Burp Suite: capture first-start traffic'
  expected: SDKs receive only declared data, and only after consent. No SDK collects data before the user decides.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS P
