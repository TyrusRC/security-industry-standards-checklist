- id: MOB-PRIV-007
  sheet: MOB
  category: PRIV
  title: Check use of identifiers for user tracking
  objective: Finds persistent identifiers that let parties follow users across apps and services.
  steps:
  - Search the code and SDKs for the Advertising ID, ANDROID_ID, serial numbers, MAC addresses and identifierForVendor.
  - Look for non-resettable identifiers and for identifiers that join data from different services.
  - Check that the app asks for tracking consent where the platform needs it, and respects an opt-out.
  - Reset the identifier in the device settings. Check that the app does not link the new value to the old one.
  - Check if privacy-preserving APIs, such as Play Integrity or DeviceCheck, can replace an identifier.
  example: 'grep -rn "AdvertisingIdClient\|ANDROID_ID\|getSerial\|identifierForVendor\|ASIdentifierManager" out/ ; Burp Suite: look for identifiers in the requests'
  expected: The app uses resettable or app-scoped identifiers only with consent. It does not link identifiers across services.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS P
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PRIVACY-2
    maswe:
    - MASWE-0068
    cwe:
    - CWE-359
  sources_read:
  - sources/masvs/controls-master/MASVS-PRIVACY-2.md
  - sources/mastg/files/MASWE__weaknesses_MASVS-PRIVACY_MASWE-0068.md
  - sources/repos/www-project-mobile-top-10/2023-risks/m6-inadequate-privacy-controls.md
- id: MOB-PRIV-008
  sheet: MOB
  category: PRIV
  title: Check that the app anonymizes personal data before sharing it
  objective: Finds personal data that the app sends in a form that identifies the user.
  steps:
  - Capture the data that the app sends to its server, to SDKs and to AI services.
  - Look for user IDs, names, e-mail addresses, precise location and metadata such as Exif.
  - Check that hashes of identifiers use a secret key and are not plain stable hashes.
  - Check that the app does not store the key with the pseudonymized data.
  - Check that the app redacts sensitive fields before it sends data to AI services.
  example: 'Burp Suite: inspect request bodies ; exiftool uploaded_image.jpg ; sha256sum <identifier> and compare with the sent value'
  expected: The app removes or transforms identifiers before it collects or shares data. Pseudonyms are keyed, and AI services get redacted data.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: MASVS P
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PRIVACY-2
    maswe:
    - MASWE-0067
    cheatsheet:
