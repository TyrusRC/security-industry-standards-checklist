- id: MOB-PRIV-009
  sheet: MOB
  category: PRIV
  title: Check for privacy-preserving platform alternatives
  objective: Finds features that expose more user data than a platform alternative would.
  steps:
  - Look for login flows in embedded WebViews. Check if the app uses ASWebAuthenticationSession or Custom Tabs.
  - Look for broad photo, camera or file permissions where a system picker would work.
  - Look for user data that goes to a remote AI service when on-device processing is possible.
  - Check that the app asks for broad access only when the feature needs it.
  example: grep -rn "ACTION_OPEN_DOCUMENT\|PickVisualMedia\|PHPickerViewController\|ASWebAuthenticationSession\|CustomTabsIntent" out/
  expected: The app uses system pickers, system authentication sessions and on-device processing where they can support the feature.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: MASVS P
  refs:
    mobile_top10:
