- id: MOB-PRIV-003
  sheet: MOB
  category: PRIV
  title: Check iOS entitlements for capabilities that the app does not need
  objective: Finds signed capabilities that widen data access without a user-visible reason.
  preconditions:
  - Extracted IPA and a test device.
  steps:
  - 'iOS: Extract the entitlements of the main binary and of each app extension.'
  - 'iOS: Search the binary for APIs, shared containers and identifiers that relate to each entitlement.'
  - 'iOS: Hook entitlement-backed APIs at runtime. Use all app flows.'
  - 'iOS: Match each entitlement to a visible app feature.'
  - 'iOS: Flag entitlements for health, shared storage, iCloud or associated domains with no use.'
  example: rabin2 -OC App ; codesign -d --entitlements :- App.app ; frida -U -f <bundle_id> -l hook_entitlement_apis.js
  expected: Each signed entitlement links to a visible feature. The app signs no entitlement that widens data access without need.
  severity: Low
  test_type:
  - Config Review
  - Manual
  level: MASVS P
