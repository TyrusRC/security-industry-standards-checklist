- id: MOB-PRIV-014
  sheet: MOB
  category: PRIV
  title: Check that users can delete, export and change their data
  objective: Finds apps that give users no way to manage their personal data.
  preconditions:
  - Test account.
  steps:
  - Open the account and privacy settings. Look for delete, export, change and opt-out options.
  - Delete the account and the data of a test user. Check the backend for remaining data.
  - Export the data of the test user. Check that the export is complete.
  - Check that granular opt-outs for data collection and sharing exist.
  - Check that the app removes data automatically when the retention period ends.
  example: Manual test with a test account ; compare backend records before and after the deletion
  expected: Users can delete, export and change their data and opt out of collection from inside the app. The deletion reaches the backend.
  severity: Medium
  test_type:
  - Manual
  level: MASVS P
  refs:
    mobile_top10:
