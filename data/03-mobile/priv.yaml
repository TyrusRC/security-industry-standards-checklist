- id: MOB-PRIV-016
  sheet: MOB
  category: PRIV
  title: Check that consent is explicit, informed and renewed on change
  objective: Finds apps that process personal data without clear prior consent.
  preconditions:
  - Two app versions where the later one collects more data.
  steps:
  - Start a fresh install. Look at each consent prompt before any data collection.
  - Check that consent is not bundled into the terms of service and is not implied.
  - Check that the text names the data, the purpose and the effect.
  - Withdraw consent in the settings. Check that collection stops in the traffic.
  - Install an update that collects more data. Check that the app asks for consent again.
  example: 'Burp Suite: capture traffic before and after consent and after withdrawal ; compare two app versions'
  expected: The app asks for explicit, specific consent before it collects data. Withdrawal stops collection, and new data collection needs new consent.
  severity: Medium
  test_type:
  - Manual
  level: MASVS P
