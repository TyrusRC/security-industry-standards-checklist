- id: MOB-PRIV-001
  sheet: MOB
  category: PRIV
  title: Check Android permissions for minimal, justified and revocable access
  objective: Finds permissions that the app does not need or does not explain to the user.
  preconditions:
  - APK and a test device.
  steps:
  - 'Android: Read the AndroidManifest.xml and list all declared permissions.'
  - 'Android: Compare the list with the Android list of dangerous permissions.'
  - 'Android: Match each dangerous permission to a visible app feature.'
  - 'Android: Look for permissions that have a less intrusive option, such as coarse location or a picker.'
  - 'Android: Start the app. Check that it asks for each permission at the time of use and shows a rationale.'
  - 'Android: Check that the app drops permissions it no longer needs.'
  example: aapt2 d permissions app.apk ; aapt d permissions app.apk ; adb shell dumpsys package <pkg> | grep -A30 "requested permissions" ; adb shell pm revoke <pkg> <permission>
  expected: The app declares only permissions that its features need. It asks for each one when needed, explains why, and lets the user revoke it.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  level: MASVS P
  refs:
    mobile_top10:
    - M6:2024
    masvs:
    - MASVS-PRIVACY-1
    mastg:
    - MASTG-TEST-0254
    - MASTG-TEST-0255
    - MASTG-TEST-0256
    - MASTG-TEST-0257
    maswe:
    - MASWE-0066
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    cwe:
    - CWE-250
