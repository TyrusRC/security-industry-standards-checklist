- id: MOB-PRIV-010
  sheet: MOB
  category: PRIV
  title: Check that privacy-relevant actions show scope and consequences
  objective: Finds actions that share data without a clear view of what, with whom and for how long.
  steps:
  - List actions that share or publish user data, such as share, export, post and invite.
  - Open each action. Look for the affected data, metadata, destination and audience.
  - Check that the user can review and confirm the action before it completes.
  - Check that the app shows the resulting privacy state afterward and allows reversal.
  example: Manual review with screenshots of each sharing flow
  expected: Each privacy-relevant action shows the data, the audience and the effect before it completes, and the user can review and undo it.
  severity: Low
  test_type:
  - Manual
  level: MASVS P
