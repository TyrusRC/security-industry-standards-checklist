- id: MOB-NETWORK-015
  sheet: MOB
  category: NETWORK
  title: Check that a MITM proxy cannot read first-party HTTPS traffic
  objective: Finds first-party endpoints with no effective pinning, whatever the implementation is.
  steps:
  - Install the app on a test device and set up an interception proxy with its CA trusted by the system.
  - Use every workflow of the app.
  - Look at the proxy log for first-party domains whose HTTPS traffic it decrypted.
  - Watch the device log for pin check failures when pinning is active.
  - Ignore unrelated third-party domains.
  example: 'burp / mitmproxy --mode regular; adb shell settings put global http_proxy <host>:8080; adb logcat | grep -i "Pin verification failed"; iOS: iproxy 2222 22; ssh -R 8080:localhost:8080 mobile@localhost -p 2222; do not disable pinning in this test'
  expected: The proxy cannot decrypt traffic to first-party domains. The app refuses the connection with an untrusted CA.
  severity: Medium
  test_type:
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M5:2024
    masvs:
    - MASVS-NETWORK-2
    mastg:
    - MASTG-TEST-0244
    maswe:
    - MASWE-0028
    cheatsheet:
    - Pinning_Cheat_Sheet
    cwe:
    - CWE-295
  notes: MASTG-TEST-0244 is written for Android. The same MITM check applies to iOS with the proxy set up as in MASTG-TECH-0063.
