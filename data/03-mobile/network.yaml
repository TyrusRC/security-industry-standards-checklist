- id: MOB-NETWORK-014
  sheet: MOB
  category: NETWORK
  title: Check that Android certificate pins have not expired
  objective: Finds NSC pins with a past expiration date that Android no longer enforces.
  preconditions:
  - Android only.
  steps:
  - Read the Network Security Configuration and list each pin-set with its expiration attribute.
  - Compare each date with the current date.
  - Compare the domains with the list of first-party domains that the app uses.
  - Check that the app still connects to those domains.
  example: apktool d -s -f app.apk -o out; grep -n "pin-set\|expiration" out/res/xml/network_security_config.xml; date +%F
  expected: No pin-set for a first-party domain has an expiration date in the past.
  severity: Medium
  test_type:
  - Config Review
  level: MASVS L2
