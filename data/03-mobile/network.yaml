- id: MOB-NETWORK-002
  sheet: MOB
  category: NETWORK
  title: Check that the app sends no cleartext HTTP traffic
  objective: Finds hardcoded http:// URLs and real cleartext connections that carry app data.
  steps:
  - Search the unpacked app and its libraries for http:// URLs.
  - Follow each URL in the code and see if the app uses it to open a connection.
  - Set up an interception proxy or a network capture for the device.
  - Use every workflow of the app and look for cleartext HTTP or other cleartext protocols.
  - Use a capture tool when the app does not work with a proxy.
  - Keep only traffic that comes from the target app.
  example: apktool d app.apk; grep -rnoE "http://[^\" ]+" out/ src/; unzip app.ipa; strings -n 8 Payload/App.app/App | grep -E "^http://"; adb shell "tcpdump -i any -w /data/local/tmp/cap.pcap"; wireshark -r cap.pcap -Y "http || (tcp && !tls)"; rvictl -s <UDID> (iOS capture on macOS); mitmproxy --mode regular
  expected: The capture shows no cleartext traffic from the app. All connections use TLS.
  severity: Medium
  test_type:
  - Manual
  - Automated
  level: MASVS L1
  refs:
    mobile_top10:
    - M5:2024
    masvs:
    - MASVS-NETWORK-1
    mastg:
    - MASTG-TEST-0233
    - MASTG-TEST-0321
    - MASTG-TEST-0236
    maswe:
    - MASWE-0026
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    - Transport_Layer_Security_Cheat_Sheet
    cwe:
    - CWE-319
  see:
  - WEB-TLS-005
  - WEB-TLS-006
