- id: MOB-NETWORK-004
  sheet: MOB
  category: NETWORK
  title: Check that code sets no TLS version below 1.2
  objective: Finds code that enables TLS 1.0 or TLS 1.1 on Android and iOS.
  steps:
  - 'Android: Search for SSLContext.getInstance("TLSv1.1") and for SSLSocket.setEnabledProtocols.'
  - 'Android: Search for OkHttp ConnectionSpec.COMPATIBLE_TLS and ConnectionSpec.Builder.tlsVersions.'
  - 'iOS: Search for tlsMinimumSupportedProtocolVersion and tlsMinimumSupportedProtocol in URLSessionConfiguration.'
  - 'iOS: Search for sec_protocol_options_set_min_tls_protocol_version and the max version function in Network framework code.'
  - Flag the values TLSv1.0, TLSv1.1, kTLSProtocol1 and kTLSProtocol11.
  example: jadx -d src app.apk; grep -rnE "TLSv1(\.[01])?\"|setEnabledProtocols|COMPATIBLE_TLS|tlsVersions" src/; r2 -qc "aaa; afl~tls_protocol_version; afl~sec_protocol_options_set" Payload/App.app/App; frida-trace -U -f <bundle> -i sec_protocol_options_set_min_tls_protocol_version
  expected: The app enables only TLS 1.2 and TLS 1.3. No code sets a lower minimum version or a lower maximum version.
  severity: Medium
  test_type:
  - Code Review
  - Automated
  level: MASVS L1
  refs:
    mobile_top10:
    - M5:2024
