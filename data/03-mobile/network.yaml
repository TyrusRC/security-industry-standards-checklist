- id: MOB-NETWORK-010
  sheet: MOB
  category: NETWORK
  title: Check that WebViews do not ignore TLS certificate errors
  objective: Finds WebView code that proceeds after a certificate error and so allows MITM attacks.
  steps:
  - 'Android: Search for onReceivedSslError overrides in WebViewClient classes.'
  - 'Android: Flag handler.proceed() calls that do not check the error, and catch blocks that do not call cancel().'
  - 'iOS: Search for WKNavigationDelegate webView(_:didReceive:completionHandler:) implementations.'
  - 'iOS: Flag code that accepts the server trust credential without a successful trust evaluation.'
  - Load a page with an invalid certificate in the WebView and see if it loads.
  example: jadx -d src app.apk; grep -rn "onReceivedSslError\|proceed()" src/; r2 -qc "aaa; axt sym.imp.SecTrustEvaluateWithError; axt sym.imp.SecTrustEvaluateAsyncWithError" Payload/App.app/App; mitmproxy --mode regular
  expected: WebViews cancel loads after certificate errors. No code accepts an untrusted server trust.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
