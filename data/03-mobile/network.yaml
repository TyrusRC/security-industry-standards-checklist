- id: MOB-NETWORK-008
  sheet: MOB
  category: NETWORK
  title: Check that Android code checks server host names
  objective: Finds SSLSocket use without host name checks and HostnameVerifier code that accepts any host.
  preconditions:
  - Android only.
  steps:
  - Search the code for SSLSocket and SSLSocketFactory.
  - Check that the code calls a HostnameVerifier for each SSLSocket connection.
  - Search for HostnameVerifier implementations and read their host check methods.
  - Flag methods that return true for all hosts, use broad wildcard rules or skip some channels.
  - Present a valid certificate of another host with a MITM proxy and see if the app connects.
  example: jadx -d src app.apk; grep -rnE "SSLSocket|HostnameVerifier|ALLOW_ALL_HOSTNAME_VERIFIER|setHostnameVerifier" src/; mitmproxy --mode regular --certs *=wrong-host.pem; frida-trace -U -f <package> -j "javax.net.ssl.HostnameVerifier!*"
  expected: The app checks the server host name against the certificate on every TLS channel, including SSLSocket. The MITM test fails to connect.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
