- id: MOB-NETWORK-003
  sheet: MOB
  category: NETWORK
  title: Check that low-level iOS networking APIs use TLS
  objective: Finds Network framework, CFNetwork and BSD socket connections that skip App Transport Security and send cleartext.
  preconditions:
  - iOS only. ATS does not cover these APIs.
  steps:
  - Extract the binaries and search for NWConnection, CFSocketStream, CFHTTPStream and the BSD socket functions.
  - Look at each location and see if the connection uses TLS, for example .tls in NWParameters.
  - Capture the traffic of the app and look for non-TLS connections.
  example: unzip app.ipa; r2 -qc "aaa; afl~NWConnection; afl~CFStream; afl~connect" Payload/App.app/App; strings Payload/App.app/App | grep -E "NWParameters|NWProtocolTLS"; frida-trace -U -f <bundle> -i connect -i send
  expected: Every low-level connection uses TLS with a safe configuration. No connection sends sensitive data in cleartext.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
  refs:
    mobile_top10:
    - M5:2024
    masvs:
    - MASVS-NETWORK-1
    mastg:
