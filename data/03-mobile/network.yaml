- id: MOB-NETWORK-005
  sheet: MOB
  category: NETWORK
  title: Check that ATS exceptions do not weaken TLS policy
  objective: Finds Info.plist exceptions that turn off ATS or allow TLS 1.0, TLS 1.1 or no forward secrecy.
  preconditions:
  - iOS only.
  steps:
  - Convert Info.plist to JSON and read NSAppTransportSecurity.
  - Flag NSAllowsArbitraryLoads set to true.
  - Flag any NSExceptionMinimumTLSVersion of TLSv1.0 or TLSv1.1.
  - Flag any NSExceptionRequiresForwardSecrecy set to false.
  - Look at the scope of each exception, especially with NSIncludesSubdomains.
  example: unzip app.ipa; plutil -convert json -o Info.json Payload/App.app/Info.plist; jq ".NSAppTransportSecurity.NSExceptionDomains" Info.json
  expected: The app sets no weak TLS exceptions. Required exceptions are narrow, justified and apply only to named domains.
  severity: Medium
  test_type:
  - Config Review
  - Automated
  level: MASVS L1
  refs:
    mobile_top10:
    - M5:2024
    - M8:2024
