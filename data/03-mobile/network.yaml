- id: MOB-NETWORK-012
  sheet: MOB
  category: NETWORK
  title: Check that the Android app updates the GMS security provider
  objective: Finds apps on Android that skip the security provider update and so keep known TLS flaws.
  preconditions:
  - Android only.
  steps:
  - Search the code for ProviderInstaller.installIfNeeded and installIfNeededAsync.
  - Check that the call runs before the first network connection.
  - Check that the code handles errors and does not continue silently.
  example: jadx -d src app.apk; grep -rn "ProviderInstaller\|installIfNeeded" src/
  expected: The app calls ProviderInstaller before any network connection and handles update errors.
  severity: Low
  test_type:
  - Code Review
  level: MASVS L1
