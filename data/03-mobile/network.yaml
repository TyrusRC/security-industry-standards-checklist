- id: MOB-NETWORK-011
  sheet: MOB
  category: NETWORK
  title: Check that Android does not trust user-installed CAs
  objective: Finds apps that trust CA certificates that the user or an attacker adds to the device.
  preconditions:
  - Android only. Debug builds may trust user CAs on purpose; test the release build.
  steps:
  - Read minSdkVersion in the manifest and flag values below 24.
  - Read the Network Security Configuration and look for <certificates src="user" /> in trust-anchors.
  - Install a proxy CA as a user certificate on a test device.
  - Start the app and see if it connects through the proxy.
  example: apktool d -s -f app.apk -o out; grep minSdkVersion out/AndroidManifest.xml out/apktool.yml; grep -n "certificates src" out/res/xml/network_security_config.xml; adb push burp-ca.der /sdcard/Download/ (install as a user CA in Settings)
  expected: The app uses a minSdkVersion of 24 or higher and trusts no user CAs. The proxy cannot read the traffic.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  level: MASVS L1
