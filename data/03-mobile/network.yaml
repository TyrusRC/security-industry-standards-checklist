- id: MOB-NETWORK-006
  sheet: MOB
  category: NETWORK
  title: Check the TLS settings of embedded and third-party network stacks
  objective: Finds bundled OpenSSL, BoringSSL, mbedTLS, curl or gRPC code that weakens TLS and ignores ATS.
  preconditions:
  - iOS only in MASTG. Use the same method for Android native libraries.
  steps:
  - List the bundled libraries and frameworks in the IPA.
  - Search for TLS library symbols, such as SSL_CTX_set_min_proto_version and SSL_CTX_set_verify.
  - Look at the code at each location and note the minimum TLS version and cipher list.
  - Flag disabled certificate verification and custom trust stores with no validation.
  - Compare the results with the settings of the platform stack.
  example: 'unzip -o app.ipa; find Payload -type d \( -name "*.framework" -o -name "*.appex" \); r2 -qc "aaa; afl~SSL_CTX" Payload/App.app/Frameworks/<lib>.framework/<lib>; frida-trace -U -f <bundle> -i SSL_CTX_set_min_proto_version -i SSL_CTX_set_verify; jadx -d src app.apk (Android native libraries: strings lib/*/*.so | grep -i ssl)'
  expected: Every embedded stack allows only TLS 1.2 and higher, uses strong cipher suites and checks certificates against a valid trust store.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
  refs:
    mobile_top10:
    - M5:2024
    masvs:
    - MASVS-NETWORK-1
