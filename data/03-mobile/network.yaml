- id: MOB-NETWORK-009
  sheet: MOB
  category: NETWORK
  title: Check that custom trust checks reject untrusted certificates
  objective: Finds custom TrustManager and URLSession delegate code that accepts every certificate.
  steps:
  - 'Android: Search for X509TrustManager and checkServerTrusted implementations.'
  - 'Android: Flag empty methods, ignored exceptions, checkValidity-only checks and empty getAcceptedIssuers results.'
  - 'iOS: Search for urlSession(_:didReceive:completionHandler:) and cross-references to SecTrustEvaluateWithError.'
  - 'iOS: Flag code that calls completionHandler with useCredential and URLCredential(trust:) before it evaluates the trust.'
  - Send a self-signed certificate with a MITM proxy and see if the app accepts it.
  example: jadx -d src app.apk; grep -rn "checkServerTrusted\|X509TrustManager\|getAcceptedIssuers" src/; r2 -qc "aaa; axt sym.imp.SecTrustEvaluateWithError" Payload/App.app/App; strings Payload/App.app/App | grep -i "URLAuthenticationChallenge"; mitmproxy --mode regular
  expected: The app uses the platform trust checks. Custom code rejects bad certificates and the self-signed MITM test fails.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: MASVS L1
  refs:
