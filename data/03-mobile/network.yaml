- id: MOB-NETWORK-013
  sheet: MOB
  category: NETWORK
  title: Check that first-party domains use certificate pinning in app configuration
  objective: Finds first-party endpoints that rely only on the default CA trust and so allow MITM by a rogue CA.
  steps:
  - List the first-party domains that the app uses for core and security functions.
  - 'Android: Read the Network Security Configuration and list domain-config entries with a pin-set.'
  - 'iOS: Read Info.plist and look for NSPinnedDomains in NSAppTransportSecurity.'
  - Compare the pinned domains with the first-party list.
  - Check that the app connects to the unpinned domains, and look for other pinning code.
  example: apktool d -s -f app.apk -o out; xmlstarlet sel -t -c "//domain-config[pin-set]" out/res/xml/network_security_config.xml; unzip app.ipa; plutil -convert json -o Info.json Payload/App.app/Info.plist; jq ".NSAppTransportSecurity.NSPinnedDomains" Info.json; strings -n 8 Payload/App.app/App | grep -E "^https://"
  expected: Every relevant first-party domain has a pin in the NSC or in ATS, or another documented pinning method covers it.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  level: MASVS L2
  refs:
    mobile_top10:
    - M5:2024
    masvs:
    - MASVS-NETWORK-2
    mastg:
    - MASTG-TEST-0242
    - MASTG-TEST-0385
    maswe:
    - MASWE-0028
    cheatsheet:
    - Pinning_Cheat_Sheet
    - Mobile_Application_Security_Cheat_Sheet
    cwe:
    - CWE-295
  notes: Pinning is a risk-based choice. Do not report unpinned third-party domains. Confirm that the app really connects to the domain. Another pinning method (TrustManager, library) means the NSC result is not covered, not a confirmed absence of pinning.
