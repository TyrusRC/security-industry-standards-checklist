- id: MOB-NETWORK-001
  sheet: MOB
  category: NETWORK
  title: Check that app configuration does not allow cleartext traffic
  objective: Finds Android and iOS settings that let the app send HTTP traffic that anyone on the network can read.
  steps:
  - 'Android: Read AndroidManifest.xml and note android:usesCleartextTraffic and android:networkSecurityConfig.'
  - 'Android: Read the Network Security Configuration and flag cleartextTrafficPermitted="true" in base-config or domain-config.'
  - 'iOS: Read Info.plist and note the NSAppTransportSecurity dictionary.'
  - 'iOS: Flag NSAllowsArbitraryLoads, NSAllowsArbitraryLoadsInWebContent, NSAllowsArbitraryLoadsForMedia, NSAllowsLocalNetworking and NSExceptionAllowsInsecureHTTPLoads.'
  - Find out if each exception is needed for core app functions and has a justification.
  example: apktool d -s -f app.apk -o out; grep -E "usesCleartextTraffic|networkSecurityConfig" out/AndroidManifest.xml; grep -i cleartextTrafficPermitted out/res/xml/network_security_config.xml; unzip app.ipa; plutil -convert json -o Info.json Payload/App.app/Info.plist; jq .NSAppTransportSecurity Info.json
  expected: The app permits no cleartext traffic. Exceptions exist only for needed domains with a documented reason.
  severity: Medium
  test_type:
  - Config Review
  - Automated
  level: MASVS L1
  refs:
    mobile_top10:
    - M5:2024
    - M8:2024
    masvs:
    - MASVS-NETWORK-1
    mastg:
    - MASTG-TEST-0235
    - MASTG-TEST-0322
    maswe:
    - MASWE-0026
    cheatsheet:
    - Mobile_Application_Security_Cheat_Sheet
    - Transport_Layer_Security_Cheat_Sheet
    cwe:
    - CWE-319
  see:
  - WEB-TLS-005
  notes: On Android the flag usesCleartextTraffic is ignored when a Network Security Configuration exists. Read MASTG-TEST-0235 before you report.
