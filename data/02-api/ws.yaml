  - sources/repos/CheatSheetSeries/cheatsheets/WebSocket_Security_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Input_Validation_Cheat_Sheet.md
- id: API-WS-003
  sheet: API
  category: WS
  title: Test connection limits, idle timeouts and backpressure
  objective: Finds sockets that let one client hold many connections or fill server memory.
  preconditions:
  - Test environment only.
  steps:
  - Open many connections from one user and one IP.
  - Leave connections idle. Measure the time until the server closes them.
  - Send data fast and read slowly.
  - Check the heartbeat frames.
  example: Python script with asyncio and websockets; Artillery WebSocket engine; monitor server memory.
  expected: The server limits connections per user. Idle and dead connections close. Memory use stays bound under fast producers.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - WebSocket_Security_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-400
    attack:
    - T1499
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption.md
  - sources/repos/CheatSheetSeries/cheatsheets/WebSocket_Security_Cheat_Sheet.md
- id: API-WS-004
  sheet: API
  category: WS
  title: Check WebSocket session end, replay protection and logs
  objective: Finds sockets that stay open after logout or token expiry and leave no audit trail.
  steps:
  - Open a connection. Log out or let the token expire.
  - Check if the connection closes and if messages still work.
  - Replay a captured message.
  - Look in the logs for connect, close, denied and flood events.
  example: wscat with a recorded message; Burp WebSockets history; log search for the connection ID.
  expected: Connections close at logout and token expiry. Messages use nonces or timestamps. Security events are logged without secrets.
  severity: Medium
  test_type: Manual
  refs:
    cheatsheet:
    - WebSocket_Security_Cheat_Sheet
    cwe:
    - CWE-294
    - CWE-778
  see:
  - WEB-HTTP-009
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/WebSocket_Security_Cheat_Sheet.md
