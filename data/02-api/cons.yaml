- id: API-CONS-001
  sheet: API
  category: CONS
  title: Send hostile data from a mocked third-party API
  objective: Finds code that trusts data from other APIs and passes it to databases or downstream systems.
  steps:
  - Find the third-party APIs that the service calls and the fields it stores or uses.
  - Put a mock between the service and the provider. Return injection test strings in each field.
  - Check the database, logs and downstream calls for the strings.
  - Return unexpected types, extra fields and very long values.
  example: mitmproxy reverse mode or WireMock as the provider; strings for SQL, NoSQL and HTML in the mocked JSON.
  expected: The service validates data from other APIs like user input. Test strings are rejected or handled as data.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API10:2023
    cheatsheet:
    - Input_Validation_Cheat_Sheet
    cwe:
    - CWE-20
    - CWE-89
    attack:
    - T1190
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xaa-unsafe-consumption-of-apis.md
  - sources/repos/CheatSheetSeries/cheatsheets/Input_Validation_Cheat_Sheet.md
- id: API-CONS-002
  sheet: API
  category: CONS
  title: Test if the service follows redirects from third-party APIs
  objective: Finds clients that repeat sensitive requests to a new host after a redirect.
  steps:
  - Set a mock provider that answers a POST request with 308 and a Location of another host.
  - Send a request that holds test data.
  - Look at the second host for the same request body and headers.
  - Read the redirect option of the HTTP client.
  example: 'WireMock stub returning 308 with Location: https://collector.test/; code search for follow_redirects and FollowRedirects.'
  expected: The service does not follow redirects, or it follows them only to an allowlist and removes secrets from the new request.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API10:2023
    cheatsheet:
    - Server_Side_Request_Forgery_Prevention_Cheat_Sheet
    cwe:
    - CWE-601
    - CWE-200
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xaa-unsafe-consumption-of-apis.md
  - sources/repos/CheatSheetSeries/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.md
- id: API-CONS-003
  sheet: API
  category: CONS
  title: Check TLS and certificate checks on calls to partner and provider APIs
  objective: Finds outbound calls to other APIs that use clear text or skip certificate checks.
  steps:
  - List all outbound API calls and the SDK defaults of each provider from the code and the configuration.
  - Look for http:// URLs and options that turn off certificate checks.
  - Run the service against a mock with an untrusted certificate. Check that the call fails.
  - Try to register a partner callback URL that uses http://.
  example: grep -rn 'verify=False\|InsecureSkipVerify\|rejectUnauthorized' src/; mitmproxy with a self-signed certificate.
  expected: All calls to other APIs use TLS and check the server certificate. A call with a bad certificate fails. Callback URLs must use https://.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: ASVS L2
  refs:
    api_top10:
    - API10:2023
    asvs:
    - V12.3.2
    cheatsheet:
    - Web_Service_Security_Cheat_Sheet
    cwe:
    - CWE-319
    - CWE-295
  see:
  - WEB-TLS-010
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xaa-unsafe-consumption-of-apis.md
  - sources/repos/CheatSheetSeries/cheatsheets/Web_Service_Security_Cheat_Sheet.md
