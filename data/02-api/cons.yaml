- id: API-CONS-004
  sheet: API
  category: CONS
  title: Test timeouts and size limits for third-party responses
  objective: Finds services that hang or use much memory when a provider is slow or sends large data.
  preconditions:
  - Test environment only.
  steps:
  - Make a mock provider that answers after a long delay.
  - Make the mock send a very large response body.
  - Watch the threads, memory and response time of the service.
  - Check the circuit breaker and the fallback.
  example: toxiproxy with a latency toxic; WireMock fixed delay; a 1 GB response stream from the mock.
  expected: Every outbound call has a timeout and a size limit. The service stays available and fails in a safe way.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API10:2023
    - API4:2023
    asvs:
    - V16.5.2
    cwe:
    - CWE-400
    - CWE-770
  see:
  - WEB-ERR-003
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xaa-unsafe-consumption-of-apis.md
  - sources/repos/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: API-CONS-005
  sheet: API
  category: CONS
  title: Check that inbound callbacks and partner messages are authenticated
  objective: Finds endpoints that trust calls from partners and do not check who sent them.
  steps:
  - List the endpoints that third parties call, such as webhooks and callbacks.
  - Send a call with no signature, a wrong signature and an old timestamp.
  - Replay a valid call.
  - Check the payload against the schema.
  example: curl -X POST https://api.example/hooks/payment with a changed X-Signature header; Postman pre-request script for HMAC.
  expected: The service accepts only signed and fresh calls from known partners. It validates the payload like user input.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API10:2023
    cheatsheet:
    - Web_Service_Security_Cheat_Sheet
    cwe:
    - CWE-345
    - CWE-20
  see:
  - WEB-HTTP-003
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xaa-unsafe-consumption-of-apis.md
  - sources/repos/CheatSheetSeries/cheatsheets/Web_Service_Security_Cheat_Sheet.md
- id: API-CONS-006
  sheet: API
  category: CONS
  title: Review the security of providers and the data sent to them
  objective: Finds integrations added without a check of the provider or of the data shared.
  steps:
  - List the providers and the data fields sent to each.
  - 'Read the provider assessment: transport, authentication, validation and cost limits.'
  - Make sure the service sends only needed fields.
  - Check where the provider keys are stored and who can read them.
  example: Review of vendor questionnaires; secret store audit; data field list per provider.
  expected: Each provider has a security assessment. The service sends only the data that the provider needs.
  severity: Low
  test_type: Config Review
  refs:
    api_top10:
    - API10:2023
    - API9:2023
    cwe:
    - CWE-200
  see:
  - WEB-DATA-004
  sources_read:
