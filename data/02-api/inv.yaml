- id: API-INV-005
  sheet: API
  category: INV
  title: Compare the API description with the real behavior
  objective: Finds undocumented endpoints, parameters and security rules in the real API.
  steps:
  - Import the OpenAPI file into a proxy or a test tool.
  - Call endpoints that the file does not list and send fields that it does not define.
  - Build a table of the effective security rules for each operation, with overrides of the global rule.
  - Write down each difference between file and behavior.
  example: ZAP OpenAPI add-on; Burp OpenAPI Parser; Schemathesis; jq on the security and paths keys of the file.
  expected: The description lists all endpoints, parameters, authentication, errors and limits that the API has. No difference remains.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API9:2023
    wstg:
    - WSTG-APIT-01
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-1059
    capec:
    - CAPEC-36
