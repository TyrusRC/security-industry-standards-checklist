- id: API-INV-007
  sheet: API
  category: INV
  title: Review the inventory of integrated services and sensitive data flows
  objective: Finds data shared with third parties without approval, inventory or detail.
  steps:
  - Read the list of third-party services that the API calls or that call the API.
  - For each, find the business reason, the approval and the data types shared.
  - Compare with real outbound traffic of a test environment.
  - Look for flows that are not in the list.
  example: Review of the architecture document; mitmproxy capture of outbound calls; data flow diagram per service.
  expected: Each third-party data flow has an owner, an approval and a list of data types. No unknown flow exists.
  severity: Medium
  test_type: Config Review
  refs:
    api_top10:
    - API9:2023
    cheatsheet:
    - Microservices_based_Security_Arch_Doc_Cheat_Sheet
    cwe:
    - CWE-1059
    - CWE-200
  see:
  - WEB-ARCH-001
  - WEB-DATA-004
