- id: API-INV-008
  sheet: API
  category: INV
  title: Check the retirement plan and the security updates for old API versions
  objective: Finds versions that stay open without a plan or without security patches.
  steps:
  - Read the version policy and the retirement dates.
  - List the versions that run and the clients that still use them.
  - Find security fixes of the new version and check if the old version has them.
  - Check that documentation is built in the pipeline and stays current.
  example: Review of the changelog and the gateway analytics per version; diff of the security rules between versions.
  expected: Each version has a retirement date. Security fixes are moved to old versions or the old version is closed.
  severity: Low
  test_type: Config Review
  refs:
    api_top10:
    - API9:2023
    cwe:
    - CWE-1059
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa9-improper-inventory-management.md
- id: API-INV-009
  sheet: API
  category: INV
  title: Check that non-production APIs do not use production data
  objective: Finds test environments that hold real user data under weaker controls.
  steps:
  - List the databases and storage that the non-production APIs use.
  - Look for real names, emails and tokens in test data.
  - If production data is needed, compare the controls with production.
  example: Review of data copy jobs; sample queries on the test database; scan for personal data patterns.
  expected: Non-production APIs use synthetic data. Any real data has the same controls as in production.
  severity: Medium
  test_type: Config Review
  refs:
    api_top10:
    - API9:2023
    cwe:
    - CWE-200
    - CWE-359
  see:
  - WEB-DATA-001
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa9-improper-inventory-management.md
