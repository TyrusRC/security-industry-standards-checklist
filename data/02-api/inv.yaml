- id: API-INV-001
  sheet: API
  category: INV
  title: Compare the inventory of API hosts with the exposed hosts
  objective: Finds API hosts that are not in the inventory or whose purpose is unclear.
  steps:
  - Get the inventory of API hosts with environment, network exposure and version.
  - List hosts from DNS, certificate logs, the cloud account and the gateway.
  - Compare the two lists.
  - Write down hosts that have no owner, no environment or no version.
  example: subfinder -d example.com | httpx -title -tech-detect; amass enum -passive; crt.sh query; cloud API listing of gateways.
  expected: Every exposed API host is in the inventory with environment, audience and version. No host is unknown.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API9:2023
    wstg:
    - WSTG-APIT-01
    cwe:
    - CWE-1059
    attack:
    - T1590
    - T1596
  see:
  - WEB-INFO-004
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa9-improper-inventory-management.md
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/12-API_Testing/01-API_Reconnaissance.md
- id: API-INV-002
  sheet: API
  category: INV
  title: Find old, beta and undocumented API versions and test them
  objective: Finds retired or test versions that run with weaker controls.
  steps:
  - 'Change the version in the path, header or host: v1, v2, beta, internal, test.'
  - Search archives and old documents for retired endpoints.
  - Send the same request to each version that answers.
  - Compare the authentication, authorization and limits with the current version.
  example: waybackurls api.example.com | grep -E '/v[0-9]'; gau; ffuf -u https://api.example/FUZZ/users -w versions.txt.
  expected: Retired versions are off. Each version that runs has the same security controls as the current version.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API9:2023
    wstg:
    - WSTG-APIT-01
    cwe:
    - CWE-1059
    capec:
    - CAPEC-36
    - CAPEC-121
    attack:
    - T1595.003
    - T1593
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa9-improper-inventory-management.md
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/12-API_Testing/01-API_Reconnaissance.md
- id: API-INV-003
  sheet: API
  category: INV
  title: Compare controls on non-production hosts with production
  objective: Finds beta, staging or test hosts that run the same API without the protection of production.
  preconditions:
  - Test only the hosts that are in scope.
  steps:
  - Find the staging, beta and test hosts of the API.
  - Repeat a rate limit test and a login brute force test on each host.
  - Check the gateway, WAF and authentication of each host.
  - Check which data these hosts hold.
  example: ffuf against beta.api.example.com/password/reset/confirm; compare response headers of both hosts; review of the DNS records.
  expected: Non-production hosts have the same controls as production or are not reachable from the internet. They hold no production data.
  severity: High
  test_type:
  - Manual
  - Config Review
  refs:
    api_top10:
    - API9:2023
    - API4:2023
    cwe:
    - CWE-1059
    - CWE-200
    capec:
    - CAPEC-121
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa9-improper-inventory-management.md
  - sources/repos/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption.md
- id: API-INV-004
  sheet: API
  category: INV
  title: Check that API documentation is limited to authorized users
  objective: Finds public API descriptions and explorers that expose the full attack surface.
  steps:
  - Request /openapi.json, /swagger.json, /api-docs, /doc and /swagger on every API host.
  - Request them without a token and with a low-privilege token.
  - Compare the document with the routes that really exist.
  - Look for internal routes and test servers in the document.
  example: curl -s https://api.example/openapi.json | jq '.paths|keys'; ZAP OpenAPI add-on; nuclei -t exposures/apis.
  expected: API descriptions and explorers are available only to authorized users and only for the routes that the user may call.
  severity: Low
  test_type: Manual
  refs:
    api_top10:
    - API9:2023
    wstg:
    - WSTG-APIT-01
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-1059
    - CWE-200
  see:
  - WEB-CONF-003
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa9-improper-inventory-management.md
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/12-API_Testing/01-API_Reconnaissance.md
