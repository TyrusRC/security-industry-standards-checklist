- id: API-INV-006
  sheet: API
  category: INV
  title: Search public sources and client code for API information
  objective: Finds leaked API documents, keys and hidden endpoints in public sources.
  steps:
  - Search web and code hosts for the API host name, the paths and keys.
  - Read the JavaScript and mobile client for API routes and secrets.
  - Read robots.txt and sitemap files for API paths.
  - Check collections shared on API directories.
  example: Google dorks site:example.com inurl:/api; GitHub code search for the host; JSMiner; trufflehog github --org example.
  expected: No API key, internal route or private document is in public sources. Findings go to the incident process.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API9:2023
    wstg:
    - WSTG-APIT-01
    cwe:
    - CWE-200
    - CWE-538
    attack:
    - T1593
    - T1589
