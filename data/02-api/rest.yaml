- id: API-REST-006
  sheet: API
  category: REST
  title: Check that status codes do not reveal more than needed
  objective: Finds APIs that use wrong status codes or show if a hidden object exists.
  steps:
  - Request objects that exist, that do not exist and that belong to others.
  - Compare status codes and bodies. Look for 200 with an error text in the body.
  - Request protected routes without a token (401) and with a weak role (403).
  - Check for a generic 500 body.
  example: curl -i for each case; Burp Comparer; Postman tests with expected status codes.
  expected: The API uses 401, 403, 404, 405, 413, 415, 429 and 5xx as defined. It does not show whether an object of another user exists.
  severity: Low
  test_type: Manual
  refs:
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-204
    - CWE-209
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Security_Cheat_Sheet.md
- id: API-REST-007
  sheet: API
  category: REST
  title: Check the audit log of API security events
  objective: Finds absent or unsafe logs for authentication, token and validation failures.
  steps:
  - Make failed logins, bad tokens, denied calls and validation errors in a test environment.
  - Find each event in the log system.
  - 'Check the fields: who, when, where, what and a request ID.'
  - Send log injection test strings. Check that secrets are not logged.
  example: Splunk or Kibana search for the test request ID; curl with a header that holds a newline marker in a test environment.
  expected: Security events are logged before and after the action with a request ID. Log data is cleaned and holds no secrets.
  severity: Medium
  test_type: Manual
  refs:
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-778
    - CWE-117
    - CWE-532
  see:
  - WEB-LOG-002
  - WEB-AUTHZ-018
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Security_Cheat_Sheet.md
