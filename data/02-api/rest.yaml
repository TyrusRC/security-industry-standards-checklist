- id: API-REST-001
  sheet: API
  category: REST
  title: Build a security test matrix from the OpenAPI description
  objective: Finds operations whose real security rule differs from the rule in the description.
  preconditions:
  - The OpenAPI or Swagger file, or a request collection, from the customer.
  steps:
  - Import the OpenAPI file. Read the global security rule and each operation override.
  - Build a table of operation, method, required scheme and required scope or role.
  - Call each operation with every credential type and role in the table.
  - Mark each result that differs from the table.
  example: Schemathesis; ZAP OpenAPI add-on; Burp OpenAPI Parser; Postman collection generated from openapi.json; Newman for the matrix.
  expected: The behavior of each operation matches its documented security rule. No operation allows more than the table says.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    - API5:2023
    - API9:2023
    wstg:
    - WSTG-APIT-01
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-862
    - CWE-287
  see:
  - WEB-AUTHZ-004
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa9-improper-inventory-management.md
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/12-API_Testing/01-API_Reconnaissance.md
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Assessment_Cheat_Sheet.md
- id: API-REST-002
  sheet: API
  category: REST
  title: Mutate valid requests one constraint at a time from the schema
  objective: Finds endpoints that fail or misbehave when a field leaves its declared type or range.
  steps:
  - Send a valid request that follows the declared types, required fields and enum values.
  - 'Change one constraint at a time: type, length, range, enum value or a required field.'
  - Record every 5xx response, every accepted invalid value and every long delay.
  - Check that the server rejects the bad value with 400.
  example: schemathesis run openapi.json --checks all; RESTler fuzz; ZAP OpenAPI active scan; Burp Intruder on single fields.
  expected: The API rejects each invalid value with 400 or 422 and a generic message. No 5xx response occurs.
  severity: Medium
  test_type: Automated
  refs:
    api_top10:
    - API8:2023
    wstg:
    - WSTG-APIT-01
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
