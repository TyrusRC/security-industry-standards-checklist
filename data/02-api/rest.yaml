- id: API-REST-003
  sheet: API
  category: REST
  title: Find hidden parameters in headers, URL segments and structured values
  objective: Finds API inputs that the description and the user interface do not show.
  steps:
  - Record full requests with a proxy while you use all functions with accounts of each role.
  - Look for unusual headers and URL segments that repeat with different values.
  - Find structured values in JSON, XML or custom formats.
  - Test suspected segments with an invalid value to see if they are parameters.
  example: Burp Param Miner; Arjun; ZAP spider with the AJAX spider; ffuf for parameter names.
  expected: All inputs are known and documented. Unknown inputs are ignored or rejected.
  severity: Low
  test_type: Manual
  refs:
    wstg:
    - WSTG-APIT-01
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-1059
    capec:
    - CAPEC-215
  see:
