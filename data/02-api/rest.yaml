- id: API-REST-005
  sheet: API
  category: REST
  title: Check that input is validated for type, length, range and unexpected fields
  objective: Finds endpoints that process unchecked input from JSON, XML or form bodies.
  steps:
  - Send wrong types, negative numbers, empty strings and values over the length limit.
  - Send extra fields and repeated fields.
  - Send injection test strings in every field.
  - Send XML with external entities if the endpoint accepts XML.
  example: Burp Intruder with a type-confusion list; curl -d '{"qty":"abc"}'; ZAP active scan.
  expected: The API checks each field on the server against a schema or allowlist. Unexpected content gives 400 and a log entry.
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API8:2023
    asvs:
