- id: API-REST-004
  sheet: API
  category: REST
  title: Check that each endpoint allows only the documented HTTP methods
  objective: Finds endpoints that accept methods which the API does not need.
  steps:
  - Send OPTIONS to each endpoint of the API description and read the Allow header.
  - Compare the Allow header with the methods that the API description lists.
  - Send each other method, also HEAD, and check for 405.
  - Check that the caller may use each allowed method on the object.
  example: curl -i -X OPTIONS https://api.example/v1/items; Burp Intruder with a list of HTTP methods.
  expected: Only documented methods work. Other methods return 405. Authorization checks also apply to each allowed method.
  severity: Low
  test_type: Manual
  refs:
    api_top10:
    - API8:2023
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-650
  see:
