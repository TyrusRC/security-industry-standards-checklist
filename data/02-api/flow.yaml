- id: API-FLOW-004
  sheet: API
  category: FLOW
  title: Call later workflow steps without the earlier steps
  objective: Finds APIs that rely on the client to send steps in the right order.
  steps:
  - Write down the steps of a flow, for example create, pay, approve and ship.
  - Capture the request of each step.
  - Send a later step without the earlier steps. Replay and reorder steps.
  - Change status or step values and reuse tokens from other steps.
  example: 'Burp Repeater and Sequence of requests; Postman collection with a changed order; example: POST /orders/<id>/ship before payment.'
  expected: The server checks the state of the flow on every request. Out-of-order calls, replays and changed states are rejected.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
