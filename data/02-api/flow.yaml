- id: API-FLOW-005
  sheet: API
  category: FLOW
  title: Race parallel requests against single-use functions
  objective: Finds single-use limits, such as coupons or votes, that fail when requests run at once.
  preconditions:
  - Test environment only.
  steps:
  - Find functions that must run once or a few times, such as coupons, votes and invites.
  - Send many identical requests at the same time.
  - Count how many succeeded.
  - Compare with the limit.
  example: Burp Repeater send group in parallel; Turbo Intruder race-single-packet-attack template; curl --parallel.
  expected: The function succeeds as many times as the limit allows. The server uses locks or atomic updates.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API6:2023
