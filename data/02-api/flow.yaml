- id: API-FLOW-006
  sheet: API
  category: FLOW
  title: Check that B2B and developer APIs have the same anti-automation controls
  objective: Finds machine-to-machine APIs that skip the protection of the public client.
  steps:
  - List the APIs for partners, developers and machines.
  - Compare the controls of these APIs with the controls of the web client for the same flow.
  - Run the scripted flow test against the partner API.
  - Check the keys, quotas and alerts for each partner.
  example: Postman collection of the partner API; comparison table of controls; review of the quota settings in the API gateway.
  expected: Partner APIs have quotas, keys per client and alerts. The controls are not weaker than those of the public client.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API6:2023
    cwe:
    - CWE-799
    - CWE-770
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa6-unrestricted-access-to-sensitive-business-flows.md
- id: API-FLOW-007
  sheet: API
  category: FLOW
  title: Check the detection of scripted misuse and the response
  objective: Finds systems that do not detect or log non-human use of sensitive flows.
  steps:
  - Run a script on a sensitive flow with a very short time between steps.
  - Look for changes in responses, blocks, captcha or extra logins.
  - Check the logs and alerts for the script.
  - Read the incident process for the alerts.
  example: Burp Turbo Intruder; log search for the test source IP; review of the WAF or bot rules.
  expected: The system detects non-human speed and device patterns on sensitive flows. It logs the events and sends an alert.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  refs:
    api_top10:
    - API6:2023
    wstg:
    - WSTG-BUSL-07
    cwe:
