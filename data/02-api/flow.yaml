  - sources/repos/wstg/document/4-Web_Application_Security_Testing/10-Business_Logic/05-Number_of_Times_a_Function_Can_Be_Used_Limits.md
- id: API-FLOW-002
  sheet: API
  category: FLOW
  title: Test referral and credit programs for scripted account creation
  objective: Finds referral and bonus flows that a script can use to collect credit.
  preconditions:
  - Test environment only.
  steps:
  - Read the rules of the referral program.
  - Create several test accounts with a script. Use each to credit one main account.
  - Check if email, phone or device checks block the script.
  - Check if the credit can turn into cash or products.
  example: Python script that calls POST /register and POST /referral/claim; Burp macro for the sign-up step.
  expected: The sign-up and the credit steps have checks for scripted use. Credit is not given before the new account is confirmed.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API6:2023
    wstg:
    - WSTG-BUSL-05
    cwe:
    - CWE-799
    - CWE-841
