- id: API-FLOW-001
  sheet: API
  category: FLOW
  title: Test sensitive business flows of the API for scripted abuse
  objective: Finds flows such as purchase, reservation and post creation that a script can abuse at scale.
  preconditions:
  - A document from the business owner that names the sensitive flows.
  - Use test stock and test accounts.
  steps:
  - Write a list of business flows and mark the ones that harm the business when used too often.
  - Call each marked flow with a script at a high rate from one source.
  - Call it again from many sources.
  - 'Record what blocks the script: rate limit, captcha, device checks or review.'
  example: Burp Turbo Intruder; Postman runner; a Python requests loop on a test product with limited stock.
  expected: Each marked flow has controls that slow a script, and the business owner agreed the limits.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API6:2023
    wstg:
    - WSTG-BUSL-05
    cwe:
    - CWE-799
    - CWE-770
    capec:
    - CAPEC-212
  see:
  - WEB-BIZ-009
  - WEB-BIZ-004
  sources_read:
