- id: API-FLOW-003
  sheet: API
  category: FLOW
  title: Test reservation holds for abuse that blocks other users
  objective: Finds flows where one client can hold all slots or seats and cancel them in bulk.
  steps:
  - Reserve many slots or seats with one account without payment.
  - Check the time limit of an unpaid hold.
  - Cancel all reservations at once.
  - Check if fees, limits or delays apply.
  example: Postman runner with a loop on POST /reservations; check the hold expiry time in the response.
  expected: One account can hold only a small number of slots. Unpaid holds expire quickly. Bulk cancel has a limit.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API6:2023
    wstg:
    - WSTG-BUSL-05
    cwe:
    - CWE-799
    - CWE-841
