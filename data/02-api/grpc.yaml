- id: API-GRPC-005
  sheet: API
  category: GRPC
  title: Test protobuf field validation and message size limits
  objective: Finds gRPC servers that trust field types and accept very large messages or streams.
  preconditions:
  - Test environment only.
  steps:
  - Send values at the edge of range, empty, over length and with injection test strings.
  - Send a message over the size limit in both directions.
  - Send a stream with many messages or a very long run time.
  - Check the maximum messages per stream and the session time.
  example: grpcurl -d @ < big.json host:443 pkg.Service/Method; ghz load tool in a test environment; fuzz with protobuf-aware tools.
  expected: The server validates every field for business rules. It rejects oversize messages and ends streams that pass the message and time limits.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - gRPC_Security_Cheat_Sheet
    cwe:
    - CWE-20
    - CWE-770
    capec:
    - CAPEC-130
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption.md
  - sources/repos/CheatSheetSeries/cheatsheets/gRPC_Security_Cheat_Sheet.md
- id: API-GRPC-006
  sheet: API
  category: GRPC
  title: Check rate limits and deadlines for gRPC calls
  objective: Finds gRPC services without limits per client or without call deadlines.
  preconditions:
  - Test environment only.
  steps:
  - Send many unary calls from one client. Look for RESOURCE_EXHAUSTED.
  - Open many streams from one client.
  - Send a call without a deadline and a slow call.
  - Check the client and the server timeout settings.
  example: ghz --rps 500 --total 5000 host:443; grpcurl -max-time 1; review of the limiter and stream interceptor.
  expected: The service limits calls and streams per client. Server-side deadlines end slow calls.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - gRPC_Security_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-400
    attack:
    - T1499
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption.md
  - sources/repos/CheatSheetSeries/cheatsheets/gRPC_Security_Cheat_Sheet.md
- id: API-GRPC-007
  sheet: API
  category: GRPC
  title: Check gRPC errors, status codes and credential placement
  objective: Finds detailed errors and credentials in message fields.
  steps:
  - Send invalid messages and read the status and the error text.
  - Look for stack traces and internal names.
  - Check that credentials travel in metadata and not in message fields.
  - Check the token life time.
  example: grpcurl -v ... to see the status and trailers; review of proto files for password and token fields.
  expected: Errors are generic and use the right status codes. Credentials are in metadata. Tokens are short lived.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API8:2023
    cheatsheet:
    - gRPC_Security_Cheat_Sheet
    cwe:
    - CWE-209
    - CWE-598
  see:
  - WEB-ERR-001
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa8-security-misconfiguration.md
  - sources/repos/CheatSheetSeries/cheatsheets/gRPC_Security_Cheat_Sheet.md
