- id: API-BOLA-005
  sheet: API
  category: BOLA
  title: Test whether unpredictable IDs are the only object protection
  objective: Finds objects that any user can read when the user learns the ID from another source.
  steps:
  - Collect IDs from list responses, error messages, notification links and shared URLs.
  - Use an ID of user B that user A can see. Request the object as user A.
  - Check if IDs are sequential or follow a pattern that a script can guess.
  - Read the code to make sure an owner check exists for each lookup.
  example: curl with GUIDs taken from the activity feed of user B; Burp Sequencer on a sample of IDs; code search for findById( without an owner filter.
  expected: The API denies access even when the caller knows a valid ID. The owner check does not depend on the secrecy of the ID.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-639
    capec:
