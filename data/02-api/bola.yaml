- id: API-BOLA-001
  sheet: API
  category: BOLA
  title: Replace object IDs in path and query with IDs of another user
  objective: Finds API endpoints that return objects of other users when the object ID changes.
  preconditions:
  - Two test accounts with the same role.
  - A list of API endpoints from the OpenAPI file or proxy history.
  steps:
  - Create user A and user B. Create objects for each, such as orders.
  - List every endpoint that takes an object ID in the path or in the query string.
  - Log in as user A. Send each request with an object ID that belongs to user B.
  - Compare each response with the response that user B gets for the same request.
  example: 'Burp Autorize or AuthMatrix with the token of user A; curl -H ''Authorization: Bearer <tokenA>'' https://api.example/v1/orders/<idB>; Postman collection run with two environments.'
  expected: The API returns 403 or 404 for objects of other users. It checks the owner of the object on every request.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    asvs:
    - V8.2.2
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-285
    - CWE-863
    capec:
    - CAPEC-1
  see:
  - WEB-IDOR-001
  sources_read:
