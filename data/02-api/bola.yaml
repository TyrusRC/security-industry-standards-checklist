- id: API-BOLA-007
  sheet: API
  category: BOLA
  title: Check that object access uses a policy, not only the token ID
  objective: Finds code that compares the user ID in the token to one ID parameter and misses other objects.
  steps:
  - Find all handlers that take an object ID from the client.
  - Read how each handler decides if the caller may use the object.
  - Find handlers that only compare the token user ID to a request parameter.
  - Send requests for shared, delegated and group objects to test the policy.
  example: grep -rn 'userId ==' src/ ; review of the authorization middleware; Postman test for an object shared with a group.
  expected: A central policy checks the caller, the action and the object for every handler. A single ID comparison is not the only check.
  severity: Medium
  test_type: Code Review
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    cwe:
    - CWE-285
    - CWE-639
