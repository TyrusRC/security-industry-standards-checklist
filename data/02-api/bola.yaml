- id: API-BOLA-002
  sheet: API
  category: BOLA
  title: Change other users' objects with PUT, PATCH and DELETE
  objective: Finds API write operations that do not check who owns the object.
  preconditions:
  - Do not run on production. Use test objects only.
  steps:
  - Create an object as user B and note its ID.
  - Log in as user A. Send PUT, PATCH and DELETE requests for the object of user B.
  - Send POST requests that create child objects under the object of user B.
  - Log in as user B and read the object. Look for changes or deletion.
  example: 'curl -X DELETE -H ''Authorization: Bearer <tokenA>'' https://api.example/v1/documents/<idB>; Burp Repeater with a Match and Replace rule for the token.'
  expected: The API rejects every write, delete and create request on objects of other users. The object stays unchanged.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    asvs:
    - V8.2.2
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-285
    capec:
    - CAPEC-1
  see:
  - WEB-IDOR-002
