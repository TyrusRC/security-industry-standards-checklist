- id: API-BOLA-004
  sheet: API
  category: BOLA
  title: Test list, search and bulk endpoints for objects of other users
  objective: Finds collection endpoints that return all objects instead of the objects of the caller.
  steps:
  - Call each list endpoint, such as GET /users or GET /orders, as a normal user.
  - Add filter parameters such as owner, user_id, tenant or all to the request.
  - Change the page size and the sort order. Look for objects that the caller does not own.
  - Send bulk requests that carry many IDs, some of them from user B.
  example: 'curl ''https://api.example/v1/orders?user_id=<idB>&limit=100'' -H ''Authorization: Bearer <tokenA>''; Burp Param Miner for hidden filter names.'
  expected: List and bulk endpoints return only the objects that the caller may access. Filter parameters cannot widen the result.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-285
    capec:
    - CAPEC-1
  see:
  - WEB-IDOR-001
