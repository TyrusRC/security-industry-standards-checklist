- id: API-BOLA-008
  sheet: API
  category: BOLA
  title: Run automated authorization tests for object access in the build
  objective: Finds builds that lack regression tests for object-level checks.
  steps:
  - Find the test suite for the API in the repository and in the build pipeline.
  - Look for tests that call each endpoint as a second user and expect 403 or 404.
  - Remove the owner check in a test branch. Run the pipeline.
  - Make sure the build fails and that the change cannot be deployed.
  example: Review of CI configuration; Postman or Newman collection with a two-user matrix; Schemathesis with a custom authorization check.
  expected: The pipeline has object-level authorization tests for every endpoint. A test that fails blocks the deployment.
  severity: Low
  test_type:
  - Config Review
  - Code Review
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    cwe:
    - CWE-285
