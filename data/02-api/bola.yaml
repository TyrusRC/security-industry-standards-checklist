- id: API-BOLA-006
  sheet: API
  category: BOLA
  title: Test cross-tenant access with changed tenant identifiers
  objective: Finds multi-tenant APIs that let one tenant read or change the objects of another tenant.
  steps:
  - Create two tenants with one user each. Create objects in both tenants.
  - Send requests from tenant A with the tenant ID, subdomain or header of tenant B.
  - Use an object ID of tenant B in a request with the tenant context of tenant A.
  - Look for data of tenant B in responses, exports and search results.
  example: 'curl -H ''X-Tenant-Id: <tenantB>'' -H ''Authorization: Bearer <tokenA>'' https://api.example/v1/invoices/<idB>; Burp Match and Replace on the tenant header.'
  expected: The API takes the tenant from the validated token or session. A tenant value from the client never widens access.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    asvs:
    - V8.4.1
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-285
