- id: API-BOLA-003
  sheet: API
  category: BOLA
  title: Test object IDs in request bodies, headers and nested routes
  objective: Finds object references outside the path that the API trusts without an owner check.
  steps:
  - Find IDs in JSON bodies, custom headers and nested routes such as /users/{id}/orders/{id}.
  - Change one ID at a time to an ID of user B. Keep the other IDs valid for user A.
  - Send a parent ID of user A with a child ID of user B.
  - Repeat for every object type that the API exposes.
  example: 'Burp Intruder or ZAP fuzzer with a list of IDs of user B; Postman pre-request script that swaps IDs; example request: PUT /v1/users/<idA>/orders/<idB>.'
  expected: The API checks the owner of each object in the request, also for nested routes. A mismatch between parent and child gives 403 or 404.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    asvs:
    - V8.2.2
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-863
    capec:
    - CAPEC-1
