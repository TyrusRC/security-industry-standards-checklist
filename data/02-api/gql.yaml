- id: API-GQL-005
  sheet: API
  category: GQL
  title: Call privileged mutations and queries as a lower role
  objective: Finds GraphQL operations for admins that other roles can call.
  steps:
  - Get the schema from a test environment. List all mutations and queries.
  - Mark the ones that need a role, such as deleteUser and promoteUser.
  - Call each marked operation with a lower role and without a token.
  - Check mutations and subscriptions too.
  example: 'InQL; mutation { deleteUser(id: "12345") { success } } with a token of a normal user.'
  expected: Operations for higher roles return an authorization error for lower roles and for anonymous clients.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API5:2023
    wstg:
