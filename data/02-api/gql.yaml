  - sources/repos/wstg/document/4-Web_Application_Security_Testing/12-API_Testing/99-GraphQL.md
  - sources/repos/CheatSheetSeries/cheatsheets/GraphQL_Cheat_Sheet.md
- id: API-GQL-004
  sheet: API
  category: GQL
  title: Test object access by ID, node fields and edges in GraphQL
  objective: Finds queries that return objects of other users by ID or through relations.
  steps:
  - Run a query for an object ID of user B as user A.
  - Use the node and nodes fields with IDs of user B.
  - Reach the same object through a relation from an object of user A.
  - Repeat with mutations that delete or change an object of user B.
  example: 'InQL scan; graphql-path-enum; query { user(id: "<idB>") { name email } }; mutation deleteReports with an ID of user B.'
  expected: Every resolver, edge and node checks that the caller may access the object. Another user's ID returns an error or null.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API1:2023
    wstg:
    - WSTG-APIT-02
    - WSTG-APIT-99
    asvs:
    - V8.2.2
    cheatsheet:
    - GraphQL_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-285
    capec:
    - CAPEC-1
