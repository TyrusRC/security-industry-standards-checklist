- id: API-GQL-001
  sheet: API
  category: GQL
  title: Bypass login and OTP limits with batched requests
  objective: Finds GraphQL APIs where many login or OTP tries fit in one HTTP request.
  preconditions:
  - Use a test account.
  steps:
  - Send a JSON array of several login mutations in one request.
  - Send one query that holds many aliased login mutations.
  - Check if the rate limit and the lock out count each operation or each request.
  - Check if batched requests work for sensitive operations.
  example: 'InQL batch attack; graphql-cop (test for batching and alias overloading); Burp request: [{"query":"mutation{login(...)}"},{...}].'
  expected: Rate limits and lock outs count each operation. Sensitive operations cannot run in batches, and the batch size has a limit.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    - API4:2023
    wstg:
    - WSTG-APIT-99
    cheatsheet:
    - GraphQL_Cheat_Sheet
    cwe:
    - CWE-307
    - CWE-799
    capec:
    - CAPEC-112
    attack:
    - T1110
  see:
  - WEB-HTTP-007
  - WEB-AUTHN-002
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
  - sources/repos/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption.md
