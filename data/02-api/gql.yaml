- id: API-GQL-003
  sheet: API
  category: GQL
  title: Bypass a query denylist with aliases
  objective: Finds access rules that block field names by text match and so miss aliased fields.
  steps:
  - Send a query for a blocked field and confirm the block.
  - Send the same field with an alias.
  - Send it with changed space characters, fragments and variables.
  - 'Check where the access rule runs: at the text level or at the resolver.'
  example: 'InQL; Burp GraphQL Raider; query { a: adminUsers { id } } compared with query { adminUsers { id } }.'
  expected: Access is enforced in the resolvers by role. Aliases, fragments and space characters do not change the result.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API5:2023
    wstg:
    - WSTG-APIT-99
    - WSTG-APIT-04
    cheatsheet:
    - GraphQL_Cheat_Sheet
    cwe:
    - CWE-863
    - CWE-285
  sources_read:
