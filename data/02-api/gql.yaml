- id: API-GQL-009
  sheet: API
  category: GQL
  title: Test if GraphQL arguments reach an older REST API unchecked
  objective: Finds GraphQL layers that forward arguments to old APIs and use the rights of the GraphQL node.
  steps:
  - Find GraphQL fields that call an older REST or internal API.
  - Send an ID argument with path parts, for example 1/delete.
  - Check if the call reaches another route or object of the old API.
  - Check if the old API sees the user rights or the rights of the GraphQL node.
  example: Burp Repeater with id variable values such as "1/delete" and "1?admin=true" on a test system.
  expected: The GraphQL layer validates arguments and passes them in a safe way. The old API gets the rights of the caller.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API5:2023
    wstg:
    - WSTG-APIT-99
    cheatsheet:
    - GraphQL_Cheat_Sheet
    cwe:
    - CWE-20
    - CWE-285
