- id: API-GQL-007
  sheet: API
  category: GQL
  title: Check query timeouts, pagination and amount limits
  objective: Finds GraphQL APIs without a time limit or a cap on list sizes.
  preconditions:
  - Test environment only.
  steps:
  - Send a query that asks for a very large list size.
  - Send a costly query and measure the time before the server stops it.
  - Check that list fields use pagination with a maximum.
  - Check the timeout in the resolver and in the HTTP server.
  example: 'graphql-cop; Burp request with first: 99999999; timing in Burp Logger.'
  expected: List sizes have a server-side maximum. Queries stop after a set time at the application and at the HTTP layer.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    wstg:
    - WSTG-APIT-99
    cheatsheet:
    - GraphQL_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-400
    capec:
    - CAPEC-130
