- id: API-GQL-010
  sheet: API
  category: GQL
  title: Check GraphQL errors, debug mode and schema tools in production
  objective: Finds GraphQL servers that return stack traces, debug data or schema tools.
  steps:
  - Send invalid queries, wrong types and a query that fails in a resolver.
  - Read the error body for traces, paths and SQL text.
  - Look for debug flags, GraphiQL and Playground on the host.
  - Check the error format against the documentation.
  example: graphql-cop; InQL; curl -d '{"query":"{ x }"}' https://api.example/graphql.
  expected: Errors are generic. Stack traces and debug mode are off in production, and schema tools are not reachable.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API8:2023
    wstg:
    - WSTG-APIT-99
    cheatsheet:
    - GraphQL_Cheat_Sheet
    cwe:
