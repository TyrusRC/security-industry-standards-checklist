- id: API-GQL-008
  sheet: API
  category: GQL
  title: Test GraphQL arguments and custom scalars for injection
  objective: Finds resolvers that pass arguments to SQL, OS or other interpreters without checks.
  steps:
  - List arguments of type String and custom scalars such as DateTime.
  - Send injection test strings for SQL, NoSQL, OS command and XSS in each argument.
  - Read errors and response data for changes.
  - Check that the schema uses enums, input types and length limits.
  example: 'InQL; sqlmap with a GraphQL request file (-r); query { dogs(namePrefix: "a''") { name } }.'
  expected: Arguments are checked against strict types and allowlists. Resolvers use safe query methods. Test strings do not change the result.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-APIT-99
    cheatsheet:
    - GraphQL_Cheat_Sheet
    - Input_Validation_Cheat_Sheet
    cwe:
    - CWE-89
    - CWE-20
    - CWE-79
  see:
  - WEB-INJ-001
  - WEB-INJ-003
  sources_read:
