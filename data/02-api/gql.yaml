- id: API-GQL-006
  sheet: API
  category: GQL
  title: Look for sensitive fields in the schema and in mutation results
  objective: Finds types and mutation results that expose private fields of other objects.
  steps:
  - Read the schema for fields such as passwordHash, apiKey, ssn, role and recentLocation.
  - Query these fields as a normal user.
  - Call mutations that return objects, such as reportUser. Read the returned fields.
  - Compare the fields with the fields that the client needs.
  example: 'InQL; query { __type(name: "User") { fields { name } } }; GraphQL Voyager to view types.'
  expected: Types expose only fields the caller may read. Mutation results hold no private fields of other users.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API3:2023
    wstg:
    - WSTG-APIT-03
    - WSTG-APIT-99
    asvs:
    - V8.2.3
    cheatsheet:
    - GraphQL_Cheat_Sheet
    cwe:
    - CWE-213
    - CWE-200
