- id: API-GQL-002
  sheet: API
  category: GQL
  title: Bypass resource limits with batched expensive mutations
  objective: Finds GraphQL endpoints where batched requests skip request limits and size checks.
  preconditions:
  - Test environment only.
  steps:
  - Find a costly mutation, such as an image upload or an export.
  - Send the mutation many times in one array or with many aliases.
  - Watch the CPU, memory and time of the server.
  - Check the limit for the number of operations in a request.
  example: graphql-cop; Burp request with 100 aliases of uploadPic; load graph of the test host.
  expected: The server limits the number of operations per request and the cost of a request. Total work per client is bounded.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    wstg:
    - WSTG-APIT-99
    cheatsheet:
    - GraphQL_Cheat_Sheet
    cwe:
