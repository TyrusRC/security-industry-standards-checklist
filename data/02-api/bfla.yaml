- id: API-BFLA-004
  sheet: API
  category: BFLA
  title: Test the authorization of each role, group and sub-user
  objective: Finds role hierarchy errors that give a user the functions of another group.
  steps:
  - Write a table of roles, groups and the functions that each may call.
  - Include users with two roles, sub-users and partner accounts in the table.
  - Call each function with each account and mark the result in the table.
  - Look for results that differ from the table.
  example: Burp AuthMatrix with one session per role; Postman collection with an environment for each role; spreadsheet of expected 200 and 403 results.
  expected: The result of each call matches the documented role table. No role can call a function of a higher role.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API5:2023
    wstg:
    - WSTG-APIT-04
    asvs:
