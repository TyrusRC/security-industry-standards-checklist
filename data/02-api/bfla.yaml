- id: API-BFLA-005
  sheet: API
  category: BFLA
  title: Check deny by default and shared checks for administrative controllers
  objective: Finds routes that are open because a developer forgot to add an authorization rule.
  steps:
  - Read the authorization module and the code that defines routes.
  - Make sure the default rule for a new route is to deny access.
  - Make sure the administrative controllers use one base class or one policy that checks the role.
  - Add a test route without a rule in a test environment. Call it as a normal user.
  example: Code review of the middleware chain; grep for routes without an authorization annotation; unit test that lists all routes and their policy.
  expected: A new route without an explicit rule is denied. Administrative functions share one central role check.
  severity: Medium
  test_type: Code Review
  refs:
    api_top10:
    - API5:2023
    wstg:
    - WSTG-APIT-04
    cwe:
    - CWE-862
    - CWE-285
