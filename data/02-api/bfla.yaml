- id: API-BFLA-002
  sheet: API
  category: BFLA
  title: Change the HTTP method on each endpoint and check the authorization
  objective: Finds functions that are protected for one HTTP method but open for another.
  steps:
  - Take a GET endpoint that a normal user may call.
  - Send PUT, PATCH, DELETE and POST to the same path with the token of the normal user.
  - Take a POST endpoint of an administrator and send GET to the same path.
  - Record every change in the status code or in the response body.
  example: 'curl -X DELETE https://api.example/api/users/12345 -H ''Authorization: Bearer <userToken>''; Burp Repeater method change; ZAP active scan with method fuzzing.'
  expected: Each method has its own authorization check. The API answers 403 or 405 for methods that the caller may not use.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API5:2023
    wstg:
    - WSTG-APIT-04
    asvs:
    - V8.2.1
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-285
    - CWE-862
  see:
  - WEB-CONF-008
