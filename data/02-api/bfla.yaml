- id: API-BFLA-003
  sheet: API
  category: BFLA
  title: Find privileged functions that sit under normal routes
  objective: Finds administrative functions outside the /admin path that have no role check.
  steps:
  - Compare the API description with the routes in the code and the client JavaScript.
  - Look for routes such as /users/export_all and /invites/new next to normal routes.
  - Guess related names for each normal route and send them as a normal user.
  - Test old API versions of the same routes.
  example: 'ffuf -u https://api.example/api/FUZZ -w api-endpoints.txt -H ''Authorization: Bearer <userToken>''; Kiterunner; route list from the framework (rails routes, springdoc).'
  expected: Every route that changes or exports data checks the role of the caller. The path name does not decide who has access.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API5:2023
    wstg:
    - WSTG-APIT-04
    - WSTG-APIT-01
    cwe:
    - CWE-285
    - CWE-862
    capec:
    - CAPEC-36
    attack:
