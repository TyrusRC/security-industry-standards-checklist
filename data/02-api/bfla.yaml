- id: API-BFLA-001
  sheet: API
  category: BFLA
  title: Call administrative endpoints as a normal user and as an anonymous client
  objective: Finds administrative functions that a client without the right role can call.
  preconditions:
  - 'Test accounts for each role: anonymous, user, partner and administrator.'
  - Do not run destructive calls on production.
  steps:
  - List administrative functions from the API description, the client code and the proxy history.
  - Call each function with the token of a normal user.
  - Call each function without a token.
  - Compare the result with the result for an administrator.
  example: 'curl -X POST https://api.example/api/admin/deleteUser -H ''Authorization: Bearer <userToken>'' -d ''{"userId":"12345"}''; Burp Autorize; ZAP forced browse.'
  expected: The API returns 401 or 403 to every client that lacks the role. The function does not run.
  severity: Critical
  test_type: Manual
  level: ASVS L1
  refs:
    api_top10:
    - API5:2023
    wstg:
    - WSTG-APIT-04
    asvs:
    - V8.2.1
    cwe:
    - CWE-285
    - CWE-862
    - CWE-863
    capec:
    - CAPEC-122
  see:
  - WEB-AUTHZ-004
  - WEB-AUTHZ-005
  sources_read:
