- id: API-BOPLA-004
  sheet: API
  category: BOPLA
  title: Add extra properties to write requests and read the object back
  objective: Finds endpoints that write properties which the caller may not change.
  steps:
  - Take a valid create or update request. Add fields such as role, isAdmin, balance, price and status.
  - Send the request. Read the object back with a second request.
  - Check if the value was stored and if the behavior changed.
  - Repeat with PATCH, nulls to delete a property and a different Content-Type.
  example: 'Burp Param Miner; Arjun (arjun -u https://api.example/v1/users/me -m JSON); example body: {"email":"a@b.test","role":"admin"}.'
  expected: The API ignores or rejects properties that the caller may not write. The stored object does not change for those fields.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API3:2023
    wstg:
    - WSTG-APIT-03
    asvs:
    - V8.2.3
    cheatsheet:
    - Mass_Assignment_Cheat_Sheet
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-915
