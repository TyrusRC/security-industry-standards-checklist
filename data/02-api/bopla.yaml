- id: API-BOPLA-003
  sheet: API
  category: BOPLA
  title: Inspect nested objects and error responses for extra properties
  objective: Finds embedded objects and error bodies that expose data of other objects.
  steps:
  - Request objects that embed other objects, such as an order with a customer and a payment.
  - Read every nested object for fields that the caller does not need.
  - Send invalid requests and read the error bodies.
  - Look for internal notes, card data, internal IDs and file paths.
  example: jq '..|objects|keys' response.json; Burp Search for the strings password, token, secret and internal; ZAP alert list.
  expected: Nested objects and error bodies carry only the minimum fields. Sensitive properties of other objects are not shown.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API3:2023
    wstg:
    - WSTG-APIT-03
    cwe:
    - CWE-213
    - CWE-209
  see:
  - WEB-DATA-007
