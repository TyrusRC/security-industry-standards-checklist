- id: API-BOPLA-002
  sheet: API
  category: BOPLA
  title: Compare the fields in responses for different roles and for anonymous calls
  objective: Finds endpoints that return the same rich object to every caller.
  steps:
  - Request one object as the owner, as another user, as an administrator and without a token.
  - Save the four JSON responses.
  - Compare the field lists with a diff tool.
  - Look for fields that a lower role should not see.
  example: curl -s ... | jq -S . > owner.json; diff owner.json other.json; Burp Comparer.
  expected: Fields depend on the role of the caller and the relation to the object. An anonymous call gets no private fields.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API3:2023
    wstg:
    - WSTG-APIT-03
    asvs:
    - V8.2.3
    cwe:
    - CWE-213
    - CWE-200
