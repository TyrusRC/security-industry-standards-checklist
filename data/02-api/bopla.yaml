- id: API-BOPLA-005
  sheet: API
  category: BOPLA
  title: Find hidden properties with the API description and accepted fields
  objective: Finds properties that the API accepts although the schema does not define them.
  steps:
  - Read the schema of the request body in the OpenAPI file.
  - Send each request with one extra property that the schema does not define.
  - Read the object back and look for the stored value.
  - Write each accepted extra property in the report.
  example: Schemathesis (st run openapi.json --checks all); ZAP OpenAPI add-on; Burp Param Miner guess JSON properties.
  expected: The API rejects properties that the schema does not define, or ignores them. It never stores them.
  severity: Medium
  test_type: Automated
  refs:
    api_top10:
    - API3:2023
    wstg:
    - WSTG-APIT-03
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    - Mass_Assignment_Cheat_Sheet
    cwe:
