- id: API-BOPLA-006
  sheet: API
  category: BOPLA
  title: Check how the code limits response and request fields
  objective: Finds generic serializers and automatic binders that expose or accept internal properties.
  steps:
  - Search the code for to_json, to_string and automatic binders of request data to objects.
  - Check that each endpoint uses a response schema with named fields.
  - Check that each endpoint uses an input class or an allowlist of fields.
  - Check that a block list is not the only protection.
  example: grep -rn 'to_json\|toString()\|@RequestBody\|permit(' src/; review of DTO classes; response schema validation in the gateway.
  expected: Responses use fixed schemas. Input binds only to allowed fields. Both are enforced in code or in the gateway.
  severity: Medium
  test_type: Code Review
  level: ASVS L2
  refs:
    api_top10:
    - API3:2023
    asvs:
    - V8.2.3
    cheatsheet:
    - Mass_Assignment_Cheat_Sheet
    cwe:
    - CWE-915
