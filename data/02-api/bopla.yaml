- id: API-BOPLA-001
  sheet: API
  category: BOPLA
  title: Compare API response fields with the fields that the client shows
  objective: Finds responses that carry sensitive fields which the user interface hides.
  steps:
  - Open a page that shows user or object data. Record the API request with a proxy.
  - List all fields in the JSON response and all fields that the page shows.
  - Mark fields such as password_hash, api_key, role, internal IDs and IP addresses.
  - Repeat for list, search and detail endpoints.
  example: Burp Logger++ or browser DevTools Network tab; jq 'keys' on each response; ZAP passive scan rules for information disclosure.
  expected: Each response holds only the fields that the client needs and the caller may read. The client does not filter data.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API3:2023
    wstg:
    - WSTG-APIT-03
    asvs:
    - V8.2.3
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-213
    - CWE-200
  see:
  - WEB-ARCH-005
  - WEB-DATA-007
