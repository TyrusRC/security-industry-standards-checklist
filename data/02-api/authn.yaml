- id: API-AUTHN-010
  sheet: API
  category: AUTHN
  title: Check how the API stores and shows API keys and client secrets
  objective: Finds API keys and client secrets that are stored in plain text or shown again.
  steps:
  - Create an API key or client secret in a test account. Note how the API shows it.
  - Read the key list and the key detail endpoints. Look for the full secret in the responses.
  - 'Read how the service stores keys: look for plain text and reversible encryption.'
  - Check the length and the random source of the keys.
  example: 'curl -H ''Authorization: Bearer <token>'' https://api.example/v1/keys; review of the key table in a test database; code search for key generation.'
  expected: The API shows a key once, at creation. The service stores only a hash or an encrypted value. Keys are long and random.
  severity: High
  test_type:
  - Manual
  - Code Review
  refs:
    api_top10:
    - API2:2023
    cwe:
    - CWE-256
    - CWE-522
  see:
  - WEB-PWD-012
  - WEB-JWT-009
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
