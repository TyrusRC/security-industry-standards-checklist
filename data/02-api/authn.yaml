- id: API-AUTHN-005
  sheet: API
  category: AUTHN
  title: Check that sensitive account changes need the current password
  objective: Finds endpoints that change email, phone or password with only a bearer token.
  steps:
  - Find the endpoints that change email, phone number, password or factors.
  - Send each request with a valid token but without the current password.
  - Send each request with a wrong current password.
  - Start a password reset after the email change.
  example: 'curl -X PUT https://api.example/account -H ''Authorization: Bearer <token>'' -d ''{"email":"new@x.test"}'''
  expected: The API asks for the current password or a new login before it changes sensitive data. The request fails without it.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    cwe:
    - CWE-620
  see:
  - WEB-PWD-004
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
- id: API-AUTHN-006
  sheet: API
  category: AUTHN
  title: Check that credentials and tokens are not sent in the URL
  objective: Finds API keys, tokens and passwords that appear in URLs and logs.
  steps:
  - List all endpoints that take an API key, token or password.
  - 'Read the securitySchemes of the API description for apiKey values with in: query.'
  - Find the endpoints that accept the secret in the query string.
  - Look in proxy, gateway and server logs for URLs that hold a secret.
  - Make sure the secret travels in a header or in the body.
  example: 'Burp search for apiKey, token, access_token in URLs; grep -i ''apikey='' access.log; example of an unsafe URL: /v1/data?apiKey=<key>.'
  expected: No secret is accepted in the URL. Logs do not show secrets.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-598
  see:
  - WEB-DATA-002
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Security_Cheat_Sheet.md
- id: API-AUTHN-007
  sheet: API
  category: AUTHN
  title: Check how API keys are used and revoked
  objective: Finds API keys that act as user logins or that the owner cannot limit.
  steps:
  - List the API keys that the API accepts and the clients that use them.
  - Check if a key identifies a user. Keys must identify only a client.
  - Send many requests with one key. Look for 429 responses.
  - Revoke a test key. Check that it is rejected at once.
  example: 'curl -H ''X-API-Key: <key>'' https://api.example/v1/ping in a loop; review of the key management screen.'
  expected: API keys identify API clients only. The API rate limits each key and returns 429. A revoked key is rejected.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    - API4:2023
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-287
    - CWE-799
  sources_read:
