- id: API-AUTHN-008
  sheet: API
  category: AUTHN
  title: Compare login and reset responses for valid and invalid accounts
  objective: Finds differences in status, body or time that reveal which accounts exist.
  steps:
  - Send a login with a valid user and a wrong password. Record status, body, length and time.
  - Send a login with an unknown user. Record the same values.
  - Repeat for the reset and registration endpoints.
  - Compare the records.
  example: Burp Comparer and Intruder with response timing; ffuf -mc all -fs <size> against the login endpoint.
  expected: Responses for valid and unknown accounts are the same in status, body and time.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    cwe:
    - CWE-204
    - CWE-203
    capec:
    - CAPEC-112
  see:
  - WEB-IDM-004
  - WEB-PWD-017
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
- id: API-AUTHN-009
  sheet: API
  category: AUTHN
  title: Send malformed and under-scoped tokens to every operation
  objective: Finds token checks that fail with a server error or that ignore scopes and roles.
  steps:
  - Send tokens that are truncated, have extra parts or bad Base64.
  - Check that the response is 401 and not a server error.
  - Send a valid token with a scope that does not grant the operation.
  - Send a valid token of a lower role to owner-only operations.
  example: 'jwt_tool <JWT> -M pb -t https://api.example/v1/me -rh ''Authorization: Bearer JWT''; Postman test that expects 401 or 403.'
  expected: Bad tokens give 401 and never a 500. A token without the needed scope or role gets 403.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-287
    - CWE-863
  see:
  - WEB-JWT-001
  - WEB-JWT-005
  - WEB-OAUTH-007
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
