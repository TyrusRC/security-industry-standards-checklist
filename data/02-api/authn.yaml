- id: API-AUTHN-002
  sheet: API
  category: AUTHN
  title: Find all authentication flows and test each one
  objective: Finds login paths, such as mobile, deep link or legacy flows, that skip controls.
  steps:
  - Ask the engineers for all ways to authenticate to the API.
  - Find more flows in the client code, the mobile app and the API description.
  - 'Test each flow for the same checks: lock out, rate limit and multi-factor.'
  - Compare the results and list flows with weaker controls.
  example: Burp site map filter on /login, /token, /auth, /oauth; ZAP spider; review of the gateway routes.
  expected: All authentication flows are known. Every flow applies the same lock out, rate limit and factor checks.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    cwe:
    - CWE-287
    - CWE-306
  see:
  - WEB-AUTHN-009
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
- id: API-AUTHN-003
  sheet: API
  category: AUTHN
  title: Test brute force and credential stuffing limits on API login
  objective: Finds login endpoints that allow many password guesses for one account or many accounts.
  preconditions:
  - Use a test account. Agree the volume with the owner of the system.
  steps:
  - Send repeated failed logins for one account. Count the requests before a block or delay.
  - Send one failed login for each of many accounts from one source.
  - Change the source IP header and the client ID. Check if the limit still holds.
  - Compare the limit with the limit of normal API calls.
  example: Burp Turbo Intruder or ffuf against POST /auth/login with a short wordlist on a test account; hydra is not needed.
  expected: The login limit is stricter than the general API limit. It holds per account and per source, and header changes do not bypass it.
  severity: High
  test_type: Automated
  refs:
    api_top10:
    - API2:2023
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-307
    - CWE-799
    capec:
    - CAPEC-49
    - CAPEC-112
    attack:
    - T1110
    - T1110.004
  see:
  - WEB-AUTHN-002
  - WEB-AUTHN-003
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Assessment_Cheat_Sheet.md
- id: API-AUTHN-004
  sheet: API
  category: AUTHN
  title: Treat password reset and recovery endpoints as login endpoints
  objective: Finds recovery endpoints that allow brute force of reset tokens or one-time codes.
  steps:
  - Start a reset for a test account. Send wrong tokens to the confirm endpoint many times.
  - Count the requests before a block.
  - Check if the token or code can be used more than once.
  - Check if the limit also applies on the beta or older API hosts.
  example: Burp Intruder on POST /password/reset/confirm with a 6-digit range; compare with the limit on the login endpoint.
  expected: Reset endpoints have lock out and rate limits like login. A token cannot be guessed in its lifetime.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    - API4:2023
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-307
    - CWE-799
    capec:
    - CAPEC-112
    attack:
