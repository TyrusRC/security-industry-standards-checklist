- id: API-AUTHN-001
  sheet: API
  category: AUTHN
  title: Call every operation without credentials and with bad credentials
  objective: Finds API operations that work without a valid authentication.
  preconditions:
  - The OpenAPI file or a Postman collection of the API.
  steps:
  - Build a list of all operations from the API description and the proxy history.
  - Send each operation without any credential.
  - Send each operation with an empty, expired and random token or API key.
  - List every operation that does not return 401.
  example: Newman run with the Authorization header removed; ZAP OpenAPI import plus a script that strips headers; Burp Autorize with an empty session.
  expected: Every non-public operation returns 401 without a valid credential. Public operations are listed in the API description.
  severity: Critical
  test_type: Manual
  refs:
    api_top10:
    - API2:2023
    wstg:
    - WSTG-APIT-01
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-306
    - CWE-287
    attack:
    - T1190
  see:
  - WEB-AUTHZ-005
  - WEB-AUTHN-009
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa2-broken-authentication.md
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/12-API_Testing/01-API_Reconnaissance.md
