- id: API-CONF-001
  sheet: API
  category: CONF
  title: Check that API traffic uses TLS on every hop
  objective: Finds API calls to clients, gateways and back ends that use clear text.
  steps:
  - Request the API on HTTP and HTTPS. Check if the HTTP request is refused.
  - Find the links between the gateway, the services and downstream APIs.
  - Capture traffic on an internal link. Look for clear text.
  - Check for privileged APIs that need mutual TLS.
  example: curl -v http://api.example/v1/ping; nmap --script ssl-enum-ciphers -p 443 api.example; tcpdump on a test node.
  expected: All API communication uses TLS, also inside the network. The API gives no data over clear text.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API8:2023
    asvs:
    - V12.3.1
    cheatsheet:
    - REST_Security_Cheat_Sheet
    - Web_Service_Security_Cheat_Sheet
    cwe:
    - CWE-319
  see:
  - WEB-TLS-005
  - WEB-TLS-011
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa8-security-misconfiguration.md
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Security_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Web_Service_Security_Cheat_Sheet.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: API-CONF-002
  sheet: API
  category: CONF
  title: Check security headers and cache control on API responses
  objective: Finds API responses that browsers or caches can store or misuse.
  steps:
  - Send requests to endpoints with private data. Read the response headers.
  - 'Look for Cache-Control: no-store, Content-Type and X-Content-Type-Options.'
  - Look for Strict-Transport-Security and the frame-ancestors value.
  - Check responses for 304 and for error codes too.
  example: curl -i https://api.example/dm/user_updates.json?conversation_id=1; ZAP passive scan; securityheaders.com style check of the API host.
  expected: 'Responses with private data have Cache-Control: no-store and the other listed headers. Content-Type matches the body.'
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API8:2023
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-525
  see:
  - WEB-DATA-011
  - WEB-HTTP-001
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa8-security-misconfiguration.md
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Security_Cheat_Sheet.md
- id: API-CONF-003
  sheet: API
  category: CONF
  title: Check the CORS policy of the API
  objective: Finds APIs that allow cross-origin reads from untrusted origins.
  steps:
  - Send requests with an Origin header of an untrusted domain.
  - Look at Access-Control-Allow-Origin and Access-Control-Allow-Credentials.
  - Send a preflight OPTIONS request for sensitive methods.
  - Disable CORS headers if no cross-origin client exists.
  example: 'curl -i -H ''Origin: https://evil.test'' https://api.example/v1/me; Burp CORS scanner extension.'
  expected: The API allows only listed origins, and never a wildcard with credentials. An API without browser clients sends no CORS headers.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API8:2023
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-942
  see:
  - WEB-CLIENT-002
  - WEB-CLIENT-015
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa8-security-misconfiguration.md
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Security_Cheat_Sheet.md
- id: API-CONF-004
  sheet: API
  category: CONF
  title: Check that error responses follow a schema and show no internals
  objective: Finds error responses with stack traces, queries or paths.
  steps:
  - Send invalid JSON, wrong types, absent fields and unknown routes.
  - Send a very long value and an invalid token.
  - Read the body of each error response.
  - Compare the errors with the error schema in the API description.
  example: curl -i -X POST https://api.example/v1/items -d '{bad'; Burp Intruder with malformed values; grep the responses for 'at com.' and 'Traceback'.
  expected: Errors are generic and follow the documented schema. They show no stack trace, query or internal path.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    api_top10:
    - API8:2023
    asvs:
    - V16.5.1
    cheatsheet:
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-209
  see:
  - WEB-ERR-001
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa8-security-misconfiguration.md
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Security_Cheat_Sheet.md
