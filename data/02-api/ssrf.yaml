  - sources/repos/CheatSheetSeries/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.md
- id: API-SSRF-002
  sheet: API
  category: SSRF
  title: Test URL parameters for access to internal addresses and ports
  objective: Finds API endpoints that call loopback, private or internal hosts for the client.
  preconditions:
  - Written permission to scan the internal network from the API host.
  steps:
  - Send a URL that points to the loopback address or an internal host name.
  - Send private network addresses and a different port for each request.
  - Compare the response time and the error text for open and closed ports.
  - Read the response body for data of the internal service.
  example: Burp Intruder on the url parameter with an internal address list; compare response times in Burp Logger.
  expected: The API refuses internal and private targets. Errors and response time do not show which internal ports are open.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API7:2023
    cheatsheet:
    - Server_Side_Request_Forgery_Prevention_Cheat_Sheet
    cwe:
