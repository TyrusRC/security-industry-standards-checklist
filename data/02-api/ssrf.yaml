- id: API-SSRF-003
  sheet: API
  category: SSRF
  title: Test webhook creation and test requests for response disclosure
  objective: Finds webhook features that show the response of the target to the user.
  steps:
  - Create a webhook that points to a server that you control.
  - Check the options that send a test request at creation time.
  - Create a webhook to an internal address. Read the API response and the delivery log.
  - Check if the full response body of the target returns to the client.
  example: POST /graphql createNotificationChannel with a callback URL; interactsh for blind calls; read the delivery history endpoint.
  expected: The API does not send raw responses of the target back to the client. Internal targets are refused at creation and at delivery.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API7:2023
    cheatsheet:
    - Server_Side_Request_Forgery_Prevention_Cheat_Sheet
    cwe:
    - CWE-918
    - CWE-200
