- id: API-SSRF-007
  sheet: API
  category: SSRF
  title: Check outbound network rules and metadata service protection
  objective: Finds hosts that can reach internal services and cloud metadata from the API process.
  steps:
  - Read the egress firewall and network policy for the hosts that fetch URLs.
  - From a test host, call the cloud metadata address of the provider.
  - Check that the metadata service needs a session token header (IMDSv2) and that the old version is off.
  - Check that fetch workers run in a separate network segment.
  example: aws ec2 describe-instances --query HttpTokens; kubectl get networkpolicy; curl to the metadata address from a test pod.
  expected: Fetch workers can reach only needed targets. The metadata service is protected and the old version is off.
  severity: High
  test_type: Config Review
