- id: API-SSRF-006
  sheet: API
  category: SSRF
  title: Check the allowed schemes, ports and media types of fetch features
  objective: Finds fetch features that accept protocols or content that the feature does not need.
  steps:
  - Read which schemes and ports the fetch feature must use.
  - Send file, ftp and other non-HTTP schemes.
  - Send ports that are not on the allowlist.
  - Send a URL that returns a type that the feature does not expect.
  example: curl -X POST https://api.example/api/profile/upload_picture -d '{"picture_url":"file:///etc/hostname"}' on a test system.
  expected: Only the listed schemes, ports and media types work. Other values give a generic 400 error.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API7:2023
    cheatsheet:
    - Server_Side_Request_Forgery_Prevention_Cheat_Sheet
    cwe:
    - CWE-918
    - CWE-20
