- id: API-SSRF-005
  sheet: API
  category: SSRF
  title: Test URL parser differences and allowlist bypass cases
  objective: Finds allowlists that fail because of URL parser differences or address forms.
  steps:
  - Send URLs with user info, extra dots, mixed case and alternative IP notations.
  - Send an IPv4-mapped IPv6 address and a name with more than one A record.
  - Send a name that resolves to a public address and then to a private one.
  - Check that the check and the request use the same parsed host.
  example: Burp Intruder with a list of URL forms and address notations; a DNS test domain with short TTL.
  expected: The API uses one URL parser. It checks the resolved IP address, binds the request to it and normalizes addresses before it compares them.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API7:2023
    cheatsheet:
    - Server_Side_Request_Forgery_Prevention_Cheat_Sheet
    cwe:
    - CWE-918
    capec:
    - CAPEC-664
