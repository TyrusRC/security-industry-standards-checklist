- id: API-SSRF-004
  sheet: API
  category: SSRF
  title: Test if the fetch follows redirects to internal targets
  objective: Finds fetch code that follows redirects and so passes the allowlist check.
  steps:
  - Host a URL on an allowed domain that sends a redirect to an internal address.
  - Send this URL in the API parameter.
  - Look at the logs of the redirect target.
  - Check the option for redirects in the HTTP client.
  example: python -m http.server with a 302 handler; interactsh as the redirect target; code review of the HTTP client options.
  expected: The fetch client does not follow redirects, or it checks each redirect target with the same rules.
  severity: High
  test_type:
  - Manual
  - Code Review
  refs:
    api_top10:
    - API7:2023
    cheatsheet:
    - Server_Side_Request_Forgery_Prevention_Cheat_Sheet
    cwe:
