- id: API-SSRF-001
  sheet: API
  category: SSRF
  title: Find API parameters that make the server fetch a URL
  objective: Finds API features such as webhooks, import and preview that call client-supplied URLs.
  steps:
  - Search the API description and the client code for parameters named url, uri, callback, webhook and image_url.
  - Look for features that fetch files, send test requests or build link previews.
  - Send a URL to a server that you control. Look for a request in its log.
  - Write down the source IP, headers and protocol of each request.
  example: 'Burp Collaborator or interactsh-client for an out-of-band URL; Burp Param Miner; example body: {"picture_url":"https://<collaborator>/p.jpg"}.'
  expected: Every URL parameter is known and documented. Each one is tied to an allowlist or a controlled fetch service.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API7:2023
    cheatsheet:
    - Server_Side_Request_Forgery_Prevention_Cheat_Sheet
    cwe:
    - CWE-918
    capec:
    - CAPEC-664
    attack:
    - T1190
  see:
  - WEB-INJ-021
  sources_read:
