- id: API-RES-005
  sheet: API
  category: RES
  title: Test slow requests and operations that run too long
  objective: Finds absent timeouts for slow clients and for expensive queries.
  preconditions:
  - Test environment only.
  steps:
  - Open a connection and send the request headers or the body very slowly.
  - Send expensive search, sort and filter requests.
  - Measure the time until the server stops the request.
  - Compare with the documented timeout.
  example: slowhttptest -c 1000 -H -u https://test.api.example/ ; curl --limit-rate 10; a search request with a wildcard filter.
  expected: The server closes slow connections and stops long requests after a set time. Minimum data rates and absolute timeouts exist.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - Denial_of_Service_Cheat_Sheet
    cwe:
    - CWE-400
    - CWE-770
    capec:
    - CAPEC-125
    attack:
    - T1499
  sources_read:
