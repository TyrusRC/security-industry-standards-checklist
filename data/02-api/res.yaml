- id: API-RES-001
  sheet: API
  category: RES
  title: Find out what each rate limit is based on
  objective: Finds rate limits that one client can bypass with a new IP, key or session.
  preconditions:
  - Agree the request volume with the owner. Do not run on production.
  steps:
  - Send requests to an expensive endpoint until the API returns 429. Record the count and the time window.
  - Change the source IP header, the user agent and the client ID. Send again.
  - Log in as a second user and repeat. Check if the limit is per user or per key.
  - Check if an authenticated session removes the limit.
  example: Burp Turbo Intruder; ffuf -rate; curl with X-Forwarded-For set to random values; record the 429 point and the Retry-After header.
  expected: Limits apply per account and per API key, not only per IP. A header change or a login does not remove the limit.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    - REST_Security_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-799
    capec:
    - CAPEC-125
    attack:
    - T1499
  see:
  - WEB-BIZ-009
