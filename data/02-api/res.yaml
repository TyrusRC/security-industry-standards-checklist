- id: API-RES-008
  sheet: API
  category: RES
  title: Check that limits bound the work of one request
  objective: Finds endpoints where one request does a large amount of work.
  steps:
  - Find search, export, bulk write and report endpoints.
  - Send one request that asks for the maximum work, such as a full export.
  - Send the same request in parallel up to the rate limit.
  - Compare the server load with a normal request.
  example: curl 'https://api.example/v1/export?format=csv&all=true'; bulk write with 10000 items; load graph in the test environment.
  expected: Costly operations have limits on the work per request, such as items and time, and on concurrent runs per client.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    - Web_Service_Security_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-400
    capec:
    - CAPEC-130
