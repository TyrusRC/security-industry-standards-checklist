- id: API-RES-002
  sheet: API
  category: RES
  title: Test the page size and the number of records per response
  objective: Finds endpoints that return very large result sets in one response.
  steps:
  - Find parameters such as limit, page_size, per_page and count.
  - Send very large, zero and negative values.
  - Send a request without a page size and check the default.
  - Compare the response size and time.
  example: curl 'https://api.example/v1/items?limit=1000000'; Burp Intruder with a number list for the limit parameter.
  expected: The API enforces a maximum page size on the server. Invalid values give 400 or the default value.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
