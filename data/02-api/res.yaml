  - sources/repos/CheatSheetSeries/cheatsheets/Denial_of_Service_Cheat_Sheet.md
- id: API-RES-006
  sheet: API
  category: RES
  title: Check that costly third-party calls are limited per target and per account
  objective: Finds endpoints that trigger paid SMS, email or other provider calls without a limit.
  preconditions:
  - Use a sandbox of the provider. Do not send real SMS.
  steps:
  - Find endpoints that make the back end call a paid provider, such as SMS or email.
  - Send many requests for the same phone number and for different numbers.
  - Count the provider calls in the test sandbox of the provider.
  - Check the cost limits and cost alerts at the provider.
  example: Mock provider or sandbox account; Burp Turbo Intruder on POST /initiate_forgot_password; review of provider billing settings.
  expected: The API limits requests per target and per account. The provider account has a cost limit or a cost alert.
  severity: High
  test_type:
  - Manual
  - Config Review
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-799
  sources_read:
  - sources/repos/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption.md
  - sources/repos/CheatSheetSeries/cheatsheets/REST_Assessment_Cheat_Sheet.md
- id: API-RES-007
  sheet: API
  category: RES
  title: Check the limit on single operations such as OTP check and recovery
  objective: Finds operations that a client can repeat without a limit, for example OTP checks.
  steps:
  - 'List operations that must have a low repeat count: OTP check, recovery and coupon check.'
  - Repeat each operation many times with one account.
  - Note the count where the API blocks or delays.
  - Repeat the test with a second token of the same account.
  example: Burp Turbo Intruder with a 6-digit OTP range on a test account; Postman runner with 100 iterations.
  expected: Each sensitive operation has its own low limit per account. A new token does not reset the count.
  severity: High
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - REST_Assessment_Cheat_Sheet
    cwe:
    - CWE-799
    - CWE-307
    capec:
    - CAPEC-112
    attack:
    - T1110
