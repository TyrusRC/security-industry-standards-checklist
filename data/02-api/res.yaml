- id: API-RES-004
  sheet: API
  category: RES
  title: Test file upload size limits and the work after the upload
  objective: Finds upload endpoints where a large or many files use too much memory or CPU.
  preconditions:
  - Test environment only.
  steps:
  - Find endpoints that take files or Base64 data and process them, for example thumbnails.
  - Send a file over the size limit.
  - Send many small uploads in parallel.
  - Watch the server time and memory in a test environment.
  example: curl -F file=@big.png https://api.example/v1/avatar; Turbo Intruder with 50 parallel uploads; monitoring graphs of the test host.
  expected: The API checks the size before it processes the file. The number of uploads and the work per upload have limits.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - Denial_of_Service_Cheat_Sheet
    - REST_Security_Cheat_Sheet
    cwe:
