- id: API-RES-003
  sheet: API
  category: RES
  title: Test the limits for body size, string length and array size
  objective: Finds endpoints that accept very large payloads.
  steps:
  - Send a body that is larger than the documented maximum.
  - Send a string with a length far over the field limit.
  - Send an array with many thousands of elements.
  - Send deeply nested JSON.
  example: 'curl --data-binary @big.json -H ''Content-Type: application/json'' https://api.example/v1/items; python -c to build a nested JSON file; check for HTTP 413.'
  expected: The API rejects oversize requests with 413 or 400 before it does costly work. Limits exist at the gateway and in the service.
  severity: Medium
  test_type: Manual
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - REST_Security_Cheat_Sheet
    - Web_Service_Security_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-400
    capec:
    - CAPEC-130
    attack:
    - T1499
  see:
