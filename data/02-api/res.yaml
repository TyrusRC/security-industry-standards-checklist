- id: API-RES-009
  sheet: API
  category: RES
  title: Check CPU, memory and process limits of the API runtime
  objective: Finds services that can use all the memory, file descriptors or processes of the host.
  steps:
  - Read the container or serverless settings of each API service.
  - Look for limits on memory, CPU, restarts, file descriptors and processes.
  - Check the limits for open connections and simultaneous files.
  - Check the alerts for the limits.
  example: kubectl describe pod and docker inspect for limits; ulimit -a in the container; review of the deployment files.
  expected: Each API service has limits for memory, CPU, file descriptors and processes. Alerts show when a limit is near.
  severity: Medium
  test_type: Config Review
  refs:
    api_top10:
    - API4:2023
    cheatsheet:
    - Web_Service_Security_Cheat_Sheet
    - Denial_of_Service_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-400
