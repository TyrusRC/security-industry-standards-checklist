- id: NET-PAM-010
  sheet: NET
  category: PAM
  title: 'Check central authentication clients: SSSD, LDAP, Kerberos and authselect'
  objective: Finds central login clients that use clear-text binds, skip certificate checks or let PAM files drift.
  preconditions: *id001
  steps:
  - Look at the authselect profile or the PAM files and make sure they are not changed by hand.
  - Read /etc/sssd/sssd.conf and look at the ldap_id_use_start_tls, ldap_tls_reqcert and CA settings.
  - Read /etc/openldap/ldap.conf and the nss_ldap settings for TLS.
  - Look at the offline credential and cache expiration values.
  - Look for unused LDAP, Kerberos and 389-ds server packages.
  example: authselect current ; grep -vE "^#|^$" /etc/sssd/sssd.conf ; grep -E "TLS|URI" /etc/openldap/ldap.conf ; ls -l /etc/krb5.keytab ; rpm -q openldap-servers krb5-server 389-ds-base
  expected: Directory binds use TLS with a full certificate check. The SSSD service runs as the sssd user. Credential caches expire. Unneeded directory servers are not installed.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
