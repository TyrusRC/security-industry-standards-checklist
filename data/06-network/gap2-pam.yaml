- id: NET-PAM-004
  sheet: NET
  category: PAM
  title: Check password aging and account expiration settings
  objective: Finds accounts with passwords that never expire, never warn or stay active after long inactivity.
  preconditions: *id001
  steps:
  - Read PASS_MAX_DAYS, PASS_MIN_DAYS and PASS_WARN_AGE in /etc/login.defs.
  - Read the default inactivity period with useradd -D.
  - List the aging values of the existing accounts with chage.
  - Look at emergency and temporary accounts for an expiration date.
  - Find accounts with a last change date in the future.
  example: 'grep -E "^PASS_(MAX|MIN|WARN)" /etc/login.defs ; useradd -D | grep INACTIVE ; chage -l <user> ; awk -F: ''{print $1,$3,$4,$5,$7}'' /etc/shadow'
  expected: New and existing accounts follow the aging limits of the organization standard. Temporary accounts have an end date. No last change date is in the future.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
    - cac:account_disable_inactivity_password_auth
    - cac:account_disable_inactivity_system_auth
    - cac:account_disable_post_pw_expiration
    - cac:account_emergency_admin
