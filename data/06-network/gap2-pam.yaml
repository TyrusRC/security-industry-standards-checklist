- id: NET-PAM-006
  sheet: NET
  category: PAM
  title: Check user session limits, umask, home directories and root PATH
  objective: Finds loose default file modes, open home directories, unsafe root paths and sessions that never end.
  preconditions: *id001
  steps:
  - Read the umask value in /etc/login.defs, /etc/profile, /etc/bashrc and the PAM umask setting.
  - Read the TMOUT value and the limits for concurrent logins in /etc/security/limits.conf.
  - Look at the owner and mode of each interactive home directory and of the files in it.
  - Look at the initialization files and the shell history for wrong owners and wide modes.
  - Print the PATH of root. Look for a dot, an empty entry or a writable directory.
  example: grep -rn umask /etc/login.defs /etc/profile /etc/profile.d /etc/bashrc ; grep -rn TMOUT /etc/profile.d /etc/profile ; grep maxlogins /etc/security/limits.conf /etc/security/limits.d/ ; stat -c
    "%U %a %n" /home/* ; sudo -i sh -c 'echo $PATH'
  expected: The umask blocks access by other users. Idle sessions end after the set time. Home directories have a mode of 0750 or stricter and the right owner. Root PATH has only safe directories.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:accounts_have_homedir_login_defs
    - cac:accounts_max_concurrent_login_sessions
