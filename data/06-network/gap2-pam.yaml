- id: NET-PAM-001
  sheet: NET
  category: PAM
  title: Check that PAM locks accounts after repeated failed logins
  objective: Finds hosts where online password guessing is not slowed or stopped by an account lockout.
  preconditions: &id001
  - Root or sudo read access to the host in scope.
  - Do not change settings on a production host without a change window.
  steps:
  - Open the PAM files /etc/pam.d/system-auth and /etc/pam.d/password-auth, or the files that the distribution uses.
  - Look for the pam_faillock module in the auth section, before and after pam_unix.
  - Read /etc/security/faillock.conf for the deny, fail_interval and unlock_time values.
  - Look at the lockout of the root account and at the directory that stores the failure records.
  - Try wrong passwords on a test account until the limit. Make sure the account locks and the lockout is logged.
  example: grep -rE "pam_faillock|pam_tally2|pam_faildelay" /etc/pam.d/ ; grep -vE "^#|^$" /etc/security/faillock.conf ; faillock --user testuser ; grep FAIL_DELAY /etc/login.defs
  expected: The pam_faillock module is active in auth. The deny, interval and unlock values meet the organization standard. Lockouts are logged and persist after a restart.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:account_password_pam_faillock_password_auth
    - cac:account_password_pam_faillock_system_auth
    - cac:account_password_selinux_faillock_dir
    - cac:account_passwords_pam_faillock_audit
    - cac:account_passwords_pam_faillock_dir
    - cac:accounts_logon_fail_delay
    - cac:accounts_passwords_pam_faildelay_delay
    - cac:accounts_passwords_pam_faillock_audit
    - cac:accounts_passwords_pam_faillock_deny
    - cac:accounts_passwords_pam_faillock_deny_root
    - cac:accounts_passwords_pam_faillock_dir
    - cac:accounts_passwords_pam_faillock_enabled
    - cac:accounts_passwords_pam_faillock_enforce_local
    - cac:accounts_passwords_pam_faillock_even_deny_root_or_root_unlock_time
    - cac:accounts_passwords_pam_faillock_interval
    - cac:accounts_passwords_pam_faillock_root_unlock_time
    - cac:accounts_passwords_pam_faillock_silent
    - cac:accounts_passwords_pam_faillock_unlock_time
    - cac:accounts_passwords_pam_faillock_unlock_time_with_zero
