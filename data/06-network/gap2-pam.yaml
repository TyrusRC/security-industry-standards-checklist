- id: NET-PAM-005
  sheet: NET
  category: PAM
  title: Check local accounts for duplicates, empty passwords and root misuse
  objective: Finds shared identifiers, empty passwords, extra UID 0 accounts and weak root controls.
  preconditions: *id001
  steps:
  - List accounts with an empty password field in /etc/shadow.
  - List accounts with UID 0 and groups with GID 0. Only root may appear.
  - Look for duplicate user names, group names, UIDs and GIDs.
  - Look for legacy "+" NIS entries in passwd, group and shadow.
  - Look for .rhosts, .netrc and .forward files and for system accounts with a shell or an unlocked password.
  example: 'awk -F: ''($2==""){print $1}'' /etc/shadow ; awk -F: ''($3==0){print $1}'' /etc/passwd ; getent passwd | cut -d: -f1 | sort | uniq -d ; grep "^+" /etc/passwd /etc/group /etc/shadow ; find /home
    /root -name ".rhosts" -o -name ".netrc" -o -name ".forward"'
  expected: No account has an empty password. Only root has UID 0 and GID 0. All names and IDs are unique. System accounts are locked and have no login shell.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:account_unique_id
    - cac:account_unique_name
    - cac:account_use_centralized_automated_auth
