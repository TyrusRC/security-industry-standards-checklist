- id: NET-PAM-008
  sheet: NET
  category: PAM
  title: Check console access controls, Ctrl-Alt-Del and session lock tools
  objective: Finds hosts where a person at the console can reboot, skip authentication or avoid the screen lock.
  preconditions: *id001
  steps:
  - Look at the systemd target for Ctrl-Alt-Del and its burst action.
  - Read the rescue and emergency service files and make sure they need a password.
  - Look for the debug-shell service and for interactive boot options.
  - Look for tmux, screen or vlock settings that lock the session after inactivity.
  - Read the idle session settings of logind.
  example: systemctl status ctrl-alt-del.target ; grep -E "ExecStart" /usr/lib/systemd/system/rescue.service /usr/lib/systemd/system/emergency.service ; systemctl is-enabled debug-shell.service ; grep -r
    "lock-" /etc/tmux.conf ; grep StopIdleSessionSec /etc/systemd/logind.conf
  expected: Ctrl-Alt-Del does not reboot the host. Single user and emergency modes need a password. The debug shell is off and idle sessions lock or end.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
