    - cac:accounts_password_pam_unix_no_remember
    - cac:accounts_password_pam_unix_remember
    - cac:accounts_password_pam_unix_rounds_password_auth
    - cac:accounts_password_pam_unix_rounds_system_auth
    - cac:disallow_bypass_password_sudo
    - cac:enable_pam_namespace
    - cac:ensure_pam_wheel_group_empty
