- id: NET-PAM-007
  sheet: NET
  category: PAM
  title: Check the login warning banners and the files that hold them
  objective: Finds hosts that show no legal notice or let ordinary users change the banner text.
  preconditions: *id001
  steps:
  - Read /etc/issue, /etc/issue.net and /etc/motd.
  - Compare the text with the banner text of the organization.
  - Look at the owner, group and mode of the three files.
  - Make sure the SSH daemon and the graphical login show the same banner.
  example: cat /etc/issue /etc/issue.net /etc/motd ; stat -c "%U:%G %a %n" /etc/issue /etc/issue.net /etc/motd ; sshd -T | grep -i banner ; dconf read /org/gnome/login-screen/banner-message-text
  expected: The banner files hold the approved text. Root owns the files and the mode is 0644 or stricter. Each remote and local login path shows the banner.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
    - cac:banner_etc_gdm_banner
