- id: NET-PAM-003
  sheet: NET
  category: PAM
  title: Check password hashing, password history and PAM module order
  objective: Finds weak stored hashes, password reuse and PAM stacks that skip the required modules.
  preconditions: *id001
  steps:
  - Read the password lines in the PAM files and look for pam_unix options such as sha512, yescrypt, rounds and use_authtok.
  - Look at ENCRYPT_METHOD and the rounds or cost values in /etc/login.defs and /etc/libuser.conf.
  - Look for pam_pwhistory with the remember option, and for the same setting for root.
  - Look at the authselect profile or the PAM files for pam_wheel on su and for pam_namespace.
  - Make sure all password hashes in /etc/shadow use the approved algorithm.
  example: 'grep -rE "pam_unix|pam_pwhistory|pam_wheel|pam_namespace" /etc/pam.d/ ; grep -E "ENCRYPT_METHOD|SHA_CRYPT|YESCRYPT" /etc/login.defs ; authselect current ; awk -F: ''$2 ~ /^\$/ {print $1, substr($2,1,3)}''
    /etc/shadow'
  expected: Passwords use the approved hash with enough rounds. The history keeps the number of old passwords that the standard sets, also for root. su is limited to a wheel group.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:accounts_password_all_shadowed_sha512
    - cac:accounts_password_pam_enforce_local
    - cac:accounts_password_pam_enforcing
    - cac:accounts_password_pam_modules_in_authselect_profile
