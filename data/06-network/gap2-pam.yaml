- id: NET-PAM-002
  sheet: NET
  category: PAM
  title: Check that PAM enforces password complexity rules
  objective: Finds hosts that accept short, simple or dictionary passwords.
  preconditions: *id001
  steps:
  - Make sure the pam_pwquality package is installed and the module is in the password stack.
  - Read /etc/security/pwquality.conf and the options in /etc/pam.d/system-auth and password-auth.
  - Look at minlen, minclass, the credit values, difok, maxrepeat, maxsequence and dictcheck.
  - Look for enforce_for_root and the retry limit.
  - Try to set a short or common password on a test account. Make sure the system refuses it.
  example: rpm -q libpwquality || dpkg -l libpam-pwquality ; grep -vE "^#|^$" /etc/security/pwquality.conf ; grep -r pwquality /etc/pam.d/ ; grep PASS_MIN_LEN /etc/login.defs
  expected: pam_pwquality is active for all password changes. Minimum length, character classes and dictionary checks meet the organization standard. The rules also apply to root.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:accounts_password_minlen_login_defs
