- id: NET-PAM-011
  sheet: NET
  category: PAM
  title: Check sudo configuration, file permissions and privilege rules
  objective: Finds sudo rules that give passwordless root, keep unsafe environments or allow users to avoid the log.
  preconditions: *id001
  steps:
  - Read /etc/sudoers and all files under /etc/sudoers.d.
  - Look for NOPASSWD, !authenticate and negated commands. Look for rules that target ALL or the root user.
  - Look for the Defaults use_pty, env_reset, logfile, passwd_timeout and timestamp settings.
  - Look at the owner and mode of the sudo binary, /etc/sudoers and /etc/sudoers.d.
  - Make sure the include directory is only the default one and that visudo accepts the files.
  example: grep -rnE "NOPASSWD|!authenticate|^Defaults" /etc/sudoers /etc/sudoers.d/ ; visudo -c ; stat -c "%U:%G %a %n" /etc/sudoers /etc/sudoers.d /usr/bin/sudo ; sudo -l -U <user>
  expected: Sudo needs a password and a real terminal. The environment is reset. Rules name exact commands. Only root owns the sudo files and the log file records each command.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:directory_groupowner_etc_sudoersd
