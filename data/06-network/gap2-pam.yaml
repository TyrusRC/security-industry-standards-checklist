- id: NET-PAM-009
  sheet: NET
  category: PAM
  title: Check smart card login settings for PAM and SSSD
  objective: Finds hosts that claim multifactor login but do not check the card certificate chain or revocation status.
  preconditions: *id001
  steps:
  - Look for the opensc, pcsc-lite and pcscd packages and services.
  - Read the PAM files and look for the smart card option in the auth stack.
  - Read the card driver and CA settings of opensc and the NSS database.
  - Look at the certificate status check and the CRL cache settings.
  - Try a login with a card from an unknown CA. Make sure the login fails.
  example: rpm -q opensc pcsc-lite ; systemctl is-enabled pcscd.socket ; grep -rE "pam_pkcs11|pam_sss.*cert|try_cert_auth|use_mappers" /etc/pam.d/ ; grep -E "card_drivers|cert_policy" /etc/pam_pkcs11/pam_pkcs11.conf
  expected: Smart card login is on where the policy needs it. The login checks the CA chain and the revocation status, and unknown cards are refused.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  refs:
    tool_check:
    - cac:configure_opensc_card_drivers
