- id: NET-REV-001
  sheet: NET
  category: REV
  title: Review network and data-flow diagrams and the list of allowed ports
  objective: Finds networks where the documents do not match the real system or list no approved services.
  steps:
  - Get the network diagram, the data-flow diagram and the list of allowed services, protocols and ports.
  - Make sure each allowed port has a business reason and an approver.
  - Compare the diagram with the results of a host and port scan.
  - Write down each host or flow that is not in the documents.
  example: 'nmap -sn -oX hosts.xml 10.10.0.0/24 ; compare hosts.xml with the diagram and the asset inventory'
  expected: The diagrams are current. Every open port and every data flow in the network is in the documents with a business reason and an approval.
  severity: Low
  test_type: Manual
  refs:
    wstg:
    - WSTG-CONF-01
    nist_800_53:
    - CM-8
    - CM-7
    pci_dss:
    - '1.2.3'
    - '1.2.4'
    - '1.2.5'
    other:
    - NIST SP 800-115 section 3.1 (documentation review)
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management/01-Network_Infrastructure_Configuration.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
  - sources/pci_dss/PCI-DSS-v4_0_1.md
- id: NET-REV-002
  sheet: NET
  category: REV
  title: Review firewall and router rulesets for deny by default and least privilege
  objective: Finds rules that are too wide, old, temporary or in the wrong order.
  steps:
  - Export the rulesets of each firewall and the access control lists of each router.
  - Make sure the last rule denies all traffic that is not allowed.
  - Look for rules that use any as a source, a destination or a port.
  - Look for temporary rules that are still active and for rules that nobody needs.
  - Make sure specific rules come before general rules.
  - Make sure no rule lets traffic go around other security controls.
  example: 'show running-config | section access-list ; iptables -S ; nft list ruleset ; Wireshark capture behind the firewall to see which traffic passes'
  expected: The ruleset denies all traffic by default and allows only listed sources, destinations and ports. Each rule has an owner and a reason, and no old rule remains.
  severity: High
  test_type: Config Review
  refs:
    wstg:
    - WSTG-CONF-01
    cheatsheet:
    - Network_Segmentation_Cheat_Sheet
    cwe:
    - CWE-284
    - CWE-668
    nist_800_53:
    - SC-7
    - CM-6
    pci_dss:
    - '1.2.1'
    - '1.2.7'
    - '1.3.1'
    - '1.4.2'
    other:
    - NIST SP 800-115 section 3.3 (ruleset review)
  sources_read:
