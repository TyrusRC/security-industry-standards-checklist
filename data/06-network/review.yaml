- id: NET-REV-005
  sheet: NET
  category: REV
  title: Capture network traffic and look for clear-text protocols and credentials
  objective: Finds protocols that send passwords or data in clear text on a network segment.
  steps:
  - Connect the sniffer to a tap or a mirror port on the segment.
  - Capture traffic for a defined time.
  - Filter the capture for telnet, FTP, HTTP, SNMP, LDAP and other clear-text protocols.
  - Look for user names, passwords and sensitive data in the packets.
  - Write down each unauthorized or clear-text protocol and the hosts that use it.
  example: 'tshark -i eth1 -a duration:600 -w seg.pcap ; tshark -r seg.pcap -Y "telnet || ftp || http.authorization || snmp" -T fields -e ip.src -e ip.dst -e frame.protocols'
  expected: The capture shows no clear-text credentials and no clear-text sensitive data. Only approved encrypted protocols carry management and login traffic.
  severity: High
  test_type: Manual
  preconditions:
  - Written approval for traffic capture on the segment.
  - Do not run on production without approval of the network owner.
  refs:
    attack:
    - T1040
    capec:
    - CAPEC-158
    cwe:
    - CWE-319
    nist_800_53:
    - SC-8
    pci_dss:
    - '4.2.1'
    other:
    - NIST SP 800-115 section 3.5 (network sniffing)
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
  - sources/pci_dss/PCI-DSS-v4_0_1.md
- id: NET-REV-006
  sheet: NET
  category: REV
  title: Check that file integrity monitoring covers critical system and device files
  objective: Finds hosts and devices where changes to critical files go unseen.
  steps:
  - Get the list of critical files that the file integrity tool guards.
  - Make sure the tool compares files at least once each week.
  - Change a test file in the guarded list.
  - Make sure the tool sends an alert for the change.
  - Make sure the reference database is stored offline or in a protected place.
  example: 'aide --check ; tripwire --check ; echo test >> /etc/<guarded-file> (use a test copy and restore it)'
  expected: The tool guards the critical files, compares them at least weekly and alerts on each change. Attackers cannot change the reference database.
  severity: Medium
  test_type: Manual
  refs:
    nist_800_53:
    - SI-7
    pci_dss:
    - '11.5.2'
    other:
    - NIST SP 800-115 section 3.6 (file integrity checking)
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
  - sources/pci_dss/PCI-DSS-v4_0_1.md
