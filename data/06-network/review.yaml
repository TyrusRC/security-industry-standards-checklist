- id: NET-REV-003
  sheet: NET
  category: REV
  title: Review host-based firewall rules and IDS or IPS rulesets
  objective: Finds host rules that allow backdoors and monitoring rules that are off or out of date.
  steps:
  - Export the host-based firewall rules of a sample of servers.
  - Look for rules that allow prohibited applications or unknown listeners.
  - Export the IDS or IPS signature list and the date of the last update.
  - Make sure the needed signatures are on and the unneeded signatures are off.
  - Make sure the IDS or IPS monitors the perimeter and the critical segments.
  example: 'iptables -S ; netstat -tulpn ; ufw status verbose ; Get-NetFirewallRule -Enabled True -Direction Inbound'
  expected: Host rules allow only approved applications. Needed IDS or IPS signatures are on and current. Traffic at the perimeter and at critical segments is monitored.
  severity: Medium
  test_type: Config Review
  refs:
    nist_800_53:
    - SI-4
    - SC-7
    pci_dss:
    - '11.5.1'
    - '1.5.1'
    other:
    - NIST SP 800-115 section 3.3 (ruleset review)
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
  - sources/pci_dss/PCI-DSS-v4_0_1.md
- id: NET-REV-004
  sheet: NET
  category: REV
  title: Review the system configuration of network hosts against a hardening standard
  objective: Finds unneeded services, weak account settings and wrong log and backup settings.
  steps:
  - Get the hardening standard or checklist that the organization uses.
  - Export the settings of a sample of servers, routers and switches.
  - Compare each setting with the standard.
  - Make sure each deviation has an approval and a reason.
  - Run an automated check tool where one exists, and check the rest by hand.
  example: 'oscap xccdf eval --profile <profile> --results r.xml <benchmark>.xml ; lynis audit system'
  expected: Each setting matches the hardening standard, or the deviation is approved and documented. No unneeded service runs.
  severity: Medium
  test_type: Config Review
  refs:
    wstg:
    - WSTG-CONF-01
    cheatsheet:
    - Attack_Surface_Analysis_Cheat_Sheet
    cwe:
    - CWE-1188
    nist_800_53:
    - CM-6
    - CM-7
    pci_dss:
    - '2.2.1'
    - '2.2.4'
    other:
    - NIST SP 800-115 section 3.4 (system configuration review)
  sources_read:
