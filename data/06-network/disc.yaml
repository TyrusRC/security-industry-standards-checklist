- id: NET-DISC-001
  sheet: NET
  category: DISC
  title: Find live hosts in scope and compare them with the inventory
  objective: Finds hosts that are on the network but not in the inventory.
  preconditions:
  - Written approval for scans of the address ranges in scope.
  - Do not run on production without a scan window and the approval of the network owner.
  steps:
  - Get the list of address ranges in scope and the asset inventory.
  - Run a host discovery scan from the external viewpoint.
  - Run a host discovery scan from the internal viewpoint.
  - Compare the live hosts with the inventory.
  - Write down each live host that has no owner or is not in the inventory.
  example: 'nmap -sn -PE -PS22,80,443 -PA3389 -oA disc-ext <range> ; masscan <range> -p80,443,22 --rate 1000 -oL masscan.txt'
  expected: Every live host is in the inventory and has an owner. No unknown host answers in the ranges in scope.
  severity: Medium
  test_type: Automated
  refs:
    wstg:
    - WSTG-INFO-04
    attack:
    - T1018
    - T1595.001
    capec:
    - CAPEC-292
    nist_800_53:
    - CM-8
    - CA-7
    other:
    - NIST SP 800-115 section 4.1 (network discovery)
  see:
  - WEB-INFO-004
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/01-Information_Gathering/04-Attack_Surface_Identification.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
- id: NET-DISC-002
  sheet: NET
  category: DISC
  title: Use passive discovery to find hosts, protocols and traffic relations
  objective: Finds hosts and flows that active scans miss, such as hosts that are off or filtered.
  preconditions:
  - Written approval for traffic capture on the segment.
  steps:
  - Connect the sniffer to a tap or a mirror port on the segment.
  - Capture traffic for a full business cycle.
  - List the IP and MAC addresses, the protocols and the talk pairs in the capture.
  - Compare the list with the inventory and the active scan results.
  - Write down each host, protocol or flow that is not in the inventory or the diagram.
  example: 'tshark -i eth1 -a duration:3600 -w seg.pcap ; tshark -r seg.pcap -q -z conv,ip ; Wireshark: Statistics > Conversations'
  expected: Every host, protocol and flow in the capture is in the inventory and the data-flow diagram. No unapproved protocol is in use.
  severity: Low
  test_type: Manual
  refs:
    attack:
    - T1040
    capec:
    - CAPEC-313
    nist_800_53:
    - CM-8
    - SI-4
    other:
    - NIST SP 800-115 sections 3.5 and 4.1 (passive discovery)
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
- id: NET-DISC-003
  sheet: NET
  category: DISC
  title: Detect rogue wired devices and trace them to the switch port
  objective: Finds unauthorized devices that connect to the wired network.
  preconditions:
  - Written approval from the network owner.
  steps:
  - Get the list of approved devices, vendors and operating systems.
  - Scan the network and list the MAC address vendor and the operating system of each host.
  - Mark each host that does not match the approved list.
  - Find the switch and the port of each marked host in the switch MAC table.
  - Make sure the network has a control that alerts on new devices.
  example: 'nmap -O -sV --osscan-guess <range> -oX os.xml ; show mac address-table | include <mac> (on the switch)'
  expected: Only approved devices are on the network. The network raises an alert when an unknown device connects.
  severity: Medium
  test_type: Manual
  refs:
    attack:
    - T1200
    nist_800_53:
    - CM-8
    - SC-7
    other:
    - NIST SP 800-115 section 4.1 (rogue device detection)
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
- id: NET-DISC-004
  sheet: NET
  category: DISC
  title: Scan all TCP ports and compare open ports with the approved list
  objective: Finds open ports that are not approved or that have no business need.
  preconditions:
  - Written approval for port scans of the hosts in scope.
  - Do not run on production without a scan window. Use a slow scan rate on old systems.
  steps:
  - Get the list of approved services, protocols and ports for each host.
  - Run a TCP scan of all 65535 ports from the external viewpoint.
  - Run the same scan from the internal viewpoint.
  - Compare the open ports with the approved list.
  - Write down each open port that is not approved.
  example: 'nmap -Pn -sS -p- --min-rate 500 -T3 -oA tcp-all <host> ; masscan <range> -p0-65535 --rate 1000 -oL masscan.txt'
  expected: Only approved ports are open. Each open port has a business reason, an owner and an approval.
  severity: High
  test_type: Automated
  refs:
    wstg:
    - WSTG-CONF-01
    - WSTG-INFO-04
    attack:
    - T1046
    capec:
    - CAPEC-300
    - CAPEC-287
    cwe:
    - CWE-1327
    nist_800_53:
    - CM-7
    - SC-7
    pci_dss:
    - '1.2.5'
    - '2.2.4'
    other:
    - NIST SP 800-115 section 4.2 (port and service identification)
  see:
  - WEB-INFO-004
  sources_read:
