- id: NET-FW-004
  sheet: NET
  category: FW
  title: Check UFW and SuSEfirewall2 state and default policy
  objective: Finds hosts where the front-end firewall is installed but not active, or allows traffic by default.
  preconditions: *id001
  steps:
  - Run ufw status verbose.
  - Look at the default incoming, outgoing and routed policies.
  - Look for the loopback rules and the rate limit rule for SSH.
  - On SUSE hosts, look at the SuSEfirewall2 package, service and DoS protection settings.
  - Make sure no second firewall service is active.
  example: ufw status verbose ; grep -E "^DEFAULT" /etc/default/ufw ; systemctl is-enabled ufw SuSEfirewall2 ; grep FW_PROTECT_FROM_INT /etc/sysconfig/SuSEfirewall2
  expected: The firewall service is active. Incoming and routed policy is deny. Outgoing policy follows the standard. Loopback rules exist.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:check_ufw_active
    - cac:package_SuSEfirewall2_installed
    - cac:package_ufw_installed
    - cac:package_ufw_removed
    - cac:service_SuSEfirewall2_enabled
    - cac:service_ufw_enabled
    - cac:set_ufw_default_rule
    - cac:set_ufw_loopback_traffic
    - cac:susefirewall2_ddos_protection
    - cac:ufw_default_incoming_rule
    - cac:ufw_default_outgoing_rule
    - cac:ufw_disabled_routed
    - cac:ufw_rate_limit
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-ufw/check_ufw_active/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-ufw/package_ufw_removed/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-ufw/set_ufw_default_rule/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-ufw/ufw_default_incoming_rule/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-ufw/ufw_rate_limit/rule.yml
- id: NET-FW-005
  sheet: NET
  category: FW
  title: Check IPsec packages, tunnels and configuration file permissions
  objective: Finds IPsec tunnels that no one approved or secret files that other users can read.
  preconditions: *id001
  steps:
  - Look for the libreswan or strongswan package.
  - List the active tunnels with ipsec status.
  - Compare each tunnel with the approved tunnel list.
  - List /etc/ipsec.conf, /etc/ipsec.secrets and /etc/ipsec.d with owner and mode.
  example: rpm -q libreswan strongswan ; ipsec status ; ipsec trafficstatus ; stat -c "%U:%G %a %n" /etc/ipsec.conf /etc/ipsec.secrets /etc/ipsec.d
  expected: Every tunnel is on the approved list. Root owns the IPsec files and the secrets file has a mode of 0600.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:directory_groupowner_etc_ipsecd
    - cac:directory_owner_etc_ipsecd
    - cac:directory_permissions_etc_ipsecd
    - cac:file_groupowner_etc_ipsec_conf
    - cac:file_groupowner_etc_ipsec_secrets
    - cac:file_owner_etc_ipsec_conf
    - cac:file_owner_etc_ipsec_secrets
    - cac:file_permissions_etc_ipsec_conf
    - cac:file_permissions_etc_ipsec_secrets
    - cac:libreswan_approved_tunnels
    - cac:package_libreswan_installed
    - cac:package_strongswan_installed
    nist_800_53:
    - CM-6
    - AC-17
    - MA-4
    - AC-4
    pci_dss:
    - '4.1'
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-ipsec/directory_groupowner_etc_ipsecd/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-ipsec/file_groupowner_etc_ipsec_conf/rule.yml
