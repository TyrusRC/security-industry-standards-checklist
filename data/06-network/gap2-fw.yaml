- id: NET-FW-006
  sheet: NET
  category: FW
  title: 'Check host network settings: DHCP, DDNS, zeroconf, sniffing and DNS mode'
  objective: Finds hosts with automatic network features that an attacker on the LAN can use.
  preconditions: *id001
  steps:
  - List the interfaces and look for the promiscuous flag.
  - Look at DHCP client options in /etc/dhcp/dhclient.conf and at the use of static addresses.
  - Look for zeroconf, DDNS updates and wireless or Bluetooth interfaces that the role does not need.
  - Read the name resolution and NetworkManager DNS mode settings.
  - Look at the permissions to change network settings with nmcli.
  example: ip -d link | grep -i promisc ; grep -vE "^#|^$" /etc/dhcp/dhclient.conf ; grep -r NOZEROCONF /etc/sysconfig/network ; nmcli radio ; grep dns /etc/NetworkManager/NetworkManager.conf ; nmcli general
    permissions
  expected: No interface is in promiscuous mode. Zeroconf and DDNS are off. Unused wireless and Bluetooth interfaces are off. Only approved users can change network settings.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:dhcp_client_restrict_options
    - cac:firewall_single_service_active
    - cac:network_configure_name_resolution
    - cac:network_disable_ddns_interfaces
    - cac:network_disable_zeroconf
    - cac:network_implement_access_control
    - cac:network_nmcli_permissions
    - cac:network_sniffer_disabled
    - cac:networkmanager_dns_mode
    - cac:only_allow_dod_certs
    - cac:only_allow_specific_certs
    - cac:package_dhcp_client_removed
    - cac:service_bluetooth_disabled
    - cac:sysconfig_networking_bootproto_ifcfg
    - cac:wireless_disable_in_bios
    - cac:wireless_disable_interfaces
    nist_800_53:
    - CM-7
    - CM-6
    - AC-18
    - MP-7
    pci_dss:
    - 1.3.3
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/services/dhcp/dhcp_client_configuration/dhcp_client_restrict_options/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network_disable_zeroconf/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/networkmanager/networkmanager_dns_mode/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-wireless/wireless_software/service_bluetooth_disabled/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/network/network-wireless/wireless_software/wireless_disable_interfaces/rule.yml
