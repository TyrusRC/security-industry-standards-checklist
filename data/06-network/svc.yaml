- id: NET-SVC-007
  sheet: NET
  category: SVC
  title: Make sure the container daemon API is not exposed on the network
  objective: Finds hosts where a network client can control containers and get root on the host.
  preconditions:
  - Written approval for scans of the hosts in scope.
  steps:
  - Scan the hosts for the container daemon TCP ports.
  - Read the daemon start options and look for a TCP listen address.
  - Look for containers that mount the daemon socket.
  - Try an unauthenticated API request to each port that answers.
  example: 'nmap -Pn -p 2375,2376 <range> ; curl -s http://<host>:2375/version ; ps aux | grep dockerd ; docker ps --format "{{.Names}} {{.Mounts}}"'
  expected: The daemon does not listen on an unprotected TCP port. No container mounts the daemon socket.
  severity: Critical
  test_type: Automated
  refs:
    cheatsheet:
    - Docker_Security_Cheat_Sheet
    cwe:
    - CWE-306
    - CWE-1327
    nist_800_53:
    - CM-7
    - SC-7
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Docker_Security_Cheat_Sheet.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
