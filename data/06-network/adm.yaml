- id: NET-ADM-007
  sheet: NET
  category: ADM
  title: Check that network configurations are controlled, backed up and checked for change
  objective: Finds device and infrastructure configurations that change without approval or record.
  steps:
  - Get the stored configuration of a sample of devices.
  - Compare it with the running configuration.
  - Look for the change tickets of the differences.
  - Make sure the infrastructure code or the configuration store has access control and version history.
  - Make sure secrets are not stored in the infrastructure code.
  example: 'diff <(ssh <device> show running-config) stored/<device>.cfg ; git log --stat -- network/ ; tfsec . or checkov -d .'
  expected: Running configurations match the stored and approved ones. Each change has a ticket and a version record, and the code holds no secrets.
  severity: Medium
  test_type: Config Review
  refs:
    cheatsheet:
    - Infrastructure_as_Code_Security_Cheat_Sheet
    nist_800_53:
    - CM-3
    - CM-5
    - CM-6
    pci_dss:
    - '1.2.2'
    - '1.2.8'
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
