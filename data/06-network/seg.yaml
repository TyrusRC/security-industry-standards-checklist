  - sources/pci_dss/PCI-DSS-v4_0_1.md
- id: NET-SEG-009
  sheet: NET
  category: SEG
  title: Check that a written network security policy exists and matches the rules
  objective: Finds firewall rules that no policy approves, and policies that no rule enforces.
  steps:
  - Get the network security policy that lists the allowed flows.
  - Take a sample of firewall rules from the main zone borders.
  - Look for a policy line for each sampled rule.
  - Look for a rule for each policy line about a main flow, such as logs, monitoring and CI/CD.
  example: 'Compare the policy with the export of rules: show access-lists ; nft list ruleset ; manual sample of 20 rules'
  expected: Each sampled rule has a policy line, and each main policy line has a rule. The policy is current and approved.
  severity: Low
  test_type: Manual
  refs:
    cheatsheet:
    - Network_Segmentation_Cheat_Sheet
    nist_800_53:
    - SC-7
    - CM-6
    pci_dss:
    - '1.2.1'
    - '1.2.2'
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Network_Segmentation_Cheat_Sheet.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
  - sources/pci_dss/PCI-DSS-v4_0_1.md
- id: NET-SEG-010
  sheet: NET
  category: SEG
  title: Scan infrastructure code for open network rules before deployment
  objective: Finds open security group rules and weak network settings before they reach production.
  steps:
  - Find the repositories that define networks, firewalls and security groups as code.
  - Run a static analysis tool on the code.
  - Look for rules with any source, any port or public addresses.
  - Make sure the pipeline runs the tool on each change and blocks high findings.
  example: 'checkov -d infra/ ; tfsec infra/ ; kubescape scan . ; grep -rn "0.0.0.0/0" infra/'
  expected: The code defines no open rule that the policy does not allow. The pipeline blocks changes with high findings.
  severity: Medium
  test_type: Code Review
  refs:
    cheatsheet:
    - Infrastructure_as_Code_Security_Cheat_Sheet
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-1327
    nist_800_53:
    - CM-3
    - CM-6
    - SC-7
  see:
  - WEB-CONF-001
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A02_2025-Security_Misconfiguration.md
