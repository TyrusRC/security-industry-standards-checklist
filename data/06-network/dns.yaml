- id: NET-DNS-001
  sheet: NET
  category: DNS
  title: Make sure name servers refuse DNS zone transfers from unknown hosts
  objective: Finds name servers that give the full list of hosts in a zone to anyone.
  preconditions:
  - Written approval for queries to the name servers in scope.
  steps:
  - List the name servers of each domain in scope.
  - Request a zone transfer from each name server.
  - Request a zone transfer again from a host that is not on the transfer allow list.
  - Write down each name server that returns zone data.
  example: 'dig NS example.com +short ; dig AXFR example.com @ns1.example.com ; host -l example.com ns1.example.com ; dnsrecon -d example.com -t axfr'
  expected: Each name server refuses zone transfers from unknown hosts. Only listed secondary servers can get a transfer.
  severity: Medium
  test_type: Automated
  refs:
    wstg:
    - WSTG-INFO-04
    attack:
    - T1590.002
    capec:
    - CAPEC-291
    cwe:
    - CWE-200
    nist_800_53:
    - SC-22
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/01-Information_Gathering/04-Attack_Surface_Identification.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
- id: NET-DNS-002
  sheet: NET
  category: DNS
  title: Check the DNS record inventory and the order of service decommissioning
  objective: Finds DNS records with no owner and processes that leave records for removed services.
  steps:
  - Get the DNS inventory that links each record to a resource and an owner.
  - Export all records of the zone and compare them with the inventory.
  - Look for CNAME, NS and MX records that point to removed or third-party services.
  - Read the decommission procedure. Make sure it removes the DNS record before the resource.
  - Make sure a scheduled scan checks that each record target still exists.
  example: 'dig AXFR example.com @ns1 (if allowed) ; dnsrecon -d example.com -t std ; for h in $(cat cnames.txt); do dig +short $h; done'
  expected: Every record has an owner and a live target. The procedure removes the DNS record first, and a scan finds dangling records at least weekly.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-CONF-10
    cheatsheet:
    - Subdomain_Takeover_Prevention_Cheat_Sheet
    nist_800_53:
    - CM-8
    - SC-22
  see:
  - WEB-CONF-011
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Subdomain_Takeover_Prevention_Cheat_Sheet.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
- id: NET-DNS-003
  sheet: NET
  category: DNS
  title: Check CAA records and Certificate Transparency monitoring for the domains
  objective: Finds domains where any certificate authority can issue certificates and nobody sees new ones.
  steps:
  - Query the CAA records of each domain and subdomain.
  - Compare the listed certificate authorities with the ones the organization uses.
  - Search the Certificate Transparency logs for certificates of the domain.
  - Look for certificates that nobody in the organization asked for.
  - Make sure an alert exists for new certificates.
  example: 'dig CAA example.com +short ; curl -s "https://crt.sh/?q=%25.example.com&output=json" | jq -r ".[].name_value" | sort -u'
  expected: CAA records list only approved certificate authorities. Each logged certificate is known, and new certificates raise an alert.
  severity: Low
  test_type: Manual
  refs:
    wstg:
    - WSTG-INFO-04
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    - Subdomain_Takeover_Prevention_Cheat_Sheet
    nist_800_53:
    - SC-17
    - SC-12
    attack:
    - T1596.003
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Transport_Layer_Security_Cheat_Sheet.md
