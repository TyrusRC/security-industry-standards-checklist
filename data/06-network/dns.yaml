- id: NET-DNS-004
  sheet: NET
  category: DNS
  title: Make sure recursive resolvers do not answer queries from the internet
  objective: Finds open resolvers that attackers use for amplification and for cache attacks.
  preconditions:
  - Written approval for queries to the resolvers in scope.
  - Do not run on production with large query volumes.
  steps:
  - Find the hosts that answer on UDP and TCP port 53.
  - From an external host, send a query for a name that the server does not host.
  - Look at the response flags to see if the server resolves the name for you.
  - Make sure authoritative and recursive roles run on separate servers.
  example: 'nmap -sU -sT -p 53 --script dns-recursion <range> ; dig @<ns-ip> www.example.net A +norecurse ; dig @<ns-ip> www.example.net A'
  expected: Authoritative servers do not resolve names for outside hosts. Recursive resolvers answer only internal clients.
  severity: Medium
  test_type: Automated
  refs:
    attack:
    - T1498.002
    capec:
    - CAPEC-490
    cheatsheet:
    - Denial_of_Service_Cheat_Sheet
    cwe:
    - CWE-668
    nist_800_53:
    - SC-22
    - SC-21
    - SC-5
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Denial_of_Service_Cheat_Sheet.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
- id: NET-DNS-005
  sheet: NET
  category: DNS
  title: Check DNSSEC signing of zones and validation on resolvers
  objective: Finds zones and resolvers with no data origin authentication of DNS answers.
  preconditions:
  - Written approval for queries to the name servers in scope.
  steps:
  - Query the DNSKEY and DS records of each public zone.
  - Check that answers from the authoritative servers carry signatures.
  - Send a query for a name with a bad signature to the internal resolver.
  - Look at the answer to see if the resolver rejects it.
  example: 'dig DNSKEY example.com +dnssec +multi ; dig DS example.com +trace ; dig @<resolver> dnssec-failed.org A (expect SERVFAIL)'
  expected: Public zones are signed and the chain of trust is complete. Resolvers check signatures and reject answers that fail.
  severity: Low
  test_type: Automated
  refs:
    attack:
    - T1584.002
    cwe:
    - CWE-345
    nist_800_53:
    - SC-20
    - SC-21
  sources_read:
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
- id: NET-DNS-006
  sheet: NET
  category: DNS
  title: Look for internal host names and addresses in public DNS data
  objective: Finds public DNS data that shows the internal layout of the network.
  steps:
  - Query the public zone for all common record types.
  - Run reverse queries on the public address ranges.
  - Search passive DNS and certificate logs for the domain.
  - Look for internal host names, private addresses and test systems in the results.
  example: 'dnsrecon -d example.com -t std,brt,rvl -r <range>/24 ; dig -x <ip> +short ; dig example.com ANY'
  expected: Public DNS data holds no internal host names and no private addresses. Reverse records exist only for hosts that need them.
  severity: Low
  test_type: Automated
  refs:
    wstg:
    - WSTG-INFO-04
    attack:
    - T1590.002
    - T1596.001
    capec:
    - CAPEC-169
    cwe:
    - CWE-200
    nist_800_53:
    - SC-22
