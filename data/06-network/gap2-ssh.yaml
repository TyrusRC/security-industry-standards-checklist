- id: NET-SSH-006
  sheet: NET
  category: SSH
  title: Check the SSH package, service and firewall state against the host role
  objective: Finds hosts where the SSH server is on without a need, or is needed but blocked.
  preconditions: *id001
  steps:
  - Look for the OpenSSH server and client packages.
  - Look at the sshd service state.
  - Look at the firewall rule for the SSH service.
  - Compare the result with the role of the host.
  example: rpm -q openssh-server openssh-clients || dpkg -l openssh-server ; systemctl is-enabled sshd ; firewall-cmd --list-services ; ss -tlnp | grep :22
  expected: The SSH server is on only where the host role needs it. The firewall allows the port only from approved sources.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
    - cac:firewalld_sshd_disabled
    - cac:iptables_sshd_disabled
    - cac:package_openssh-clients_installed
    - cac:package_openssh-server_installed
    - cac:package_openssh-server_removed
    - cac:package_openssh_installed
    - cac:package_openssh_removed
    - cac:service_sshd_disabled
    - cac:service_sshd_enabled
    nist_800_53:
    - SC-8
    - CM-6
    - CM-3
    - IA-2
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/firewalld_sshd_disabled/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/package_openssh-clients_installed/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/package_openssh-server_removed/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/package_openssh_removed/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/service_sshd_enabled/rule.yml
- id: NET-SSH-007
  sheet: NET
  category: SSH
  title: Check SSH client settings for ciphers, MACs and entropy
  objective: Finds SSH clients that connect with weak algorithms or weak random number sources.
  preconditions: *id001
  steps:
  - Print the effective client configuration with ssh -G.
  - Look at the Ciphers, MACs and RekeyLimit values.
  - Compare the lists with the approved algorithms.
  - Look at the SSH_USE_STRONG_RNG variable in the shell profile files.
  example: ssh -G <host> | grep -iE "^(ciphers|macs|rekeylimit)" ; grep -rn SSH_USE_STRONG_RNG /etc/profile.d/ /etc/profile /etc/csh.cshrc
  expected: The client offers only approved ciphers and MACs. The client uses a strong random source for the seed.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
    - cac:ssh_client_rekey_limit
    - cac:ssh_client_use_approved_ciphers_ordered_stig
    - cac:ssh_client_use_strong_rng_csh
    - cac:ssh_client_use_strong_rng_sh
    - cac:ssh_use_approved_macs_ordered_stig
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/ssh_client/ssh_client_rekey_limit/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/ssh_client/ssh_client_use_approved_ciphers_ordered_stig/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/ssh_client/ssh_client_use_strong_rng_csh/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/ssh_client/ssh_client_use_strong_rng_sh/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/ssh/ssh_client/ssh_use_approved_macs_ordered_stig/rule.yml
