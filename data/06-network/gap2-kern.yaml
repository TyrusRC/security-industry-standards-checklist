- id: NET-KERN-005
  sheet: NET
  category: KERN
  title: Check that unneeded kernel modules cannot load
  objective: Finds hosts that can load rare network, wireless, file system and media modules that add attack surface.
  preconditions: *id001
  steps:
  - Find the modprobe files that set install lines or blacklist entries.
  - Look for the modules atm, can, dccp, firewire-core, rds, sctp and tipc.
  - Look for the file system modules cramfs, freevxfs, hfs, hfsplus, jffs2, squashfs, udf, vfat and usb-storage.
  - Look for the wireless, bluetooth and uvcvideo modules on servers.
  - Run lsmod. Try modprobe for one module and make sure it does not load.
  example: grep -rE "install .* /bin/(true|false)|blacklist" /etc/modprobe.d/ ; for m in dccp sctp rds tipc cramfs squashfs udf usb-storage; do modprobe -n -v $m; done ; lsmod | grep -E "dccp|sctp|rds|tipc|cramfs|squashfs|udf|usb_storage"
  expected: The modules that the host role does not need cannot load. Each one is blacklisted or has an install line that runs /bin/false. lsmod does not list them.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
    - cac:kernel_module_atm_disabled
    - cac:kernel_module_bluetooth_disabled
    - cac:kernel_module_can_disabled
    - cac:kernel_module_cfg80211_disabled
    - cac:kernel_module_cramfs_disabled
