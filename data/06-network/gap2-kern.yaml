- id: NET-KERN-006
  sheet: NET
  category: KERN
  title: Check the kernel command line for mitigation and memory hardening options
  objective: Finds hosts that boot without CPU flaw mitigations or kernel memory protections.
  preconditions: *id001
  steps:
  - Read /proc/cmdline and the default kernel arguments in /etc/default/grub.
  - Look for pti, spectre_v2, spec_store_bypass_disable, l1tf, mds, mitigations and nosmep or nosmap (must be absent).
  - Look for slab_nomerge, init_on_alloc, init_on_free, page_alloc.shuffle and vsyscall.
  - Look for audit=1 and the debug-shell argument (must be absent).
  - Read the mitigation status files under /sys/devices/system/cpu/vulnerabilities.
  example: cat /proc/cmdline ; grep GRUB_CMDLINE_LINUX /etc/default/grub ; grep -r . /sys/devices/system/cpu/vulnerabilities/ ; grubby --info=ALL | grep args
  expected: The command line has the mitigation and memory options that the standard lists and none of the options that switch protections off. The CPU status files show mitigations.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:coreos_page_poison_kernel_argument
