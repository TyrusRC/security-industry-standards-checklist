- id: NET-KERN-001
  sheet: NET
  category: KERN
  title: Check the IPv4 sysctl settings for routing, redirects and spoofing
  objective: Finds hosts that act as routers, accept redirects or source routes, or skip reverse path checks.
  preconditions: &id001
  - Root or sudo read access to the host in scope.
  - Do not change settings on a production host without a change window.
  steps:
  - Read the live values with sysctl for net.ipv4.conf.all, net.ipv4.conf.default and net.ipv4.
  - Look at ip_forward, accept_redirects, send_redirects, secure_redirects and accept_source_route.
  - Look at rp_filter, log_martians, icmp_echo_ignore_broadcasts and tcp_syncookies.
  - Look at the files under /etc/sysctl.d and /etc/sysctl.conf. Make sure the values stay after a restart.
  example: sysctl net.ipv4.ip_forward net.ipv4.conf.all.accept_redirects net.ipv4.conf.all.send_redirects net.ipv4.conf.all.accept_source_route net.ipv4.conf.all.rp_filter net.ipv4.conf.all.log_martians
    net.ipv4.tcp_syncookies net.ipv4.icmp_echo_ignore_broadcasts ; sysctl --system | grep -i ipv4
  expected: Forwarding, redirects and source routing are off unless the host is a router. Reverse path filtering, martian logging, SYN cookies and the broadcast ping filter are on. The values persist.
  severity: Medium
  test_type:
  - Config Review
  - Automated
  refs:
    tool_check:
    - cac:sysctl_net_ipv4_conf_all_accept_local
    - cac:sysctl_net_ipv4_conf_all_accept_redirects
    - cac:sysctl_net_ipv4_conf_all_accept_source_route
