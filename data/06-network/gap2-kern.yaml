- id: NET-KERN-003
  sheet: NET
  category: KERN
  title: Check kernel and filesystem sysctl hardening values
  objective: Finds hosts that leak kernel addresses, allow unsafe debug features or lack link and file protections.
  preconditions: *id001
  steps:
  - 'Read the values with sysctl: kernel.kptr_restrict, kernel.dmesg_restrict, kernel.randomize_va_space and kernel.yama.ptrace_scope.'
  - Read kernel.kexec_load_disabled, kernel.sysrq, kernel.unprivileged_bpf_disabled and net.core.bpf_jit_harden.
  - Read kernel.perf_event_paranoid, user.max_user_namespaces and vm.mmap_min_addr.
  - Read fs.protected_symlinks, fs.protected_hardlinks, fs.protected_fifos, fs.protected_regular and fs.suid_dumpable.
  - Look at the owner and mode of /etc/sysctl.d and make sure the values persist.
  example: sysctl kernel.kptr_restrict kernel.dmesg_restrict kernel.randomize_va_space kernel.yama.ptrace_scope kernel.kexec_load_disabled kernel.sysrq kernel.unprivileged_bpf_disabled net.core.bpf_jit_harden
    kernel.perf_event_paranoid vm.mmap_min_addr fs.protected_symlinks fs.suid_dumpable ; stat -c "%U:%G %a" /etc/sysctl.d
  expected: 'Values are at least as strict as the rule values: for example kptr_restrict 1, randomize_va_space 2, suid_dumpable 0, protected_symlinks 1 and sysrq 0. Root owns /etc/sysctl.d.'
  severity: Medium
  test_type:
  - Config Review
  - Automated
  refs:
    tool_check:
    - cac:directory_groupowner_etc_sysctld
    - cac:directory_owner_etc_sysctld
    - cac:directory_permissions_etc_sysctld
    - cac:sysctl_conf_symlink_etc_sysctl_d
