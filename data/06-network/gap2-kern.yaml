- id: NET-KERN-002
  sheet: NET
  category: KERN
  title: Check the IPv6 sysctl settings and the IPv6 interface plan
  objective: Finds hosts that accept router advertisements, redirects or source routes, or that run IPv6 with no plan.
  preconditions: *id001
  steps:
  - Read the live values of net.ipv6.conf.all and net.ipv6.conf.default with sysctl.
  - Look at accept_ra, accept_redirects, accept_source_route, forwarding, autoconf and max_addresses.
  - 'Look at disable_ipv6 and compare it with the plan: IPv6 in use or IPv6 off.'
  - Look at the address, gateway and privacy extension settings of the network manager.
  example: sysctl -a 2>/dev/null | grep -E "net.ipv6.conf.(all|default).(accept_ra|accept_redirects|accept_source_route|forwarding|autoconf|disable_ipv6|max_addresses)" ; ip -6 addr ; nmcli -f ipv6 connection
    show <name>
  expected: Router advertisements, redirects and source routes are off unless the host needs them. If the network does not use IPv6, IPv6 is off. Values persist after a restart.
  severity: Medium
  test_type:
  - Config Review
  - Automated
  refs:
    tool_check:
    - cac:network_ipv6_default_gateway
    - cac:network_ipv6_disable_interfaces
    - cac:network_ipv6_disable_rpc
