- id: NET-KERN-004
  sheet: NET
  category: KERN
  title: Check core dump storage and execution protection settings
  objective: Finds hosts that write process memory to disk, where it can expose keys and passwords.
  preconditions: *id001
  steps:
  - Read /etc/security/limits.conf and limits.d for the core limit of users.
  - Read /etc/systemd/coredump.conf and look at Storage and ProcessSizeMax.
  - Look at the state of systemd-coredump and at kernel.core_pattern.
  - Look at the daemon umask and at the BIOS or CPU no-execute setting.
  example: grep -rE "^\*.*core" /etc/security/limits.conf /etc/security/limits.d/ ; grep -vE "^#|^$" /etc/systemd/coredump.conf ; sysctl kernel.core_pattern fs.suid_dumpable ; systemctl is-enabled systemd-coredump.socket
    ; grep umask /etc/sysconfig/init
  expected: Core dumps are off for users or are not stored. The core pattern does not write files. The no-execute feature is on.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
    - cac:bios_enable_execution_restrictions
    - cac:coredump_disable_backtraces
    - cac:coredump_disable_storage
    - cac:disable_users_coredumps
    - cac:install_PAE_kernel_on_x86-32
    - cac:service_systemd-coredump_disabled
    - cac:umask_for_daemons
    nist_800_53:
    - CM-6
    - SC-7
    - SC-39
    - AC-6
    pci_dss:
    - '3.2'
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/permissions/restrictions/enable_nx/bios_enable_execution_restrictions/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/permissions/restrictions/coredumps/coredump_disable_backtraces/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/permissions/restrictions/coredumps/disable_users_coredumps/rule.yml
