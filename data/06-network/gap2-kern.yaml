- id: NET-KERN-007
  sheet: NET
  category: KERN
  title: Check the kernel build options for hardening
  objective: Finds kernels that were built without memory protection, module signing and attack surface reduction.
  preconditions: *id001
  steps:
  - Find the kernel config file for the running kernel.
  - Look for CONFIG_MODULE_SIG, CONFIG_MODULE_SIG_FORCE, CONFIG_STRICT_KERNEL_RWX and CONFIG_HARDENED_USERCOPY.
  - Look for CONFIG_STACKPROTECTOR_STRONG, CONFIG_FORTIFY_SOURCE, CONFIG_RANDOMIZE_BASE and CONFIG_SLAB_FREELIST_HARDENED.
  - Look for CONFIG_DEBUG_FS, CONFIG_DEVKMEM, CONFIG_ACPI_CUSTOM_METHOD and CONFIG_IA32_EMULATION (should be off where not needed).
  - Compare the result with the build standard of the organization.
  example: zcat /proc/config.gz 2>/dev/null || cat /boot/config-$(uname -r) | grep -E "CONFIG_(MODULE_SIG|STRICT_KERNEL_RWX|HARDENED_USERCOPY|STACKPROTECTOR_STRONG|FORTIFY_SOURCE|RANDOMIZE_BASE|DEBUG_FS|DEVKMEM|SLAB_FREELIST_HARDENED)="
  expected: The kernel config enables the memory protections, signing and randomization options of the standard. Debug and legacy options are off.
  severity: Low
  test_type:
  - Config Review
  - Code Review
  refs:
    tool_check:
