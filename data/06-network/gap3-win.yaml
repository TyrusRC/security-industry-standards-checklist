- id: NET-WIN-011
  sheet: NET
  category: WIN
  title: Look for writable service binaries, service keys and unquoted service paths
  objective: Finds services that a standard user can change to run code as SYSTEM.
  preconditions: *id001
  steps:
  - List the services with their binary path and run-as account.
  - Note each path that has spaces and no quotation marks.
  - Read the ACL of each service binary and its folder. Look for write rights for Users or Everyone.
  - Read the ACL of each service registry key. Look for write rights for non-admin groups.
  - Note the services that run as LocalSystem.
  example: Get-CimInstance Win32_Service | Select Name,StartName,PathName ; icacls "<service binary path>" ; (Get-Acl "HKLM:\SYSTEM\CurrentControlSet\Services\<name>").Access
  expected: No service binary, its folder or its registry key allows write access to non-admin users. All paths with spaces use quotation marks.
  severity: High
  test_type:
  - Config Review
  - Manual
  refs:
    attack:
    - T1574.010
    - T1574.011
    - T1574.009
    - T1543.003
    cwe:
    - CWE-732
    - CWE-276
    - CWE-428
    nist_800_53:
    - AC-6
    - CM-6
    other:
    - 'CWE-732, CWE-276, CWE-428 definitions in sources/cwe/cwec_latest.xml.zip. Thin source: no Microsoft page for service ACL checks.'
  sources_read:
  - sources/cwe/cwec_latest.xml.zip
  - sources/extra/gap3-B/alwaysinstallelevated.md
- id: NET-WIN-012
  sheet: NET
  category: WIN
  title: Look for writable autorun and scheduled task targets
  objective: Finds startup items and tasks that run as a privileged user from a folder that standard users can write to.
  preconditions: *id001
  steps:
  - List the Run and RunOnce keys for the machine and the startup folder for all users.
  - List the scheduled tasks that run as SYSTEM or an admin.
  - Read the ACL of each target file and folder.
  - Note any target that standard users can write to or replace.
  example: reg query HKLM\Software\Microsoft\Windows\CurrentVersion\Run ; Get-ScheduledTask | % { $_.Actions.Execute } ; icacls "<target path>"
  expected: Every autorun and scheduled task target is in a folder that only administrators and SYSTEM can write to.
  severity: High
  test_type:
  - Config Review
  - Manual
  refs:
    attack:
    - T1547.001
    - T1053.005
    cwe:
    - CWE-732
    - CWE-276
    nist_800_53:
    - AC-6
    - CM-6
    other:
    - CWE-732 and CWE-276 in sources/cwe/cwec_latest.xml.zip. Thin source.
  sources_read:
  - sources/cwe/cwec_latest.xml.zip
- id: NET-WIN-013
  sheet: NET
  category: WIN
  title: 'Check sensitive user rights: debug, impersonate and log on'
  objective: Finds accounts that hold rights that allow token theft or privilege escalation.
  preconditions: *id001
  steps:
  - Read the user right "Debug programs".
  - Read the user right "Impersonate a client after authentication".
  - Read "Access Credential Manager as a trusted caller" and "Allow log on locally".
  - List the services that run as an account with the impersonate right and that a user can reach.
  example: secedit /export /cfg sec.inf /areas USER_RIGHTS ; findstr "SeDebugPrivilege SeImpersonatePrivilege SeTrustedCredManAccessPrivilege SeInteractiveLogonRight" sec.inf
  expected: Debug programs is limited to Administrators. Impersonate is limited to Administrators, Service, Local Service and Network Service. Credential Manager trust is held by no one.
  severity: High
  test_type:
  - Config Review
  - Manual
  refs:
    attack:
    - T1134
    - T1134.001
    capec:
    - CAPEC-233
    cwe:
    - CWE-269
    nist_800_53:
    - AC-6
    - AC-6(1)
    other:
    - https://learn.microsoft.com/azure/governance/policy/samples/guest-configuration-baseline-windows
  sources_read:
  - sources/extra/gap3-B/guest-configuration-baseline-windows.md
- id: NET-WIN-014
  sheet: NET
  category: WIN
  title: Check that User Account Control uses Admin Approval Mode for admins
  objective: Finds hosts where admin tokens run without a prompt or on a non-secure desktop.
  preconditions: *id001
  steps:
  - Read "Run all administrators in Admin Approval Mode".
  - Read "Admin Approval Mode for the Built-in Administrator account".
  - Read the elevation prompt behavior for administrators and standard users.
  - Read "Switch to the secure desktop when prompting for elevation".
  - Read "Only elevate UIAccess applications that are installed in secure locations".
  example: reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v EnableLUA /v FilterAdministratorToken /v ConsentPromptBehaviorAdmin /v ConsentPromptBehaviorUser /v PromptOnSecureDesktop
  expected: Admin Approval Mode is on for all admins. The prompt for administrators is 2 and the prompt for standard users is 0. The secure desktop is on.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  refs:
    attack:
    - T1068
    cwe:
    - CWE-250
    nist_800_53:
    - AC-6
    - CM-6
    other:
    - https://learn.microsoft.com/azure/governance/policy/samples/guest-configuration-baseline-windows
  sources_read:
  - sources/extra/gap3-B/guest-configuration-baseline-windows.md
