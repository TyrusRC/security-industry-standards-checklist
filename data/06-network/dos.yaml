- id: NET-DOS-005
  sheet: NET
  category: DOS
  title: Check the ISP and DDoS filtering service for coverage and capacity
  objective: Finds services that depend on one link and have no plan against volumetric attacks.
  steps:
  - Get the contract or service description of the ISP and of the DDoS filtering provider.
  - Look for more than one internet access point and for the bandwidth of each.
  - Look at the mitigation capacity and the layers that the provider covers.
  - Look at the contact and the escalation process for an attack.
  - Look at where the provider routes and inspects the traffic, and compare it with the privacy rules.
  example: 'Review of contracts and runbooks. Check routes with: traceroute -n <service-ip> ; dig +short <service-name> to see if DNS points to the filter'
  expected: The service has more than one access point and enough capacity. A filtering service covers the large attacks, and the escalation process is known.
  severity: Medium
  test_type: Manual
  refs:
    cheatsheet:
    - Denial_of_Service_Cheat_Sheet
    attack:
    - T1498
    nist_800_53:
    - SC-5
    - SC-5(2)
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Denial_of_Service_Cheat_Sheet.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
- id: NET-DOS-006
  sheet: NET
  category: DOS
  title: Check that DoS indicators are monitored and create alerts
  objective: Finds networks where a flood or resource drain goes unseen until the service fails.
  preconditions:
  - Written approval and a test window.
  - Do not run on production at high rates.
  steps:
  - Look at the monitoring of bandwidth, connection counts, CPU and memory on edge systems.
  - Look at the alert thresholds and the persons who get the alerts.
  - Send a small, safe burst of test traffic that crosses a threshold.
  - Look at the alert and the time until a responder sees it.
  example: 'iperf3 -c <test-host> -t 30 -P 8 (test link only) ; check the monitoring dashboard and the alert mail'
  expected: The monitoring shows the flood or drain and raises an alert to the responders in the agreed time.
  severity: Low
  test_type: Manual
  refs:
    cheatsheet:
    - Denial_of_Service_Cheat_Sheet
    nist_800_53:
    - SC-5
    - SI-4
    pci_dss:
    - '11.5.1'
  sources_read:
