- id: NET-LOG-001
  sheet: NET
  category: LOG
  title: Review firewall, router and IDS logs for blocked and unusual traffic
  objective: Finds attacks, misconfigurations and compromised hosts that the logs show but nobody acts on.
  steps:
  - Get the logs of firewalls, routers, IDS or IPS and authentication servers for a set period.
  - Look for unauthorized connection attempts and traffic that the rules should block.
  - Look for outbound connections from internal hosts to unknown destinations.
  - Look for repeated failed logins and for account changes.
  - Write down each event that nobody investigated.
  example: 'grep -E "DENY|DROP|REJECT" /var/log/firewall.log | awk "{print \$<src-col>}" | sort | uniq -c | sort -rn | head ; zeek-cut id.orig_h id.resp_h < conn.log'
  expected: The logs show the events that the logging policy requires. Each unusual event has an investigation record, and no log shows traffic that the rules should block.
  severity: Medium
  test_type: Manual
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-778
    nist_800_53:
    - AU-6
    - SI-4
    pci_dss:
    - '10.4.1'
    other:
    - NIST SP 800-115 section 3.2 (log review)
  see:
  - WEB-LOG-014
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/repos/CheatSheetSeries/cheatsheets/Logging_Cheat_Sheet.md
