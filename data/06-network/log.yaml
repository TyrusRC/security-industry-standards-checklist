- id: NET-LOG-004
  sheet: NET
  category: LOG
  title: Check that a port scan and failed logins create logs and alerts
  objective: Finds monitoring that does not see common attack steps on the network.
  preconditions:
  - Written approval and notice to the security operations team, as the plan says.
  - Do not run on production without a test window.
  steps:
  - Tell the contact in the plan about the source address of the test.
  - Run a port scan from an external test host.
  - Send a small number of failed logins to a test account on a remote service.
  - Look at the firewall, IDS and authentication logs for both actions.
  - Look at the alerts and the time until a responder reads them.
  example: 'nmap -Pn -sS -p 1-1024 <target> ; hydra -l testuser -p wrong-password -t 1 ssh://<target> ; check SIEM search for the test source address'
  expected: Both actions appear in the logs of the right devices. The monitoring raises an alert and a responder reads it in the agreed time.
  severity: Medium
  test_type: Manual
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-778
    nist_800_53:
    - SI-4
    - AU-6
    - CA-8
    pci_dss:
    - '11.5.1'
    - '12.10.5'
    other:
    - NIST SP 800-115 sections 4.2 and 5.2 (compare logs with scans; defenders ability to detect)
  see:
  - WEB-LOG-014
