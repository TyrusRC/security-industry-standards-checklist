- id: NET-LOG-003
  sheet: NET
  category: LOG
  title: Check that devices share one time source and keep logs long enough
  objective: Finds logs that cannot be matched across devices, or that are gone when needed.
  steps:
  - Compare the clocks of a sample of devices and servers with the time source.
  - Look at the time zone and the time format in the log entries.
  - Read the retention settings of the log server.
  - Make sure logs of the last 12 months exist.
  - Make sure logs of the last three months are ready for analysis.
  example: 'chronyc tracking ; ntpq -p ; show clock detail ; ls -l /var/log/central/ | head'
  expected: All devices follow one time source and log in a common time format. Logs are kept for at least 12 months, with the last three months ready for analysis.
  severity: Low
  test_type: Config Review
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    nist_800_53:
    - SC-45
    - AU-8
    pci_dss:
    - '10.6.1'
    - '10.5.1'
  see:
  - WEB-LOG-003
