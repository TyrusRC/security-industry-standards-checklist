- id: NET-LOG-002
  sheet: NET
  category: LOG
  title: Check that devices send logs securely to a central server
  objective: Finds devices whose logs stay on the device, where an attacker can delete them.
  steps:
  - List all firewalls, routers, switches, IDS and servers in scope.
  - Read the log destination on each device.
  - Make sure the destination is a separate central log server.
  - Make sure the transport is secure, for example syslog over TLS.
  - Generate a test event on a device and find it on the log server.
  example: 'show logging | include host ; logger -p auth.notice "net-log-test" ; grep net-log-test /var/log/central/*.log'
  expected: Every device sends its logs promptly to a central log server on a separate system, over a secure channel. The test event arrives on the server.
  severity: Medium
  test_type: Config Review
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    - Network_Segmentation_Cheat_Sheet
    nist_800_53:
    - AU-9
    - AU-9(2)
    - AU-12
    pci_dss:
    - '10.3.3'
    - '10.2.1'
  see:
  - WEB-LOG-013
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Logging_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Network_Segmentation_Cheat_Sheet.md
