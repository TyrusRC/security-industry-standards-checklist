- id: NET-LOG-005
  sheet: NET
  category: LOG
  title: Check that logins and configuration changes on network devices are logged
  objective: Finds devices where an attacker or admin can change settings without a record.
  steps:
  - Make sure the device logs successful and failed administrator logins.
  - Change a harmless setting on a test device.
  - Look at the device log and the central log server for the change.
  - Make sure the entry shows who, when and from where.
  example: 'show logging | include (LOGIN|CONFIG) ; journalctl -u sshd --since "10 min ago" ; grep "config" /var/log/central/*.log'
  expected: Logins and configuration changes appear in the logs with the user, the time and the source address. Logs do not hold passwords.
  severity: Medium
  test_type: Manual
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    cwe:
