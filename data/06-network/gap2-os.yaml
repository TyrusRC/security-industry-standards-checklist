- id: NET-OS-001
  sheet: NET
  category: OS
  title: Check the owner and mode of account files and their backups
  objective: Finds password and group files that other users can read or change.
  preconditions: &id001
  - Root or sudo read access to the host in scope.
  - Do not change settings on a production host without a change window.
  steps:
  - List /etc/passwd, /etc/shadow, /etc/group, /etc/gshadow and /etc/shells.
  - List the backup files with a dash suffix, such as /etc/shadow-.
  - List /etc/security/opasswd and opasswd.old.
  - Make sure root owns the files and the modes are as strict as the standard sets.
  example: stat -c "%U:%G %a %n" /etc/passwd /etc/shadow /etc/group /etc/gshadow /etc/shells /etc/passwd- /etc/shadow- /etc/group- /etc/gshadow- /etc/security/opasswd
  expected: Root owns all account files. /etc/passwd and /etc/group have a mode of 0644 or stricter. Shadow files and password history have a mode of 0000 or 0640 at most.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:file_etc_security_opasswd
