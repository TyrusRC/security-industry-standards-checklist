- id: NET-OS-007
  sheet: NET
  category: OS
  title: Check bootloader password, file permissions and recovery options
  objective: Finds hosts where a person with console access can change boot options or start a root shell.
  preconditions: *id001
  steps:
  - Read /boot/grub2/grub.cfg or /boot/efi/EFI/<vendor>/grub.cfg and the user.cfg file.
  - Look for the superuser line and the password hash. Make sure the hash is PBKDF2.
  - List the owner and mode of grub.cfg and user.cfg.
  - Look for the recovery menu entries and for the removable media boot option.
  - Look at the zipl bootmap on s390 systems if they are in scope.
  example: grep -E "set superusers|password_pbkdf2" /boot/grub2/grub.cfg /boot/grub2/user.cfg /boot/efi/EFI/*/user.cfg ; stat -c "%U:%G %a %n" /boot/grub2/grub.cfg /boot/grub2/user.cfg /boot/efi/EFI/*/grub.cfg
    ; grep -c "recovery" /boot/grub2/grub.cfg
  expected: The bootloader needs a superuser and a hashed password to edit boot entries. Root owns the grub files and the mode is 0600 or 0700 as the standard says. Recovery entries are off.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:file_groupowner_boot_grub2
    - cac:file_groupowner_efi_grub2_cfg
    - cac:file_groupowner_efi_user_cfg
