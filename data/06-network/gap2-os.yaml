- id: NET-OS-004
  sheet: NET
  category: OS
  title: Check mount options nodev, nosuid and noexec on partitions
  objective: Finds partitions where users can run programs, create devices or use setuid files.
  preconditions: *id001
  steps:
  - Read /etc/fstab and the live mounts with findmnt.
  - Look at /tmp, /var/tmp, /dev/shm, /home, /boot, /var and /var/log and /var/log/audit.
  - Make sure each one has nodev, nosuid and noexec where the role allows.
  - Look at the mount options of removable media and of remote file systems (NFS, SMB).
  - Look at hidepid on /proc and at the quota options on /home.
  example: findmnt -no TARGET,OPTIONS /tmp /var/tmp /dev/shm /home /boot /var /var/log /var/log/audit /proc ; grep -vE "^#" /etc/fstab ; mount | grep -E "nfs|cifs"
  expected: Each partition has the options that the standard lists, at least nodev and nosuid, and noexec on /tmp, /var/tmp and /dev/shm. Remote and removable file systems use nosuid, nodev and noexec.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
