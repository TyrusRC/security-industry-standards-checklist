- id: NET-OS-003
  sheet: NET
  category: OS
  title: Check ownership and mode of system binaries, libraries and boot map files
  objective: Finds system programs and libraries that non-root users can replace.
  preconditions: *id001
  steps:
  - List the files in /bin, /sbin, /usr/bin, /usr/sbin, /usr/local/bin and /usr/local/sbin with their owner and mode.
  - List the files in /lib, /lib64, /usr/lib and /usr/lib64.
  - Find files with a group-write or world-write bit and files not owned by root.
  - List System.map, /etc/crypttab and the sysconfig files for sshd.
  example: find /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin /lib /lib64 /usr/lib /usr/lib64 \( -perm /022 -o ! -user root \) -ls ; stat -c "%U:%G %a %n" /boot/System.map-* /etc/crypttab
  expected: Root owns all system programs and libraries. None has a group-write or world-write bit. System.map and crypttab have a mode of 0600 or 0644 and are owned by root.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:dir_group_ownership_library_dirs
