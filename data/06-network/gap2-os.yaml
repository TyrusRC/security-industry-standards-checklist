- id: NET-OS-008
  sheet: NET
  category: OS
  title: Check that UEFI Secure Boot is on
  objective: Finds hosts that start unsigned boot components.
  preconditions: *id001
  steps:
  - Run mokutil --sb-state or read the firmware setting.
  - Look at the kernel messages for the Secure Boot line.
  - Look at the list of enrolled keys.
  example: mokutil --sb-state ; dmesg | grep -i "secure boot" ; bootctl status | grep -i secure
  expected: Secure Boot is enabled and the host starts only signed boot components.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:secure_boot_enabled
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/secureboot/secure_boot_enabled/rule.yml
- id: NET-OS-009
  sheet: NET
  category: OS
  title: Check that SELinux is enforcing with the targeted policy
  objective: Finds hosts where mandatory access control is off or lets daemons run unconfined.
  preconditions: *id001
  steps:
  - Run getenforce and sestatus.
  - Read /etc/selinux/config for SELINUX and SELINUXTYPE.
  - Look at the kernel command line for selinux=0 or enforcing=0.
  - List unconfined processes and unlabeled device files.
  - Look at the SELinux user mappings for logins.
  example: getenforce ; sestatus ; grep -E "^SELINUX" /etc/selinux/config ; grep -E "selinux=0|enforcing=0" /proc/cmdline ; ps -eZ | grep unconfined_service_t ; semanage login -l
  expected: SELinux runs in enforcing mode with the targeted policy. No daemon runs unconfined and no device file is unlabeled. The SELinux packages are installed and troubleshooting tools are removed.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:coreos_enable_selinux_kernel_argument
