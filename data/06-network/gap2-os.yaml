- id: NET-OS-011
  sheet: NET
  category: OS
  title: Check that AppArmor is loaded and its profiles are enforced
  objective: Finds hosts where profiles are missing or are only in complain mode.
  preconditions: *id001
  steps:
  - Run aa-status.
  - Look at the number of profiles in enforce, complain and unconfined mode.
  - Look for the AppArmor kernel argument and packages.
  - Look at the pam_apparmor module.
  example: aa-status ; cat /sys/module/apparmor/parameters/enabled ; grep apparmor /proc/cmdline ; dpkg -l apparmor apparmor-utils libpam-apparmor
  expected: AppArmor is on. All profiles are in enforce mode. The packages are installed.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:all_apparmor_profiles_enforced
    - cac:all_apparmor_profiles_in_enforce_complain_mode
    - cac:apparmor_configured
    - cac:grub2_enable_apparmor
    - cac:package_apparmor-utils_installed
    - cac:package_apparmor_installed
    - cac:package_pam_apparmor_installed
    nist_800_53:
    - AC-6
    - CM-7
    - AC-3
    - SC-7
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/apparmor/all_apparmor_profiles_enforced/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/apparmor/all_apparmor_profiles_in_enforce_complain_mode/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/apparmor/grub2_enable_apparmor/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/apparmor/package_apparmor_installed/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/apparmor/package_pam_apparmor_installed/rule.yml
- id: NET-OS-012
  sheet: NET
  category: OS
  title: Check desktop login, screen lock and remote access settings
  objective: Finds desktop hosts that allow guest login, automatic login, unlocked screens or open remote desktops.
  preconditions: *id001
  steps:
  - Read /etc/gdm/custom.conf and /etc/dconf/db for the lock, idle and login settings.
  - Look at AutomaticLogin, TimedLogin, guest login and XDMCP.
  - Look at the idle delay, the lock delay and the settings locks.
  - Look at automount, autorun, remote access encryption and the user list.
  - Look for X server packages on hosts that do not need a desktop.
  example: grep -rE "AutomaticLogin|TimedLogin|Enable=" /etc/gdm/custom.conf ; dconf dump /org/gnome/desktop/screensaver/ ; gsettings get org.gnome.desktop.session idle-delay ; systemctl get-default ; rpm
    -q gdm xorg-x11-server-common
  expected: Automatic login, guest login and XDMCP are off. The screen locks after idle time and users cannot change the lock settings. Servers have no desktop.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:dconf_db_up_to_date
