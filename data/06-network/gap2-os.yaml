- id: NET-OS-005
  sheet: NET
  category: OS
  title: Check separate partitions and disk encryption for data and logs
  objective: Finds hosts where a full or abused directory can stop the system, or where data on disk is not encrypted.
  preconditions: *id001
  steps:
  - List the mounts with lsblk and findmnt.
  - Look for separate partitions for /boot, /home, /tmp, /var, /var/tmp, /var/log, /var/log/audit, /srv, /opt, /usr and /dev/shm.
  - Check if /tmp is a systemd tmp.mount unit or a partition.
  - Look for encrypted volumes with cryptsetup.
  example: lsblk -f ; findmnt -no TARGET,SOURCE /boot /home /tmp /var /var/tmp /var/log /var/log/audit /srv /opt ; systemctl is-enabled tmp.mount ; cryptsetup status <name>
  expected: The directories that the standard names are on separate partitions. Data volumes are encrypted at rest.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
    - cac:encrypt_partitions
    - cac:partition_for_boot
    - cac:partition_for_dev_shm
