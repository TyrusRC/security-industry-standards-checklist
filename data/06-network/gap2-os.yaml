- id: NET-OS-006
  sheet: NET
  category: OS
  title: Check that USB storage, automount and BIOS boot options are limited
  objective: Finds hosts that mount removable media on their own or boot from an unapproved device.
  preconditions: *id001
  steps:
  - Look at the autofs package and service.
  - Look at the usb-storage module and the nousb kernel argument.
  - Look at the udisks and desktop automount settings.
  - Read the firmware settings for boot devices and the firmware password.
  example: systemctl is-enabled autofs ; modprobe -n -v usb-storage ; grep -o "nousb" /proc/cmdline ; lsmod | grep usb_storage
  expected: Automount is off. USB storage is blocked on hosts that do not need it. Boot from removable media is off and the firmware has a password.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  refs:
    tool_check:
    - cac:bios_assign_password
