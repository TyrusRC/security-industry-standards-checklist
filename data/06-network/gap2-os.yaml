- id: NET-OS-010
  sheet: NET
  category: OS
  title: Check that risky SELinux booleans are off
  objective: Finds SELinux booleans that give daemons more rights than the default policy.
  preconditions: *id001
  steps:
  - List all booleans with getsebool -a.
  - Compare the on booleans with the list of rules in the tool check references.
  - Find each boolean that is on and is not in the approved list.
  - Check the need and the owner of each exception.
  example: getsebool -a | grep -- "--> on" ; semanage boolean -l -C
  expected: The booleans that the standard names as risky are off. Each boolean that is on has a written need.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
    - cac:sebool_abrt_anon_write
    - cac:sebool_abrt_handle_event
