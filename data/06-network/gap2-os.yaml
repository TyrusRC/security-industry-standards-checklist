- id: NET-OS-002
  sheet: NET
  category: OS
  title: Find world-writable, unowned and unauthorized setuid files
  objective: Finds files that any user can change, files without an owner and setuid programs that are not approved.
  preconditions: *id001
  steps:
  - Find world-writable files on the local file systems.
  - Find world-writable directories without the sticky bit.
  - Find files and directories with no owner or no group.
  - Find setuid and setgid files and compare them with the approved list.
  example: find / -xdev -type f -perm -0002 -ls ; find / -xdev -type d -perm -0002 ! -perm -1000 -ls ; find / -xdev \( -nouser -o -nogroup \) -ls ; find / -xdev -type f \( -perm -4000 -o -perm -2000 \)
    -ls
  expected: No file is world-writable. Each world-writable directory has the sticky bit. No file lacks an owner or a group. Only approved programs have setuid or setgid.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:dir_perms_world_writable_root_owned
    - cac:dir_perms_world_writable_sticky_bits
    - cac:dir_perms_world_writable_system_owned
    - cac:dir_perms_world_writable_system_owned_group
    - cac:file_permissions_unauthorized_sgid
    - cac:file_permissions_unauthorized_suid
    - cac:file_permissions_unauthorized_world_writable
    - cac:file_permissions_ungroupowned
    - cac:no_files_or_dirs_ungroupowned
    - cac:no_files_or_dirs_unowned_by_user
    - cac:no_files_unowned_by_user
    nist_800_53:
    - CM-6
    - AC-6
  sources_read:
