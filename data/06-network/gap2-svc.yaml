- id: NET-SVC-018
  sheet: NET
  category: SVC
  title: Check Apache httpd TLS, authentication and banner settings
  objective: Finds web servers that offer old TLS versions, accept clear-text logins or show internal notices.
  preconditions: *id001
  steps:
  - Read /etc/httpd/conf.modules.d/ssl.conf and the ssl.conf in /etc/httpd/conf.d.
  - Look at the SSLProtocol, SSLCipherSuite and certificate settings.
  - 'Look at the authentication method for protected paths: digest, LDAP or client certificate.'
  - Look for the use of TLS for logins, sessions and uploads.
  - Scan the TLS port to list the protocols.
  example: grep -rnE "SSLProtocol|SSLCipherSuite|SSLCertificateFile|SSLVerifyClient|AuthType" /etc/httpd/ ; httpd -M | grep -E "ssl|auth" ; nmap -p443 --script ssl-enum-ciphers <host>
  expected: Only TLS 1.2 and newer are on, with a valid server certificate. Logins, sessions and uploads use TLS. Protected paths need strong authentication.
  severity: High
  test_type:
  - Config Review
  - Automated
  refs:
    tool_check:
    - cac:httpd_configure_banner_page
    - cac:httpd_configure_remote_session_encryption
    - cac:httpd_configure_tls
    - cac:httpd_configure_valid_server_cert
    - cac:httpd_digest_authentication
    - cac:httpd_encrypt_file_uploads
    - cac:httpd_entrust_passwords
    - cac:httpd_install_mod_ssl
    - cac:httpd_ldap_support
    - cac:httpd_nipr_accredited_dmz
    - cac:httpd_require_client_certs
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/services/http/securing_httpd/httpd_secure_content/httpd_configure_banner_page/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/http/securing_httpd/httpd_modules_improve_security/httpd_deploy_mod_ssl/httpd_configure_tls/rule.yml
