- id: NET-SVC-010
  sheet: NET
  category: SVC
  title: 'Check for obsolete clear-text services: telnet, rsh, tftp, NIS, talk, rsync, xinetd'
  objective: Finds old remote access and file transfer services that send passwords in clear text or trust host names.
  preconditions: *id001
  steps:
  - Look for the packages telnet, rsh, rlogin, rexec, talk, tftp, ypbind, ypserv, rsync and xinetd.
  - Look at the state of the matching services and sockets.
  - Look for .rhosts, hosts.equiv and other host trust files.
  - Look at nsswitch.conf for NIS entries.
  - Read /etc/hosts.allow and /etc/hosts.deny where TCP wrappers are in use.
  example: rpm -qa | grep -E "telnet|rsh|talk|tftp|ypbind|ypserv|xinetd|rsync" ; systemctl list-unit-files | grep -E "telnet|rsh|rlogin|rexec|tftp|rsyncd|xinetd|ypbind" ; find / -name ".rhosts" -o -name
    hosts.equiv 2>/dev/null ; grep nis /etc/nsswitch.conf
  expected: None of the obsolete packages or services is present. No host trust file exists. If TFTP must stay, it runs in secure mode.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:configure_etc_hosts_deny
    - cac:file_groupowner_etc_hosts_allow
    - cac:file_groupowner_etc_hosts_deny
    - cac:file_owner_etc_hosts_allow
