- id: NET-SVC-017
  sheet: NET
  category: SVC
  title: Check USBGuard and fapolicyd allow-list controls
  objective: Finds hosts that accept any USB device or run any program without a policy.
  preconditions: *id001
  steps:
  - Look at the usbguard and fapolicyd packages and services.
  - Run usbguard list-rules and look at the HID, hub and default policy.
  - Read the usbguard audit backend setting.
  - Read the fapolicyd rules and look for a final deny rule and the home folder rule.
  - Try to run a program from a home folder or plug a test device.
  example: systemctl is-active usbguard fapolicyd ; usbguard list-rules ; grep -E "AuditBackend|ImplicitPolicyTarget" /etc/usbguard/usbguard-daemon.conf ; fapolicyd-cli --list | tail -5
  expected: USBGuard blocks devices that no rule allows and logs its decisions. fapolicyd uses a deny-all policy with exceptions for approved software.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:configure_usbguard_auditbackend
    - cac:fapolicy_default_deny
    - cac:fapolicyd_prevent_home_folder_access
