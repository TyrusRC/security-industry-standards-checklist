- id: NET-SVC-014
  sheet: NET
  category: SVC
  title: 'Check Postfix and Dovecot: network listening, relay and TLS'
  objective: Finds mail services that relay for anyone, listen on all interfaces or accept clear-text passwords.
  preconditions: *id001
  steps:
  - Look at which MTA is installed. Make sure sendmail is not.
  - Read /etc/postfix/main.cf and look at inet_interfaces, smtpd_banner and the relay restrictions.
  - Look at the relayhost and the root and postmaster aliases.
  - Read the Dovecot settings for ssl, ssl_cert, ssl_key and disable_plaintext_auth.
  - Try an open relay test from another host.
  example: postconf -n | grep -E "inet_interfaces|smtpd_banner|smtpd_relay_restrictions|mynetworks|relayhost" ; doveconf -n | grep -E "^ssl|disable_plaintext_auth" ; ss -tlnp | grep -E ":25|:143|:993"
  expected: A local-only MTA listens on the loopback address. A mail server relays only for approved networks. IMAP and POP need TLS and refuse clear-text passwords.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:dovecot_configure_ssl_cert
    - cac:dovecot_configure_ssl_key
    - cac:dovecot_disable_plaintext_auth
    - cac:dovecot_enable_ssl
