- id: NET-SVC-016
  sheet: NET
  category: SVC
  title: Check that unneeded services and daemons are off
  objective: Finds services that add attack surface or leak information and that the host role does not need.
  preconditions: *id001
  steps:
  - List the enabled unit files and the listening sockets.
  - Look for avahi, cups, abrt, apport, cockpit, kdump, netconsole, rdisc, saslauthd, sysstat and rhnsd.
  - Look for the services acpid, certmonger, oddjobd, portreserve, qpidd and quota_nld.
  - Look at the list of masked units. Compare the rest with the role of the host.
  - Look at the avahi and cups settings if they must stay.
  example: systemctl list-unit-files --state=enabled ; ss -tulnp ; systemctl is-enabled avahi-daemon cups abrtd apport cockpit.socket kdump rdisc ; grep -vE "^#|^$" /etc/avahi/avahi-daemon.conf
  expected: Only the services that the host role needs are enabled. Print, discovery, crash report and remote management services are off.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:avahi_check_ttl
    - cac:avahi_disable_publishing
    - cac:avahi_ip_only
