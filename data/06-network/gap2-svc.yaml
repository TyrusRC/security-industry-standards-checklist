- id: NET-SVC-015
  sheet: NET
  category: SVC
  title: 'Check the SNMP agent: installation, service state and protocol version'
  objective: Finds hosts with an SNMP agent that is not needed or that uses SNMP version 1 or 2c.
  preconditions: *id001
  steps:
  - Look for the net-snmp package and the snmpd service.
  - Read /etc/snmp/snmpd.conf and look at the version, the users and the access control entries.
  - Make sure SNMP version 3 with authentication and privacy is in use.
  example: rpm -q net-snmp ; systemctl is-enabled snmpd ; grep -vE "^#|^$" /etc/snmp/snmpd.conf ; ss -ulnp | grep :161
  expected: The SNMP agent is removed if not needed. Where in use, only SNMP version 3 with authentication and encryption is on.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:package_net-snmp_removed
    - cac:service_snmpd_disabled
    - cac:snmpd_use_newer_protocol
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/services/snmp/disabling_snmp_service/package_net-snmp_removed/rule.yml
