- id: NET-SVC-008
  sheet: NET
  category: SVC
  title: 'Check time synchronization client settings: chrony, ntpd and timesyncd'
  objective: Finds hosts with no time source, one weak time source or a time service that runs as root.
  preconditions: &id001
  - Root or sudo read access to the host in scope.
  - Do not change settings on a production host without a change window.
  steps:
  - Look at which time service is active. Make sure only one is active.
  - Read /etc/chrony.conf, /etc/ntp.conf or /etc/systemd/timesyncd.conf.
  - Look for at least two remote servers or a pool, and for NTS if the server supports it.
  - Look at the maxpoll value and the user that runs the daemon.
  - Run chronyc tracking or timedatectl and look at the offset and the synchronized flag.
  example: systemctl is-active chronyd ntpd systemd-timesyncd ; grep -vE "^#|^$" /etc/chrony.conf ; chronyc tracking ; chronyc sources -v ; timedatectl status ; stat -c "%U:%G %a" /etc/chrony.keys
  expected: One time service runs with at least two remote sources. The clock is synchronized with a small offset. The daemon runs as an unprivileged user and key files are root-only.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:chrony_set_nts
    - cac:chronyd_configure_local_socket
    - cac:chronyd_configure_pool_and_server
    - cac:chronyd_or_ntpd_set_maxpoll
    - cac:chronyd_or_ntpd_specify_multiple_servers
    - cac:chronyd_or_ntpd_specify_remote_server
    - cac:chronyd_run_as_chrony_user
    - cac:chronyd_server_directive
    - cac:chronyd_specify_remote_server
