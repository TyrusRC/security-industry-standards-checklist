    - cac:package_usbguard_installed
    - cac:service_fapolicyd_enabled
    - cac:service_usbguard_enabled
    - cac:usbguard_allow_hid
    - cac:usbguard_allow_hid_and_hub
    - cac:usbguard_allow_hub
    - cac:usbguard_generate_policy
    nist_800_53:
    - CM-8
    - IA-3
    - CM-6
    - SI-4
