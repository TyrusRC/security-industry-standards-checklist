- id: NET-SVC-020
  sheet: NET
  category: SVC
  title: Check Apache httpd and nginx modules, logging, tokens and role
  objective: Finds web servers with unneeded modules, little logging, version leaks or a wrong placement.
  preconditions: *id001
  steps:
  - Look at the httpd and nginx packages and services. Compare them with the role of the host.
  - List the loaded modules with httpd -M. Look for status, info, proxy, cache, webdav, rewrite, include and cgi.
  - Look at ServerTokens, ServerSignature, LogLevel, LogFormat and KeepAliveRequests.
  - Look for mod_security and for compilers and sample files on the host.
  - Look at the firewall rule and the network zone of the server.
  example: httpd -M ; grep -rnE "ServerTokens|ServerSignature|LogLevel|LogFormat|MaxKeepAliveRequests|ErrorLog|CustomLog" /etc/httpd/ ; rpm -q mod_security gcc ; curl -sI http://<host> | grep -i server
  expected: Only needed modules load. ServerTokens is Prod and ServerSignature is Off. Errors and access are logged. The web server is off when the host does not serve web content.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:httpd_antivirus_scan_uploads
    - cac:httpd_cache_support
    - cac:httpd_configure_firewall
