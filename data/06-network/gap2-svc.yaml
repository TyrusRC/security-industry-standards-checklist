- id: NET-SVC-011
  sheet: NET
  category: SVC
  title: Check NFS and RPC services, exports and client mounts
  objective: Finds NFS servers that export to all hosts or trust remote root, and hosts that run RPC with no need.
  preconditions: *id001
  steps:
  - Look at the NFS, rpcbind and rpc services and the packages.
  - Read /etc/exports.
  - Look for no_root_squash, all_squash, insecure_locks, wildcard clients and missing Kerberos security flavors.
  - Look at the fixed ports of lockd, mountd and statd.
  - Look at the client mount options for sec=krb5, nosuid, nodev and noexec.
  example: systemctl is-enabled nfs-server rpcbind ; cat /etc/exports ; exportfs -v ; rpcinfo -p ; findmnt -t nfs,nfs4
  expected: The NFS and RPC services run only on hosts that serve or use NFS. Exports name hosts, use root squash and Kerberos, and clients mount with nosuid, nodev and noexec.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:nfs_fixed_lockd_tcp_port
    - cac:nfs_fixed_lockd_udp_port
    - cac:nfs_fixed_mountd_port
    - cac:nfs_fixed_statd_port
