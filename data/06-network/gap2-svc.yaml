- id: NET-SVC-013
  sheet: NET
  category: SVC
  title: Check DHCP, DNS, proxy, RADIUS and routing daemons on the host
  objective: Finds servers with network infrastructure daemons that the host role does not need or that are not hardened.
  preconditions: *id001
  steps:
  - Look for the packages and services dhcpd, kea, named, dnsmasq, unbound, squid, freeradius and quagga.
  - For each one found, compare it with the role of the host.
  - For a DHCP server, read dhcpd.conf for logging, bootp and DDNS settings.
  - For a DNS server, look at dynamic updates in named.conf.
  example: rpm -qa | grep -E "dhcp|kea|bind|dnsmasq|unbound|squid|freeradius|quagga" ; systemctl is-enabled dhcpd named dnsmasq squid zebra ; grep -E "ddns-update-style|deny bootp|log-facility" /etc/dhcp/dhcpd.conf
    ; grep allow-update /etc/named.conf
  expected: No unneeded daemon is installed or enabled. A server that must run has logging on, bootp and dynamic updates off, and serves only the data that it needs.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:dhcp_server_configure_logging
    - cac:dhcp_server_deny_bootp
    - cac:dhcp_server_deny_decline
    - cac:dhcp_server_disable_ddns
