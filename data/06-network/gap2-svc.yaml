- id: NET-SVC-009
  sheet: NET
  category: SVC
  title: 'Check cron and at: service state, user lists and file permissions'
  objective: Finds hosts where any user can schedule jobs or where job files can be changed by others.
  preconditions: *id001
  steps:
  - Look at the cron and atd service state.
  - List /etc/crontab, /etc/cron.d, /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, /etc/cron.monthly and /etc/cron.yearly with owner and mode.
  - Look for /etc/cron.allow and /etc/at.allow. Make sure cron.deny and at.deny do not exist.
  - List the owner and mode of the allow files.
  - Look at anacron if the host is not always on.
  example: systemctl is-enabled crond cron atd ; stat -c "%U:%G %a %n" /etc/crontab /etc/cron.* /etc/at.allow ; ls -l /etc/cron.deny /etc/at.deny
  expected: Root owns all cron files and none is writable by group or others. Only listed users can use cron and at. The at service is off if no one needs it.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:disable_anacron
