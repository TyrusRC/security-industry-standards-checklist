- id: NET-SVC-019
  sheet: NET
  category: SVC
  title: Check Apache httpd directory access, methods and file permissions
  objective: Finds web servers that allow overrides, symlinks, dangerous methods or loose rights on content and logs.
  preconditions: *id001
  steps:
  - Read the Directory blocks for the root, the document root and the critical directories.
  - Look at AllowOverride, Options (FollowSymLinks, Indexes) and the LimitExcept rules.
  - List the owner and mode of the configuration, module and log directories.
  - Look for backup files, sample CGI scripts and anonymous content in the document root.
  - Look at the partition of the web content.
  example: grep -rnE "AllowOverride|Options|LimitExcept|TraceEnable" /etc/httpd/ ; stat -c "%U:%G %a %n" /etc/httpd/conf /etc/httpd/conf.d /etc/httpd/conf.modules.d /var/log/httpd ; find /var/www -name
    "*.bak" -o -name "*~" ; findmnt /var/www
  expected: The root directory denies access by default. Overrides and symlinks are off. Only needed methods are allowed. Only root can change the configuration and logs.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:dir_perms_etc_httpd_conf
    - cac:dir_perms_var_log_httpd
