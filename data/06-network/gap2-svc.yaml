- id: NET-SVC-021
  sheet: NET
  category: SVC
  title: 'Check Docker host settings: storage driver, SELinux and daemon state'
  objective: Finds container hosts that use loopback storage or run containers without SELinux support.
  preconditions: *id001
  steps:
  - Look at the docker package and service.
  - Run docker info and look at the storage driver and the SELinux flag.
  - Read /etc/docker/daemon.json for storage-opts and selinux-enabled.
  example: docker info | grep -iE "storage driver|security options|selinux" ; cat /etc/docker/daemon.json ; systemctl is-enabled docker
  expected: Docker uses a supported production storage driver, not loopback devices. SELinux support is on in the daemon where the host uses SELinux.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:docker_selinux_enabled
    - cac:docker_storage_configured
    - cac:package_docker_installed
    - cac:service_docker_enabled
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/services/docker/docker_selinux_enabled/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/docker/docker_storage_configured/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/services/docker/package_docker_installed/rule.yml
