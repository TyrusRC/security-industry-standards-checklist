- id: NET-SVC-012
  sheet: NET
  category: SVC
  title: Check Samba and FTP services for signing, uploads and anonymous access
  objective: Finds file transfer services that allow anonymous login, uploads or unsigned SMB sessions.
  preconditions: *id001
  steps:
  - Look at the samba and vsftpd packages and services.
  - Read /etc/samba/smb.conf and look at client signing, server signing and root login.
  - Read /etc/vsftpd/vsftpd.conf and look at anonymous_enable, write_enable, xferlog_enable and banner settings.
  - Look at the firewall rule for FTP and at the file system of the FTP home.
  example: rpm -q samba vsftpd ; testparm -s | grep -iE "signing|root|guest" ; grep -vE "^#|^$" /etc/vsftpd/vsftpd.conf ; systemctl is-enabled smb vsftpd
  expected: Samba and FTP are off unless the host role needs them. Where in use, SMB signing is required, anonymous login is off, uploads are off and transfers are logged.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:ftp_configure_firewall
    - cac:ftp_disable_uploads
    - cac:ftp_home_partition
