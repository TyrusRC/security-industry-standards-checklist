- id: NET-CRED-001
  sheet: NET
  category: CRED
  title: Look for vendor default accounts on network services and devices
  objective: Finds routers, switches, databases and services that still use vendor default passwords.
  preconditions:
  - Written approval to try logins on the services in scope.
  - Do not run on production without approval. Use the vendor list with a low rate to avoid lockouts.
  steps:
  - Use the service and version results to list devices and products with a login.
  - Get the default accounts for each product from the vendor documentation.
  - Try each default account on the login of the service, within the agreed rate.
  - Look at the system accounts of each product that the admins did not change.
  - Write down each default account that is active.
  example: 'nmap -sV --script default-http-login-hunter,ftp-anon,mysql-empty-password -p <ports> <host> ; hydra -C defaults.txt <host> ssh'
  expected: No vendor default account works. Default accounts are removed or disabled, or they have a unique strong password.
  severity: Critical
  test_type: Automated
  refs:
    owasp_top10:
    - A02:2025
    wstg:
    - WSTG-ATHN-02
    - WSTG-CONF-01
    attack:
    - T1078.001
    capec:
    - CAPEC-70
    cwe:
    - CWE-1188
    - CWE-798
    nist_800_53:
    - IA-5
    - CM-6
    pci_dss:
    - '2.2.2'
    - '2.3.1'
  see:
  - WEB-AUTHN-001
