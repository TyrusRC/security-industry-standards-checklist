- id: NET-CRED-002
  sheet: NET
  category: CRED
  title: Check the password policy settings on network systems and directories
  objective: Finds systems that accept short, common or breached passwords.
  steps:
  - Export the password policy of the directory and of each network device or service with local accounts.
  - Make sure the minimum length is 12 characters, or the maximum the system supports.
  - Make sure the system checks new passwords against a list of common and breached passwords.
  - Make sure the lockout limit is not more than 10 failed attempts, for at least 30 minutes.
  - Compare the policy with the written password policy.
  example: 'Get-ADDefaultDomainPasswordPolicy ; net accounts ; chage -l <user> ; grep -E "PASS_MIN_LEN|minlen" /etc/login.defs /etc/security/pwquality.conf'
  expected: Passwords have at least 12 characters and are checked against a list of common and breached passwords. Failed logins lock the account after at most 10 tries.
  severity: Medium
  test_type: Config Review
  refs:
    wstg:
    - WSTG-ATHN-07
    - WSTG-ATHN-03
    cwe:
    - CWE-521
    - CWE-307
    nist_800_53:
    - IA-5
    pci_dss:
    - '8.3.6'
    - '8.3.4'
  see:
  - WEB-PWD-001
  sources_read:
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
  - sources/pci_dss/PCI-DSS-v4_0_1.md
- id: NET-CRED-003
  sheet: NET
  category: CRED
  title: Test online password guessing and lockout on remote services
  objective: Finds remote services that let an attacker try many passwords with no limit.
  preconditions:
  - Written approval to try logins on the services in scope, with a test account.
  - Do not run on production. Lockout of real accounts can stop users from work.
  steps:
  - Pick remote services with a login, such as SSH, RDP, VPN and management interfaces.
  - Send repeated failed logins with a test account until the lockout limit.
  - Try one common password against many test accounts at a slow rate.
  - Make sure the service locks the account or slows the logins.
  - Make sure the service logs the failed logins.
  example: 'hydra -l testuser -P short-list.txt -t 2 ssh://<host> ; medusa -h <host> -u testuser -P short-list.txt -M ssh'
  expected: The service blocks or slows repeated failed logins from one source or against one account. Failed logins appear in the logs.
  severity: High
  test_type: Automated
  refs:
    wstg:
    - WSTG-ATHN-03
    attack:
    - T1110.001
    - T1110.003
    capec:
    - CAPEC-112
    - CAPEC-49
    cwe:
    - CWE-307
    nist_800_53:
    - AC-7
    - IA-5
    pci_dss:
    - '8.3.4'
