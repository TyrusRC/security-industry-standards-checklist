- id: NET-CRED-004
  sheet: NET
  category: CRED
  title: Crack password hashes offline to find weak passwords
  objective: Finds accounts with passwords that an attacker can recover from hashes.
  preconditions:
  - The assessment plan says how the hashes are collected and who stores them.
  - Do not run on production. Crack the hashes offline on a protected system.
  steps:
  - Get the password hashes from the system or from a capture, as the plan says.
  - Set up the cracker with the rules of the password policy.
  - Run a dictionary attack, then a hybrid attack, then a limited brute force attack.
  - Count the accounts that the cracker recovers and the time it needed.
  - Report the accounts to the owner without the plain passwords. Delete the hashes and results at the end.
  example: 'hashcat -m <mode> hashes.txt wordlist.txt -r rules/best64.rule ; john --wordlist=wordlist.txt hashes.txt'
  expected: The cracker recovers no password in the agreed time. The hashes use a salted hash with a high work factor, such as Argon2id.
  severity: High
  test_type: Manual
  refs:
    attack:
    - T1110.002
    capec:
    - CAPEC-55
    cheatsheet:
    - Password_Storage_Cheat_Sheet
    cwe:
    - CWE-257
    - CWE-521
    nist_800_53:
    - IA-5
    pci_dss:
    - '8.3.2'
    - '8.3.6'
    other:
    - NIST SP 800-115 section 5.1 (password cracking)
  see:
  - WEB-PWD-001
  sources_read:
  - sources/extra/nist800-115.txt
  - sources/repos/CheatSheetSeries/cheatsheets/Password_Storage_Cheat_Sheet.md
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
  - sources/pci_dss/PCI-DSS-v4_0_1.md
- id: NET-CRED-005
  sheet: NET
  category: CRED
  title: Look for hard-coded passwords in device configurations and scripts
  objective: Finds passwords in clear text in configuration files, scripts and backups.
  preconditions:
  - Read access to the configurations and scripts in scope.
  steps:
  - Export the running and saved configurations of routers, switches and firewalls.
  - Collect the scripts and configuration files of servers and automation tools.
  - Search the files for passwords, community strings, keys and tokens.
  - Check that password fields hold hashes or encrypted values.
  - Write down each clear-text secret and where it is stored.
  example: 'grep -rniE "password|passwd|secret|community|key" /etc /opt/scripts ; show running-config | include password|secret ; trufflehog filesystem <dir>'
  expected: No file holds a clear-text secret. Secrets come from a secrets store, and stored passwords are hashed or encrypted.
  severity: High
  test_type: Config Review
  refs:
    attack:
    - T1552.001
    - T1602.002
    cwe:
    - CWE-798
    - CWE-256
    - CWE-555
    nist_800_53:
    - IA-5
    pci_dss:
    - '8.6.2'
    - '8.3.2'
  sources_read:
  - sources/nist80053/NIST_SP-800-53_rev5_catalog.json
