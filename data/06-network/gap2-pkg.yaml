- id: NET-PKG-001
  sheet: NET
  category: PKG
  title: Check the system crypto policy and its use by services
  objective: Finds hosts that use the LEGACY policy or have local overrides that bring back weak algorithms.
  preconditions: &id001
  - Root or sudo read access to the host in scope.
  - Do not change settings on a production host without a change window.
  steps:
  - Run update-crypto-policies --show.
  - Make sure the policy is not LEGACY and that no module in /etc/crypto-policies/policies/modules weakens it.
  - Look at the symlinks in /etc/crypto-policies/back-ends. Make sure they point to the generated files.
  - Look at the OpenSSL, GnuTLS, BIND, Kerberos, SSH and Libreswan settings and make sure they follow the policy.
  - Look at the random number source for OpenSSL.
  example: update-crypto-policies --show ; update-crypto-policies --check ; ls -l /etc/crypto-policies/back-ends/ ; grep -r "crypto-policies" /etc/ssh/ssh_config.d /etc/ssh/sshd_config.d ; openssl list
    -cipher-algorithms | head
  expected: The policy is DEFAULT or stricter, not LEGACY. No local file overrides the back-end files. The services use the system policy.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:configure_bind_crypto_policy
    - cac:configure_crypto_policy
    - cac:configure_custom_crypto_policy_cis
    - cac:configure_gnutls_tls_crypto_policy
    - cac:configure_kerberos_crypto_policy
    - cac:configure_libreswan_crypto_policy
    - cac:configure_openssl_crypto_policy
    - cac:configure_openssl_tls_crypto_policy
    - cac:configure_ssh_crypto_policy
    - cac:crypto_policy_not_legacy
    - cac:crypto_policy_not_overridden
    - cac:fips_crypto_policy_symlinks
    - cac:harden_openssl_crypto_policy
    - cac:harden_ssh_client_crypto_policy
    - cac:harden_sshd_ciphers_openssh_conf_crypto_policy
    - cac:harden_sshd_ciphers_opensshserver_conf_crypto_policy
    - cac:harden_sshd_crypto_policy
    - cac:harden_sshd_macs_openssh_conf_crypto_policy
    - cac:harden_sshd_macs_opensshserver_conf_crypto_policy
    - cac:openssl_use_strong_entropy
    - cac:package_crypto-policies_installed
    nist_800_53:
    - AC-17
    - SC-12
    - SC-13
    - MA-4
    pci_dss:
    - '2.2'
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/crypto/configure_bind_crypto_policy/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/crypto/configure_libreswan_crypto_policy/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/crypto/crypto_policy_not_overridden/rule.yml
