- id: NET-PKG-002
  sheet: NET
  category: PKG
  title: Check FIPS mode, boot setup and certified OS status
  objective: Finds hosts that must use validated cryptography but run with FIPS mode off.
  preconditions: *id001
  steps:
  - Read /proc/sys/crypto/fips_enabled.
  - Run fips-mode-setup --check.
  - Look at the kernel command line for fips=1 and the dracut fips module.
  - Look at the crypto policy and sub-policy names.
  - Compare the result with the compliance requirement of the host.
  example: cat /proc/sys/crypto/fips_enabled ; fips-mode-setup --check ; grep -o "fips=1" /proc/cmdline ; lsinitrd | grep fips ; update-crypto-policies --show
  expected: On hosts that need FIPS, FIPS mode is on at boot and the crypto policy is FIPS. The OS build is a certified build.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  refs:
    tool_check:
    - cac:enable_dracut_fips_module
    - cac:enable_fips_mode
    - cac:ensure_tuxcare_fips_packages_installed
    - cac:etc_system_fips_exists
    - cac:fips_crypto_subpolicy
    - cac:fips_custom_stig_sub_policy
    - cac:grub2_enable_fips_mode
    - cac:installed_OS_is_FIPS_certified
    - cac:is_fips_mode_enabled
    - cac:package_dracut-fips-aesni_installed
    - cac:package_dracut-fips_installed
    - cac:sysctl_crypto_fips_enabled
    - cac:system_booted_in_fips_mode
    nist_800_53:
    - SC-12
    - SC-13
    - IA-7
    - CM-6
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/fips/enable_dracut_fips_module/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/fips/etc_system_fips_exists/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/fips/grub2_enable_fips_mode/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/fips/package_dracut-fips-aesni_installed/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/fips/system_booted_in_fips_mode/rule.yml
- id: NET-PKG-003
  sheet: NET
  category: PKG
  title: Check endpoint protection, HIDS and user data backup tools
  objective: Finds hosts with no malware scanner, no host intrusion detection or no backup of user data.
  preconditions: *id001
  steps:
  - Look for the endpoint protection or antivirus agent and its service state.
  - Look at the date of the last signature update.
  - Look for a host intrusion detection tool, or for a written reason why audit and SELinux are enough.
  - Look for the backup job for user data and find the last good run.
  example: systemctl status nails mfetpd 2>/dev/null ; rpm -qa | grep -iE "mcafee|MFE|clamav|aide|ossec|wazuh" ; ls -l /var/log/backup* ; crontab -l
  expected: An approved endpoint protection agent runs with current signatures. A host intrusion detection tool or an approved alternative exists. User data backups run on schedule.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  refs:
    tool_check:
    - cac:agent_mfetpd_running
    - cac:configure_user_data_backups
    - cac:install_antivirus
    - cac:install_endpoint_security_software
    - cac:install_hids
    - cac:install_mcafee_antivirus
    - cac:install_mcafee_cma_rt
    - cac:install_mcafee_hbss_accm
    - cac:install_mcafee_hbss_pa
    - cac:mcafee_antivirus_definitions_updated
    - cac:package_MFEhiplsm_installed
    - cac:package_mcafeetp_installed
    - cac:service_nails_enabled
    nist_800_53:
    - CM-6
    - SI-3
    - SC-28
    - SI-2
    pci_dss:
    - '11.4'
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/endpoint_security_software/mcafee_security_software/mcafee_endpoint_security_software/agent_mfetpd_running/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/integrity/endpoint_security_software/install_endpoint_security_software/rule.yml
