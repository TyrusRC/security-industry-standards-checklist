- id: NET-PKG-004
  sheet: NET
  category: PKG
  title: Check package signature checks, repositories and automatic updates
  objective: Finds hosts that install unsigned packages or take packages from unapproved repositories.
  preconditions: *id001
  steps:
  - Read the gpgcheck, localpkg_gpgcheck and repo_gpgcheck values in /etc/dnf/dnf.conf or /etc/yum.conf.
  - Read each file in /etc/yum.repos.d and look for gpgcheck=0.
  - List the repositories. Compare them with the approved list. Look for EPEL.
  - Run rpm -qa gpg-pubkey and compare the keys with the vendor keys.
  - Look at dnf-automatic and its timer, the upgrade type and the weak dependency setting.
  example: grep -rE "gpgcheck" /etc/dnf/dnf.conf /etc/yum.conf /etc/yum.repos.d/ ; dnf repolist ; rpm -qa gpg-pubkey ; systemctl is-enabled dnf-automatic.timer ; grep -E "upgrade_type|apply_updates" /etc/dnf/automatic.conf
  expected: Package, local package and repository metadata signature checks are on for all repositories. Only approved repositories are enabled. The vendor keys match.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:clean_components_post_updating
    - cac:disable_weak_deps
    - cac:dnf-automatic_apply_updates
    - cac:dnf-automatic_security_updates_only
    - cac:enable_gpgcheck_for_all_repositories
    - cac:ensure_GPG_keys_are_configured
    - cac:ensure_almalinux_gpgkey_installed
    - cac:ensure_amazon_gpgkey_installed
    - cac:ensure_epel_repos_disabled
    - cac:ensure_fedora_gpgkey_installed
    - cac:ensure_gpgcheck_globally_activated
    - cac:ensure_gpgcheck_local_packages
    - cac:ensure_gpgcheck_never_disabled
    - cac:ensure_gpgcheck_repo_metadata
    - cac:ensure_oracle_gpgkey_installed
    - cac:ensure_package_repositories_are_configured
    - cac:ensure_redhat_gpgkey_installed
    - cac:ensure_suse_gpgkey_installed
    - cac:ensure_tuxcare_esu_repo_enabled
    - cac:package_dnf-automatic_installed
    - cac:package_gnome_software_installed
    - cac:timer_dnf-automatic_enabled
    - cac:zypper_only_requires_enabled
    nist_800_53:
    - SC-12
    - CM-6
    - CM-11
    - CM-5
    pci_dss:
    - '6.2'
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/updating/clean_components_post_updating/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/system/software/updating/ensure_GPG_keys_are_configured/rule.yml
