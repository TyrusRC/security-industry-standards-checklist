- id: NET-PKG-005
  sheet: NET
  category: PKG
  title: Check APT sources, keys, authentication and file permissions
  objective: Finds hosts that accept unauthenticated packages or allow others to change the package sources.
  preconditions: *id001
  steps:
  - Read /etc/apt/sources.list and /etc/apt/sources.list.d. Compare the sources with the official list.
  - Search /etc/apt/apt.conf.d for AllowUnauthenticated.
  - Look at APT::Install-Recommends, APT::Install-Suggests and the weak dependency setting.
  - List the owner and mode of the source, key and auth.conf.d directories and files.
  example: grep -rn "AllowUnauthenticated\|Install-Recommends\|Install-Suggests" /etc/apt/apt.conf.d/ ; cat /etc/apt/sources.list /etc/apt/sources.list.d/* ; stat -c "%U:%G %a %n" /etc/apt/sources.list.d
    /etc/apt/trusted.gpg.d /etc/apt/auth.conf.d /usr/share/keyrings
  expected: APT does not allow unauthenticated packages. The sources are official and signed. Root owns the APT files and no other user can write to them.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:apt_conf_disable_recommends
    - cac:apt_conf_disable_suggests
    - cac:apt_conf_disallow_unauthenticated
    - cac:apt_disable_weak_dependencies
    - cac:apt_sources_list_official
    - cac:directory_groupowner_apt_auth_conf_d
    - cac:directory_groupowner_apt_sources_list_d
    - cac:directory_groupowner_apt_trusted_gpg_d
    - cac:directory_groupowner_usr_share_keyrings
    - cac:directory_owner_apt_auth_conf_d
    - cac:directory_owner_apt_sources_list_d
    - cac:directory_owner_apt_trusted_gpg_d
    - cac:directory_owner_usr_share_keyrings
    - cac:directory_permissions_apt_auth_conf_d
    - cac:directory_permissions_apt_sources_list_d
    - cac:directory_permissions_apt_trusted_gpg_d
    - cac:directory_permissions_usr_share_keyrings
    - cac:file_groupowner_apt_auth_conf_d
    - cac:file_groupowner_apt_gpg_keys
    - cac:file_groupowner_apt_sources_list_d
    - cac:file_owner_apt_auth_conf_d
    - cac:file_owner_apt_gpg_keys
    - cac:file_owner_apt_sources_list_d
    - cac:file_permissions_apt_auth_conf_d
    - cac:file_permissions_apt_gpg_keys
    - cac:file_permissions_apt_sources_list_d
