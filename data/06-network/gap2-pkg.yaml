- id: NET-PKG-006
  sheet: NET
  category: PKG
  title: Check installed and removed system tool packages against the standard
  objective: Finds hosts that miss required security tools or keep crash reporters and extra tools that leak data.
  preconditions: *id001
  steps:
  - List the installed packages with rpm -qa or dpkg -l.
  - 'Look for the required tools: cryptsetup, openscap-scanner, scap-security-guide, rng-tools, nss-tools, gnutls-utils, tar and vim.'
  - 'Look for the packages that the standard removes: abrt and its plug-ins, libreport plug-ins, tuned, pigz, geolite2 and gssproxy.'
  - Look at the OS word size and the entropy settings.
  example: rpm -q cryptsetup openscap-scanner scap-security-guide rng-tools nss-tools gnutls-utils ; rpm -qa | grep -E "^(abrt|libreport|tuned|pigz|geolite2|gssproxy)" ; uname -m
  expected: The required tools are installed. The removed packages are not installed. Any deviation has an approval.
  severity: Low
  test_type: Config Review
  refs:
    tool_check:
