- id: NET-AUDIT-010
  sheet: NET
  category: AUDIT
  title: Check rsyslog and syslog-ng files, remote input and logging services
  objective: Finds log services that accept remote messages without a need or create log files that others can read.
  preconditions: *id001
  steps:
  - Look at the state of the rsyslog or syslog-ng service and make sure only one log service is active.
  - Read the rsyslog configuration for the FileCreateMode and the owner of the files.
  - Look for imtcp, imudp and the listen options. Make sure they are off unless the host is a log server.
  - Look for rules that log cron, authentication and kernel messages.
  - Look at the logwatch settings on a log server.
  example: systemctl is-active rsyslog syslog-ng journald ; grep -rnE "FileCreateMode|imtcp|imudp|InputTCPServerRun|\$ModLoad" /etc/rsyslog.conf /etc/rsyslog.d/ ; ss -ulnp | grep :514 ; grep -E "cron|authpriv"
    /etc/rsyslog.conf
  expected: One log service runs and logs the standard facilities. New log files have a mode of 0640 or stricter. Remote input is off, except on a named log server.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:disable_logwatch_for_logserver
    - cac:ensure_journald_and_rsyslog_not_active_together
