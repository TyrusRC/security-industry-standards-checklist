- id: NET-AUDIT-006
  sheet: NET
  category: AUDIT
  title: Check audit rules for privileged commands and security tools
  objective: Finds hosts that do not record the use of setuid programs and of tools that change access rules.
  preconditions: *id001
  steps:
  - Find the setuid and setgid programs on the local file systems.
  - Run auditctl -l and look for a rule for each program, with the auid filter and a key.
  - Look for rules on chacl, setfacl, chcon, restorecon, semanage and setsebool.
  - Look for rules on shutdown, reboot, poweroff and init.
  - Run one program and look for the record with ausearch.
  example: find / -xdev -type f \( -perm -4000 -o -perm -2000 \) 2>/dev/null ; auditctl -l | grep -E "privileged|perm=x" ; ausearch -k privileged -ts recent
  expected: Each setuid and setgid program has an audit rule for user executions. The rules for access-change tools and for shutdown commands exist.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:audit_privileged_commands_init
