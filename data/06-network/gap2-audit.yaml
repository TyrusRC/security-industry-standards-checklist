- id: NET-AUDIT-005
  sheet: NET
  category: AUDIT
  title: Check audit rules for identity files, logins, sudoers and cron
  objective: Finds hosts that do not record changes to accounts, logins, privilege rules and scheduled jobs.
  preconditions: *id001
  steps:
  - Run auditctl -l and compare the output with the rules in /etc/audit/rules.d.
  - Look for watches on /etc/passwd, /etc/shadow, /etc/group and /etc/gshadow.
  - Look for watches on /etc/sudoers, /etc/sudoers.d, /etc/cron.d and /var/spool/cron.
  - Look for watches on login, session and failure logs such as faillock, lastlog, wtmp, btmp and utmp.
  - Change a test account and make sure ausearch shows the event.
  example: auditctl -l | grep -E "passwd|shadow|group|gshadow|sudoers|cron|faillock|lastlog|wtmp|btmp|utmp|setuid" ; ausearch -k identity -ts recent ; augenrules --check
  expected: Each identity, login, sudoers and cron file has an audit watch with a key. A change to a watched file creates an audit record.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  refs:
    tool_check:
