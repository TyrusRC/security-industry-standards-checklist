- id: NET-AUDIT-001
  sheet: NET
  category: AUDIT
  title: Check that auditd is installed, enabled and active from boot
  objective: Finds hosts where audit events are lost because the daemon or the early boot audit is missing.
  preconditions: &id001
  - Root or sudo read access to the host in scope.
  - Do not change settings on a production host without a change window.
  steps:
  - Look for the audit and audit plugin packages.
  - Look at the auditd service state.
  - Look at the kernel command line for audit=1 and the audit_backlog_limit value.
  - Read auditctl -s and look at the enabled flag and the lost counter.
  example: rpm -q audit audispd-plugins || dpkg -l auditd ; systemctl is-enabled auditd ; systemctl is-active auditd ; cat /proc/cmdline ; auditctl -s
  expected: The audit packages are installed. The auditd service is enabled and active. The kernel starts auditing at boot with a backlog limit that meets the standard.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:coreos_audit_backlog_limit_kernel_argument
    - cac:coreos_audit_option
    - cac:grub2_audit_argument
    - cac:grub2_audit_backlog_limit_argument
    - cac:package_audispd-plugins_installed
    - cac:package_audit-audispd-plugins_installed
    - cac:package_audit-libs_installed
    - cac:package_audit_installed
    - cac:service_auditd_enabled
    nist_800_53:
    - CM-6
    - AU-14
    - AU-7
    - AU-10
    pci_dss:
    - '10.3'
    - '10.1'
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/auditing/coreos_audit_backlog_limit_kernel_argument/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/auditing/grub2_audit_argument/rule.yml
