  - sources/repos/ComplianceAsCode/linux_os/guide/auditing/service_auditd_enabled/rule.yml
- id: NET-AUDIT-002
  sheet: NET
  category: AUDIT
  title: Check auditd log size, disk-full actions and flush settings
  objective: Finds hosts that lose audit records or keep running with no audit when the disk is full.
  preconditions: *id001
  steps:
  - Read /etc/audit/auditd.conf.
  - Look at max_log_file, max_log_file_action, num_logs and space_left.
  - Look at space_left_action, admin_space_left_action, disk_full_action and disk_error_action.
  - Look at flush, freq, overflow_action, log_format, name_format and local_events.
  - Look at the size of the partition that holds /var/log/audit.
  example: grep -vE "^#|^$" /etc/audit/auditd.conf ; df -h /var/log/audit ; grep -E "active|direction|path|type" /etc/audit/plugins.d/*.conf
  expected: Audit logs have enough space and rotate by the standard. A full disk sends an alert and halts or changes to single user mode. The daemon writes to disk at the set rate.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
