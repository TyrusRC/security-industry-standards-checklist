- id: NET-AUDIT-004
  sheet: NET
  category: AUDIT
  title: Check the base audit rules, immutable mode and OSPP rule set
  objective: Finds hosts where an attacker can switch off or change audit rules after a login.
  preconditions: *id001
  steps:
  - Read the rule files in /etc/audit/rules.d.
  - Look for the first rule that clears old rules and for the backlog and failure mode settings.
  - Look for the immutable flag -e 2 as the last rule.
  - Look for the rules that watch module loading and login UIDs.
  - Run auditctl -s and look at the enabled value.
  example: cat /etc/audit/rules.d/*.rules ; auditctl -s | grep enabled ; auditctl -l | head -20 ; grep -rn "loginuid_immutable\|^-e " /etc/audit/rules.d/
  expected: The rules start from a clean state, set a backlog limit and log failures to the system log. The configuration is immutable and the login UID cannot change.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:audit_basic_configuration
    - cac:audit_immutable_login_uids
    - cac:audit_module_load
    - cac:audit_module_load_ppc64le
    - cac:audit_ospp_general
    - cac:audit_ospp_general_aarch64
    - cac:audit_ospp_general_ppc64le
    - cac:audit_rules_for_ospp
    nist_800_53:
    - AU-2
  sources_read:
  - sources/repos/ComplianceAsCode/linux_os/guide/auditing/policy_rules/audit_basic_configuration/rule.yml
  - sources/repos/ComplianceAsCode/linux_os/guide/auditing/policy_rules/audit_module_load/rule.yml
