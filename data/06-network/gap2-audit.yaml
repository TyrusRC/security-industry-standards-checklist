- id: NET-AUDIT-011
  sheet: NET
  category: AUDIT
  title: Check journald storage, forwarding and journal file permissions
  objective: Finds hosts where the system journal is lost at restart or can be read by other users.
  preconditions: *id001
  steps:
  - Read /etc/systemd/journald.conf and the files under journald.conf.d.
  - Look at Storage, Compress and ForwardToSyslog.
  - List /var/log/journal and the journal files with their owner and mode.
  - Look at the owner and mode of the journalctl program.
  - Look for the journal-remote socket and make sure it is off unless the host receives logs.
  example: systemd-analyze cat-config systemd/journald.conf ; stat -c "%U:%G %a %n" /var/log/journal /var/log/journal/* /usr/bin/journalctl ; systemctl is-enabled systemd-journal-remote.socket
  expected: Storage is persistent. Journal files and the journal directory are owned by root and the systemd-journal group with restricted modes. The remote receive socket is off.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:dir_groupowner_system_journal
    - cac:dir_owner_system_journal
