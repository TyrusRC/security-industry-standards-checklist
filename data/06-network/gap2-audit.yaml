- id: NET-AUDIT-012
  sheet: NET
  category: AUDIT
  title: Check /var/log file permissions and the log rotation setup
  objective: Finds log files that all users can read or change and logs that grow with no rotation.
  preconditions: *id001
  steps:
  - List the files and directories under /var/log with their owner, group and mode.
  - Look for log files with a mode wider than 0640 and for files with the wrong group.
  - Look at the package and the timer or cron job for logrotate.
  - Read /etc/logrotate.conf and look at the rotation count and the size limits.
  example: find /var/log -type f \( -perm -0004 -o -perm -0020 \) -ls ; stat -c "%U:%G %a %n" /var/log/messages /var/log/secure /var/log/syslog /var/log/auth.log /var/log/wtmp /var/log/btmp ; systemctl
    is-enabled logrotate.timer ; grep -vE "^#|^$" /etc/logrotate.conf
  expected: Log files are not readable or changeable by other users. Root owns them and the modes follow the standard. Logrotate runs on a schedule.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
