- id: NET-AUDIT-003
  sheet: NET
  category: AUDIT
  title: Check the owner and mode of audit logs, rules and tools
  objective: Finds audit logs, rule files or audit binaries that other users can read or change.
  preconditions: *id001
  steps:
  - List the files in /var/log/audit and the directory itself.
  - List /etc/audit/auditd.conf, /etc/audit/audit.rules and /etc/audit/rules.d.
  - List the audit binaries auditctl, auditd, ausearch, aureport, autrace and augenrules.
  - Make sure root owns each item and the modes are as strict as the standard sets.
  example: stat -c "%U:%G %a %n" /var/log/audit /var/log/audit/* /etc/audit/auditd.conf /etc/audit/rules.d/* /sbin/auditctl /sbin/auditd /sbin/ausearch /sbin/aureport /sbin/augenrules
  expected: Root owns audit logs, configuration and tools. Logs have a mode of 0600 or 0640, the log directory 0700 or 0750, and the binaries 0755 or stricter.
  severity: High
  test_type: Config Review
  refs:
    tool_check:
    - cac:directory_access_var_log_audit
