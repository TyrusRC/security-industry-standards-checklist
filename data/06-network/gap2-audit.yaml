- id: NET-AUDIT-007
  sheet: NET
  category: AUDIT
  title: Check audit rules for permission, owner and extended attribute changes
  objective: Finds hosts that do not record changes of file modes, owners and extended attributes.
  preconditions: *id001
  steps:
  - Run auditctl -l and compare the output with the rules in /etc/audit/rules.d.
  - Look for rules on chmod, fchmod, fchmodat, chown, fchown, fchownat and lchown.
  - Look for rules on setxattr, lsetxattr, fsetxattr, removexattr and the related calls.
  - Look for the b32 and b64 variants and the auid filter.
  - Run chmod on a test file and look for the record with ausearch.
  example: auditctl -l | grep -E "chmod|chown|setxattr|removexattr" ; touch /tmp/t && chmod 600 /tmp/t && ausearch -k perm_mod -ts recent
  expected: Rules exist for each permission, owner and attribute system call, for both 32-bit and 64-bit calls. A mode change creates an audit record.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:audit_owner_change_failed
    - cac:audit_owner_change_failed_aarch64
    - cac:audit_owner_change_failed_ppc64le
