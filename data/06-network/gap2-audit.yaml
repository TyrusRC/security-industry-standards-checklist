- id: NET-AUDIT-009
  sheet: NET
  category: AUDIT
  title: Check audit rules for kernel modules, time, network and MAC changes
  objective: Finds hosts that do not record module loads, clock changes, network setting changes and policy changes.
  preconditions: *id001
  steps:
  - Look for rules on init_module, finit_module and delete_module.
  - Look for rules on adjtimex, settimeofday, clock_settime and /etc/localtime.
  - Look for rules on sethostname, setdomainname and the network configuration files.
  - Look for watches on the SELinux or AppArmor policy directories.
  - Look for the audit rules for system shutdown, media export and journal files.
  example: auditctl -l | grep -E "module|adjtimex|settimeofday|clock_settime|localtime|sethostname|/etc/hosts|selinux|apparmor|mount" ; ausearch -k modules -ts recent
  expected: Rules exist for module loads, clock changes, network identity changes and mandatory access control policy files. Each rule has a key.
  severity: Medium
  test_type: Config Review
  refs:
    tool_check:
    - cac:audit_rules_continue_loading
