- id: NET-AUDIT-008
  sheet: NET
  category: AUDIT
  title: Check audit rules for failed access, file creation, change and deletion
  objective: Finds hosts that do not record denied access or the deletion and change of files by users.
  preconditions: *id001
  steps:
  - Run auditctl -l and compare the output with the rules in /etc/audit/rules.d.
  - Look for rules on open, openat, truncate and creat that log EACCES and EPERM results.
  - Look for rules on unlink, unlinkat, rename, renameat and rmdir.
  - Look for rules on file creation and change with success results.
  - Try to open a protected file as a test user and look for the record with ausearch.
  example: auditctl -l | grep -E "EACCES|EPERM|unlink|rename|rmdir|creat|truncate" ; ausearch -k access -ts recent ; ausearch -k delete -ts recent
  expected: Failed access and file delete or change calls have audit rules. A denied access try creates an audit record with the user ID.
  severity: Medium
  test_type: Config Review
