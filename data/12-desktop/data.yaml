- id: DESK-DATA-003
  sheet: DESK
  category: DATA
  title: Check process memory after logout for sensitive data
  objective: Finds secrets and personal data that stay in memory after the session ends.
  steps:
  - Log in and open sensitive records.
  - Log out or lock the client.
  - Make a memory dump of the client process.
  - Search the dump for the test values and tokens.
  example: procdump -ma app.exe dump.dmp; strings -el dump.dmp | grep -i testvalue; Frida memory scan on a lab host.
  expected: Secrets and sensitive records are cleared after use or logout. The dump does not hold them in readable form.
  severity: Medium
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-312
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
    - Key_Management_Cheat_Sheet
    desktop_top10:
    - DA3
