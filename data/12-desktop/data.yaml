- id: DESK-DATA-002
  sheet: DESK
  category: DATA
  title: Check data at rest for clear text and weak access rights
  objective: Finds databases, caches and temporary files that hold sensitive data in clear form.
  steps:
  - Use the client with test data in each feature.
  - Watch file and registry writes with Procmon.
  - Open each written file and look for the test data.
  - Check the file permissions and the temporary folders.
  example: Procmon filter Operation is WriteFile; icacls on the data folder; sqlite3 .dump on local databases.
  expected: Sensitive data is encrypted with a key that is not in the files. Only the user and the app can read the files.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-312
    - CWE-922
    - CWE-378
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - DotNet_Security_Cheat_Sheet
