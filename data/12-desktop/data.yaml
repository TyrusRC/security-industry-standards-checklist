- id: DESK-DATA-004
  sheet: DESK
  category: DATA
  title: Check logs, crash dumps and debug output for sensitive data
  objective: Finds tokens, passwords and personal data in logs and dumps.
  steps:
  - Use all main functions with default logging.
  - Cause an error and a crash.
  - Search log files, dump files and the event log for test values.
  - Check the folders and access rights.
  example: Search the client log folder for password and token strings; Windows Event Viewer; Windows Error Reporting dump folder.
  expected: Logs and dumps hold no secrets or personal data. Debug output is off in the release.
  severity: Medium
  test_type:
  - Manual
