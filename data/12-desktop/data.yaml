- id: DESK-DATA-001
  sheet: DESK
  category: DATA
  title: Search binaries and config files for hard-coded secrets
  objective: Finds keys, passwords and connection strings inside the installer and files.
  steps:
  - Install the client in a clean virtual machine.
  - Run strings and a secret scanner over all installed files.
  - Decompile managed code and search for keys and connection strings.
  - Test each found value for use.
  example: strings -n 8 app.dll | grep -iE "pass|key|secret|conn"; gitleaks or trufflehog directory scan; ILSpy.
  expected: No secret is in any binary, config or resource. Each install gets its own credentials from a secret store.
  severity: High
  test_type:
  - Automated
  - Manual
  refs:
    cwe:
    - CWE-798
    - CWE-321
    - CWE-259
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
    - Key_Management_Cheat_Sheet
    asvs:
    - V13.3.1
    desktop_top10:
    - DA3
    - DA8
  see:
  - WEB-CRYPTO-018
