- id: DESK-DATA-005
  sheet: DESK
  category: DATA
  title: Check clipboard and recent-file lists for leaks
  objective: Finds sensitive data that the client copies to shared OS areas.
  steps:
  - Copy a sensitive field in the client.
  - Read the clipboard and the clipboard history.
  - Look at the recent-file lists and the thumbnails.
  - Look at the task switcher preview.
  example: Windows clipboard history (Win+V); Get-Clipboard in PowerShell; recent items folder.
  expected: The client clears or limits clipboard data for secrets. Sensitive views are hidden in previews where the OS allows it.
  severity: Low
  test_type:
  - Manual
  refs:
    desktop_top10:
    - DA3
  sources_read:
