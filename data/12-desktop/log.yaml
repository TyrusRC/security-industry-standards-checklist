- id: DESK-LOG-004
  sheet: DESK
  category: LOG
  title: Check that monitoring raises alerts for client abuse
  objective: Finds missing detection for repeated failed logins and tamper events.
  steps:
  - List the alert rules for the client and its back end.
  - Make 10 failed logins in a test.
  - Change a protected file in a test.
  - Check that alerts reach the responders.
  example: SIEM rule list; test alert timestamps.
  expected: Abuse events create alerts that the responders receive within the agreed time.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  refs:
    cwe:
    - CWE-778
    cheatsheet:
    - Logging_Cheat_Sheet
    desktop_top10:
