- id: DESK-LOG-003
  sheet: DESK
  category: LOG
  title: Test log injection through user-supplied values
  objective: Finds log entries that a user can forge.
  steps:
  - Find input values that the client writes to logs.
  - Send a value with a line break and a made-up log entry.
  - Open the log file.
  - Check that the log shows the value as one encoded field.
  example: 'Test value: a name followed by a line break and a made-up entry text.'
  expected: Log writers encode or remove control characters. A user value cannot make a new log entry.
  severity: Low
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-117
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.4.1
    desktop_top10:
    - DA10
  see:
