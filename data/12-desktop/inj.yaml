- id: DESK-INJ-004
  sheet: DESK
  category: INJ
  title: Check embedded HTML views for script injection
  objective: Finds web views and mail views that run script from untrusted content.
  steps:
  - Find the components that render HTML.
  - Load content with a harmless script marker in a test record.
  - Check if the marker runs.
  - Read the web view settings for script and file access.
  example: Marker that only changes the page title; Electron or WebView2 settings review for nodeIntegration and contextIsolation.
  expected: Untrusted HTML is encoded or sanitized. The view runs no script and has no access to local files or system APIs.
  severity: High
  test_type:
  - Manual
  - Code Review
  refs:
    cwe:
    - CWE-79
    cheatsheet:
    - DotNet_Security_Cheat_Sheet
    - JavaScript_and_TypeScript_Security_Cheat_Sheet
