- id: DESK-INJ-005
  sheet: DESK
  category: INJ
  title: Check deserialization of files, messages and update data
  objective: Finds unsafe serializers that read data an attacker can change.
  steps:
  - Search the code for BinaryFormatter, ObjectInputStream and type name settings.
  - Find the data source of each call.
  - Look for serialized blobs in files and traffic.
  - Check the type allowlist or the signature check.
  example: ILSpy search for BinaryFormatter and TypeNameHandling; look for the Base64 prefix AAEAAAD///// in saved files.
  expected: The client uses a data-only format such as JSON. It does not read objects whose type comes from the data stream.
  severity: Critical
  test_type:
  - Code Review
  - Manual
  refs:
    cwe:
    - CWE-502
    cheatsheet:
    - Deserialization_Cheat_Sheet
    - DotNet_Security_Cheat_Sheet
    - Java_Security_Cheat_Sheet
