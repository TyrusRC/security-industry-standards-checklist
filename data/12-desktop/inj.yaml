- id: DESK-INJ-002
  sheet: DESK
  category: INJ
  title: Find OS command execution that uses user input
  objective: Finds calls to a shell or a process with input that the user controls.
  steps:
  - Search the code or decompiled code for process start calls.
  - Trace each call to its input source.
  - Send shell separators in the matching fields on a test system.
  - Watch child processes with Process Monitor.
  example: 'ILSpy or dnSpy: search for Process.Start and ProcessStartInfo; Procmon filter on Process Create.'
  expected: The client starts programs with a fixed path and separate arguments. No user value reaches a command interpreter.
  severity: Critical
  test_type:
  - Code Review
  - Manual
  refs:
    cwe:
    - CWE-78
    - CWE-77
    cheatsheet:
    - OS_Command_Injection_Defense_Cheat_Sheet
