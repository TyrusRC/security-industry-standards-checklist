- id: DESK-INJ-003
  sheet: DESK
  category: INJ
  title: Check XML and import file parsers for external entities
  objective: Finds parsers that resolve external entities in untrusted files.
  steps:
  - List the file types and XML settings that the client reads.
  - Search the code for the parser settings.
  - Open a test file with an external entity that points to a canary file.
  - Look for an outbound request or a file read.
  example: Canary file with a unique string; Procmon to watch file reads by the client process.
  expected: The parser turns off DTD and external entity resolution. Untrusted files cause an error and no file or network access.
  severity: High
  test_type:
  - Manual
  - Code Review
  refs:
    cwe:
    - CWE-611
    cheatsheet:
    - XML_External_Entity_Prevention_Cheat_Sheet
    - DotNet_Security_Cheat_Sheet
