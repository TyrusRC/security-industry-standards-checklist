- id: DESK-INJ-001
  sheet: DESK
  category: INJ
  title: Test client input fields for SQL injection
  objective: Finds queries that the client builds from user input.
  steps:
  - List all input fields and file imports that reach a database.
  - Capture the database traffic or turn on the query log.
  - Send a single quote and a boolean test value in each field.
  - Compare the query text with the input.
  example: Procmon or Wireshark on the database port; database general query log; sqlmap only against in-scope back ends.
  expected: The client uses parameterized queries. Special characters in input never change the query structure.
  severity: High
  test_type:
  - Manual
  - Automated
  refs:
    cwe:
    - CWE-89
    cheatsheet:
    - DotNet_Security_Cheat_Sheet
    asvs:
    - V1.2.5
