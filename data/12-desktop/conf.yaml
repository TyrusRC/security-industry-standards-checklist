- id: DESK-CONF-005
  sheet: DESK
  category: CONF
  title: Check local-only features for exposure over the network
  objective: Finds services meant for the same machine that listen on all interfaces.
  steps:
  - List all listening sockets of the product.
  - Read the local address of each.
  - Connect from a second host.
  - Check the firewall rules that the installer adds.
  example: netstat -ano | findstr LISTENING; Test-NetConnection from another host.
  expected: Local-only features bind to 127.0.0.1. The installer adds no inbound allow rule for them.
  severity: Medium
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-1188
    desktop_top10:
    - DA6
