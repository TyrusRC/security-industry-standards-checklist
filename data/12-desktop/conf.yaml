- id: DESK-CONF-001
  sheet: DESK
  category: CONF
  title: Check named pipes, local ports and IPC for access control
  objective: Finds local interfaces that any user or any host can use.
  steps:
  - List named pipes, sockets and listening ports of the product.
  - Check the access rights of each pipe.
  - Check the bind address of each port.
  - Send a request as another local user.
  example: pipelist.exe; accesschk.exe \pipe\name; netstat -ano; nmap -p- from a second host.
  expected: IPC objects allow only the needed accounts. Local services bind to loopback and need authentication.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-732
    - CWE-306
    cheatsheet:
    - Attack_Surface_Analysis_Cheat_Sheet
    desktop_top10:
    - DA6
  sources_read:
