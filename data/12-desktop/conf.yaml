  - sources/repos/www-project-desktop-app-security-top-10/index.md
  - sources/repos/CheatSheetSeries/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
- id: DESK-CONF-002
  sheet: DESK
  category: CONF
  title: Check Windows services for unquoted paths and weak folder rights
  objective: Finds services that a user can hijack through the service path.
  steps:
  - List the services that the product installs.
  - Read the image path of each service.
  - Look for spaces in unquoted paths.
  - Check the write rights of each parent folder.
  example: wmic service get name,pathname; sc qc; icacls on each folder in the path.
  expected: Service paths are quoted. No folder in the path is writable by normal users.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-428
    - CWE-732
    desktop_top10:
    - DA6
    - DA5
  sources_read:
