- id: DESK-CONF-004
  sheet: DESK
  category: CONF
  title: Check back-end services of the client for default credentials
  objective: Finds databases, queues and directory services with default accounts.
  steps:
  - List the back-end services that the client uses.
  - Read the connection settings in the config.
  - Try the vendor default account on a test instance.
  - Check the network rules around each service.
  example: Look in the config for sa, root and admin accounts; nmap -sV on the service host.
  expected: Back-end services have no default accounts and allow access only from the client network.
  severity: High
  test_type:
  - Manual
  - Config Review
  refs:
    cwe:
    - CWE-1392
    - CWE-1188
    asvs:
    - V13.2.3
