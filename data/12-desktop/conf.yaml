- id: DESK-CONF-003
  sheet: DESK
  category: CONF
  title: Check file open and import functions for type and content checks
  objective: Finds file handlers that accept any file or parse unsafe content.
  steps:
  - List the file types the client opens or imports.
  - Open files with a wrong type and a wrong content.
  - Open files with an odd size and a long name.
  - Watch the client for crashes and file writes.
  example: Procmon; WinDbg crash notes; test file set with a changed header.
  expected: The client checks file type and content before it parses the file. Bad files give a clear error and no crash.
  severity: Medium
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-120
    desktop_top10:
    - DA6
    - DA8
  sources_read:
