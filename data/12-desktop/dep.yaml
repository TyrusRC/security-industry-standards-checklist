- id: DESK-DEP-004
  sheet: DESK
  category: DEP
  title: Review the supported platforms and the patch policy of the vendor
  objective: Finds clients that need an unsupported OS or old runtime.
  steps:
  - Read the system requirements.
  - Find any OS or runtime that is out of support.
  - Ask for the patch time frames.
  - Look for an end-of-support notice for the product.
  example: 'Document review: support matrix and patch policy.'
  expected: The product runs on supported platforms. A patch policy with time frames exists.
  severity: Low
  test_type:
  - Config Review
  refs:
    cwe:
