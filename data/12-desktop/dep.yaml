- id: DESK-DEP-001
  sheet: DESK
  category: DEP
  title: Build a component inventory and find known vulnerable versions
  objective: Finds outdated libraries, runtimes and frameworks.
  steps:
  - List all libraries, runtimes and frameworks in the install.
  - Make a software bill of materials.
  - Check each version against vulnerability databases.
  - Include transitive dependencies.
  example: syft dir:. -o cyclonedx-json; grype sbom:./sbom.json; dependency-check; NVD search.
  expected: The inventory is complete. No component has a known high or critical vulnerability without a fix plan.
  severity: High
  test_type:
  - Automated
  refs:
    cwe:
    - CWE-1395
    - CWE-1104
