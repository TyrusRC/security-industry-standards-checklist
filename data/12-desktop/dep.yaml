- id: DESK-DEP-003
  sheet: DESK
  category: DEP
  title: Test the update mechanism for signed packages on a secure channel
  objective: Finds updates that a network attacker can replace.
  steps:
  - Find the update URL and the update file format.
  - Capture an update check.
  - Check that the channel uses TLS with certificate checks.
  - Serve a changed package from a lab server and look at the result.
  example: mitmproxy in a lab; look for a signature check in the code before install.
  expected: The client installs only packages with a valid vendor signature. A changed package is rejected.
  severity: Critical
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-494
    - CWE-347
    cheatsheet:
    - Software_Supply_Chain_Security_Cheat_Sheet
    desktop_top10:
