- id: DESK-DEP-002
  sheet: DESK
  category: DEP
  title: Check bundled Electron, Chromium and runtime versions
  objective: Finds bundled engines that miss security fixes.
  steps:
  - Find the bundled runtime and web engine versions.
  - Compare them with the current supported versions.
  - Check the update process for engines.
  - Look for unsupported components.
  example: About dialog; package.json; file properties of the runtime DLLs.
  expected: Bundled engines and runtimes are supported versions with current patches.
  severity: Medium
  test_type:
  - Automated
  - Manual
  refs:
    cwe:
    - CWE-1104
    - CWE-1395
    cheatsheet:
