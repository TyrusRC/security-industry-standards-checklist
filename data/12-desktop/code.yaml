  - sources/cwe/cwec_latest.xml.zip
- id: DESK-CODE-002
  sheet: DESK
  category: CODE
  title: Test for DLL search order hijacking and untrusted load paths
  objective: Finds loads of libraries from folders that a user can write.
  steps:
  - Run the product with Process Monitor.
  - Filter on NAME NOT FOUND for DLL loads.
  - Check the write rights of the searched folders.
  - Place a harmless test library in a writable searched folder.
  example: 'Procmon filter: Result is NAME NOT FOUND and Path ends with .dll. Use a benign test DLL that writes a marker file.'
  expected: The product loads libraries from fixed trusted paths. No searched folder is writable by normal users.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-426
    - CWE-427
    cheatsheet:
    - DotNet_Security_Cheat_Sheet
    desktop_top10:
    - DA8
    - DA5
