- id: DESK-CODE-005
  sheet: DESK
  category: CODE
  title: Check the release build for debug code and test data
  objective: Finds dead code, test accounts and debug switches in the release.
  steps:
  - Decompile the release build.
  - Search for debug flags, test accounts and test URLs.
  - Look for debug symbols and verbose log switches.
  - Start the client with a debug argument.
  example: ILSpy; strings; command line flags such as --debug or environment variables in the code.
  expected: The release has no debug mode, test accounts or test data. Debug switches do not change security.
  severity: Low
  test_type:
  - Manual
  - Code Review
  refs:
