- id: DESK-CODE-004
  sheet: DESK
  category: CODE
  title: Check binary hardening flags and memory safety of native code
  objective: Finds missing ASLR, DEP and stack protection and unsafe functions.
  steps:
  - List native binaries in the install.
  - Read the hardening flags of each.
  - Search for unsafe copy functions in the code or symbols.
  - Send over-long input to parsers in a test lab.
  example: winchecksec; checksec --file on Linux; dumpbin /headers; fuzz parsers with a lab fuzzer.
  expected: All native binaries use ASLR, DEP and stack protection. Parsers check lengths and fail safely on long input.
  severity: Medium
  test_type:
  - Automated
  - Manual
  refs:
    cwe:
    - CWE-120
    - CWE-787
    - CWE-125
    - CWE-416
    asvs:
