- id: DESK-CODE-001
  sheet: DESK
  category: CODE
  title: Check code signing of the installer, binaries and libraries
  objective: Finds unsigned or wrongly signed files.
  steps:
  - List all executables and DLL files in the install.
  - Check the signature of each file.
  - Check that the certificate chain and time stamp are valid.
  - Change one file and start the product.
  example: sigcheck.exe -u -e -s "C:\Program Files\Vendor"; Get-AuthenticodeSignature; codesign -v on macOS.
  expected: All shipped code has a valid signature from the vendor. A changed file is rejected by the installer or loader.
  severity: Medium
  test_type:
  - Manual
  - Automated
  refs:
    cwe:
    - CWE-494
    - CWE-345
    cheatsheet:
    - Software_Supply_Chain_Security_Cheat_Sheet
    desktop_top10:
    - DA8
