- id: DESK-CODE-003
  sheet: DESK
  category: CODE
  title: Test temporary files and update steps for race conditions
  objective: Finds time-of-check time-of-use gaps in file handling.
  steps:
  - Find the temporary files and folders the product makes.
  - Check the names and the access rights.
  - Replace the file between check and use in a test setup.
  - Check that the product checks the file again.
  example: Procmon file events; script that swaps a test file in a lab.
  expected: Temporary files have random names in a private folder. The product opens each file once and keeps the handle.
  severity: Medium
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-367
    - CWE-378
    desktop_top10:
    - DA8
  sources_read:
