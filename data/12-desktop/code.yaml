- id: DESK-CODE-006
  sheet: DESK
  category: CODE
  title: Check that critical decisions do not depend on tamper detection alone
  objective: Finds license and admin checks that a debugger or hook can change.
  steps:
  - Attach a debugger to the client in a lab.
  - Hook the license or admin check with Frida.
  - Change the return value.
  - Check that the server confirms the result.
  example: Frida script that only logs and changes one boolean in a test copy.
  expected: Critical decisions are made on the server. Hooking the client does not give paid or admin functions.
  severity: Low
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-693
    desktop_top10:
    - DA8
