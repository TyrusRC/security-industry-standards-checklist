- id: DESK-CRYPTO-004
  sheet: DESK
  category: CRYPTO
  title: Check integrity protection of trusted local data
  objective: Finds files and license data that a user can change without detection.
  steps:
  - Find the local files that the client trusts.
  - Change one value in a test copy of the file.
  - Start the client.
  - Check that the client detects and rejects the change.
  example: Hex editor on a test copy; compare the client behaviour with and without an HMAC.
  expected: The client protects trusted local data with a signature or HMAC and rejects a changed file.
  severity: Medium
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-345
    - CWE-353
