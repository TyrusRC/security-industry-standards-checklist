- id: DESK-CRYPTO-001
  sheet: DESK
  category: CRYPTO
  title: Find weak or custom cryptography in the client
  objective: Finds weak algorithms, weak modes and home-made crypto code.
  steps:
  - Search the code for MD5, SHA1, DES, RC4, ECB and custom cipher classes.
  - List the calls to the crypto library.
  - Check the algorithm, key size and mode for each use.
  - Check that passwords use a password hashing function.
  example: ILSpy search; grep for MD5, SHA1, DES and ECB; keyword list from WSTG-CRYP-04.
  expected: The client uses approved algorithms and modes and a maintained library. It uses no custom algorithm.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  refs:
    cwe:
    - CWE-327
    - CWE-326
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
