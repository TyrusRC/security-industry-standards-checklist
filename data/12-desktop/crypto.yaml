- id: DESK-CRYPTO-002
  sheet: DESK
  category: CRYPTO
  title: Check that keys and salts are unique per installation
  objective: Finds keys, IVs and salts that are the same on every install.
  steps:
  - Install the client on two clean systems.
  - Compare the key files, key values and salts.
  - Find the code that makes keys and IVs.
  - Check the random source.
  example: Binary diff of the two profile folders; ILSpy review for System.Random use.
  expected: Each install has its own keys from a secure random source. The client never reuses an IV or nonce with one key.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-321
    - CWE-330
    - CWE-338
    - CWE-1204
