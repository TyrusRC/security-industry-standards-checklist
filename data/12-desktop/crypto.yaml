- id: DESK-CRYPTO-003
  sheet: DESK
  category: CRYPTO
  title: Check key storage in the OS key store
  objective: Finds keys stored in clear form or in files next to the data.
  steps:
  - Find where the client keeps its keys.
  - Check if it uses DPAPI, the OS credential store or a hardware module.
  - Check the DPAPI scope, user or machine.
  - Check if the key and the data are in separate places.
  example: ILSpy search for ProtectedData.Protect and DataProtectionScope.LocalMachine.
  expected: Keys are in an OS key store or hardware module with user scope. Keys are not next to the data in clear form.
  severity: High
  test_type:
  - Code Review
  - Manual
  refs:
    cwe:
