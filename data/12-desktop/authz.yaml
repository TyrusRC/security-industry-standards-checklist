  - sources/repos/www-project-desktop-app-security-top-10/index.md
  - sources/repos/CheatSheetSeries/cheatsheets/Secure_Product_Design_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
- id: DESK-AUTHZ-003
  sheet: DESK
  category: AUTHZ
  title: Check registry keys and settings that carry security decisions
  objective: Finds registry values or policy files that a normal user can change to bypass controls.
  steps:
  - List the registry keys that the product reads and writes.
  - Check the access rights of each key.
  - Change a security setting as a normal user.
  - Restart the product and look at the effect.
  example: Procmon filter on Registry operations; accesschk.exe -kvuqsw HKLM\Software\Vendor.
  expected: Only administrators can change security settings. A changed user-level value does not lower protection.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-732
    - CWE-269
    desktop_top10:
    - DA5
    - DA6
  sources_read:
  - sources/repos/www-project-desktop-app-security-top-10/tab_detaileddescription.md
  - sources/repos/www-project-desktop-app-security-top-10/index.md
  - sources/cwe/cwec_latest.xml.zip
- id: DESK-AUTHZ-004
  sheet: DESK
  category: AUTHZ
  title: Test admin functions of the client for vertical privilege change
  objective: Finds admin functions that the server allows for normal users.
  steps:
  - Log in as a normal user and as an admin.
  - Record the API calls for admin functions.
  - Replay them with the normal user token.
  - Show hidden menu items with a UI inspection tool.
  example: Burp Suite Autorize extension; Snoop or Inspect.exe for hidden controls.
  expected: The server rejects admin calls from normal users. Hidden controls do not give access.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-862
    - CWE-863
    desktop_top10:
    - DA5
