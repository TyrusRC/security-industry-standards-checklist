- id: DESK-COMM-001
  sheet: DESK
  category: COMM
  title: Capture client traffic and find clear-text protocols
  objective: Finds HTTP, FTP, Telnet, MQTT or plain database traffic.
  steps:
  - Start Wireshark on the client interface.
  - Use all main functions.
  - List all protocols and ports in the capture.
  - Look for credentials and data in clear text.
  example: Wireshark display filter !tls && !ssh; tshark -r cap.pcap -q -z conv,tcp.
  expected: All client traffic uses TLS or another encrypted protocol. No credentials or data appear in clear text.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-319
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    asvs:
    - V12.3.1
    wstg:
    - WSTG-CRYP-03
    desktop_top10:
    - DA7
  see:
  - WEB-TLS-006
  - WEB-TLS-005
