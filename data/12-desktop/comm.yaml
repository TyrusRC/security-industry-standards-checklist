- id: DESK-COMM-002
  sheet: DESK
  category: COMM
  title: Check TLS versions and cipher suites of all client endpoints
  objective: Finds old protocol versions and weak ciphers.
  steps:
  - List all server hosts and ports from the capture.
  - Scan each endpoint for protocol versions and ciphers.
  - Check the database connection for TLS.
  - Compare with the approved list.
  example: nmap --script ssl-enum-ciphers -p 443,1433 host; testssl.sh host:port.
  expected: All endpoints accept only TLS 1.2 and TLS 1.3 with strong ciphers.
  severity: Medium
  test_type:
  - Automated
  refs:
    cwe:
    - CWE-327
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    asvs:
    - V12.1.1
    desktop_top10:
    - DA7
