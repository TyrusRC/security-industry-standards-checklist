- id: DESK-COMM-003
  sheet: DESK
  category: COMM
  title: Test certificate validation in the client with an untrusted certificate
  objective: Finds clients that accept wrong, expired or self-signed certificates.
  steps:
  - Route the client through a proxy with its own CA.
  - Start the client without the CA in the trust store.
  - Watch if the client connects.
  - Repeat with an expired certificate and a wrong host name.
  example: Burp Suite or mitmproxy with a fresh CA; look for certificate errors in the client log.
  expected: The client refuses all untrusted, expired and wrong-host certificates and sends no data.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-295
    - CWE-297
    cheatsheet:
    - Pinning_Cheat_Sheet
    - Transport_Layer_Security_Cheat_Sheet
    asvs:
    - V12.3.2
    desktop_top10:
    - DA7
