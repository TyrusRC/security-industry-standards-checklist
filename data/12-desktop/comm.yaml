- id: DESK-COMM-004
  sheet: DESK
  category: COMM
  title: Check certificate pinning for critical hosts
  objective: Finds high-risk clients without a pin for the update or API host.
  steps:
  - Find the hosts that carry updates and credentials.
  - Look in the code for pin checks or custom validation callbacks.
  - Install a trusted proxy CA and try to read the traffic.
  - Make sure no callback returns true for all.
  example: ILSpy search for ServerCertificateValidationCallback that returns true; Electron setCertificateVerifyProc.
  expected: The client pins keys for critical hosts or validates the full chain. No callback accepts every certificate.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  refs:
    cwe:
    - CWE-295
    cheatsheet:
    - Pinning_Cheat_Sheet
    desktop_top10:
    - DA7
