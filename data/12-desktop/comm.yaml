- id: DESK-COMM-005
  sheet: DESK
  category: COMM
  title: Check database connections for encryption and least privilege
  objective: Finds clients that use a shared database account over a plain channel.
  steps:
  - Find the connection string in the config or code.
  - Capture the database traffic.
  - Look for TLS in the handshake.
  - Check the rights of the database account.
  example: 'Wireshark on port 1433, 3306 or 5432; SQL: SELECT * FROM fn_my_permissions(NULL,NULL).'
  expected: The connection uses TLS. Each user or the service has an account with the least rights. The client holds no admin database account.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-319
    - CWE-250
    asvs:
    - V13.2.2
    desktop_top10:
    - DA7
    - DA3
    - DA5
