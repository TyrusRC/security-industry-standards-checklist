- id: IOT-DATA-004
  sheet: IOT
  category: DATA
  title: Check cryptographic algorithms, key size and random source
  objective: Finds weak algorithms and poor random numbers.
  steps:
  - List the crypto libraries and calls in the firmware.
  - Check the algorithms, modes and key sizes.
  - Check the random source and its entropy at boot.
  - Check key use per device.
  example: strings and Ghidra search for rand(), MD5, DES, ECB; ent on random output from a lab unit.
  expected: The device uses approved algorithms and a hardware or CSPRNG random source. Keys are unique per device.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  refs:
    other:
    - GSMA CLP13_6.10
    - GSMA CLP12_6.2
    cwe:
    - CWE-327
    - CWE-330
    - CWE-338
    cheatsheet:
    - Key_Management_Cheat_Sheet
    - Cryptographic_Storage_Cheat_Sheet
    iot_top10:
    - I7
  see:
  - WEB-CRYPTO-014
