- id: IOT-DATA-005
  sheet: IOT
  category: DATA
  title: Check the logging of the device for sensitive data
  objective: Finds logs and diagnostic output with credentials or user data.
  steps:
  - Turn on default logging.
  - Use all main functions.
  - Read the logs from the console, files and cloud.
  - Search for secrets and personal data.
  example: logread; dmesg; serial console capture; grep for token and password.
  expected: Logs hold no credentials or personal data. Diagnostic output is off or protected in production.
  severity: Medium
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-532
    - CWE-215
    cheatsheet:
    - Logging_Cheat_Sheet
    - Automotive_Security_Cheat_Sheet
    iot_top10:
    - I7
    - I6
  see:
  - WEB-LOG-006
