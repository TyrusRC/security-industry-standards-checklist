- id: IOT-DATA-003
  sheet: IOT
  category: DATA
  title: Check sensitive data and keys in flash storage
  objective: Finds secrets and personal data stored in clear text on the device.
  steps:
  - Dump the flash of a lab unit.
  - Unpack the file systems.
  - Search for keys, tokens, Wi-Fi passwords and user data.
  - Check if the storage is encrypted.
  example: flashrom -r dump.bin; binwalk -e dump.bin; strings; grep -r "BEGIN" _dump.bin.extracted.
  expected: Secrets and personal data are encrypted or kept in a secure element. No clear key is in the flash.
  severity: High
  test_type:
  - Manual
  refs:
    other:
    - GSMA CLP13_7.1
    cwe:
    - CWE-312
    - CWE-922
    - CWE-321
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
    - Drone_Security_Cheat_Sheet
    attack:
    - T0893
    iot_top10:
    - I7
    - I10
  see:
  - WEB-DATA-013
