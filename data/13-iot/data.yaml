- id: IOT-DATA-001
  sheet: IOT
  category: DATA
  title: Capture device traffic and find clear-text data
  objective: Finds data sent without encryption on any link.
  steps:
  - Capture traffic of the device on Wi-Fi, Ethernet and any radio.
  - List protocols and ports.
  - Look for credentials, tokens and data in clear text.
  - Check MQTT, CoAP and HTTP use.
  example: Wireshark filter mqtt or coap or http; tshark -Y "http" -r cap.pcap.
  expected: All data in transit uses TLS, DTLS or an equal secure protocol. No credential or user data appears in clear text.
  severity: High
  test_type:
  - Manual
  refs:
    other:
    - UK Code of Practice for Consumer IoT Security provision 5, as listed in iot_map.md
    - GSMA CLP13_6.19
    cwe:
    - CWE-319
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    attack:
    - T0842
    - T0830
    iot_top10:
    - I7
  see:
  - WEB-TLS-006
  sources_read:
  - sources/repos/www-project-internet-of-things/tab_seek_and_understand.md
  - sources/top10s/iot_map.md
  - sources/repos/CheatSheetSeries/cheatsheets/Transport_Layer_Security_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
  - sources/attack/ics-attack.json
- id: IOT-DATA-002
  sheet: IOT
  category: DATA
  title: Test certificate validation and TLS settings of the device
  objective: Finds devices that accept any certificate or old TLS versions.
  steps:
  - Route device traffic through a proxy with a lab CA.
  - Check if the device connects.
  - Use an expired certificate and a wrong host name.
  - Scan the cloud endpoint for protocol versions.
  example: mitmproxy with a lab CA; testssl.sh on the endpoint.
  expected: The device refuses untrusted certificates. Only TLS 1.2 and TLS 1.3 with strong ciphers are used.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-295
    - CWE-297
    cheatsheet:
    - Pinning_Cheat_Sheet
    - Transport_Layer_Security_Cheat_Sheet
    iot_top10:
    - I7
    - I3
  see:
  - WEB-TLS-010
  sources_read:
