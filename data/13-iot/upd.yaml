- id: IOT-UPD-001
  sheet: IOT
  category: UPD
  title: Check that firmware updates are signed and the device checks the signature
  objective: Finds devices that install unsigned or changed firmware.
  steps:
  - Get an update package.
  - Change one byte in a lab copy.
  - Try to install it.
  - Try to install a package with a wrong signature.
  example: binwalk the package; openssl dgst -verify; flash the changed copy only on a lab unit.
  expected: The device rejects firmware with a missing or wrong signature.
  severity: Critical
  test_type:
  - Manual
  refs:
    other:
    - UK Code of Practice for Consumer IoT Security provision 3, as listed in iot_map.md
    - GSMA CLP13_6.11
    - GSMA CLP13_7.5
    cwe:
    - CWE-347
    - CWE-494
    - CWE-345
    cheatsheet:
    - Drone_Security_Cheat_Sheet
    - Automotive_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    attack:
    - T1693.001
    - T1693
    iot_top10:
    - I4
