- id: IOT-UPD-005
  sheet: IOT
  category: UPD
  title: Check update notices and the published support period
  objective: Finds products with no update notice or published end of support.
  steps:
  - Find the update notice in the app or the device.
  - Read the support period in the documentation.
  - Check the update steps for a normal user.
  - Check the notice for the reason of the update.
  example: 'Document review: support policy, release notes, update UI.'
  expected: Users see update notices with the reason. The vendor publishes a minimum support period.
  severity: Low
  test_type:
  - Config Review
  - Manual
  refs:
    other:
    - UK Code of Practice for Consumer IoT Security provision 3, as listed in iot_map.md
    iot_top10:
    - I4
    - I8
  sources_read:
  - sources/repos/www-project-internet-of-things/tab_seek_and_understand.md
