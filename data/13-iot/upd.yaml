- id: IOT-UPD-002
  sheet: IOT
  category: UPD
  title: Test the update channel for transport protection
  objective: Finds update downloads over HTTP or TLS without certificate checks.
  steps:
  - Capture an update check and download.
  - Look at the protocol and the certificate checks.
  - Serve a lab response from a proxy.
  - Check what the device does.
  example: mitmproxy with a lab CA; Wireshark.
  expected: The device gets updates over TLS with certificate validation. It rejects a proxy response.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-319
    - CWE-295
    cheatsheet:
    - Automotive_Security_Cheat_Sheet
    attack:
    - T0830
    iot_top10:
    - I4
    - I7
  sources_read:
