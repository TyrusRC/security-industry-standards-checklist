  - sources/repos/CheatSheetSeries/cheatsheets/Automotive_Security_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
  - sources/attack/ics-attack.json
- id: IOT-UPD-003
  sheet: IOT
  category: UPD
  title: Test anti-rollback of firmware
  objective: Finds devices that accept older vulnerable firmware.
  steps:
  - Record the current firmware version.
  - Get an older signed package.
  - Try to install it in a lab.
  - Check the version counter in the bootloader.
  example: Install an older signed image on a lab unit; read the version from the console.
  expected: The device refuses older firmware versions. A version counter in protected storage enforces this.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-1329
    cheatsheet:
    - Drone_Security_Cheat_Sheet
    - Automotive_Security_Cheat_Sheet
    iot_top10:
    - I4
  sources_read:
  - sources/repos/www-project-internet-of-things/tab_seek_and_understand.md
  - sources/top10s/iot_map.md
  - sources/repos/CheatSheetSeries/cheatsheets/Drone_Security_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Automotive_Security_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
- id: IOT-UPD-004
  sheet: IOT
  category: UPD
  title: Test interrupted updates and recovery
  objective: Finds devices that stay broken or unprotected after a failed update.
  steps:
  - Start an update on a lab unit.
  - Cut power at 50 percent.
  - Power on again.
  - Check the version, the state and the signature check.
  example: Controllable power switch; serial console log.
  expected: The device boots a known good image or a signed recovery image. It never runs half-written code.
  severity: Medium
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-345
    cheatsheet:
    - Automotive_Security_Cheat_Sheet
    attack:
    - T0800
    iot_top10:
    - I4
    - I8
