- id: IOT-PWD-003
  sheet: IOT
  category: PWD
  title: Test password policy and lock-out on the device interfaces
  objective: Finds weak passwords and unlimited guessing on web, SSH and Telnet.
  steps:
  - List every interface that accepts a password.
  - Set a short and a common password.
  - Send 20 wrong logins in a row to a lab unit.
  - Check for a delay, a lock or an alert.
  example: Burp Intruder at low rate on the device web login; nmap --script ssh-auth-methods.
  expected: The device rejects weak passwords. Repeated wrong logins cause a delay or a lock.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-1391
    cheatsheet:
    - Password_Storage_Cheat_Sheet
    attack:
    - T0859
    iot_top10:
    - I1
