- id: IOT-PWD-001
  sheet: IOT
  category: PWD
  title: Find default and shared credentials on the device
  objective: Finds devices that ship with the same login on every unit.
  steps:
  - Read the quick start guide and the label for default logins.
  - Log in to each interface with the default login.
  - Reset two devices to factory state.
  - Compare the credentials of the two devices.
  example: 'nmap -sV -p- device; hydra is not needed: try only the vendor documented login on a lab unit.'
  expected: Each device has a unique credential or forces a new one at first use. A reset never restores a shared default.
  severity: Critical
  test_type:
  - Manual
  refs:
    other:
    - UK Code of Practice for Consumer IoT Security provision 1, as listed in iot_map.md
    - GSMA CLP13_6.8
    cwe:
    - CWE-1392
    - CWE-1393
    - CWE-1391
    attack:
    - T1694.001
    iot_top10:
    - I1
    - I9
  sources_read:
  - sources/repos/www-project-internet-of-things/tab_seek_and_understand.md
  - sources/top10s/iot_map.md
  - sources/cwe/cwec_latest.xml.zip
  - sources/attack/ics-attack.json
- id: IOT-PWD-002
  sheet: IOT
  category: PWD
  title: Search the firmware for hard-coded passwords and keys
  objective: Finds credentials and backdoor accounts inside the firmware image.
  steps:
  - Get the firmware image from the vendor site or the device.
  - Unpack it with binwalk -e.
  - Search the files for passwd, shadow, keys and strings.
  - Test each found account on a lab device.
  example: binwalk -e fw.bin; firmwalker.sh _fw.bin.extracted; strings -n 8 bin/* | grep -i pass; cat etc/shadow.
  expected: The firmware holds no hard-coded password, key or backdoor account. All secrets are made per device.
  severity: Critical
  test_type:
  - Manual
  - Automated
  refs:
    other:
    - UK Code of Practice for Consumer IoT Security provision 4, as listed in iot_map.md
    cwe:
    - CWE-798
    - CWE-259
    - CWE-321
    cheatsheet:
    - Key_Management_Cheat_Sheet
    - Secrets_Management_Cheat_Sheet
    attack:
    - T1694.002
    iot_top10:
    - I1
    - I7
  see:
  - WEB-CRYPTO-018
