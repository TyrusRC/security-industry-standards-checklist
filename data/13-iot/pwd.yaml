- id: IOT-PWD-004
  sheet: IOT
  category: PWD
  title: Check how the device stores and checks user passwords
  objective: Finds clear text and weak hashes in device databases.
  steps:
  - Find the password file or database in the extracted firmware.
  - Read the stored value format.
  - Identify the hash type and salt.
  - Check the hash cost.
  example: cat etc/shadow; sqlite3 config.db .dump; look for crypt prefixes $1$, $5$, $6$, $y$.
  expected: Passwords are stored with a salted, slow hash such as Argon2id, bcrypt or PBKDF2.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-256
    - CWE-257
    - CWE-916
    cheatsheet:
    - Password_Storage_Cheat_Sheet
    iot_top10:
    - I1
    - I7
  see:
  - WEB-CRYPTO-013
