- id: IOT-PWD-005
  sheet: IOT
  category: PWD
  title: Check device-to-cloud identity and mutual authentication
  objective: Finds devices that share one cloud key or do not prove their identity.
  steps:
  - Capture the device enrollment.
  - Compare the device credentials of two units.
  - Present one device credential from another device in a lab.
  - Check that the cloud rejects the copy.
  example: Wireshark and a lab proxy; compare client certificates or tokens of two devices.
  expected: Each device has its own identity. The cloud rejects a credential that comes from a different unit or is revoked.
  severity: High
  test_type:
  - Manual
  refs:
    other:
    - GSMA CLP13_6.20
    - GSMA CLP13_7.6
    cwe:
    - CWE-306
    - CWE-798
    iot_top10:
    - I1
    - I3
