- id: IOT-COMP-002
  sheet: IOT
  category: COMP
  title: Check for unmaintained or unsupported components
  objective: Finds parts that no longer get fixes.
  steps:
  - List the end-of-life dates of the OS, kernel and libraries.
  - Mark unsupported items.
  - Check the replacement plan.
  - Check which items cannot be updated.
  example: Document review plus version dates; compare with the vendor support policy.
  expected: No unsupported component is in use, or the vendor limits its exposure and plans its replacement.
  severity: Medium
  test_type:
  - Config Review
  refs:
    cwe:
    - CWE-1104
    - CWE-1329
    cheatsheet:
