- id: IOT-COMP-003
  sheet: IOT
  category: COMP
  title: Review the supply chain of hardware and software parts
  objective: Finds untrusted suppliers and changed parts.
  steps:
  - List the chips, modules and third-party software.
  - Ask for the supplier security terms and patch ownership.
  - Compare the delivered part with the specification.
  - Check the code and hardware signing of the supplier.
  example: Document review; hash compare of supplier firmware blobs with the vendor list.
  expected: Suppliers are assessed. Patch ownership and support periods are set in contracts. Delivered parts match the specification.
  severity: Medium
  test_type:
  - Config Review
  refs:
    other:
    - GSMA CLP13_9.7
    cheatsheet:
    - Software_Supply_Chain_Security_Cheat_Sheet
    - Drone_Security_Cheat_Sheet
