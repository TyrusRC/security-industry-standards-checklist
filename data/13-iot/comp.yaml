- id: IOT-COMP-004
  sheet: IOT
  category: COMP
  title: Check OS hardening and process privileges on the device
  objective: Finds root-only designs, missing sandbox and weak file rights.
  steps:
  - Get a shell on a lab unit.
  - List the running processes and users.
  - Check file rights and writable system paths.
  - Check the kernel and OS hardening options.
  example: ps; ls -l; find / -perm -4000; checksec --kernel; mount output for read-only flags.
  expected: Services run as non-root users with the least rights. System partitions are read-only where possible.
  severity: Medium
  test_type:
  - Manual
  refs:
    other:
    - GSMA CLP13_8.1
    cwe:
    - CWE-250
    - CWE-732
    cheatsheet:
