- id: IOT-COMP-001
  sheet: IOT
  category: COMP
  title: Make a component list from the firmware and find known vulnerabilities
  objective: Finds old kernels, libraries and daemons in the image.
  steps:
  - Unpack the firmware.
  - List the kernel, libc, web server, TLS library and other packages with versions.
  - Compare each version with vulnerability databases.
  - Record the fix status.
  example: binwalk -e fw.bin; syft dir:_fw.bin.extracted; grype dir:_fw.bin.extracted; uname banner in the kernel.
  expected: No component has a known unpatched critical or high vulnerability. The vendor keeps a component list for each release.
  severity: High
  test_type:
  - Automated
  - Manual
  refs:
    other:
    - GSMA CLP13_7.11
    cwe:
    - CWE-1395
    - CWE-1104
    cheatsheet:
    - Vulnerable_Dependency_Management_Cheat_Sheet
    - Dependency_Graph_SBOM_Cheat_Sheet
    iot_top10:
    - I5
  see:
  - WEB-DEP-002
  - WEB-DEP-003
