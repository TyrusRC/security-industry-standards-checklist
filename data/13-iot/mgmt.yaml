  - sources/repos/CheatSheetSeries/cheatsheets/Key_Management_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Drone_Security_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
- id: IOT-MGMT-004
  sheet: IOT
  category: MGMT
  title: Check behaviour of the device when the network or power fails
  objective: Finds devices that fail open or lose their security state.
  steps:
  - Cut the network on a lab unit.
  - Check local functions and security checks.
  - Cut and restore power.
  - Check that the device returns to a safe state.
  example: Disconnect the uplink; power cycle with a controllable switch.
  expected: The device keeps its security settings. It fails safe and joins the network again in an orderly way.
  severity: Medium
  test_type:
  - Manual
  refs:
    other:
    - UK Code of Practice for Consumer IoT Security provision 9, as listed in iot_map.md
    - GSMA CLP13_8.9
    cwe:
    - CWE-693
    cheatsheet:
    - Secure_Product_Design_Cheat_Sheet
    - Automotive_Security_Cheat_Sheet
    iot_top10:
