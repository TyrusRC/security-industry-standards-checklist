  - sources/top10s/iot_map.md
  - sources/repos/CheatSheetSeries/cheatsheets/Automotive_Security_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
- id: IOT-ECO-005
  sheet: IOT
  category: ECO
  title: Test command messages for replay and spoofing
  objective: Finds control messages that an attacker can copy and send again.
  steps:
  - Capture a command message such as lock or open.
  - Send it again later from another host.
  - Change a field and send it with the old signature.
  - Check for a counter or timestamp check.
  example: Wireshark capture; scapy or mosquitto_pub replay in a lab.
  expected: The device rejects replayed, changed and unauthenticated commands.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-345
    - CWE-353
    cheatsheet:
    - Drone_Security_Cheat_Sheet
    - Automotive_Security_Cheat_Sheet
