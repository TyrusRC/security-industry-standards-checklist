- id: IOT-PHYS-003
  sheet: IOT
  category: PHYS
  title: Test the physical access of lost or captured devices to cloud accounts
  objective: Finds devices that give a finder access to the account or network.
  steps:
  - Take a lab device with a paired account.
  - Read stored tokens and Wi-Fi settings.
  - Use them from another host.
  - Check the revocation steps for the owner.
  example: Extract the tokens from the lab dump; replay them against the lab cloud.
  expected: A stolen device does not give lasting access. The owner can revoke the device and its tokens.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
