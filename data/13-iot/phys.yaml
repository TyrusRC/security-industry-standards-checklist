- id: IOT-PHYS-001
  sheet: IOT
  category: PHYS
  title: Review the casing, ports and tamper protection of the device
  objective: Finds exposed ports and a casing that gives easy access to the board.
  steps:
  - List all external ports and buttons.
  - Open the casing.
  - Check for tamper switches and seals.
  - Check for labeled debug pads.
  example: Visual inspection with a camera and a multimeter.
  expected: Unused ports are closed. The casing shows tamper evidence. Debug pads are removed or locked.
  severity: Medium
  test_type:
  - Manual
  refs:
    other:
    - GSMA CLP13_7.3
    cheatsheet:
    - Drone_Security_Cheat_Sheet
    iot_top10:
    - I10
  sources_read:
  - sources/repos/www-project-internet-of-things/tab_seek_and_understand.md
  - sources/top10s/iot_map.md
  - sources/repos/CheatSheetSeries/cheatsheets/Drone_Security_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
- id: IOT-PHYS-002
  sheet: IOT
  category: PHYS
  title: Test flash and memory extraction
  objective: Finds devices where an attacker can read the firmware and secrets from the chip.
  steps:
  - Identify the flash chip.
  - Try an in-circuit read in a lab.
  - Check the dump for clear data.
  - Check read-out protection fuses.
  example: flashrom with a clip programmer; binwalk on the dump.
  expected: Read-out protection or storage encryption stops the use of a dump. Secrets are not in clear text.
  severity: High
  test_type:
  - Manual
  refs:
    other:
