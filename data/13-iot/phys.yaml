- id: IOT-PHYS-004
  sheet: IOT
  category: PHYS
  title: Check side channels and fault injection protection for high-risk devices
  objective: Finds secrets that leak through power analysis or glitches.
  steps:
  - Decide if the threat model includes lab attackers.
  - Check the secure element or crypto chip data sheet.
  - Check for glitch and temperature monitors.
  - Review any lab test report.
  example: 'Document review: certification reports, chip data sheets.'
  expected: Devices with high risk use certified secure elements. The vendor holds a test report.
  severity: Info
  test_type:
  - Config Review
  refs:
    other:
    - GSMA CLP13_9.6
    - GSMA CLP13_9.3
    iot_top10:
