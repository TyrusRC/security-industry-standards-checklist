- id: IOT-NET-001
  sheet: IOT
  category: NET
  title: Scan the device for open ports and unneeded services
  objective: Finds services that the device does not need, such as Telnet, FTP and debug daemons.
  steps:
  - Power the device on a lab network.
  - Scan all TCP and UDP ports.
  - List each service and its version.
  - Compare with the documented service list.
  example: nmap -sS -sU -p- -sV --top-ports 1000 device; masscan on a lab range only.
  expected: Only documented services listen. Telnet, FTP and debug services are off. Each service needs authentication.
  severity: High
  test_type:
  - Automated
  - Manual
  refs:
    other:
    - UK Code of Practice for Consumer IoT Security provision 6, as listed in iot_map.md
    cwe:
    - CWE-306
    - CWE-1188
    attack:
    - T0883
    - T0866
    iot_top10:
    - I2
