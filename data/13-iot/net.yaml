- id: IOT-NET-002
  sheet: IOT
  category: NET
  title: Check the services of the device for known vulnerable versions
  objective: Finds old daemons with public vulnerabilities.
  steps:
  - Read the version banner of each service.
  - Check each version in vulnerability databases.
  - Check for unpatched web server and UPnP builds.
  - Record the fixed version.
  example: nmap -sV --script vulners device; compare with NVD.
  expected: No service version has a known unpatched vulnerability.
  severity: High
  test_type:
  - Automated
  refs:
    cwe:
    - CWE-1395
    cheatsheet:
    - Vulnerable_Dependency_Management_Cheat_Sheet
    attack:
    - T0866
    - T0819
