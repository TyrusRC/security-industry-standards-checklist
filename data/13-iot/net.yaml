- id: IOT-NET-003
  sheet: IOT
  category: NET
  title: Test the device for exposure to the internet
  objective: Finds devices that open ports to the internet through UPnP or default NAT rules.
  steps:
  - Check if the device asks the router to open ports.
  - Scan the public address of the lab network from outside.
  - Check for cloud relay use instead of inbound ports.
  - Record each reachable service.
  example: upnpc -l on the lab network; external nmap scan of the lab WAN address.
  expected: The device opens no inbound port to the internet. Remote access uses an authenticated outbound cloud channel.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-306
    attack:
    - T0883
    - T0822
    iot_top10:
    - I2
