- id: IOT-NET-004
  sheet: IOT
  category: NET
  title: Test network services with malformed input and long input
  objective: Finds crashes and memory errors in the parsers of the device.
  steps:
  - Pick one network service.
  - Send over-long and malformed fields in a lab.
  - Watch the device for crash, reboot or hang.
  - Record the input that caused it.
  example: Boofuzz or a protocol fuzzer on a lab device; serial console log for crash traces.
  expected: The service rejects bad input with an error. The device does not crash or reboot.
  severity: Medium
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-120
    - CWE-787
    - CWE-125
    attack:
    - T0814
    iot_top10:
