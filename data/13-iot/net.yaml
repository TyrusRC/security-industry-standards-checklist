- id: IOT-NET-005
  sheet: IOT
  category: NET
  title: Check wireless interfaces for weak pairing and open access
  objective: Finds Wi-Fi, Bluetooth and radio links with weak pairing or no encryption.
  steps:
  - List all radio interfaces of the device.
  - Capture the pairing and the data with a sniffer.
  - Check the encryption and the pairing method.
  - Try to join without a user action.
  example: Wireshark with a monitor mode adapter; Bluetooth sniffer; nRF Sniffer on a lab device.
  expected: Radio links use encryption and authenticated pairing. The device does not join or pair without a user action.
  severity: High
  test_type:
  - Manual
  refs:
    cwe:
    - CWE-319
    cheatsheet:
