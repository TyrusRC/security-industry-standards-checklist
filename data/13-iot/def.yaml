  - sources/top10s/iot_map.md
  - sources/repos/CheatSheetSeries/cheatsheets/Automotive_Security_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
  - sources/repos/www-project-internet-of-things/tab_validate_and_test.md
- id: IOT-DEF-004
  sheet: IOT
  category: DEF
  title: Test secure boot and image signing
  objective: Finds devices that boot unsigned code.
  steps:
  - Read the boot chain description.
  - Write a changed image to a lab unit.
  - Boot the unit.
  - Check that the first stage is in ROM or locked.
  example: Programmer or bootloader console on a lab unit; read the fuse state if documented.
  expected: Each boot stage checks the signature of the next. The device refuses to boot a changed image.
  severity: High
  test_type:
  - Manual
  refs:
    other:
    - GSMA CLP13_6.15
    - GSMA CLP13_6.3
    - UK Code of Practice for Consumer IoT Security provision 7, as listed in iot_map.md
