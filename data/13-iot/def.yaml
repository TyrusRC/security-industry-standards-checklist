- id: IOT-DEF-001
  sheet: IOT
  category: DEF
  title: Review the out-of-box configuration of the device
  objective: Finds insecure defaults such as open services, debug mode and weak encryption.
  steps:
  - Reset a lab unit to factory state.
  - Scan ports and read the default settings.
  - List all features that are on by default.
  - Compare with the minimum needed.
  example: nmap -p- after reset; export of the default config.
  expected: Defaults are secure. Unneeded features are off, encryption is on and setup forces a new credential.
  severity: High
  test_type:
  - Manual
  refs:
    other:
    - UK Code of Practice for Consumer IoT Security provision 12, as listed in iot_map.md
    cwe:
    - CWE-1188
    - CWE-1392
    cheatsheet:
    - Secure_Product_Design_Cheat_Sheet
    iot_top10:
    - I9
  see:
  - MOB-PRIV-011
  sources_read:
  - sources/repos/www-project-internet-of-things/tab_seek_and_understand.md
  - sources/top10s/iot_map.md
  - sources/repos/CheatSheetSeries/cheatsheets/Secure_Product_Design_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
- id: IOT-DEF-002
  sheet: IOT
  category: DEF
  title: Check who can change security settings on the device
  objective: Finds devices that do not let operators harden them or that let users weaken them.
  steps:
  - List the security settings in the interface.
  - Change each setting as owner and as a limited user.
  - Check that a limited user cannot weaken them.
  - Check the audit entry for each change.
  example: Web interface review; API calls with low-privilege tokens.
  expected: Operators can raise security settings. Only authorized roles can change them and each change is logged.
  severity: Medium
  test_type:
  - Manual
  refs:
    other:
    - GSMA CLP12_8.4
    cwe:
    - CWE-269
    - CWE-732
    cheatsheet:
    - Secure_Product_Design_Cheat_Sheet
    iot_top10:
    - I9
  sources_read:
