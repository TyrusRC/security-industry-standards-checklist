- id: IOT-DEF-005
  sheet: IOT
  category: DEF
  title: Check removable media and autorun behavior
  objective: Finds devices that run or import code from USB or SD cards.
  steps:
  - Insert a USB drive or SD card with a harmless marker script.
  - Watch the device.
  - Check import and update from media.
  - Check for signature checks on media content.
  example: Marker script that only writes a file; serial console log.
  expected: The device does not run code from media. Updates from media need a valid signature.
  severity: Medium
  test_type:
  - Manual
  refs:
    cheatsheet:
    - Drone_Security_Cheat_Sheet
    attack:
    - T0895
    - T0847
    iot_top10:
    - I9
    - I10
