  - sources/top10s/iot_map.md
  - sources/repos/CheatSheetSeries/cheatsheets/Secure_Product_Design_Cheat_Sheet.md
  - sources/cwe/cwec_latest.xml.zip
- id: IOT-DEF-003
  sheet: IOT
  category: DEF
  title: Check that debug interfaces and test features are off in production
  objective: Finds enabled UART consoles, JTAG, test accounts and debug services.
  steps:
  - Open the case of a lab unit.
  - Find UART and JTAG pads.
  - Connect a logic adapter and watch the boot output.
  - Try to get a shell or debug access.
  example: Identify pins with a multimeter; screen /dev/ttyUSB0 115200; OpenOCD on a lab unit only.
  expected: Production units give no shell or debug access on UART or JTAG without authentication. Debug services are off.
  severity: High
  test_type:
  - Manual
  refs:
    other:
    - GSMA CLP13_8.2
    cwe:
    - CWE-489
    - CWE-1191
    - CWE-1244
    cheatsheet:
    - Automotive_Security_Cheat_Sheet
    iot_top10:
    - I9
    - I10
  sources_read:
