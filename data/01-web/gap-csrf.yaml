- id: WEB-CSRF-001
  sheet: WEB
  category: CSRF
  title: Test origin checks with Origin, Referer and Sec-Fetch-Site headers
  objective: Find state-changing endpoints that accept requests from another site because the server does not check the request origin.
  steps:
  - List the state-changing requests that use cookie authentication.
  - Replay each request with an Origin header from an attacker site.
  - 'Replay each request with Origin: null and with the Origin header removed.'
  - 'Replay each request with Sec-Fetch-Site: cross-site and a foreign Referer header.'
  - Look for a safe method such as GET that changes state.
  - Make sure the server does not allow the literal null origin or a partial host match.
  example: 'curl -b "session=<id>" -H "Origin: https://evil.example" -H "Sec-Fetch-Site: cross-site" -X POST https://target/account/email -d "email=a@b.test"; also test Origin: https://target.evil.example'
  expected: The server rejects cross-site requests that change state. It checks the Origin header, uses Referer only as a fallback, and does not trust null or a partial match.
  severity: High
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    wstg:
