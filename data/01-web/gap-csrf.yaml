- id: WEB-CSRF-005
  sheet: WEB
  category: CSRF
  title: Test client-side code for request forgery from URL and DOM inputs
  objective: Find client-side CSRF where attacker input in the URL or the DOM makes the page send a state-changing same-origin request.
  steps:
  - Search the JavaScript for request calls that build the URL or body from location, hash or postMessage data.
  - Put path traversal and extra parameters in the input, such as ../ and &action=delete.
  - Open a crafted link as the victim and watch the network requests.
  - Check if the request carries the CSRF token and the session cookie.
  example: https://target/app#/profile/..%2f..%2fadmin%2fdelete ; use browser DevTools network tab and grep the bundle for fetch(
  expected: Client-side code does not build request targets from untrusted input without allowlist checks. The server still checks the token and the origin of each state-changing request.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
