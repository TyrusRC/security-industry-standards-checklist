- id: WEB-CSRF-003
  sheet: WEB
  category: CSRF
  title: Test double-submit cookie tokens for forgery from a subdomain
  objective: Find double-submit CSRF defenses where an attacker can set the token cookie and a matching request value.
  steps:
  - Find out if the CSRF token is a cookie value that is copied into the request.
  - Check if the token is signed (HMAC) and tied to the session.
  - Set an own cookie with a chosen token value from a sibling subdomain or over HTTP, in a test environment.
  - Send a request with the same chosen value in the cookie and in the header.
  - Check if the cookie uses the __Host- prefix and no Domain attribute.
  example: 'Set-Cookie: csrf=attacker; Domain=example.com from a test subdomain, then POST with X-CSRF-Token: attacker'
  expected: The server rejects a token that it did not issue for this session. The token cookie cannot be set from another subdomain.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-SESS-05
