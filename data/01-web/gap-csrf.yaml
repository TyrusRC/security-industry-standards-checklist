- id: WEB-CSRF-002
  sheet: WEB
  category: CSRF
  title: Test that anti-CSRF tokens are bound to the session and are random
  objective: Find CSRF tokens that an attacker can predict, reuse, or use with another account.
  steps:
  - Collect anti-CSRF tokens from several sessions and users.
  - Look at the tokens for patterns, such as a user ID, an email address, or a time value.
  - Use a valid token of user A in a request of user B.
  - Use a token from before logout or login in a new session.
  - Look for tokens in URLs, Referer headers, and logs.
  - Send the token in a different place, such as a query parameter, and in an empty form.
  example: Burp Sequencer on the token; repeat a POST with the token of another session; compare token values with Burp Comparer
  expected: Each token is unique per session, secret and unpredictable. The server rejects a token of another session, an old token, and an empty token. Tokens are not in URLs.
  severity: High
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-SESS-05
