- id: WEB-CSRF-004
  sheet: WEB
  category: CSRF
  title: Test login and other pre-session forms for cross-site request forgery
  objective: Find login forms that accept a forged request, which lets an attacker sign the victim in to an attacker account.
  steps:
  - Open the login form without a session and look for a CSRF token.
  - Submit the login request from a page on another origin, in a test environment.
  - Check if the victim then works in the attacker account and saves private data there.
  - Do the same for the sign-up and password reset forms.
  example: Host an HTML form that posts attacker credentials to https://target/login and open it in a browser that has no session
  expected: The login and pre-session forms need a CSRF token or an origin check. A forged login request fails.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
