  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A07_2025-Authentication_Failures.md
- id: WEB-IDM-005
  sheet: WEB
  category: IDM
  title: Try to register or rename to a reserved user name
  objective: Finds registration and profile pages that allow staff impersonation with names such as admin.
  steps:
  - Register as a new user with the name admin. Read the response.
  - Repeat with administrator, moderator, Admin and ADMIN.
  - Log in as a normal user and open the profile edit page.
  - Change the user name to each reserved name and save.
  example: POST /register username=AdMiN in Burp Repeater; then POST /profile/update username=administrator with a normal session.
  expected: The application rejects every reserved name and every case variant, both at registration and at profile change.
  severity: Low
  test_type: Manual
  refs:
    wstg:
    - WSTG-IDNT-04
    - WSTG-IDNT-05
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-290
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/03-Identity_Management/04-Account_Enumeration_and_Guessable_User_Account.md
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/03-Identity_Management/05-Weak_or_Unenforced_Username_Policy.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
- id: WEB-IDM-006
  sheet: WEB
  category: IDM
  title: Check that user names and user IDs are not predictable
  objective: Finds sequential or pattern-based user names that make guessing and credential stuffing easier.
  steps:
  - Collect user names or IDs from five new accounts and from public pages.
  - Look for patterns such as sequential numbers or first initial plus last name.
  - Generate five names from the pattern. Check if the application accepts them as valid.
  - Check if user IDs are random and not linked to a card number or real name.
  example: for i in $(seq 100 120); do curl -s -o /dev/null -w '%{http_code} CN000$i\n' https://target/profile/CN000$i; done
  expected: User IDs are random and not guessable from a pattern. Generated names do not reveal valid accounts.
  severity: Low
  test_type: Manual
  refs:
    wstg:
    - WSTG-IDNT-04
    - WSTG-IDNT-05
    cheatsheet:
    - Authentication_Cheat_Sheet
    - Credential_Stuffing_Prevention_Cheat_Sheet
    cwe:
    - CWE-330
    - CWE-340
