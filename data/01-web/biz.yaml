- id: WEB-BIZ-001
  sheet: WEB
  category: BIZ
  title: Test forged requests that skip the frontend workflow
  objective: Finds backend endpoints that accept forged requests without the checks the frontend enforces.
  preconditions:
  - Do not run on production.
  steps:
  - Observe HTTP traffic for guessable or sequential values, such as an incrementing transaction ID.
  - Observe for hidden fields or parameters indicating debug or development functionality.
  - Submit a forged request directly to the backend endpoint, skipping the frontend screens.
  - Guess or change a hidden field value, such as a discount flag, and resubmit.
  example: Change a hidden field senior_discount=false to senior_discount=true and resubmit directly to the checkout endpoint
  expected: The backend independently re-derives discounts, prices and flags and rejects requests that were not produced by the real workflow.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-BUSL-02
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-472
    - CWE-602
    capec:
    - CAPEC-137
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/10-Business_Logic/02-Ability_to_Forge_Requests.md
  - sources/repos/CheatSheetSeries/cheatsheets/Business_Logic_Security_Cheat_Sheet.md
- id: WEB-BIZ-002
  sheet: WEB
  category: BIZ
  title: Test non-editable and hidden fields for integrity bypass
  objective: Finds hidden, read-only or dropdown-bound fields that the server trusts without re-validation.
  preconditions:
  - Do not run on production.
  steps:
  - Capture a request containing a hidden field, a disabled form control, or a value shown only in a dropdown.
  - Submit the request with that field changed to a value not offered by the interface.
  - Submit a value for a field that only an administrator should be able to set.
  - Check whether application logs can be modified by submitting crafted log-bound input.
  example: Change a hidden price=20.00 field to price=0.01, or a role dropdown value to a role never shown to this user
  expected: The server treats hidden and non-editable fields as untrusted and revalidates every value against the business rule.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-BUSL-03
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-472
    capec:
    - CAPEC-162
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/10-Business_Logic/03-Integrity_Checks.md
  - sources/repos/CheatSheetSeries/cheatsheets/Business_Logic_Security_Cheat_Sheet.md
- id: WEB-BIZ-003
  sheet: WEB
  category: BIZ
  title: Test time-dependent processes for information leakage and race windows
  objective: Finds processing time differences that leak information or create a window to exploit a transaction.
  preconditions:
  - Do not run on production.
  steps:
  - Identify a process whose completion time might depend on a secret, such as login or password reset.
  - Measure and compare response time for valid and invalid inputs across many requests.
  - Identify a time-sensitive transaction, such as a price quote with an expiry, and test extending it past the expected window.
  example: Automated timing script sending repeated login attempts with valid and invalid usernames, comparing mean response time
  expected: Response time does not depend on whether input is valid, and time-sensitive transactions are strictly bound to their stated window server-side.
  severity: Medium
  test_type: Automated
  refs:
    wstg:
    - WSTG-BUSL-04
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-208
    capec: []
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/10-Business_Logic/04-Process_Timing.md
  - sources/repos/CheatSheetSeries/cheatsheets/Business_Logic_Security_Cheat_Sheet.md
- id: WEB-BIZ-004
  sheet: WEB
  category: BIZ
  title: Test functions that should set a hard limit on repeated use
  objective: Finds coupon, bonus or similar functions missing a server-side limit on how many times they can run.
  preconditions:
  - Do not run on production.
  steps:
  - Identify a function documented or expected to run only once or a limited number of times per user.
  - Call the function repeatedly, for example reapplying a one-time discount code.
  - Check whether the limit is enforced per account, per session or globally as required.
  example: Reapply the same one-time discount code repeatedly in separate checkout requests
  expected: The limit on the number of times a function can be used is enforced server-side and cannot be bypassed by repeating the request.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-BUSL-05
    asvs:
    - V2.3.2
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-799
    capec:
    - CAPEC-166
  sources_read:
