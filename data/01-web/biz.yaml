- id: WEB-BIZ-011
  sheet: WEB
  category: BIZ
  title: Test active defenses against combined application misuse
  objective: Finds applications that take no defensive action after a user sends many clearly malicious requests.
  preconditions:
  - Do not run on production.
  steps:
  - 'Send a sequence of mild then increasingly malicious probes: an invalid ID, a tick character, a verb change.'
  - Continue probing with a blatant SQL injection or XSS payload.
  - Observe whether the application changes behavior, such as adding delays, extra authentication, or blocking the session.
  example: 'Sequence: /file?id=999 -> /file?id='' -> change GET to POST -> duplicate a parameter -> submit '' OR 1=1-- and watch for a defensive response'
  expected: The application detects the pattern of misuse and responds with increased scrutiny, delays, or a block rather than processing every request normally.
  severity: Low
  test_type: Manual
  refs:
    wstg:
    - WSTG-BUSL-07
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-799
    capec: []
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/10-Business_Logic/07-Defenses_Against_Application_Misuse.md
  - sources/repos/CheatSheetSeries/cheatsheets/Business_Logic_Security_Cheat_Sheet.md
- id: WEB-BIZ-012
  sheet: WEB
  category: BIZ
  title: Test payment quantity and price fields for business logic tampering
  objective: Finds checkout logic that trusts client-supplied quantity, price or currency values.
  preconditions:
  - Do not run on production.
  steps:
  - Add an item to the basket and intercept the add-to-basket or checkout request.
  - Change the quantity to a negative number and resubmit.
  - If a price or currency field is present, change it to a lower value or another currency.
  - If a secure hash or encrypted field protects the transaction, try submitting the request without it.
  example: item_id=1&quantity=-5 ; item_id=1&quantity=5&price=0.01 ; currency=XXX where USD is expected ; strip the secure_hash parameter entirely
  expected: The server re-derives price, quantity and currency from trusted data server-side and rejects a request without a valid integrity hash.
  severity: Critical
  test_type: Manual
  refs:
    owasp_top10:
    - A06:2025
    wstg:
    - WSTG-BUSL-10
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    - Transaction_Authorization_Cheat_Sheet
    cwe:
    - CWE-472
    - CWE-345
    capec:
    - CAPEC-137
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/10-Business_Logic/10-Payment_Functionality.md
  - sources/repos/CheatSheetSeries/cheatsheets/Business_Logic_Security_Cheat_Sheet.md
