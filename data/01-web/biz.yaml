- id: WEB-BIZ-006
  sheet: WEB
  category: BIZ
  title: Test transactional operations for atomic all-or-nothing behavior
  objective: Finds multi-step business transactions that can be left in a partially applied state.
  preconditions:
  - Do not run on production.
  steps:
  - Identify a business operation composed of multiple writes, such as a transfer that debits one account and credits another.
  - Interrupt the operation partway, for example by closing the connection after the first write.
  - Check whether the operation rolls back completely or leaves an inconsistent partial state.
  example: Terminate the connection immediately after the debit step of a funds transfer and check both account balances afterward
  expected: The business operation runs inside a transaction that either completes in full or rolls back to the prior correct state.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V2.3.3
    cwe:
    - CWE-696
    capec: []
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: WEB-BIZ-007
  sheet: WEB
  category: BIZ
  title: Test limited-quantity resources for double-booking
  objective: Finds booking or allocation logic missing a locking mechanism for a limited resource.
  preconditions:
  - Do not run on production.
  steps:
  - Identify a limited-quantity resource, such as a seat, slot or inventory item.
  - Send two or more concurrent requests to reserve the same resource.
  - Check whether more reservations succeed than the resource actually has capacity for.
  example: Fire 20 concurrent requests for the last available seat using a tool such as Turbo Intruder or ffuf with -c
  expected: A business-logic-level lock or atomic conditional update prevents more reservations than the resource has capacity for.
  severity: High
  test_type: Automated
  level: ASVS L2
  refs:
    asvs:
    - V2.3.4
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-362
    - CWE-367
    capec:
    - CAPEC-26
    - CAPEC-29
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Business_Logic_Security_Cheat_Sheet.md
- id: WEB-BIZ-008
  sheet: WEB
  category: BIZ
  title: Test high-value flows for required multi-user approval
  objective: Finds high-value or safety-critical business actions that a single user can complete alone.
  preconditions:
  - Do not run on production.
  steps:
  - Identify high-value flows, such as a large monetary transfer or an access-level change.
  - Try to complete the flow with a single compromised account and no second approver.
  - Check whether the application requires a second, independent approval for the action.
  example: Submit a large fund transfer as a single authenticated user with no second approval step triggered
  expected: High-value business flows require a second, independent approval before the action takes effect.
  severity: High
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V2.3.5
    cwe:
    - CWE-862
    capec: []
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: WEB-BIZ-009
  sheet: WEB
  category: BIZ
  title: Test functions for anti-automation and rate-limit controls
  objective: Finds application functions reachable at excessive volume without a rate limit or anti-automation control.
  preconditions:
  - Do not run on production.
  steps:
  - Identify functions that could be abused by automation, such as a search, coupon check or export.
  - Send a high volume of requests to the function using an automated tool.
  - Check whether the application applies a rate limit, CAPTCHA or account lock after excessive use.
  example: ffuf -u https://target/api/coupon?code=FUZZ -w codes.txt -t 50 and observe whether throttling begins
  expected: The application enforces a rate limit or anti-automation control before quota exhaustion, data exfiltration or denial-of-service can occur.
  severity: Medium
  test_type: Automated
  level: ASVS L2
  refs:
    asvs:
    - V2.4.1
    cwe:
    - CWE-799
    - CWE-770
    capec:
    - CAPEC-125
    - CAPEC-112
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: WEB-BIZ-010
  sheet: WEB
  category: BIZ
  title: Test transaction submission timing against expected human speed
  objective: Finds workflows missing a check for unrealistically fast, automated transaction submission.
  preconditions:
  - Do not run on production.
  steps:
  - Identify a multi-step flow with a timing assumption, such as filling a form or confirming a purchase.
  - Automate the flow to complete every step far faster than a human could.
  - Check whether the application detects and blocks the unrealistic timing.
  example: Automated script submitting a multi-field form in under 200 milliseconds, repeated across many sessions
  expected: The application detects submissions faster than realistic human timing and blocks or challenges them.
  severity: Medium
  test_type: Automated
  level: ASVS L3
  refs:
    asvs:
    - V2.4.2
    wstg:
    - WSTG-BUSL-04
    cwe:
    - CWE-799
    capec: []
