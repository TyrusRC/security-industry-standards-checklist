  - sources/repos/CheatSheetSeries/cheatsheets/Business_Logic_Security_Cheat_Sheet.md
- id: WEB-BIZ-014
  sheet: WEB
  category: BIZ
  title: Test payment race conditions and double-spend windows
  objective: Finds payment flows vulnerable to a race between a check and a write on a balance or stock value.
  preconditions:
  - Do not run on production.
  steps:
  - Identify a payment or balance operation with a check-then-act pattern, such as spending a gift card balance.
  - Send multiple concurrent requests that use the same balance or the same one-time resource.
  - Check whether more value or resource is consumed than the balance actually allows.
  example: Fire 20 concurrent gift-card redemption requests against a balance that should cover only one redemption
  expected: The balance check and debit run inside a single atomic transaction or a conditional update, so concurrent requests cannot overdraw it.
  severity: Critical
  test_type: Automated
  refs:
    wstg:
    - WSTG-BUSL-10
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-362
    - CWE-367
    capec:
    - CAPEC-26
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/10-Business_Logic/10-Payment_Functionality.md
