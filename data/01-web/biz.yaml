- id: WEB-BIZ-013
  sheet: WEB
  category: BIZ
  title: Test discount codes for guessability and stacking abuse
  objective: Finds discount code systems with guessable codes, no brute-force protection, or unsafe stacking.
  preconditions:
  - Do not run on production.
  steps:
  - Try common discount code patterns such as TEST10 or the company name.
  - Submit many sequential or incremented codes to check for brute-force protection.
  - Apply more than one discount code to the same order and check whether they stack below cost.
  example: code=TEST10 ; code=SORRY10 ; try sequential codes SAVE01..SAVE99 ; apply two valid codes to the same basket
  expected: Discount codes are unpredictable, rate-limited against brute force, and cannot be stacked to push the price below cost.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-BUSL-10
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-799
    capec:
    - CAPEC-112
  sources_read:
