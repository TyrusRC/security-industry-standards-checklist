- id: WEB-BIZ-005
  sheet: WEB
  category: BIZ
  title: Test multi-step workflows for step skipping and reordering
  objective: Finds workflows that can be completed out of order or with required steps skipped entirely.
  preconditions:
  - Do not run on production.
  steps:
  - Map every step of a multi-step workflow and the request associated with each step.
  - Call a later-stage endpoint directly without completing the earlier required steps.
  - Replay or reorder captured requests to reach an unauthorized or unintended state.
  - Submit a status or phase parameter with an invalid, future, or unauthorized value.
  example: Call the order-fulfillment endpoint directly without a preceding confirmed-payment step; replay step 3 before step 2
  expected: The server tracks workflow state itself and rejects a request for any step whose prerequisites were not completed in order.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A06:2025
    wstg:
    - WSTG-BUSL-06
    asvs:
    - V2.3.1
    cheatsheet:
    - Business_Logic_Security_Cheat_Sheet
    cwe:
    - CWE-841
    capec:
    - CAPEC-74
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/10-Business_Logic/06-Circumvention_of_Work_Flows.md
