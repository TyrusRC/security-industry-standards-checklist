- id: WEB-CLIENT-019
  sheet: WEB
  category: CLIENT
  title: Test for use of unsupported or insecure client-side technology
  objective: Finds pages that still rely on retired plugin technologies such as Flash, Silverlight or Java applets.
  preconditions:
  - Do not run on production.
  steps:
  - Review page source and network requests for plugin object or embed tags.
  - Check for Flash, Silverlight, ActiveX, NACL or Java applet content types.
  - Confirm the application functions fully without any retired plugin technology.
  example: grep -riE "application/x-shockwave-flash|silverlight|activex|applet" against page source and asset list
  expected: No page relies on Flash, Silverlight, ActiveX, NACL or Java applets to function.
  severity: Low
  test_type: Config Review
  level: ASVS L2
