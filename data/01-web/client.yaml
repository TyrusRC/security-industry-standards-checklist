- id: WEB-CLIENT-020
  sheet: WEB
  category: CLIENT
  title: Test browser security feature fallback behavior
  objective: Finds applications that behave unsafely when an expected browser security feature is unsupported.
  preconditions:
  - Do not run on production.
  steps:
  - Review documentation or the application for expected browser security features such as CSP or HSTS support.
  - Use a browser or a developer tools override that disables one expected feature, such as CSP enforcement.
  - Confirm the application warns the user or blocks access rather than continuing silently without protection.
  example: Disable CSP enforcement in browser devtools or use a legacy user agent, then load the application
  expected: The application warns the user or blocks access when a browser does not support an expected security feature, as documented.
  severity: Info
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V3.1.1
    - V3.7.5
    cwe: []
    capec: []
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: WEB-CLIENT-021
  sheet: WEB
  category: CLIENT
  title: Test authenticated resource embedding across origins
  objective: Finds authenticated images, scripts or documents that an attacker page can embed or load.
  preconditions:
  - Do not run on production.
  steps:
  - Identify an authenticated resource such as an image, video or script that is loaded while a session cookie is set.
  - From an attacker page, embed the resource URL and check whether it loads using the victim session.
  - Inspect the response for a Cross-Origin-Resource-Policy header and Sec-Fetch-Dest validation.
  example: <img src="https://target/private/avatar.jpg"> embedded on an attacker page while the victim is logged in
  expected: The server validates Sec-Fetch-* headers or sets a restrictive Cross-Origin-Resource-Policy so other origins cannot load authenticated resources.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V3.5.8
    cwe:
    - CWE-346
    capec: []
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: WEB-CLIENT-022
  sheet: WEB
  category: CLIENT
  title: Test query parameters for HTTP Parameter Pollution
  objective: Finds inconsistent handling of duplicate parameter names that can bypass validation or filters.
  preconditions:
  - Do not run on production.
  steps:
  - Submit a request with a parameter name duplicated with two different values.
  - Compare the response to the single-parameter baseline to see which value the server and front-end filter used.
  - Repeat with a duplicated parameter inside a JSON body if the endpoint accepts JSON.
  example: 'https://target/?mode=guest&search_string=kittens&search_string=puppies ; JSON: {"search_string":"kittens","search_string":"puppies"}'
  expected: The application and any filter in front of it handle duplicate parameters consistently and no security check can be bypassed by duplication.
