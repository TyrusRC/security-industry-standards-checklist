- id: WEB-AUTHZ-007
  sheet: WEB
  category: AUTHZ
  title: Test field-level access and mass assignment
  objective: Finds objects where users can read or write fields they should not.
  steps:
  - Compare the fields in responses for different roles.
  - Add extra fields such as role, isAdmin and balance to update requests.
  - Change read-only fields.
  - Check fields that depend on state, such as status.
  example: 'curl -X PATCH https://target/api/users/me -b ''session=<user>'' -H ''Content-Type: application/json'' -d ''{"role":"admin","isAdmin":true}'''
  expected: Users cannot read or write fields without permission. Unknown and protected fields are ignored or rejected.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    asvs:
    - V8.2.3
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-915
    - CWE-863
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Cheat_Sheet.md
