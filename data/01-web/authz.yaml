- id: WEB-AUTHZ-010
  sheet: WEB
  category: AUTHZ
  title: Check that permission changes apply at once
  objective: Finds tokens or caches that keep old permissions after a change.
  steps:
  - Log in as a user and keep the session or token.
  - Remove a role from the user as administrator.
  - Call a function of that role at once.
  - Check the lifetime of the token or cache.
  example: 'curl -i -H ''Authorization: Bearer <old jwt>'' https://target/api/admin/report right after the role is removed.'
  expected: A permission change takes effect at once. If not, there is a control that alerts on the action and reverts it.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V8.3.2
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-863
    - CWE-285
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Cheat_Sheet.md
- id: WEB-AUTHZ-011
  sheet: WEB
  category: AUTHZ
  title: Check that back-end calls use the original user permissions
  objective: Finds services that act with their own rights on behalf of a user.
  steps:
  - Map the calls between internal services for one user action.
  - Call the action with a low-privilege user token.
  - Look at the token that the second service gets.
  - Check that the second service enforces the user rights.
  example: 'Trace with a proxy or service mesh logs: compare the Authorization headers on hop 1 and hop 2.'
  expected: Services pass on the user identity and apply the user permissions. No service acts as a confused deputy.
  severity: High
  test_type: Code Review
  level: ASVS L3
  refs:
    owasp_top10:
    - A01:2025
    asvs:
    - V8.3.3
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-441
    - CWE-863
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A01_2025-Broken_Access_Control.md
- id: WEB-AUTHZ-012
  sheet: WEB
  category: AUTHZ
  title: Test tenant isolation in multi-tenant applications
  objective: Finds operations that affect other tenants.
  steps:
  - Create two tenants with a user in each.
  - Use IDs, names and tokens of tenant A in requests as a user of tenant B.
  - Change a tenant header or subdomain value.
  - Check search, export and bulk functions.
  example: 'curl -b ''session=<tenantB user>'' -H ''X-Tenant-ID: tenantA'' https://target/api/invoices'
  expected: A user can never read or change data of another tenant.
  severity: Critical
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    asvs:
    - V8.4.1
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-284
    - CWE-653
