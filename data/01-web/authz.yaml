- id: WEB-AUTHZ-014
  sheet: WEB
  category: AUTHZ
  title: Test bypass with special request headers
  objective: Finds access control that trusts headers such as X-Original-URL or X-Forwarded-For.
  steps:
  - Send a blocked admin URL with X-Original-URL set to it, with a harmless request path.
  - Do the same with X-Rewrite-URL.
  - Add X-Forwarded-For, X-Client-IP and X-Remote-Addr with 127.0.0.1, ::1 and RFC1918 addresses.
  - Try IPv4-mapped IPv6 values.
  example: 'curl -i https://target/ -H ''X-Original-URL: /admin'' ; curl -i https://target/admin -H ''X-Forwarded-For: 127.0.0.1'''
  expected: Header values do not change the path or the client identity. The blocked page stays blocked.
  severity: High
  test_type: Manual
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-02
    - WSTG-ATHZ-03
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-290
    - CWE-291
    - CWE-288
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/05-Authorization/02-Bypassing_Authorization_Schema.md
