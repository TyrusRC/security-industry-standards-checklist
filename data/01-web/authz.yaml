- id: WEB-AUTHZ-016
  sheet: WEB
  category: AUTHZ
  title: Check URL path matching in authorization rules
  objective: Finds rules that use partial string matching on URLs.
  steps:
  - Read the code for startswith, endswith, contains and indexOf on paths.
  - Send encoded, double-slash and dot-segment paths to protected URLs.
  - Try different case and trailing characters.
  example: curl -i 'https://target//admin' ; curl -i 'https://target/%2e%2e/admin' ; curl -i 'https://target/admin;.css'
  expected: Authorization uses the normalized path and exact rules. Encoded paths and dot segments do not skip a check.
  severity: High
  test_type: Code Review
  refs:
    wstg:
    - WSTG-ATHZ-03
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-551
    - CWE-863
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/05-Authorization/03-Privilege_Escalation.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Cheat_Sheet.md
- id: WEB-AUTHZ-017
  sheet: WEB
  category: AUTHZ
  title: Check deny by default and checks on every request
  objective: Finds new or unlisted routes and methods that have no access control.
  steps:
  - List all routes from the code or API description.
  - Find routes with no access rule.
  - Call them without rights, using POST, PUT and DELETE too.
  - Check that one shared mechanism enforces checks on every request.
  example: grep -rn 'permitAll\|@PermitAll\|skip_authorization' src/ ; compare the OpenAPI paths with the security config.
  expected: Access is denied when no rule matches. Every request goes through the same authorization check, including AJAX and API calls.
  severity: High
  test_type: Config Review
  refs:
    owasp_top10:
    - A01:2025
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-862
    - CWE-284
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A01_2025-Broken_Access_Control.md
- id: WEB-AUTHZ-018
  sheet: WEB
  category: AUTHZ
  title: Check logging and alerts for access control failures
  objective: Finds access control failures that nobody sees, and automated abuse that is not limited.
  steps:
  - Send 20 forbidden requests.
  - Read the logs for each failure.
  - Check for an alert after repeated failures.
  - Check for a rate limit on API and controller access.
  example: for i in $(seq 20); do curl -s -o /dev/null -b 'session=<user>' https://target/admin; done; grep 403 /var/log/app/access.log | tail
  expected: Access control failures are logged. Repeated failures raise an alert. API and controller access has a rate limit.
  severity: Low
  test_type: Config Review
  refs:
    owasp_top10:
    - A01:2025
    cwe:
    - CWE-778
    - CWE-770
  sources_read:
  - sources/repos/Top10/2025/docs/en/A01_2025-Broken_Access_Control.md
