- id: WEB-AUTHZ-005
  sheet: WEB
  category: AUTHZ
  title: Test forced browsing without a session
  objective: Finds pages and operations that need no login.
  steps:
  - Collect all URLs from crawl, JavaScript and API docs.
  - Request each URL without a session.
  - Request admin and internal paths.
  - Check the files in storage buckets that hold uploads.
  example: 'ffuf -w urls.txt -u https://target/FUZZ -mc 200,204,301,302,403 ; ZAP: Access Control Testing add-on with an unauthenticated context.'
  expected: Non-public URLs return 401 or redirect to login. Stored private files are not public.
  severity: High
  test_type: Automated
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-02
    cheatsheet:
    - Authorization_Cheat_Sheet
