- id: WEB-AUTHZ-015
  sheet: WEB
  category: AUTHZ
  title: Test directory traversal and file inclusion in file parameters
  objective: Finds parameters that read files outside the allowed folder.
  steps:
  - Find parameters that name files, templates or pages, also in cookies.
  - Send ../ sequences with 3 to 8 levels.
  - 'Send encoded forms: %2e%2e%2f, double encoding and backslashes.'
  - Try an absolute path and a remote URL.
  - On Windows, try UNC paths and trailing characters.
  example: ffuf -w LFI-Jhaddix.txt -u 'https://target/index.php?file=FUZZ' -fs <size> ; curl 'https://target/getUserProfile.jsp?item=../../../../etc/passwd'
  expected: The application accepts only expected file names. Traversal and remote includes are rejected after full decoding.
  severity: High
  test_type: Manual
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-01
    cwe:
    - CWE-22
    - CWE-23
    - CWE-36
    capec:
    - CAPEC-64
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/05-Authorization/01-Directory_Traversal_File_Include.md
  - sources/repos/Top10/2025/docs/en/A01_2025-Broken_Access_Control.md
  notes: Injection slice may cover path traversal in more depth. This test covers the authorization view.
  see:
