- id: WEB-AUTHZ-001
  sheet: WEB
  category: AUTHZ
  title: Read the authorization rules for functions and data
  objective: Finds missing rules for who may use which function and which data.
  preconditions:
  - Access to documentation.
  steps:
  - Get the authorization documentation.
  - Make sure it lists function-level rules by consumer permission.
  - Make sure it lists data-specific rules by resource attribute.
  - Compare five rules with real behavior.
  example: Build a role-to-endpoint matrix from the document, then replay it with Autorize or ZAP Access Control Testing.
  expected: The documentation defines function-level and data-specific access rules. The application follows them.
  severity: Low
  test_type: Config Review
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    asvs:
    - V8.1.1
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-284
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A01_2025-Broken_Access_Control.md
- id: WEB-AUTHZ-002
  sheet: WEB
  category: AUTHZ
  title: Read the field-level access rules
  objective: Finds missing rules for who may read or write each field.
  preconditions:
  - Access to documentation.
  steps:
  - Get the authorization documentation.
  - Make sure it defines read and write rules for each sensitive field.
  - Look for rules that depend on object state, such as status.
  - Compare with the API schema.
  example: Compare the OpenAPI schema (readOnly, writeOnly) with the documented field matrix.
  expected: Field-level read and write rules are documented, including state-dependent rules.
  severity: Low
  test_type: Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    asvs:
    - V8.1.2
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-915
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A01_2025-Broken_Access_Control.md
- id: WEB-AUTHZ-003
  sheet: WEB
  category: AUTHZ
  title: Read the contextual and environmental decision rules
  objective: Finds missing rules for time, place, IP and device in access decisions.
  preconditions:
  - Access to documentation.
  steps:
  - Get the authentication and authorization documentation.
  - 'Find the attributes used: time, location, IP address and device.'
  - 'Make sure the document lists thresholds and actions: allow, challenge, deny, step-up.'
  example: Review the risk engine rules and the design document side by side.
  expected: The attributes, risk thresholds and actions are documented for authentication and authorization decisions.
  severity: Low
  test_type: Config Review
  level: ASVS L3
  refs:
    asvs:
    - V8.1.3
    - V8.1.4
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-284
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
- id: WEB-AUTHZ-004
  sheet: WEB
  category: AUTHZ
  title: Test function-level access for each role
  objective: Finds functions that users can call without explicit permission.
  steps:
  - Map all functions and admin pages for each role.
  - Log in as a low role. Call the functions of a higher role with a proxy.
  - Call the same requests with no session.
  - 'Change HTTP methods: GET, POST, PUT, DELETE.'
  - Compare every response with the response of the allowed role.
  example: 'Burp Autorize: set the low-privilege cookie and browse as admin; or POST /admin/addUser (userID=fakeuser&role=3) with a user cookie.'
  expected: Only roles with explicit permission can use each function. Others get 401 or 403 for every method.
  severity: Critical
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-02
    - WSTG-ATHZ-03
    asvs:
    - V8.2.1
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-862
    - CWE-863
    - CWE-285
    - CWE-425
    - CWE-306
    capec:
    - CAPEC-1
    - CAPEC-58
    - CAPEC-122
