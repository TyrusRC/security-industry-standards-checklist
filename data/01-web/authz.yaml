- id: WEB-AUTHZ-013
  sheet: WEB
  category: AUTHZ
  title: Check layers of control on administrative interfaces
  objective: Finds admin interfaces that rely only on network location.
  steps:
  - List admin interfaces.
  - Reach them from a trusted network with a low role.
  - Check for ongoing identity checks, device posture and risk analysis.
  - Check that network location alone is not enough.
  example: 'curl -H ''X-Forwarded-For: 127.0.0.1'' https://target/admin ; review the admin gateway policy.'
  expected: 'Admin access needs several layers: continuous identity checks, device posture and risk analysis. Network location is never the only factor.'
  severity: High
  test_type: Config Review
  level: ASVS L3
  refs:
    wstg:
    - WSTG-ATHZ-02
    asvs:
    - V8.4.2
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-291
    - CWE-284
