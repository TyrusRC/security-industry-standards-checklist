- id: WEB-AUTHZ-006
  sheet: WEB
  category: AUTHZ
  title: Test privilege escalation by parameter and profile changes
  objective: Finds hidden fields, groups or conditions that a user can change to gain privileges.
  steps:
  - Look for group, profile, role and flag fields in requests, hidden fields and responses.
  - Change a value, such as profile=SysGuest to SysAdmin.
  - Change the group ID or order ID to one outside your group.
  - Try to add yourself to a higher role.
  example: POST /user/viewOrder.jsp groupID=grp002&orderID=0001 from a grp001 user; also change <input name='profile' value='SysAdmin'>.
  expected: The server does not trust client values for role, group or privilege. A user cannot raise their own privilege.
  severity: Critical
  test_type: Manual
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-03
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-269
    - CWE-266
    - CWE-639
    - CWE-472
    capec:
    - CAPEC-233
    - CAPEC-58
