- id: WEB-AUTHZ-008
  sheet: WEB
  category: AUTHZ
  title: Test adaptive access controls at login and during a session
  objective: Finds contextual controls that apply only at login or not at all.
  steps:
  - Read the documented context rules.
  - Log in from a new device and an unusual place.
  - Change the IP, device or time during an active session.
  - 'Check the action: step-up, deny or revoke.'
  example: Move the test session to a different VPN country and call a sensitive endpoint.
  expected: Context rules apply when a session starts and during the session, with the documented action.
  severity: Low
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V8.2.4
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-284
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
- id: WEB-AUTHZ-009
  sheet: WEB
  category: AUTHZ
  title: Check that authorization is enforced on the server
  objective: Finds access control that exists only in client-side code.
  steps:
  - Find controls hidden in JavaScript or by CSS.
  - Call hidden admin URLs with curl.
  - Remove or change client-side checks with a proxy.
  - Send API calls that the UI never makes.
  example: curl -i https://target/app/admin_getappInfo -b 'session=<user>'
  expected: The server decides access on every request. Changes in client code do not change the result.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    asvs:
    - V8.3.1
    cheatsheet:
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-602
    - CWE-603
    - CWE-862
