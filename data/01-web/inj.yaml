- id: WEB-INJ-007
  sheet: WEB
  category: INJ
  title: Test XML input for XML injection and malformed structure attacks
  objective: Finds XML parsers that fail to neutralize metacharacters supplied in element values.
  preconditions:
  - Do not run on production.
  steps:
  - Find an endpoint or form that accepts data later placed into an XML document.
  - Submit single and double quotes inside an XML attribute value.
  - Submit angle brackets, a CDATA closing sequence and an unescaped ampersand inside an element value.
  - Check if the resulting document is malformed or if content is misplaced.
  example: 'Username = foo'' ; Username = foo<!-- ; CDATA breakout: ]]> ; unescaped ampersand: Username = &foo'
  expected: The application escapes or rejects XML metacharacters and the document structure cannot be changed by input.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-INJT-07
    asvs:
    - V1.1.2
    cwe:
