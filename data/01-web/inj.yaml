- id: WEB-INJ-010
  sheet: WEB
  category: INJ
  title: Test XPath queries for injection and authentication bypass
  objective: Finds XPath queries built by concatenating untrusted login or search input.
  preconditions:
  - Do not run on production.
  steps:
  - Find an input placed into an XPath expression, such as a login form backed by an XML store.
  - Submit an always-true boolean payload in the username and password fields.
  - Observe whether the application authenticates or returns data without valid credentials.
  example: 'Username: '' or ''1'' = ''1 ; Password: '' or ''1'' = ''1'
