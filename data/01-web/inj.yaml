- id: WEB-INJ-022
  sheet: WEB
  category: INJ
  title: Test object binding endpoints for mass assignment
  objective: Finds auto-binding frameworks that let a client set fields never exposed in the form.
  preconditions:
  - Do not run on production.
  steps:
  - Identify endpoints that create or update an object from submitted parameters.
  - Retrieve the full object representation to learn hidden or sensitive field names.
  - Add a sensitive field such as isAdmin or role to the create or update request.
  - Observe whether the sensitive field value is accepted and persisted.
  example: POST /createUser username=bob&password=x&email=bob@test&isAdmin=true ; probe field user[nonexistingattribute] for autobinding behavior
  expected: The backend binds only an explicit allowlist of fields; extra client-supplied fields are ignored.
  severity: High
