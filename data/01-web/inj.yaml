- id: WEB-INJ-021
  sheet: WEB
  category: INJ
  title: Test server-initiated requests for SSRF
  objective: Finds server functions that fetch a URL supplied by the client without restriction.
  preconditions:
  - Do not run on production.
  steps:
  - Find a feature that fetches a URL on the server, such as a webhook, PDF generator or import tool.
  - Submit a URL pointing to the loopback address or an internal hostname.
  - Submit alternative IP encodings if plain loopback addresses are blocked.
  - Submit a file:// URL to test for local file disclosure.
  example: http://127.0.0.1/admin ; http://2130706433/ ; http://017700000001/ ; http://127.0.0.2/ ; file:///etc/passwd ; iframe src=file:///etc/passwd in PDF generator input
  expected: Outbound requests are restricted to an allowlist of domains, ports and protocols and loopback and link-local addresses are blocked.
  severity: Critical
  test_type: Manual
  level: ASVS L2
