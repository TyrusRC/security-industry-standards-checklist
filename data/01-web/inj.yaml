- id: WEB-INJ-001
  sheet: WEB
  category: INJ
  title: Test for SQL injection in database queries
  objective: Finds inputs where user data changes the structure of a SQL query.
  preconditions:
  - Do not run on production.
  steps:
  - List every input that can reach a database query, including hidden fields, headers and cookies.
  - Send a single quote and a semicolon in each input and compare the responses.
  - Send a true clause and a false clause, for example 1=1 and 1=2, and compare the responses.
  - Send a time delay payload and measure the response time.
  - Run sqlmap against the confirmed input to find the database type and the level of access.
  example: 'Burp Repeater payloads: 1'' OR ''1''=''1 ; 1'' AND ''1''=''2 ; 1 AND IF(version() like ''5%'',sleep(5),''false'')-- ; sqlmap -u "https://target/product.php?id=1" --technique=BEUST --risk=3'
  expected: Only parameterized queries, ORM calls, or an allowlisted structure reach the database. No SQL error or timing difference exposes injection.
  severity: Critical
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A05:2025
    wstg:
    - WSTG-INJT-05
    asvs:
    - V1.2.4
    cheatsheet:
    - SQL_Injection_Prevention_Cheat_Sheet
    - Query_Parameterization_Cheat_Sheet
    cwe:
    - CWE-89
    capec:
    - CAPEC-66
    - CAPEC-7
    - CAPEC-108
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/07-Injection/05-SQL_Injection.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Query_Parameterization_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A05_2025-Injection.md
- id: WEB-INJ-002
  sheet: WEB
  category: INJ
  title: Test SQL injection against each supported database backend
  objective: Confirms the database-specific fingerprint and injection syntax match what the server runs.
  preconditions:
  - Do not run on production.
  steps:
  - Fingerprint the backend from error text, comment syntax and version functions.
  - Use the UNION technique to find the column count with an ORDER BY payload.
  - Extract the database version with a UNION SELECT of the version function.
  - Repeat the fingerprint and extraction steps for Oracle, MySQL, SQL Server, PostgreSQL and MS Access syntax.
  example: https://target/product.php?id=10 ORDER BY 10-- ; https://target/product.php?id=10 UNION SELECT 1,@@version-- (MSSQL); UNION ALL SELECT NULL,version(),NULL LIMIT 1 OFFSET 1-- (PostgreSQL); 1 AND
    1=0 UNION SELECT @@version/* (MySQL)
  expected: The application returns the same generic error for every backend and never discloses database version or structure.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-INJT-05
    cheatsheet:
    - SQL_Injection_Prevention_Cheat_Sheet
    cwe:
    - CWE-89
    capec:
    - CAPEC-66
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/07-Injection/05-SQL_Injection.md
  - sources/repos/CheatSheetSeries/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md
- id: WEB-INJ-003
  sheet: WEB
  category: INJ
  title: Test NoSQL query operators for injection
  objective: Finds unsafe handling of JSON or operator-based query input in NoSQL databases.
  preconditions:
  - Do not run on production.
  steps:
  - Find endpoints that pass JSON bodies into a NoSQL query, such as MongoDB find or aggregate.
  - 'Replace a string value with an operator object, for example {"$ne": null} or {"$gt": ""}.'
  - Send special characters '"\;{} in a single text field and compare the responses.
  - If a $where clause exists, inject JavaScript and measure execution with a delay.
  example: 'POST body: {"username": {"$ne": null}, "password": {"$ne": null}} ; $where injection: 0;var date=new Date();do{curDate=new Date();}while(curDate-date<10000)'
  expected: The application rejects operator objects in place of scalar values and does not evaluate attacker JavaScript.
  severity: Critical
  test_type: Manual
  refs:
    wstg:
    - WSTG-INJT-05
    cheatsheet:
    - NoSQL_Security_Cheat_Sheet
    - SQL_Injection_Prevention_Cheat_Sheet
    cwe:
    - CWE-943
    capec:
    - CAPEC-676
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/07-Injection/05-SQL_Injection.md
  - sources/repos/CheatSheetSeries/cheatsheets/NoSQL_Security_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md
- id: WEB-INJ-004
  sheet: WEB
  category: INJ
  title: Test ORM and query-builder calls for injection
  objective: Finds ORM code that concatenates input instead of using bound parameters.
  preconditions:
  - Do not run on production.
  steps:
  - Identify the ORM in use from error messages, headers or source code.
  - Send a single quote in a field that reaches an ORM query and look for an ORM-specific error.
  - For Hibernate, send an HQL payload that always evaluates true.
  - Review source code for createQuery or createSQLQuery calls built by string concatenation.
  example: 'HQL: '' OR ''1'' = ''1'' -- ; Laravel example payload from advisory: whereRaw with unescaped input; review code for session.createQuery("from Orders where id=" + id)'
  expected: All ORM queries use bound parameters or the query builder, never string concatenation of user input.
  severity: High
  test_type: Code Review
  refs:
    wstg:
    - WSTG-INJT-05
    cheatsheet:
    - SQL_Injection_Prevention_Cheat_Sheet
    - Query_Parameterization_Cheat_Sheet
    cwe:
