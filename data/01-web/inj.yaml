- id: WEB-INJ-005
  sheet: WEB
  category: INJ
  title: Test SQL injection inside stored procedures and functions
  objective: Finds stored procedures that build dynamic SQL from parameters with EXECUTE IMMEDIATE or exec.
  preconditions:
  - Do not run on production.
  steps:
  - Identify calls to stored procedures from the application traffic.
  - Send injection payloads in each procedure parameter.
  - Check if the procedure calls EXECUTE IMMEDIATE, exec, or sp_executesql with concatenated input.
  - Review the procedure source if code access is available.
  example: 'SQL Server: exec master.dbo.xp_cmdshell ''whoami''-- ; a procedure parameter of 1'' OR 1=1--'
  expected: Stored procedures use bind variables for every parameter and never concatenate input into dynamic SQL.
  severity: Critical
  test_type: Manual
  refs:
    owasp_top10:
    - A05:2025
    wstg:
    - WSTG-INJT-05
    cheatsheet:
    - SQL_Injection_Prevention_Cheat_Sheet
