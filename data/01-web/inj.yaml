- id: WEB-INJ-019
  sheet: WEB
  category: INJ
  title: Test Host header handling for injection and cache poisoning
  objective: Finds server logic that trusts the Host or X-Forwarded-Host header for routing or link generation.
  preconditions:
  - Do not run on production.
  steps:
  - Send a request with the Host header set to an attacker domain and observe the response.
  - If filtered, retry using the X-Forwarded-Host header.
  - Trigger password reset functionality with a tampered Host header and check the link in the email.
  - Send a poisoned Host header to a cacheable page and request the same page again from another session.
  example: 'Host: www.attacker.com ; X-Forwarded-Host: www.attacker.com ; password reset request with Host: www.attacker.com'
  expected: The server uses a fixed, server-side configured hostname and ignores the Host header value for links and cache keys.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    wstg:
    - WSTG-INJT-17
    asvs:
    - V3.4.2
    cwe:
    - CWE-20
    capec:
    - CAPEC-141
