- id: WEB-INJ-018
  sheet: WEB
  category: INJ
  title: Test front-end and back-end servers for HTTP request smuggling
  objective: Finds parsing mismatches between Content-Length and Transfer-Encoding across proxy layers.
  preconditions:
  - Do not run on production.
  steps:
  - Send a CL.TE probe request with conflicting Content-Length and chunked Transfer-Encoding.
  - Send a TE.CL probe request with the chunk size mismatched to the Content-Length.
  - Send an obfuscated Transfer-Encoding header to test TE.TE desynchronization.
  - Observe whether a following legitimate request is corrupted or routed unexpectedly.
  example: 'CL.TE: Content-Length: 35\r\nTransfer-Encoding: chunked\r\n\r\n0\r\n\r\nGET /404 HTTP/1.1\r\nFoo: x ; Burp Suite HTTP Request Smuggler extension'
  expected: The front-end and back-end agree on request boundaries and no smuggled request is ever processed.
  severity: Critical
  test_type: Manual
  refs:
    wstg:
    - WSTG-INJT-16
    cwe:
    - CWE-444
    capec:
    - CAPEC-33
    - CAPEC-105
    - CAPEC-273
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/07-Injection/16-HTTP_Request_Smuggling.md
