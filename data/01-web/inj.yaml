- id: WEB-INJ-006
  sheet: WEB
  category: INJ
  title: Test LDAP search filters and login for injection
  objective: Finds LDAP filters built by concatenating user input into the filter string.
  preconditions:
  - Do not run on production.
  steps:
  - Find inputs used to build an LDAP search filter, such as a username or search box.
  - Send a wildcard character and LDAP metacharacters and compare the responses.
  - Try an authentication bypass with a filter-closing payload in the username and password fields.
  example: 'Search: user=* ; Login bypass: user=*)(uid=*))(|(uid=* , pass=password'
  expected: The application escapes LDAP metacharacters in every filter and rejects an always-true filter.
  severity: Critical
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A05:2025
    wstg:
