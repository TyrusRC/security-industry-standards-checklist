- id: WEB-INJ-020
  sheet: WEB
  category: INJ
  title: Test template rendering for server-side template injection
  objective: Finds templating engines that evaluate expressions built from untrusted input.
  preconditions:
  - Do not run on production.
  steps:
  - Find inputs rendered through a template engine, such as a greeting or report field.
  - Submit a generic arithmetic probe such as {{7*7}} and check if it is evaluated.
  - Identify the template engine from the response and research its built-in functions.
  - Build a proof-of-concept remote code execution payload for the identified engine.
  example: 'Probe: a{{7*7}}b or ${7*7} or <%= 7*7 %> ; Flask/Jinja2: curl -g ''https://target/page?name={{7*7}}'' returns Hello 49'
  expected: Untrusted input is never concatenated into template source; it is passed only as template data with escaping enabled.
  severity: Critical
  test_type: Manual
  level: ASVS L2
  refs:
