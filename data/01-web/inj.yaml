- id: WEB-INJ-025
  sheet: WEB
  category: INJ
  title: Test cookies and API inputs for insecure deserialization
  objective: Finds entry points that deserialize untrusted Java, PHP, Python pickle, Node or .NET serialized objects.
  preconditions:
  - Do not run on production.
  steps:
  - Inspect cookies, hidden fields and API bodies for serialization markers such as rO0, O:4:, or a .NET binary header.
  - Identify the serialization format and library version in use.
  - Submit a non-destructive out-of-band probe, such as ysoserial URLDNS, to confirm deserialization.
  - If a type-metadata field such as @class or @type is accepted, flag it as high priority.
  example: Cookie rememberMe=rO0ABXNy... ; java -jar ysoserial.jar URLDNS http://collaborator-host/ ; JSON probe {"@class":"com.example.Exploit"}
  expected: The application never deserializes untrusted data, or restricts it to an allowlist of safe types with integrity checking.
  severity: Critical
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A05:2025
    wstg:
    - WSTG-INJT-23
    asvs:
    - V1.5.2
    cheatsheet:
    - Deserialization_Cheat_Sheet
    cwe:
    - CWE-502
    capec:
    - CAPEC-586
