- id: WEB-INJ-012
  sheet: WEB
  category: INJ
  title: Test for code injection through dynamic code evaluation
  objective: Finds features that execute user-supplied code through eval or an include statement.
  preconditions:
  - Do not run on production.
  steps:
  - Find inputs that are used in an include, require, eval or similar execution construct.
