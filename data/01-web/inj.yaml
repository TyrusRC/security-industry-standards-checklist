- id: WEB-INJ-024
  sheet: WEB
  category: INJ
  title: Test JSON-accepting endpoints for prototype pollution
  objective: Finds recursive merge or clone code that lets attacker keys modify Object.prototype.
  preconditions:
  - Do not run on production.
  steps:
  - Find JSON endpoints that merge, clone or extend a user-supplied object into application state.
  - Submit a body containing a __proto__ or constructor.prototype key with a marker value.
  - For client-side code, submit the marker through the URL hash or query string.
  - Check whether the marker value is now present on a brand-new object.
  example: '{"name":"test","__proto__":{"polluted":"yes"}} ; URL probe: https://target/#__proto__[testpolluted]=reflected ; then evaluate ({}).testpolluted in the console'
  expected: Merge and clone functions reject or strip __proto__, constructor and prototype keys before assignment.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-INJT-22
    cheatsheet:
    - Prototype_Pollution_Prevention_Cheat_Sheet
    cwe:
    - CWE-1321
    capec: []
