  - sources/repos/Top10/2025/docs/en/A04_2025-Cryptographic_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Secrets_Management_Cheat_Sheet.md
- id: WEB-SECRET-003
  sheet: WEB
  category: SECRET
  title: Check that cryptographic operations run in an isolated security module
  objective: Find private keys that application memory or the file system can read.
  steps:
  - Ask which operations use a vault, HSM or cloud KMS.
  - Check that key material is not exported out of the module.
  - Try to read key files or memory of the application in a test system.
  - Check key access policy and audit logs of the module.
  example: aws kms describe-key --key-id alias/app; pkcs11-tool --list-objects; check for exportable flag
  expected: Key material stays in the security module. The application sends data to the module for each operation.
  severity: Low
  test_type:
  - Config Review
  - Manual
  level: ASVS L3
  refs:
    cheatsheet:
