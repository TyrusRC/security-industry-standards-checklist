- id: WEB-SECRET-001
  sheet: WEB
  category: SECRET
  title: Make sure a secrets management solution stores backend secrets with least privilege
  objective: Find secrets in code, files or environment variables and secret stores with wide access.
  steps:
  - Ask which solution stores passwords, API keys, key material and tokens (a key vault).
  - Search the code, images, CI variables and environment for plain-text secrets.
  - Review the access policy of the vault for each secret and role.
  - Check that secrets are created, accessed and destroyed through the vault and logged.
  example: trufflehog filesystem . ; docker history --no-trunc app:latest | grep -iE 'password|secret|key'; vault policy read app-policy
  expected: A vault holds all backend secrets. Access is least-privilege, logged, and no plain-text secret exists in code or images.
  severity: High
  test_type:
  - Config Review
  - Manual
  - Automated
  level: ASVS L2
  refs:
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
    asvs:
    - V13.3.1
    - V13.3.2
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-798
    - CWE-260
    - CWE-526
    - CWE-13
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A02_2025-Security_Misconfiguration.md
  - sources/repos/CheatSheetSeries/cheatsheets/Secrets_Management_Cheat_Sheet.md
- id: WEB-SECRET-002
  sheet: WEB
  category: SECRET
  title: Review the list of critical secrets and the rotation schedule
  objective: Find secrets with no rotation plan, no expiry or old age.
  steps:
  - Ask for the document that lists the critical secrets and their rotation schedule.
  - Check the age of each secret in the vault or key store.
  - Check that the secrets expire and rotate on the documented schedule.
  - Do a test rotation of one secret and check that the application keeps working.
  example: vault read -format=json secret/metadata/app | jq .data.created_time; aws secretsmanager describe-secret --secret-id app/db | jq .LastRotatedDate
  expected: Critical secrets are documented, have an expiry, and rotate on the schedule without downtime.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  level: ASVS L3
  refs:
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
    asvs:
    - V13.1.4
    - V13.3.4
    owasp_top10:
