- id: WEB-DEP-005
  sheet: WEB
  category: DEP
  title: Check integrity of downloaded code, packages and third-party scripts
  objective: Find code that the application loads or installs without a signature or integrity check.
  steps:
  - List external scripts and styles in the pages.
  - Check for Subresource Integrity attributes with the crossorigin setting.
  - Check that package installs use signatures or hashes, and the lock file is used.
  - Check that auto-update and plugin download features check signatures.
  - Check mappings of company sub-domains to external providers.
  example: curl -s https://example.com | grep -oE '<script[^>]+src=[^>]+>' | grep -v integrity; npm ci --ignore-scripts; pip install --require-hashes -r requirements.txt
  expected: External code is loaded only with integrity checks or signatures, and from trusted sources.
  severity: High
  test_type:
  - Manual
  - Automated
  refs:
    owasp_top10:
    - A08:2025
    cheatsheet:
    - Third_Party_Javascript_Management_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
