- id: WEB-DEP-004
  sheet: WEB
  category: DEP
  title: Make sure dependencies come from the expected repository (dependency confusion)
  objective: Find internal package names that a public repository can supply, and unpinned dependency sources.
  steps:
  - List the internal package names and the repository settings in npm, pip, Maven and NuGet.
  - Check that the public registry has no package with an internal name.
  - Check that scoped registries or index settings force the internal repository.
  - Check that lock files pin versions and hashes.
  example: npm config get registry; pip config list; cat .npmrc pip.conf; npm view @company/internal-lib
  expected: All dependencies, including transitive ones, resolve from the expected repository. Lock files pin them.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L3
  refs:
    asvs:
