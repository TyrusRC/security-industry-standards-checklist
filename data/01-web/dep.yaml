- id: WEB-DEP-006
  sheet: WEB
  category: DEP
  title: Make sure serialized data from clients is signed or integrity-checked
  objective: Find serialized objects, cookies and state that the client can change and the server trusts.
  steps:
  - Find serialized objects, view-state values and state cookies in requests.
  - Change a value and send the request again.
  - Replay an old value after a state change.
  - Check that a signature or MAC protects the data, and that the server does not deserialize untrusted data.
  example: 'Burp Repeater: edit the serialized value; ysoserial or marshalsec for Java test payloads in a lab'
  expected: The server rejects changed or replayed serialized data. It does not deserialize unsigned client data.
  severity: High
  test_type:
  - Manual
  - Code Review
  refs:
    owasp_top10:
    - A08:2025
    cwe:
    - CWE-502
    - CWE-565
    - CWE-784
    - CWE-345
  sources_read:
