- id: WEB-DEP-003
  sheet: WEB
  category: DEP
  title: Find components with known vulnerabilities, outdated or unsupported versions
  objective: Find components that break the update time frames or that have known CVEs.
  steps:
  - Identify component versions from banners, JavaScript comments, file names and package files.
  - Scan server-side dependencies with a software composition analysis tool.
  - Scan client-side libraries with retire.js.
  - Check support status and end-of-life dates for the OS, runtime, server and database.
  - Check each finding by hand against the real version.
  example: retire --js --outputformat json; trivy fs --scanners vuln .; osv-scanner -r .; nuclei -u https://example.com -tags cve,tech
  expected: No component is vulnerable, unsupported or past the documented update time frame.
  severity: High
  test_type:
  - Automated
  - Manual
  level: ASVS L1
  refs:
