  - sources/repos/Top10/2025/docs/en/A08_2025-Software_or_Data_Integrity_Failures.md
- id: WEB-DEP-007
  sheet: WEB
  category: DEP
  title: Review documented risky components and dangerous functionality and their protections
  objective: Find risky libraries and dangerous functions with no documentation and no isolation.
  steps:
  - Ask for the list of risky third-party components and dangerous functionality.
  - Find use of eval, system commands, deserialization, XML parsers and file conversion.
  - Check that each item has sandboxing, containerization or network-level isolation.
  - Compare the list with a code scan result.
  example: semgrep --config p/default ./src; grep -rEn 'eval\(|exec\(|Runtime.getRuntime|pickle.loads' ./src
  expected: Risky components and dangerous functionality are documented and have extra protection.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: ASVS L3
  refs:
    asvs:
    - V15.1.4
    - V15.1.5
    - V15.2.5
    owasp_top10:
    - A03:2025
    cwe:
    - CWE-749
