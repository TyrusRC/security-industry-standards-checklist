- id: WEB-DEP-001
  sheet: WEB
  category: DEP
  title: Review remediation time frames for vulnerable third-party components
  objective: Find missing or weak rules for how fast vulnerable libraries and components must be updated.
  steps:
  - Ask for the documented remediation time frames by risk level.
  - Check that the rules cover libraries, frameworks, runtimes, the OS and containers.
  - Check that a process tracks advisories for the components in use, for example CVE, OSV and vendor feeds.
  - Look at the last three vulnerability fixes and compare the real time with the rule.
  example: Document review; osv-scanner -r . ; dependency-check --scan . --format JSON
  expected: Documented time frames exist, cover all component types, and past fixes met them.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L1
  refs:
    asvs:
    - V15.1.1
    owasp_top10:
    - A03:2025
    cheatsheet:
    - Vulnerable_Dependency_Management_Cheat_Sheet
    cwe:
    - CWE-1395
    - CWE-1104
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.md
- id: WEB-DEP-002
  sheet: WEB
  category: DEP
  title: Check the component inventory (SBOM) and the trust of package sources
  objective: Find unknown components, transitive dependencies and untrusted package repositories.
  steps:
  - Generate or request an SBOM for each release, with direct and transitive dependencies.
  - Compare the SBOM with the lock files and the deployed artifact.
  - Check that all components come from defined, trusted and maintained repositories.
  - Check that client-side libraries are in the inventory.
  example: syft dir:. -o cyclonedx-json > sbom.json; cdxgen -o bom.json .; grype sbom:sbom.json
  expected: A current SBOM covers all components and their sources. Every component comes from a trusted repository.
  severity: Medium
  test_type:
  - Manual
  - Automated
  level: ASVS L2
  refs:
    asvs:
    - V15.1.2
    owasp_top10:
    - A03:2025
    cheatsheet:
    - Dependency_Graph_SBOM_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-1357
    - CWE-1104
  sources_read:
