- id: WEB-AUTHN-016
  sheet: WEB
  category: AUTHN
  title: Check that one IdP cannot spoof a user of another IdP
  objective: Finds account linking by email or user ID alone, which lets a second IdP take over an account.
  preconditions:
  - Two IdPs or a test IdP that you control.
  steps:
  - List the IdPs that the application supports.
  - Create an account at one IdP with the same email and user ID as a victim of another IdP.
  - Log in to the application through that IdP.
  - Examine if the application links the session to the victim account.
  - 'Read the code for the account key: it must be IdP ID plus user ID.'
  example: Register user victim@corp.test at a test IdP; log in with 'Login with IdP-B' and compare the resulting account ID.
  expected: The application identifies users by IdP ID plus the IdP user ID. It does not link accounts by email or name alone.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V6.8.1
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
