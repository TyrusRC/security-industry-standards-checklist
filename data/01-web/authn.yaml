- id: WEB-AUTHN-009
  sheet: WEB
  category: AUTHN
  title: Try to bypass the authentication schema
  objective: Finds protected pages that can be reached by parameter changes, forced browsing or injection in the login.
  preconditions:
  - Do not run on production without owner approval.
  steps:
  - Request each protected page without a session.
  - Change values such as authenticated=no to authenticated=yes in URLs, cookies and hidden fields.
  - Skip the second step of a multi-step login and request the final page.
  - Try SQL injection payloads in the user and password fields.
  - Look at the session ID values for predictable patterns.
  example: curl -i 'https://target/page.asp?authenticated=yes' ; sqlmap -u https://target/login --data 'user=a&pass=b' --level 3 --batch
  expected: Protected pages need a valid server-side session. Client-side values do not change the result. Login input is not injectable.
  severity: Critical
  test_type: Manual
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-04
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-287
    - CWE-288
    - CWE-302
    - CWE-306
    - CWE-603
    capec:
    - CAPEC-115
