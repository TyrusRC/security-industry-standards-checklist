- id: WEB-AUTHN-022
  sheet: WEB
  category: AUTHN
  title: Check SAML RelayState, IdP-initiated login and logout
  objective: Finds open redirects, login CSRF and unsigned logout in SAML flows.
  steps:
  - Change RelayState to an external URL and log in.
  - Send an unsolicited response without an earlier request.
  - Log out at the service provider. Look at the LogoutRequest signature.
  - Use the old session cookie after logout.
  example: 'Burp Repeater: POST /saml/acs RelayState=https://evil.example/ ; replay the session cookie after SLO.'
  expected: RelayState allows only expected values. Unsolicited responses are accepted only if this is documented. Logout ends the session and uses signed messages.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-12
    cheatsheet:
    - SAML_Security_Cheat_Sheet
    cwe:
    - CWE-601
    - CWE-352
