- id: WEB-AUTHN-013
  sheet: WEB
  category: AUTHN
  title: Check that users get notice of suspicious sign-in events
  objective: Finds missing alerts for unusual or partly successful sign-in events.
  preconditions:
  - Test mailbox.
  steps:
  - Sign in from a new device and a new location.
  - Fail the second factor with the correct password.
  - Sign in successfully after several failures.
  - 'Look at the notices: message, email and recent-login page.'
  example: Log in with curl using a different User-Agent and X-Forwarded-For through a VPN; then read the mailbox of the test user.
  expected: The user gets a notice for each suspicious event with time, device and place. The notice does not leak data of other users.
  severity: Low
  test_type: Manual
  level: ASVS L3
  refs:
    owasp_top10:
    - A07:2025
    asvs:
