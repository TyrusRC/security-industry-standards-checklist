  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/SAML_Security_Cheat_Sheet.md
- id: WEB-AUTHN-024
  sheet: WEB
  category: AUTHN
  title: Check the challenge nonce of cryptographic authentication
  objective: Finds short or repeated challenge nonces in WebAuthn or certificate authentication.
  steps:
  - Start 1000 login challenges and save each nonce.
  - Look at the nonce length. It must be at least 64 bits.
  - Look for repeated values.
  - Make sure the server stores and checks the challenge for one login only.
  example: for i in $(seq 1000); do curl -s https://target/webauthn/challenge | jq -r .challenge; done | sort | uniq -d
  expected: Each challenge is at least 64 bits long, unique, and valid for one login only.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V6.7.2
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-330
    - CWE-294
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
- id: WEB-AUTHN-025
  sheet: WEB
  category: AUTHN
  title: Check that authentication events are logged and alerted
  objective: Finds missing logs for failed logins and lockouts, which hides attacks.
  steps:
  - Cause failed logins, a lockout and a password reset.
  - Read the application and security logs.
  - Make sure the log has time, source, account and result.
  - Make sure passwords and tokens are not in the log.
  - Check that repeated failures raise an alert.
  example: grep -iE 'login failed|locked' /var/log/app/auth.log | tail ; grep -i 'password=' /var/log/app/*.log
  expected: All failed logins, lockouts and resets are logged and reviewed. Alerts exist for attack patterns. Logs hold no secrets.
  severity: Low
  test_type: Config Review
