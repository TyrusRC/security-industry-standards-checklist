- id: WEB-AUTHN-010
  sheet: WEB
  category: AUTHN
  title: Check password comparison for type and length flaws
  objective: Finds loose hash comparison, magic hashes and logins that accept a wrong password of the right length.
  preconditions:
  - Source code access for the code part.
  steps:
  - Log in with a wrong password that has the same length as the real one.
  - Set a password whose hash starts with 0e and digits. Log in with a different 0e hash password.
  - In PHP code, look for == in hash and token checks.
  - Send a wrong-type value, such as true or an array, in place of the password or token.
  example: 'Test hashes: md5(''240610708'') and md5(''QLTHNDT'') both start with 0e; try each as the password for an account that holds the other. grep -rn ''== md5\|== sha1'' src/'
  expected: The application accepts only the exact password. It uses strict, constant-time comparison with fixed types.
  severity: High
  test_type: Code Review
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-04
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-303
    - CWE-1287
    - CWE-208
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/04-Bypassing_Authentication_Schema.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A07_2025-Authentication_Failures.md
  notes: Magic hash test works only when the code compares hashes with loose equality. Same-length test needs one valid account.
- id: WEB-AUTHN-011
  sheet: WEB
  category: AUTHN
  title: Check the remember me function and stored credentials
  objective: Finds remember me tokens or stored credentials that stay valid too long or can be read.
  steps:
  - Log in with remember me turned on.
  - Look in cookies, localStorage and sessionStorage for passwords or encoded credentials.
  - Decode every stored value and look for user names or passwords.
  - Make sure the token expires and the server can revoke it.
  - Check that login forms can not be framed or auto-submitted from another site.
  example: Browser DevTools > Application tab; echo '<value>' | base64 -d ; curl -I https://target/login | grep -i x-frame-options
  expected: The browser holds no password or reversible credential. The remember me token is random, expires, and the server can revoke it.
  severity: Medium
  test_type: Manual
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-05
    cheatsheet:
    - Session_Management_Cheat_Sheet
