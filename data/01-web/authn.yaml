- id: WEB-AUTHN-001
  sheet: WEB
  category: AUTHN
  title: Look for default and vendor accounts and passwords
  objective: Finds default administrator accounts and known vendor passwords that still work.
  preconditions:
  - Do not run on production without owner approval.
  steps:
  - Identify the software and version from the response headers and login page.
  - Find the vendor default accounts in the manual and in default-credential lists.
  - Try each default pair on every login page, including admin consoles.
  - Try admin, root, sa and system with blank, admin and password values.
  - Make sure the build does not contain hard-coded or test accounts.
  example: nuclei -u https://target -tags default-login ; hydra -C default-creds.txt target https-post-form '/login:user=^USER^&pass=^PASS^:F=Invalid'
  expected: No default, hard-coded or test account can log in. Default accounts are removed or disabled before production.
  severity: Critical
  test_type: Automated
  level: ASVS L1
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-02
    asvs:
    - V6.3.2
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-1392
    - CWE-1393
    - CWE-798
    - CWE-259
    - CWE-258
    capec:
    - CAPEC-70
