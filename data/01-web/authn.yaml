- id: WEB-AUTHN-012
  sheet: WEB
  category: AUTHN
  title: Check that the browser cache does not keep private pages
  objective: Finds sensitive pages that the browser stores or shows again after logout.
  steps:
  - Log in and open pages with sensitive data.
  - Log out and press the Back button.
  - Look at the Cache-Control header on every authenticated response.
  - Search the browser cache directory for sensitive values.
  - Repeat with a mobile User-Agent.
  example: curl -sI -b 'session=<id>' https://target/account | grep -i cache-control ; ZAP passive scan rule 'Re-examine Cache-control Directives'
  expected: 'Authenticated responses with sensitive data have Cache-Control: no-store. The Back button after logout does not show private data.'
  severity: Low
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-06
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-525
