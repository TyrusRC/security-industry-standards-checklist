- id: WEB-AUTHN-017
  sheet: WEB
  category: AUTHN
  title: Check that SAML and JWT assertion signatures are required
  objective: Finds assertions that the application accepts without a valid signature.
  steps:
  - Decode the SAMLResponse or the ID token and note the signed parts.
  - Remove the signature and send the message.
  - Change the NameID or a claim and keep the old signature.
  - Sign the message with a different key.
  - Move the signature between Response and Assertion.
  example: 'Burp SAML Raider: remove signatures, modify NameID, re-sign with a cloned self-signed certificate, then forward the SAMLResponse to /saml/acs.'
  expected: The application rejects unsigned assertions and any assertion with a bad signature. It uses only the signed data.
  severity: Critical
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-12
    asvs:
