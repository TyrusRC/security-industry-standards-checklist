- id: WEB-AUTHN-019
  sheet: WEB
  category: AUTHN
  title: Check that the application uses IdP authentication strength data
  objective: Finds functions that need strong or recent login but do not check what the IdP reports.
  steps:
  - Find functions that need MFA or a recent login.
  - Log in with a weak method at the IdP.
  - Call those functions and look at the response.
  - Read the code for checks of the acr, amr and auth_time claims.
  example: jwt_tool <id_token> to read acr, amr, auth_time; then call the sensitive endpoint with a session from a password-only login.
  expected: The application checks the strength, method and age of the login from the IdP data before it allows the function.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
