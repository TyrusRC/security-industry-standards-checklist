- id: WEB-AUTHN-021
  sheet: WEB
  category: AUTHN
  title: Test SAML signature wrapping and NameID parsing
  objective: Finds parser flaws that let an attacker place unsigned identity data next to a valid signature.
  steps:
  - Copy the signed Assertion to a new place and add a changed assertion.
  - Use a NameID such as user@example.com plus an XML comment and .attacker.com.
  - Add a second Assertion for another user.
  - Check if attributes can set roles or groups without a limit.
  - Look for XSLT in the signature transforms.
  example: 'SAML Raider XSW 1-8 attacks; NameID test value: user@example.com<!---->.attacker.com'
  expected: The service provider reads identity only from the element whose signature it checked. Comments and extra assertions have no effect. Role attributes are limited.
  severity: Critical
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-12
    cheatsheet:
    - SAML_Security_Cheat_Sheet
    cwe:
    - CWE-347
    - CWE-345
