- id: WEB-AUTHN-018
  sheet: WEB
  category: AUTHN
  title: Check that SAML assertions cannot be replayed
  objective: Finds assertions that the service provider accepts more than once.
  steps:
  - Log in through SAML and capture the SAMLResponse.
  - Log out. Send the same SAMLResponse again.
  - Send it twice inside the validity time.
  - 'Check the Conditions: NotOnOrAfter and OneTimeUse.'
  example: curl -i -X POST https://target/saml/acs --data-urlencode 'SAMLResponse=<captured>' -d 'RelayState=/' (send twice).
  expected: The service provider accepts each assertion ID only once in its validity period and rejects repeats, also after logout.
  severity: High
  test_type: Manual
  level: ASVS L2
