- id: WEB-AUTHN-020
  sheet: WEB
  category: AUTHN
  title: 'Check SAML conditions: audience, recipient, issuer and time'
  objective: Finds service providers that do not enforce the Conditions and Subject data of an assertion.
  steps:
  - Change the Audience to another service provider.
  - Use the assertion before NotBefore and after NotOnOrAfter.
  - Change the Recipient so it does not match the ACS URL.
  - Send a response for an InResponseTo ID that this service did not issue.
  - Send a response with a different Issuer.
  example: 'SAML Raider: edit Conditions/AudienceRestriction and SubjectConfirmationData/@Recipient, re-sign with the test IdP key, post to the ACS endpoint.'
  expected: The service provider rejects each changed or expired assertion. It checks Audience, Recipient, Issuer, validity and InResponseTo.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-12
    cheatsheet:
    - SAML_Security_Cheat_Sheet
    cwe:
    - CWE-345
    - CWE-347
    - CWE-294
