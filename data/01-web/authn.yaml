- id: WEB-AUTHN-004
  sheet: WEB
  category: AUTHN
  title: Try to bypass the CAPTCHA on login and recovery
  objective: Finds CAPTCHA checks that the server does not enforce, so automated guessing still works.
  steps:
  - Send the login request with the CAPTCHA parameter removed.
  - Send the request with a wrong CAPTCHA value and with an empty value.
  - Send the same solved CAPTCHA response in two requests.
  - Clear the cookies and see if the CAPTCHA is skipped.
  - Look in the alt text, file name and hidden fields for the answer.
  - Try the mobile or API endpoint for the same function.
  example: 'Burp Repeater: delete the ''g-recaptcha-response'' parameter, then replay an old valid token; compare the status codes.'
  expected: The server checks every CAPTCHA response, accepts it once, and rejects missing or wrong values. All endpoints enforce it. The CAPTCHA does not replace the lockout.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-03
    cheatsheet:
    - Authentication_Cheat_Sheet
    - Credential_Stuffing_Prevention_Cheat_Sheet
    cwe:
    - CWE-307
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/03-Weak_Lock_Out_Mechanism.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.md
- id: WEB-AUTHN-005
  sheet: WEB
  category: AUTHN
  title: Check that the account unlock process is not weak
  objective: Finds unlock links or answers that an attacker can guess or reuse to unlock an account.
  preconditions:
  - Test account that you can lock.
  - Do not run on production.
  steps:
  - Lock a test account. Start the unlock process.
  - 'Examine the unlock link or code: length, randomness and lifetime.'
  - Use the unlock link twice.
  - Try to unlock another account by changing the user parameter.
  - Make sure the unlock process has its own rate limit.
  example: 'Burp Repeater: GET /unlock?user=victim&token=<token>, replay twice, then change user=other.'
  expected: The unlock token is random, single use and short lived. An attacker cannot unlock an account that is not theirs. The process is rate limited.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-03
    cheatsheet:
    - Forgot_Password_Cheat_Sheet
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-640
    - CWE-645
    - CWE-330
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/03-Weak_Lock_Out_Mechanism.md
  - sources/repos/CheatSheetSeries/cheatsheets/Forgot_Password_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
- id: WEB-AUTHN-006
  sheet: WEB
  category: AUTHN
  title: Read the documentation for anti-automation controls
  objective: Finds missing or incomplete documentation of rate limit, anti-automation and adaptive controls.
  preconditions:
  - Access to the security documentation and configuration.
  steps:
  - Get the security documentation for authentication.
  - Find the rules for rate limit, lockout and adaptive response against credential stuffing and brute force.
  - Make sure the document gives the thresholds and configuration values.
  - Make sure the document explains how malicious account lockout is prevented.
  - Compare the documented values with the real configuration.
  example: Review the security design document and the gateway or WAF rate-limit configuration; record the threshold, window and lockout time.
  expected: The documentation defines the controls, their values, and how they prevent malicious lockout. The real configuration matches it.
  severity: Low
  test_type: Config Review
  level: ASVS L1
  refs:
    owasp_top10:
    - A07:2025
    asvs:
    - V6.1.1
    cheatsheet:
    - Credential_Stuffing_Prevention_Cheat_Sheet
    cwe:
    - CWE-307
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A07_2025-Authentication_Failures.md
- id: WEB-AUTHN-007
  sheet: WEB
  category: AUTHN
  title: Read the documentation of all authentication pathways
  objective: Finds authentication pathways that are not documented with their required strength.
  preconditions:
  - Access to the security documentation.
  steps:
  - 'List every way to log in: web form, API, mobile, SSO, support channels and admin consoles.'
  - Get the documentation for authentication.
  - Make sure each pathway is in the document with its controls and strength.
  - Make sure the document says the controls must be the same on all pathways.
  example: 'Build a table: pathway, factors, rate limit, MFA, session type. Compare to the design document.'
  expected: All authentication pathways are documented together with the controls and strength that every pathway must enforce.
  severity: Low
  test_type: Config Review
  level: ASVS L2
  refs:
    asvs:
    - V6.1.3
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-288
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
- id: WEB-AUTHN-008
  sheet: WEB
  category: AUTHN
  title: Look for undocumented or weaker authentication pathways
  objective: Finds alternative channels or endpoints with weaker authentication than the main login.
  steps:
  - 'Find other channels: mobile site, old API versions, staging hosts, partner sites and call centre.'
  - Read robots.txt, sitemap.xml and the help pages for links to them.
  - Try the same account on each channel.
  - Compare lockout, MFA, password reset and TLS on each channel with the main login.
  - Send the same login to each API version and look for missing checks.
  example: ffuf -w hosts.txt -u https://FUZZ.target/login ; curl -i https://m.target/myaccount/ ; curl -i https://target/api/v1/login vs /api/v2/login
  expected: Every channel and API version enforces the same authentication strength. No undocumented pathway exists.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-10
    asvs:
    - V6.3.4
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-288
    - CWE-424
    - CWE-306
    capec:
    - CAPEC-115
