  - sources/repos/Top10/2025/docs/en/A07_2025-Authentication_Failures.md
- id: WEB-AUTHN-003
  sheet: WEB
  category: AUTHN
  title: Test distributed brute force, password spray and credential stuffing
  objective: Finds protection that counts failures only per IP address and so misses spread-out attacks.
  preconditions:
  - Only use accounts that you are allowed to test.
  - Do not run on production.
  steps:
  - Prepare a list of known test user and password pairs and a list of common passwords.
  - Send each pair from a different source IP address using proxies or VPN endpoints.
  - Send one common password against many test accounts (password spray).
  - Look for account lockout, CAPTCHA, delay or MFA step-up in the responses.
  - Check if the application warns the user or the administrator about the attack.
  example: ffuf -w pairs.txt:USERPASS -X POST -d 'username=USERPASS&password=PASS' -u https://target/login -x socks5://127.0.0.1:9050 ; Burp Intruder cluster bomb for the spray case.
  expected: The application detects attacks that span many IP addresses and accounts. It applies account-based controls such as step-up, delay or block, and it raises an alert.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-03
    asvs:
    - V6.3.1
    cheatsheet:
    - Credential_Stuffing_Prevention_Cheat_Sheet
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-307
    - CWE-521
    capec:
    - CAPEC-600
    - CAPEC-565
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
