- id: WEB-AUTHN-023
  sheet: WEB
  category: AUTHN
  title: Check protection of certificates used for authentication assertions
  objective: Finds trusted certificates that an attacker can change.
  preconditions:
  - Server or configuration access.
  steps:
  - Find where the service stores the IdP or device certificates.
  - Look at the file and database permissions.
  - Try to change a certificate with a low-privilege account.
  - Check for integrity protection, such as a signed store or read-only mount.
  example: ls -l /etc/app/trust/ ; icacls C:\app\trust ; review the keystore ACL and backup access.
  expected: Only privileged administrators can change trusted certificates. Changes are detected or logged.
  severity: High
  test_type: Config Review
  level: ASVS L3
  refs:
    asvs:
    - V6.7.1
    cheatsheet:
    - SAML_Security_Cheat_Sheet
    cwe:
    - CWE-345
