- id: WEB-AUTHN-015
  sheet: WEB
  category: AUTHN
  title: Check notices after changes to authentication details
  objective: Finds missing notices after password reset or email and user name change.
  preconditions:
  - Test mailbox.
  steps:
  - Reset the password of a test user.
  - Change the email address and the user name.
  - Read the messages that the old and the new address receive.
