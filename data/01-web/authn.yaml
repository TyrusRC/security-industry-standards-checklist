- id: WEB-AUTHN-002
  sheet: WEB
  category: AUTHN
  title: Check the account lockout and throttle on failed logins
  objective: Finds missing or weak lockout that allows online password guessing.
  preconditions:
  - A test account that you can afford to lock.
  - Do not run on production.
  steps:
  - Send three wrong passwords. Then send the correct password and note the result.
  - Repeat with four and five wrong passwords and note when the account locks.
  - Wait five, ten and fifteen minutes. Send the correct password after each wait.
  - 'Look at the failed-login counter: make sure it follows the account and not only the IP address.'
  - If the lockout is client side, turn off JavaScript and send the requests with a proxy.
  - Compare with the lockout rule in the security documentation.
  example: 'Burp Intruder, null payload x 10, resource pool: 1 concurrent request, delay 2000 ms, POST /login with the test user and a wrong password; then send the correct password.'
  expected: The application locks or delays the account after a small number of failures, as documented. The counter follows the account. A valid user is not locked out for long.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-03
    asvs:
    - V6.3.1
    cheatsheet:
    - Authentication_Cheat_Sheet
    - Credential_Stuffing_Prevention_Cheat_Sheet
    cwe:
    - CWE-307
    - CWE-799
    - CWE-645
    capec:
    - CAPEC-112
    - CAPEC-49
    - CAPEC-16
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/03-Weak_Lock_Out_Mechanism.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
