- id: WEB-CRYPTO-018
  sheet: WEB
  category: CRYPTO
  title: Make sure no hard-coded, default or checked-in cryptographic keys exist
  objective: Find keys in source code, repositories, images or configuration that an attacker can read.
  steps:
  - Scan the repository and its history with trufflehog or gitleaks.
  - Search for PEM headers, hex keys and JWT secrets in code, configs and images.
  - Check for the default keys of frameworks and products.
  - Check that each environment uses different keys.
  example: trufflehog git file://. --only-verified; gitleaks detect -v; grep -rEn 'BEGIN (RSA |EC )?PRIVATE KEY' .
  expected: No cryptographic key is in source, history, images or default configuration. Each environment has its own keys.
  severity: High
  test_type:
  - Automated
  - Code Review
  refs:
    cheatsheet:
