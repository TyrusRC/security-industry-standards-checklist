- id: WEB-CRYPTO-004
  sheet: WEB
  category: CRYPTO
  title: Check crypto agility of algorithms, key lengths and keys
  objective: Find hard-coded algorithms that the owner cannot change quickly after a break.
  steps:
  - Find where algorithms, key lengths, rounds and modes are set.
  - Check that configuration or one module changes them without a code rewrite.
  - Do a test change of one algorithm in a test system.
  - Check how the application replaces keys and certificates.
  example: grep -rEn 'AES|SHA|RSA|PBKDF2' ./src | wc -l; review config for algorithm settings
  expected: The team can swap algorithms, key sizes, keys and certificates by configuration or in one place.
  severity: Low
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
  refs:
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
