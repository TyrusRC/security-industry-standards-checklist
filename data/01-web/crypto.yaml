- id: WEB-CRYPTO-005
  sheet: WEB
  category: CRYPTO
  title: Make sure all cryptographic primitives give at least 128 bits of security
  objective: Find weak keys and algorithms such as DES, RC4, 1024-bit RSA, SHA-1 and 160-bit EC.
  steps:
  - Search code and configuration for MD4, MD5, RC2, RC4, DES, Blowfish and SHA-1.
  - 'Check the key sizes: RSA 3072 bits or more, EC 256 bits or more, AES 128 bits or more.'
  - Scan the server for weak primitives in TLS and SSH.
  - Check PBKDF2 iteration counts.
  example: grep -rEniw 'md4|md5|rc2|rc4|des|3des|blowfish|sha-?1' ./src; nmap --script ssl-enum-ciphers -p443 example.com; semgrep --config p/crypto
  expected: No primitive has less than 128 bits of security. Deprecated algorithms are not used.
  severity: Medium
  test_type:
  - Code Review
  - Automated
  level: ASVS L2
  refs:
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
