- id: WEB-CRYPTO-003
  sheet: WEB
  category: CRYPTO
  title: Make sure industry-validated cryptographic libraries are used
  objective: Find custom algorithms and unvalidated implementations.
  steps:
  - Search the code for hand-written encryption, hash or random functions.
  - List the cryptographic libraries and their versions.
  - Check that each library is maintained and, where needed, validated, for example FIPS 140.
  - Check that hardware acceleration uses vendor libraries.
  example: grep -rEn 'xor|rot13|custom.*(cipher|encrypt)' ./src; npm ls | grep -i crypto; pip list | grep -i crypt
  expected: Only maintained, industry-validated libraries do cryptographic operations. No custom algorithms exist.
  severity: Medium
  test_type:
  - Code Review
  level: ASVS L2
  refs:
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
