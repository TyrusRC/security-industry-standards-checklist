  title: Make sure insecure block modes and padding schemes are not used
  objective: Find ECB mode, unauthenticated CBC and PKCS#1 v1.5 padding.
  steps:
  - Search for ECB, CBC and PKCS1Padding in the code and configuration.
  - Check that RSA encryption uses OAEP and signatures use PSS.
