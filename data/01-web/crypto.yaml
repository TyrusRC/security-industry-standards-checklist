  sheet: WEB
  category: CRYPTO
  title: Make sure only approved hash functions are used
  objective: Find MD5, SHA-1 and other banned hashes in security use, and hashes that are not collision resistant.
  steps:
  - Search the code for MD5, SHA-1 and CRC used in security checks.
  - Check signature, HMAC and KDF code for approved hashes.
