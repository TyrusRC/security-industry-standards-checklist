- id: WEB-CRYPTO-014
  sheet: WEB
  category: CRYPTO
  title: Make sure non-guessable values use a CSPRNG with 128 bits of entropy
  objective: Find tokens, IDs and secrets that come from weak random number generators.
  steps:
  - Find code that makes tokens, reset links, keys, nonces and session values.
  - Search for Math.random, rand, java.util.Random and UUID v1 or v4 used as secrets.
  - Collect 1000 tokens and look at length and patterns.
  - Check that the generator works under load and is not reseeded with weak seeds.
  example: grep -rEn 'Math\.random|java\.util\.Random|rand\(|random\.random' ./src; Burp Sequencer on the token
  expected: All security values come from a CSPRNG with at least 128 bits of entropy. Weak generators are not used.
  severity: High
