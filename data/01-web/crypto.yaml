- id: WEB-CRYPTO-011
  sheet: WEB
  category: CRYPTO
  title: Make sure nonces and initialization vectors are unique for each key
  objective: Find IV or nonce reuse and predictable IVs.
  steps:
  - Find the code that creates an IV or nonce.
  - Check that it uses a CSPRNG or a safe counter for the mode.
  - Encrypt the same plain text twice and compare the output.
  - Check that one IV is never used twice with one key.
  example: grep -rEn 'IvParameterSpec|iv\s*=|nonce\s*=' ./src; compare two encryptions of the same value
  expected: Each encryption uses a new IV or nonce that fits the mode. Equal plain texts give different cipher texts.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: ASVS L3
  refs:
    cheatsheet:
