- id: WEB-CRYPTO-001
  sheet: WEB
  category: CRYPTO
  title: Review the key management policy and the cryptographic inventory
  objective: Find missing key lifecycle rules and an incomplete list of keys, algorithms and certificates.
  steps:
  - Ask for the key management policy and compare it with NIST SP 800-57.
  - Look for rules on key generation, distribution, storage, rotation, compromise and destruction.
  - Ask for the cryptographic inventory of keys, algorithms and certificates.
  - Make sure the inventory states where each key may and may not be used.
  - Make sure each shared secret is known to at most two parties and each private key to one.
  example: 'Document review checklist: policy exists, lifecycle covered, inventory current (date), owner named, key-use limits stated.'
  expected: A current policy and inventory exist, cover the full lifecycle, and limit key sharing and use.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
    asvs:
    - V11.1.1
    - V11.1.2
    owasp_top10:
    - A04:2025
    cwe:
    - CWE-321
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A04_2025-Cryptographic_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Cryptographic_Storage_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Key_Management_Cheat_Sheet.md
- id: WEB-CRYPTO-002
  sheet: WEB
  category: CRYPTO
  title: Find all cryptography in use and check the migration plan
  objective: Find unknown cryptographic use and a missing plan for post-quantum change.
  steps:
  - Run a cryptographic discovery scan of source code and dependencies.
  - List encryption, hashing and signing operations and compare them with the inventory.
  - Ask for the documented migration plan to post-quantum algorithms.
  - Check that the plan names owners and dates.
  example: semgrep --config p/insecure-transport --config p/crypto ./src; cbomkit or CycloneDX CBOM export of the repository
  expected: Discovery covers all cryptographic use, the inventory matches, and a migration plan exists.
  severity: Low
  test_type:
  - Manual
  - Code Review
  level: ASVS L3
  refs:
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
    asvs:
    - V11.1.3
    - V11.1.4
