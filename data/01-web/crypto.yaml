- id: WEB-CRYPTO-006
  sheet: WEB
  category: CRYPTO
  title: Make sure secret comparisons and cryptographic operations are constant-time
  objective: Find short-circuit comparisons that leak secrets through timing.
  steps:
  - Find comparisons of MACs, tokens, hashes and passwords in the code.
  - Check that they use constant-time functions such as hmac.compare_digest or MessageDigest.isEqual.
  - Measure response time for guesses with a correct and a wrong prefix, many times.
  example: grep -rEn '==\s*.*(hmac|token|signature|digest)' ./src; python3 timing_probe.py https://example.com/api/verify
  expected: No timing difference exists between correct and wrong prefixes. Comparisons use constant-time functions.
  severity: Low
  test_type:
  - Code Review
  - Manual
  level: ASVS L3
  refs:
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
    asvs:
    - V11.2.4
    cwe:
    - CWE-208
