- id: WEB-CRYPTO-010
  sheet: WEB
  category: CRYPTO
  title: Make sure encrypted data is authenticated and encrypt-then-MAC is used
  objective: Find encrypted data that an attacker can change without detection.
  steps:
  - Find where encrypted data is stored or sent to the client.
  - Change bytes of the cipher text and submit it.
  - Check that the change is detected and rejected.
  - If encryption and MAC are separate, check that the MAC is made over the cipher text.
  example: python3 -c 'import base64;d=bytearray(base64.b64decode("<token>"));d[20]^=1;print(base64.b64encode(d).decode())'
  expected: Changed cipher text is rejected. Authenticated encryption or encrypt-then-MAC is used.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
