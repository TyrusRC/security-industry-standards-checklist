- id: WEB-CRYPTO-013
  sheet: WEB
  category: CRYPTO
  title: Check password hashing and key derivation settings
  objective: Find passwords that are stored with fast hashes or too few iterations, and weak password-based key derivation.
  steps:
  - Find where passwords are hashed and where keys are made from passwords.
  - Check for Argon2id, scrypt, bcrypt or PBKDF2 with current parameters.
  - Check that each hash has a random salt.
  - In a test copy, look at the hash format in the database.
  - Check that passwords are not used directly as encryption keys.
  example: 'psql -c ''select password from users limit 3''  (hash prefix: $argon2id$, $2b$, $pbkdf2); hashcat --example-hashes'
  expected: Passwords use Argon2id, scrypt, bcrypt or PBKDF2 with current work factors and unique salts.
  severity: High
