- id: WEB-CRYPTO-007
  sheet: WEB
  category: CRYPTO
  title: Make sure cryptographic failures give no padding oracle
  objective: Find decryption code that shows different errors for padding failure, which lets an attacker decrypt data.
  steps:
  - 'Find encrypted values sent to the client: cookies, hidden fields, tokens, URL parameters.'
  - Decode them and check for a block length that fits 8 or 16 bytes.
  - Change one bit of the cipher text, and the last block, and send the value back.
  - 'Compare status code, body, length and time of the three states: valid, garbled, padding error.'
  - Check in the code that the integrity check (HMAC or AEAD) runs before decryption.
  example: padbuster https://example.com/page.aspx 'Dg6W8OiWMIdVokIDH15T/A==' 16 -encoding 0; Burp Intruder on the last bytes of the value
  expected: The application gives one uniform answer for any failure. An integrity check rejects changed data before decryption.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: ASVS L3
  refs:
    cheatsheet:
    - Cryptographic_Storage_Cheat_Sheet
    - Key_Management_Cheat_Sheet
    asvs:
    - V11.2.5
    wstg:
    - WSTG-CRYP-02
    owasp_top10:
    - A04:2025
    cwe:
    - CWE-209
    - CWE-353
    capec:
    - CAPEC-463
