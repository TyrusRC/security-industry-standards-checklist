- id: WEB-VAL-012
  sheet: WEB
  category: VAL
  title: Test business-critical input against positive allowlist validation
  objective: Finds business- or security-decision input validated only by a blocklist instead of a positive allowlist.
  preconditions:
  - Do not run on production.
  steps:
  - Identify an input used to make a business or security decision, such as a discount code or role selection.
  - Submit a value outside the documented allowlist of values, patterns or ranges.
  - Submit a value that a blocklist filter was not designed to catch, such as an unexpected encoding.
  example: role=superadmin where only user and manager are valid roles; discount=%00OVERRIDE
  expected: The input is checked with positive allowlist validation against documented values, patterns or ranges, not a blocklist.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A06:2025
    wstg:
    - WSTG-BUSL-01
    asvs:
    - V2.2.1
    cheatsheet:
    - Input_Validation_Cheat_Sheet
    cwe:
    - CWE-20
    - CWE-184
    capec:
    - CAPEC-137
