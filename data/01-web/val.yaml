- id: WEB-VAL-013
  sheet: WEB
  category: VAL
  title: Test that client-side validation is enforced again server-side
  objective: Finds input validation that exists only in client-side JavaScript and can be bypassed with a direct request.
  preconditions:
  - Do not run on production.
  steps:
  - Identify a field with client-side validation, such as a maximum length or regex pattern.
  - Disable JavaScript or use a proxy to submit a request that violates the client-side rule directly to the server.
  - Observe whether the server accepts the value that the client would have rejected.
  example: 'Burp Repeater: resend the request with an out-of-range or malformed value, bypassing the browser form entirely'
  expected: The server enforces the same validation rule independently of the client, rejecting the bypassed value.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    wstg:
    - WSTG-BUSL-01
    asvs:
    - V2.2.2
    cheatsheet:
    - Input_Validation_Cheat_Sheet
    cwe:
    - CWE-602
    capec:
    - CAPEC-137
