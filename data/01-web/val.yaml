- id: WEB-VAL-014
  sheet: WEB
  category: VAL
  title: Test related input fields for combined-value consistency
  objective: Finds endpoints that accept individually valid fields whose combination is logically inconsistent.
  preconditions:
  - Do not run on production.
  steps:
  - Identify fields whose combination must be logically consistent, such as a start date and an end date.
  - Submit a combination that is individually valid for each field but inconsistent together.
  - Observe whether the application accepts or rejects the inconsistent combination.
  example: start_date=2026-05-01&end_date=2026-01-01 ; discount=50&subtotal=10 making the discount exceed the subtotal
  expected: The server validates that combinations of related fields are logically consistent and rejects the inconsistent request.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-BUSL-01
    asvs:
    - V2.2.3
    cheatsheet:
