- id: WEB-VAL-011
  sheet: WEB
  category: VAL
  title: Review documentation for business logic limits
  objective: Confirms per-user and global business logic limits are documented before they are tested.
  steps:
  - Request the application design documentation for business logic limits, such as maximum order size or rate limits.
  - Check whether both per-user and global limits are defined for each relevant function.
  example: Review documentation for a stated per-user and global limit on a function, such as daily transfer amount
  expected: Documentation defines both per-user and global business logic limits for every relevant function.
  severity: Info
  test_type: Config Review
  level: ASVS L2
