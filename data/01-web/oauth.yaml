  - sources/repos/CheatSheetSeries/cheatsheets/OAuth2_Cheat_Sheet.md
- id: WEB-OAUTH-002
  sheet: WEB
  category: OAUTH
  title: Check that the client binds responses to its own request
  objective: Finds clients that accept a code or ID token from a flow they did not start.
  steps:
  - Start a login and save state, nonce and code_verifier.
  - Check that the values are random and tied to the browser session.
  - Send a callback with a code from another session.
  - Send a callback with a missing or wrong state.
  example: 'Burp: replay GET /callback?code=<code of session A>&state=<state of A> in the session of B.'
  expected: The client accepts a response only for a flow started by the same browser session. Values are unpredictable.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.1.2
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-352
    - CWE-330
    capec:
    - CAPEC-62
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/05-Authorization/05-OAuth_Weaknesses.md
