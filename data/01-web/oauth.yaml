- id: WEB-OAUTH-003
  sheet: WEB
  category: OAUTH
  title: Check the state parameter and PKCE in the client
  objective: Finds clients with no protection against forged callbacks.
  steps:
  - Capture the authorization request.
  - Check for PKCE with S256 or a one-time state value.
  - Send the callback without state and with a changed state.
  - Test the consent page in the same way.
  example: 'Burp Repeater: GET /callback?code=<code> without the state parameter.'
  expected: The client uses PKCE or checks state. Callbacks with a missing or changed value are rejected.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.2.1
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-352
    capec:
    - CAPEC-62
