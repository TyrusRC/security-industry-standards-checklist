- id: WEB-OAUTH-027
  sheet: WEB
  category: OAUTH
  title: Check OIDC back-channel logout token handling
  objective: Finds logout flows that allow forced logout or token confusion.
  steps:
  - Send a logout token with wrong typ.
  - Send one with a nonce claim, and one without the events claim.
  - Check expiry and signature checks.
  example: curl -X POST https://client.example.com/backchannel-logout -d logout_token=<test token>
  expected: The client accepts only logout+jwt tokens with the correct event claim, no nonce and a short life.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V10.5.5
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-345
    - CWE-347
