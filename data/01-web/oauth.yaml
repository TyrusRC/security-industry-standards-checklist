- id: WEB-OAUTH-006
  sheet: WEB
  category: OAUTH
  title: Check that the resource server checks the audience of access tokens
  objective: Finds resource servers that accept tokens meant for other services.
  steps:
  - Get an access token for service A.
  - Send it to service B.
  - Check the aud claim or introspection result in the code.
  example: 'curl -H ''Authorization: Bearer <token for A>'' https://service-b/api/data'
  expected: A resource server accepts only tokens meant for itself.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    asvs:
    - V10.3.1
    cheatsheet:
    - OAuth2_Cheat_Sheet
    - JSON_Web_Token_Cheat_Sheet
    cwe:
    - CWE-345
    - CWE-863
