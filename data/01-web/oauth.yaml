- id: WEB-OAUTH-029
  sheet: WEB
  category: OAUTH
  title: Check forced logout protection at the OpenID Provider
  objective: Finds logout endpoints that end sessions without user consent.
  steps:
  - Open the logout URL from another site with no id_token_hint.
  - Check for a confirmation page.
  - Check the checks of id_token_hint and the redirect URI.
  example: Open https://op.example.com/logout from a cross-site page.
  expected: The provider asks the user to confirm or validates the logout request parameters.
  severity: Low
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V10.6.2
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
