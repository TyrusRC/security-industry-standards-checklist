- id: WEB-OAUTH-005
  sheet: WEB
  category: OAUTH
  title: Check that the client asks only for needed scopes
  objective: Finds clients that request more permission than they use.
  steps:
  - Capture the authorization request.
  - List the scope values and other authorization parameters.
  - Compare them with the features of the client.
  example: 'Burp history: filter for /authorize and read the scope parameter.'
  expected: The client requests only the scopes and parameters its features need.
  severity: Low
  test_type: Manual
  level: ASVS L3
