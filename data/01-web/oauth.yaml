  - sources/repos/CheatSheetSeries/cheatsheets/OAuth2_Cheat_Sheet.md
- id: WEB-OAUTH-023
  sheet: WEB
  category: OAUTH
  title: Check strong client authentication
  objective: Finds clients that use shared secrets where stronger methods are needed.
  steps:
  - Read the client authentication method.
  - Check for tls_client_auth, self_signed_tls_client_auth or private_key_jwt.
  - Check that the client is confidential.
  example: curl https://as.example.com/.well-known/openid-configuration | jq .token_endpoint_auth_methods_supported
  expected: Clients use public-key based authentication that resists replay.
  severity: Medium
  test_type: Config Review
  level: ASVS L3
  refs:
    asvs:
    - V10.4.16
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-287
