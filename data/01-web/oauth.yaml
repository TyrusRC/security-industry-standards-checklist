- id: WEB-OAUTH-008
  sheet: WEB
  category: OAUTH
  title: Check that users are identified by issuer and subject
  objective: Finds APIs that identify users by claims that can be reused or reassigned.
  steps:
  - Read the claim that the API uses to find the user.
  - Check that it uses iss and sub together.
  - Check that email or name are not the key.
  example: grep -rn "claims\[.email.\]\|preferred_username" src/
  expected: The API identifies users by iss plus sub, not by changeable claims.
  severity: Medium
  test_type: Code Review
  level: ASVS L2
  refs:
    asvs:
    - V10.3.3
    cheatsheet:
    - OAuth2_Cheat_Sheet
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-290
    - CWE-639
  sources_read:
