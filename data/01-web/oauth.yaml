- id: WEB-OAUTH-032
  sheet: WEB
  category: OAUTH
  title: Check for exposed client secrets and token storage in the client
  objective: Finds client secrets in public clients and tokens kept in local storage.
  steps:
  - Search the client code for client_secret.
  - Look at the authorization traffic for secrets.
  - Look at where tokens are stored.
  - For implicit flows, check for access token injection.
  example: 'DevTools Debugger: Ctrl+Shift+F for client_secret; Application tab for tokens.'
  expected: Public clients have no secret. Tokens are not stored in local storage. Injected tokens are rejected.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHZ-05
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-798
    - CWE-922
