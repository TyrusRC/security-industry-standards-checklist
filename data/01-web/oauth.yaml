- id: WEB-OAUTH-031
  sheet: WEB
  category: OAUTH
  title: Check the types of grant in use and leaks of OAuth credentials
  objective: Finds deprecated grants and tokens or codes exposed in URLs and Referer.
  steps:
  - Find the grant type of each flow from the token and authorize requests.
  - Look for tokens or codes in URLs.
  - Look at the Referer header sent to other sites.
  - Check for the Referrer-Policy header.
  example: 'ZAP history: search the Referer header for code= and access_token=.'
  expected: Public clients use code with PKCE. Secrets are not in URLs. Referrer-Policy limits leaks.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHZ-05
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-598
    - CWE-200
