- id: WEB-OAUTH-026
  sheet: WEB
  category: OAUTH
  title: Check authorization server metadata handling
  objective: Finds clients that trust metadata with another issuer.
  preconditions:
  - Test environment.
  steps:
  - Read the pre-configured issuer URL.
  - Serve test metadata with another issuer URL.
  - Check that the client rejects it.
  example: Point the discovery URL to a test server with a different issuer value.
  expected: The client rejects metadata when the issuer is not exactly the configured one.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V10.5.3
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
