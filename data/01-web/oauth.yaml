- id: WEB-OAUTH-010
  sheet: WEB
  category: OAUTH
  title: Check sender-constrained tokens
  objective: Finds bearer tokens that anyone can replay when stolen.
  steps:
  - Check if access tokens are bound by DPoP or mTLS.
  - Send a valid token from another client without the proof.
  - Check that the server rejects it.
  example: 'curl -H ''Authorization: DPoP <token>'' https://target/api/me without the DPoP header.'
  expected: A token works only with the proof of the client that it is bound to.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V10.3.5
    - V10.4.14
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-294
    - CWE-522
