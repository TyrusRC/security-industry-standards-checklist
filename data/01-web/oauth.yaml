- id: WEB-OAUTH-016
  sheet: WEB
  category: OAUTH
  title: Check dynamic client registration controls
  objective: Finds open registration that allows malicious clients.
  preconditions:
  - Test environment.
  steps:
  - Find the registration endpoint in the metadata.
  - Register a client without authentication in a test environment.
  - Check the validation of redirect URIs and metadata.
  - Check the consent warning for unknown clients.
  example: curl https://as.example.com/.well-known/openid-configuration | jq .registration_endpoint
  expected: Open registration validates client data, asks the user for consent and warns about untrusted clients.
  severity: Medium
  test_type: Manual
