- id: WEB-OAUTH-015
  sheet: WEB
  category: OAUTH
  title: Check that PKCE is required and cannot be downgraded
  objective: Finds servers that accept codes without a valid code challenge.
  steps:
  - Send the authorization request without code_challenge.
  - Send it with an empty value and with method plain.
  - Send the token request without code_verifier and with a wrong one.
  - Use a valid verifier from another code.
  example: 'ZAP: remove code_challenge and code_challenge_method from GET /authorize.'
  expected: The server requires S256 PKCE and checks the verifier. All downgrade forms fail.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.4.6
