- id: WEB-OAUTH-024
  sheet: WEB
  category: OAUTH
  title: Check the ID token nonce
  objective: Finds clients that accept replayed ID tokens.
  steps:
  - Start a login and note the nonce.
  - Replay an old ID token in a new login.
  - Check that the client compares the nonce claim.
  example: jwt_tool <ID token> to read nonce; replay it at /callback.
  expected: The client rejects an ID token whose nonce does not match the request.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V10.5.1
    cheatsheet:
    - Authentication_Cheat_Sheet
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-294
    capec:
    - CAPEC-60
  sources_read:
