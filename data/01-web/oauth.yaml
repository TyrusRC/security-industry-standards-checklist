- id: WEB-OAUTH-012
  sheet: WEB
  category: OAUTH
  title: Check that authorization codes work once and live shortly
  objective: Finds codes that can be replayed or that live too long.
  steps:
  - Complete a flow and save the code.
  - Exchange the code twice.
  - Check that the second try fails and that issued tokens are revoked.
  - Exchange a code after 10 minutes.
  - Try a code with another client_id, user or redirect_uri.
  example: curl -X POST https://as.example.com/oauth/token -d grant_type=authorization_code -d code=<code> -d client_id=c -d redirect_uri=<uri> (twice)
  expected: A code works once, lives 10 minutes or less, and is bound to client, user and redirect URI. Reuse revokes the tokens.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.4.2
    - V10.4.3
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-294
    - CWE-324
    capec:
    - CAPEC-60
  sources_read:
