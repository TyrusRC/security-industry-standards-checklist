- id: WEB-OAUTH-019
  sheet: WEB
  category: OAUTH
  title: Check client authentication at the back channel
  objective: Finds token, PAR and revocation endpoints that work without client authentication.
  steps:
  - Send a token request for a confidential client without credentials.
  - Do the same for the PAR and revocation endpoints.
  - Check that the client secret is not in client code.
  example: curl -X POST https://as.example.com/oauth/token -d grant_type=client_credentials -d client_id=c
  expected: Confidential clients must authenticate at every back-channel endpoint.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.4.10
