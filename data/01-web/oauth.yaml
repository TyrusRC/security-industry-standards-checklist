- id: WEB-OAUTH-001
  sheet: WEB
  category: OAUTH
  title: Check that tokens go only to components that need them
  objective: Finds access and refresh tokens exposed to browser code or other components.
  steps:
  - Map which components hold access and refresh tokens.
  - Look in browser storage and page scripts for tokens.
  - For browser apps, check whether a back-end-for-frontend keeps the tokens.
  example: 'DevTools > Application > Storage; Burp: search the history for access_token and refresh_token.'
  expected: Tokens are available only to the components that need them. Browser code does not hold refresh tokens.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.1.1
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-922
    - CWE-200
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/05-Authorization/05-OAuth_Weaknesses.md
