- id: WEB-OAUTH-014
  sheet: WEB
  category: OAUTH
  title: Check refresh token replay protection
  objective: Finds refresh tokens of public clients that can be replayed.
  steps:
  - Get a refresh token.
  - Use it and save the new refresh token.
  - Use the old token again.
  - Check that the server revokes the token family or uses DPoP or mTLS.
  example: curl -X POST https://as.example.com/token -d grant_type=refresh_token -d refresh_token=<old> -d client_id=c (twice)
  expected: A refresh token is sender-bound or rotated. Reuse of an old token invalidates the whole family.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.4.5
    cheatsheet:
