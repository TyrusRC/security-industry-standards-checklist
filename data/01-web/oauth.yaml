- id: WEB-OAUTH-004
  sheet: WEB
  category: OAUTH
  title: Check mix-up protection when the client uses several servers
  objective: Finds clients that confuse responses from different authorization servers.
  steps:
  - List the authorization servers of the client.
  - Check for the iss parameter in the response.
  - Send a response that names another issuer.
  - Check that the client compares iss with the server it started the flow with.
  example: Edit the iss parameter in the callback URL with Burp Repeater.
  expected: The client checks the issuer of every response and rejects a response from another server.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.2.2
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-345
    - CWE-346
