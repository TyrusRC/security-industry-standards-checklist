- id: WEB-OAUTH-007
  sheet: WEB
  category: OAUTH
  title: Check that the resource server enforces scope and claims
  objective: Finds APIs that ignore scope, sub or authorization_details.
  steps:
  - Get a token with a small scope.
  - Call functions that need a larger scope.
  - Call data of another subject.
  - Read the code for checks of scope, sub and authorization_details.
  example: 'curl -X DELETE -H ''Authorization: Bearer <read-only token>'' https://target/api/items/1'
  expected: The API decides access from the delegated claims in the token. A small scope cannot do larger actions.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.3.2
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-863
    - CWE-285
