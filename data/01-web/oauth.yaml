  - sources/repos/CheatSheetSeries/cheatsheets/OAuth2_Cheat_Sheet.md
- id: WEB-OAUTH-028
  sheet: WEB
  category: OAUTH
  title: Check the response types of the OpenID Provider
  objective: Finds providers that allow implicit flow responses.
  steps:
  - Read the response_types_supported metadata.
  - Request response_type=token and id_token token.
  - Check that only code, ciba, id_token and id_token code work.
  example: curl https://op.example.com/.well-known/openid-configuration | jq .response_types_supported
  expected: The provider does not allow response types that return access tokens in the front channel.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V10.6.1
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
