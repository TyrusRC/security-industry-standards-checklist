- id: WEB-OAUTH-022
  sheet: WEB
  category: OAUTH
  title: Check PAR and protected authorization details
  objective: Finds requests whose parameters a user can change.
  steps:
  - Check that the code flow uses PAR for L3 systems.
  - Change authorization_details in the browser request.
  - Check that the server takes the value from the client back end.
  example: curl -X POST https://as.example.com/par -u client:secret -d 'response_type=code&client_id=c&...'
  expected: The code grant is used with PAR. Users cannot change authorization_details.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V10.4.13
    - V10.4.15
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-345
  sources_read:
