  - sources/repos/CheatSheetSeries/cheatsheets/OAuth2_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
- id: WEB-OAUTH-009
  sheet: WEB
  category: OAUTH
  title: Check that the resource server checks authentication strength
  objective: Finds APIs that need strong or recent login but ignore acr, amr and auth_time.
  steps:
  - List functions that need strong or recent login.
  - Call them with a token from a weak login.
  - Check the acr, amr and auth_time checks in the code.
  example: jwt_tool <access token> to read acr and amr; call the sensitive API with it.
  expected: The API checks the strength, method and age of the login before it allows the function.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V10.3.4
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-308
