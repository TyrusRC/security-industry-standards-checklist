- id: WEB-OAUTH-013
  sheet: WEB
  category: OAUTH
  title: Check which grant types a client may use
  objective: Finds allowed implicit, password or other grants that the client does not need.
  steps:
  - Read the client registration.
  - Send token requests with other grant types.
  - Look for response_type=token in the authorization request.
  - Check that implicit and password grants are off.
  example: curl -X POST https://as.example.com/oauth/token -d grant_type=password -d username=t -d password=t -d client_id=c
  expected: Each client can use only the grants it needs. Implicit and password grants are not used.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.4.4
    cheatsheet:
