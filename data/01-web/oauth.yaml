- id: WEB-OAUTH-017
  sheet: WEB
  category: OAUTH
  title: Check refresh token lifetime and token expiry
  objective: Finds tokens that never expire.
  steps:
  - Read the lifetime of access tokens.
  - Use refresh tokens over time and with sliding expiry.
  - Check for an absolute end of life.
  - Use an access token after expiry.
  example: 'curl -H ''Authorization: Bearer <token>'' https://target/userinfo after 5, 10 and 30 minutes.'
  expected: Access tokens are short lived. Refresh tokens have an absolute expiry, also with sliding expiry.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.4.8
    cheatsheet:
