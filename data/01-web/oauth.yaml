- id: WEB-OAUTH-021
  sheet: WEB
  category: OAUTH
  title: Check allowed response_mode values
  objective: Finds clients that can use a response mode they do not need.
  steps:
  - Read the registration of each client.
  - Send a request with a different response_mode.
  - Check for PAR or JAR use.
  example: GET /authorize?...&response_mode=fragment vs web_message.
  expected: The server accepts only the response modes registered for the client.
  severity: Low
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V10.4.12
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
