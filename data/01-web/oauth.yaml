- id: WEB-OAUTH-030
  sheet: WEB
  category: OAUTH
  title: Check user consent and the information shown
  objective: Finds missing or unclear consent for authorization requests.
  steps:
  - Start a flow with a new client.
  - Check that consent is asked for each request, always when the client is unknown.
  - Check that the page names the client, scopes and lifetime.
  - Check the consent page for CSRF and framing.
  example: curl -I https://as.example.com/consent | grep -i 'x-frame-options\|frame-ancestors'
  expected: The user gives clear consent for each request. The page cannot be framed, and a changed state is rejected.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.7.1
    - V10.7.2
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-352
