- id: WEB-OAUTH-020
  sheet: WEB
  category: OAUTH
  title: Check scopes assigned to each client
  objective: Finds clients with scopes they do not need.
  steps:
  - List registered clients and their scopes.
  - Compare them with client features.
  - Request a scope that is not assigned.
  example: curl 'https://as.example.com/authorize?client_id=c&scope=admin&response_type=code'
  expected: A client can get only the scopes assigned to it.
  severity: Medium
  test_type: Manual
  level: ASVS L2
