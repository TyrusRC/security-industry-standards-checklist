  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/OAuth2_Cheat_Sheet.md
- id: WEB-OAUTH-025
  sheet: WEB
  category: OAUTH
  title: Check user identity and audience in ID tokens
  objective: Finds clients that identify users by reusable claims or accept tokens for other clients.
  steps:
  - Read the sub, iss and aud claims.
  - Check that the account key is iss plus sub.
  - Send an ID token with another aud.
  - Check that aud equals the client_id.
  example: jwt_tool <ID token> ; replay a token from client B at client A.
  expected: The client uses sub with iss to find users. It rejects tokens whose aud is not its own client_id.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    asvs:
    - V10.5.2
    - V10.5.4
    cheatsheet:
    - Authentication_Cheat_Sheet
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-290
    - CWE-345
