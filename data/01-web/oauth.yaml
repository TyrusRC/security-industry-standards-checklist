  - sources/repos/CheatSheetSeries/cheatsheets/OAuth2_Cheat_Sheet.md
- id: WEB-OAUTH-011
  sheet: WEB
  category: OAUTH
  title: Check redirect URI validation
  objective: Finds authorization servers that send codes or tokens to unregistered URIs.
  steps:
  - Start the flow and pause at the authorization request.
  - Change redirect_uri to a different host, path and port.
  - Try a prefix, subdomain and encoding change of the registered URI.
  - Check that http URIs are not allowed.
  example: 'ZAP: change redirect_uri=https%3A%2F%2Fclient.example.com%2F to a value outside the registered list.'
  expected: The server compares redirect_uri with the registered list by exact string. It shows an error and does not redirect.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-05
    asvs:
    - V10.4.1
    cheatsheet:
    - OAuth2_Cheat_Sheet
    cwe:
    - CWE-601
