- id: WEB-ZTA-003
  sheet: WEB
  category: ZTA
  title: Test device trust, health checks and revocation of access
  objective: Finds unmanaged or compromised devices that keep access to resources.
  preconditions:
  - Use test devices only.
  steps:
  - Make sure all approved devices are registered with a certificate-based identity.
  - Connect from a device that is not registered. Make sure access is blocked or limited to an isolated session.
  - Make a test device fail a health check, such as an old OS patch level.
  - Make sure access is limited or removed automatically.
  - Mark a test device as compromised. Make sure its access ends at once.
  example: MDM or EDR console; client certificate on a test device; test health policy
  expected: Only registered healthy devices get full access. Failed or compromised devices lose access automatically.
  severity: High
  test_type:
  - Manual
  refs:
    cheatsheet:
    - Zero_Trust_Architecture_Cheat_Sheet
    cwe:
    - CWE-287
    nist_800_53:
