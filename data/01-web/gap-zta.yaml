- id: WEB-ZTA-001
  sheet: WEB
  category: ZTA
  title: Test that access is granted per session and re-evaluated during the session
  objective: Finds access that carries over between resources or stays valid after policy changes.
  steps:
  - Log in and get access to resource A. Try to open resource B with the same session.
  - Make sure resource B needs its own authorization decision with least privileges.
  - Change a risk factor during an active session, such as device state or location.
  - Make sure the system asks for reauthentication or ends the session when policy requires it.
  example: Two resources with different roles; change device posture or source IP in a test session
  expected: Each resource session gets its own authorization. A change in policy inputs triggers reauthentication or session end.
  severity: High
  test_type:
  - Manual
  refs:
    cheatsheet:
    - Zero_Trust_Architecture_Cheat_Sheet
    cwe:
    - CWE-863
    nist_800_53:
    - AC-3
    - AC-12
