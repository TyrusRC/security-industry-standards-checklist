- id: WEB-ZTA-005
  sheet: WEB
  category: ZTA
  title: Test that an enforcement point cannot be bypassed to reach the resource
  objective: Finds resources that accept direct requests that skip the identity-aware proxy or gateway.
  steps:
  - Find the identity-aware proxy, API gateway or ZTNA broker that protects the application.
  - Find the backend address of the application.
  - Send a request to the backend directly from a network the proxy does not control.
  - Send an API call with no identity through the gateway.
  - Make sure both requests are rejected.
  example: curl -i https://BACKEND_HOST/ ; curl -i https://GATEWAY/api/resource
  expected: The backend accepts requests only from the enforcement point. Requests without valid identity are rejected.
  severity: High
  test_type:
  - Manual
  refs:
    cheatsheet:
    - Zero_Trust_Architecture_Cheat_Sheet
    cwe:
