- id: WEB-ZTA-004
  sheet: WEB
  category: ZTA
  title: Check just-in-time administrator access and separate administrator accounts
  objective: Finds permanent administrator rights that give an attacker standing access.
  steps:
  - List accounts with administrator rights.
  - Make sure administrators use separate accounts for administration.
  - Make sure no account has always-on administrator rights.
  - Request elevated access on a test system. Make sure it is approved, time-limited and logged.
  - Make sure access ends automatically at expiry.
  example: PAM tool export; role assignment list; test elevation request
  expected: No standing administrator rights exist. Elevated access is approved, expires on its own and is logged.
  severity: High
  test_type:
  - Config Review
  - Manual
  refs:
    cheatsheet:
    - Zero_Trust_Architecture_Cheat_Sheet
