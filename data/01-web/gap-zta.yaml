- id: WEB-ZTA-002
  sheet: WEB
  category: ZTA
  title: Test that the access policy uses risk signals beyond valid credentials
  objective: Finds policies that grant access to anyone with a valid password or token.
  preconditions:
  - Use test accounts only.
  steps:
  - Log in with valid credentials from an unmanaged device.
  - Log in with valid credentials from an unusual location and time.
  - Access a sensitive resource with a normal risk level, then with a high risk level.
  - Make sure the policy denies, limits or asks for stronger authentication as the risk rises.
  - Make sure the decision is logged with the signals used.
  example: Conditional access test accounts; VPN or proxy for location change; second test device
  expected: High-risk access is denied or needs stronger authentication even with valid credentials. Each decision is logged.
  severity: High
  test_type:
  - Manual
  refs:
    cheatsheet:
    - Zero_Trust_Architecture_Cheat_Sheet
    cwe:
    - CWE-287
    nist_800_53:
    - AC-2
    - IA-2
