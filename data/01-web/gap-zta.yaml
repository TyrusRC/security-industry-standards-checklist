- id: WEB-ZTA-006
  sheet: WEB
  category: ZTA
  title: Test automated response when an account or device shows signs of compromise
  objective: Finds environments that detect compromise but cannot isolate accounts or devices quickly.
  preconditions:
  - Use a test account only.
  steps:
  - Review the monitoring that feeds the policy engine, such as SIEM, behavior analysis and device health.
  - Trigger a harmless test alert for a test account, such as logins from two distant locations.
  - Make sure the account is isolated or must reauthenticate within the target time.
  - Make sure the team tracks detection and response times and policy violations.
  example: SIEM test rule; incident record with MTTD and MTTR
  expected: A test alert isolates the account or device within the target time. The team tracks detection and response metrics.
  severity: Medium
  test_type:
  - Manual
  refs:
    cheatsheet:
