- id: WEB-CONF-003
  sheet: WEB
  category: CONF
  title: Make sure documentation and monitoring endpoints are not exposed
  objective: Find API documentation, health and metrics endpoints that are open to users who do not need them.
  steps:
  - Request /swagger.json, /openapi.json, /api-docs, /graphql, /metrics, /health and /actuator without credentials.
  - Request the same paths with a low-privilege account.
  - Look in robots.txt and JavaScript files for more documentation paths.
  - Read the content of each reachable endpoint for internal host names and secrets.
  - Compare the result with the list of intended public endpoints.
  example: ffuf -u https://example.com/FUZZ -w api-docs-wordlist.txt -mc 200,401,403; curl -si https://example.com/openapi.json
  expected: Documentation and monitoring endpoints need authentication and are limited to the intended network, or they do not exist.
  severity: Medium
  test_type:
  - Manual
  - Automated
  level: ASVS L2
  refs:
    wstg:
    - WSTG-APIT-01
    - WSTG-CONF-05
