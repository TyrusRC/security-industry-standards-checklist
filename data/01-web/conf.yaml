- id: WEB-CONF-001
  sheet: WEB
  category: CONF
  title: Review the network infrastructure configuration and known server vulnerabilities
  objective: Find open ports, outdated servers and weak network rules around the application.
  preconditions:
  - Do not run vulnerability scripts on production without approval.
  steps:
  - Get the list of ports that the application needs from the owner.
  - Scan the hosts with Nmap and compare the open ports with the list.
  - Run Nuclei or Nikto and check each version-based finding by hand.
  - Review security groups, firewall and container network rules for rules that are wider than the list.
  - Look at the admin interfaces of the infrastructure for default credentials.
  example: nmap -Pn -sV --script vuln -p- 192.0.2.10; nuclei -u https://example.com -severity medium,high,critical; nikto -h https://example.com
  expected: Only needed ports are open. Components are patched. Network rules follow the change-controlled port list.
  severity: Medium
  test_type:
  - Manual
  - Automated
  - Config Review
  refs:
    wstg:
    - WSTG-CONF-01
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-1188
    capec:
    - CAPEC-176
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management/01-Network_Infrastructure_Configuration.md
  - sources/repos/Top10/2025/docs/en/A02_2025-Security_Misconfiguration.md
- id: WEB-CONF-002
  sheet: WEB
  category: CONF
  title: Remove default, sample and debug functionality from production
  objective: Find sample applications, debug modes, debug endpoints and test code that remain in the production deployment.
  steps:
  - Request known sample paths such as phpinfo.php, /swagger-ui, /actuator/env and framework welcome pages.
  - Trigger an application error and look for stack traces, local variables or an interactive debugger.
  - Look for DEBUG, FLASK_DEBUG and similar settings in the effective runtime configuration.
  - Check GraphQL introspection and source maps in production builds.
  - Review container images for sample files, build-time secrets and debug environment variables.
  - Compare installed modules and features with the list of required functions.
  example: curl -si https://example.com/actuator/env; curl -si https://example.com/phpinfo.php; nuclei -u https://example.com -tags exposure,debug,misconfig
  expected: No sample, test or debug functionality is reachable. Debug mode is off in all components. Only required functionality is deployed.
  severity: High
  test_type:
  - Manual
  - Automated
  - Config Review
  level: ASVS L2
  refs:
    wstg:
    - WSTG-CONF-02
    asvs:
    - V13.4.2
    - V15.2.3
    owasp_top10:
