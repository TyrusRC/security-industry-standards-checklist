- id: WEB-CONF-005
  sheet: WEB
  category: CONF
  title: Make sure source control metadata is not deployed or reachable
  objective: Find .git, .svn and similar folders that expose source code and history.
  steps:
  - Request /.git/HEAD, /.git/config, /.svn/entries and /.hg/ on the web root and on each subpath.
  - If a response is valid, dump the repository with a safe tool and look for secrets in the history.
  - Check the deployed file tree and the container image for these folders.
  - Check that the application process cannot read these folders.
  example: curl -si https://example.com/.git/HEAD; git-dumper https://example.com/.git ./dump && trufflehog git file://./dump
  expected: Source control folders do not exist in the deployment, or the server and the application cannot read them.
  severity: High
  test_type:
  - Manual
  - Automated
  level: ASVS L1
  refs:
    asvs:
    - V13.4.1
    owasp_top10:
    - A02:2025
    cwe:
