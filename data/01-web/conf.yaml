- id: WEB-CONF-011
  sheet: WEB
  category: CONF
  title: Find subdomain takeover through dangling DNS records
  objective: Find DNS records that point to external services that no longer exist and that an attacker can claim.
  steps:
  - Enumerate subdomains with subfinder and keep names with CNAME, NS or MX records.
  - Run subzy and the Nuclei takeover templates on the list.
  - Resolve each hit with dig and compare the page with the can-i-take-over-xyz fingerprint.
  - Check expired domains used in CNAME records.
  - Do not claim the resource. Report the finding.
  example: subfinder -d example.com -silent | subzy run --targets /dev/stdin; nuclei -l subs.txt -t http/takeovers/; dig CNAME dev.example.com
  expected: No DNS record points to an unclaimed or expired resource.
  severity: High
  test_type:
  - Manual
  - Automated
  refs:
    wstg:
    - WSTG-CONF-10
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-668
    capec:
    - CAPEC-148
  sources_read:
