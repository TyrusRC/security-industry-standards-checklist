- id: WEB-CONF-013
  sheet: WEB
  category: CONF
  title: Test path confusion between proxy, cache, WAF and application
  objective: Find path variants that bypass access control or cache rules because components read the path in different ways.
  steps:
  - Take a protected path and request it with a trailing slash, other case and double slash.
  - Request it with dot segments and encoded separators such as %2f.
  - Add a static extension such as /none.js to a dynamic path and look at the cache headers.
  - Compare status code and body for each variant against the original.
  - Review the route rules in the application for loose regular expressions.
  example: for p in /user/dashboard/ /User/Dashboard //user/dashboard /user%2Fdashboard /user/dashboard/none.js; do curl -s -o /dev/null -w "$p %{http_code}\n" https://example.com$p; done
  expected: All path variants give the same access-control result. Dynamic pages are not cached by extension.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  refs:
    wstg:
    - WSTG-CONF-13
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-444
    - CWE-22
    capec:
    - CAPEC-153
  sources_read:
