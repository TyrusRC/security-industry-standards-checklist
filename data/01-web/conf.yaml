- id: WEB-CONF-015
  sheet: WEB
  category: CONF
  title: Make sure clients cannot override proxy headers or spoof the client IP
  objective: Find headers such as X-Forwarded-For, X-Real-IP and X-User-ID that a user can set and that the application trusts.
  steps:
  - List the headers that the proxy or load balancer sets for the application.
  - Send the same headers with other values directly from the client.
  - Send X-Forwarded-For with a spoofed address and look at the logs and the rate limit.
  - Add the header name to the Connection header and look for stripped headers.
  - Look at the proxy configuration for headers that it overwrites or removes.
  example: 'curl -si -H ''X-Forwarded-For: 127.0.0.1'' -H ''X-Real-IP: 127.0.0.1'' -H ''X-User-ID: 1'' https://example.com/admin; curl -si -H ''Connection: close, X-Auth-User'' https://example.com/'
  expected: The proxy overwrites or removes these headers from clients. The application uses the real client IP for logs and rate limits.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    wstg:
    - WSTG-CONF-14
    asvs:
    - V4.1.3
    - V15.3.4
    cwe:
    - CWE-348
    - CWE-290
  sources_read:
