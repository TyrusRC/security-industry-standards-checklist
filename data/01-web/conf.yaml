- id: WEB-CONF-010
  sheet: WEB
  category: CONF
  title: Review file and directory permissions on host, container and cloud storage
  objective: Find files, secrets and volumes that have wider permissions than needed.
  steps:
  - List permissions of web root, config, key, log, upload and temp directories with namei and ls -l.
  - Look for world-writable files and files owned by root that the web user can change.
  - Inspect the container image for root user and wide file modes.
  - Review Kubernetes securityContext, Secret defaultMode and hostPath mounts.
  - Review bucket ACLs and IAM bindings for public grants.
  example: namei -l /var/www/app/config; find /var/www -perm -o+w -type f; docker inspect --format '{{.Config.User}}' app:latest
  expected: Files and secrets have least-privilege permissions. The web process cannot write to code or configuration.
  severity: Medium
  test_type:
  - Config Review
  refs:
    wstg:
    - WSTG-CONF-09
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-732
