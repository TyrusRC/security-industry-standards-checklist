- id: WEB-CONF-012
  sheet: WEB
  category: CONF
  title: Check cloud storage for public access, weak signed URLs and old versions
  objective: Find buckets and containers that allow public listing, write access, long-lived signed URLs or exposed old object versions.
  steps:
  - Find bucket URLs in page source and responses.
  - Request the bucket root unauthenticated and look for a file list.
  - Try an unauthenticated write to the bucket.
  - Review ACL and policy for AllUsers and AuthenticatedUsers grants.
  - Check signed URL expiry, scope and tampering of path and query.
  - Check versioning for objects that were deleted but still readable.
  example: curl -si https://BUCKET.s3.amazonaws.com/; aws s3api get-bucket-acl --bucket BUCKET; S3Scanner scan -b BUCKET
  expected: Buckets are private except for intended public assets. Signed URLs are short-lived and scoped. Deleted data is not readable.
  severity: High
  test_type:
  - Manual
  - Automated
  - Config Review
  refs:
    wstg:
    - WSTG-CONF-11
    owasp_top10:
    - A02:2025
    cheatsheet:
    - Secure_Cloud_Architecture_Cheat_Sheet
    cwe:
    - CWE-732
    - CWE-668
    capec:
    - CAPEC-150
