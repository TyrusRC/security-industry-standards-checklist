- id: WEB-CONF-014
  sheet: WEB
  category: CONF
  title: Check that security controls do not depend on client-controlled feature flags
  objective: Find feature flags and kill switches that let a user turn off a security control or that fail open.
  steps:
  - Find feature flags in JavaScript bundles, API responses and cookies.
  - Change the flag values in the client and send the request again.
  - Call the hidden function with a user that has no right, and look for server-side authorization.
  - Block the flag service and look at how the application behaves.
  - Read flag configuration for internal names and user segments.
  - List old flags that are no longer toggled.
  example: grep -rEi 'featureflag|flags\.|launchdarkly|unleash' ./static/*.js; curl -s https://example.com/api/flags
  expected: The server enforces authorization without regard to flag state. A failed flag service gives the safe default.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  refs:
    wstg:
    - WSTG-CONF-15
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-15
    - CWE-636
  sources_read:
