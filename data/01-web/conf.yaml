- id: WEB-CONF-006
  sheet: WEB
  category: CONF
  title: Make sure directory listing is disabled
  objective: Find directories where the server shows a file index to users.
  steps:
  - Request each directory path found during the crawl with and without a trailing slash.
  - Request upload, static, backup and log directories.
  - Look for index pages such as Index of or Directory listing for.
  - Review the server configuration for the autoindex or Options Indexes setting.
  example: curl -s https://example.com/static/ | grep -iE 'index of|directory listing'; nikto -h https://example.com -Tuning 2
  expected: The server returns 403 or 404 for directories without an index file. No file list is shown.
  severity: Medium
  test_type:
  - Manual
  - Automated
  - Config Review
  level: ASVS L2
  refs:
    asvs:
    - V13.4.3
    owasp_top10:
