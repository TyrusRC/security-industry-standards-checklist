- id: WEB-CONF-009
  sheet: WEB
  category: CONF
  title: Make sure the HTTP TRACE method is not supported
  objective: Find TRACE or TRACK support that echoes requests and leaks headers.
  steps:
  - Send a TRACE request with a custom header to the host.
  - Send a TRACK request to the host.
  - Repeat on every HTTP service and port found.
  example: 'curl -si -X TRACE -H ''X-Test: 1'' https://example.com/; nmap -p443 --script http-trace example.com'
  expected: The server rejects TRACE and TRACK with 405 or 501 and does not echo the request.
  severity: Low
  test_type:
  - Manual
  - Automated
  level: ASVS L2
  refs:
    wstg:
