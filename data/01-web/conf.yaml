- id: WEB-CONF-007
  sheet: WEB
  category: CONF
  title: Find admin interfaces and check them for weak exposure and default credentials
  objective: Find infrastructure and application admin consoles that are reachable by the wrong users or use default credentials.
  steps:
  - Enumerate admin paths for the framework with a wordlist, and on alternative ports.
  - Look at source comments and documentation for admin links.
  - Check consoles such as Actuator, Kubernetes Dashboard, Jenkins, Portainer and database UIs.
  - Try the documented default credentials of each product, within the rules of engagement.
  - Make sure each console is not reachable from the public internet and uses TLS.
  - Make sure setup wizards cannot run again.
  example: ffuf -u https://example.com/FUZZ -w admin-panels.txt -mc 200,301,302,401,403; nmap -p 8080,8443,9000,10250,2379 192.0.2.10
  expected: Admin interfaces are not public, need strong authentication and TLS, and have no default credentials.
  severity: High
  test_type:
  - Manual
  - Automated
  refs:
    wstg:
    - WSTG-CONF-05
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-1188
