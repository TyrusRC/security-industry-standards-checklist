- id: WEB-CONF-008
  sheet: WEB
  category: CONF
  title: Make sure only needed HTTP methods work and method override is blocked
  objective: Find enabled methods such as PUT, DELETE, CONNECT and WebDAV, and method override that bypass access control.
  steps:
  - Send OPTIONS and read the Allow header.
  - Send each method from the list, and an unknown method, to each key path.
  - Send PUT to upload a test file and DELETE on a test file in a safe location.
  - Try X-HTTP-Method-Override and the _method parameter on a protected action.
  - Repeat the checks through the CDN or proxy and directly on the origin.
  - Send the request with a mixed-case method name.
  example: curl -si -X OPTIONS https://example.com/; curl -si -X FOO https://example.com/; nmap -p443 --script http-methods --script-args http-methods.url-path=/ example.com
  expected: Only the methods that the application supports are accepted. Other methods get 405 or 501 and unused methods are blocked.
  severity: Medium
  test_type:
  - Manual
  - Automated
  - Config Review
  level: ASVS L3
  refs:
    wstg:
    - WSTG-CONF-06
    - WSTG-INJT-03
    asvs:
    - V4.1.4
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-650
    - CWE-749
    capec:
    - CAPEC-1
