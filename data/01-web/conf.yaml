- id: WEB-CONF-004
  sheet: WEB
  category: CONF
  title: Find old, backup and unreferenced files and unsafe file extension handling
  objective: Find backup copies, include files, archives and dumps that the web server serves in readable form.
  steps:
  - 'Request common suffixes on known files: .bak, .old, .orig, .save, .swp, .inc, .zip and the tilde suffix.'
  - Request archives and dumps such as backup.zip, db.sql, .env and terraform.tfstate on the web root.
  - Check how the server handles unknown and sensitive extensions in each directory.
  - Try Windows 8.3 short names where the host runs Windows.
  - Check cloud storage that holds static files for forgotten artifacts.
  - Look at the server configuration for the allowed file extensions.
  example: ffuf -u https://example.com/FUZZ -w raft-medium-files.txt -e .bak,.old,.zip,.sql,.inc,.env,~ -mc 200; nuclei -u https://example.com -tags backup,config
  expected: The web tier serves only files with approved extensions. No backup, dump or include file is reachable.
  severity: High
  test_type:
  - Manual
  - Automated
  - Config Review
  level: ASVS L3
