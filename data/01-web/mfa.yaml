- id: WEB-MFA-001
  sheet: WEB
  category: MFA
  title: Check that MFA or several factors protect access
  objective: Finds single-factor access to the application, or MFA that uses the same factor twice.
  steps:
  - List the factors that the login needs.
  - Make sure at least two different factor types are needed, or approved single-factor combinations.
  - Check that two secrets of the same type, such as password plus PIN, are not counted as MFA.
  - For L3 systems, check that one factor is hardware-based and phishing resistant.
  example: 'Burp history: record each login step; check that the session cookie is issued only after the second factor.'
  expected: Access needs MFA or an approved combination of factors. Two factors of the same type do not count. L3 systems use a phishing-resistant hardware factor.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-11
    asvs:
    - V6.3.3
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-308
    - CWE-309
    - CWE-654
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
