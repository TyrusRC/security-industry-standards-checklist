- id: WEB-MFA-013
  sheet: WEB
  category: MFA
  title: Check the time source for TOTP checks
  objective: Finds TOTP checks that use the client time.
  steps:
  - Read the code that checks TOTP.
  - Send a client time or time zone value in the request.
  - Change the device clock. Test the code.
  example: grep -rn 'totp' src/ | grep -i 'timestamp\|time(' ; add 'ts=<value>' to POST /mfa/verify.
  expected: The server uses its own trusted time source. Client time has no effect.
  severity: Medium
  test_type: Code Review
  level: ASVS L3
  refs:
    wstg:
    - WSTG-ATHN-11
    asvs:
