- id: WEB-MFA-009
  sheet: WEB
  category: MFA
  title: Check the use of SMS and phone calls as factors
  objective: Finds PSTN codes sent to unverified numbers, or with no stronger option.
  steps:
  - Add a phone number. Check that the application validates it.
  - Check that stronger factors such as TOTP are offered.
  - Look for a warning about the risks of SMS.
  - For L3 systems, check that SMS is not accepted.
  example: POST /profile/phone number=+15550100 ; then check that no code goes out before validation.
  expected: PSTN codes go only to validated numbers. Stronger methods exist and the user sees a risk notice. L3 systems do not use PSTN.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHN-11
    asvs:
    - V6.6.1
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-308
