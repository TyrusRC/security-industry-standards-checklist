  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
- id: WEB-MFA-011
  sheet: WEB
  category: MFA
  title: Check that an authentication factor can be revoked
  objective: Finds lost or stolen factors that stay valid.
  steps:
  - Enrol a test device or token.
  - Revoke it in the profile or as administrator.
  - Try to log in with the revoked factor.
  example: DELETE /api/mfa/devices/<id> then replay a code from that device.
  expected: A revoked factor cannot be used for authentication. The user is notified.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V6.5.6
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-324
