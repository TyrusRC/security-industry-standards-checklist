  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
- id: WEB-MFA-018
  sheet: WEB
  category: MFA
  title: Check OTP delivery abuse and SMS or email flooding
  objective: Finds missing limits on code sending, which allows harassment and cost abuse.
  preconditions:
  - Do not run on production.
  steps:
  - Request 20 codes for one account in one minute.
  - Check the number of messages sent.
  - Check that a new code cancels the old one.
  - Try the limit with different IP addresses.
  example: for i in $(seq 20); do curl -s -o /dev/null -w '%{http_code}\n' -d 'user=victim' https://target/mfa/send; done
  expected: The number of codes per account and per time is limited. A new code replaces the old one.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-11
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-770
    - CWE-799
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/11-Multi-Factor_Authentication.md
