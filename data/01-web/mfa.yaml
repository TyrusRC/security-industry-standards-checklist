- id: WEB-MFA-016
  sheet: WEB
  category: MFA
  title: Check the management of MFA settings
  objective: Finds MFA settings that can be changed without re-authentication, by CSRF or by IDOR.
  steps:
  - Disable MFA or change the device with a stolen session cookie only.
  - Send the change request from another site without a CSRF token.
  - Change the user ID in the request to another account.
  - Check for a notice to the user.
  example: 'Burp Repeater: POST /account/mfa/disable with only the session cookie; then add user=victim.'
  expected: Changes to MFA need a strong re-authentication, a CSRF token and ownership checks. The user gets a notice.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-11
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-620
    - CWE-352
    - CWE-639
  sources_read:
