  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
- id: WEB-MFA-012
  sheet: WEB
  category: MFA
  title: Check that biometrics are only a second factor
  objective: Finds biometrics used alone.
  steps:
  - Read the authentication design.
  - Look for biometric login paths.
  - Try to log in with the biometric only.
  example: 'Review the WebAuthn or app configuration: userVerification and the required factors per login.'
  expected: Biometrics are used only together with something the user has or knows.
  severity: Low
  test_type: Config Review
  level: ASVS L3
