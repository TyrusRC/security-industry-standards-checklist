- id: WEB-MFA-002
  sheet: WEB
  category: MFA
  title: Try to bypass MFA with other paths and headers
  objective: Finds login paths or flags that skip the second factor.
  steps:
  - 'List all login paths: main page, API, mobile API, federated login, test pages.'
  - Log in with the password only. Request a protected page directly.
  - Call the API login endpoints with the password only.
  - Add X-Forwarded-For or debug headers such as X-Debug to the login.
  - Try a local login for an account that was linked to a federated login.
  - Try the hard-coded or break-glass account.
  example: 'curl -i -b ''session=<pre-mfa cookie>'' https://target/account ; curl -i -H ''X-Forwarded-For: 10.0.0.5'' -H ''X-Debug: 1'' -d ''u=a&p=b'' https://target/api/login'
  expected: Every login path needs the second factor. Headers, IP values and special accounts do not skip it.
  severity: Critical
  test_type: Manual
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-11
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-304
    - CWE-288
    - CWE-290
    - CWE-291
    - CWE-308
    capec:
    - CAPEC-115
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/11-Multi-Factor_Authentication.md
  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A07_2025-Authentication_Failures.md
- id: WEB-MFA-003
  sheet: WEB
  category: MFA
  title: Test OTP brute force and rate limit
  objective: Finds OTP checks with no rate limit or lockout, so codes can be guessed.
  preconditions:
  - Test account that you can lock.
  - Do not run on production.
  steps:
  - Log in with the password and stop at the OTP page.
  - Send 100 wrong codes in a short time.
  - Check for lockout, delay or a new code requirement.
  - Check that a failure count follows the account and not only the IP address.
  - Send many codes from several IP addresses.
  example: 'Burp Intruder: POST /mfa/verify code=§000000§ (numbers 000000-000200); look at status codes for a lockout.'
  expected: The application limits wrong OTP codes per account, locks or delays, and logs the events. Longer codes or 64-bit entropy add safety.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-11
    - WSTG-ATHN-03
    asvs:
    - V6.6.3
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-307
    - CWE-770
    capec:
    - CAPEC-112
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/11-Multi-Factor_Authentication.md
