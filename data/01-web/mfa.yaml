- id: WEB-MFA-004
  sheet: WEB
  category: MFA
  title: Check that OTPs, lookup secrets and TOTP work only once
  objective: Finds codes that can be reused.
  steps:
  - Log in and capture the valid OTP request.
  - Log out and log in again. Send the same code.
  - Replay the captured request at once.
  - Use a recovery code twice.
  example: 'Burp Repeater: send POST /mfa/verify twice with the same code; the second request must fail.'
  expected: Each lookup secret, out-of-band code and TOTP value works only once.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHN-11
    asvs:
    - V6.5.1
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-294
    - CWE-308
    capec:
    - CAPEC-60
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/11-Multi-Factor_Authentication.md
  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
- id: WEB-MFA-005
  sheet: WEB
  category: MFA
  title: Check the lifetime of OTP codes and TOTP
  objective: Finds codes that stay valid for too long.
  steps:
  - Request an out-of-band code.
  - Send it after 5, 10 and 11 minutes.
  - Send a TOTP value from 30, 60 and 90 seconds ago.
  - Request a new code and test the old one.
  example: oathtool --totp -b $SECRET -N '-90 seconds' ; submit the value to /mfa/verify.
  expected: Out-of-band codes expire in 10 minutes or less. TOTP values are valid for 30 seconds or a small window. A new code cancels the old one.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHN-11
    asvs:
    - V6.5.5
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-324
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/11-Multi-Factor_Authentication.md
  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
- id: WEB-MFA-006
  sheet: WEB
  category: MFA
  title: Check the generation and strength of OTPs and lookup secrets
  objective: Finds predictable or short codes, or weak TOTP seeds.
  steps:
  - Request 50 codes and examine them for patterns.
  - 'Check the code length: at least 20 bits (6 digits).'
  - Read the code for the random function. It must be a CSPRNG.
  - Check that TOTP seeds come from a CSPRNG and are at least 160 bits.
  example: grep -rn 'Math.random\|rand()\|random.randint' src/ ; Burp Sequencer on 50 OTPs.
  expected: Codes and seeds come from a CSPRNG and have enough entropy.
  severity: High
  test_type: Code Review
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHN-11
    asvs:
    - V6.5.3
    - V6.5.4
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-330
    - CWE-331
    - CWE-338
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/11-Multi-Factor_Authentication.md
  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
- id: WEB-MFA-007
  sheet: WEB
  category: MFA
  title: Check the storage of lookup secrets
  objective: Finds recovery codes stored in clear text or with a fast hash.
  steps:
  - Find where recovery codes are stored.
  - Check the code entropy.
  - For secrets below 112 bits, check for a password hash with a 32-bit random salt.
  - Make sure OTP values are not in logs.
  example: SELECT code FROM recovery_codes LIMIT 5; grep -rn 'recovery' src/ | grep -i hash
  expected: Lookup secrets under 112 bits are hashed with an approved password hash and salt. Codes are not logged.
  severity: Medium
  test_type: Code Review
  level: ASVS L2
  refs:
    asvs:
    - V6.5.2
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    - Password_Storage_Cheat_Sheet
    cwe:
    - CWE-256
    - CWE-916
    - CWE-312
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Password_Storage_Cheat_Sheet.md
- id: WEB-MFA-008
  sheet: WEB
  category: MFA
  title: Check that out-of-band codes belong to one request
  objective: Finds codes that work for another login request or another user.
  steps:
  - Start two logins for the same user. Collect the code from the first.
  - Use the code of the first login in the second.
  - Use a code of user A in the login of user B.
  example: 'Two Burp sessions: take code from mail 1 and POST it with the session cookie from login 2.'
  expected: A code is bound to the original authentication request. It works only there.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHN-11
    asvs:
    - V6.6.2
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-294
    - CWE-287
