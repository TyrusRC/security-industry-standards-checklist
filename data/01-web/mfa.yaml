- id: WEB-MFA-015
  sheet: WEB
  category: MFA
  title: Check that password reset does not bypass MFA
  objective: Finds reset flows that give access without the second factor.
  steps:
  - Enable MFA on a test account.
  - Reset the password with the email link.
  - Check if the application logs in the user without MFA.
  - Log in with the new password and check that MFA is still needed.
  example: Complete /forgot -> /reset/confirm and call GET /account with the returned cookie.
  expected: Reset does not remove or skip MFA. The user still needs the second factor after the reset.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-09
    - WSTG-ATHN-11
    asvs:
    - V6.4.3
    cheatsheet:
    - Forgot_Password_Cheat_Sheet
    - Multifactor_Authentication_Cheat_Sheet
