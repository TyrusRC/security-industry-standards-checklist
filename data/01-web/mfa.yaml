- id: WEB-MFA-010
  sheet: WEB
  category: MFA
  title: Check push MFA for flooding and number matching
  objective: Finds push MFA that lets an attacker flood the user until a prompt is accepted.
  preconditions:
  - Do not run on production.
  steps:
  - Log in with the password 10 times.
  - Count the push prompts that the user phone gets.
  - 'Check that the prompt shows context: place, device and time.'
  - Check for number matching.
  example: for i in $(seq 10); do curl -s -d 'u=victim&p=<pw>' https://target/login; done and count prompts on the test phone.
  expected: The application limits push requests, shows context, and uses number matching.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    wstg:
    - WSTG-ATHN-11
    asvs:
    - V6.6.4
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-799
    - CWE-770
  sources_read:
