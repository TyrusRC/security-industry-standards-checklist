  - sources/repos/CheatSheetSeries/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md
- id: WEB-MFA-017
  sheet: WEB
  category: MFA
  title: Check trusted IP, location and certificate based factors
  objective: Finds factors that can be forged with headers or an unrestricted certificate authority.
  steps:
  - Set X-Forwarded-For to a trusted IP address.
  - 'List the trusted IP ranges: look for guest Wi-Fi and cloud ranges.'
  - Check which CAs the server trusts for client certificates.
  - Use a certificate from another CA, and one issued to another user.
  example: 'openssl s_client -connect target:443 | grep -A5 ''Acceptable client certificate CA'' ; curl -H ''X-Forwarded-For: 10.0.0.1'' https://target/login'
  expected: Header values do not set trust. Only reviewed ranges are trusted. Client certificates are accepted from approved CAs and only for the owner.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-11
    cheatsheet:
    - Multifactor_Authentication_Cheat_Sheet
    cwe:
    - CWE-291
    - CWE-290
    - CWE-295
  sources_read:
