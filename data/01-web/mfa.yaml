- id: WEB-MFA-014
  sheet: WEB
  category: MFA
  title: Check the MFA recovery process and identity proof
  objective: Finds weak ways to regain access after a lost factor.
  steps:
  - Start the MFA recovery process.
  - Examine the proof of identity that the process needs.
  - Compare it with the proof at enrolment.
  - 'Test recovery codes: length, single use, brute-force limit and notice.'
  - Look for security questions as a fallback.
  example: Burp Intruder on POST /mfa/recovery code=§§ ; read the mail for the notice.
  expected: Recovery needs identity proof at the same level as enrolment. Recovery codes are strong, single use and rate limited. No weak fallback exists.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-11
    asvs:
    - V6.4.4
