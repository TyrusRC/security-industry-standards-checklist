- id: WEB-JWT-011
  sheet: WEB
  category: JWT
  title: Check how the JWT is stored and sent
  objective: Finds tokens sent over HTTP or kept where scripts can read them.
  steps:
  - Make sure all calls that carry the token use HTTPS.
  - If the token is in a cookie, check the cookie attributes.
  - Look for tokens in localStorage, URLs and logs.
  example: DevTools > Application > Storage; ZAP passive scan for tokens in URLs.
  expected: Tokens travel only over HTTPS. Cookies have Secure, HttpOnly and SameSite. Tokens are not in URLs or logs.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-SESS-10
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-319
    - CWE-922
    - CWE-598
