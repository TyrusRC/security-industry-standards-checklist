- id: WEB-JWT-004
  sheet: WEB
  category: JWT
  title: Check that key material comes only from trusted sources
  objective: Finds services that take the verification key from header values that the sender controls.
  preconditions:
  - Test environment.
  steps:
  - Read the code that selects the key.
  - Make sure the jwk, jku and x5u headers are ignored or checked against an allowlist.
  - Make sure the kid value is validated before any file or database lookup.
  - Send a token with a changed header value in a test environment and look at the result.
  example: jwt_tool <JWT> -X s (spoofed JWKS) against a test instance; grep -rn 'jku\|x5u\|getKey\|kid' src/
  expected: Keys come from pre-configured sources of the issuer. Header values cannot add new key sources.
  severity: Critical
  test_type: Code Review
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    - A07:2025
    wstg:
    - WSTG-SESS-10
    asvs:
    - V9.1.3
