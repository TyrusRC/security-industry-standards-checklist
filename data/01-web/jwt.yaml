- id: WEB-JWT-003
  sheet: WEB
  category: JWT
  title: Check for key type confusion between symmetric and asymmetric keys
  objective: Finds services that accept a token made with the public key as a shared secret.
  preconditions:
  - Test environment preferred.
  steps:
  - Find out if the service expects an RS or ES algorithm.
  - 'Read the code: make sure the key type is bound to one algorithm.'
  - Send a token with an HS algorithm in a test environment.
  - Look at the library version and known issues.
  example: 'jwt_tool <JWT> -X k -pk public.pem -t https://target/api/me -rh ''Authorization: Bearer JWT'''
  expected: The service binds each key to one algorithm. A token with a different key type is rejected.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-10
    asvs:
    - V9.1.2
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    cwe:
    - CWE-347
    - CWE-327
  sources_read:
