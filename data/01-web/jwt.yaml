- id: WEB-JWT-008
  sheet: WEB
  category: JWT
  title: Check the issuer claim and the key set for each issuer
  objective: Finds services that accept tokens from the wrong issuer or environment.
  steps:
  - Read the iss claim of a token.
  - Send a token from a staging or other tenant issuer to production.
  - 'Read the code: make sure the key set is chosen by the checked issuer.'
  - Make sure missing iss or aud claims are rejected.
  example: jwt_tool <JWT> to read iss and aud; replay a staging token at the production API.
  expected: Only tokens from the configured issuer are accepted, checked with its own keys.
  severity: High
  test_type: Manual
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-10
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
