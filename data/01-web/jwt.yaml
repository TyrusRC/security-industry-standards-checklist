- id: WEB-JWT-009
  sheet: WEB
  category: JWT
  title: Check for weak HMAC secrets
  objective: Finds short, default or guessable signing secrets.
  preconditions:
  - A token from a test account. Offline work only.
  steps:
  - Look for default signing keys in the product and its documentation.
  - Test the token against a wordlist of common secrets offline.
  - Read the secret length and the way it is made.
  - Make sure each audience and issuer has its own secret.
  example: hashcat -m 16500 jwt.txt rockyou.txt ; jwt_tool <JWT> -C -d wordlist.txt
  expected: The HMAC secret is random, at least as long as the hash output, and not shared between issuers or audiences.
  severity: High
  test_type: Automated
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-10
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    cwe:
    - CWE-521
    - CWE-798
    - CWE-326
  sources_read:
