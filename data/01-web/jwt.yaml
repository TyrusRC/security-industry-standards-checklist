- id: WEB-JWT-013
  sheet: WEB
  category: JWT
  title: Check the JWT library version and signature edge cases
  objective: Finds libraries with known signature validation flaws.
  steps:
  - List the JWT libraries and runtime versions.
  - Look up known issues for each version.
  - Test ECDSA tokens with invalid signature values on Java runtimes in the affected range.
  - Update libraries that have issues.
  example: npm audit ; pip-audit ; dependency-check --scan . ; java -version
  expected: Libraries and runtimes are current and have no known signature issues.
  severity: High
  test_type: Config Review
  refs:
    wstg:
    - WSTG-SESS-10
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    cwe:
    - CWE-347
