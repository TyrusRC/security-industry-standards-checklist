- id: WEB-JWT-007
  sheet: WEB
  category: JWT
  title: Check the audience claim at each service
  objective: Finds tokens for one service that work at another service.
  steps:
  - Log in to a low-privilege app and read the aud claim.
  - Send the same token to another service or API.
  - Check that the allowlist of audiences exists in the service.
  - If one key serves many audiences, check that aud names each one.
  example: 'curl -H ''Authorization: Bearer <token for client-portal>'' https://internal-admin.example.com/api/v1/users'
  expected: A service accepts only tokens whose audience names that service. Tokens for one audience fail at another.
  severity: High
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    - A07:2025
    wstg:
    - WSTG-SESS-10
    asvs:
    - V9.2.3
    - V9.2.4
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    cwe:
