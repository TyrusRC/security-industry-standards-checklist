- id: WEB-JWT-010
  sheet: WEB
  category: JWT
  title: Check the JWT payload for sensitive data
  objective: Finds tokens that expose passwords, hashes or personal data.
  steps:
  - Decode the payload of each token type.
  - List every claim.
  - Mark claims with sensitive data.
  - If tokens must hold sensitive data, check for JWE and a fixed algorithm pair.
  example: jwt_tool <JWT> ; echo '<payload>' | base64 -d | jq .
  expected: The payload holds no secrets or unneeded personal data. Signed tokens are treated as readable by anyone.
  severity: Medium
  test_type: Manual
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-SESS-10
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    cwe:
