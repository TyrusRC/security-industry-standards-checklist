  - sources/repos/Top10/2025/docs/en/A07_2025-Authentication_Failures.md
- id: WEB-JWT-002
  sheet: WEB
  category: JWT
  title: Check the algorithm allowlist and the none algorithm
  objective: Finds acceptance of unsigned tokens or algorithms the service did not choose.
  steps:
  - Read the code or configuration for the list of allowed algorithms.
  - Send a token with alg set to none, in several letter cases.
  - Send a token with an algorithm that is not on the list.
  - Make sure the list holds either symmetric or asymmetric algorithms.
  example: 'jwt_tool <JWT> -X a -t https://target/api/me -rh ''Authorization: Bearer JWT'''
  expected: Only allowed algorithms are used for each context. The none algorithm is never accepted.
  severity: Critical
  test_type: Automated
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    - A07:2025
    wstg:
    - WSTG-SESS-10
    asvs:
    - V9.1.2
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    cwe:
    - CWE-347
    - CWE-327
