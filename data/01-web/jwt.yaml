- id: WEB-JWT-014
  sheet: WEB
  category: JWT
  title: Check JWE use and compression settings if tokens are encrypted
  objective: Finds weak encryption settings in encrypted tokens.
  steps:
  - Find tokens with five parts.
  - Read the alg and enc header values.
  - Make sure only an allowlisted pair is accepted.
  - Make sure the zip header is not used.
  example: jwt_tool <JWE> ; grep -rn 'zip' src/ | grep -i jwe
  expected: Only allowlisted alg and enc pairs are used. Keys are bound to one algorithm and claims are not compressed.
  severity: Medium
  test_type: Code Review
  refs:
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    cwe:
    - CWE-327
    - CWE-326
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/JSON_Web_Token_Cheat_Sheet.md
