- id: WEB-JWT-005
  sheet: WEB
  category: JWT
  title: Check the expiry and not-before claims
  objective: Finds tokens that are accepted outside their validity time.
  steps:
  - Read the exp and nbf claims of a token.
  - Send the token after exp.
  - Send a token with nbf in the future.
  - 'Check the lifetime: it must fit the application.'
  example: 'jwt_tool <JWT> -T to edit exp; or wait for expiry and call curl -H ''Authorization: Bearer <JWT>'' https://target/api/me'
  expected: Expired tokens and tokens that are not yet valid are rejected. Token lifetime is short.
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-SESS-10
    asvs:
    - V9.2.1
