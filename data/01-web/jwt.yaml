- id: WEB-JWT-006
  sheet: WEB
  category: JWT
  title: Check that the service accepts only the right token type
  objective: Finds services that accept an ID token as an access token, or the reverse.
  steps:
  - Get an ID token, an access token and a refresh token.
  - Send the ID token to an API that needs an access token.
  - Send an access token where an ID token is needed.
  - Check the typ header and the validation rules in the code.
  example: 'curl -H ''Authorization: Bearer <ID token>'' https://target/api/me'
  expected: Each service accepts only the token type and purpose that it is made for.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-10
    asvs:
