- id: WEB-JWT-012
  sheet: WEB
  category: JWT
  title: Check revocation and logout for self-contained tokens
  objective: Finds JWTs that stay valid after logout, role change or account removal.
  steps:
  - Log in and save the token. Log out.
  - Send the saved token.
  - Disable the account or change the role. Send the token again.
  - 'Read how the service handles revocation: deny list, status list or short life.'
  example: 'curl -i -H ''Authorization: Bearer <old JWT>'' https://target/api/me after POST /logout.'
  expected: After logout and account changes the old token is rejected. A revocation method exists and token lifetime is short.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-SESS-10
    asvs:
    - V7.4.1
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-287
    - CWE-294
