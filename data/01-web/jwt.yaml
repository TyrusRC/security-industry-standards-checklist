- id: WEB-JWT-001
  sheet: WEB
  category: JWT
  title: Check that the token signature is validated
  objective: Finds services that accept tokens with a wrong or missing signature.
  steps:
  - Decode a valid token and change one claim.
  - Send the changed token with the old signature.
  - Send a token with the signature removed.
  - Send a token signed with a different key.
  example: 'jwt_tool <JWT> -M pb -t https://target/api/me -rh ''Authorization: Bearer JWT'' (playbook scan of signature checks)'
  expected: The service rejects every token with an invalid or missing signature.
  severity: Critical
  test_type: Automated
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    - A07:2025
    wstg:
    - WSTG-SESS-10
    asvs:
    - V9.1.1
    cheatsheet:
    - JSON_Web_Token_Cheat_Sheet
    cwe:
    - CWE-347
    - CWE-345
    capec:
    - CAPEC-633
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/06-Session_Management/10-JSON_Web_Tokens.md
  - sources/repos/CheatSheetSeries/cheatsheets/JSON_Web_Token_Cheat_Sheet.md
