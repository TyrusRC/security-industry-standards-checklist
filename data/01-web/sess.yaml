- id: WEB-SESS-029
  sheet: WEB
  category: SESS
  title: Check where the client stores session tokens
  objective: Finds tokens in localStorage or sessionStorage, which scripts can read.
  steps:
  - Log in and open DevTools > Application.
  - Look in localStorage, sessionStorage and IndexedDB for tokens.
  - Check for tokens in the page source.
  - Check if XSS could read them.
  example: 'DevTools console: Object.entries(localStorage).concat(Object.entries(sessionStorage))'
  expected: Session tokens are not stored in localStorage or sessionStorage. They are in cookies with HttpOnly.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-SESS-10
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-922
    - CWE-1004
