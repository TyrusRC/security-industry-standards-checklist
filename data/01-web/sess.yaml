- id: WEB-SESS-011
  sheet: WEB
  category: SESS
  title: Check that the session ID changes at login and privilege change
  objective: Finds session fixation, where an attacker sets the session ID before login.
  steps:
  - Open the login page and save the session cookie.
  - Log in and look at the cookie after login.
  - Send the old cookie value after login.
  - Set a chosen cookie value with a proxy and log in.
  - Repeat after re-authentication and after a role change.
  example: curl -sc a.txt https://target/login >/dev/null; curl -b a.txt -c b.txt -d 'u=t&p=t' https://target/login; diff a.txt b.txt
  expected: The application issues a new token at each login and re-authentication. The old token ends. It does not accept a session ID that the client chose.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-03
    asvs:
    - V7.2.4
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-384
    capec:
    - CAPEC-61
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
