- id: WEB-SESS-025
  sheet: WEB
  category: SESS
  title: Check re-authentication before changes to account recovery data
  objective: Finds changes of email, phone or MFA that need only the session cookie.
  steps:
  - Log in. Change the email address.
  - Check if the password or MFA is asked.
  - Repeat for phone number, MFA settings and recovery data.
  - Send the change request from a stolen cookie in another browser.
  example: curl -i -b 'session=<stolen>' -d 'email=attacker@evil.example' https://target/account/email
  expected: Changes to email, phone, MFA and recovery data need full re-authentication. Notices go to the old address.
  severity: High
  test_type: Manual
  level: ASVS L2
