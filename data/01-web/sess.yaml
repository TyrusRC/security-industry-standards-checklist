  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Session_Management_Cheat_Sheet.md
- id: WEB-SESS-005
  sheet: WEB
  category: SESS
  title: Check that sessions use generated tokens and not static keys
  objective: Finds static API keys or shared secrets used as session identifiers.
  steps:
  - Log in twice with the same account.
  - Compare the session tokens.
  - Look for long-lived values in the requests that never change.
  - Check that the token changes at each login.
  example: Burp Comparer on two login responses; grep -i 'api[_-]key' in the page source.
  expected: Each session has a new dynamically generated token. No static secret acts as a session token.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    asvs:
    - V7.2.2
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-798
    - CWE-330
