  - sources/repos/CheatSheetSeries/cheatsheets/Session_Management_Cheat_Sheet.md
- id: WEB-SESS-004
  sheet: WEB
  category: SESS
  title: Check that a trusted back end validates session tokens
  objective: Finds session checks done only in the client.
  steps:
  - Find where the application checks the session token.
  - Change or remove client-side checks with a proxy.
  - Send a request with a forged or empty token to a protected endpoint.
  example: 'curl -i -H ''Authorization: Bearer forged'' https://target/api/me ; curl -i https://target/api/me'
  expected: A trusted back-end service validates every session token. Client-side checks are not relied upon.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    asvs:
    - V7.2.1
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-602
    - CWE-603
    - CWE-287
