- id: WEB-SESS-008
  sheet: WEB
  category: SESS
  title: Check the Secure and HttpOnly cookie attributes
  objective: Finds session cookies that travel over HTTP or that scripts can read.
  steps:
  - List all Set-Cookie headers after login.
  - Make sure each session cookie has Secure and HttpOnly.
  - Request the HTTP version of the site and look for the cookie.
  - Read document.cookie in the console.
  example: 'curl -skI https://target/login -d ''u=t&p=t'' | grep -i set-cookie ; ZAP passive scan: Cookie without Secure/HttpOnly'
  expected: Session cookies have Secure and HttpOnly. They are never sent over HTTP and are not in document.cookie.
  severity: Medium
  test_type: Automated
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-02
    cheatsheet:
    - Session_Management_Cheat_Sheet
