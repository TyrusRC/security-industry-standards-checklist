- id: WEB-SESS-017
  sheet: WEB
  category: SESS
  title: Check server-side session termination at logout
  objective: Finds sessions that stay valid after logout.
  steps:
  - Save the session cookie. Log out.
  - Send a request with the old cookie to a protected page.
  - Use the Back button and look for private data.
  - For self-contained tokens, send the old token after logout.
  example: curl -i -b 'session=<old>' https://target/account after GET /logout.
  expected: After logout the session is ended on the server. Old reference tokens and self-contained tokens are rejected.
  severity: High
  test_type: Manual
  level: ASVS L1
