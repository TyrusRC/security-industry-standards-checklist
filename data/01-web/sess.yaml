- id: WEB-SESS-012
  sheet: WEB
  category: SESS
  title: Check that session IDs are not in URLs
  objective: Finds session IDs in URLs, hidden fields or accepted from unplanned places.
  steps:
  - Examine all links and forms for session IDs in the URL.
  - Send the session ID in a URL parameter instead of the cookie.
  - Send a POST login as a GET request.
  - Look at the Referer header sent to other sites.
  example: curl -i 'https://target/account?JSESSIONID=<valid-id>' ; curl -i 'https://target/login?user=t&password=t'
  expected: Session IDs travel only in cookies over HTTPS. The application ignores IDs from URLs and does not accept POST data in GET.
  severity: High
  test_type: Manual
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-04
    cheatsheet:
