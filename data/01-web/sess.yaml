- id: WEB-SESS-019
  sheet: WEB
  category: SESS
  title: Test the idle timeout
  objective: Finds missing or client-only idle timeouts.
  steps:
  - Log in and note the time.
  - 'Send requests with longer waits: 5, 15 and 30 minutes.'
  - Find the time when the server rejects the session.
  - Change client-side timestamps and cookie expiry values.
  - Replay the old session ID after the timeout.
  example: while sleep 300; do curl -s -o /dev/null -w '%{http_code}\n' -b 'session=<id>' https://target/account; done
  expected: The server ends the session after the documented inactivity time and rejects the old ID. Client values do not extend it.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-07
