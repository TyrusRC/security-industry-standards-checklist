- id: WEB-SESS-026
  sheet: WEB
  category: SESS
  title: Check step-up authentication for highly sensitive operations
  objective: Finds high-value operations that need no extra proof.
  steps:
  - 'List the most sensitive actions: payments, admin changes, key export.'
  - Run each action with a normal session.
  - Check for a second factor or secondary check.
  - 'Replay the confirmed request: it must not work a second time.'
  example: 'Burp Repeater: replay POST /transfer confirm=<otp> twice and change the amount between steps.'
  expected: Highly sensitive actions need a second check each time. The approval is bound to the shown data and works once.
  severity: High
  test_type: Manual
  level: ASVS L3
