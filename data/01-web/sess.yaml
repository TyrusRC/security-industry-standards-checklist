- id: WEB-SESS-010
  sheet: WEB
  category: SESS
  title: Check the Domain, Path and Expires scope of session cookies
  objective: Finds cookies shared with other apps or subdomains, and persistent session cookies.
  steps:
  - Read the Domain and Path attributes of the session cookie.
  - Check that Domain is not set, or is as narrow as possible.
  - List other apps on the same domain that can read the cookie.
  - Check Expires and Max-Age. A session cookie must not be persistent.
  - Close the browser and open it again.
  example: curl -sI https://target/login -d 'u=t&p=t' | grep -i 'domain=\|expires\|max-age'
  expected: Session cookies have a narrow scope and no persistent expiry. Other apps and subdomains do not get them.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-SESS-02
    - WSTG-SESS-01
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-1004
    - CWE-614
