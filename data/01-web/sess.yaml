- id: WEB-SESS-013
  sheet: WEB
  category: SESS
  title: Check session cookie exposure to network attackers and HSTS
  objective: Finds session cookies that leak in clear text, also to subdomains.
  steps:
  - Log in as the victim. Remove the cookies that have Secure from the jar.
  - Send the secure function again with the remaining cookies.
  - Check Strict-Transport-Security with includeSubDomains.
  - Check if a subdomain can read cookies with a Domain attribute.
  example: curl -sI https://target | grep -i strict-transport ; mitmproxy listen on :80 and redirect victim browser to http://sub.target
  expected: Session cookies are not sent over HTTP. HSTS covers the apex domain and all subdomains.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-SESS-09
    - WSTG-SESS-04
    cheatsheet:
    - Session_Management_Cheat_Sheet
