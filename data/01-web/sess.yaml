- id: WEB-SESS-014
  sheet: WEB
  category: SESS
  title: Check cache headers on responses with session data
  objective: Finds responses with session IDs that proxies or the browser may store.
  steps:
  - Collect responses that set or carry session IDs.
  - Look at the Cache-Control header.
  - Look for the same headers in HTTP/1.0 clients.
  - Check that Clear-Site-Data is sent at logout.
  example: curl -sI -b 'session=<id>' https://target/account | grep -i 'cache-control\|pragma\|clear-site-data'
  expected: 'Responses with session data have Cache-Control: no-store. Logout can clear stored data.'
  severity: Low
  test_type: Automated
