- id: WEB-SESS-001
  sheet: WEB
  category: SESS
  title: Read the documentation of timeouts and re-authentication
  objective: Finds missing or unjustified session timeout rules.
  preconditions:
  - Access to documentation and configuration.
  steps:
  - Get the session documentation.
  - Find the idle timeout and the absolute session lifetime.
  - Make sure the document explains why the values fit the risk.
  - Make sure it explains any difference from NIST SP 800-63B re-authentication rules.
  example: Compare the documented values with the framework setting, for example server.servlet.session.timeout or SESSION_COOKIE_AGE.
  expected: The idle timeout and the absolute lifetime are documented with a reason that fits the risk and with any deviation explained.
  severity: Low
  test_type: Config Review
  level: ASVS L2
  refs:
    asvs:
    - V7.1.1
    cheatsheet:
    - Session_Management_Cheat_Sheet
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Session_Management_Cheat_Sheet.md
- id: WEB-SESS-002
  sheet: WEB
  category: SESS
  title: Read the documentation of concurrent sessions
  objective: Finds missing rules for the number of parallel sessions.
  preconditions:
  - Access to documentation.
  steps:
  - Get the session documentation.
  - Find the maximum number of sessions for one account.
  - Find what happens when the maximum is reached.
  - Compare with the real behavior.
  example: Log in 10 times with curl -c jar<N>.txt and compare to the documented limit.
  expected: The maximum number of sessions and the action at the limit are documented and match the behavior.
  severity: Low
  test_type: Config Review
  level: ASVS L2
  refs:
    wstg:
    - WSTG-SESS-11
    asvs:
    - V7.1.2
    cheatsheet:
    - Session_Management_Cheat_Sheet
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/06-Session_Management/11-Concurrent_Sessions.md
  - sources/repos/CheatSheetSeries/cheatsheets/Session_Management_Cheat_Sheet.md
- id: WEB-SESS-003
  sheet: WEB
  category: SESS
  title: Read the documentation of federated session control
  objective: Finds missing rules for session lifetime and logout between SSO systems.
  preconditions:
  - Access to documentation.
  steps:
  - List all systems that create sessions in the SSO setup.
  - Get the documentation of how lifetimes and logout are linked.
  - Make sure it names the events that need re-authentication.
  example: 'Review IdP and SP configuration: session lifetime, SLO endpoints and back-channel logout URLs.'
  expected: All session-creating systems are documented with the way they coordinate lifetime, logout and re-authentication.
  severity: Low
  test_type: Config Review
  level: ASVS L2
  refs:
    wstg:
    - WSTG-SESS-06
    asvs:
    - V7.1.3
    cheatsheet:
    - Session_Management_Cheat_Sheet
