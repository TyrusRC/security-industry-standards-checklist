- id: WEB-SESS-023
  sheet: WEB
  category: SESS
  title: Check that administrators can end user sessions
  objective: Finds missing admin control to end sessions of one or all users.
  steps:
  - Log in as administrator.
  - End the sessions of one user. Test that user's cookie.
  - End all sessions. Test several cookies.
  - Check that a normal user cannot call these functions.
  example: curl -X POST https://target/admin/sessions/revoke -b 'session=<admin>' -d 'user=42'
  expected: Administrators can end the sessions of one user or all users, and the effect is immediate. Other roles cannot.
  severity: Low
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V7.4.5
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
