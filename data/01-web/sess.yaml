- id: WEB-SESS-016
  sheet: WEB
  category: SESS
  title: Check the logout button on all pages
  objective: Finds pages without a visible logout function.
  steps:
  - Open every authenticated page type.
  - Look for the logout button without scrolling.
  - Check that it is in the same place on all pages.
  example: 'Crawl with ZAP spider and compare each page for a /logout link: grep -L logout *.html'
