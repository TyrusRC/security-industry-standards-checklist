- id: WEB-SESS-015
  sheet: WEB
  category: SESS
  title: Test session puzzling and session variable overload
  objective: Finds session variables used for more than one purpose, which skips steps in a flow.
  steps:
  - Map the session variables set by public pages such as password recovery.
  - Call a recovery entry point that sets a user name in the session.
  - Request a protected page directly.
  - Skip steps of multi-step flows.
  example: 'Burp: GET /forgot?user=admin (do not finish), then GET /admin/dashboard with the same cookie.'
  expected: Each session variable has one purpose. Pages cannot be reached by setting variables in another flow.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-SESS-08
    cheatsheet:
