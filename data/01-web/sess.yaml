- id: WEB-SESS-009
  sheet: WEB
  category: SESS
  title: Check the SameSite attribute and cookie prefixes
  objective: Finds missing SameSite and __Host- protection on session cookies.
  steps:
  - Look at the SameSite value of each session cookie.
  - 'Check the prefix: __Host- is best, __Secure- if subdomains share cookies.'
  - Try to set a cookie with the same name from a subdomain.
  - Check the browser behavior with the attribute missing.
  example: 'Expected header: Set-Cookie: __Host-SID=<token>; Path=/; Secure; HttpOnly; SameSite=Strict'
  expected: Session cookies use SameSite=Lax or Strict and the __Host- prefix when possible. A subdomain cannot overwrite them.
  severity: Medium
  test_type: Manual
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-SESS-02
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-1275
    - CWE-565
