- id: WEB-SESS-007
  sheet: WEB
  category: SESS
  title: Check the cookie structure and manipulation of session data
  objective: Finds cookies that hold readable or editable data such as roles and user names.
  steps:
  - Collect all cookies and map each to its function.
  - 'Decode each value: Base64, hex, URL and hash forms.'
  - Change non-signed values, such as IsAdmin=No, and send the request.
  - Send unusual characters and a very long cookie.
  - Make sure the cookie name does not show the framework.
  example: 'echo ''<cookie>'' | base64 -d ; Burp Repeater: Cookie: IsAdmin=Yes'
  expected: Cookies hold no sensitive data in clear text. Changed values are rejected. Cookie names do not reveal the technology.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-SESS-01
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-565
