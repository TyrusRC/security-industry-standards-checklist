- id: WEB-SESS-021
  sheet: WEB
  category: SESS
  title: Check that disabling an account ends its sessions
  objective: Finds active sessions that survive when an account is disabled or deleted.
  steps:
  - Log in as a test user and keep the session cookie.
  - As administrator, disable the user, then delete another test user the same way.
  - Send requests with the saved cookies.
  - Test API tokens and refresh tokens too.
  example: curl -i -b 'session=<user>' https://target/api/me after PATCH /admin/users/42 {"active":false}
  expected: All sessions and tokens of a disabled or deleted account stop working at once.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    asvs:
    - V7.4.2
    cheatsheet:
    - Session_Management_Cheat_Sheet
    cwe:
    - CWE-287
