- id: WEB-SESS-028
  sheet: WEB
  category: SESS
  title: Test concurrent sessions and session limits
  objective: Finds unlimited parallel sessions or old sessions that stay valid.
  steps:
  - Log in 100 times with one account and save each cookie.
  - Test the first cookie.
  - Log in from different IP addresses and places.
  - Compare the result with the documented limit.
  example: for i in $(seq 100); do curl -s -c j$i.txt -d 'u=t&p=t' https://target/login -o /dev/null; done; curl -b j1.txt https://target/account -i
  expected: The application limits active sessions as documented and ends older sessions at the limit. Unusual logins cause a notice.
  severity: Low
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-SESS-11
    asvs:
    - V7.1.2
    cheatsheet:
