- id: WEB-SESS-022
  sheet: WEB
  category: SESS
  title: Check the option to end other sessions after a factor change
  objective: Finds password or MFA changes that leave other sessions open.
  steps:
  - Log in on two browsers.
  - Change the password or MFA setting on browser 1.
  - Look for an option to end other sessions.
  - Test the session of browser 2.
  example: 'Browser 2: curl -b ''session=<old>'' https://target/account after the change in browser 1.'
  expected: After a change of any authentication factor the user can end all other sessions. Reset and recovery do the same.
  severity: Medium
  test_type: Manual
  level: ASVS L2
  refs:
    asvs:
    - V7.4.3
    cheatsheet:
