- id: WEB-SESS-027
  sheet: WEB
  category: SESS
  title: Check that a session needs user consent or action
  objective: Finds sessions that start with no user action.
  steps:
  - Open a link to the application while the IdP session is active.
  - Check if the application creates a session without a click.
  - Open the application from a cross-site link and look at the result.
  example: Open https://target/sso/start in a fresh tab from a cross-site page and watch for Set-Cookie without a click.
  expected: Sessions start only after a user action or consent. No silent session creation exists.
  severity: Low
