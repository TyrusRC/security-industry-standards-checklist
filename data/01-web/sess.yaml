  - sources/repos/CheatSheetSeries/cheatsheets/Session_Management_Cheat_Sheet.md
- id: WEB-SESS-006
  sheet: WEB
  category: SESS
  title: Check session ID strength and randomness
  objective: Finds predictable or short session IDs.
  steps:
  - Collect 5000 session IDs with new sessions.
  - Decode the IDs and look for user data, time or counters.
  - Run an entropy analysis.
  - 'Check the length: at least 128 bits of entropy for reference tokens.'
  - Change a few characters of a valid ID and test it.
  example: 'Burp Sequencer: live capture of Set-Cookie JSESSIONID, 5000 samples, then FIPS tests.'
  expected: Session IDs are unique, come from a CSPRNG, have at least 128 bits of entropy, and hold no meaning.
  severity: High
  test_type: Automated
  level: ASVS L1
