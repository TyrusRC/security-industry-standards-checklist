- id: WEB-SESS-030
  sheet: WEB
  category: SESS
  title: Test state-changing requests for cross-site request forgery
  objective: Finds actions that a third-party page can trigger with the victim session cookie.
  preconditions:
  - Test environment.
  steps:
  - List the state-changing requests that rely only on cookies.
  - Check the SameSite attribute of the session cookie.
  - Replay a request without the anti-CSRF token and with a token of another user.
  - Build a test page that sends the request from another site, in a test environment.
  - Test JSON endpoints with a form content type.
  example: 'ZAP: Generate Anti-CSRF Test Form on the request, host it on a second origin and open it in the victim session.'
  expected: State-changing requests fail without a valid anti-CSRF token. The request origin and cookie attributes add defense.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-SESS-05
    cwe:
    - CWE-352
    capec:
    - CAPEC-62
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/06-Session_Management/05-Cross_Site_Request_Forgery.md
  notes: CSRF prevention has its own cheat sheet that is outside slice WEB-B. Remove this test if another slice already covers WSTG-SESS-05.
