- id: WEB-EMAIL-002
  sheet: WEB
  category: EMAIL
  title: Test email ownership verification and the email change workflow
  objective: Find flows that let an attacker use or take over an account with an email address that the attacker does not own.
  steps:
  - Register and try to use the account before you open the verification link.
  - Examine the verification tokens for randomness, single use, and expiry.
  - Change the email address and check that the new address needs confirmation before it becomes active.
  - Check that the old address gets a notice and that re-authentication is needed.
  - Change the address in the request to another user address and look at the result.
  - Look in logs for full addresses and for tokens in URLs.
  example: Burp Repeater on POST /account/email; compare token values from three registrations; open the same link twice
  expected: The account stays inactive until the address is verified. Tokens are random, single-use and expire. A change needs re-authentication and confirmation, and the old address gets a notice.
  severity: High
  test_type:
  - Manual
  refs:
