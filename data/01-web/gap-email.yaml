- id: WEB-EMAIL-001
  sheet: WEB
  category: EMAIL
  title: Test email address normalization for duplicate and look-alike accounts
  objective: Find identity flows that treat one email address in different ways, which allows duplicate, merged or spoofed accounts.
  steps:
  - Register an account with a mixed-case domain and then register again with a lowercase domain.
  - Register with a different case in the local part and with plus tags and dots.
  - Register with a Cyrillic or other look-alike character in the local part and in the domain.
  - Use the variants in login, password reset and account linking and look at which account answers.
  - Make sure the stored address keeps the original form and the comparison policy is the same in every flow.
  example: user@Example.com vs user@example.com; usеr@example.com (Cyrillic e); user+tag@example.com; xn-- punycode domain
  expected: The application applies one documented comparison policy in all flows. Look-alike and equivalent addresses cannot take over or merge with another account.
  severity: High
  test_type:
  - Manual
  refs:
    owasp_top10:
    - A07:2025
    cheatsheet:
    - Email_Validation_and_Verification_Cheat_Sheet
    wstg:
    - WSTG-IDNT-04
    cwe:
    - CWE-289
    - CWE-180
    other:
    - 'OWASP DevGuide web app checklist: 06-digital-identity.md'
  sources_read:
