- id: WEB-WEBHOOK-004
  sheet: WEB
  category: WEBHOOK
  title: 'Test webhook endpoint hardening: method, size, content type and rate'
  objective: Find webhook endpoints that accept bad methods, large bodies or floods, or that fail with internal details.
  steps:
  - Send GET, PUT and DELETE requests to the endpoint and look for 405.
  - Send an oversized body and a body with an unexpected Content-Type.
  - Send a signed body that breaks the schema, and a payload with injection strings in the fields.
  - Send a burst of requests and look for 429 with Retry-After.
  - Look at error responses for stack traces.
  - Make sure a failing event goes to a dead-letter queue and raises an alert.
  example: curl -X GET https://target/webhooks/pay; seq 1 200 | xargs -P20 -I{} curl -s -o /dev/null -w "%{http_code}\n" -X POST https://target/webhooks/pay
  expected: The endpoint accepts POST only, with limits on size and type, and validates the schema. It limits the rate, returns generic errors, and queues failed events.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A06:2025
    - A10:2025
    cheatsheet:
    - Webhook_Security_Cheat_Sheet
    asvs:
