- id: WEB-DBSC-003
  sheet: WEB
  category: DBSC
  title: Check the DBSC registration and refresh endpoints
  objective: Find a Device Bound Session Credentials server that accepts old challenges, unsigned refreshes or keys that do not belong to the session.
  preconditions:
  - The site supports Device Bound Session Credentials. If it does not, record the test as not applicable.
  - A browser with DBSC support and a proxy to capture the registration and refresh requests.
  steps:
  - Log in and look for the Secure-Session-Registration header in the login response.
  - Capture the registration request. Make sure the server saves the public key with the new session identifier.
  - Wait for the short-lived bound cookie to expire. Capture the refresh request and the Secure-Session-Challenge header.
  - Send a refresh request with no Secure-Session-Response header. Make sure the server issues no new bound cookie.
  - Send a refresh request that signs an old challenge. Make sure the server rejects the stale challenge.
  - Send a refresh request that is signed with a different key. Make sure the server rejects it.
  - Make sure the refresh endpoint needs the Sec-Secure-Session-Id header and has a narrow CORS policy.
  - Make sure the refresh endpoint refuses to be embedded with X-Frame-Options or Cross-Origin-Resource-Policy.
  - Make sure the bound cookie lifetime is short.
  example: 'Burp Repeater on POST /refresh: remove the Secure-Session-Response header; replay a signed response from a previous challenge; sign with a new ES256 key'
  expected: The server issues a bound cookie only for a fresh challenge signed with the registered key. A stolen cookie stops working after its short lifetime on another device.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L3
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-SESS-09
    cheatsheet:
    - Cookie_Theft_Mitigation_Cheat_Sheet
    cwe:
    - CWE-294
    - CWE-1472
    capec:
    - CAPEC-60
    other:
    - 'W3C Device Bound Session Credentials: https://w3c.github.io/webappsec-dbsc/'
  sources_read:
