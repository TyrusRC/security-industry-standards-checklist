  - sources/repos/Top10/2025/docs/en/A02_2025-Security_Misconfiguration.md
- id: WEB-ARCH-004
  sheet: WEB
  category: ARCH
  title: Make sure the server can contact only an allowlist of external systems
  objective: Find servers that can send requests to any destination and so allow SSRF and data theft.
  steps:
  - Find the egress allowlist at the application, web server or firewall level.
  - Use a feature that fetches a URL and give it an internal address and a non-listed host.
  - Try a redirect from an allowed host to a blocked host.
  - From the server shell, in a test system, try to reach a non-listed external host.
  example: curl -s 'https://example.com/fetch?url=http://169.254.169.254/latest/meta-data/'; curl -s 'https://example.com/fetch?url=https://allowed.example/redirect?to=http://127.0.0.1'
  expected: The server reaches only allowlisted systems. Requests to others fail.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    asvs:
    - V13.2.4
    - V13.2.5
    - V15.3.2
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-918
    - CWE-601
    capec:
    - CAPEC-212
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A02_2025-Security_Misconfiguration.md
- id: WEB-ARCH-005
  sheet: WEB
  category: ARCH
  title: Make sure responses return only the fields that the client needs
  objective: Find objects that expose internal or sensitive fields that the client does not need.
  steps:
  - Compare the fields shown in the UI with the fields in the API or page response.
  - Look for password hashes, tokens, internal IDs, role flags and personal data.
  - Compare responses for different roles and for unauthenticated requests.
  - Check nested objects and GraphQL fields.
  - Look in the code for DTOs or field selection on the server.
  example: jq 'keys' response.json; Burp Logger++ filter on JSON; compare with UI
  expected: Responses contain only the fields required by the function. The server selects fields, not the client.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: ASVS L1
  refs:
    asvs:
    - V15.3.1
    wstg:
    - WSTG-APIT-03
    cwe:
    - CWE-213
    - CWE-200
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/12-API_Testing/03-Excessive_Data_Exposure.md
- id: WEB-ARCH-006
  sheet: WEB
  category: ARCH
  title: Test for mass assignment on create and update actions
  objective: Find actions that bind extra request fields to protected object properties such as role or owner.
  steps:
  - Find create and update requests that send a JSON, XML or form body.
  - Add extra fields such as role, isAdmin, balance, ownerId and id.
  - Send the request and read the object back.
  - Check the code for an allowlist of fields or a DTO per action.
  example: 'curl -s -X PATCH https://example.com/api/me -H ''Content-Type: application/json'' -d ''{"name":"x","role":"admin","isAdmin":true}'''
  expected: Fields that are not part of the action are ignored or rejected. Protected properties do not change.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
  refs:
    asvs:
    - V15.3.3
    wstg:
    - WSTG-APIT-03
    owasp_top10:
    - A08:2025
    cheatsheet:
    - Mass_Assignment_Cheat_Sheet
    cwe:
    - CWE-915
    - CWE-235
    capec:
    - CAPEC-153
  sources_read:
