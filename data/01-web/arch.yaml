- id: WEB-ARCH-007
  sheet: WEB
  category: ARCH
  title: Check strict typing and strict comparison to stop type confusion
  objective: Find loose type handling that leads to type juggling and logic bypass.
  steps:
  - Send arrays, objects, null, booleans and numeric strings where a string is expected.
  - Send 0, "0", "0e123" and true in comparison fields such as tokens and passwords.
  - Look in the code for loose comparison operators on security values.
  - Check that input types are enforced before use.
  example: 'curl -s https://example.com/login -H ''Content-Type: application/json'' -d ''{"user":"admin","password":true}''; semgrep --config p/php'
  expected: The application rejects wrong types and uses strict comparison for security decisions.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
  refs:
    asvs:
    - V15.3.5
    owasp_top10:
    - A10:2025
    cwe:
    - CWE-754
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A10_2025-Mishandling_of_Exceptional_Conditions.md
- id: WEB-ARCH-008
  sheet: WEB
  category: ARCH
  title: Test JavaScript code for prototype pollution
  objective: Find merge and assignment code that lets a user set properties of Object.prototype.
  steps:
  - Send JSON with __proto__, constructor and prototype keys to endpoints that merge input.
  - Send the same in query strings and form fields.
  - Check whether a later request shows a changed property.
  - Search the code for recursive merge functions and object literals used as maps.
  example: 'curl -s -X POST https://example.com/api/settings -H ''Content-Type: application/json'' -d ''{"__proto__":{"polluted":"yes"}}''; ppfuzz or DOM Invader'
  expected: User input cannot change the prototype. The code uses Map or Set, or safe merge functions.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
  refs:
    asvs:
    - V15.3.6
    cwe:
    - CWE-1321
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-ARCH-009
  sheet: WEB
  category: ARCH
  title: Test for HTTP parameter pollution
  objective: Find parameters that the application, proxy and WAF read in different ways.
  steps:
  - Send the same parameter twice in the query string, and in the body and the query together.
  - Send the same name in a cookie and a header.
  - Look at which value each component uses and compare the results.
  - Check that the framework takes one defined source.
  example: curl -s 'https://example.com/transfer?to=alice&to=mallory'; curl -s -d 'amount=1&amount=1000' https://example.com/pay
  expected: The application handles duplicate parameters in a defined way, and a WAF or proxy sees the same value.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    asvs:
    - V15.3.7
    cwe:
    - CWE-235
    capec:
    - CAPEC-153
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-ARCH-010
  sheet: WEB
  category: ARCH
  title: Review documented resource-demanding functions and the defenses against overload
  objective: Find expensive functions with no limits that an attacker can use to take the service down.
  preconditions:
  - Do not run load tests on production. Get written approval.
  steps:
  - Ask for the list of functions that need much time or memory, for example search, export, upload and report.
  - 'Check the documented defenses: rate limits, quotas, queues, timeouts and caching.'
  - Send a few requests at a normal rate and increase the load slowly on a test system.
  - Test large uploads, large request bodies and slow connections.
  - Check that the response time stays below the time-out of the client.
  example: slowhttptest -c 1000 -H -u https://example.com/; k6 run load.js; curl --limit-rate 10 -T bigfile https://example.com/upload
  expected: Resource-demanding functions are documented and protected by limits. The service stays available under load.
  severity: Medium
  test_type:
  - Manual
  - Automated
  level: ASVS L2
  refs:
    asvs:
    - V15.1.3
    - V15.2.2
    owasp_top10:
    - A10:2025
    cheatsheet:
    - Denial_of_Service_Cheat_Sheet
    cwe:
    - CWE-400
    - CWE-770
    - CWE-799
    capec:
    - CAPEC-125
    - CAPEC-130
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A10_2025-Mishandling_of_Exceptional_Conditions.md
