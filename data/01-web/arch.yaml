- id: WEB-ARCH-011
  sheet: WEB
  category: ARCH
  title: Review shared objects in multi-threaded code for thread safety
  objective: Find race conditions on caches, files and in-memory objects that more than one thread uses.
  steps:
  - 'Find shared mutable objects: caches, singletons, static fields and files.'
  - Check that thread-safe types or locks protect them.
  - Send many parallel requests that change the same object.
  - Run a race detector or thread sanitizer on the tests.
  example: go test -race ./...; java -XX:+UnlockDiagnosticVMOptions with thread-safety analyzers; Burp Turbo Intruder parallel requests
  expected: Shared objects are accessed safely. Parallel requests do not corrupt data.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: ASVS L3
  refs:
    asvs:
    - V15.4.1
    cwe:
    - CWE-362
    capec:
    - CAPEC-26
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-ARCH-012
  sheet: WEB
  category: ARCH
  title: Test for time-of-check to time-of-use gaps
  objective: Find checks of state or permission that are not atomic with the action that follows.
  steps:
  - Find checks of existence, permission or balance followed by an action.
  - Send the same request many times in parallel, for example a coupon or a transfer.
  - Look for results that break the check, such as a second use.
  - Check that the check and action are one atomic operation, for example one database transaction or file operation.
  example: Burp Turbo Intruder single-packet attack; curl --parallel --parallel-max 30 -d 'code=SAVE10' https://example.com/redeem?[1-30]
  expected: The check and the action are atomic. Parallel requests cannot break the check.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: ASVS L3
  refs:
    asvs:
    - V15.4.2
    cwe:
    - CWE-367
    capec:
    - CAPEC-26
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-ARCH-013
  sheet: WEB
  category: ARCH
  title: Review lock use and fair resource allocation against deadlock and starvation
  objective: Find locks that cause deadlock and pools that starve low-priority work.
  steps:
  - Review the code for lock order, retry loops and locks that outside code can change.
  - Check that lock logic stays in the code that owns the resource.
  - Check thread pool settings and queue priorities.
  - Load the system with mixed work and look for tasks that never run.
  example: jstack <pid> | grep -A5 'deadlock'; py-spy dump --pid <pid>
  expected: Locks are used in a consistent order and are not stuck. Low-priority work finishes in a reasonable time.
  severity: Low
  test_type:
  - Code Review
  level: ASVS L3
  refs:
    asvs:
    - V15.4.3
    - V15.4.4
    cwe:
    - CWE-833
    - CWE-400
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
