- id: WEB-ARCH-001
  sheet: WEB
  category: ARCH
  title: Review the documented communication needs and external connections
  objective: Find undocumented external services and places where users can set an external location the server connects to.
  steps:
  - Ask for the document of all communication needs, including external services.
  - List the outbound hosts seen in traffic captures or egress logs.
  - Find features where a user supplies a URL, host or webhook.
  - Compare the list with the document.
  example: tcpdump -i any -nn 'dst net not 10.0.0.0/8' -w egress.pcap; review egress firewall logs
  expected: All external services and user-supplied destinations are documented.
  severity: Low
  test_type:
  - Manual
  level: ASVS L2
  refs:
    asvs:
    - V13.1.1
    wstg:
    - WSTG-INFO-10
    owasp_top10:
    - A02:2025
    cheatsheet:
    - Attack_Surface_Analysis_Cheat_Sheet
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/01-Information_Gathering/10-Map_Application_Architecture.md
  - sources/repos/Top10/2025/docs/en/A02_2025-Security_Misconfiguration.md
  - sources/repos/CheatSheetSeries/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.md
- id: WEB-ARCH-002
  sheet: WEB
  category: ARCH
  title: Review connection limits and resource management for each backend service
  objective: Find missing limits, time-outs and retry rules that cause denial of service when a backend is slow.
  preconditions:
  - Do not run on production.
  steps:
  - Ask for the documented connection pool limits, time-outs and retry rules per service.
  - Read the configuration of each service client and compare it with the document.
  - Slow down one backend in a test system and watch the application behavior.
  - Fill the connection pool in a test system and check for graceful handling and recovery.
  example: toxiproxy-cli toxic add -t latency -a latency=10000 db; compare pool settings in app config
  expected: Documented limits exist and match the configuration. The application degrades safely and recovers.
  severity: Low
  test_type:
  - Manual
  - Config Review
  level: ASVS L3
  refs:
    asvs:
    - V13.1.2
    - V13.1.3
    - V13.2.6
    owasp_top10:
    - A10:2025
    cwe:
    - CWE-400
    - CWE-770
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A10_2025-Mishandling_of_Exceptional_Conditions.md
- id: WEB-ARCH-003
  sheet: WEB
  category: ARCH
  title: Make sure backend components authenticate with individual, least-privilege accounts
  objective: Find shared, uncontrolled or default service credentials, and over-privileged service accounts.
  steps:
  - 'List service-to-service links: APIs, middleware, databases, queues.'
  - 'Check how each link authenticates: service account, short-term token, or certificate.'
  - Check that no link uses a shared static password or default credential such as root/root.
  - Review the privileges of each account and compare them with what the link needs.
  example: psql -c '\du'; kubectl auth can-i --list --as=system:serviceaccount:ns:sa; try admin/admin on the management port
  expected: Each link uses its own account or token with least privilege. No default credentials work.
  severity: High
  test_type:
  - Config Review
  - Manual
  level: ASVS L2
  refs:
    asvs:
    - V13.2.1
    - V13.2.2
    - V13.2.3
    owasp_top10:
    - A02:2025
    cwe:
    - CWE-1188
    - CWE-798
    - CWE-250
    capec:
    - CAPEC-112
  sources_read:
