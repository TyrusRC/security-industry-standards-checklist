  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-TENANT-005
  sheet: WEB
  category: TENANT
  title: Test tenant offboarding, data deletion and backup restore
  objective: Find tenant lifecycle gaps that leave access or data after offboarding, or that mix tenants in a restore.
  preconditions:
  - Two test tenants and a backup test plan.
  steps:
  - Offboard a test tenant.
  - Make sure the sessions, API keys and tokens of the tenant stop working at once.
  - Look for tenant data left in caches, object versions, exports and replicas.
  - Check that deletion of the tenant prefix does not match other tenants, such as tenants/acme and tenants/acme-corp.
  - Restore one tenant from a shared backup and look for the data of other tenants.
  - Try a restore request as an unauthorized operator.
  example: Use the tenant admin API to delete tenant "acme" in a test environment; then replay its API key and list the storage prefixes
  expected: Offboarding stops all tenant access and removes data by the retention policy. Other tenants are not affected. A restore adds only data of the target tenant and needs authorization.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    cheatsheet:
    - Multi_Tenant_Security_Cheat_Sheet
    cwe:
    - CWE-284
    - CWE-459
    asvs:
    - V8.4.1
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-TENANT-006
  sheet: WEB
  category: TENANT
  title: Test tenant-aware rate limits and shared resource quotas
  objective: Find shared services where one tenant can use all capacity and slow down the other tenants.
  steps:
  - 'Find the shared resources: API, queue, worker pool, connection pool and storage.'
  - Check if the limits have the tenant identity as one dimension.
  - Send a high request rate as tenant A and measure the response time for tenant B.
  - Make sure the limit counters work across all application instances.
  - Make sure throttled responses use HTTP 429 and Retry-After.
  example: ab or k6 with tenant A token at the limit rate while tenant B runs a steady request every second; compare latency
  expected: The tenant A load does not change the service for tenant B. Limits are per tenant and apply on every instance.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A06:2025
    cheatsheet:
    - Multi_Tenant_Security_Cheat_Sheet
    cwe:
    - CWE-400
    - CWE-770
    asvs:
    - V8.4.1
