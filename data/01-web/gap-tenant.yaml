- id: WEB-TENANT-003
  sheet: WEB
  category: TENANT
  title: Test background jobs and queue messages for tenant context
  objective: Find asynchronous work that runs with a tenant identifier from the message that nobody authorized.
  steps:
  - List the queues and job types that process tenant data.
  - Send a message to the queue with the tenant identifier of another tenant, in a test environment.
  - Check if the consumer authenticates the producer and authorizes the action again.
  - Look at idempotency keys and retry state and check that they are scoped by tenant.
  - Flood the queue as one tenant and measure the delay for another tenant.
  example: Publish a job JSON with a changed tenant_id to the test broker; compare the job result and the audit log
  expected: The consumer trusts only authenticated producers and checks the action again. Idempotency keys and retries are per tenant. One tenant cannot starve the others.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    cheatsheet:
    - Multi_Tenant_Security_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-400
    asvs:
    - V8.4.1
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-TENANT-004
  sheet: WEB
  category: TENANT
  title: Test file storage and signed URLs for tenant isolation
  objective: Find object storage where one tenant can read, change or delete the objects of another tenant.
  steps:
  - List how tenant files are named and which bucket, key prefix or policy keeps tenants apart.
  - Request the object key of tenant A as a user of tenant B.
  - Change the tenant part of a path with ../ and with a similar tenant name prefix.
  - Make sure a signed URL covers one object, one action, and a short time.
  - Check if the client tenant metadata is trusted for authorization.
  example: curl -b "session=<tenantB>" https://target/files/tenants/acme/report.pdf ; try tenants/acme-corp/ and tenants/acme/../acme-corp/
  expected: The server authorizes the exact tenant, object and action for each request. Prefixes are not a boundary. Signed URLs are narrow and expire.
  severity: High
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    cheatsheet:
    - Multi_Tenant_Security_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-22
    asvs:
    - V8.4.1
  sources_read:
