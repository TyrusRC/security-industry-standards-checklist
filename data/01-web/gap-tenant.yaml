- id: WEB-TENANT-001
  sheet: WEB
  category: TENANT
  title: Test database tenant isolation with the request role and pooled connections
  objective: Find shared-table tenant isolation that fails because of a privileged database role, missing policies or a reused connection.
  preconditions:
  - Two tenants with test data.
  - Read access to the database role settings.
  steps:
  - List the tables that hold tenant data and the isolation method for each, such as row-level security.
  - Read the database role of the request path. Make sure it is no superuser and has no BYPASSRLS attribute.
  - Make sure every tenant table has a policy that is enforced.
  - Send requests for tenant A and then tenant B over the same pooled connection.
  - Send a request with no tenant context and look at the result.
  example: 'psql: SELECT rolname,rolsuper,rolbypassrls FROM pg_roles WHERE rolname=''<app_role>''; SELECT relname,relrowsecurity,relforcerowsecurity FROM pg_class WHERE relname IN (<tables>)'
  expected: The request role cannot bypass row security. Each tenant table has an enforced policy. Tenant context does not carry over between pooled requests, and a missing context denies access.
  severity: Critical
  test_type:
  - Config Review
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    cheatsheet:
    - Multi_Tenant_Security_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-284
    asvs:
    - V8.4.1
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-TENANT-002
  sheet: WEB
  category: TENANT
  title: Test cache keys for tenant and user scope
  objective: Find application caches that serve one tenant data to another tenant because the key has no tenant context.
  steps:
  - List the caches in use and the key format of each.
  - Make sure each key of tenant data holds the tenant identifier and the other inputs that change the result.
  - Fill the cache as user A of tenant A, then request the same object ID as tenant B.
  - Use the same user ID in two tenants and compare the cached results.
  - Make sure the request is authorized before a cached value is read.
  example: redis-cli --scan --pattern "*" | head; compare keys such as prefs:42 and tenantA:prefs:42
  expected: Keys of tenant data hold the tenant identifier. A cached value never goes to another tenant. Shared entries live in a documented global namespace.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    cheatsheet:
    - Multi_Tenant_Security_Cheat_Sheet
    - Web_Cache_Security_Cheat_Sheet
    cwe:
    - CWE-524
    - CWE-639
    asvs:
    - V8.4.1
