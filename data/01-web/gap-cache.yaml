- id: WEB-CACHE-001
  sheet: WEB
  category: CACHE
  title: Test unkeyed request inputs for web cache poisoning
  objective: Find request inputs that change a cached response but are not part of the cache key.
  preconditions:
  - Do not run on production.
  steps:
  - Find cached pages with the response headers Age, X-Cache or CF-Cache-Status.
  - Add a cache buster to the URL so that only you see the test entry.
  - Send unkeyed inputs one at a time, such as X-Forwarded-Host, X-Forwarded-Scheme and a body on a GET request.
  - Look for the value in links, redirects, JSON and response headers.
  - Request the same URL without the extra input and look for the changed response.
  - Remove the test entry from the cache after the test.
  example: 'curl -s "https://target/?cb=123" -H "X-Forwarded-Host: evil.example"; then curl -s "https://target/?cb=123" | grep evil; Burp Param Miner'
  expected: Unkeyed inputs do not change a cacheable response. Forwarded headers are trusted only from the proxy, and the cache key holds every input that changes the output.
  severity: High
  test_type:
  - Manual
  - Automated
  refs:
