- id: WEB-CACHE-002
  sheet: WEB
  category: CACHE
  title: Review CDN and proxy cache rules against the origin cache policy
  objective: Find CDN or proxy rules that override origin headers and cache sensitive, error or redirect responses.
  steps:
  - List the cache rules of the CDN and reverse proxy.
  - Look for rules that override Cache-Control, or that cache by file extension, path or status code.
  - Check the cache policy of error pages, redirects and authentication responses.
  - 'Make sure Vary: Cookie is not the only control for personalized pages.'
  - Make sure the URL normalization is the same at the CDN, the proxy and the origin.
  - Test the purge function for one key or one route group.
  example: CDN configuration export; curl -sI of /login, /404, /redirect and /account with and without cookies
  expected: Cache rules follow an allowlist of routes. No rule makes a personalized response public. Purge works for a narrow scope.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  level: ASVS L2
