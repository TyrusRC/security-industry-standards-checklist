- id: WEB-PWD-019
  sheet: WEB
  category: PWD
  title: Test reset link for Host header injection and token leak
  objective: Finds reset links built from the Host header and tokens that leak by Referer.
  preconditions:
  - Test mailbox.
  steps:
  - Send the reset request with a changed Host or X-Forwarded-Host header.
  - Read the link in the mail.
  - Open the reset link and look at requests to other domains.
  - Look for the token in the Referer header and for a Referrer-Policy header.
  - Change a user ID parameter in the reset link.
  example: 'curl -i https://target/forgot -H ''Host: evil.example'' -H ''X-Forwarded-Host: evil.example'' -d ''email=victim@test.example'''
  expected: Reset links use a fixed trusted host and HTTPS. The reset page sends no token to third parties and sets Referrer-Policy. The token alone selects the user.
  severity: High
  test_type: Manual
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-09
    cheatsheet:
    - Forgot_Password_Cheat_Sheet
    cwe:
    - CWE-640
    - CWE-200
    - CWE-598
