- id: WEB-PWD-011
  sheet: WEB
  category: PWD
  title: Check that the password policy is the same everywhere
  objective: Finds weaker password rules in reset, change or admin flows.
  steps:
  - Set a weak password at registration and note the error.
  - Try the same password on change, reset and admin create-user.
  - Try to reuse the last password and change the password five times in a row.
  - Try to use the user name in the password.
  example: Run the same short password with Burp Intruder against /register, /account/password and /reset/confirm.
  expected: Registration, change, reset and admin flows apply the same rules. The server enforces them.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-07
    - WSTG-ATHN-09
    cheatsheet:
    - Authentication_Cheat_Sheet
    - Forgot_Password_Cheat_Sheet
    cwe:
    - CWE-521
