- id: WEB-PWD-012
  sheet: WEB
  category: PWD
  title: Check how passwords are stored
  objective: Finds plain text, reversible or fast-hash storage of passwords.
  preconditions:
  - Read access to code or database.
  steps:
  - Read the code or database for the password column.
  - Make sure it holds a hash made with Argon2id, scrypt, bcrypt or PBKDF2.
  - Check the cost settings against the cheat sheet minimum.
  - Make sure each hash has its own random salt.
  - Look for logs and backups with plain passwords.
  example: SELECT password FROM users LIMIT 3; hashid '<hash>'; grep -rn 'md5(\|sha1(\|bcrypt\|argon2' src/
  expected: Passwords are hashed with a slow, salted algorithm at the recommended cost. No plain text or reversible form exists.
  severity: High
  test_type: Code Review
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-04
    cheatsheet:
    - Password_Storage_Cheat_Sheet
    cwe:
    - CWE-256
    - CWE-257
    - CWE-916
    - CWE-328
    - CWE-261
    capec:
    - CAPEC-55
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/04-Bypassing_Authentication_Schema.md
