- id: WEB-PWD-013
  sheet: WEB
  category: PWD
  title: Check the safe comparison of password hashes
  objective: Finds timing leaks and type confusion in the password check.
  steps:
  - Read the code that compares the hash.
  - Make sure it uses a library function with constant time.
  - Make sure the function has an input length limit and fixed types.
  - Measure response time for users with a correct and a wrong first character.
  example: grep -rn "hash_equals\|timingSafeEqual\|compare_digest\|ConstantTimeCompare" src/ ; ab or Burp Intruder timing for 200 requests.
  expected: The code uses a constant-time function with fixed types and length limits.
  severity: Low
  test_type: Code Review
  refs:
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-208
    - CWE-1287
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
