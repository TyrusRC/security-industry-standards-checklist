- id: WEB-PWD-001
  sheet: WEB
  category: PWD
  title: Check the minimum password length
  objective: Finds weak minimum length rules that allow short passwords.
  steps:
  - Register a new account with passwords of 4, 7, 8, 14 and 15 characters.
  - Change the password of a test account to the same lengths.
  - Look at the rule in the documentation. Compare it with what the server accepts.
  - Send the short password directly to the API and skip client-side checks.
  example: 'curl -s -X POST https://target/api/register -H ''Content-Type: application/json'' -d ''{"email":"t1@test.example","password":"Ab1!xyz"}'' -i'
  expected: The server rejects passwords shorter than 8 characters. The application sets 15 characters where MFA is not used. Client-side checks are not the only control.
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-07
    asvs:
    - V6.2.1
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-521
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/07-Weak_Authentication_Methods.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A07_2025-Authentication_Failures.md
- id: WEB-PWD-002
  sheet: WEB
  category: PWD
  title: Check that long passwords and passphrases are accepted
  objective: Finds a low maximum password length that blocks passphrases.
  steps:
  - Set a password of 64 characters, then 128 characters.
  - Log in with each password.
  - Use spaces and Unicode characters in a long password.
  - 'Look for silent cut-off: change only the last character and log in.'
  example: python3 -c "print('a'*63+'X')" | xargs -I{} curl -s -d 'password={}&new=1' https://target/change
  expected: Passwords of at least 64 characters are accepted and fully used. The application sets a sane upper limit and shows an error if it is exceeded.
  severity: Low
  test_type: Manual
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ATHN-07
    asvs:
    - V6.2.9
    cheatsheet:
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-521
