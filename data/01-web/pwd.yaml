  - sources/repos/CheatSheetSeries/cheatsheets/Authentication_Cheat_Sheet.md
- id: WEB-PWD-003
  sheet: WEB
  category: PWD
  title: Check that the password is used exactly as the user typed it
  objective: Finds truncation, case change or other changes to the password before it is checked.
  steps:
  - Set a password with upper-case letters and 80 characters.
  - Log in with the same password in lower case.
  - Log in with only the first 72 characters and with only the first 64 characters.
  - Log in with the first 8 characters.
  example: 'Burp Repeater: login with password = first 72 chars of the set value; then with the value in lower case.'
  expected: Only the exact password is accepted. The application does not truncate or change the case of the password.
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    wstg:
    - WSTG-ATHN-04
    asvs:
    - V6.2.8
    cheatsheet:
    - Password_Storage_Cheat_Sheet
    - Authentication_Cheat_Sheet
    cwe:
    - CWE-303
    - CWE-521
