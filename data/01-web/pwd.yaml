- id: WEB-PWD-022
  sheet: WEB
  category: PWD
  title: Check reminders before authentication factors expire
  objective: Finds expiring credentials, certificates or tokens with no reminder.
  steps:
  - 'List the factors that expire: passwords, certificates, tokens.'
  - Read the reminder rules.
  - Create a test factor that is near expiry.
  - Check that the user gets reminders in time to renew.
  example: Set the certificate notAfter to 7 days from now on a test user; read the mail catcher the next day.
  expected: Users get automatic reminders early enough to renew a factor before it expires.
  severity: Low
  test_type: Config Review
  level: ASVS L3
