- id: WEB-PWD-017
  sheet: WEB
  category: PWD
  title: Check that password reset gives no account enumeration
  objective: Finds different messages or times for known and unknown accounts in the reset form.
  steps:
  - Request a reset for a known email address. Save message, status, length and time.
  - Request a reset for an unknown address. Compare all values.
  - Send 20 requests for each case and compare the average time.
  - Repeat on the SMS or phone reset path.
  example: for u in known@test.example nobody@test.example; do curl -s -o /dev/null -w "$u %{http_code} %{size_download} %{time_total}\n" -d "email=$u" https://target/forgot; done
  expected: The response is the same for known and unknown accounts, in message, status and time.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    owasp_top10:
