- id: WEB-PWD-015
  sheet: WEB
  category: PWD
  title: Test weak security questions if they still exist
  objective: Finds guessable questions, self-written questions and answers without brute-force limits.
  preconditions:
  - Do not run on production.
  steps:
  - List all pre-set questions. Mark questions with public, short-list or guessable answers.
  - Create a custom question such as What is 1+1.
  - Send 100 wrong answers and look for a lockout.
  - Check how many questions the recovery needs.
  example: Burp Intruder with a first-name wordlist on the answer parameter of POST /recover/question.
  expected: No question has a guessable answer. Users cannot write their own question. Wrong answers trigger a lockout or delay. Remove the function if possible.
  severity: Medium
  test_type: Manual
