- id: WEB-PWD-021
  sheet: WEB
  category: PWD
  title: Check that admins cannot set a user password
  objective: Finds admin functions that let staff choose or learn a user password.
  steps:
  - Log in as administrator and open the user management page.
  - Find the reset function for a user.
  - Check if the administrator can type the new password.
  - Check that the function only starts the reset flow for the user.
  example: 'Burp: POST /admin/users/42/reset with a ''password'' parameter added; watch if the value is accepted.'
  expected: Administrators can start a reset for the user but cannot set or see the password.
  severity: Medium
  test_type: Manual
  level: ASVS L3
  refs:
    asvs:
    - V6.4.6
    cheatsheet:
    - Forgot_Password_Cheat_Sheet
    cwe:
    - CWE-620
    - CWE-269
