- id: WEB-PWD-016
  sheet: WEB
  category: PWD
  title: Check initial passwords and activation codes
  objective: Finds predictable, reusable or long-lived system-generated initial secrets.
  preconditions:
  - Mail catcher or test mailbox.
  steps:
  - Create five accounts quickly and collect the initial passwords or codes.
  - Look for patterns, shared strings, hashes of user data or time links.
  - Use a code twice and after its lifetime.
  - Check if the user must change the initial password.
  - Check that the initial password follows the policy.
  example: for i in 1 2 3 4 5; do curl -s -d "email=u$i@test.example" https://target/invite; done ; then compare the mails in the mail catcher.
  expected: Initial secrets are random, follow the password policy, and expire quickly or after first use. The user must set a new password.
  severity: High
  test_type: Manual
  level: ASVS L1
