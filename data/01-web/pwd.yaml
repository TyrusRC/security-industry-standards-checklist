- id: WEB-PWD-018
  sheet: WEB
  category: PWD
  title: 'Check the reset token: randomness, life, single use and storage'
  objective: Finds reset tokens that are guessable, reusable, long lived or stored in plain text.
  preconditions:
  - Test mailbox.
  - Do not run on production.
  steps:
  - Request five reset links. Examine the tokens for patterns and length.
  - Use a token once and then again.
  - Wait for the lifetime to pass. Use the token.
  - Request a new token. Check that the old token stops working.
  - Read the code or database for plain-text token storage.
  - Send many token guesses and look for a rate limit.
  example: Burp Sequencer on the token from the reset mail; ffuf -w tokens.txt -u 'https://target/reset?token=FUZZ' -mc 200
  expected: Tokens are random and long, single use, and short lived. A new request cancels the old token. The server stores only hashes and rate limits guesses.
  severity: High
  test_type: Manual
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-09
    cheatsheet:
    - Forgot_Password_Cheat_Sheet
    cwe:
    - CWE-640
    - CWE-330
    - CWE-331
    - CWE-620
    capec:
    - CAPEC-50
