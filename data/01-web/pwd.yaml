- id: WEB-PWD-020
  sheet: WEB
  category: PWD
  title: Check what happens after a password reset
  objective: Finds resets that leave old sessions alive, log the user in, or send the password.
  steps:
  - Log in on two browsers with the same account.
  - Reset the password in one browser.
  - Check if the other session still works.
  - Look at the reset mail and the response for the new password.
  - Check that the user must log in with the new password.
  example: 'Browser A: reset flow. Browser B: curl -b ''session=<old>'' https://target/account -i'
  expected: The reset does not send the password or log in the user. The user gets a notice and old sessions end or can be ended.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-ATHN-09
    cheatsheet:
    - Forgot_Password_Cheat_Sheet
    cwe:
    - CWE-620
    - CWE-384
