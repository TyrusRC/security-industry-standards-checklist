- id: WEB-PWD-010
  sheet: WEB
  category: PWD
  title: Check that the application does not force password rotation
  objective: Finds forced periodic password change, which weakens passwords.
  steps:
  - Read the password policy and the application settings.
  - Look for an expiry period in the user store.
  - Log in with an account that has an old password.
  example: grep -rn 'password.*expire\|maxAge\|rotation' config/ ; ldapsearch for pwdMaxAge on the user store.
  expected: A password stays valid until it is found compromised or the user changes it. No periodic rotation is required.
  severity: Info
  test_type: Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-07
