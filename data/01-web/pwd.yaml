- id: WEB-PWD-007
  sheet: WEB
  category: PWD
  title: Check the list of context-specific words for passwords
  objective: Finds missing documentation or missing use of words such as company and product names.
  steps:
  - Get the documented list of context-specific words.
  - Make sure it holds the organization, product, project and department names.
  - Try to set passwords built from these words.
  - Make sure the application rejects them.
  example: Registration with password 'AcmeWidgetPortal2024!' and the documented words in Burp Repeater.
  expected: The list is documented. The application rejects passwords that are built from these words.
