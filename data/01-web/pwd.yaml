- id: WEB-PWD-009
  sheet: WEB
  category: PWD
  title: Check the password field masking and paste support
  objective: Finds password fields that show the text or block paste and password managers.
  steps:
  - Look at the HTML of the login, registration and change forms.
  - Make sure the field is type=password.
  - Paste a value into the password and MFA fields.
  - Use a browser or external password manager to fill the form.
  example: 'DevTools console: [...document.querySelectorAll(''input'')].map(i=>[i.name,i.type,i.onpaste]) '
  expected: Password fields use type=password. Paste and password managers work. The user can show the value on purpose.
  severity: Info
