- id: WEB-PWD-004
  sheet: WEB
  category: PWD
  title: Test the change password function
  objective: Finds password change that works without the current password or the right user.
  steps:
  - Log in and change the password with the correct current password.
  - Send the change request without the current password.
  - Send it with a wrong current password.
  - Change the user or ID parameter to another account.
  - Make sure the old password no longer works.
  example: curl -i -b 'session=<id>' -d 'new=Passw0rd-long-and-new&confirm=Passw0rd-long-and-new' https://target/account/password
  expected: The user can change the password. The server needs the current and the new password and acts only on the session user.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A07:2025
    wstg:
    - WSTG-ATHN-09
    asvs:
    - V6.2.2
    - V6.2.3
