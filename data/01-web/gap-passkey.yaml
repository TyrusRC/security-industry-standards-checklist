- id: WEB-PASSKEY-004
  sheet: WEB
  category: PASSKEY
  title: Test account recovery and fallback paths for bypass of passkey login
  objective: Find recovery or fallback methods that are weaker than the passkey and let an attacker take over the account.
  preconditions:
  - A test account with a passkey and a recovery email.
  steps:
  - List all recovery and fallback methods for an account with a passkey.
  - Fail a passkey sign-in and look for a silent fallback to a password, SMS or email code.
  - Start recovery with only email access and look at what the user gets.
  - Make sure recovery codes are single-use and hashed, and that the user can create new ones.
  - After recovery, look at the sessions and the old credentials, and make sure the user gets a notice.
  example: Use the forgot password and lost device flows with a test mailbox; compare the steps with the passkey sign-in
  expected: Recovery is not weaker than the passkey for high-risk accounts. Recovery codes work once. Recovery ends old sessions and the user gets a notice.
  severity: High
  test_type:
  - Manual
  refs:
    owasp_top10:
