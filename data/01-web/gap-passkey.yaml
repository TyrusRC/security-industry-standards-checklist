- id: WEB-PASSKEY-001
  sheet: WEB
  category: PASSKEY
  title: Test passkey registration for account binding and recent authentication
  objective: Find passkey enrollment that lets an attacker add a credential to the account of a victim.
  preconditions:
  - A test account with WebAuthn support or a virtual authenticator.
  steps:
  - Add a passkey with a long-lived session and make sure the application asks for recent re-authentication.
  - Start registration as user A and send the response from user B.
  - Change the user ID or account value in the registration request.
  - Send the registration request from another site and make sure CSRF checks block it.
  - Look for rate limits and a notice to the user after enrollment.
  example: 'Burp: intercept POST /webauthn/register/finish and change the userId; replay the options request without a fresh login'
  expected: The server asks for recent authentication, uses the account from its own ceremony state and ignores an account identifier from the client. The user gets a notice.
  severity: High
  test_type:
  - Manual
  refs:
    owasp_top10:
    - A07:2025
    cheatsheet:
    - Passkey_Security_Cheat_Sheet
    cwe:
    - CWE-287
    - CWE-306
    wstg:
    - WSTG-ATHN-04
    other:
    - 'OWASP DevGuide web app checklist: 06-digital-identity.md'
  sources_read:
