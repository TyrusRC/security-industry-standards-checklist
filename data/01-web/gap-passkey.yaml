- id: WEB-PASSKEY-003
  sheet: WEB
  category: PASSKEY
  title: Test passkey management, revocation and the last credential
  objective: Find credential management that allows silent changes or leaves a revoked passkey valid.
  preconditions:
  - A test account with two passkeys.
  steps:
  - Open the passkey management page and look at the data shown, such as name and last use.
  - Remove a passkey and use it to sign in again.
  - Try to add or remove a passkey without recent re-authentication.
  - Try to remove the last sign-in method.
  - Make sure the user gets a notice when a passkey is added or removed.
  - Look at the audit log for enrollment, use and revocation events.
  example: Virtual authenticator in Chrome DevTools; sign in with a removed credential ID
  expected: A removed passkey stops working at once. Changes need recent authentication, send a notice, and are logged. The last method cannot be removed without a safe recovery path.
  severity: Medium
  test_type:
  - Manual
  refs:
    owasp_top10:
    - A07:2025
    cheatsheet:
    - Passkey_Security_Cheat_Sheet
    cwe:
    - CWE-287
    wstg:
    - WSTG-ATHN-07
    other:
    - 'OWASP DevGuide web app checklist: 06-digital-identity.md'
