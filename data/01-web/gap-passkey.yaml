  - sources/repos/wstg/document/4-Web_Application_Security_Testing/04-Authentication/04-Bypassing_Authentication_Schema.md
- id: WEB-PASSKEY-002
  sheet: WEB
  category: PASSKEY
  title: Test WebAuthn ceremony checks for challenge, origin and user verification
  objective: Find a relying party that accepts a replayed, forged or wrong-scope passkey response.
  preconditions:
  - A virtual authenticator.
  steps:
  - Capture a valid registration and a valid sign-in response with a virtual authenticator.
  - Replay the sign-in response and make sure the server rejects the used challenge.
  - Wait until the challenge expires and send the response.
  - Change the type, the origin and the RP ID hash in the client data and send it again.
  - Use a registration challenge in a sign-in and a challenge of one account for another account.
  - Clear the user verification flag where the policy needs it.
  example: Chrome DevTools WebAuthn panel (virtual authenticator); Burp Repeater on /webauthn/authenticate/finish
  expected: The server accepts only an unused and unexpired challenge of the right ceremony and account. Type, origin, RP ID and flags must match the policy. A used response fails.
  severity: High
  test_type:
  - Manual
  refs:
    owasp_top10:
    - A07:2025
    cheatsheet:
    - Passkey_Security_Cheat_Sheet
    cwe:
    - CWE-294
    - CWE-287
    wstg:
    - WSTG-ATHN-04
