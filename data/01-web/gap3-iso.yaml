- id: WEB-ISO-003
  sheet: WEB
  category: ISO
  title: Check cache controls on resources that show user state
  objective: Find resources whose cache state tells another site if a user visited a page or holds a role.
  preconditions:
  - A test account with a high role and one with a low role.
  steps:
  - List resources that only some users can load, such as admin images, scripts and styles.
  - Load a resource as the high-role user. Look at the Cache-Control header of the response.
  - Make sure the response uses Cache-Control with no-store. Or make sure the URL holds an unpredictable token for each user.
  - Make sure the token is long and the server checks it.
  - On a test page, load the resource and measure the load time. Look for a difference between a cached and a fresh load.
  example: 'curl -sI https://target/static/admin-panel.css -H "Cookie: session=<admin>" | grep -i cache-control; performance.getEntriesByName(url)[0].duration on the test page'
  expected: Role-specific resources use no-store or a per-user unpredictable URL. A test page cannot tell from load time if the resource was cached.
  severity: Low
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-CLNT-09
    cheatsheet:
    - XS_Leaks_Cheat_Sheet
    cwe:
