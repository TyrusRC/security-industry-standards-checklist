- id: WEB-ISO-001
  sheet: WEB
  category: ISO
  title: Check the server-side resource isolation policy with Fetch Metadata headers
  objective: Find a server that serves private resources to any cross-site request because it has no Fetch Metadata policy.
  preconditions:
  - A test account and a proxy that can change request headers.
  - Source code or gateway configuration for the isolation filter.
  steps:
  - Find the filter that reads Sec-Fetch-Site, Sec-Fetch-Mode and Sec-Fetch-Dest.
  - Send a request to an authenticated API endpoint with Sec-Fetch-Site set to cross-site. Make sure the server rejects it.
  - Send a request with Sec-Fetch-Site set to same-origin, same-site and none. Make sure only intended requests pass.
  - Send a cross-site navigation GET request. Make sure the policy allows it only for pages that must be linked.
  - Send a cross-site request with Sec-Fetch-Dest set to image, script or iframe to a private resource. Make sure it fails.
  - Remove all Sec-Fetch headers. Make sure the fallback rule is deliberate and old browsers are handled.
  - If the response depends on a Fetch Metadata header, make sure the Vary header lists it.
  example: 'curl -i https://target/api/profile -H "Cookie: session=<value>" -H "Sec-Fetch-Site: cross-site" -H "Sec-Fetch-Mode: no-cors" -H "Sec-Fetch-Dest: image"'
  expected: Cross-site requests for private resources are rejected, cross-site navigations are limited to public pages, and the behavior without the headers is documented. Caches get a Vary header.
  severity: Medium
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-CLNT-09
    asvs:
    - V3.5.8
    cheatsheet:
    - XS_Leaks_Cheat_Sheet
    cwe:
    - CWE-203
    - CWE-200
    capec:
    - CAPEC-462
    other:
    - 'W3C Fetch Metadata Request Headers: https://www.w3.org/TR/fetch-metadata/'
  see:
  - WEB-XSLEAK-001
  - WEB-CSRF-001
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/XS_Leaks_Cheat_Sheet.md
  - sources/extra/gap3-A/webappsec-fetch-metadata.md
- id: WEB-ISO-002
  sheet: WEB
  category: ISO
  title: Check Cross-Origin-Resource-Policy on private and public resources
  objective: Find private images, scripts and documents that other sites can load and measure because the response has no Cross-Origin-Resource-Policy header.
  preconditions:
  - A test account and a test page on another origin.
  steps:
  - List resources that need a login, such as images, scripts, JSON and downloads.
  - Request each resource and look for the Cross-Origin-Resource-Policy header.
  - Make sure private resources use same-origin, or same-site when sibling sites need them.
  - Make sure cross-origin is used only for resources that other sites must embed.
  - Load a private resource from a page on another origin with an img or script tag. Make sure the browser blocks it.
  example: 'curl -sI https://target/avatars/me.png -H "Cookie: session=<value>" | grep -i cross-origin-resource-policy; <img src="https://target/avatars/me.png"> on https://attacker.test'
  expected: Private resources send Cross-Origin-Resource-Policy with same-origin or same-site. A page on another origin cannot load them.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-CLNT-09
    asvs:
    - V3.5.8
    cheatsheet:
    - XS_Leaks_Cheat_Sheet
    cwe:
    - CWE-200
    capec:
    - CAPEC-462
  see:
  - WEB-XSLEAK-001
  - WEB-CLIENT-014
  sources_read:
