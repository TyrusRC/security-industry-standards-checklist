- id: WEB-ISO-004
  sheet: WEB
  category: ISO
  title: Check SameSite cookies against same-site sibling origins
  objective: Find sessions that a sibling subdomain or a shared public suffix site can still reach because SameSite is not a full origin boundary.
  preconditions:
  - A list of all subdomains of the registrable domain and the cookie settings.
  steps:
  - List all sibling subdomains. Find those that host user content, third-party services or old applications.
  - Make sure the application is not hosted on a shared suffix such as github.io, where other tenants are cross-site.
  - Read the SameSite value of each session cookie. Make sure it is Lax or Strict.
  - From a page on a sibling subdomain, send a state-changing request to the main application. Look for acceptance.
  - Make sure origin checks and CSRF tokens still run for same-site requests.
  example: 'curl -sI https://target/login | grep -i set-cookie; fetch("https://app.example.com/api/delete",{method:"POST",credentials:"include"}) from https://blog.example.com'
  expected: Session cookies use SameSite Lax or Strict. Same-site sibling origins get no extra trust, and CSRF and origin checks stay on for them.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    owasp_top10:
