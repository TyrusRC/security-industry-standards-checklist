- id: WEB-ERR-001
  sheet: WEB
  category: ERR
  title: Make sure errors return a generic message without stack traces or internals
  objective: Find error output that shows stack traces, queries, paths, versions, keys or tokens.
  steps:
  - Send wrong types, missing parameters, long values and special characters to every input.
  - Send malformed JSON and XML bodies and invalid HTTP requests.
  - Request missing files and folders.
  - Look at the response body and headers for stack traces, SQL, paths, versions and secrets.
  - Look at error responses that return status 200.
  - Check that debug pages and consoles are off.
  example: ffuf -u 'https://example.com/page?id=FUZZ' -w fuzz-errors.txt -mc 500; curl -si 'https://example.com/api/item/%00'; zap-baseline.py -t https://example.com
  expected: Unexpected or security-sensitive errors return a generic message and a correlation ID. No internal data is visible.
  severity: Medium
  test_type:
  - Manual
  - Automated
  level: ASVS L2
  refs:
    wstg:
    - WSTG-ERRH-01
    - WSTG-ERRH-02
    asvs:
    - V16.5.1
    owasp_top10:
    - A10:2025
    - A02:2025
    cheatsheet:
    - Error_Handling_Cheat_Sheet
    cwe:
    - CWE-209
    - CWE-550
    - CWE-215
    capec:
    - CAPEC-54
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/08-Error_Handling/01-Improper_Error_Handling.md
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/08-Error_Handling/02-Stack_Traces.md
  - sources/repos/Top10/2025/docs/en/A10_2025-Mishandling_of_Exceptional_Conditions.md
  - sources/repos/Top10/2025/docs/en/A02_2025-Security_Misconfiguration.md
  - sources/repos/CheatSheetSeries/cheatsheets/Error_Handling_Cheat_Sheet.md
- id: WEB-ERR-002
  sheet: WEB
  category: ERR
  title: Make sure web server and framework use custom error pages
  objective: Find default server and framework error pages that identify the product and version.
  steps:
  - Request random missing paths and forbidden folders.
  - Send a request that breaks the HTTP rules, such as a wrong version or a very long line.
  - Compare the pages with the known default pages of Apache, Nginx, IIS and the framework.
  - Look at the configuration for custom error pages and a global error handler.
  example: curl -si https://example.com/nonexistent-$(date +%s); printf 'GET / HTTP/9.9\r\n\r\n' | openssl s_client -quiet -connect example.com:443
  expected: The application uses custom error pages and a central error handler. No default product page is shown.
  severity: Low
  test_type:
  - Manual
  - Config Review
  refs:
    wstg:
    - WSTG-ERRH-01
    - WSTG-INFO-02
    owasp_top10:
    - A02:2025
    cheatsheet:
    - Error_Handling_Cheat_Sheet
    cwe:
    - CWE-756
    - CWE-209
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/08-Error_Handling/01-Improper_Error_Handling.md
