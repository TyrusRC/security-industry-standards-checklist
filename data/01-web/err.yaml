- id: WEB-ERR-003
  sheet: WEB
  category: ERR
  title: Make sure the application degrades safely when an external resource fails
  objective: Find applications that crash, hang or expose data when a dependency is down.
  preconditions:
  - Do not run on production.
  steps:
  - Block, slow down or break one dependency at a time in a test system.
  - Look at the user response and the application state.
  - Check for circuit breakers, time-outs and graceful degradation.
  - Check that the application recovers when the dependency returns.
  example: toxiproxy-cli toxic add -t timeout -a timeout=0 backend; iptables -A OUTPUT -d <dep-ip> -j DROP
  expected: The application keeps working in a safe reduced mode, gives a generic error, and recovers by itself.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    asvs:
    - V16.5.2
    owasp_top10:
    - A10:2025
    cwe:
    - CWE-755
    - CWE-400
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A10_2025-Mishandling_of_Exceptional_Conditions.md
- id: WEB-ERR-004
  sheet: WEB
  category: ERR
  title: Make sure the application fails closed and rolls back on errors
  objective: Find fail-open paths where an error lets a request or transaction pass.
  steps:
  - Make a validation, authorization or payment step fail with an exception in a test system.
  - Check that the request is denied and not processed.
  - Interrupt a multi-step transaction in the middle and check the state of the data.
  - Check that partial changes are rolled back.
  example: 'Burp Repeater: send input that raises an exception in the validator; interrupt the second step of a transfer with a dropped connection'
  expected: Errors lead to denial and complete rollback. No transaction is processed after a failed check.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
  refs:
    asvs:
    - V16.5.3
    owasp_top10:
    - A10:2025
    - A09:2025
    cwe:
    - CWE-636
    - CWE-755
    - CWE-460
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A10_2025-Mishandling_of_Exceptional_Conditions.md
  - sources/repos/Top10/2025/docs/en/A09_2025-Security_Logging_and_Alerting_Failures.md
- id: WEB-ERR-005
  sheet: WEB
  category: ERR
  title: Check for a last-resort error handler that catches all exceptions
  objective: Find code paths with no global handler that lose error data or stop the process.
  steps:
  - Find the global exception handler in the framework configuration.
  - Raise an unhandled exception in a test route and in a background job.
  - Check that the process stays up, the error is logged, and the user gets a generic message.
  - Search the code for empty catch blocks and generic exceptions.
  example: grep -rEn 'catch\s*\(\s*(Exception|Throwable)|except\s*:|catch\s*\{\s*\}' ./src
  expected: A central handler catches all unhandled exceptions, logs them and keeps the process available.
  severity: Medium
  test_type:
  - Code Review
  - Manual
  level: ASVS L3
  refs:
    asvs:
