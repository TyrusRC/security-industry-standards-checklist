- id: WEB-XMLSEC-002
  sheet: WEB
  category: XMLSEC
  title: Test XML schema limits for data types, lengths and payload size
  objective: Find XML schemas that accept values with no length, range or type limits, which leads to errors and resource use.
  steps:
  - Get the schema of the XML interface or the documented message format.
  - Look for elements typed as free strings where a number, a date or a fixed set is expected.
  - Send a very long value for each string and number element.
  - Send a large document and a document with many elements and attributes.
  - Measure the response time and the server memory.
  example: 'python3 -c "print(''<age>''+''9''*100000+''</age>'')" > big.xml; curl -s -o /dev/null -w ''%{time_total}\n'' -H ''Content-Type: application/xml'' --data-binary @big.xml https://target/api; compare
    the response time with a normal document'
  expected: The schema sets type, length and range limits for each element. The server rejects an oversized document before it parses it fully.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  refs:
    owasp_top10:
    - A05:2025
    - A06:2025
    cheatsheet:
    - XML_Security_Cheat_Sheet
    wstg:
    - WSTG-INJT-07
    cwe:
    - CWE-20
    - CWE-400
    other:
