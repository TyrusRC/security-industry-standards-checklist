- id: WEB-XMLSEC-003
  sheet: WEB
  category: XMLSEC
  title: Test XML parser handling of malformed documents and recovery mode
  objective: Find XML parsers that repair or normalize invalid documents, so that two components read the same data in different ways.
  steps:
  - Find out which XML parser and which options the application uses.
  - Send a document with a double hyphen in a comment and with a nested comment.
  - Send a document with an unclosed tag and look at the response.
  - Make sure the parser is not in recovery mode and rejects the document.
  - Compare the response time of a valid document and a malformed version of it.
  example: 'curl -d ''<a><!-- one <!-- two --></a>'' -H "Content-Type: application/xml" https://target/xml; compare timing with curl -w "%{time_total}"'
  expected: The server rejects malformed documents and does not repair them. A malformed document does not take more time than a valid one.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
