- id: WEB-XMLSEC-001
  sheet: WEB
  category: XMLSEC
  title: Test XML processing for schema poisoning and external schema loading
  objective: Find XML endpoints that load a schema or DTD from the document or from a remote location that an attacker controls.
  steps:
  - Find the XML endpoints and the schema that each one uses.
  - Send a document with an embedded DOCTYPE or an inline schema that removes all limits.
  - Send a document with an xsi:schemaLocation that points to a collector host, in a test environment.
  - Watch for a callback to the collector.
  - 'Review the parser configuration for the schema source: local, read-only and fixed.'
  example: 'curl -X POST https://target/xml -H "Content-Type: application/xml" -d ''<!DOCTYPE note [<!ELEMENT note ANY>]><note>x</note>''; xsi:schemaLocation="urn:x http://collector.test/x.xsd"'
  expected: The server ignores a schema or DTD in the document and does not fetch a remote schema. It validates against a local schema that only administrators can change.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A05:2025
    - A02:2025
    cheatsheet:
    - XML_Security_Cheat_Sheet
    wstg:
    - WSTG-INJT-07
    asvs:
    - V1.5.1
    cwe:
    - CWE-611
    - CWE-829
    other:
    - 'OWASP DevGuide web app checklist: 02-frameworks-libraries.md'
