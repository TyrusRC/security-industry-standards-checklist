- id: WEB-FWK-007
  sheet: WEB
  category: FWK
  title: Check the php.ini settings of a production PHP server
  objective: Find php.ini values that show errors, allow remote includes or leave dangerous functions on.
  preconditions:
  - Shell access to the PHP server or a copy of the production php.ini.
  steps:
  - Make sure the PHP branch is still in security support.
  - Make sure expose_php is Off, display_errors is Off, html_errors is Off and log_errors is On.
  - Make sure allow_url_fopen and allow_url_include are Off.
  - Make sure open_basedir limits PHP to the web root and the needed paths.
  - Make sure disable_functions lists the functions the application does not use, such as exec, system and passthru.
  - Make sure file_uploads is Off when the application has no upload, and upload_max_filesize and post_max_size are small.
  - Make sure enable_dl is Off and the session settings use secure cookie values.
  example: 'php -i | grep -E "expose_php|display_errors|allow_url|open_basedir|disable_functions|enable_dl|file_uploads"; php -v'
  expected: Errors go to the log only, remote file access is off, dangerous functions are disabled, and upload and execution limits are set.
  severity: Medium
  test_type:
  - Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A02:2025
    wstg:
    - WSTG-CONF-02
    asvs:
    - V13.4.2
    cheatsheet:
    - PHP_Configuration_Cheat_Sheet
    cwe:
    - CWE-209
  see:
  - WEB-ERR-002
  sources_read:
