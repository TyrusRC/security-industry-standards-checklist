- id: WEB-FWK-001
  sheet: WEB
  category: FWK
  title: Check the Django production settings for debug, hosts and cookies
  objective: Find a Django deployment that runs with debug mode, an empty host list or insecure cookie and redirect settings.
  preconditions:
  - Read access to the production settings module and shell access to a copy of the production build.
  steps:
  - Open the production settings module and find the DEBUG value. It must be False.
  - Find ALLOWED_HOSTS. Make sure the list is not empty and does not hold a wildcard.
  - Make sure SESSION_COOKIE_SECURE, CSRF_COOKIE_SECURE and SECURE_SSL_REDIRECT are True.
  - Make sure SecurityMiddleware and XFrameOptionsMiddleware are in MIDDLEWARE, in this order.
  - Make sure SECURE_PROXY_SSL_HEADER is set only when a trusted proxy strips and sets the header.
  - Run the Django deploy check with the production settings and look at each warning.
  - Send a request to a missing URL and a request with a wrong Host header. Look for debug pages.
  example: 'python manage.py check --deploy --settings=prod.settings; curl -sk https://target/nonexistent-url-123 | grep -i "DEBUG = True"; curl -sk -H "Host: evil.example" https://target/'
  expected: DEBUG is False and ALLOWED_HOSTS lists only real host names. The deploy check shows no security warning. Error pages show no settings or stack trace.
  severity: High
  test_type:
  - Config Review
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A02:2025
    wstg:
    - WSTG-CONF-02
    - WSTG-ERRH-01
    asvs:
    - V13.4.2
    cheatsheet:
    - Django_Security_Cheat_Sheet
    cwe:
    - CWE-489
    - CWE-215
  see:
  - WEB-CONF-002
  - WEB-ERR-002
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Django_Security_Cheat_Sheet.md
- id: WEB-FWK-002
  sheet: WEB
  category: FWK
  title: Check Django SECRET_KEY strength, storage and rotation
  objective: Find a weak, hard-coded or exposed Django SECRET_KEY that lets an attacker forge signed data.
  preconditions:
  - Read access to the source repository, the deployment configuration and the secret store.
  steps:
  - Find the SECRET_KEY value in settings.py and in the repository history.
  - Make sure the key has at least 50 characters and does not start with django-insecure-.
  - Make sure the key is read from an environment variable or a secrets manager.
  - Look for a written key rotation procedure. It must name the effect on sessions and password reset tokens.
  - Make sure a leaked key causes an immediate rotation.
  example: 'git log -p -S SECRET_KEY -- "*settings*.py"; grep -rn "SECRET_KEY" --include=*.py .; python manage.py check --deploy | grep W009'
  expected: The key is long, random and loaded from a secret store. No repository file or history holds it, and a rotation procedure exists.
  severity: High
  test_type:
  - Config Review
  - Code Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A02:2025
    asvs:
    - V13.3.1
    cheatsheet:
    - Django_Security_Cheat_Sheet
    cwe:
    - CWE-798
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Django_Security_Cheat_Sheet.md
- id: WEB-FWK-003
  sheet: WEB
  category: FWK
  title: Check Django REST Framework default permission, throttle and paging classes
  objective: Find a REST API that is open to everyone because the framework defaults were not changed.
  preconditions:
  - Read access to the REST_FRAMEWORK settings and the view code.
  steps:
  - Open the REST_FRAMEWORK setting. Find DEFAULT_PERMISSION_CLASSES.
  - Make sure the value is not rest_framework.permissions.AllowAny.
  - Search the views for permission_classes and authentication_classes overrides. Examine each override.
  - Make sure each AllowAny view is a public endpoint on purpose.
  - Make sure DEFAULT_THROTTLE_CLASSES and DEFAULT_THROTTLE_RATES are set, and DEFAULT_PAGINATION_CLASS is set.
  - Send a request without credentials to a list endpoint. Look for data in the response.
  - Make sure DEBUG and DEBUG_PROPAGATE_EXCEPTIONS are False.
  example: 'grep -rn "permission_classes\|authentication_classes\|AllowAny" --include=*.py .; curl -s https://target/api/items/'
  expected: The default permission class denies anonymous users, throttle and paging classes are set, and every override is documented and has a reason.
  severity: High
  test_type:
  - Config Review
  - Code Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A02:2025
    wstg:
    - WSTG-CONF-02
    cheatsheet:
    - Django_REST_Framework_Cheat_Sheet
    cwe:
    - CWE-1188
    - CWE-285
