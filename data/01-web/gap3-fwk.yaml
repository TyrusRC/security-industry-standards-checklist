- id: WEB-FWK-008
  sheet: WEB
  category: FWK
  title: Check Ruby on Rails session store, routes and sensitive files
  objective: Find a Rails application with replayable cookie sessions, open route patterns or committed secret files.
  preconditions:
  - Read access to the Rails project and its repository history.
  steps:
  - Find the session store setting. Note if it is the default cookie store.
  - If sessions use cookies, make sure a server-side expiry or a database session store limits replay of old cookies.
  - Make sure the session does not hold sensitive data.
  - Open config/routes.rb. Find routes that map any controller or action from a URL pattern.
  - Make sure users can reach only the intended controller methods.
  - Make sure database.yml, secret_token.rb and local databases are not in the repository.
  - Make sure HSTS is set in the production environment file.
  example: 'grep -n "session_store" config/**/*.rb; grep -n ":controller\|:action" config/routes.rb; git ls-files | grep -E "database.yml|secret|sqlite3"'
  expected: Sessions can expire on the server, routes expose only chosen actions, and no secret or data file is in the repository.
  severity: Medium
  test_type:
  - Config Review
  - Code Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A02:2025
    wstg:
    - WSTG-CONF-02
    cheatsheet:
    - Ruby_on_Rails_Cheat_Sheet
    cwe:
    - CWE-798
