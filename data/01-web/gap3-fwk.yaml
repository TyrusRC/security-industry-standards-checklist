- id: WEB-FWK-005
  sheet: WEB
  category: FWK
  title: Check the FastAPI documentation routes and ASGI proxy trust in production
  objective: Find a FastAPI deployment that exposes its schema or trusts forwarding headers from any client.
  preconditions:
  - Access to the production URL and to the server start command or configuration.
  steps:
  - Request /docs, /redoc and /openapi.json on the production host without credentials.
  - If the documentation is private, make sure openapi_url is None or the routes need authentication.
  - Look at the Uvicorn start command. Find the --forwarded-allow-ips value.
  - Make sure the value lists only the addresses of trusted reverse proxies and is not a wildcard.
  - Send a request with a forged X-Forwarded-For and X-Forwarded-Proto header directly to the application port.
  - Make sure the application does not take the client address or scheme from the forged header.
  - Make sure the Server header is off.
  example: 'curl -sk -o /dev/null -w "%{http_code}\n" https://target/docs https://target/openapi.json; uvicorn app:app --forwarded-allow-ips=10.0.0.5 --no-server-header'
  expected: Documentation routes are closed or protected. Proxy trust is limited to known proxy addresses. Forged forwarding headers do not change the client address or scheme.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A02:2025
    wstg:
    - WSTG-CONF-02
    asvs:
    - V13.4.2
    - V4.1.3
    cheatsheet:
    - FastAPI_Security_Cheat_Sheet
    cwe:
    - CWE-1188
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/FastAPI_Security_Cheat_Sheet.md
- id: WEB-FWK-006
  sheet: WEB
  category: FWK
  title: Check Laravel and Symfony production mode, application key and secrets
  objective: Find a Laravel or Symfony application that runs in debug mode or keeps its key and secrets in unsafe places.
  preconditions:
  - Read access to the environment files and the deployment configuration.
  steps:
  - Laravel - make sure APP_DEBUG is false in the production environment.
  - Laravel - make sure APP_KEY is set, is not in the repository.
  - Laravel - make sure the cookie encryption middleware is on and session cookies use HttpOnly, Secure and SameSite.
  - Symfony - make sure APP_ENV is prod and the production error page is generic.
  - Symfony - make sure API keys are in the secrets vault. Make sure the private decryption key file is not in the repository.
  - Symfony - make sure framework.session sets cookie_secure to true and cookie_samesite to lax or strict.
  - Make sure directories have mode 775 or less and ordinary files have mode 664 or less.
  example: 'grep -E "APP_DEBUG|APP_ENV|APP_KEY" .env*; php bin/console secrets:list; stat -c "%a %n" storage bootstrap/cache; git log -S APP_KEY'
  expected: Debug mode is off. The key and secrets come from a vault or the environment and are not in the repository. Cookie settings are strict and file modes are not wider than needed.
  severity: High
  test_type:
  - Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A02:2025
