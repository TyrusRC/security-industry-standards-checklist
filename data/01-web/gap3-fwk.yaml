- id: WEB-FWK-004
  sheet: WEB
  category: FWK
  title: Review framework field allow-lists and server-side validation constraints
  objective: Find framework models, serializers and validators that accept or return fields the client must not set or see.
  preconditions:
  - Read access to the source code. Use the stack of the application.
  steps:
  - Django REST Framework - find each ModelSerializer. Make sure Meta.fields is an explicit list and does not use exclude or __all__.
  - Laravel - make sure no model sets $guarded to an empty array. Make sure forceFill and forceCreate get no raw request data.
  - FastAPI - make sure separate input schemas exclude server-set fields and a response_model is set on each route.
  - FastAPI - make sure extra="forbid" is set where the API must reject unknown fields.
  - Java - make sure controller parameters use @Valid and the constraints cover size, pattern and range.
  - Send a request with an extra field such as is_admin. Examine the stored object and the response.
  example: 'grep -rn "fields = \"__all__\"\|exclude =\|\$guarded = \[\]\|forceFill\|forceCreate" .; curl -X PATCH https://target/api/me -d "{\"is_admin\":true}"'
  expected: Only listed fields are bound and returned, unknown fields are rejected or ignored, and input that breaks a constraint gets a client error.
  severity: High
  test_type:
  - Code Review
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A06:2025
    wstg:
    - WSTG-INJT-20
    asvs:
    - V15.3.3
    cheatsheet:
    - Django_REST_Framework_Cheat_Sheet
    - Laravel_Cheat_Sheet
    - FastAPI_Security_Cheat_Sheet
    - Bean_Validation_Cheat_Sheet
    cwe:
    - CWE-915
