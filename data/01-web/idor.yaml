- id: WEB-IDOR-003
  sheet: WEB
  category: IDOR
  title: Test operations that take a user parameter
  objective: Finds password change, profile change or other functions that act on a user named in the request.
  steps:
  - Find requests with user, uid, account or email parameters.
  - Log in as A and replace the value with the name of B.
  - 'Use multi-step flows: change the value in each step.'
  - Check split references, where the object uses two parameters.
  example: 'Burp Repeater: GET /changepassword?user=userB with the session of user A.'
  expected: The server takes the user from the session and ignores or rejects other values.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-04
    asvs:
    - V8.2.2
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    cwe:
    - CWE-639
