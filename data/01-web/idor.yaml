- id: WEB-IDOR-004
  sheet: WEB
  category: IDOR
  title: Test file and resource references
  objective: Finds file names or IDs that give access to other users' files.
  steps:
  - Find parameters that name files or images.
  - Upload a file as A. Note its reference.
  - Request it as B and with no session.
  - Try names of other files, also from other folders.
  example: curl -i -b 'session=<userB>' 'https://foo.bar/showImage?img=img00011'
  expected: Files are served only to users who own them or have a right. Direct links do not skip the check.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-04
    asvs:
    - V8.2.2
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    cwe:
    - CWE-639
