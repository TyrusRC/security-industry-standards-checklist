- id: WEB-IDOR-001
  sheet: WEB
  category: IDOR
  title: Test access to other users' objects by changing the reference
  objective: Finds objects that a user can read by changing an ID in the request.
  steps:
  - Create user A and user B. Create objects for each, such as invoices.
  - 'Map every place where input refers to an object: URL, body, header and cookie.'
  - Log in as A and request the objects of B by changing the reference.
  - Compare the response with the response for the owner.
  example: curl -b 'session=<userA>' 'https://foo.bar/somepage?invoice=<id of B>' ; Burp Autorize with the session of user A.
  expected: The server returns 403 or 404 for objects of other users. It checks ownership on every request.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-04
    - WSTG-ATHZ-02
    asvs:
    - V8.2.2
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    - Authorization_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-566
    - CWE-863
    capec:
    - CAPEC-1
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
