- id: WEB-IDOR-002
  sheet: WEB
  category: IDOR
  title: Test write, delete and export operations for IDOR
  objective: Finds update and delete calls that do not check ownership.
  preconditions:
  - Do not run on production data.
  steps:
  - 'List all operations that take an object reference: read, create, update, delete, export.'
  - As user A send each operation with the object ID of user B.
  - Check the effect as user B.
  - Test all HTTP methods and bulk calls.
  example: curl -X DELETE -b 'session=<userA>' https://target/api/documents/<id of B>
  expected: No operation acts on an object of another user. Every method checks ownership.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A01:2025
    wstg:
    - WSTG-ATHZ-04
    asvs:
    - V8.2.2
    cheatsheet:
    - Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet
    cwe:
    - CWE-639
    - CWE-862
  sources_read:
