- id: WEB-LOG-006
  sheet: WEB
  category: LOG
  title: Make sure logs hold no credentials, tokens or protected personal data
  objective: Find passwords, session IDs, tokens and card data in logs.
  steps:
  - Send requests with test passwords, tokens, card numbers and personal data.
  - Search the log files and the log platform for these test values.
  - Check that session tokens are hashed or masked, and that debug logs hold no secrets.
  - Check that logging failures do not show debug data to users.
  example: 'grep -rEn ''password=|Authorization: Bearer|[0-9]{13,16}'' /var/log/app/; trufflehog filesystem /var/log/app'
  expected: Logs follow the rules for each data level. They hold no passwords, secrets, tokens or full card numbers.
  severity: High
  test_type:
  - Manual
  - Automated
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.2.5
    wstg:
    - WSTG-CONF-02
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-532
    - CWE-779
  sources_read:
