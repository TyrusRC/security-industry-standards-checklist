- id: WEB-LOG-005
  sheet: WEB
  category: LOG
  title: Make sure logs use a common format that the processor reads
  objective: Find log formats that the processor cannot parse or correlate.
  steps:
  - Look at the format of logs from each component.
  - Check that the log processor parses them without errors.
  - Check that the event names follow a shared vocabulary.
  example: jq . app.log | head; check parser error counts in the SIEM
  expected: Logs follow a common format, parse without errors, and can be correlated.
  severity: Low
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    asvs:
    - V16.2.4
    owasp_top10:
