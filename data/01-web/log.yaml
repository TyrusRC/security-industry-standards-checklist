- id: WEB-LOG-012
  sheet: WEB
  category: LOG
  title: Make sure logs are protected from unauthorized access and change
  objective: Find logs that unauthorised users can read, change or delete.
  steps:
  - Check file and storage permissions of the log files and log platform.
  - Try to read, edit and delete a log entry with a normal service account.
  - Check for append-only, write-once or hash chain protection.
  - Check that web access to log files is blocked.
  example: ls -l /var/log/app/; lsattr /var/log/app/*; curl -si https://example.com/logs/app.log
  expected: Only authorized roles can read logs. Nobody can change them. Web access is blocked.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.4.2
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-532
    - CWE-732
    capec:
    - CAPEC-81
