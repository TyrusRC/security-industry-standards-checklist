- id: WEB-LOG-011
  sheet: WEB
  category: LOG
  title: Test log injection and make sure logging components encode data
  objective: Find user input that can forge or break log lines.
  steps:
  - Send input with CRLF, JSON quotes, and log format fields in parameters, headers and user names.
  - Read the log for forged lines or broken structure.
  - Check that the log viewer escapes HTML and other control characters.
  example: curl -s 'https://example.com/login' -d $'user=admin\r\n2026-01-01 INFO login success user=admin&pass=x'
  expected: Logging encodes user input. An attacker cannot add or change log entries.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.4.1
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-117
    capec:
    - CAPEC-93
  sources_read:
