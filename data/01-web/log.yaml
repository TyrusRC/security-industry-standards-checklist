- id: WEB-LOG-013
  sheet: WEB
  category: LOG
  title: Make sure logs are sent securely to a separate system
  objective: Find logs that stay on the host an attacker can reach.
  steps:
  - Find the log shipping configuration.
  - Check that the transport uses TLS and that the target is a separate system with other credentials.
  - Delete a local log in a test system and check that the remote copy stays.
  - Check that the pipeline gives alerts and escalation.
  example: cat /etc/rsyslog.d/*.conf | grep -E '@@|tls'; filebeat test output
  expected: Logs go over TLS to a logically separate system. Local tampering does not change the remote copy.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.4.3
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-778
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
