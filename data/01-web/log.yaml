- id: WEB-LOG-009
  sheet: WEB
  category: LOG
  title: Make sure security events and control bypass tries are logged
  objective: Find attacks on validation, business logic and anti-automation that leave no log.
  steps:
  - Send invalid input, tampered tokens, out-of-order workflow steps and repeated rapid requests.
  - Read the logs for each try.
  - Check that the events in the security documentation are all logged.
  - Check that the logs hold high-risk actions such as admin actions and data export.
  example: zap-baseline.py -t https://example.com ; then count related entries in the security log
  expected: Security events and tries to bypass controls are logged with enough context to start an investigation.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.3.3
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-778
    - CWE-223
