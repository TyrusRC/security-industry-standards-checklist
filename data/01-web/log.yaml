- id: WEB-LOG-007
  sheet: WEB
  category: LOG
  title: Make sure all authentication events are logged
  objective: Find login, logout, MFA and reset events that leave no log.
  steps:
  - Do a successful login, failed logins, a locked account and an MFA failure.
  - Do a password reset and a password change.
  - Read the logs for each event.
  - Check for authentication type and factors in the entries.
  example: grep -E 'authn_|login' /var/log/app/security.log
  expected: All successful and failed authentication operations are logged with the method used.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    asvs:
    - V16.3.1
    owasp_top10:
    - A09:2025
    cheatsheet:
    - Logging_Cheat_Sheet
