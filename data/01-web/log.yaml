- id: WEB-LOG-008
  sheet: WEB
  category: LOG
  title: Make sure failed authorization events are logged
  objective: Find access denials that leave no trace.
  steps:
  - Request another user's object and an admin function with a low-privilege account.
  - Read the log for each denial.
  - For L3, check that sensitive data access is logged without the data itself.
  example: 'curl -si -H ''Cookie: session=LOW'' https://example.com/admin/users; tail -n 20 /var/log/app/security.log'
  expected: Each failed authorization creates a log entry with user and resource.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.3.2
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-778
