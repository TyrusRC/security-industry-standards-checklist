- id: WEB-LOG-010
  sheet: WEB
  category: LOG
  title: Make sure unexpected errors and security control failures are logged
  objective: Find errors and failed controls, such as backend TLS failures, that nobody sees.
  steps:
  - Force an unhandled error with bad input.
  - Break a backend TLS connection in a test system.
  - Read the log for both events.
  - Check that the log has the cause but no secrets.
  example: curl -s 'https://example.com/?id=%00' ; tail -n 20 /var/log/app/error.log
  expected: Unexpected errors and control failures create log entries with the cause and without secrets.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.3.4
    owasp_top10:
    - A09:2025
    - A10:2025
    cwe:
    - CWE-778
