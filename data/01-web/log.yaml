- id: WEB-LOG-001
  sheet: WEB
  category: LOG
  title: Review the logging inventory for each layer of the stack
  objective: Find layers with unknown logging, storage, access rules or retention.
  steps:
  - Ask for the logging inventory.
  - Check that it lists layers, events, formats, storage, use, access control and retention time.
  - Compare the inventory with real log sources on a test system.
  example: Document review; find /var/log -type f -mtime -1; list log groups with aws logs describe-log-groups
  expected: A current inventory exists for each layer and matches the real log sources.
  severity: Low
  test_type:
  - Manual
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.1.1
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-778
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A09_2025-Security_Logging_and_Alerting_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Logging_Cheat_Sheet.md
- id: WEB-LOG-002
  sheet: WEB
  category: LOG
  title: Make sure each log entry has the who, when, where and what
  objective: Find log entries that cannot support an investigation.
  steps:
  - Trigger a login, a failed access and a data change.
  - Read the log entries for each.
  - Check that they show time, source, user, action, object and result.
  - Check that the entries can be linked by a request or session ID.
  example: grep -E 'login|denied' /var/log/app/app.log | tail -5
  expected: Each security log entry has time, place, user, action and outcome. Entries can be correlated.
  severity: Medium
  test_type:
  - Manual
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.2.1
    owasp_top10:
    - A09:2025
    cwe:
    - CWE-223
    - CWE-778
    capec:
    - CAPEC-93
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A09_2025-Security_Logging_and_Alerting_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Logging_Cheat_Sheet.md
- id: WEB-LOG-003
  sheet: WEB
  category: LOG
  title: Check log time sources and time zone in timestamps
  objective: Find logging components with unsynchronized clocks or timestamps without a time zone.
  steps:
  - Check the time sync source (NTP or chrony) on every logging component.
  - Compare the clock offset between components.
  - Check that log timestamps use UTC or show the offset.
  example: chronyc tracking; timedatectl; grep -m3 -E '[0-9]{4}-[0-9]{2}-[0-9]{2}T' app.log
  expected: Clocks are in sync and log timestamps use UTC or an explicit offset.
  severity: Low
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.2.2
    owasp_top10:
    - A09:2025
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/Top10/2025/docs/en/A09_2025-Security_Logging_and_Alerting_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Logging_Cheat_Sheet.md
- id: WEB-LOG-004
  sheet: WEB
  category: LOG
  title: Make sure logs go only to the documented files and services
  objective: Find logs that are written or sent to places outside the inventory.
  steps:
  - List all log files and log targets that the application uses.
  - Check network connections for log traffic to unknown hosts.
  - Compare them with the inventory.
  example: lsof -p <pid> | grep -E 'log|\.out'; ss -tnp | grep <pid>
  expected: The application writes and sends logs only to the documented targets.
  severity: Low
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    cheatsheet:
    - Logging_Cheat_Sheet
    asvs:
    - V16.2.3
    owasp_top10:
    - A09:2025
