- id: WEB-LOG-014
  sheet: WEB
  category: LOG
  title: Check that attacks create alerts and that responders get them
  objective: Find monitoring that does not detect or escalate active attacks.
  preconditions:
  - Do not run on production without approval of the SOC.
  steps:
  - Run a scan with ZAP or Burp against the test system, or a series of failed logins.
  - Look at whether alerts are created within the agreed time.
  - Check that alerts reach the people who respond, with a playbook.
  - Check the alert thresholds and the rate of false alarms.
  - Check that honeytoken access creates an alert, if used.
  example: hydra -l admin -P short.txt example.com http-post-form '/login:u=^USER^&p=^PASS^:F=invalid'; then check the SIEM
  expected: Attacks and DAST scans create alerts. Responders receive them and follow a playbook.
  severity: Medium
  test_type:
  - Manual
  refs:
    owasp_top10:
    - A09:2025
    cheatsheet:
    - Logging_Cheat_Sheet
    cwe:
    - CWE-778
