- id: WEB-TLS-011
  sheet: WEB
  category: TLS
  title: Check TLS, trust and authentication between internal services
  objective: Find internal HTTP services that use clear text, untrusted certificates or no service authentication.
  steps:
  - Map internal HTTP service calls in the architecture documents.
  - Capture traffic between two internal services and look for clear text.
  - Check which CA each service trusts. Self-signed use must be pinned to specific CAs.
  - Call an internal service from another host without a client certificate.
  example: tcpdump -i any -A 'port 8080 and host 10.0.0.5'; openssl s_client -connect svc.internal:8443 -showcerts
  expected: Internal service traffic uses TLS with trusted certificates. Services use strong mutual authentication.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    asvs:
    - V12.3.3
    - V12.3.4
    - V12.3.5
    owasp_top10:
