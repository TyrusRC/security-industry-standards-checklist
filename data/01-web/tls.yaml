- id: WEB-TLS-002
  sheet: WEB
  category: TLS
  title: Make sure only strong cipher suites with forward secrecy are enabled
  objective: Find weak cipher suites, such as NULL, anonymous, EXPORT, RSA key transport and CBC, and weak key exchange groups.
  steps:
  - List all cipher suites that the server accepts for each protocol version.
  - Make sure NULL, anonymous, EXPORT and RC4 and 3DES suites are off.
  - Make sure TLS 1.2 uses ECDHE with AEAD suites and the server order puts the strongest first.
  - Make sure RSA key transport and static DH suites are off. They have no forward secrecy.
  - Check the Diffie-Hellman groups and look for ffdhe2048 or larger, x25519 or secp256r1.
  example: testssl.sh -E example.com:443; sslyze --regular example.com; Mozilla SSL config generator https://ssl-config.mozilla.org/
  expected: Only AEAD cipher suites with forward secrecy are accepted, strongest first. No NULL, anonymous, EXPORT or RSA key transport suite exists.
  severity: Medium
  test_type:
  - Automated
  - Config Review
  level: ASVS L2
  refs:
    wstg:
    - WSTG-CRYP-01
    asvs:
    - V12.1.2
    owasp_top10:
    - A04:2025
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    cwe:
    - CWE-326
