- id: WEB-TLS-005
  sheet: WEB
  category: TLS
  title: Make sure all connections use TLS with no clear-text fallback
  objective: Find cleartext HTTP, FTP or other services, and clients that fall back to clear text.
  steps:
  - Try each application host on port 80 and other plain ports with curl.
  - Look at the page source and traffic for http:// resources and mixed content.
  - 'Try a downgrade: strip the TLS upgrade and request the HTTP URL of login and API paths.'
  - Make sure no sensitive request is accepted on HTTP, and cookies have the Secure flag.
  - Check Basic authentication, login forms, password reset, change pages and payment pages.
  example: curl -si http://example.com/login; nmap -p 21,23,80,8080 example.com; mitmproxy --mode regular
  expected: The services accept sensitive data only over TLS. No cleartext fallback and no mixed active content exist.
  severity: High
  test_type:
  - Manual
  - Automated
  level: ASVS L1
  refs:
    wstg:
    - WSTG-CRYP-03
    - WSTG-CRYP-01
    asvs:
