- id: WEB-TLS-003
  sheet: WEB
  category: TLS
  title: Make sure external services use valid, publicly trusted TLS certificates
  objective: Find expired, self-signed, wrong-host or chain-broken certificates on public services.
  steps:
  - Get the certificate chain of each public host with openssl s_client or testssl.sh.
  - Make sure the validity dates are current and the chain ends at a public CA.
  - Make sure the Subject Alternative Name matches the host name.
  - Make sure the certificate uses a SHA-256 or stronger signature and a strong key.
  - Look for internal names or IP addresses in the Issuer and SAN fields.
  example: echo | openssl s_client -connect example.com:443 -servername example.com 2>/dev/null | openssl x509 -noout -text | grep -E 'Not After|Subject Alternative|Signature Algorithm|Public-Key'; testssl.sh
    -S example.com
  expected: All public services present valid certificates from a public CA, with matching SAN, SHA-256 or stronger signature, and no internal data.
  severity: Medium
  test_type:
  - Automated
  - Manual
  level: ASVS L1
  refs:
    wstg:
    - WSTG-CRYP-01
    asvs:
    - V12.2.2
    owasp_top10:
    - A04:2025
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    cwe:
    - CWE-295
    - CWE-296
    - CWE-297
