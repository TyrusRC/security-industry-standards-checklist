- id: WEB-TLS-004
  sheet: WEB
  category: TLS
  title: Review certificate key strength, wildcard use and key protection
  objective: Find weak certificate keys, wide wildcard certificates and unprotected private keys.
  steps:
  - Read the key type and size of each certificate.
  - Make sure RSA keys are 3072 bits or more, or ECDSA uses P-256 or better.
  - List the systems that share each wildcard certificate and check their trust levels.
  - Check the file permissions and storage of the private key.
  - Check certificate lifetime and automatic renewal, for example with ACME.
  example: testssl.sh -S example.com; ls -l /etc/ssl/private/; nmap --script ssl-cert -p443 example.com
  expected: Keys are strong and protected. Wildcard certificates are not shared between systems of different trust levels.
  severity: Low
  test_type:
  - Automated
  - Config Review
  refs:
    wstg:
    - WSTG-CRYP-01
    owasp_top10:
    - A04:2025
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    cwe:
    - CWE-326
