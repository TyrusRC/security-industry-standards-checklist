- id: WEB-TLS-007
  sheet: WEB
  category: TLS
  title: Check Online Certificate Status Protocol stapling and revocation
  objective: Find servers that do not support certificate revocation checks.
  steps:
  - Run openssl s_client with -status against the host.
  - Look for an OCSP response in the output.
  - Check that the certificate has OCSP or CRL information.
  - Check that the server renews the staple.
  example: echo | openssl s_client -connect example.com:443 -status 2>/dev/null | grep -A5 'OCSP Response'; testssl.sh -S example.com
  expected: The server staples a current OCSP response, or another revocation method is documented.
  severity: Low
  test_type:
  - Automated
  - Config Review
  level: ASVS L3
  refs:
    asvs:
    - V12.1.4
    cwe:
    - CWE-299
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/09-Weak_Cryptography/01-Weak_Transport_Layer_Security.md
- id: WEB-TLS-008
  sheet: WEB
  category: TLS
  title: Check that Encrypted Client Hello is enabled
  objective: Find TLS settings that expose the server name in clear text.
  steps:
  - Query the DNS HTTPS record for an ech parameter.
  - Test a TLS connection with an ECH-capable client.
  - Check the server and CDN settings for ECH.
  example: dig +short HTTPS example.com; curl --ech true https://example.com/ -v
  expected: ECH is enabled, or the owner has accepted the risk in writing.
  severity: Info
  test_type:
  - Manual
  - Config Review
  level: ASVS L3
  refs:
    asvs:
    - V12.1.5
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/09-Weak_Cryptography/01-Weak_Transport_Layer_Security.md
- id: WEB-TLS-009
  sheet: WEB
  category: TLS
  title: Make sure mTLS client certificates are validated before use
  objective: Find servers that accept untrusted or unchecked client certificates for identity.
  steps:
  - Connect with no certificate and with a self-signed certificate.
  - Connect with an expired certificate and a certificate from another CA.
  - Connect with a revoked certificate if a test one exists.
  - Check that the identity is taken only after chain validation.
  example: openssl s_client -connect example.com:443 -cert selfsigned.pem -key selfsigned.key; curl --cert client.pem --key client.key https://example.com/
  expected: The server rejects client certificates that are untrusted, expired, revoked or from another CA.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    asvs:
    - V12.1.3
    cwe:
    - CWE-295
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/09-Weak_Cryptography/01-Weak_Transport_Layer_Security.md
- id: WEB-TLS-010
  sheet: WEB
  category: TLS
  title: Make sure the application validates server certificates on outbound TLS
  objective: Find backend clients that disable certificate validation or use clear text to monitoring, databases and partners.
  steps:
  - 'List all outbound connections: databases, queues, partner APIs, monitoring, SSH and management tools.'
  - Search the code for switches that turn off certificate checks, such as InsecureSkipVerify and TrustAllCerts.
  - Put a proxy with a self-signed certificate in front of one outbound call.
  - Look at whether the call fails and the failure is logged.
  - Make sure no outbound connection falls back to clear text.
  example: grep -rEn 'verify\s*=\s*False|InsecureSkipVerify|rejectUnauthorized:\s*false|TrustAll' ./src; mitmproxy --mode reverse:https://partner.example
  expected: All outbound connections use TLS and reject invalid certificates. The failure is logged and there is no fallback to clear text.
  severity: High
  test_type:
  - Manual
  - Code Review
  level: ASVS L2
  refs:
    asvs:
    - V12.3.1
    - V12.3.2
    owasp_top10:
    - A04:2025
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    cwe:
    - CWE-295
    - CWE-297
    - CWE-319
