- id: WEB-TLS-006
  sheet: WEB
  category: TLS
  title: Make sure no channel sends sensitive data in clear text
  objective: Find credentials, session IDs and personal data that travel unencrypted or are stored in source and logs.
  steps:
  - Capture traffic during login, password reset, profile edit and payment.
  - Look for sensitive data in clear text in non-HTTP channels such as e-mail, FTP and SMTP.
  - Search the source and log files for hard-coded passwords and personal data.
  - Make sure the Secure flag is set on session cookies.
  example: tcpdump -i eth0 -A port 80 | grep -iE 'password|session'; grep -rEi 'password|pwd|secret' ./src
  expected: The application sends sensitive data only over encrypted channels. No clear-text secrets exist in source or logs.
  severity: High
  test_type:
  - Manual
  - Code Review
  refs:
    wstg:
    - WSTG-CRYP-03
    - WSTG-ATHN-01
    owasp_top10:
    - A04:2025
    cwe:
    - CWE-319
    - CWE-532
    - CWE-798
