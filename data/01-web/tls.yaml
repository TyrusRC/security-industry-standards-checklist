- id: WEB-TLS-001
  sheet: WEB
  category: TLS
  title: Make sure only TLS 1.2 and TLS 1.3 are enabled
  objective: Find old protocol versions (SSLv3, TLS 1.0, TLS 1.1) or weak settings such as compression.
  steps:
  - Scan the HTTPS port with testssl.sh or sslscan.
  - Make sure SSLv2, SSLv3, TLS 1.0 and TLS 1.1 are off.
  - Make sure TLS 1.3 is available and preferred.
  - Make sure TLS compression is off.
  - Repeat on every other TLS port that the application uses.
  example: testssl.sh --protocols --vulnerable example.com:443; nmap --script ssl-enum-ciphers -p443 example.com
  expected: Only TLS 1.2 and TLS 1.3 are enabled, with the latest version preferred. Compression is off and no known TLS attack applies.
  severity: Medium
  test_type:
  - Automated
  - Config Review
  level: ASVS L1
  refs:
    wstg:
    - WSTG-CRYP-01
    asvs:
    - V12.1.1
    owasp_top10:
    - A04:2025
    cheatsheet:
    - Transport_Layer_Security_Cheat_Sheet
    cwe:
    - CWE-326
    - CWE-327
    - CWE-757
    capec:
    - CAPEC-217
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/09-Weak_Cryptography/01-Weak_Transport_Layer_Security.md
