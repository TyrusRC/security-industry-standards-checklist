- id: WEB-PDP-002
  sheet: WEB
  category: PDP
  title: Test list, search, export and count paths for authorization filters
  objective: Find collection endpoints that return or count objects that the user may not access, even when single-object reads are safe.
  preconditions:
  - Two users with different data access.
  steps:
  - 'List the endpoints that return collections: list, search, export, count and aggregate.'
  - Call each endpoint as a low-privilege user and as a user of another tenant.
  - Compare the returned items, the total count and the facets with the allowed items.
  - Add filter and sort parameters with unusual operators and field names.
  - Use a returned identifier in an update or delete request.
  - 'Stop the policy service and look at the collection result: a missing filter must not mean all items.'
  example: 'curl -H "Authorization: Bearer <userB>" "https://target/api/orders?limit=1000&sort=-created"; GET /api/orders/count; GET /api/orders/export.csv'
  expected: Collection paths return and count only the objects that the user may access. Unsupported filters and missing policy output are denied. A listed item does not authorize later changes.
  severity: High
  test_type:
  - Manual
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    cheatsheet:
    - Authorization_Decisions_And_Output_Handling_Cheat_Sheet
    wstg:
    - WSTG-ATHZ-04
    asvs:
    - V8.2.2
    cwe:
    - CWE-639
    - CWE-285
  sources_read:
