- id: WEB-PDP-001
  sheet: WEB
  category: PDP
  title: Test that policy decision errors and timeouts deny access
  objective: Find enforcement points that allow a request when the policy decision service fails, times out or returns unusable output.
  preconditions:
  - A test environment where the decision service can be stopped.
  steps:
  - Find the enforcement points and the policy decision service that each one calls.
  - Stop the decision service or block the network path to it, in a test environment.
  - Send requests to protected operations and look at the result.
  - Return a slow, empty or malformed answer from a decision service test double.
  - Send a batch decision request with one missing item result and look at that item.
  - Look for a gateway setting that allows traffic when authorization fails.
  example: Block the PDP port with iptables; curl -i https://target/api/admin/users; check Envoy ext_authz failure_mode_allow
  expected: Every protected operation is denied when a valid decision is not available. A missing or invalid item in a batch is denied.
  severity: High
  test_type:
  - Manual
  - Config Review
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    - A10:2025
    cheatsheet:
    - Authorization_Patterns_Cheat_Sheet
    - Authorization_Decisions_And_Output_Handling_Cheat_Sheet
    asvs:
    - V8.1.1
    cwe:
    - CWE-636
    - CWE-862
    other:
    - 'OWASP DevGuide web app checklist: 07-access-controls.md'
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Patterns_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Decisions_And_Output_Handling_Cheat_Sheet.md
