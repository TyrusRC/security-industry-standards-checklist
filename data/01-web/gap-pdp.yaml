- id: WEB-PDP-003
  sheet: WEB
  category: PDP
  title: Review how authorization policy and data reach the decision points
  objective: Find policy distribution that lets old rules stay active, accepts unsigned policy or leaves decision APIs open.
  steps:
  - Find who may change each policy and attribute, and the maximum delay for a change to take effect.
  - Change a role or revoke a permission and measure the time until each decision point denies access.
  - Look for signature checks on policy bundles before activation.
  - Try to load an unsigned or old policy bundle in a test environment.
  - Make sure the decision and policy administration APIs need authentication and tenant scope.
  - Make sure a decision point with missing or old data denies the affected operations.
  example: opa run --server --verification-key key.pem ...; curl http://pdp:8181/v1/policies without credentials
  expected: Policy changes reach all decision points within the set delay. Only signed and approved bundles load. Old data or a missing bundle leads to deny. Policy APIs need authentication.
  severity: High
  test_type:
  - Config Review
  - Manual
  level: ASVS L3
  refs:
    owasp_top10:
    - A01:2025
    - A08:2025
    cheatsheet:
    - Authorization_Policy_And_Data_Distribution_Cheat_Sheet
    asvs:
    - V8.3.2
    cwe:
    - CWE-285
    - CWE-345
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Authorization_Policy_And_Data_Distribution_Cheat_Sheet.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.json
- id: WEB-PDP-004
  sheet: WEB
  category: PDP
  title: Check that an automated authorization matrix runs on every release
  objective: Find access rules that break over time because no automated test checks them against the documented matrix.
  steps:
  - 'Find the authorization matrix: roles, resources and actions in a machine-readable file.'
  - Make sure every service and route in the application appears in the matrix.
  - Run the matrix tests and look for each allowed and each denied combination.
  - Add a new route without a matrix entry and make sure the pipeline fails or alerts.
  - Make sure the tests cover horizontal, vertical and cross-tenant access and use two accounts per role.
  - Make sure the pipeline stops the release when a test fails.
  example: CI job output; pytest or Newman suite generated from authz-matrix.yaml with expected 200/403 for each role
  expected: A machine-readable matrix drives automated tests in the release pipeline. New routes without an entry fail the build. A failed test stops the release.
  severity: Medium
  test_type:
  - Config Review
  - Automated
  level: ASVS L2
  refs:
    owasp_top10:
    - A01:2025
    - A06:2025
