- id: WEB-XSS-003
  sheet: WEB
  category: XSS
  title: Test HTML sanitization of rich text and WYSIWYG input
  objective: Finds HTML sanitizers that fail to strip dangerous tags, attributes or SVG script content.
  preconditions:
  - Do not run on production.
  steps:
  - Find a feature that accepts rich HTML input, such as a WYSIWYG editor or markdown renderer.
  - Submit script tags, event handler attributes and an SVG element with embedded script.
  - Submit CSS, Markdown or template syntax that the renderer may evaluate as an expression.
  - Compare the stored output against the sanitizer allowlist and confirm it rejects dangerous content.
  example: <img src=x onerror=alert(1)> ; <svg onload=alert(1)><foreignObject><script>alert(1)</script></foreignObject></svg> ; Markdown/CSS/XSL expression payloads
  expected: The sanitizer strips scripts, event handlers and dangerous SVG elements, keeping only an explicit allowlist of tags and attributes.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    asvs:
    - V1.3.1
    - V1.3.4
    - V1.3.5
    cheatsheet:
    - Cross_Site_Scripting_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    - CWE-80
    capec:
    - CAPEC-63
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.md
- id: WEB-XSS-004
  sheet: WEB
  category: XSS
  title: Test URL, JavaScript and CSS output contexts for correct encoding
  objective: Finds output encoding that is missing or wrong for the URL, JavaScript, CSS or HTTP header context.
  preconditions:
  - Do not run on production.
  steps:
  - Find a value placed into a URL attribute, a JavaScript variable, a CSS value and an HTTP header.
  - Submit a context-breaking payload for each context, for example a quote for JavaScript or a URL scheme.
  - 'Check if the javascript: or data: scheme is accepted in a URL attribute.'
  - Confirm each context applies the matching encoder before use.
  example: 'URL context: javascript:alert(1) in href ; JS context: '';alert(1);'' ; CSS context: expression(alert(1)) or url(javascript:alert(1))'
  expected: 'Each context uses its matching encoder, and javascript: and data: schemes are rejected for navigable URLs.'
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    asvs:
    - V1.2.2
    - V1.2.3
    cheatsheet:
    - Cross_Site_Scripting_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    - CWE-83
    - CWE-84
    capec:
    - CAPEC-63
    - CAPEC-18
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.md
- id: WEB-XSS-005
  sheet: WEB
  category: XSS
  title: Test regular expressions and dynamic code features for injection and ReDoS
  objective: Finds unescaped use of regular expression metacharacters and catastrophic backtracking patterns.
  preconditions:
  - Do not run on production.
  steps:
  - Find inputs used to build a regular expression or passed to eval or a template expression language.
  - Submit regex metacharacters to confirm they are escaped before being used.
  - Submit a pattern crafted for exponential backtracking and measure response time.
  - Confirm the application does not call eval or Spring Expression Language on the input.
  example: 'Regex metachar probe: .*+ ; ReDoS payload: (a+)+$  followed by ''aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!'' ; eval probe: 7*7'
  expected: Regex metacharacters in user input are escaped, vulnerable patterns are avoided, and eval is never called on user input.
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    asvs:
    - V1.2.9
    - V1.3.2
    - V1.3.12
    cwe:
    - CWE-1333
    - CWE-95
    capec:
    - CAPEC-242
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: WEB-XSS-006
  sheet: WEB
  category: XSS
  title: Test DOM sinks for DOM-based cross-site scripting
  objective: Finds client-side JavaScript that writes an untrusted source into a dangerous DOM sink.
  preconditions:
  - Do not run on production.
  steps:
  - Review client-side JavaScript for sources such as location.hash, location.search and document.referrer.
  - Trace each source to its sink, for example innerHTML, document.write or eval.
  - Craft a payload in the URL fragment or query string that reaches the sink.
  - Load the crafted URL and confirm script execution in the browser.
  example: https://target/page#<script>alert(1)</script> ; https://target/?user=<img src=x onerror=alert(1)>
  expected: Untrusted sources are written only through safe sinks such as textContent, or are sanitized before reaching innerHTML or eval-like sinks.
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A05:2025
    wstg:
    - WSTG-CLNT-01
    asvs:
    - V3.2.2
    cheatsheet:
    - DOM_based_XSS_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    capec:
    - CAPEC-588
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/11-Client-side/01-DOM-based_Cross_Site_Scripting.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.md
  - sources/repos/Top10/2025/docs/en/A05_2025-Injection.md
- id: WEB-XSS-007
  sheet: WEB
  category: XSS
  title: Test self-triggered DOM XSS requiring a pasted payload
  objective: Finds client-side sinks that execute attacker content only after the victim pastes it into the page.
  preconditions:
  - Do not run on production.
  steps:
  - Find client-side functions that strip HTML tags using innerHTML and then read textContent.
  - Craft an HTML payload designed to survive the strip step, such as an img tag with an onerror handler.
  - Paste the payload into the field in the browser and submit it.
  - Check the developer console for the payload executing.
  example: <img src=x onerror=alert(1) /> pasted into a textarea whose submit handler reads innerHTML then textContent
  expected: The page never relies on a user pasting raw markup into a sink that can re-parse it as HTML.
  severity: Low
  test_type: Manual
  refs:
    wstg:
    - WSTG-CLNT-01
    cheatsheet:
    - DOM_based_XSS_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    capec:
    - CAPEC-588
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/11-Client-side/01-DOM-based_Cross_Site_Scripting.md
  - sources/repos/CheatSheetSeries/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.md
- id: WEB-XSS-008
  sheet: WEB
  category: XSS
  title: Test JavaScript injection sinks outside script tags
  objective: Finds JavaScript execution sinks reachable without a literal script tag, such as eval or location assignment.
  preconditions:
  - Do not run on production.
  steps:
  - Review the page for sinks such as eval, setTimeout, setInterval and window.location assignment that use untrusted data.
  - 'Submit a javascript: scheme payload where the sink assigns a user-controlled value to a navigation property.'
  - Confirm execution in the browser developer console.
  example: www.target.com/?javascript:alert(1) read by window.location=decodeURIComponent(location.search.substring(1))
  expected: User-controlled values never reach eval, setTimeout, setInterval or a navigation sink without validation.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-CLNT-02
    cheatsheet:
    - DOM_based_XSS_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    - CWE-95
    capec:
    - CAPEC-19
  sources_read:
