  - sources/repos/CheatSheetSeries/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.md
- id: WEB-XSS-009
  sheet: WEB
  category: XSS
  title: Test client-side HTML injection sinks
  objective: Finds client-side code that writes untrusted data into innerHTML or document.write.
  preconditions:
  - Do not run on production.
  steps:
  - Find client-side code that writes a URL fragment, query parameter or API response into innerHTML or document.write.
  - Submit an image tag with an onerror handler in the relevant input.
  - Confirm the payload executes in the rendered page.
  example: https://target/page.html?user=<img%20src='x'%20onerror=alert(1)>
  expected: Untrusted data is written only through safe text sinks, or is sanitized with a vetted library before reaching innerHTML.
  severity: Medium
  test_type: Manual
  level: ASVS L1
