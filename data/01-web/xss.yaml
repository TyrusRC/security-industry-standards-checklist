- id: WEB-XSS-001
  sheet: WEB
  category: XSS
  title: Test reflected input for cross-site scripting
  objective: Finds input that is echoed back in the response without context-aware encoding.
  preconditions:
  - Do not run on production.
  steps:
  - List every input that is reflected in the HTML response, including headers and hidden fields.
  - Submit a basic script payload in each input and view the rendered page source.
  - If the basic payload is blocked, try case variation, broken tags and non-recursive filter bypass payloads.
  - Confirm execution with a popup or a network call to a collector host.
  example: <script>alert(123)</script> ; "><script>alert(document.cookie)</script> ; <ScRiPt>alert(1)</ScRiPt> ; <scr<script>ipt>alert(1)</script>
  expected: The response HTML-encodes or JavaScript-escapes the reflected value for its context, so no script executes.
  severity: Medium
  test_type: Manual
  level: ASVS L1
  refs:
    owasp_top10:
    - A05:2025
    wstg:
    - WSTG-INJT-01
    asvs:
    - V1.1.1
    - V1.1.2
    - V1.2.1
    cheatsheet:
    - Cross_Site_Scripting_Prevention_Cheat_Sheet
    cwe:
    - CWE-79
    - CWE-80
    - CWE-87
    capec:
    - CAPEC-63
    - CAPEC-591
  sources_read:
  - sources/repos/wstg/document/4-Web_Application_Security_Testing/07-Injection/01-Reflected_Cross_Site_Scripting.md
