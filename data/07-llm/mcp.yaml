- id: LLM-MCP-004
  sheet: LLM
  category: MCP
  title: Check least privilege and scoped credentials for MCP servers
  objective: Finds MCP servers that hold broad tokens or share credentials.
  steps:
  - List each MCP server with its token and OAuth scopes.
  - Compare scopes with what the tools need.
  - Check that servers do not share tokens and that tokens are short-lived.
  - Check that tokens are in a secure store and not in plain text config files.
  example: 'Tools: config file search for tokens, OAuth app console review, trufflehog.'
  expected: Each server has its own narrow, short-lived credential in secure storage. Scopes match the tool need.
  severity: High
  test_type:
  - Config Review
