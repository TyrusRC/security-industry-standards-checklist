- id: LLM-MCP-010
  sheet: LLM
  category: MCP
  title: Check MCP logging and spending limits
  objective: Finds MCP use with no central log or no cap on paid calls.
  steps:
  - Run five tool calls through the host.
  - Look for log records with full parameters, user and time.
  - Check that secrets are redacted in the logs.
  - For paid tools, check that a spending limit sits in the component that pays, outside the model.
  example: 'Tools: SIEM query, gateway logs.'
  expected: All MCP tool calls are logged centrally with secrets redacted. Payment limits are enforced outside the model.
  severity: Medium
  test_type:
  - Config Review
