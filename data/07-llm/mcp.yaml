- id: LLM-MCP-006
  sheet: LLM
  category: MCP
  title: Test sandbox and file access limits of local MCP servers
  objective: Finds local MCP servers that run with full host access.
  steps:
  - Find how each local MCP server starts and with which user.
  - Ask a tool to read a file outside the allowed folders.
  - Ask a tool to open a network connection when no network is needed.
  - Check for container or sandbox limits on files, network and processes.
  example: 'Tools: manual, container inspect, strace in a lab.'
  expected: Local MCP servers run in a sandbox with allowed folders and no network by default. Reads outside the folders fail.
  severity: High
  test_type:
  - Manual
  - Config Review
