- id: LLM-MCP-007
  sheet: LLM
  category: MCP
  title: Test consent and installation of MCP servers
  objective: Finds clients that install or connect servers from web content or without clear consent.
  steps:
  - Open a page that links to an MCP install action.
  - Check that the client asks the user and shows the full command and publisher.
  - Add a new server and change its tools. Check for a new consent.
  - Check that untrusted data cannot start an installation.
  example: 'Tools: manual, mitmproxy.'
  expected: The client shows the full command, source and publisher before it connects a server. Web content cannot start an install.
  severity: Medium
  test_type:
  - Manual
