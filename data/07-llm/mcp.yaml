- id: LLM-MCP-005
  sheet: LLM
  category: MCP
  title: Test authentication, token audience, Origin and Host checks of MCP endpoints
  objective: Finds MCP servers that accept calls without authentication or with tokens for another audience.
  preconditions:
  - Test remote MCP server.
  steps:
  - Call a protected tool with no token and with an invalid token.
  - Call the tool with a token that has another audience.
  - Send a browser request with a wrong Origin header and a wrong Host header.
  - Check that a local HTTP server listens on localhost only and that TLS is on for remote servers.
  example: 'Tools: curl, Burp Suite. Expected result for an invalid Origin is HTTP 403.'
  expected: The server rejects missing tokens, wrong audience, invalid Origin and unexpected Host. Local servers bind to localhost.
  severity: High
  test_type:
  - Manual
  - Config Review
  refs:
    llm_top10:
    - LLM06:2025
    - LLM03:2026
    agentic_top10:
    - ASI03
    - ASI07
    atlas:
    - AML.M0019
    cwe:
    - CWE-306
    - CWE-346
    - CWE-287
    cheatsheet:
    - MCP_Security_Cheat_Sheet
    other: MCP cheat sheet section 6
  see:
