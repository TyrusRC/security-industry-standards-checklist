    - ASI04
    atlas:
    - AML.T0110
    - AML.T0099
    - AML.T0104
    - AML.M0033
    cwe:
    - CWE-829
    - CWE-912
    cheatsheet:
    - MCP_Security_Cheat_Sheet
    other: ASI02 scenario 1; ASI04 scenario 2
