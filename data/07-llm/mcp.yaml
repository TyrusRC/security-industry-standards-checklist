- id: LLM-MCP-001
  sheet: LLM
  category: MCP
  title: Review MCP tool descriptions and schemas for hidden instructions
  objective: Finds tool names, descriptions, parameters and return schemas that hold instructions for the model.
  steps:
  - List every MCP server and export the full tool definitions.
  - Read the description, parameter names, types and defaults of each tool.
  - Look for text that tells the model to read files, call other tools or hide actions.
  - Run an MCP scanner on the definitions.
  example: 'Tools: mcp-scan (named in the MCP Security Cheat Sheet), manual review. Treat the whole schema as an injection surface.'
  expected: No tool definition holds instructions to the model. Reviewers approved every field of the schema.
  severity: High
  test_type:
  - Manual
  - Config Review
  refs:
    llm_top10:
    - LLM03:2025
    - LLM04:2026
    - LLM01:2025
    - LLM01:2026
