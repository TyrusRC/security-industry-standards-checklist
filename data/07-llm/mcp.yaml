- id: LLM-MCP-008
  sheet: LLM
  category: MCP
  title: Test MCP server tool inputs for injection, traversal and SSRF
  objective: Finds MCP tools that trust parameters that come from model output.
  steps:
  - Read the JSON schema of each tool and check for additionalProperties false and string patterns.
  - Send command separators, quotes, dot-dot paths and internal URLs in parameters.
  - Check that the server validates and encodes each input.
  - Check that outputs are cleaned before they go back to the model.
  example: 'Parameter values "a; id", "../../x", "http://127.0.0.1:8080/". Tools: Burp Suite, ffuf, manual.'
  expected: Tools validate every parameter with strict schemas and encode data for databases, shells and paths. Internal URLs are blocked.
  severity: High
  test_type:
  - Manual
