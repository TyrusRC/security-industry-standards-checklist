- id: LLM-RAG-006
  sheet: LLM
  category: RAG
  title: Test whether similarity scores and top-k results leak the corpus
  objective: Finds APIs that show raw scores that let an attacker find or map documents.
  steps:
  - Check whether the API response holds similarity scores or distances.
  - Query for a known document and for a text that is not in the corpus.
  - Compare the scores to decide if a document exists.
  - Check that the API limits top-k and adds noise or hides scores.
  example: 'Tools: curl, scripts that compare score distributions.'
  expected: Clients get no raw similarity scores. The top-k size is limited and queries are rate-limited per identity.
  severity: Medium
  test_type:
  - Manual
