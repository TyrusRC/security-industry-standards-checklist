- id: LLM-RAG-003
  sheet: LLM
  category: RAG
  title: Test retrieval-time access control per chunk and per user
  objective: Finds retrieval that returns chunks that the user may not read.
  preconditions:
  - Two test users with different rights to documents.
  steps:
  - Load a restricted canary document that only user A may read.
  - As user B, ask questions that match the canary text.
  - Change the permissions of user A and ask again.
  - Check that the access check runs inside the index query and not after generation.
  example: 'Tools: manual, promptfoo, vector DB filter review.'
  expected: Retrieval enforces access control at query time inside the index. Revoked rights take effect at once.
  severity: High
  test_type:
  - Manual
