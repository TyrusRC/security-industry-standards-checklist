- id: LLM-RAG-004
  sheet: LLM
  category: RAG
  title: Test tenant isolation and cross-tenant probing in vector stores
  objective: Finds shared indexes where one tenant can find or read the data of another tenant.
  preconditions:
  - Two test tenants on the same service.
  steps:
  - Load canary documents for tenant B.
  - As tenant A, send many probing queries about the canary topic.
  - Compare the result counts, the timing and the scores.
  - Check that the system uses separate namespaces or indexes, with the scope set on the server.
  example: 'Tools: manual, scripts that record latency and counts, client-supplied tenant ID changes.'
  expected: Tenant A gets no result, count or timing signal about tenant B. The server sets the tenant scope.
  severity: High
  test_type:
  - Manual
