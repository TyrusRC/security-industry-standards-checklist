- id: LLM-RAG-002
  sheet: LLM
  category: RAG
  title: Check document provenance, allowlists and integrity manifests
  objective: Finds knowledge bases that accept documents from unknown sources or cannot show changes.
  steps:
  - List the sources of the knowledge base and the owner of each.
  - Check that only approved sources can add documents.
  - Check for a signed manifest of document hashes and for upload records.
  - Change a document in the source and check that the system detects it.
  example: 'Tools: sha256sum, manifest comparison scripts, approval workflow review.'
  expected: Only approved sources feed the index. A signed hash manifest and provenance records show who added what and when.
  severity: Medium
  test_type:
