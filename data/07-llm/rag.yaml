- id: LLM-RAG-005
  sheet: LLM
  category: RAG
  title: Test whether embeddings can be inverted to source text
  objective: Finds systems that treat stored vectors as non-sensitive.
  preconditions:
  - Own test corpus with canary text and own embedding model.
  steps:
  - Embed canary sentences and export the vectors.
  - Run an inversion tool against the vectors in the lab.
  - Measure how much source text is recovered.
  - Check that vector stores and backups have the same protection and classification as source documents.
  example: 'Tools: Vec2Text-style research code named in LLM09:2026, custom scripts. Use only canary data.'
  expected: Vector stores and backups are encrypted and access controlled as source data. The team treats a vector leak as a source data leak.
  severity: High
  test_type:
  - Manual
  - Automated
