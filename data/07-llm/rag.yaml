- id: LLM-RAG-009
  sheet: LLM
  category: RAG
  title: Test semantic cache and deduplication poisoning
  objective: Finds caches that serve attacker text to other users or merge near-duplicates in a wrong way.
  preconditions:
  - Test system with a semantic cache.
  steps:
  - Send a query with a poisoned answer so that the cache stores it.
  - With another user, send a similar query and check the answer.
  - Change the permissions of the source and check whether the cache still serves old data.
  - Check cache scope, TTL and invalidation on source change.
  example: 'Tools: manual with two users, cache log review.'
  expected: Caches are scoped to user, tenant and permission level, with a short TTL. Invalidation follows source changes.
  severity: Medium
  test_type:
  - Manual
