- id: LLM-PAY-005
  sheet: LLM
  category: PAY
  title: Test that screening results carry the list version and expire
  objective: Finds payment flows that accept a clean result from an old list or an old screening.
  preconditions:
  - Sandbox environment.
  steps:
  - Get a screening receipt for a test payee. Look at the signed fields.
  - Make sure the receipt holds the list names, the list version or date, the time and the transaction hash.
  - Use the receipt for a different transaction. Make sure the service refuses it.
  - Use a receipt older than the maximum age. Make sure the service asks for a new screen.
  - Make sure a receipt value set by the issuer cannot raise the maximum age of the verifier.
  example: decode the receipt (JWS) and look at list_version, screened_at and txn_hash ; replay it on another payment
  expected: Receipts name the list version and the transaction. The verifier refuses receipts for other transactions or older than its own maximum age.
  severity: Medium
  test_type:
  - Manual
  - Automated
  refs:
    llm_top10:
    - LLM06:2025
    cwe:
    - CWE-294
    - CWE-345
    cheatsheet:
    - AML_Sanctions_AI_Agent_Payments_Cheat_Sheet
    other: AML cheat sheet sections 9 and 10
  sources_read:
