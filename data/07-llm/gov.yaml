- id: LLM-GOV-005
  sheet: LLM
  category: GOV
  title: Check the incident response playbook for AI disclosure and abuse
  objective: Finds teams with no plan for AI-specific incidents.
  steps:
  - Read the incident response plan and look for AI sections.
  - Run a table-top exercise for a leak of a vector store and for a poisoned document.
  - Check the steps for scope, cleanup of vectors and caches, vendor notice and legal notice.
  - Check that the plan names rollback and kill switch steps.
  example: 'Tools: table-top exercise script, RAG cheat sheet incident steps.'
  expected: The plan covers AI incidents with named roles and steps. The exercise shows that the team can scope, clean up and report.
  severity: Medium
  test_type:
  - Manual
  refs:
    llm_top10:
