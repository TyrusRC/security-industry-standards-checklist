- id: LLM-GOV-006
  sheet: LLM
  category: GOV
  title: Run adversarial tests for agents in the release pipeline
  objective: Finds release pipelines that do not retest abuse cases after changes to prompts, tools or models.
  steps:
  - Find the abuse cases tests for injection, memory poisoning and tool abuse.
  - Change a prompt, a tool policy and the model provider in a test branch.
  - Check that the pipeline runs the tests and blocks the release on failure.
  - Check that a pull request cannot remove tests without review.
  example: 'Tools: promptfoo in the pipeline, garak, PyRIT.'
  expected: Each change to prompts, tools, memory, retrieval or provider runs the abuse tests. Failed tests block the release and test changes need review.
  severity: Medium
  test_type:
  - Automated
  - Config Review
  refs:
    llm_top10:
    - LLM01:2025
    - LLM01:2026
    - LLM06:2025
    - LLM03:2026
