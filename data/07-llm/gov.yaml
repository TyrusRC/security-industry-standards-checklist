- id: LLM-GOV-001
  sheet: LLM
  category: GOV
  title: Review training data sets for diversity and coverage
  objective: Finds data sets that do not cover the target users or conditions.
  steps:
  - Get the data set description and the target population.
  - Compare group shares with the target population.
  - Compute fairness metrics on outcomes in the data.
  - Record gaps and the plan to fix them.
  example: 'Tools: IBM AI Fairness 360, Fairlearn, TensorFlow Data Validation (AITG-DAT-03 tool list).'
  expected: Group shares match the target population within set limits. Fairness metrics stay inside the limits and gaps have an owner.
  severity: Low
  test_type:
  - Manual
  - Config Review
  refs:
    llm_top10:
    - LLM04:2025
    - LLM05:2026
    - LLM09:2025
    - LLM07:2026
    other: AITG-DAT-03
  sources_read:
