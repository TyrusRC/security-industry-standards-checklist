- id: LLM-GOV-003
  sheet: LLM
  category: GOV
  title: Test consent records and data minimization in AI data flows
  objective: Finds data collection beyond the stated purpose or that ignores a withdrawal of consent.
  steps:
  - Send an extra field to the data collection API and check that the backend drops it.
  - Grant and withdraw consent for a test user and read the consent record.
  - Check that the withdrawal stops use of the data in training and retrieval.
  - Check that time stamps are in the record.
  example: 'Tools: Burp Suite, consent platform logs, Google Cloud DLP.'
  expected: The backend accepts only needed fields. Consent records are time stamped and a withdrawal stops use of the data.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  refs:
    llm_top10:
    - LLM02:2025
    - LLM02:2026
    - LLM03:2025
    - LLM04:2026
    cwe:
    - CWE-359
    other: AITG-DAT-05
  sources_read:
  - sources/repos/www-project-ai-testing-guide/Document/content/tests/AITG-DAT-05_Testing_for_Data_Minimization_and_Consent.md
