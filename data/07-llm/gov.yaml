- id: LLM-GOV-002
  sheet: LLM
  category: GOV
  title: Scan data sets for harmful and toxic content
  objective: Finds data sets that contain harmful content that the model can learn.
  steps:
  - Run a toxicity and bias scan over a sample and the full data set.
  - Compute the share of harmful items.
  - Remove or fix flagged items and run the scan again.
  - Record the sources and the rules of collection.
  example: 'Tools: Perspective API, Detoxify, Fairlearn (AITG-DAT-04 tool list).'
  expected: The harmful content share is under the set limit, for example 1 percent in AITG-DAT-04. Collection rules and scan reports exist.
  severity: Low
  test_type:
  - Automated
  refs:
    llm_top10:
    - LLM04:2025
    - LLM05:2026
    - LLM09:2025
    - LLM07:2026
    atlas:
