- id: LLM-GOV-004
  sheet: LLM
  category: GOV
  title: Test erasure of data from models, embeddings and adapters
  objective: Finds erasure requests that remove only the source data and not derived artifacts.
  steps:
  - Put canary records in a test data set, an index and a fine-tune.
  - Send an erasure request for the canary records.
  - Check raw data, embeddings, caches, checkpoints and adapters.
  - Run extraction and membership tests for the canary records.
  example: 'Tools: vector DB queries, extraction probes, garak.'
  expected: Erased records are absent from data, indexes, caches and derived models. Extraction tests do not find them.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  refs:
    llm_top10:
    - LLM02:2025
    - LLM02:2026
    - LLM08:2025
    - LLM09:2026
    atlas:
