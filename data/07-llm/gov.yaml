- id: LLM-GOV-007
  sheet: LLM
  category: GOV
  title: Check insider threat monitoring and oversight training for AI agents
  objective: Finds programs that do not cover agents or that leave human reviewers untrained.
  steps:
  - Check that agents appear in the insider threat program.
  - Check for monitoring of prompts that seek sensitive data or change agent behavior.
  - Check that reviewers of agent actions have training on automation bias.
  - Check for a way for users to report odd agent behavior.
  example: 'Tools: policy review, training records.'
  expected: Agents are in the insider threat program. Reviewers have training and users have a clear way to report.
  severity: Low
  test_type:
  - Manual
  - Config Review
  refs:
    llm_top10:
    - LLM06:2025
    - LLM03:2026
    agentic_top10:
    - ASI01
