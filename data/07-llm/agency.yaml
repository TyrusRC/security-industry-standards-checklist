- id: LLM-AGENCY-008
  sheet: LLM
  category: AGENCY
  title: Review agent capability budgets with the Rule of Two
  objective: Finds agents that have untrusted input, sensitive data and state change at the same time.
  steps:
  - For each agent, mark if it reads untrusted input.
  - Mark if it can read sensitive data.
  - Mark if it can change state or send data outside.
  - Check that an agent with all three needs approval for each action.
  - Check that an agent with two has a written risk assessment.
  example: Table with columns agent, A untrusted input, B sensitive data, C state change. Source of the rule is Meta AI (2025) as named in LLM01:2026.
  expected: No agent has all three properties without per-action human approval. Agents with two have a written risk assessment.
  severity: High
  test_type:
