- id: LLM-AGENCY-001
  sheet: LLM
  category: AGENCY
  title: Review the tool inventory for unneeded functions
  objective: Finds tools and functions that the agent has but does not need.
  steps:
  - List every tool and function that the agent can call, with its parameters.
  - Mark each function that the task needs.
  - Find old or trial tools that stay in the tool list.
  - Find tools that have write or delete functions when the task needs only read.
  - Remove each function that the task does not need.
  example: 'Tools: tool manifest review, mcp-scan for MCP servers, promptfoo.'
  expected: The agent has only the tools and functions that its task needs. Old and trial tools are removed.
  severity: High
  test_type:
  - Config Review
  - Code Review
