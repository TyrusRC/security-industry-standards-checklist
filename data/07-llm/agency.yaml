- id: LLM-AGENCY-005
  sheet: LLM
  category: AGENCY
  title: Test that approvals bind to the exact action and expire
  objective: Finds approvals that a changed or replayed action can reuse.
  steps:
  - Get an approval for one action.
  - Change a parameter after the approval and send the action.
  - Send the same approval again after it was used and after it expired.
  - Check that critical actions need step-up authentication.
  example: 'Tools: manual with an API proxy, Burp Suite Repeater.'
  expected: An approval covers the actor, tool, target and parameters of one action. It is single-use and expires fast.
  severity: High
  test_type:
  - Manual
