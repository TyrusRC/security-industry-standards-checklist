- id: LLM-AGENCY-006
  sheet: LLM
  category: AGENCY
  title: Test complete mediation of tool calls outside the model
  objective: Finds backends that trust the model to decide whether an action is allowed.
  steps:
  - Read the roles and limits in the system prompt and find the code that enforces each.
  - Find the policy check that runs before each tool call.
  - Call the downstream API directly with the agent token and a forbidden action.
  - Make the model request a forbidden action and note the result.
  - Check that the policy check runs in code and not in the prompt.
  example: 'Tools: OPA policy tests, Burp Suite, manual.'
  expected: A policy point outside the model checks each call against the rights of the user. A forbidden call fails even if the model asks for it.
  severity: High
  test_type:
  - Manual
  - Code Review
