  - sources/top10s/llm2026_LLM10_ImproperOutputHandling.md
- id: LLM-OUTPUT-008
  sheet: LLM
  category: OUTPUT
  title: Check that generated code is reviewed before build and deploy
  objective: Finds pipelines that compile and deploy model-written code without review or tests.
  steps:
  - Find each path where a model writes code, configuration or infrastructure files.
  - Check whether a person reviews the change.
  - Check that static scans and tests run before a build or a deploy.
  - Check that the package list is pinned and scanned.
  example: 'Tools: semgrep, CI policy review, dependency scanners, pip-audit or npm audit.'
  expected: Model-written code goes through review, scans and tests before production. No pipeline deploys it by itself.
  severity: High
  test_type:
  - Config Review
  - Code Review
  refs:
