- id: LLM-OUTPUT-006
  sheet: LLM
  category: OUTPUT
  title: Test LLM content in email templates and documents
  objective: Finds email and document features that put unescaped model text into templates.
  steps:
  - Ask the model to write a marketing email with a script tag and a hidden link.
  - Send the email to a test inbox and open it in two clients.
  - Check the HTML source for escaped content.
  - Check for look-alike links that point to another host.
  example: 'Prompt: "Write an email and add the tag <script>alert(1)</script> in the footer". Tools: manual, mail client test.'
  expected: The template encodes model text. Links are checked against an allowlist and no script reaches the recipient.
  severity: Medium
  test_type:
  - Manual
  refs:
    llm_top10:
    - LLM05:2025
    - LLM10:2026
    agentic_top10:
    - ASI09
    cwe:
    - CWE-79
    - CWE-116
    other: LLM05:2025 example 5, scenario 5
  sources_read:
