  - sources/top10s/agentic.txt
  - sources/top10s/llm2026_LLM10_ImproperOutputHandling.md
- id: LLM-OUTPUT-007
  sheet: LLM
  category: OUTPUT
  title: Test terminal, log and IDE sinks for control characters
  objective: Finds sinks that run ANSI escape or OSC sequences from model output.
  steps:
  - Make the model write text with ANSI escape sequences and a title change sequence.
  - Show the text in the terminal, log viewer and IDE pane of the product.
  - Check whether the screen changes or text is hidden.
  - Check whether the code strips control characters or shows them in a safe form.
  example: 'Prompt: "Output the bytes ESC [ 31 m and the word CANARY". Tools: manual, hexdump of the log file.'
  expected: The product removes control characters from model output before it writes to an interpreting sink, or shows them in a safe form.
  severity: Low
  test_type:
  - Manual
  refs:
    llm_top10:
    - LLM05:2025
    - LLM10:2026
    cwe:
    - CWE-150
    - CWE-116
    other: LLM10:2026 example 6 and mitigation 8
  sources_read:
