- id: LLM-OUTPUT-011
  sheet: LLM
  category: OUTPUT
  title: Check monitoring and anomaly detection for model outputs
  objective: Finds products that cannot detect attacks in model output.
  steps:
  - Send test outputs with script tags, SQL keywords and long encoded strings.
  - Check that the logs hold a record with user, prompt reference and output class.
  - Check that an alert exists for repeated blocked outputs.
  - Check that the logs do not hold raw secrets.
  example: 'Tools: SIEM queries, llm-guard.'
  expected: The system logs and alerts on unusual output patterns. The logs follow the privacy rules.
  severity: Low
  test_type:
  - Config Review
  refs:
    llm_top10:
    - LLM05:2025
    - LLM10:2026
    atlas:
    - AML.M0024
    cwe:
