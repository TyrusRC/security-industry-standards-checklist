- id: LLM-OUTPUT-009
  sheet: LLM
  category: OUTPUT
  title: Test deserialization of model-generated objects
  objective: Finds components that deserialize objects or documents that a model wrote.
  steps:
  - Find the code that loads pickle, YAML, XML or JSON objects from model output or agent messages.
  - Make the model output an object with a harmless marker payload.
  - Check whether the loader uses a safe parser with a type allowlist.
  - Check whether the object is signed or checked before it is loaded.
  example: 'Tools: code review, semgrep rules for pickle.loads and yaml.load. Use a marker file as the payload.'
  expected: Loaders use safe formats and type allowlists. No component loads executable object data from model output.
  severity: High
  test_type:
  - Code Review
  - Manual
  refs:
    llm_top10:
    - LLM05:2025
    - LLM10:2026
    agentic_top10:
    - ASI05
    - ASI07
    cwe:
    - CWE-502
    other: ASI05 scenario 4
