- id: LLM-MODEL-006
  sheet: LLM
  category: MODEL
  title: Test fine-tuning APIs for loss or gradient information leaks
  objective: Finds fine-tuning interfaces that give per-example loss, which helps optimize attacks.
  preconditions:
  - Access to the fine-tuning API of a closed model, if you are the provider.
  steps:
  - Read the response fields of the fine-tuning job.
  - Check whether per-example loss or log probabilities appear.
  - Check whether the interface limits job counts and data size.
  - Check that the provider limits access to approved users.
  example: 'Tools: manual API review.'
  expected: Fine-tuning APIs give only aggregate information and limit usage. Per-example loss is not exposed to untrusted users.
  severity: Low
  test_type:
  - Config Review
  - Manual
  refs:
    llm_top10:
    - LLM01:2025
    - LLM01:2026
    - LLM10:2025
    - LLM06:2026
    atlas:
    - AML.T0044
    - AML.M0004
    cwe:
    - CWE-200
    other: LLM01:2026 common example 7
  sources_read:
