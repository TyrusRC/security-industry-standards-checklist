- id: LLM-MODEL-007
  sheet: LLM
  category: MODEL
  title: Test disclosure red teaming as a release gate
  objective: Finds releases with no measured test of extraction, membership inference and inversion.
  steps:
  - 'List the disclosure tests: extraction, membership inference, inversion and side channels.'
  - Check that each test has a pass limit tied to data class.
  - Check that a failed test blocks the release.
  - Check that results are kept with model hashes.
  example: 'Tools: ART, ML Privacy Meter, garak. Align test names with MITRE ATLAS techniques T0024.'
  expected: Disclosure tests run before release with set limits. A failed test blocks the release and the result is stored.
  severity: Medium
  test_type:
  - Automated
  - Manual
  refs:
    llm_top10:
    - LLM02:2025
    - LLM02:2026
    - LLM10:2025
