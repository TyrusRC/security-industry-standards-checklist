- id: LLM-DATA-005
  sheet: LLM
  category: DATA
  title: Check logs, traces and telemetry for prompts and reasoning content
  objective: Finds logs and observability tools that store full prompts, answers, chunks or reasoning traces for many users.
  steps:
  - List each log, trace and telemetry sink that receives LLM data.
  - Send a request with a fake secret and a fake PII value.
  - Search every sink for the fake secret and for the reasoning trace.
  - Check who can read each sink and how long it keeps the data.
  - Check that the sink masks sensitive fields before it stores them.
  example: 'Tools: search in Langfuse, LangSmith or Datadog for the canary, Splunk or Elastic queries, TruffleHog on log exports.'
  expected: Logs hold no raw secret, no PII and no raw reasoning trace outside a restricted store. Access and retention follow the data class.
  severity: High
  test_type:
  - Config Review
  - Manual
  refs:
    llm_top10:
    - LLM02:2025
    - LLM02:2026
    agentic_top10:
