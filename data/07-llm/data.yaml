- id: LLM-DATA-013
  sheet: LLM
  category: DATA
  title: Test data minimization before data goes to model providers
  objective: Finds requests that send more fields than the task needs to a model provider.
  steps:
  - Capture a sample of requests from the application to the provider.
  - List the fields in each request.
  - Compare the fields with the data the task needs.
  - Check that auto-context features are off unless a use case needs them.
  - Check that no-train and no-retain terms are set in the provider account.
  example: 'Tools: mitmproxy on a test client, provider account settings review.'
  expected: Each request holds only the fields that the task needs. The provider contract and settings forbid training and retention of the data.
  severity: Medium
  test_type:
  - Config Review
  - Manual
