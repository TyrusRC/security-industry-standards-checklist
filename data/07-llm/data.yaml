- id: LLM-DATA-012
  sheet: LLM
  category: DATA
  title: Check storage and access for training and fine-tune data
  objective: Finds datasets stored in public or weakly protected locations.
  steps:
  - List the stores for raw data, cleaned data, embeddings and checkpoints.
  - Check that each store needs authentication and is not public.
  - Check encryption at rest and the key owner.
  - Check who can read, write and delete.
  - Test access with a role that has no need for the data.
  example: 'Tools: cloud config scanners, aws s3api get-bucket-acl on your own account, Burp Suite for APIs.'
  expected: Training stores are private and encrypted. Only named roles can read them and all access is logged.
  severity: High
  test_type:
  - Config Review
