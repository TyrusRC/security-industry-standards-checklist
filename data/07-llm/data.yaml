- id: LLM-DATA-006
  sheet: LLM
  category: DATA
  title: Test shared chat links and caches for exposure to search engines
  objective: Finds shared conversation pages that search engines can index.
  steps:
  - Make a shared link to a test conversation with a canary phrase.
  - Fetch the page and look at the robots meta tag and the X-Robots-Tag header.
  - Check that the link needs a long random token and expires.
  - Check that a user can delete the shared link.
  example: curl -I https://target/share/<token> and look for noindex. Search the canary phrase on a search engine after one week.
  expected: Shared pages use noindex, a long random token and an expiry. The user can revoke the link.
  severity: Medium
  test_type:
  - Manual
  refs:
    llm_top10:
    - LLM02:2025
    - LLM02:2026
    atlas:
    - AML.T0057
    cwe:
    - CWE-200
    other: LLM02:2026 example 2
  sources_read:
  - sources/repos/www-project-top-10-for-large-language-model-applications/2_0_vulns/LLM02_SensitiveInformationDisclosure.md
  - sources/top10s/llm2026_LLM02_SensitiveInformationDisclosure.md
- id: LLM-DATA-007
  sheet: LLM
  category: DATA
  title: Test streaming and size patterns for side-channel leaks
  objective: Finds encrypted streams where packet size or timing shows the topic of a conversation.
  preconditions:
  - Network capture of your own test traffic. Do not capture other users.
  steps:
  - Capture the stream of ten test prompts on different topics.
  - Compare the token size sequence for each topic.
  - Check whether the service adds random padding or batches tokens.
  - Check whether high-sensitivity tenants have partitioned caches.
  example: 'Tools: tcpdump or Wireshark on a test client, Python for the size series.'
  expected: The stream hides the topic of a conversation by padding or batching. Cache partitions exist for high-sensitivity tenants.
  severity: Low
  test_type:
  - Manual
  - Automated
  refs:
    llm_top10:
    - LLM02:2025
    - LLM02:2026
    atlas:
    - AML.T0057
    cwe:
    - CWE-203
    other: LLM02:2026 example 5 and mitigation 12
  sources_read:
  - sources/repos/www-project-top-10-for-large-language-model-applications/2_0_vulns/LLM02_SensitiveInformationDisclosure.md
  - sources/top10s/llm2026_LLM02_SensitiveInformationDisclosure.md
- id: LLM-DATA-008
  sheet: LLM
  category: DATA
  title: Test API exposure of log probabilities and confidence values
  objective: Finds APIs that give log probabilities that help membership inference and model extraction.
  steps:
  - Send a request with logprobs and logit_bias set, if the API has these options.
  - Check whether the response holds token probabilities or confidence scores.
  - Check whether the exposure is needed for the use case.
  - Check whether the API gives the data to all users or only to approved roles.
  example: 'Request fields logprobs, top_logprobs, logit_bias. Tools: curl, Burp Suite.'
  expected: Production endpoints give no log probabilities, confidence values or explanations unless a documented need exists.
  severity: Medium
  test_type:
  - Manual
  - Config Review
