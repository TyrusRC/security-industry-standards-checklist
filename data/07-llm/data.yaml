- id: LLM-DATA-011
  sheet: LLM
  category: DATA
  title: Check LLM API errors and debug output for prompts and model data
  objective: Finds errors and debug output that show prompt text, tool schemas, model paths or retrieved chunks.
  steps:
  - Send malformed prompts, over-long input and a bad tool call to the LLM API.
  - Read each error body and header.
  - Look for prompt text, tool schemas, model paths, retrieved chunks and token counts.
  - Make sure debug and verbose flags are off.
  - Make sure the API returns generic errors.
  example: 'Tools: Burp Suite, curl, fuzz scripts.'
  expected: Errors are generic. They hold no stack trace, prompt text, key or internal path.
  severity: Low
  test_type:
  - Manual
  refs:
    llm_top10:
    - LLM02:2025
    - LLM02:2026
    - LLM07:2025
    cwe:
