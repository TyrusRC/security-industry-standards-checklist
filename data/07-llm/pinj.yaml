- id: LLM-PINJ-016
  sheet: LLM
  category: PINJ
  title: Run adaptive attack tests and keep results with their limits
  objective: Finds claims of low attack success that rest on fixed attack lists only.
  steps:
  - Record the model, the defense versions and the settings under test.
  - Run a fixed attack set and note the count of successes and attempts.
  - Give testers the full description of the defense and let them adapt the attacks.
  - Repeat the run after each change to the model, prompt, tools or retrieval.
  - Keep the paired results to compare two defenses on the same cases.
  example: 'Baseline sets named in LLM01:2026 are AgentDojo and JailbreakBench. Tools: promptfoo, garak, PyRIT. Report counts, not only rates.'
  expected: The report holds counts, versions and settings. Adaptive testers cannot break the defense with the full defense description.
  severity: Medium
  test_type:
  - Manual
  - Automated
