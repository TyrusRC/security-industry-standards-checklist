- id: LLM-DOS-011
  sheet: LLM
  category: DOS
  title: Test graceful degradation and queue limits
  objective: Finds services that fail fully under load or that queue without a limit.
  preconditions:
  - Test environment.
  steps:
  - Send load until latency rises.
  - Check that the service sheds low-priority work and keeps core functions.
  - Check queue length limits, timeouts and the total number of queued actions.
  - Check scaling and load balancing settings.
  example: 'Tools: k6, Locust, Prometheus, Grafana.'
  expected: Under load the service degrades with limits and timeouts. Queues are bounded and recovery is automatic.
  severity: Medium
  test_type:
  - Manual
  refs:
    llm_top10:
    - LLM10:2025
    - LLM06:2026
    atlas:
    - AML.M0004
    cwe:
    - CWE-400
    attack:
    - T1498
    other: LLM10:2025 mitigations 9 and 10
