- id: LLM-DOS-009
  sheet: LLM
  category: DOS
  title: Test model extraction by high-volume API queries
  objective: Finds APIs where an attacker can copy the model behavior with many queries.
  preconditions:
  - Test API with your own model.
  steps:
  - Collect 10000 input-output pairs from the API with a test key.
  - Train a surrogate model on the pairs.
  - Compare the surrogate with the target on a held-out set.
  - Check the rate limits, the anomaly alerts and the logit exposure.
  example: 'Tools: PrivacyRaven, ML Privacy Meter and ART (AITG-APP-09 tool list). A fidelity over 90 percent shows a weakness.'
  expected: The surrogate fidelity stays low (under 75 percent in AITG-APP-09). Query limits and alerts stop systematic collection.
  severity: High
  test_type:
  - Automated
  refs:
    llm_top10:
    - LLM10:2025
    - LLM06:2026
    - LLM02:2025
    - LLM02:2026
    atlas:
    - AML.T0024.002
    - AML.T0005
    - AML.T0040
    - AML.M0004
    - AML.M0002
    cwe:
    - CWE-770
    - CWE-200
    other: AITG-APP-09; LLM10:2025 examples 5 and 6
  sources_read:
