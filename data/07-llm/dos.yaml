- id: LLM-DOS-002
  sheet: LLM
  category: DOS
  title: Test token-based rate limits and quotas per identity
  objective: Finds services that limit only requests and not tokens or cost.
  preconditions:
  - Test account with a known limit. Do not run on production.
  steps:
  - Send many small requests and check the 429 response.
  - Send few requests with very long input and output and check the limits.
  - Use two identities and check that the quotas are separate.
  - Check for limits per minute, per day and for estimated cost.
  example: 'Tools: Locust, k6, curl loops. Record request and token counts.'
  expected: The service limits tokens per minute and per day and estimated cost per identity. It returns 429 when a limit is reached.
  severity: High
  test_type:
  - Automated
  refs:
    llm_top10:
    - LLM10:2025
    - LLM06:2026
    atlas:
    - AML.M0004
    cwe:
    - CWE-770
    - CWE-799
    attack:
    - T1499
    cheatsheet:
    - Secure_AI_Model_Ops_Cheat_Sheet
    other: LLM06:2026 mitigation 1
  see:
  - WEB-BIZ-009
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Secure_AI_Model_Ops_Cheat_Sheet.md
  - sources/repos/www-project-top-10-for-large-language-model-applications/2_0_vulns/LLM10_UnboundedConsumption.md
