- id: LLM-DOS-004
  sheet: LLM
  category: DOS
  title: Test limits on output length and output explosion
  objective: Finds endpoints that let the model write very long outputs.
  steps:
  - Ask for a very long answer and for endless repetition.
  - Check the max output token setting on the server.
  - Check that a client value cannot raise the limit.
  - Check that stop sequences and timeouts end long outputs.
  example: 'Prompt: "Count from 1 to one million." Tools: curl, manual.'
  expected: The server enforces a maximum output size and time. Clients cannot raise the limit.
  severity: Medium
  test_type:
  - Manual
  - Automated
  refs:
    llm_top10:
    - LLM10:2025
