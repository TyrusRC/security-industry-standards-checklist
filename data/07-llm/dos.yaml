- id: LLM-DOS-003
  sheet: LLM
  category: DOS
  title: Test hard spending caps per key, user and team
  objective: Finds budgets that only alert and do not stop usage.
  preconditions:
  - Test account with a small cap.
  steps:
  - Set a low budget on a test key.
  - Send requests until the cost reaches the budget.
  - Check that the next request stops and does not just send an alert.
  - Check caps for each key, user, team and cloud account, and for each modality.
  example: 'Tools: provider budget settings, billing API, manual.'
  expected: A non-overridable cap stops inference when the budget is used. Alerts alone do not count as a cap.
  severity: High
  test_type:
  - Config Review
  - Manual
  refs:
    llm_top10:
    - LLM10:2025
    - LLM06:2026
    atlas:
    - AML.T0034
