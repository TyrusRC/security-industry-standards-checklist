- id: LLM-DOS-001
  sheet: LLM
  category: DOS
  title: Test input size limits and flood handling
  objective: Finds endpoints that accept huge or endless inputs.
  preconditions:
  - Test endpoint. Do not run on production.
  steps:
  - Send inputs of growing size up to and above the context window.
  - Send a long series of inputs that stay just below the limit.
  - Watch the status codes, response time and memory use.
  - Check for an early rejection with HTTP 413 and for limits on the context size.
  example: 'Tools: Locust, JMeter, curl, promptfoo. AITG-INF-02 expects a 413 error for large payloads.'
  expected: The gateway rejects too large inputs before inference. Service time stays stable under input floods.
  severity: Medium
  test_type:
  - Automated
  - Manual
  refs:
    llm_top10:
    - LLM10:2025
    - LLM06:2026
    atlas:
    - AML.T0029
    - AML.M0004
    cwe:
    - CWE-400
    - CWE-770
    attack:
    - T1499
    other: AITG-INF-02
  see:
  - WEB-FILE-002
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Secure_AI_Model_Ops_Cheat_Sheet.md
  - sources/repos/www-project-ai-testing-guide/Document/content/tests/AITG-INF-02_Testing_for_Resource_Exhaustion.md
