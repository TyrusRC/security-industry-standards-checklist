- id: LLM-DOS-007
  sheet: LLM
  category: DOS
  title: Test multimodal input cost and adversarial resource inputs
  objective: Finds services where images, audio or crafted inputs use much more compute than text.
  steps:
  - Send images and audio of high resolution and long duration.
  - Compare token use and time with text requests.
  - Send inputs designed to make the model write long output.
  - Check for size and resolution limits and for a scan of adversarial inputs.
  example: 'Tools: scripts for large media, Locust.'
  expected: Media size, resolution and duration have limits. Cost per request stays within the expected range.
  severity: Medium
