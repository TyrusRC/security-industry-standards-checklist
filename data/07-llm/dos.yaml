- id: LLM-DOS-010
  sheet: LLM
  category: DOS
  title: Test detection of functional replication and distillation
  objective: Finds services with no signal for synthetic data collection that trains a copy.
  steps:
  - Run a script that asks for many varied tasks and stores the answers.
  - Check for anomaly alerts on unusual volume or coverage of tasks.
  - Check for watermarks or other marks in the output.
  - Check the terms of use against such use.
  example: 'Tools: scripts, usage analytics review.'
  expected: The provider detects bulk collection patterns and acts on them. Output marks and terms support enforcement.
  severity: Medium
  test_type:
  - Manual
  refs:
    llm_top10:
    - LLM10:2025
    - LLM06:2026
    atlas:
