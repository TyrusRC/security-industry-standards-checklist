- id: LLM-DOS-006
  sheet: LLM
  category: DOS
  title: Test growing context in long agent sessions
  objective: Finds sessions where the cost per turn rises without a limit.
  steps:
  - Keep an agent session open for 100 turns with small additions.
  - Record the tokens and cost per turn.
  - Check for a session budget, a summary or reset rule and a total cost cap.
  - Check alerts on the cost of a session.
  example: 'Tools: scripts, billing dashboards.'
  expected: A session has a total budget and a context limit. Growth in cost per turn triggers a reset or an alert.
  severity: Medium
  test_type:
  - Manual
