- id: LLM-DOS-013
  sheet: LLM
  category: DOS
  title: Test abuse of stolen or shared API keys
  objective: Finds keys that give broad access and that have no anomaly alert.
  steps:
  - List API keys and their scopes, owners and budgets.
  - Check that keys are per user or per service and not shared.
  - Use a test key from a new location and with high volume.
  - Check for alerts and automatic revoke.
  example: 'Tools: provider key console, trufflehog on repositories.'
  expected: Keys are scoped with budgets. Odd use creates an alert and can revoke the key at once.
  severity: High
  test_type:
  - Config Review
  - Manual
