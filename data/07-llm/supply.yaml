- id: LLM-SUPPLY-009
  sheet: LLM
  category: SUPPLY
  title: Check serving frameworks, patching and authentication of inference endpoints
  objective: Finds exposed or old model serving software.
  steps:
  - List the serving tools and their versions, such as vLLM, Ollama or Triton.
  - Compare versions with the known vulnerability lists.
  - Test every inference endpoint without credentials.
  - Check that unsafe deserialization and special token passthrough are off.
