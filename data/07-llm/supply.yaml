- id: LLM-SUPPLY-006
  sheet: LLM
  category: SUPPLY
  title: Review conversion, merge and quantization services
  objective: Finds model conversion or merge services that can change a model without review.
  steps:
  - List the services and bots that convert, merge or quantize models.
  - Check who can trigger them and where the output is stored.
  - Check that outputs are re-signed, scanned and tested before promotion.
  - Check the audit logs for changes.
  example: 'Reference in the source: HiddenLayer research on the Safetensors conversion bot.'
  expected: Conversion and merge outputs go through scans, tests and re-signing. Only named roles can trigger the services.
  severity: Medium
