- id: LLM-SUPPLY-010
  sheet: LLM
  category: SUPPLY
  title: Test ML dependencies and build pipelines of model artifacts
  objective: Finds weak dependency or CI controls that let an attacker change models or libraries.
  steps:
  - Run a dependency scan on the training and serving projects.
  - Check that the pipeline fails on high severity findings.
  - Check that the build uses pinned versions and a private package mirror.
  - Check that CI secrets, caches and registry tokens have narrow rights.
  example: 'Tools: Trivy, OWASP Dependency-Check, OpenSSF Scorecards, Cosign.'
  expected: The pipeline fails on high severity issues and uses pinned, signed inputs. Registry credentials are narrow and rotated.
  severity: High
  test_type:
  - Config Review
