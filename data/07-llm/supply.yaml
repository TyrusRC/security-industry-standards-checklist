- id: LLM-SUPPLY-001
  sheet: LLM
  category: SUPPLY
  title: Test model loading for unsafe serialization such as pickle
  objective: Finds model loaders that run code from a model file at load time.
  preconditions:
  - Isolated test host without secrets.
  steps:
  - List the model file formats that the system loads.
  - Search the code for pickle, torch.load and similar loaders without safe flags.
  - Load a harmless test file that writes a marker file when it is unpickled.
  - Check whether the marker appears and whether the load runs in a sandbox.
  example: 'Tools: model scanners, semgrep, safetensors format checks. Use a marker file only.'
  expected: The system uses safe formats and safe loaders. Loading runs in a sandbox and the marker file is not created.
  severity: Critical
  test_type:
  - Code Review
  - Manual
  refs:
    llm_top10:
    - LLM03:2025
    - LLM04:2026
    - LLM04:2025
    - LLM05:2026
    atlas:
    - AML.T0010.003
    - AML.T0058
    - AML.M0011
    - AML.M0014
    cwe:
    - CWE-502
    - CWE-829
    attack:
    - T1195
    - T1059
    cheatsheet:
    - Secure_AI_Model_Ops_Cheat_Sheet
    other: LLM04:2025 intro; LLM05:2026 scenario 7
