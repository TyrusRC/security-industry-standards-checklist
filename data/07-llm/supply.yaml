- id: LLM-SUPPLY-013
  sheet: LLM
  category: SUPPLY
  title: Evaluate third-party models with red teaming before use
  objective: Finds model choices based only on public benchmarks that a tuned model can game.
  steps:
  - Choose use-case test sets that cover safety, injection and data leaks.
  - Run garak, promptfoo and PyRIT suites on the candidate model.
  - Compare results with the benchmark claims of the supplier.
  - Repeat on every model update.
  example: 'Tools: garak, promptfoo, PyRIT, Giskard.'
  expected: The team accepts a model only after use-case red teaming. Results are kept and repeated on updates.
  severity: Medium
