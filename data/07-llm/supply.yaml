- id: LLM-SUPPLY-012
  sheet: LLM
  category: SUPPLY
  title: Test on-device model integrity and app repackaging
  objective: Finds apps whose model file can be replaced.
  preconditions:
  - Mobile or edge application that ships a model.
  steps:
  - Extract the model file from the test app package.
  - Replace it with a changed test model and repackage the app.
  - Run the repackaged app.
  - Check for integrity checks, attestation and encryption of the model.
  example: 'Tools: apktool, Frida, vendor attestation APIs.'
  expected: The app detects a changed model and refuses to run. The model file is encrypted and bound to attestation.
  severity: Medium
  test_type:
  - Manual
  refs:
    llm_top10:
    - LLM03:2025
    - LLM04:2026
    atlas:
    - AML.M0014
    - AML.M0017
    cwe:
    - CWE-345
    - CWE-494
