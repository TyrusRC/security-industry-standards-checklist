- id: LLM-SUPPLY-014
  sheet: LLM
  category: SUPPLY
  title: Check runtime isolation of GPUs and model jobs
  objective: Finds shared accelerators or job environments that leak data between workloads.
  steps:
  - List which workloads share GPUs, nodes and storage.
  - Check that untrusted tenants do not share an accelerator without hardware partitions.
  - Check that jobs clear memory, caches and temp files on exit.
  - Check for blocked access to the cloud metadata service from serving containers.
  example: 'Tools: kubectl and node review, gVisor or Kata settings, network policy tests.'
  expected: Mutually untrusted workloads do not share accelerators without hardware partitions. Jobs clear data at the end.
  severity: Medium
  test_type:
  - Config Review
