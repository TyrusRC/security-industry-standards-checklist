- id: LLM-SUPPLY-003
  sheet: LLM
  category: SUPPLY
  title: Check signing, hash pinning and provenance of models and adapters
  objective: Finds models, adapters and datasets that can be replaced without detection.
  steps:
  - List each model, adapter, tokenizer and data set that production uses.
  - Check that each one is pinned by hash or commit and that the signature is checked at deploy time.
  - Replace one artifact in a test registry and deploy.
  - Check that the deploy fails.
  example: 'Tools: Sigstore, OpenSSF model signing, sha256sum, registry policy.'
  expected: Deploy fails for any artifact without a valid signature or a matching hash. The system keeps records of the provenance.
  severity: High
  test_type:
  - Config Review
  refs:
    llm_top10:
    - LLM03:2025
    - LLM04:2026
