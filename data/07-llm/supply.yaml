  sheet: LLM
  category: SUPPLY
  title: Test protection of models and secrets in development
  objective: Finds ways to steal models or training secrets from repositories, notebooks and CI.
  steps:
  - Scan repositories and notebooks for keys and tokens.
  - Check access to model registries and experiment trackers without credentials.
  - Check CI runners for egress limits and review of pipeline changes.
