- id: LLM-SUPPLY-008
  sheet: LLM
  category: SUPPLY
  title: Review supplier terms, privacy policy and data use
  objective: Finds model suppliers whose terms allow use of your data for training.
  steps:
  - List the model and data suppliers.
  - Read the terms and privacy policy for training and retention rules.
  - Check that the account settings turn off training on your data.
  - Set a review on every change of terms.
  example: Provider console settings, contract review.
