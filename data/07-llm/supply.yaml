- id: LLM-SUPPLY-002
  sheet: LLM
  category: SUPPLY
  title: Test model scanners and safe loader options for bypass
  objective: Finds pipelines that trust a scanner or a loader flag that an attacker can defeat.
  preconditions:
  - Isolated test host.
  steps:
  - Make test files with a broken stream, compression wrapping and a harmless marker action.
  - Run the scanner and note the verdict.
  - Load the file with the safe loader option in the sandbox.
  - Check whether the marker action runs.
  - Check that the pipeline has other controls than the scanner alone.
  example: 'Tools: model scanners, sandbox host. Related finding in LLM04:2026: nullifAI models.'
  expected: A bypassed scanner does not lead to code execution. The pipeline uses signatures, safe formats and sandbox loading as well.
  severity: High
  test_type:
  - Manual
  refs:
    llm_top10:
    - LLM03:2025
    - LLM04:2026
    atlas:
    - AML.T0010.003
    - AML.T0058
    - AML.M0016
    cwe:
    - CWE-502
    - CWE-693
    cheatsheet:
    - Secure_AI_Model_Ops_Cheat_Sheet
    other: LLM04:2026 scenario 6
  sources_read:
