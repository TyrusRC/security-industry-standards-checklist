- id: LLM-SUPPLY-004
  sheet: LLM
  category: SUPPLY
  title: Test model references for namespace reuse
  objective: Finds pipelines that pull a model by hub name only so a re-registered name can deliver a malicious model.
  steps:
  - List the models that code, notebooks and catalogs pull by Author/ModelName.
  - Check that each reference uses a fixed revision or hash.
  - Check that the system mirrors approved models in an internal registry.
  - Check for alerts when an upstream owner or name changes.
  example: 'Tools: grep for from_pretrained and model ids, registry configuration review.'
  expected: Pipelines pull models by pinned revision from an internal registry. A change of the upstream owner raises an alert.
  severity: High
  test_type:
