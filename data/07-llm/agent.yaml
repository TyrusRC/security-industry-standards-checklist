- id: LLM-AGENT-009
  sheet: LLM
  category: AGENT
  title: Test that agent tokens bind to intent, audience and duration
  objective: Finds tokens that any agent can reuse for any purpose.
  steps:
  - Get a token from the agent identity system.
  - Use the token for another audience, another session and after it expires.
  - Check that the token holds subject, audience, purpose and session.
  - Check that each agent has its own identity.
  example: 'Tools: jwt_tool, token decode, cloud IAM logs.'
