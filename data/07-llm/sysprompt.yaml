- id: LLM-SYSPROMPT-006
  sheet: LLM
  category: SYSPROMPT
  title: Review business logic and limits placed in prompts
  objective: Finds rules such as limits and filter criteria whose leak helps an attacker bypass them.
  steps:
  - List every business rule that the prompt states, such as a daily limit or a loan cap.
  - Mark each rule as sensitive or not.
  - Make sure the backend also enforces each sensitive rule.
  - Remove from the prompt each sensitive rule that the model does not need.
  example: 'Example from the source: prompt text "Transaction limit is 5000 per day". Tools: code review, manual extraction test.'
  expected: Sensitive rules live in backend code. A leaked prompt gives no value to an attacker.
  severity: Medium
  test_type:
  - Code Review
  refs:
    llm_top10:
    - LLM07:2025
    - LLM08:2026
    - LLM01:2025
    cwe:
    - CWE-200
    - CWE-602
    cheatsheet:
    - LLM_Prompt_Injection_Prevention_Cheat_Sheet
    other: LLM07:2025 examples 2 to 4
  sources_read:
