- id: LLM-SYSPROMPT-003
  sheet: LLM
  category: SYSPROMPT
  title: Review system prompts and hidden context for secrets
  objective: Finds credentials, keys and connection strings that sit in prompts, templates or tool descriptions.
  steps:
  - List every prompt, template and tool description that the application sends to the model.
  - Search them with a secret scanner for keys, tokens, passwords and connection strings.
  - Look for database names, internal host names and user tokens in the text.
  - Move each secret to a system that the model does not read.
  - Rotate each secret that was in a prompt.
  example: 'Tools: trufflehog or gitleaks on the prompt repository, grep for "password", "key=", "Bearer", "jdbc:". Check retrieved policy text and tool descriptions too.'
  expected: No credential or connection string is in any prompt or hidden context. The application keeps secrets outside the model and rotates any past exposed secret.
  severity: High
  test_type:
  - Code Review
  - Config Review
  refs:
    llm_top10:
    - LLM07:2025
    - LLM08:2026
    - LLM02:2025
