- id: LLM-POISON-007
  sheet: LLM
  category: POISON
  title: Review third-party and open data sets before fine-tuning
  objective: Finds use of public data sets without vetting.
  steps:
  - List external data sets and vendors in use.
  - Check the license, the owner and the change history of each.
  - Scan samples for trigger phrases and for bias toward named products.
  - Compare model output with trusted sources on a test set.
  example: 'Tools: dataset cards review, Cleanlab, manual sampling.'
  expected: External data sets are vetted, scanned and tracked. Output on a trusted test set matches the expected answers.
  severity: Medium
  test_type:
  - Config Review
  - Manual
