    - AML.T0010.003
    - AML.M0014
    cwe:
    - CWE-912
    - CWE-494
    cheatsheet:
    - Secure_AI_Model_Ops_Cheat_Sheet
    other: LLM05:2026 mitigation 12 and scenario 6
