- id: LLM-POISON-001
  sheet: LLM
  category: POISON
  title: Test training and fine-tune data for poisoned samples and label errors
  objective: Finds poisoned, mislabeled or trigger samples in training data.
  preconditions:
  - Access to the training data and the training pipeline in a test area.
  steps:
  - Run a label error and outlier scan on the data set.
  - Cluster the samples and look for small groups with odd features or a shared phrase.
  - Add a few canary poisoned samples to a copy and check that the scan finds them.
  - Count the flagged samples and review them.
  example: 'Tools: Cleanlab, TensorFlow Data Validation, ART poisoning tools (all named in AITG-MOD-03 and AITG-INF-05).'
  expected: The pipeline flags label errors and odd clusters before training. The share of flagged samples stays under the set limit.
  severity: High
  test_type:
  - Automated
  - Manual
  refs:
    llm_top10:
    - LLM04:2025
    - LLM05:2026
    - LLM03:2025
    atlas:
    - AML.T0020
    - AML.T0019
    - AML.T0018.000
    - AML.M0007
    - AML.M0025
    cwe:
    - CWE-345
    - CWE-1426
    cheatsheet:
    - Secure_AI_Model_Ops_Cheat_Sheet
    other: AITG-MOD-03; AITG-INF-05
