- id: LLM-POISON-004
  sheet: LLM
  category: POISON
  title: Check data lineage, versioning and signing of data sets
  objective: Finds data sets with no record of origin, changes or signatures.
  steps:
  - Pick three data sets that feed training or retrieval.
  - Ask for their origin, transform steps and version history.
  - Check for signed hashes and a data version control system.
  - Roll back one data set to an older version as a test.
  example: 'Tools: DVC, CycloneDX ML-BOM, hash tools.'
  expected: Each data set has recorded origin, versions and signed hashes. A rollback to a known good version works.
  severity: Medium
  test_type:
  - Config Review
  refs:
    llm_top10:
    - LLM04:2025
    - LLM05:2026
    - LLM03:2025
