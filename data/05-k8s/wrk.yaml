- id: K8S-WRK-007
  sheet: K8S
  category: WRK
  title: Check that pods mount service account tokens only when needed
  objective: Finds pods that hold an API token without need and so give an attacker API access.
  steps:
  - List pods that mount a service account token.
  - Find pods that use the default service account.
  - Check that pods without API use set automountServiceAccountToken to false.
  - From a test pod, send a request to the API with the token.
  example: kubectl get pods -A -o json | jq ".items[] | {n:.metadata.name, a:.spec.automountServiceAccountToken, sa:.spec.serviceAccountName}"; kubeaudit sa; kubectl auth can-i --list --as=system:serviceaccount:<ns>:<sa>
  expected: Pods that do not call the Kubernetes API set automountServiceAccountToken to false. Each workload that needs the API has its own service account.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    - K09
