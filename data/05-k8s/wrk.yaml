- id: K8S-WRK-002
  sheet: K8S
  category: WRK
  title: Check that containers drop all Linux capabilities
  objective: Finds containers that keep default or extra capabilities that help an attacker escape.
  steps:
  - List the capabilities added and dropped for each container.
  - Find containers that do not drop ALL.
  - Find containers that add capabilities such as SYS_ADMIN or NET_ADMIN.
  - Ask the owner to justify each added capability.
  example: kubectl get pods -A -o jsonpath="{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[*].securityContext.capabilities}{"\n"}{end}"; kubeaudit capabilities; docker run --cap-drop all --cap-add CHOWN alpine (local test)
  expected: Each container drops ALL capabilities. Added capabilities are few, documented, and limited to values the application needs.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
    - CNAS-1
    cheatsheet:
    - Docker_Security_Cheat_Sheet
    - Kubernetes_Security_Cheat_Sheet
    cwe:
