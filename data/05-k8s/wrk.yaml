- id: K8S-WRK-008
  sheet: K8S
  category: WRK
  title: Check that containers have CPU and memory limits
  objective: Finds workloads that can use all node resources and cause denial of service.
  preconditions:
  - Do not run the stress pod on production.
  steps:
  - List requests and limits for CPU and memory for each container.
  - Find containers with no limits.
  - Check for a LimitRange that sets defaults in each namespace.
  - In a test namespace, run a memory stress pod and watch the node.
  example: kubectl get pods -A -o json | jq ".items[].spec.containers[] | {n:.name, r:.resources}"; kubeaudit limits; kubectl get limitrange -A
  expected: Every container has CPU and memory limits. Each namespace has a LimitRange. A stress pod is stopped at its limit and does not harm other pods.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
