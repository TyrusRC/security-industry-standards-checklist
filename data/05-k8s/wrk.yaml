- id: K8S-WRK-010
  sheet: K8S
  category: WRK
  title: Check sandboxed runtimes for untrusted or multi-tenant workloads
  objective: Finds untrusted workloads that share the host kernel with no extra isolation.
  steps:
  - Identify workloads from different trust levels or tenants on the same nodes.
  - List the RuntimeClass objects in the cluster.
  - Check that untrusted workloads use a sandbox runtime such as gVisor or Kata Containers.
  - Check that the node pool of those workloads is separate.
  example: kubectl get runtimeclass; kubectl get pods -A -o jsonpath="{range .items[*]}{.metadata.name}{"\t"}{.spec.runtimeClassName}{"\n"}{end}"
  expected: Untrusted and multi-tenant workloads run in a sandbox runtime on separate nodes from high-value workloads.
  severity: Low
  test_type: Config Review
  refs:
