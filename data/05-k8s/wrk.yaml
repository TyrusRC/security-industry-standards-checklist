- id: K8S-WRK-009
  sheet: K8S
  category: WRK
  title: Check namespace quotas on compute and object counts
  objective: Finds namespaces without aggregate limits that let one tenant exhaust the cluster.
  preconditions:
  - Do not run the over-quota request on production.
  steps:
  - List ResourceQuota objects for each namespace.
  - Find namespaces with no quota for CPU, memory and pod count.
  - Check that quotas also limit the number of services and PVCs.
  - Try to create pods above the quota in a test namespace.
  example: kubectl get resourcequota -A; kubectl describe quota -n <ns>; kubectl create -f compute-resources.yaml --namespace=<test-ns>
  expected: Each tenant namespace has a ResourceQuota. A request above the quota is rejected by the API server.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
