- id: K8S-WRK-001
  sheet: K8S
  category: WRK
  title: Check that containers run as a non-root user
  objective: Finds workloads that run as UID 0 and make a container breakout easier.
  steps:
  - List all pods with their runAsUser, runAsNonRoot and hostUsers settings.
  - Find containers that run as UID 0 or set no user.
  - Open a shell in a sample pod and run id.
  - Check if the image Dockerfile sets a USER instruction.
  example: kubectl get pods -A -o json | jq ".items[] | {n:.metadata.name, sc:.spec.securityContext, c:[.spec.containers[].securityContext]}"; kubeaudit nonroot; trivy config .
  expected: All containers run as a non-root UID. The pod sets runAsNonRoot or runAsUser above 0, or uses user namespaces with hostUsers set to false.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
    - CNAS-1
    cheatsheet:
    - Docker_Security_Cheat_Sheet
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-250
    attack:
    - T1611
    nist_800_53:
    - AC-6
