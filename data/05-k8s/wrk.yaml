- id: K8S-WRK-005
  sheet: K8S
  category: WRK
  title: Check that seccomp and a Linux security module are active
  objective: Finds workloads that run without the runtime syscall filter or mandatory access control.
  steps:
  - List the seccompProfile type for each pod and container.
  - Find workloads that use Unconfined or set no profile.
  - Check for AppArmor or SELinux settings on the workloads.
  - Check that the node enables the profile.
  example: kubeaudit seccomp; kubectl get pods -A -o json | jq ".items[].spec.securityContext.seccompProfile"; docker info --format "{{.SecurityOptions}}"
  expected: Every workload sets seccompProfile to RuntimeDefault or Localhost. AppArmor or SELinux profiles are active where the node supports them.
  severity: Medium
  test_type: Config Review
  refs:
