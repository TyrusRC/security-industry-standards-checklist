- id: K8S-WRK-006
  sheet: K8S
  category: WRK
  title: Check that the container root filesystem is read-only
  objective: Finds containers that let an attacker write tools or persistence files into the image layer.
  steps:
  - List readOnlyRootFilesystem for each container.
  - Find containers where the value is not true.
  - In a test pod, try to write a file to /bin and /tmp.
  - Check that writable paths use emptyDir volumes.
  example: kubeaudit rootfs; kubectl exec <pod> -- touch /bin/test; docker run --read-only --tmpfs /tmp alpine (local test)
  expected: Containers set readOnlyRootFilesystem to true. Writes go only to named emptyDir or tmpfs volumes. A write to /bin fails.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
