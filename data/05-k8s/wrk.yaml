- id: K8S-WRK-011
  sheet: K8S
  category: WRK
  title: Check that nodes block unused kernel modules
  objective: Finds nodes where a container process can auto-load network protocol kernel modules.
  steps:
  - Read the modprobe configuration on a sample node.
  - Check that unused modules such as dccp and sctp are blocked.
  - Check if the node loads any of the blocked modules.
  - Repeat on each node pool.
  example: cat /etc/modprobe.d/*.conf; lsmod | grep -E "dccp|sctp"
  expected: Unused protocol modules are blocked in the modprobe configuration and are not loaded on any node.
  severity: Low
  test_type: Config Review
