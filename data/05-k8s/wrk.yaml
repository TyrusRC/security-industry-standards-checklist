- id: K8S-WRK-004
  sheet: K8S
  category: WRK
  title: Find privileged containers and host namespace use
  objective: Finds containers that break the isolation between the workload and the node.
  steps:
  - List containers with privileged set to true.
  - List pods that set hostPID, hostIPC or hostNetwork.
  - List hostPath volumes and mounts of the container runtime socket.
  - Ask the owner to justify each case.
  example: kubectl get pods -A -o json | jq ".items[] | select(.spec.hostPID==true or .spec.hostIPC==true or .spec.hostNetwork==true)"; kubeaudit privileged
  expected: No application workload runs privileged, uses host namespaces, or mounts the runtime socket. Exceptions are system workloads with a written reason.
  severity: Critical
  test_type: Config Review
