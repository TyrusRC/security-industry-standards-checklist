- id: K8S-WRK-003
  sheet: K8S
  category: WRK
  title: Check that privilege escalation is blocked in containers
  objective: Finds containers where setuid binaries can raise the process privileges.
  steps:
  - List allowPrivilegeEscalation for each container.
  - Find containers where the value is true or not set.
  - In a test pod, look for setuid binaries in the image.
  - Try to run a setuid binary to change the user.
  example: kubeaudit privesc; kubectl get pods -A -o json | jq ".items[].spec.containers[].securityContext.allowPrivilegeEscalation"; docker run --security-opt=no-new-privileges (local test)
  expected: Every container sets allowPrivilegeEscalation to false. The no_new_privs flag is active and setuid binaries do not raise privileges.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
