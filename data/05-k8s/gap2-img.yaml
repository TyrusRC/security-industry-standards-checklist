- id: K8S-IMG-007
  sheet: K8S
  category: IMG
  title: Check image pull policy, digest pins and deprecated registry paths
  objective: Finds workloads that can run an old or swapped image behind a mutable tag.
  steps:
  - List images that use a mutable tag and their pull policy.
  - Make sure the pull policy is Always where a mutable tag is in use.
  - List images that are not pinned to a sha256 digest.
  - List images from the deprecated k8s.gcr.io registry.
  example: kubectl get pods -A -o jsonpath="{range .items[*]}{.spec.containers[*].image}{"\n"}{end}" | grep -v "@sha256"; kubectl get pods -A -o yaml | grep -c "k8s.gcr.io"
  expected: Production images use a digest. Mutable tags use the pull policy Always. No component pulls from the deprecated registry path.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K07
    cloud_native_top10:
    - CNAS-4
    cwe:
    - CWE-494
    attack:
    - T1525
    nist_800_53:
    - SI-7
    tool_check:
    - kubescape:C-0075
    - kubescape:C-0253
    - kubescape:C-0306
    other:
    - 'Kubernetes docs: security-checklist.md'
    - NSA/CISA Kubernetes Hardening Guidance 1.2, section Upgrading and application security practices
