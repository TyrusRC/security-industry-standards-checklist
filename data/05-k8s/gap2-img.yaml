- id: K8S-IMG-008
  sheet: K8S
  category: IMG
  title: Check that image signature checks fail closed and block bad images
  objective: Finds clusters where an unsigned, tampered or bypassed image can still start.
  preconditions:
  - Do not run on production.
  steps:
  - Read the signature policy or the ImagePolicyWebhook configuration and the trusted keys.
  - In a test namespace, start an unsigned image and a tampered image.
  - Stop the verification service in a test cluster and start a pod.
  - Check that the policy engine runs a fixed version without known signature bypass flaws.
  example: kubectl run unsigned --image=<registry>/unsigned:1 -n test; cosign verify --key cosign.pub <image>
  expected: The cluster rejects unsigned and tampered images and rejects pods when the verifier is down. The policy engine has no known bypass flaw.
  severity: High
  test_type: Config Review
