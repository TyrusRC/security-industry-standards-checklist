- id: K8S-IMG-009
  sheet: K8S
  category: IMG
  title: Check the image scan gate at admission
  objective: Finds clusters that deploy images that failed the scan policy.
  preconditions:
  - Do not run on production.
  steps:
  - Find the admission webhook or policy that checks scan results.
  - Read the rules for severity levels and false-positive handling.
  - In a test namespace, deploy an image that has a known critical flaw.
  - Check that rejected deployments appear in the audit log.
  example: kubectl run vuln --image=<known-vulnerable-image> -n test; trivy image --severity CRITICAL <image>
  expected: A webhook or policy blocks images that break the scan policy. Waivers for false positives have an owner and an end date.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K04
    - K07
