- id: K8S-CMP-007
  sheet: K8S
  category: CMP
  title: Check file modes of control plane manifests and kubeconfig files
  objective: Finds control plane files that other local users can read or change.
  preconditions:
  - Shell access to a control plane node.
  steps:
  - List the static pod manifests of the API server, controller manager, scheduler and etcd.
  - Read the mode and owner of each manifest file.
  - Read the mode and owner of admin.conf, scheduler.conf and controller-manager.conf.
  - List the kubeconfig files of administrators on the control plane nodes and read their modes.
  - Make sure the owner is root and no group or other user can write.
  example: stat -c "%a %U:%G %n" /etc/kubernetes/manifests/*.yaml /etc/kubernetes/*.conf; ls -l $HOME/.kube; kube-bench run --targets master
  expected: Each manifest and component kubeconfig file has the mode 600 or stricter and the owner root:root. Other users cannot read administrator kubeconfig files.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
