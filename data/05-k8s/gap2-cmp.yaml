- id: K8S-CMP-022
  sheet: K8S
  category: CMP
  title: Review the rights that third-party integrations request
  objective: Finds add-ons with cluster-wide rights that are wider than their job needs.
  steps:
  - List the add-ons and operators that run in the cluster.
  - Read the ClusterRoles and bindings of each add-on.
  - Find add-ons that read all secrets or create pods in system namespaces.
  - Check if each add-on can work in one namespace.
  example: kubectl get clusterrolebinding -o wide; kubectl auth can-i --list --as=system:serviceaccount:<ns>:<sa>
  expected: Each add-on has only the rights for its job. No untrusted component creates pods in kube- namespaces or in namespaces that allow privileged pods.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
