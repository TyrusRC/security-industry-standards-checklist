- id: K8S-CMP-023
  sheet: K8S
  category: CMP
  title: Check removal of unused components and periodic scans
  objective: Finds old components that stay in the cluster and are not scanned.
  steps:
  - List the components of the cluster, the pipeline and the nodes.
  - Find components with no owner or no use.
  - Check the plan to remove them.
  - Check the date of the last vulnerability scan and the last penetration test.
  - Make sure the findings have owners and due dates.
  example: kube-bench run; kubescape scan framework nsa; trivy k8s --report summary cluster
  expected: Unused components are removed. Scans and penetration tests run on a fixed schedule and the findings are fixed in time.
  severity: Low
  test_type: Config Review
