- id: K8S-CMP-009
  sheet: K8S
  category: CMP
  title: Check file modes of kubelet, kube-proxy and CNI files on nodes
  objective: Finds node configuration files that local users can change.
  preconditions:
  - Shell access to a worker node.
  steps:
  - Find the kubelet service file, kubelet.conf and the kubelet config file path.
  - Read the mode and owner of each file.
  - Find the kube-proxy kubeconfig file, if kube-proxy uses one, and read its mode and owner.
  - Read the mode and owner of the files in the CNI configuration directory.
  - Make sure no user other than root can write to these files.
