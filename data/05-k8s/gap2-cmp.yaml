- id: K8S-CMP-010
  sheet: K8S
  category: CMP
  title: Check TLS settings and cipher suites of the API server
  objective: Finds API servers that accept weak TLS or have no client CA configured.
  steps:
  - Read the TLS certificate, TLS key and client CA flags of the API server.
  - Read the cipher suite and minimum TLS version settings.
  - Scan the API server port with a TLS scanner.
  - Make sure the secure port is not off and TLS 1.2 or 1.3 is the lowest version accepted.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep -E "tls|client-ca|secure-port"; nmap --script ssl-enum-ciphers -p 6443 <api-host>
  expected: The API server uses a TLS certificate and key, a client CA file and only strong cipher suites. TLS 1.2 is the lowest version.
  severity: Medium
  test_type: Config Review
  refs:
