- id: K8S-CMP-018
  sheet: K8S
  category: CMP
  title: Check add-ons and ingress controllers for known CVEs and end of life
  objective: Finds add-ons with known flaws or without security fixes.
  steps:
  - List the ingress controllers, GitOps tools and dashboards in the cluster with versions.
  - Compare each version to the vendor advisories and the end of life dates.
  - On ingress-nginx, make sure snippet annotations are off or the version is fixed.
  - Check the aggregated API servers and the Kubernetes version for open advisories.
  example: 'kubectl get pods -A -o jsonpath="{..image}" | tr " " "

    " | sort -u; kubectl -n ingress-nginx get cm -o yaml | grep allow-snippet'
  expected: No add-on runs a version with a known critical flaw or past end of life. Snippet annotations of the ingress controller are off.
