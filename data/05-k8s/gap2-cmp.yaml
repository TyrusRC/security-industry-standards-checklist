- id: K8S-CMP-013
  sheet: K8S
  category: CMP
  title: Check flags of the controller manager, scheduler and kube-proxy
  objective: Finds control plane components that listen on all interfaces or share one identity.
  steps:
  - Read the bind address of the controller manager, the scheduler and the kube-proxy metrics service.
  - Read the profiling flag of the controller manager and the scheduler.
  - Read the service account credentials, root CA and signing key flags of the controller manager.
  - Read the terminated pod garbage collection threshold and the kubelet server certificate rotation setting.
  example: kubectl -n kube-system get pod -l component=kube-controller-manager -o yaml | grep -E "bind-address|profiling|use-service-account|root-ca|terminated"; ss -ltnp | grep -E "10257|10259|10249"
  expected: Components bind to 127.0.0.1 and profiling is off. The controller manager uses a separate credential for each controller and has a root CA file.
