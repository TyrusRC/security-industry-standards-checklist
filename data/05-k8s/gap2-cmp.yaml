- id: K8S-CMP-017
  sheet: K8S
  category: CMP
  title: Check kubelet TLS, client CA, cipher suites and certificate rotation
  objective: Finds kubelets with weak TLS, no client CA or no certificate rotation.
  steps:
  - Read the TLS certificate, TLS key and client CA settings of the kubelet.
  - Read the TLS cipher suite list of the kubelet.
  - Make sure client and server certificate rotation are on.
  - Scan port 10250 of a node with a TLS scanner.
  example: nmap --script ssl-enum-ciphers -p 10250 <node-ip>; kubectl get --raw "/api/v1/nodes/<node>/proxy/configz" | jq .kubeletconfig.tlsCipherSuites
  expected: The kubelet uses a TLS certificate, a client CA and only strong cipher suites. It rotates its client and server certificates.
  severity: Medium
