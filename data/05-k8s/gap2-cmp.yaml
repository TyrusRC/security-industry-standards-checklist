- id: K8S-CMP-015
  sheet: K8S
  category: CMP
  title: Check the NodeRestriction, AlwaysPullImages and DenyServiceExternalIPs plugins
  objective: Finds clusters where a node or a user can reach outside its own scope.
  preconditions:
  - Do not run on production.
  steps:
  - Read the enabled admission plugins of the API server.
  - Make sure NodeRestriction, AlwaysPullImages and DenyServiceExternalIPs are on, or an equal policy exists.
  - In a test namespace, create a Service that sets externalIPs.
  - With a kubelet credential in a test cluster, try to change the labels of another node.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep enable-admission-plugins; kubectl apply -f svc-externalips.yaml
  expected: NodeRestriction limits each kubelet to its own node and pods. New Services cannot set externalIPs. Image pulls are checked for each pod start.
