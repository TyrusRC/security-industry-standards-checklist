- id: K8S-CMP-016
  sheet: K8S
  category: CMP
  title: Check kubelet runtime settings for timeouts, PIDs, kernel and events
  objective: Finds kubelet settings that weaken node protection or hide events.
  steps:
  - Read the kubelet config file of a sample node.
  - Read the streaming connection idle timeout and the event record rate.
  - Read the pod PID limit, the protect kernel defaults setting and the iptables management setting.
  - Make sure the hostname override flag is not in use.
  - Make sure the default seccomp profile setting is on.
  example: kubectl get --raw "/api/v1/nodes/<node>/proxy/configz" | jq .kubeletconfig | grep -Ei "streaming|podPidsLimit|protectKernel|iptables|eventRecord|seccompDefault"
