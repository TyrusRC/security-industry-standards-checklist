- id: K8S-CMP-008
  sheet: K8S
  category: CMP
  title: Check PKI files and the etcd data directory for open access
  objective: Finds certificate keys and etcd data that local users can read.
  preconditions:
  - Shell access to a control plane node.
  steps:
  - List the files in the Kubernetes PKI directory with mode and owner.
  - Make sure all key files have the mode 600 and the owner root.
  - Find the client CA file of the API server and the kubelet and read its mode and owner.
  - Find the etcd data directory in the etcd flags and read its mode and owner.
  - Make sure only the etcd user can read the data directory.
  example: stat -c "%a %U:%G %n" /etc/kubernetes/pki/* /etc/kubernetes/pki/etcd/*; ps -ef | grep etcd | grep -- --data-dir
  expected: PKI files are owned by root with the mode 600 for keys and 600 or stricter for certificates. The etcd data directory has the mode 700 and an etcd owner.
  severity: High
  test_type: Config Review
  refs:
