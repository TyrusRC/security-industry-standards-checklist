- id: K8S-CMP-012
  sheet: K8S
  category: CMP
  title: Check service account key and token settings of the API server
  objective: Finds API servers that accept tokens of deleted service accounts or give tokens long life.
  steps:
  - Read the service account key file, signing key and lookup flags of the API server.
  - Make sure service account lookup is on, so deleted accounts lose their tokens.
  - Read the token lifetime and the token expiry extension setting.
  - Make sure the ServiceAccount admission plugin is on.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep -E "service-account|admission"
  expected: The API server has a service account key file and lookup on. Token lifetime extension is off and the ServiceAccount admission plugin is on.
