- id: K8S-CMP-011
  sheet: K8S
  category: CMP
  title: Check TLS trust between the API server, etcd and the kubelets
  objective: Finds API servers that do not check or authenticate etcd and kubelet connections.
  steps:
  - Read the etcd CA, etcd client certificate and etcd client key flags of the API server.
  - Read the kubelet client certificate, kubelet client key and kubelet CA flags.
  - Make sure the etcd and kubelet connections use TLS and check the server certificate.
  - Make sure the kubelet CA is the cluster CA and not a bundle of public CAs.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep -E "etcd-(ca|cert|key)file|kubelet-(certificate|client)"
  expected: The API server connects to etcd and to the kubelets with client certificates. It checks the server certificate against a dedicated CA.
