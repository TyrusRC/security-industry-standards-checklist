- id: K8S-CMP-019
  sheet: K8S
  category: CMP
  title: Check static pod paths and manifest sources of kubelets
  objective: Finds nodes where a local user or a web source can start pods that skip the API checks.
  preconditions:
  - Shell access to a worker node.
  steps:
  - Read the static pod path and static pod URL settings of the kubelet on each node.
  - Make sure the setting is off where a node does not need static pods.
  - List the files in the static pod directory and the mode of the directory.
  - Compare the pods in the runtime on the node to the pods in the API.
  example: grep -E "staticPodPath|staticPodURL" /var/lib/kubelet/config.yaml; ls -la /etc/kubernetes/manifests; crictl pods
  expected: Static pods are off or limited to known manifests in a protected directory. Each pod in the node runtime is visible in the API.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K07
    cwe:
    - CWE-732
    attack:
    - T1610
    nist_800_53:
    - CM-5
    - CM-7
    other:
    - 'Kubernetes docs: api-server-bypass-risks.md'
  sources_read:
  - sources/repos/k8s-website/content/en/docs/concepts/security/api-server-bypass-risks.md
- id: K8S-CMP-020
  sheet: K8S
  category: CMP
  title: Check access to the container runtime socket on nodes
  objective: Finds nodes where non-admin users can reach the runtime and start containers.
  preconditions:
  - Shell access to a worker node.
  steps:
  - Find the runtime socket paths on a node.
  - Read the mode, owner and group of each socket.
  - List the users and groups that can open the sockets.
  - Make sure the kubelet is isolated from other node services.
  example: ls -l /run/containerd/containerd.sock /var/run/crio/crio.sock; getent group docker
  expected: Only root and the runtime group can use the runtime socket. Node login and superuser access are limited to named administrators.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    - K07
