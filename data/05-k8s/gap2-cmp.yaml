- id: K8S-CMP-021
  sheet: K8S
  category: CMP
  title: Check feature gates and API versions that are alpha or beta
  objective: Finds cluster features that are still in development and may carry flaws.
  steps:
  - List the feature gates of the API server, the kubelet and the controller manager.
  - Find gates that enable alpha or beta features.
  - Ask the owner what each feature does for the business.
  - Disable the features that are not in use.
  example: kubectl get --raw /metrics | grep kubernetes_feature_enabled | grep " 1$"; kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep feature-gates
  expected: No unused alpha or beta feature is on. Each enabled one has an owner and a written risk decision.
  severity: Low
  test_type: Config Review
  refs:
    k8s_top10:
    - K07
    cwe:
    - CWE-1188
    nist_800_53:
    - CM-7
