  - sources/repos/CheatSheetSeries/cheatsheets/Kubernetes_Security_Cheat_Sheet.md
- id: K8S-EXP-003
  sheet: K8S
  category: EXP
  title: Check that kubelet and etcd ports are closed to untrusted hosts
  objective: Finds node and control plane ports that expose the kubelet, etcd or other components.
  preconditions:
  - Written approval for the scan of the listed addresses.
  steps:
  - List the open ports on a control plane node and a worker node from a pod network host.
  - Check ports 10250, 10255, 2379, 2380, 10257 and 10259.
  - Check that only the API server can reach the kubelet and etcd.
  - Compare the result with the firewall and security group rules.
  example: nmap -p 2379,2380,6443,10248-10260,30000-32767 <node-ip>; kubectl get nodes -o wide
  expected: Only the API server and named hosts reach the kubelet and etcd ports. Read-only kubelet port 10255 is closed.
  severity: Critical
  test_type: Manual
  refs:
    k8s_top10:
    - K06
    - K07
