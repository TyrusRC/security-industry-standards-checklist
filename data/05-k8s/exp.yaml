- id: K8S-EXP-004
  sheet: K8S
  category: EXP
  title: Check that etcd needs client certificates and is isolated
  objective: Finds etcd servers that accept unauthenticated clients or serve other components.
  steps:
  - Try to connect to etcd without a client certificate.
  - Check the etcd peer and client TLS settings.
  - Check that only API servers hold etcd client certificates.
  - Check that no other component uses the main etcd keyspace.
  example: etcdctl --endpoints=https://<etcd>:2379 get / --prefix --keys-only; ps aux | grep etcd | tr " " "\n" | grep -E "client-cert-auth|peer-client-cert-auth"
  expected: An etcd request with no valid client certificate fails. Only the API servers can connect, and etcd is behind a firewall.
  severity: Critical
  test_type: Config Review
  refs:
