- id: K8S-EXP-001
  sheet: K8S
  category: EXP
  title: Check that the API server is not open to the Internet
  objective: Finds API servers that any host on the Internet can reach.
  preconditions:
  - Written approval for the scan of the listed addresses.
  steps:
  - Find the public address of the API server from DNS, kubeconfig and cloud settings.
  - Connect to port 6443 from an outside network.
  - Read the authorized network list of the managed service.
  - Make sure only trusted source ranges are allowed.
  example: nmap -p 6443 <api-host>; curl -k https://<api-host>:6443/version; aws eks describe-cluster --name <c> --query cluster.resourcesVpcConfig; az aks show -n <c> -g <rg> --query apiServerAccessProfile; gcloud container clusters describe <c> --format="value(masterAuthorizedNetworksConfig)"
  expected: The API server is reachable only from trusted networks or a private endpoint. An outside host cannot connect to port 6443.
  severity: High
  test_type: Manual
  refs:
    k8s_top10:
    - K06
    cloud_native_top10:
    - CNAS-3
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-668
    - CWE-1327
    attack:
    - T1190
    - T1133
    nist_800_53:
    - SC-7
    - AC-17
