- id: K8S-EXP-006
  sheet: K8S
  category: EXP
  title: Check NodePort and LoadBalancer services for unwanted exposure
  objective: Finds internal services that are public through NodePort or cloud load balancers.
  steps:
  - List all Services of type NodePort and LoadBalancer.
  - Check the source ranges and security groups of each.
  - Check the nodes for services in the 30000-32767 range.
  - Ask the owner to justify each public service.
  example: kubectl get svc -A -o wide | grep -E "NodePort|LoadBalancer"; nmap -p 30000-32767 <node-ip>
  expected: Only reviewed services are public. Other services use ClusterIP, and each public service has restricted source ranges.
  severity: Medium
  test_type: Config Review
