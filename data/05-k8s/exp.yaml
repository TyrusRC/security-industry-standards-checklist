- id: K8S-EXP-002
  sheet: K8S
  category: EXP
  title: Check version and certificate details that the API shows to outsiders
  objective: Finds information leaks from the version endpoint and from certificate names.
  steps:
  - Send an unauthenticated request to the /version path.
  - Read the Subject Alternative Names of the API server certificate.
  - Look for private addresses and internal host names in the SAN list.
  - Check if the response gives the exact release.
  example: curl -k https://<api-host>:6443/version; openssl s_client -connect <api-host>:6443 </dev/null | openssl x509 -noout -ext subjectAltName
  expected: The version path is not reachable from outside or needs authentication. The certificate shows no private addresses or internal names.
  severity: Low
  test_type: Manual
  refs:
    k8s_top10:
    - K06
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-200
    attack:
    - T1190
