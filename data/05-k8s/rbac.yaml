- id: K8S-RBAC-002
  sheet: K8S
  category: RBAC
  title: Find unneeded cluster-admin bindings
  objective: Finds users and service accounts with unlimited cluster rights.
  steps:
  - List all ClusterRoleBindings and RoleBindings that grant cluster-admin.
  - List the subjects of each binding.
  - Find service accounts and groups such as system:authenticated in these bindings.
  - Ask the owner to justify each subject.
  example: kubectl get clusterrolebindings -o json | jq ".items[] | select(.roleRef.name==\"cluster-admin\") | .subjects"
  expected: Only a few named break-glass or admin subjects hold cluster-admin. No service account or broad group has it.
  severity: Critical
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    cloud_native_top10:
