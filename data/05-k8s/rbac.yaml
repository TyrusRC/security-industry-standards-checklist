- id: K8S-RBAC-003
  sheet: K8S
  category: RBAC
  title: Find wildcard rules and wide built-in roles
  objective: Finds roles with verb or resource wildcards and use of the broad view and edit roles.
  steps:
  - List all Roles and ClusterRoles that use * in verbs, resources or apiGroups.
  - List the bindings to the built-in roles admin, edit and view.
  - Compare the granted rights to the needs of each subject.
  - Replace wide roles with narrow custom roles.
  example: kubectl get clusterroles,roles -A -o json | jq ".items[] | select(.rules[]? | (.verbs[]==\"*\") or (.resources[]?==\"*\")) | .metadata.name"; kubectl auth can-i --list --as=<user>
  expected: No custom role uses wildcards without a written reason. Built-in broad roles are bound only where the full rights are needed.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    cloud_native_top10:
