- id: K8S-RBAC-001
  sheet: K8S
  category: RBAC
  title: Check that RBAC is on and no other authorizer widens access
  objective: Finds clusters where the authorization mode is not RBAC or where a second authorizer adds hidden rights.
  steps:
  - Read the authorization-mode flag of the API server or the managed service setting.
  - List all configured authorizers, including webhook authorizers.
  - Make sure AlwaysAllow is not in the list.
  - Review the rights that each non-RBAC authorizer grants.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep authorization-mode; kube-bench run --targets master
  expected: The API server uses RBAC, and Node if needed. AlwaysAllow is off. Rights from each other authorizer are listed and reviewed.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    cloud_native_top10:
    - CNAS-3
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
