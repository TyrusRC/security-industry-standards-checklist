- id: K8S-RBAC-009
  sheet: K8S
  category: RBAC
  title: Check that elevated access is temporary and recorded
  objective: Finds standing admin access with no approval, expiry or record.
  preconditions:
  - Interview the cluster owner.
  steps:
  - Find the process to request elevated access for debug or one-off changes.
  - Check that grants expire without manual removal.
  - Check that each grant has a record of the approver and reason.
  - Make sure the API audit log shows the grant and use.
  example: kubectl get clusterrolebindings -o json | jq ".items[] | {n:.metadata.name, c:.metadata.creationTimestamp}"; kubectl --as=<user> --as-group=<group> get pods
  expected: Admin access is time-bound, approved and logged. Day-to-day accounts have low rights and use impersonation or short-lived grants for admin work.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
