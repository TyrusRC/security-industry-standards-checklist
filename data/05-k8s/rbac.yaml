- id: K8S-RBAC-008
  sheet: K8S
  category: RBAC
  title: Check that the default service account has no extra rights
  objective: Finds workloads that inherit API rights through the default service account of a namespace.
  steps:
  - List RoleBindings and ClusterRoleBindings for the default service account in each namespace.
  - Check the rights of the default service account.
  - Check that each workload uses its own service account.
  - Test a request from a pod with the default token.
  example: kubectl get rolebindings,clusterrolebindings -A -o json | jq ".items[] | select(.subjects[]? | .name==\"default\" and .kind==\"ServiceAccount\")"; kubectl auth can-i --list --as=system:serviceaccount:<ns>:default
  expected: The default service account has no bindings. Each workload that needs API access uses a dedicated service account with minimal rights.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    - K09
