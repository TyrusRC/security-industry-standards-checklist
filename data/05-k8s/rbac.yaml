- id: K8S-RBAC-004
  sheet: K8S
  category: RBAC
  title: Check who can read secrets through get, list or watch
  objective: Finds subjects that can read secret values, including by the list and watch verbs.
  steps:
  - List all roles with get, list or watch on secrets.
  - Find roles that give secrets access cluster-wide.
  - Check that the rights of each subject are scoped to named secrets where possible.
  - Test list on secrets with a low-rights account.
  example: kubectl auth can-i list secrets -A --as=<subject>; kubectl get clusterroles -o json | jq ".items[] | select(.rules[]? | .resources[]?==\"secrets\") | .metadata.name"
  expected: Only a few named subjects can get, list or watch secrets. Access is limited to the namespace and the secret names that the workload needs.
  severity: High
  test_type: Config Review
