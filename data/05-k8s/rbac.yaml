- id: K8S-RBAC-007
  sheet: K8S
  category: RBAC
  title: Review rights from Helm charts, operators and role aggregation
  objective: Finds third-party packages that install wide roles or extend built-in roles without notice.
  steps:
  - List ClusterRoles and ClusterRoleBindings created by Helm charts and operators.
  - Find roles with wildcard verbs or resources from these packages.
  - Check ClusterRoles that carry aggregation labels for admin, edit or view.
  - Compare the rights to the documented needs of the package.
  example: 'kubectl get clusterroles -l rbac.authorization.k8s.io/aggregate-to-admin=true; helm template <chart> | grep -B2 -A8 "kind: ClusterRole"'
  expected: Each third-party role has only the rights its function needs. No package adds rights to admin, edit or view without review.
  severity: Medium
  test_type: Config Review
