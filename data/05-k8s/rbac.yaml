- id: K8S-RBAC-006
  sheet: K8S
  category: RBAC
  title: Check who can patch namespaces and change policy labels
  objective: Finds subjects that can edit namespace labels and so weaken Pod Security Admission or network policies.
  preconditions:
  - Do not run on production.
  steps:
  - List subjects with patch or update rights on namespaces.
  - In a test namespace, change the pod-security.kubernetes.io/enforce label with a low-rights account.
  - Try to add a label that a NetworkPolicy selector uses.
  - Revert the labels.
  example: kubectl auth can-i patch namespaces --as=<subject>; kubectl label ns <test-ns> pod-security.kubernetes.io/enforce=privileged --overwrite --as=<subject>
  expected: Only cluster administrators can change namespace labels. A policy rule blocks label changes that lower the Pod Security level.
  severity: High
  test_type: Manual
  refs:
    k8s_top10:
    - K02
    - K04
