- id: K8S-RBAC-005
  sheet: K8S
  category: RBAC
  title: Find escalate, bind, impersonate and node proxy rights
  objective: Finds rights that let a subject skip privilege checks, impersonate users, or reach the Kubelet API.
  steps:
  - List roles with the verbs escalate, bind or impersonate.
  - List roles with access to nodes/proxy.
  - List roles that can create pods in kube-system or create rolebindings.
  - Check that impersonation is limited to named resources.
  example: kubectl get clusterroles -o json | jq ".items[] | select(.rules[]? | .verbs[]? | IN(\"escalate\",\"bind\",\"impersonate\")) | .metadata.name"; kubectl auth can-i get nodes/proxy --as=<subject>
  expected: Few trusted subjects hold escalate, bind, impersonate or nodes/proxy. Impersonation is limited to named users or groups.
  severity: High
  test_type: Config Review
  refs:
