- id: K8S-RBAC-015
  sheet: K8S
  category: RBAC
  title: Find workloads whose service accounts hold admin or takeover rights
  objective: Finds pods that give an attacker cluster control after an application flaw.
  steps:
  - List workloads and their service accounts.
  - List the roles of each service account, including aggregated roles.
  - Find service accounts with cluster-admin, secret read, or workload create and update rights.
  - Rank the findings by exposure of the workload to the Internet.
  - Replace broad roles with narrow roles.
  example: kubescape scan control C-0267,C-0272,C-0053; kubectl auth can-i --list --as=system:serviceaccount:<ns>:<sa>
  expected: No workload service account holds admin rights or rights to read secrets or create workloads across the cluster without a written reason.
  severity: High
  test_type: Config Review
  refs:
