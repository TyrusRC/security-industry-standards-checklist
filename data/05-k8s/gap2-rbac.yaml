- id: K8S-RBAC-014
  sheet: K8S
  category: RBAC
  title: Check that nobody uses the system:masters group after bootstrap
  objective: Finds users and components that hold unlimited rights through a group that RBAC cannot restrict.
  steps:
  - List client certificates and kubeconfig entries with the organization system:masters.
  - List the bindings and OIDC group mappings that give the group to a user or service account.
  - Check that the controller manager does not run as system:masters.
  - Check that the CertificateSubjectRestriction plugin is on.
  - Check the break-glass process for this group.
  example: kubectl get csr -o json | jq ".items[].spec.request" ; openssl x509 -in client.crt -noout -subject; grep -r "system:masters" ~/.kube
  expected: No user or component uses system:masters in daily work. It is a break-glass credential with a record of each use.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    - K09
    cloud_native_top10:
    - CNAS-3
    cwe:
    - CWE-269
    attack:
    - T1078
    nist_800_53:
    - AC-6
    - AC-2
    tool_check:
    - kubescape:C-0246
    other:
    - 'Kubernetes docs: security-checklist.md'
  sources_read:
  - sources/repos/regolibrary/controls/C-0246-avoiduseofsystemmastersgroup.json
