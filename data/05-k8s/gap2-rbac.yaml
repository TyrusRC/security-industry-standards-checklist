- id: K8S-RBAC-010
  sheet: K8S
  category: RBAC
  title: Find subjects that can exec, attach or port-forward into pods
  objective: Finds users and service accounts that can run commands in containers or open tunnels to pods.
  steps:
  - List roles with create on pods/exec, pods/attach and pods/portforward.
  - List the subjects bound to these roles.
  - Check that day-to-day accounts do not hold these rights in production namespaces.
  - Check that each use of exec appears in the audit log.
  - Ask the owner to justify each subject.
  example: kubectl auth can-i create pods/exec --as=<user> -n <ns>; kubectl get clusterrole,role -A -o json | jq ".. | select(.resources?) | select(.resources[]|test("pods/(exec|attach|portforward)"))"
  expected: In production only a small, named group has exec and port-forward rights. These actions are logged and alerts exist for them.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    cloud_native_top10:
    - CNAS-3
    cwe:
    - CWE-269
    attack:
    - T1609
    - T1059.013
    nist_800_53:
    - AC-6
    tool_check:
    - kubescape:C-0002
    - kubescape:C-0063
    other:
    - NSA/CISA Kubernetes Hardening Guidance 1.2, section Audit Logging and Threat Detection, Alerting
  sources_read:
  - sources/repos/regolibrary/controls/C-0002-execintocontainer.json
  - sources/repos/regolibrary/controls/C-0063-portforwardingprivileges.json
  - sources/nsa_k8s/nsa_k8s_hardening.md
- id: K8S-RBAC-011
  sheet: K8S
  category: RBAC
  title: Find subjects that can create workloads and the limits on them
  objective: Finds users who can create pods and so can reach secrets, service accounts and nodes.
  preconditions:
  - Do not run on production.
  steps:
  - List subjects with create, update or patch on pods, deployments, jobs, cronjobs and daemonsets.
  - List the service accounts in each namespace where these subjects can create workloads.
  - Make sure Pod Security admission enforces the baseline or restricted level there.
  - Create a privileged pod in a test namespace as one of these subjects.
  example: kubectl auth can-i create pods --as=<user> -n <ns>; kubectl get clusterrolebinding,rolebinding -A -o wide
  expected: Workload creation rights are rare and limited by namespace. The enforced pod security level blocks privileged pods for these subjects.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    cloud_native_top10:
    - CNAS-3
    cwe:
    - CWE-269
    attack:
