- id: K8S-RBAC-016
  sheet: K8S
  category: RBAC
  title: Find subjects that can change the CoreDNS configuration
  objective: Finds accounts that can poison cluster DNS and take over service names.
  steps:
  - Find the CoreDNS ConfigMap in kube-system.
  - List subjects with update or patch on that ConfigMap.
  - List subjects with update or patch on the CoreDNS deployment.
  - Make sure changes to the ConfigMap raise an alert.
  example: kubectl -n kube-system get cm coredns -o yaml; kubectl auth can-i update configmaps/coredns -n kube-system --as=<user>
  expected: Only cluster administrators can change the CoreDNS ConfigMap and deployment. Each change creates an alert.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    - K05
    cwe:
    - CWE-269
    nist_800_53:
    - AC-6
    tool_check:
    - kubescape:C-0037
  sources_read:
  - sources/repos/regolibrary/controls/C-0037-corednspoisoning.json
- id: K8S-RBAC-017
  sheet: K8S
  category: RBAC
  title: Check periodic access reviews, CA protection and certificate lifetimes
  objective: Finds clusters where old access stays and certificates live too long.
  steps:
  - Find the access review records and the date of the last review.
  - Check that the interval between reviews is not more than 24 months.
  - Read the validity period of intermediate and leaf certificates.
  - Check how the root CA key is stored and who can use it.
  example: openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -dates; kubeadm certs check-expiration
  expected: Reviews take place at least every 24 months. Certificates expire within 3 years. The root CA is offline or online with strict access.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    - K09
    cloud_native_top10:
