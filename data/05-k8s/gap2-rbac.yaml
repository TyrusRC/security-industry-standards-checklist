    - AC-6
    tool_check:
    - kubescape:C-0188
    - prowler:kubernetes:rbac_minimize_pod_creation_access
    other:
    - 'Kubernetes docs: rbac-good-practices.md'
    - 'Kubernetes docs: security-checklist.md'
    - 'Kubernetes docs: application-security-checklist.md'
