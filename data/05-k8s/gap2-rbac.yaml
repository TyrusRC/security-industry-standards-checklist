- id: K8S-RBAC-012
  sheet: K8S
  category: RBAC
  title: Find subjects that can delete resources or Kubernetes events
  objective: Finds accounts that can destroy workloads and data or erase traces of their actions.
  steps:
  - List roles with the delete or deletecollection verb on workloads, volumes, namespaces and nodes.
  - List roles with delete on events.
  - List the subjects bound to these roles.
  - Check that daily-use accounts do not hold these rights.
  - Check that events also go to a store outside the cluster.
  example: kubectl auth can-i delete events -A --as=<user>; kubectl get clusterrole -o json | jq ".items[] | select(.rules[]?.verbs[]? | test("delete"))" | head
  expected: Delete rights are limited to a named group. Only controllers can delete events, and events are copied to a separate log store.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K02
    - K10
    cloud_native_top10:
    - CNAS-3
    cwe:
    - CWE-269
