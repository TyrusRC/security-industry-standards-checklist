    - T1070
    nist_800_53:
    - AC-6
    - AU-9
    tool_check:
    - kubescape:C-0007
    - kubescape:C-0031
  sources_read:
  - sources/repos/regolibrary/controls/C-0007-datadestruction.json
  - sources/repos/regolibrary/controls/C-0031-deletekubernetesevents.json
- id: K8S-RBAC-013
  sheet: K8S
  category: RBAC
  title: Find subjects that can create volumes, approve CSRs or mint tokens
  objective: Finds rights that let a user escalate to node or cluster control.
  steps:
  - List subjects that can create PersistentVolumes.
  - List subjects with update on certificatesigningrequests/approval and the sign verb.
  - List subjects that can create serviceaccounts/token.
  - List subjects that can create, change or delete webhook configurations.
  - Ask the owner to justify each subject.
  example: kubectl auth can-i create persistentvolumes --as=<user>; kubectl auth can-i update certificatesigningrequests/approval --as=<user>; kubectl auth can-i create serviceaccounts/token -n <ns> --as=<user>
  expected: Only cluster administrators and control plane controllers hold these rights. Other subjects do not hold them.
  severity: High
  test_type: Config Review
