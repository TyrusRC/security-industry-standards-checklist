- id: K8S-IMG-001
  sheet: K8S
  category: IMG
  title: Check that the cluster admits only approved and signed images
  objective: Finds clusters that run images from unknown registries or with no proof of origin.
  preconditions:
  - Do not run on production.
  steps:
  - List all images in the cluster with their registries.
  - Find images from public or unknown registries.
  - Check the admission rule that limits registries and checks signatures.
  - Try to start a pod from an unapproved registry in a test namespace.
  example: kubectl get pods -A -o jsonpath="{range .items[*]}{.spec.containers[*].image}{"\n"}{end}" | sort -u; kubectl run t --image=docker.io/library/nginx -n <test-ns>; cosign verify <image> --key <pub> (if signing is used)
  expected: Only images from approved registries, with a valid signature or known digest, start in the cluster. The unapproved test pod is rejected.
  severity: High
  test_type: Manual
  refs:
    k8s_top10:
    - K04
    cloud_native_top10:
    - CNAS-4
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
