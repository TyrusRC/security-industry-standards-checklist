- id: K8S-IMG-003
  sheet: K8S
  category: IMG
  title: Scan running images for known vulnerabilities
  objective: Finds deployed images that contain components with known vulnerabilities, including new ones found after the build.
  steps:
  - List all images that run in the cluster.
  - Scan each image for vulnerabilities with a scanner.
  - Check if the cluster is scanned on a schedule, not only at build.
  - Rank the findings by severity and by exposure of the workload.
  example: trivy image <image>; trivy k8s --report summary cluster; grype <image>
  expected: Running images have no unfixed critical or high vulnerabilities without a written exception. The cluster is scanned on a set schedule.
  severity: High
  test_type: Automated
  refs:
    k8s_top10:
    - K07
    cloud_native_top10:
