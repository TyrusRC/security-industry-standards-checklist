- id: K8S-IMG-006
  sheet: K8S
  category: IMG
  title: Check an SBOM and provenance for each deployed image
  objective: Finds images that cannot be traced to a source, a build and a list of components.
  steps:
  - Pick three running images.
  - Find the SBOM and provenance record of each.
  - Check that the SBOM matches the image digest.
  - Make sure the admission policy uses the provenance.
  example: cosign verify-attestation <image> --type slsaprovenance --key <pub>; trivy sbom <file>; syft <image>
  expected: Each image links to an SBOM and provenance that match its digest. The cluster rejects images without them.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
