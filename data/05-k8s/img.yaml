- id: K8S-IMG-004
  sheet: K8S
  category: IMG
  title: Check that images are minimal and hold no shells or package tools
  objective: Finds images with extra tools that help an attacker after a breach.
  steps:
  - List the base image of each workload.
  - Check for a shell, package manager and compilers in the image.
  - Try to start a shell in a test pod.
  - Check for distroless or minimal base images.
  example: kubectl exec <pod> -- sh; docker run --rm --entrypoint sh <image> -c "which apt apk curl"; trivy image --list-all-pkgs <image>
  expected: Production images use minimal or distroless bases. They hold no shell, package manager or network tools without need.
  severity: Low
  test_type: Manual
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
