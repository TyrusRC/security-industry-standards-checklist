- id: K8S-IMG-005
  sheet: K8S
  category: IMG
  title: Check registry access control and the transport to registries
  objective: Finds registries that allow anonymous push, wide pull rights or plain HTTP.
  steps:
  - List the registries that the cluster uses.
  - Check who can push and pull for each repository.
  - Check that every pull uses TLS.
  - Check the image pull secrets in each namespace.
  example: kubectl get secrets -A --field-selector type=kubernetes.io/dockerconfigjson; curl -sI http://<registry>/v2/; check the registry access policy in the provider
  expected: Registries need authentication for push and pull. Only build systems can push. All transfers use TLS and pull secrets are limited per namespace.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K04
    cloud_native_top10:
    - CNAS-4
    cheatsheet:
