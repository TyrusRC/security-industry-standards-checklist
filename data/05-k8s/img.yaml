- id: K8S-IMG-002
  sheet: K8S
  category: IMG
  title: Check image tags, digests and use of stale images
  objective: Finds workloads that use mutable tags or old images that miss fixes.
  steps:
  - List images that use the latest tag or no tag.
  - Compare running image digests to the registry.
  - Check the build date of each image.
  - Check the policy for maximum image age.
  example: kubectl get pods -A -o json | jq -r ".items[].spec.containers[].image" | sort -u | grep -E ":latest$|^[^:]+$"; docker inspect <image> --format "{{.Created}}"
  expected: Images use fixed tags or digests. No image is older than the policy age, and base images are rebuilt on a set schedule.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K04
    - K07
    cloud_native_top10:
    - CNAS-4
    - CNAS-7
    cheatsheet:
