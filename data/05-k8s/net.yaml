- id: K8S-NET-004
  sheet: K8S
  category: NET
  title: Find pods that use host networking
  objective: Finds pods that bypass network policy and reach services bound to the node loopback.
  steps:
  - List pods with hostNetwork set to true.
  - Ask the owner to justify each case.
  - Check that these pods are limited to system components such as the CNI.
  - From such a pod, try a connection to localhost services of the node.
  example: kubectl get pods -A -o json | jq ".items[] | select(.spec.hostNetwork==true) | .metadata.namespace+\"/\"+.metadata.name"
  expected: Only system components such as the CNI use host networking. Application pods use the pod network.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K05
    - K01
