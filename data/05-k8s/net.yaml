- id: K8S-NET-002
  sheet: K8S
  category: NET
  title: Check default deny network policies in every namespace
  objective: Finds namespaces where all pods can talk to all other pods.
  steps:
  - List NetworkPolicy objects for each namespace.
  - Find namespaces without a default deny policy for ingress and egress.
  - From a test pod, connect to a pod in another namespace.
  - Check that allow rules exist only for needed flows.
  example: kubectl get networkpolicy -A; kubectl get ns -o name | while read n; do kubectl get networkpolicy -n ${n#namespace/} -o name | wc -l; done
  expected: Each namespace has default deny for ingress and egress. Allow rules cover only documented flows, and the cross-namespace test connection fails.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K05
    cloud_native_top10:
    - CNAS-6
    cheatsheet:
