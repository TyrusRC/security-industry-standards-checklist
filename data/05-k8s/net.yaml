- id: K8S-NET-006
  sheet: K8S
  category: NET
  title: Check that internal services have no public route
  objective: Finds internal microservices that the ingress or a load balancer exposes by mistake.
  steps:
  - List all Ingress rules and public Services.
  - Map each route to a service and its owner.
  - From an outside network, request the paths of internal services.
  - Check that internal-only services use ClusterIP.
  example: kubectl get ingress -A -o wide; kubectl get svc -A | grep LoadBalancer; curl -sI https://<public-host>/<internal-path>
  expected: Only intended services have public routes. Requests for internal paths fail from outside.
  severity: High
  test_type: Manual
