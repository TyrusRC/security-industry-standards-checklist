- id: K8S-NET-001
  sheet: K8S
  category: NET
  title: Check that the CNI plugin enforces network policies
  objective: Finds clusters where network policies exist but the network plugin ignores them.
  preconditions:
  - Do not run on production.
  steps:
  - Identify the CNI plugin in use.
  - Check the vendor documentation for NetworkPolicy support.
  - Create a deny policy in a test namespace.
  - Test that traffic to the pod is blocked.
  example: kubectl get pods -n kube-system -o wide | grep -iE "calico|cilium|flannel|weave"; kubectl run -n <test-ns> curl --image=curlimages/curl -- curl -m 3 <pod-ip>
  expected: The CNI plugin supports NetworkPolicy. The test deny policy blocks the traffic.
  severity: High
  test_type: Manual
  refs:
    k8s_top10:
    - K05
    cloud_native_top10:
    - CNAS-6
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-923
    attack:
    - T1046
    nist_800_53:
    - SC-7
    - AC-4
  sources_read:
