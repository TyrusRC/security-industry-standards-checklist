- id: K8S-NET-005
  sheet: K8S
  category: NET
  title: Check encryption and mutual authentication between services
  objective: Finds service traffic in plaintext or with no caller identity inside the cluster.
  steps:
  - List the services and their ports.
  - Capture traffic between two test pods.
  - Check if a service mesh or application TLS gives mutual authentication.
  - Send a request to a service without a valid client identity.
  example: istioctl x describe pod <pod> (if Istio); kubectl exec <pod> -- tcpdump -i any -A port <port>; curl -v http://<service>:<port>
  expected: Service-to-service traffic uses TLS with mutual authentication. A request with no valid identity is rejected.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
    - K05
    cloud_native_top10:
