- id: K8S-NET-003
  sheet: K8S
  category: NET
  title: Check egress rules to the Internet and to the control plane
  objective: Finds pods that can send data out of the cluster or reach node and control plane services.
  steps:
  - From a test pod, connect to an external host.
  - From the pod, connect to the API server and to node ports.
  - Review the egress rules for the namespace.
  - Check that DNS is the only egress allowed by default.
  example: kubectl exec <pod> -- curl -m 3 https://example.com; kubectl exec <pod> -- curl -k -m 3 https://kubernetes.default.svc/version
  expected: Egress is limited to named destinations. Pods without need cannot reach the Internet, the node ports or the API server.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
    - K05
    cloud_native_top10:
