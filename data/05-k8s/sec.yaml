- id: K8S-SEC-006
  sheet: K8S
  category: SEC
  title: Check that secret values do not reach logs or audit records
  objective: Finds secrets written to pod logs, central log platforms or API audit logs.
  steps:
  - Search pod logs and the central log platform for known test secret values.
  - Read the audit policy for rules on secrets and configmaps.
  - Check that these resources use the Metadata level only.
  - Check who can read pods/log and the log platform.
  example: kubectl logs <pod> | grep -i "<test-secret>"; grep -B2 -A6 secrets /etc/kubernetes/audit-policy.yaml
  expected: Secret values never appear in logs. The audit policy records secrets and configmaps at the Metadata level only.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
    - K03
    - K10
    cloud_native_top10:
