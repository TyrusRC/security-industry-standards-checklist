- id: K8S-SEC-002
  sheet: K8S
  category: SEC
  title: Check that secrets reach containers as files and not as env variables
  objective: Finds secrets exposed as environment variables, where debug output and crash dumps can leak them.
  steps:
  - List all env entries that use secretKeyRef or envFrom with a secretRef.
  - Check that each secret is mounted as a read-only volume instead.
  - Look at the process list and the debug endpoints of a sample pod for the env values.
  - Check the mount mode of secret volumes.
  example: kubectl get pods -A -o json | jq ".items[] | select(.spec.containers[].env[]?.valueFrom.secretKeyRef or .spec.containers[].envFrom[]?.secretRef) | .metadata.name"; kubectl exec <pod> -- env
  expected: Workloads read secrets from read-only mounted files or from an in-memory fetch. Secrets are not set in env variables or image layers.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K03
    cloud_native_top10:
