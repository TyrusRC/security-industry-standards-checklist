- id: K8S-SEC-001
  sheet: K8S
  category: SEC
  title: Find secrets in ConfigMaps, manifests and pod specs
  objective: Finds credentials stored in objects with weaker access control than Secrets.
  steps:
  - Dump all ConfigMaps and pod specs.
  - Scan the output for passwords, tokens, keys and connection strings.
  - Scan the manifest and Helm repositories for the same values.
  - List each hit with its owner and the credential type.
  example: kubectl get configmaps -A -o yaml | gitleaks detect --no-git --source - (or trufflehog); kubectl get pods -A -o yaml | grep -iE "password|token|secret|key"
  expected: ConfigMaps and pod specs hold no credentials. All credentials are in a secret store and are not in manifests or repositories.
  severity: High
  test_type: Automated
  refs:
    k8s_top10:
    - K03
    cloud_native_top10:
    - CNAS-5
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    - Secrets_Management_Cheat_Sheet
    cwe:
    - CWE-798
    - CWE-312
    attack:
    - T1552.001
    nist_800_53:
    - IA-5
    - SC-28
