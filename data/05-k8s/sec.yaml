- id: K8S-SEC-007
  sheet: K8S
  category: SEC
  title: Scan container filesystems and images for stored secrets
  objective: Finds tokens, keys and passwords embedded in running containers or in the images that start them.
  steps:
  - List the images that run in the cluster.
  - Scan each image for secrets.
  - Scan the file system of a running container for keys and token files.
  - Check that found credentials were revoked.
  example: trivy image --scanners secret <image>; trivy fs --scanners secret <path>; gitleaks detect --source <repo>
  expected: Images and running containers hold no embedded secrets. Any secret found is revoked and rotated.
  severity: High
  test_type: Automated
  refs:
