- id: K8S-SEC-005
  sheet: K8S
  category: SEC
  title: Check rotation and lifetime of cluster and service account credentials
  objective: Finds long-lived tokens and certificates that stay valid after a leak.
  steps:
  - List secrets of type service-account-token and check their age.
  - Check that pods use projected tokens from the TokenRequest API with an expiry.
  - Check the validity period of client and serving certificates.
  - Check the rotation process and owner for each credential type.
  example: kubectl get secrets -A --field-selector type=kubernetes.io/service-account-token; kubectl create token <sa> --duration 10m; kubeadm certs check-expiration (self-managed)
  expected: Pods use short-lived projected tokens. No long-lived service account token Secrets exist without a written reason. Certificates rotate on a set schedule.
  severity: Medium
  test_type: Config Review
  refs:
