- id: K8S-SEC-003
  sheet: K8S
  category: SEC
  title: Check that Secrets are encrypted at rest in etcd
  objective: Finds clusters that store Secret objects in etcd in plaintext.
  preconditions:
  - Read access to etcd or the managed cluster settings.
  steps:
  - Read the encryption provider configuration of the API server or the managed service setting.
  - Check that a non-identity provider is first for secrets.
  - Read a test secret directly from etcd.
  - Check that existing secrets were rewritten after the change.
  example: ETCDCTL_API=3 etcdctl get /registry/secrets/<ns>/<name> | hexdump -C | head; kubectl get secrets -A -o json | kubectl replace -f - (rewrite after change)
  expected: The etcd value of a test secret starts with the encryption provider prefix and shows no plaintext. Existing secrets are rewritten. Backups are encrypted.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K03
    cloud_native_top10:
