- id: K8S-SEC-004
  sheet: K8S
  category: SEC
  title: Check use of an external secret store and workload identity
  objective: Finds clusters that keep long-lived static credentials in Secret objects when a short-lived option exists.
  steps:
  - List the Secret objects of type Opaque and kubernetes.io/service-account-token.
  - Find static cloud or database credentials among them.
  - Check if workloads use an external secret operator or workload identity federation.
  - Check the age and rotation date of each credential.
  example: kubectl get secrets -A --field-selector type=Opaque; kubectl get externalsecrets -A (if External Secrets Operator is in use); kubectl get secrets -A -o json | jq ".items[] | {n:.metadata.name, c:.metadata.creationTimestamp}"
  expected: Workloads get short-lived credentials from a managed vault or workload identity. Few static secrets remain and each has an owner and rotation date.
  severity: Medium
  test_type: Config Review
  refs:
