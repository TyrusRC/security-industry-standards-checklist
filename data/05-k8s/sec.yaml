- id: K8S-SEC-008
  sheet: K8S
  category: SEC
  title: Check access paths and audit of the secret store itself
  objective: Finds secret managers with broad access and no record of who read which secret.
  steps:
  - List the principals that can read secrets in the external store.
  - Check that each workload can read only its own secrets.
  - Check that reads create audit records with the identity and source.
  - Make sure alerts fire for reads from an unexpected source.
  example: Check the provider audit log for secret read events; vault audit list (HashiCorp Vault); aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=GetSecretValue
  expected: Each workload reads only its own secrets. Every read is recorded with identity and source, and unusual reads raise an alert.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K03
    cloud_native_top10:
