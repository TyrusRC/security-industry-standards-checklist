- id: K8S-POL-003
  sheet: K8S
  category: POL
  title: Check failure mode and scope of admission webhooks
  objective: Finds webhooks that fail open, skip namespaces, or let a user bypass policy.
  steps:
  - List each webhook with its failurePolicy, namespaceSelector and objectSelector.
  - Find webhooks with failurePolicy set to Ignore after the rollout phase.
  - Check which namespaces and objects the selectors exclude.
  - Check that users cannot add labels that exclude their pods.
  example: kubectl get validatingwebhookconfigurations -o yaml | grep -E "failurePolicy|namespaceSelector|objectSelector"
  expected: Production webhooks fail closed. Selectors exclude only system namespaces, and users cannot change labels to skip a policy.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K04
