- id: K8S-POL-005
  sheet: K8S
  category: POL
  title: Check that admission decisions go to a central log
  objective: Finds policy denials and exceptions that no one sees.
  preconditions:
  - Do not run on production.
  steps:
  - Create a denied object in a test namespace.
  - Look for the denial in the audit log and in the policy engine log.
  - Check that the central log system receives both.
  - Check that an alert exists for repeated denials.
  example: kubectl logs -n <policy-ns> deploy/<policy-engine> | grep -i deny; query the central log platform for the denied request
  expected: Denials and policy changes appear in the central log with the user, object and rule. Repeated denials raise an alert.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
    - K04
    - K10
    cloud_native_top10:
