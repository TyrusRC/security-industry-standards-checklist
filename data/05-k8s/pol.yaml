- id: K8S-POL-001
  sheet: K8S
  category: POL
  title: Check Pod Security Admission labels on every namespace
  objective: Finds namespaces with no enforced pod security level.
  preconditions:
  - Do not run on production.
  steps:
  - List the pod-security labels of every namespace.
  - Find namespaces with no enforce label or with the privileged level.
  - Check that the audit and warn labels are set.
  - In a test namespace, create a pod that breaks the enforced level.
  example: kubectl get ns --show-labels | grep -v pod-security.kubernetes.io/enforce; kubectl run test --image=nginx --privileged -n <test-ns>
  expected: Each application namespace enforces the baseline level or better, and restricted where possible. The pod that breaks the level is rejected.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K04
    - K01
    cloud_native_top10:
    - CNAS-1
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-693
    attack:
    - T1610
    nist_800_53:
    - CM-6
    - CM-7
  sources_read:
