- id: K8S-POL-004
  sheet: K8S
  category: POL
  title: Check that new policies start in audit mode and move to enforce
  objective: Finds policies that stay in audit or warn mode and so block nothing.
  steps:
  - List the policies and the mode of each one.
  - Find policies in audit or warn mode longer than the rollout plan allows.
  - Review the audit results for current violations.
  - Check the plan and date to move to enforce.
  example: kubectl get ns -o json | jq ".items[] | {n:.metadata.name, l:.metadata.labels}"; kubectl get constraints; kubectl get policyreport -A
  expected: Each policy has an owner and a date to move to deny. Open violations are fixed or have an exception on record.
  severity: Low
  test_type: Manual
  refs:
    k8s_top10:
    - K04
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-693
    nist_800_53:
    - CM-3
    - CM-6
