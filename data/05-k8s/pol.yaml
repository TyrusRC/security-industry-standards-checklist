- id: K8S-POL-002
  sheet: K8S
  category: POL
  title: Check that a policy engine enforces cluster rules beyond Pod Security
  objective: Finds clusters that depend on manual review for rules such as registries, labels and ingress settings.
  preconditions:
  - Do not run on production.
  steps:
  - List validating admission policies and admission webhooks.
  - Find the policy engine in use, such as Gatekeeper, Kyverno or Kubewarden.
  - Read the policy list and the mode of each policy.
  - Create a test object that breaks one policy.
  example: kubectl get validatingadmissionpolicy,validatingadmissionpolicybinding,validatingwebhookconfigurations,mutatingwebhookconfigurations; kubectl get constrainttemplates; kubectl get clusterpolicies
  expected: Policies for privileged settings, allowed registries and required labels are active and set to deny. The test object is rejected.
  severity: High
  test_type: Config Review
  refs:
