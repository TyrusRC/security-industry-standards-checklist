- id: K8S-CMP-003
  sheet: K8S
  category: CMP
  title: Check patch level of the container runtime and the node kernel
  objective: Finds nodes with known container escape or kernel privilege escalation flaws.
  steps:
  - List the runtime and kernel versions on all nodes.
  - Compare them to the current security advisories for the runtime, runc and the kernel.
  - Check the node image age.
  - Check the process to replace or patch nodes.
  example: kubectl get nodes -o wide; uname -r; runc --version; containerd --version; trivy rootfs / (on the node)
  expected: Runtime, runc and kernel have no open known critical flaws. Nodes are replaced or patched on a set schedule.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K07
