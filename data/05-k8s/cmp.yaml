- id: K8S-CMP-004
  sheet: K8S
  category: CMP
  title: Check hardening of the node operating system
  objective: Finds general-purpose node images that carry many unneeded services and packages.
  steps:
  - List the node operating system and image for each node pool.
  - Check if the image is a minimal container-focused OS.
  - List the services and packages on a sample node.
  - Check the firewall rules and local accounts of the node.
  example: kubectl get nodes -o wide; systemctl list-units --type=service --state=running; ss -tlnp
  expected: Nodes use a minimal OS image with few services. Firewall rules are strict, and no unneeded packages are present.
  severity: Medium
  test_type: Config Review
