- id: K8S-CMP-006
  sheet: K8S
  category: CMP
  title: Build an inventory of clusters, namespaces, workloads and owners
  objective: Finds unknown, abandoned or unowned clusters, namespaces and workloads that nobody patches.
  steps:
  - List all clusters of the organization from the cloud accounts.
  - List namespaces and workloads in each cluster with owner labels.
  - Find workloads with no owner or with no recent deploy.
  - Compare the result to the asset register.
  example: aws eks list-clusters; az aks list; gcloud container clusters list; kubectl get ns --show-labels; kubectl get deploy -A -o wide
  expected: Every cluster, namespace and workload is in the asset register with an owner. Abandoned items are removed.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
    - K07
    cloud_native_top10:
