- id: K8S-CMP-001
  sheet: K8S
  category: CMP
  title: Run a hardening scan on the cluster components
  objective: Finds control plane and node settings that stay on weak defaults.
  steps:
  - Run a configuration benchmark tool against the control plane and nodes.
  - List all failed checks with the component name.
  - Rank the failed checks by risk for this cluster.
  - Record accepted deviations with an owner.
  example: kube-bench run; kubescape scan; trivy k8s --report summary cluster
  expected: Failed checks are fixed or have an accepted reason with an owner. API server, controller manager, scheduler, kubelet and etcd settings are hardened.
  severity: Medium
  test_type: Automated
  refs:
    k8s_top10:
    - K07
    cloud_native_top10:
    - CNAS-1
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-1188
    attack:
    - T1190
    nist_800_53:
    - CM-6
    - CM-2
  notes: The CIS Benchmarks are not on disk and are not cited. Use the tool output as an input and map failed checks to this sheet.
  sources_read:
  - sources/repos/www-project-kubernetes-top-ten/2025/en/src/K07-Misconfigured-And-Vulnerable-Cluster-Components.md
  - sources/repos/www-project-cloud-native-application-security-top-10/2022/en/src/0x01_insecure_cco_config.md
  - sources/top10s/cnas_index.md
  - sources/repos/CheatSheetSeries/cheatsheets/Kubernetes_Security_Cheat_Sheet.md
- id: K8S-CMP-002
  sheet: K8S
  category: CMP
  title: Check that Kubernetes and its components are on a supported release
  objective: Finds clusters on end-of-life versions that no longer get security fixes.
  steps:
  - Get the version of the API server, kubelets and kube-proxy.
  - Compare each to the list of supported releases.
  - Check the patch level against the latest security fixes.
  - Check the upgrade plan and the owner.
  example: kubectl version; kubectl get nodes -o custom-columns=NAME:.metadata.name,KUBELET:.status.nodeInfo.kubeletVersion,RUNTIME:.status.nodeInfo.containerRuntimeVersion
  expected: All components run a supported release with current patches. A dated upgrade plan exists for any component that is behind.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K07
    cloud_native_top10:
    - CNAS-7
    cheatsheet:
