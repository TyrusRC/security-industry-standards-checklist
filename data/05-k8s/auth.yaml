- id: K8S-AUTH-001
  sheet: K8S
  category: AUTH
  title: Check that users sign in through an external identity provider
  objective: Finds clusters where human users rely on built-in credentials with no revocation or audit.
  steps:
  - List the authentication methods in use on the API server.
  - Check that users authenticate through OIDC or the managed cloud identity service.
  - Find static token files, basic auth files and long-lived client certificates for users.
  - Check that the identity provider enforces MFA.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep -E "oidc|token-auth-file|client-ca"; kubectl config view --raw | grep -E "client-certificate|token"
  expected: Users sign in with short-lived tokens from an external identity provider with MFA. No static token file exists and no user certificates are valid for years.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K09
    cloud_native_top10:
    - CNAS-3
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-287
    - CWE-798
    attack:
    - T1078
    nist_800_53:
    - IA-2
    - IA-5
