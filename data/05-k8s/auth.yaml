- id: K8S-AUTH-003
  sheet: K8S
  category: AUTH
  title: Check that service account tokens are not used outside the cluster
  objective: Finds long-lived service account tokens that people or external systems use.
  steps:
  - Find Secrets of type service-account-token.
  - Search the audit log for requests from service accounts with source IPs outside the cluster.
  - Check CI and external tools for stored cluster tokens.
  - Check the expiry of each token.
  example: kubectl get secrets -A --field-selector type=kubernetes.io/service-account-token; kubectl create token <sa> --duration 1h
  expected: No external system uses a long-lived service account token. External tools use short-lived tokens from TokenRequest or a federated identity.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K09
