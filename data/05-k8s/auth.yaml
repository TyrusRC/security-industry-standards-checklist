- id: K8S-AUTH-004
  sheet: K8S
  category: AUTH
  title: Check use of client certificates for user access
  objective: Finds user client certificates that cannot be revoked and last for a long time.
  steps:
  - List user kubeconfig entries that use client certificates.
  - Check the validity period of each certificate.
  - Check the break-glass process for certificate use.
  - Check that the cluster CA is not shared between environments.
  example: openssl x509 -in <client.crt> -noout -dates -subject; kubectl get csr
  expected: User client certificates are used only for break-glass access. They are short-lived, listed, and the process to re-key the cluster is documented.
  severity: Medium
  test_type: Config Review
  refs:
