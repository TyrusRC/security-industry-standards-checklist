- id: K8S-AUTH-005
  sheet: K8S
  category: AUTH
  title: Check that kubelets reject anonymous requests
  objective: Finds kubelets that accept unauthenticated calls and so allow command execution on pods.
  preconditions:
  - Network access to a test node.
  steps:
  - Send a request to port 10250 of a node without credentials.
  - Send a request to the read-only port 10255.
  - Read the kubelet configuration for anonymous auth and authorization mode.
  - Check that webhook authorization is on.
  example: curl -k https://<node>:10250/pods; curl http://<node>:10255/pods; grep -A3 -E "anonymous|authorization" /var/lib/kubelet/config.yaml
  expected: The kubelet returns 401 or 403 for anonymous requests. Anonymous auth is off, authorization mode is Webhook, and port 10255 is closed.
  severity: Critical
  test_type: Manual
  refs:
    k8s_top10:
    - K09
