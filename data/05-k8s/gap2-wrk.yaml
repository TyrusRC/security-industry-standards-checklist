- id: K8S-WRK-018
  sheet: K8S
  category: WRK
  title: Review CronJobs and Jobs for unknown scheduled workloads
  objective: Finds scheduled jobs that an attacker may use for persistence or execution.
  steps:
  - List all CronJobs and Jobs in all namespaces.
  - Read the image, command and service account of each CronJob.
  - Compare the list to the change records.
  - Check who can create CronJobs.
  example: kubectl get cronjob,job -A -o wide; kubectl get cronjob -A -o json | jq ".items[].spec.jobTemplate.spec.template.spec.containers[].image"
  expected: Each CronJob is known and approved. The image is trusted and the service account has only the needed rights.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    attack:
    - T1053.007
    nist_800_53:
    - CM-3
    - CM-8
    tool_check:
    - kubescape:C-0026
    other:
    - NSA/CISA Kubernetes Hardening Guidance 1.2, section Audit Logging and Threat Detection, Logging
  sources_read:
  - sources/repos/regolibrary/controls/C-0026-kubernetescronjob.json
  - sources/nsa_k8s/nsa_k8s_hardening.md
- id: K8S-WRK-019
  sheet: K8S
  category: WRK
  title: Check volume encryption and workload access to volumes, secrets and ConfigMaps
  objective: Finds data volumes without encryption and workloads with more storage access than needed.
  steps:
  - List StorageClasses and PersistentVolumes with their encryption settings.
  - Find volumes without encryption.
  - List workloads that mount PVCs, secrets or ConfigMaps.
  - Remove mounts that the workload does not need.
  example: kubectl get sc,pv -o wide; kubectl get pods -A -o json | jq -r ".items[] | select(.spec.volumes[]?.persistentVolumeClaim) | .metadata.name"
  expected: All PersistentVolumes use encrypted storage. Each workload mounts only the volumes, secrets and ConfigMaps that it needs.
  severity: Medium
  test_type: Config Review
