- id: K8S-WRK-022
  sheet: K8S
  category: WRK
  title: Check pod placement by sensitivity tier and node isolation
  objective: Finds sensitive pods that share nodes with less trusted workloads.
  steps:
  - List the sensitivity tiers of the workloads and the node pools.
  - Read nodeSelector and tolerations of sensitive workloads.
  - Check that PodNodeSelector or PodTolerationRestriction limits placement by namespace.
  - Check that users cannot remove the taints or labels that separate the pools.
  example: kubectl get pods -A -o wide; kubectl get nodes --show-labels; kubectl describe node <node> | grep Taints
  expected: Sensitive workloads run on separate nodes or in sandboxed runtimes. Admission rules enforce the placement and users cannot bypass it.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
    - CNAS-1
    cwe:
    - CWE-653
    nist_800_53:
    - SC-39
    - AC-4
    other:
    - 'Kubernetes docs: security-checklist.md'
    - 'Kubernetes docs: multi-tenancy.md'
    - 'Kubernetes docs: securing-a-cluster.md'
  sources_read:
