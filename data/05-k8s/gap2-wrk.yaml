- id: K8S-WRK-012
  sheet: K8S
  category: WRK
  title: Check hostPath volumes for read-only use, narrow paths and admission blocks
  objective: Finds pods that can read or write host files through hostPath mounts.
  preconditions:
  - Do not run on production.
  steps:
  - List all pods with hostPath volumes and the host path of each.
  - Find mounts that are writable or that mount a parent directory such as / or /var.
  - Find subPath mounts on affected Kubernetes versions.
  - Check that an admission rule blocks hostPath outside an approved list.
  - Try to create a pod with a hostPath mount in a test namespace.
  example: kubectl get pods -A -o json | jq -r ".items[] | select(.spec.volumes[]?.hostPath) | .metadata.namespace+"/"+.metadata.name"; kubescape scan control C-0045,C-0203
  expected: Only approved system pods use hostPath, with narrow paths and read-only mounts. Admission rules reject all other hostPath volumes.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
    - CNAS-1
    cwe:
    - CWE-668
    attack:
    - T1611
    nist_800_53:
    - AC-6
    - CM-7
    tool_check:
    - kubescape:C-0045
    - kubescape:C-0048
    - kubescape:C-0058
    - kubescape:C-0203
    - prowler:kubernetes:core_minimize_hostpath_volume_mounts
    other:
    - 'Kubernetes docs: api-server-bypass-risks.md'
  sources_read:
  - sources/repos/regolibrary/controls/C-0045-writablehostpathmount.json
  - sources/repos/regolibrary/controls/C-0048-hostpathmount.json
  - sources/repos/regolibrary/controls/C-0058-cve202125741usingsymlinkforarbitraryhostfilesystemaccess.json
  - sources/repos/regolibrary/controls/C-0203-minimizetheadmissionofhostpathvolumes.json
  - sources/repos/k8s-website/content/en/docs/concepts/security/api-server-bypass-risks.md
- id: K8S-WRK-013
  sheet: K8S
  category: WRK
  title: Find pods that use hostPort or Windows HostProcess containers
  objective: Finds pods that open node ports or run as processes on the Windows host.
  steps:
  - List containers that set hostPort.
  - List pods that set hostProcess in the Windows security context.
  - Ask the owner to justify each case.
  - Check that admission rules reject both settings outside system namespaces.
  - Replace hostPort with a Service of type ClusterIP or NodePort.
  example: kubectl get pods -A -o json | jq -r ".items[] | select(.spec.containers[].ports[]?.hostPort) | .metadata.name"
  expected: No application pod uses hostPort or hostProcess. Admission rules block both settings.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
    - CNAS-1
    cwe:
    - CWE-668
    attack:
    - T1611
    nist_800_53:
    - CM-7
    - SC-7
    tool_check:
    - kubescape:C-0044
    - kubescape:C-0202
    - kubescape:C-0204
    - prowler:kubernetes:core_minimize_admission_hostport_containers
    - prowler:kubernetes:core_minimize_admission_windows_hostprocess_containers
  sources_read:
  - sources/repos/regolibrary/controls/C-0044-containerhostport.json
