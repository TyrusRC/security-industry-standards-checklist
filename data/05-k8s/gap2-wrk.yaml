  - sources/repos/regolibrary/controls/C-0062-sudoincontainerentrypoint.json
- id: K8S-WRK-015
  sheet: K8S
  category: WRK
  title: Check noexec, nosuid and nodev options on writable mounts
  objective: Finds writable volumes from which an attacker can start dropped binaries.
  preconditions:
  - Do not run on production.
  steps:
  - List writable volume mounts of each container, including emptyDir and hostPath.
  - Read the mount options of each mount.
  - In a test pod, write a script to a writable mount and set it executable.
  - Try to run the script from the mount.
  example: kubectl exec <pod> -- sh -c "cp /bin/true /tmp/t && /tmp/t"; kubectl exec <pod> -- mount | grep -E "noexec|nosuid"
  expected: Writable mounts use the options noexec, nosuid and nodev where the application allows it. The test script does not run.
  severity: Low
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cwe:
    - CWE-732
    nist_800_53:
    - CM-7
    tool_check:
    - kubescape:C-0319
    other:
    - 'Kubernetes docs: application-security-checklist.md'
  sources_read:
  - sources/repos/regolibrary/controls/C-0319-mountsecurityoptions.json
  - sources/repos/k8s-website/content/en/docs/concepts/security/application-security-checklist.md
- id: K8S-WRK-016
  sheet: K8S
  category: WRK
  title: Check CPU and memory requests and the QoS class of workloads
  objective: Finds pods that can starve others or get evicted first because they set no requests.
  steps:
  - List CPU and memory requests for each container.
  - Find pods with the QoS class BestEffort.
  - Check that the memory limit is not lower than the memory request.
  - Check that critical workloads have the Guaranteed or Burstable class with fitting values.
  example: kubectl get pods -A -o json | jq -r ".items[] | select(.status.qosClass=="BestEffort") | .metadata.namespace+"/"+.metadata.name"
  expected: Each container sets CPU and memory requests. No application pod is BestEffort, and memory limits fit the requests.
  severity: Low
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-9
    cwe:
    - CWE-770
    attack:
    - T1499
    nist_800_53:
    - SC-5
    tool_check:
    - kubescape:C-0268
    - kubescape:C-0269
    - prowler:kubernetes:core_cpu_requests_set
    - prowler:kubernetes:core_memory_requests_set
    other:
    - 'Kubernetes docs: application-security-checklist.md'
    - 'Kubernetes docs: multi-tenancy.md'
