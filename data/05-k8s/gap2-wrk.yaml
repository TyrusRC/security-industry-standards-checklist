- id: K8S-WRK-020
  sheet: K8S
  category: WRK
  title: Find dangling and mismatched objects that hide broken controls
  objective: Finds policies and routes that target nothing and so give false safety.
  steps:
  - List NetworkPolicies whose pod selector matches no pod.
  - List Services, Ingresses, Gateway routes and autoscalers that point to missing targets.
  - List workloads where the selector does not match the pod labels.
  - List pods with duplicate environment variables, missing or deprecated service account fields.
  example: kubescape scan control C-0299,C-0293,C-0296,C-0295,C-0294,C-0307; kubectl get netpol,svc,ing -A
  expected: Each policy selects at least one workload. Services, routes and autoscalers have valid targets. Selectors, environment variables and service accounts are correct.
  severity: Low
  test_type: Config Review
