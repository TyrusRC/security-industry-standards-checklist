- id: K8S-WRK-021
  sheet: K8S
  category: WRK
  title: Check hardening of Agent Sandbox workloads
  objective: Finds sandbox templates for AI agents that lack isolation, limits or egress control.
  preconditions:
  - The cluster uses the Agent Sandbox resources.
  steps:
  - List Sandbox and SandboxTemplate resources.
  - Check that each uses an approved hardened runtime class.
  - Check CPU and memory limits, image registry and image digest for each container.
  - Check the egress policy mode and that claims cannot override template settings.
  - Check that service account tokens are not mounted.
  example: kubectl get sandboxtemplates,sandboxes -A -o yaml; kubescape scan control C-0297,C-0301,C-0303,C-0309,C-0314,C-0316
  expected: Sandboxes use a hardened runtime, set resource limits and pin images from approved registries. Egress is limited, tokens are off, and claims cannot override the template.
  severity: High
  test_type: Config Review
