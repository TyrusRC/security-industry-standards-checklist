- id: K8S-WRK-014
  sheet: K8S
  category: WRK
  title: Find SSH servers and sudo in container images and commands
  objective: Finds containers that give remote shell access or raise privileges at start.
  steps:
  - List containers that expose port 22 or 2222.
  - Search the entry point and command of each container for sudo.
  - Search the image file systems for an sshd binary.
  - Remove SSH and sudo from the images and use kubectl debug for support work.
  example: kubectl get pods -A -o json | jq -r ".items[] | select(.spec.containers[].ports[]?.containerPort | IN(22,2222)) | .metadata.name"; kubescape scan control C-0042,C-0062
  expected: No container runs an SSH server or uses sudo in its start command. Support access uses audited Kubernetes access.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
    - CNAS-1
    cwe:
    - CWE-250
    attack:
    - T1021
    nist_800_53:
    - CM-7
    - AC-17
    tool_check:
    - kubescape:C-0042
    - kubescape:C-0062
  sources_read:
