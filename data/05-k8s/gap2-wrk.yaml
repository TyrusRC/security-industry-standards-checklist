- id: K8S-WRK-017
  sheet: K8S
  category: WRK
  title: Check controllers, probes, update strategy and labels of workloads
  objective: Finds pods and deployments that drift from the code, stay unhealthy or lack an owner.
  steps:
  - List pods that have no owner controller.
  - List containers without readiness and liveness probes.
  - List deployments that use a non-rolling update strategy.
  - List workloads without the common app and owner labels.
  example: kubectl get pods -A -o json | jq -r ".items[] | select(.metadata.ownerReferences==null) | .metadata.name"
  expected: Each pod belongs to a controller with probes and a rolling update. Labels name the app and the owner.
  severity: Info
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-8
    nist_800_53:
