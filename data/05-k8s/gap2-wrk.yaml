- id: K8S-WRK-023
  sheet: K8S
  category: WRK
  title: Check custom seccomp profiles and audit mode for baselines
  objective: Finds workloads without a tailored syscall filter and without syscall baselines.
  steps:
  - List workloads that use a Localhost seccomp profile.
  - Read the profile directory of the kubelet on a sample node.
  - Check if audit mode profiles record the syscalls of a new workload.
  - Use the recorded syscalls to build a tighter profile.
  example: ls /var/lib/kubelet/seccomp/; kubectl get pods -A -o json | jq ".items[].spec.securityContext.seccompProfile"
  expected: Sensitive workloads use a custom profile that allows only needed syscalls. Audit profiles help build the baseline before enforcement.
  severity: Low
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    nist_800_53:
    - CM-7
    other:
    - 'Kubernetes docs: security-checklist.md'
    - 'NSA/CISA Kubernetes Hardening Guidance 1.2, section Audit Logging and Threat Detection, Seccomp: audit mode'
    - NSA/CISA Kubernetes Hardening Guidance 1.2, section Kubernetes Pod security, Hardening container environments
