- id: K8S-LOG-007
  sheet: K8S
  category: LOG
  title: Check monitoring of cluster resource use and configuration changes
  objective: Finds clusters that miss resource exhaustion and unplanned changes to cluster configuration.
  preconditions:
  - Do not run on production.
  steps:
  - Check that CPU, memory and storage use of nodes and pods is monitored with alerts.
  - Check that Kubernetes events go to the central log.
  - Make a test change to a ConfigMap.
  - Find an alert or record of the change.
  example: kubectl get events -A --sort-by=.lastTimestamp | tail; kubectl top nodes; kubectl top pods -A
  expected: Resource alerts exist for node and pod limits. Events and configuration changes appear in the central log before they expire.
  severity: Low
  test_type: Manual
