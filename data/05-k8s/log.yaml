- id: K8S-LOG-002
  sheet: K8S
  category: LOG
  title: Check the audit policy covers credentials and sensitive actions
  objective: Finds policies that miss the creation of tokens and certificates, which the cluster does not store.
  steps:
  - Read the audit policy file rule by rule.
  - Check rules for serviceaccounts/token, certificatesigningrequests, RBAC objects and pods/exec.
  - Create a test token and a test CSR.
  - Find both events in the audit log.
  example: kubectl create token <sa> -n <test-ns>; kubectl get csr; grep -E "serviceaccounts/token|certificatesigningrequests" /var/log/kubernetes/audit.log | head
  expected: The audit log shows who made each token and certificate request. Secrets and configmaps use the Metadata level only.
  severity: High
  test_type: Manual
  refs:
