- id: K8S-LOG-003
  sheet: K8S
  category: LOG
  title: Check that logs go to protected storage outside the cluster
  objective: Finds logs that an attacker with node or cluster access can edit or delete.
  steps:
  - Find where audit, node and workload logs go.
  - Check that an agent ships logs from every node.
  - Check that the log store is append-only and outside the cluster.
  - Check who can delete or edit logs.
  example: kubectl get ds -A | grep -iE "fluent|filebeat|vector"; kubectl logs <pod>; check the retention and write controls of the log store
  expected: Logs leave the node in near real time to a store outside the cluster. Only a small group can read them, and none can edit them.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K10
    cloud_native_top10:
