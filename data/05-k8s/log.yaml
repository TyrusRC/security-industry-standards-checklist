- id: K8S-LOG-001
  sheet: K8S
  category: LOG
  title: Check that Kubernetes API audit logging is on
  objective: Finds clusters that keep no record of API requests.
  steps:
  - Read the audit policy and audit log flags of the API server or the managed service setting.
  - Make a test change in a test namespace.
  - Find the event in the audit log.
  - Check that the event has user, verb, object and time.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep audit; kubectl create ns audit-test; grep audit-test /var/log/kubernetes/audit.log | head -1
  expected: The API server writes audit events for all requests that the policy requires. The test change appears with user, verb, object and time.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K10
    cloud_native_top10:
    - CNAS-10
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    - Logging_Cheat_Sheet
    cwe:
    - CWE-778
    attack:
    - T1685.002
    nist_800_53:
    - AU-2
    - AU-12
