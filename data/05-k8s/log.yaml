- id: K8S-LOG-004
  sheet: K8S
  category: LOG
  title: Check log buffering and delivery during outages
  objective: Finds log pipelines that drop records when the central store is down.
  preconditions:
  - Use a test setup only.
  steps:
  - Find the buffer type and size at each node agent.
  - Stop the log destination in a test setup for a short time.
  - Restore the destination.
  - Count the records that arrive after recovery.
  example: Read the agent configuration (Fluent Bit or Fluentd); compare event counts before and after the outage
  expected: The agent buffers records on disk and delivers them after recovery. A message broker decouples ingestion from storage. Lost records are reported.
  severity: Low
  test_type: Manual
  refs:
    k8s_top10:
    - K10
    cloud_native_top10:
    - CNAS-10
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    - Microservices_Security_Cheat_Sheet
    cwe:
