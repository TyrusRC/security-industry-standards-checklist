- id: K8S-LOG-005
  sheet: K8S
  category: LOG
  title: Check alerts on API failures and risky cluster actions
  objective: Finds clusters where authorization failures and risky actions raise no alert.
  preconditions:
  - Do not run on production.
  steps:
  - Send requests that return 403 from a test account.
  - Run kubectl exec into a test pod and create a privileged pod in a test namespace.
  - Look for alerts in the monitoring system.
  - Check the alert route and the response time.
  example: kubectl auth can-i delete nodes --as=<test-user>; kubectl exec <test-pod> -- id; query the log platform for responseStatus.code 403
  expected: Spikes of 403 responses, exec into pods and privileged pod creation raise alerts that reach the response team in the agreed time.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
    - K10
    cloud_native_top10:
