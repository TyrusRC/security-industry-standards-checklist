- id: K8S-LOG-006
  sheet: K8S
  category: LOG
  title: Check monitoring of container activity and network flows
  objective: Finds clusters with no view of process, file and network behavior of containers.
  steps:
  - Find the tools that record process, file and network events of containers.
  - Start a test pod that makes an outbound connection.
  - Find the event in the tool.
  - Compare the replicas of one deployment for odd behavior.
  example: kubectl get pods -A | grep -iE "falco|tetragon|cilium"; kubectl exec <test-pod> -- curl -m 3 https://example.com
  expected: The tools record unexpected process starts, sensitive file reads and outbound connections. A replica that differs from its peers is flagged.
  severity: Medium
  test_type: Manual
  refs:
    k8s_top10:
    - K10
    cloud_native_top10:
