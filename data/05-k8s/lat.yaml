- id: K8S-LAT-001
  sheet: K8S
  category: LAT
  title: Check the cloud permissions of node roles
  objective: Finds node identities with wide cloud rights that every pod on the node can use.
  steps:
  - Find the cloud identity attached to each node pool.
  - List the policies of each node identity.
  - Find rights to storage, databases, IAM and compute creation.
  - Compare them to the minimum that a node needs.
  example: aws iam list-attached-role-policies --role-name <node-role>; az aks show -n <c> -g <rg> --query identityProfile; gcloud container node-pools describe <p> --cluster <c> --format="value(config.serviceAccount)"
  expected: Node identities hold only the rights that the node agent needs. Application rights come from workload identities.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K08
    cloud_native_top10:
    - CNAS-3
    cheatsheet:
    - Kubernetes_Security_Cheat_Sheet
    cwe:
    - CWE-272
    - CWE-250
    attack:
    - T1078.004
    - T1552.005
    nist_800_53:
    - AC-6
  see:
  - CLD-IAM-001
  sources_read:
  - sources/repos/www-project-kubernetes-top-ten/2025/en/src/K08-Cluster-To-Cloud-Lateral-Movement.md
  - sources/repos/www-project-cloud-native-application-security-top-10/2022/en/src/0x03_improper_auth.md
  - sources/top10s/cnas_index.md
  - sources/repos/CheatSheetSeries/cheatsheets/Kubernetes_Security_Cheat_Sheet.md
- id: K8S-LAT-002
  sheet: K8S
  category: LAT
  title: Check that pods use workload identity and not the node identity
  objective: Finds pods that inherit the node role when a per-service-account cloud role is available.
  steps:
  - List service accounts with cloud role annotations or identity bindings.
  - Find workloads that call cloud APIs without a workload identity.
  - From a test pod, request cloud credentials and note whose identity returns.
  - Check the scope of each workload role.
  example: kubectl get sa -A -o json | jq ".items[] | select(.metadata.annotations) | {n:.metadata.name, a:.metadata.annotations}"; kubectl exec <pod> -- aws sts get-caller-identity
  expected: Each workload gets a scoped, short-lived cloud role through EKS Pod Identity, IRSA, GKE Workload Identity or AKS Workload Identity. The returned identity is not the node role.
  severity: High
  test_type: Manual
  refs:
