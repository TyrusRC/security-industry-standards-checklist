- id: K8S-LAT-004
  sheet: K8S
  category: LAT
  title: Find static cloud credentials in the cluster
  objective: Finds long-lived cloud keys in Secrets, ConfigMaps, env variables and images.
  steps:
  - Search Secrets, ConfigMaps and pod specs for cloud access key patterns.
  - Scan images for cloud key files.
  - Check the age and last use of each key found.
  - Replace each key with workload identity.
  example: trivy image --scanners secret <image>; kubectl get secrets,cm -A -o yaml | grep -E "AKIA|aws_access_key|client_secret|private_key"; gitleaks detect
  expected: The cluster holds no static cloud keys. Any key found is revoked and replaced with a short-lived identity.
  severity: High
  test_type: Automated
  refs:
    k8s_top10:
    - K08
    - K03
