- id: K8S-LAT-005
  sheet: K8S
  category: LAT
  title: Check runtime detection of tools and shells in containers
  objective: Finds clusters that do not alert on shells, discovery tools or cloud CLIs that start inside a container.
  preconditions:
  - Do not run on production.
  steps:
  - Check that a runtime security tool runs on all nodes.
  - In a test pod, start a shell and run curl and a cloud CLI.
  - Check for an alert for each action.
  - Check who receives the alerts.
  example: kubectl get pods -A | grep -iE "falco|tetragon"; kubectl exec -it <test-pod> -- sh -c "curl -m 3 https://example.com; which aws"
  expected: The tool raises an alert for each unexpected shell and tool. The alerts reach the response team.
  severity: Medium
  test_type: Manual
