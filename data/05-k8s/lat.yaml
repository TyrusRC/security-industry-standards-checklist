- id: K8S-LAT-003
  sheet: K8S
  category: LAT
  title: Check that pods cannot reach the instance metadata service
  objective: Finds pods that can steal node credentials from the metadata address.
  steps:
  - From a test pod, request the metadata address 169.254.169.254.
  - Check the NetworkPolicy that blocks egress to this address.
  - 'Check the metadata settings of the node: token required and hop limit.'
  - Check other provider metadata addresses.
  example: kubectl exec <pod> -- curl -m 3 http://169.254.169.254/latest/meta-data/; aws ec2 describe-instances --query "Reservations[].Instances[].MetadataOptions"
  expected: The request from the pod fails. The node requires session tokens for metadata (IMDSv2) and a network policy blocks the address.
  severity: High
  test_type: Manual
  refs:
