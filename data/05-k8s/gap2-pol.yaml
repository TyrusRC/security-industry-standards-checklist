- id: K8S-POL-006
  sheet: K8S
  category: POL
  title: Check namespaces as boundaries and workloads in default or system namespaces
  objective: Finds workloads that share a namespace with other teams or with cluster services.
  steps:
  - List the namespaces and the teams or tenants that own them.
  - List pods in the default, kube-system and kube-public namespaces.
  - Find user workloads in these namespaces.
  - Check that RBAC, quotas and network policies exist for each application namespace.
  example: kubectl get pods -n default; kubectl get pods -n kube-public; kubectl get ns --show-labels
  expected: Each application has its own namespace with its own RBAC, quota and network policy. The default, kube-system and kube-public namespaces hold no user workloads.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
