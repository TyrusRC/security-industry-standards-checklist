- id: K8S-POL-007
  sheet: K8S
  category: POL
  title: Review Pod Security admission exemptions and cluster defaults
  objective: Finds users, runtime classes and namespaces that skip pod security checks.
  preconditions:
  - Do not run on production.
  steps:
  - Read the admission configuration of the API server for the PodSecurity plugin.
  - List exempt usernames, runtime class names and namespaces.
  - Make sure ordinary users and service accounts that create workloads are not exempt.
  - Read the default enforce level of the cluster.
  - Create a violating pod in an exempt namespace in a test cluster.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep admission-control-config-file; cat <admission-config.yaml>
  expected: Exemptions are few and have an owner. No user who creates workloads is exempt, and the default level is baseline or restricted.
  severity: High
  test_type: Config Review
  refs:
