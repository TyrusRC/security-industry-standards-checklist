- id: K8S-POL-008
  sheet: K8S
  category: POL
  title: Check control plane and storage isolation between tenants
  objective: Finds shared resources through which one tenant can reach or harm another.
  steps:
  - List the tenants and the namespaces or virtual control planes of each.
  - Check that RBAC limits each tenant to its own namespaces and that quotas bound object counts.
  - Check the StorageClass of each tenant and the reclaim policy of shared classes.
  - Check shared services such as DNS, logging and the kubelet for tenant access.
  - Decide if the tenants are trusted or hostile and check that the isolation level fits.
  example: kubectl get sc -o custom-columns=NAME:.metadata.name,RECLAIM:.reclaimPolicy; kubectl get resourcequota -A
  expected: Tenants have separate namespaces, rights and quotas. Shared storage classes use the Delete reclaim policy, and hostile tenants have sandboxes or separate clusters.
  severity: High
  test_type: Config Review
