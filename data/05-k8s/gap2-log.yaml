- id: K8S-LOG-008
  sheet: K8S
  category: LOG
  title: Check audit log retention, rotation and access on the API server
  objective: Finds audit logs that expire too fast or that many users can read.
  steps:
  - Read the audit log path, maximum age, maximum backups and maximum size flags.
  - Compare the retention to the policy and to the time needed for investigations.
  - Read the mode and owner of the audit log files and of the audit policy.
  - Check if audit events also go to a webhook backend or to a remote store.
  example: kubectl -n kube-system get pod -l component=kube-apiserver -o yaml | grep audit; ls -l /var/log/kubernetes/audit
  expected: Audit logs are kept for at least 30 days or the policy time. Rotation is set, and only administrators and the log agent can read the files.
  severity: Medium
  test_type: Config Review
