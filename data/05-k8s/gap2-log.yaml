- id: K8S-LOG-011
  sheet: K8S
  category: LOG
  title: Check automatic response and intrusion detection for compromised pods
  objective: Finds clusters that detect an attack but do not limit it.
  preconditions:
  - Do not run on production.
  steps:
  - Find the intrusion detection or runtime tool and the response rules.
  - Check the rule for a pod IP listed as the source of a pod creation request.
  - In a test namespace, trigger a rule and watch the response, such as eviction of the pod.
  - Check that a clean pod starts from the original image after the response.
  - Check who reviews each automatic response.
  example: falco -r rules.yaml; kubectl get events -A --field-selector reason=Evicted
  expected: Rules for suspect pods exist and work. The response limits the damage, a clean pod replaces the old one, and logs stay available for review.
  severity: Low
  test_type: Config Review
  refs:
    k8s_top10:
    - K10
