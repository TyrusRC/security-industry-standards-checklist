- id: K8S-LOG-010
  sheet: K8S
  category: LOG
  title: Check alerts for anonymous requests, new mounts, root pods and new CronJobs
  objective: Finds attack steps that no alert rule detects.
  preconditions:
  - Do not run on production.
  steps:
  - Read the alert rules of the monitoring system.
  - Make an anonymous request to the API in a test cluster.
  - Create a test pod that runs as root with a hostPath mount and create a test CronJob.
  - Check that each action creates an alert and that the alert reaches an owner.
  - Check for alerts on low disk space and on a log service that is down.
  example: kubectl --as=system:anonymous get pods -n default; kubectl apply -f root-hostpath-pod.yaml
  expected: Anonymous requests, risky volume mounts, root pods and new CronJobs raise alerts. Alerts also cover low disk space and log service failure.
  severity: Medium
  test_type: Config Review
