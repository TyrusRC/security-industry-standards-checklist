- id: K8S-LOG-009
  sheet: K8S
  category: LOG
  title: Check that logs cover all layers of the environment
  objective: Finds layers with no logs, so that incident responders cannot follow an attack.
  steps:
  - 'List the log sources: hosts, applications, containers, container engine, registry, API server and cloud.'
  - Find sources that do not send logs to the central service.
  - Check that the node agent runs on each node, for example as a DaemonSet.
  - Check that kubelet and runtime logs go to journald or syslog and then to the central store.
  example: kubectl get ds -A | grep -Ei "fluent|vector|promtail|filebeat"; journalctl -u kubelet --since "1 hour ago" | head
  expected: Every layer sends logs to one central service. The logging agent runs on every node.
  severity: Medium
  test_type: Config Review
  refs:
    k8s_top10:
    - K10
    cloud_native_top10:
    - CNAS-10
    cwe:
    - CWE-778
    nist_800_53:
    - AU-2
