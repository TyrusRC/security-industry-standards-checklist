- id: K8S-DKR-001
  sheet: K8S
  category: DKR
  title: Check that the Docker daemon socket is not exposed
  objective: Finds hosts and containers where access to the Docker API gives root on the host.
  steps:
  - Check if the daemon listens on a TCP port.
  - Check the permissions and group members of /var/run/docker.sock.
  - List containers that mount the socket, also with a read-only flag.
  - Check if remote API access uses TLS and client certificates.
  example: ss -tlnp | grep dockerd; ls -l /var/run/docker.sock; docker ps -q | xargs docker inspect --format "{{.Name}} {{.Mounts}}" | grep docker.sock
  expected: The daemon does not listen on unencrypted TCP. No container mounts the socket. Access to the socket is limited to named admins.
  severity: Critical
  test_type: Config Review
  refs:
    k8s_top10:
    - K01
    cloud_native_top10:
    - CNAS-1
    cheatsheet:
