- id: K8S-DKR-002
  sheet: K8S
  category: DKR
  title: Check that Docker hosts use rootless mode or user namespace remapping
  objective: Finds daemons and containers where root in the container is root on the host.
  steps:
  - Check if the daemon runs in rootless mode.
  - If not, read the userns-remap setting.
  - Run id inside a container and compare it to the host user.
  - Check the limits of rootless mode for the workload.
  example: docker info --format "{{.SecurityOptions}}"; cat /etc/docker/daemon.json; docker run --rm alpine id
  expected: The daemon runs rootless or with user namespace remapping, and container root maps to an unprivileged host user.
  severity: Medium
  test_type: Config Review
