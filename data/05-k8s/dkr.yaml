- id: K8S-DKR-006
  sheet: K8S
  category: DKR
  title: Check the Docker daemon log level and host benchmark results
  objective: Finds Docker hosts with debug logging or other weak daemon settings.
  steps:
  - Read the log-level setting in daemon.json and the dockerd command line.
  - Run a Docker host benchmark tool.
  - List failed checks.
  - Fix or record each failed check.
  example: cat /etc/docker/daemon.json; ps aux | grep "[d]ockerd"; docker-bench-security
  expected: The daemon log level is info unless debug is needed for a short time. Failed benchmark checks are fixed or recorded with an owner.
  severity: Low
  test_type: Config Review
  refs:
    k8s_top10:
    - K07
    cloud_native_top10:
