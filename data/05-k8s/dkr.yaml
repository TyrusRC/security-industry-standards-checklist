- id: K8S-DKR-005
  sheet: K8S
  category: DKR
  title: Check Docker secrets and build-time secret handling
  objective: Finds secrets in image layers, build arguments and container environments.
  steps:
  - Search Dockerfiles for ARG, ENV or COPY that handle credentials.
  - Run docker history on each image.
  - Check if builds use BuildKit secret mounts.
  - Check that runtime secrets use Docker secrets or an external store.
  example: docker history --no-trunc <image>; grep -nE "ARG|ENV" Dockerfile | grep -iE "pass|token|key|secret"; docker build --secret id=mysecret,src=./secret.txt .
  expected: Images hold no secrets in layers, ARG or ENV. Builds use secret mounts and runtime secrets come from a managed store.
  severity: High
  test_type: Config Review
  refs:
    k8s_top10:
    - K03
