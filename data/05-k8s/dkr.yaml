- id: K8S-DKR-003
  sheet: K8S
  category: DKR
  title: Check published ports, firewall rules and container connectivity
  objective: Finds container ports open on all interfaces and containers that talk to each other with no limit.
  steps:
  - List published ports for each container.
  - Find ports bound to 0.0.0.0 that need only local access.
  - Check the host firewall for rules that the container runtime bypasses.
  - List the Docker networks and the containers on each.
  example: docker ps --format "{{.Names}} {{.Ports}}"; docker network ls; docker network inspect bridge; iptables -S DOCKER-USER
  expected: Ports bind to 127.0.0.1 unless public use is needed. Containers share a user-defined network only when they must talk to each other.
  severity: Medium
  test_type: Config Review
  refs:
