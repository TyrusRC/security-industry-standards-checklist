- id: CICD-PBAC-004
  sheet: CICD
  category: PBAC
  title: Check the OS rights of the job and the container
  objective: Finds jobs that run as root, in privileged containers or with access to the Docker socket.
  preconditions:
  - Read access to a test runner and its configuration.
  steps:
  - Read the runner service account and its OS permissions.
  - Look for the privileged flag, host mounts and added capabilities in job containers.
  - Look for a mount of the Docker socket in the job.
  - Make sure jobs run as a non-root user.
  example: ps -o user= -C Runner.Listener; grep -rnE 'privileged|docker.sock|cap_add|--cap-add' .github/ docker-compose*.yml; docker inspect --format '{{.HostConfig.Privileged}}' CONTAINER
  expected: Jobs run as an unprivileged user. Job containers are not privileged and have no Docker socket or broad host mount.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-5
    - CICD-SEC-7
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Docker_Security_Cheat_Sheet
    cwe:
    - CWE-250
    attack:
    - T1525
    nist_800_53:
    - AC-6
    - CM-6
