  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/CI_CD_Security_Cheat_Sheet.md
- id: CICD-PBAC-003
  sheet: CICD
  category: PBAC
  title: Check runner isolation and clean state after each job
  objective: Finds shared build nodes that keep files, caches or credentials between jobs.
  preconditions:
  - Use a test runner. Do not run on production runners.
  steps:
  - List the runners and the pipelines that use each one.
  - Make sure pipelines with different sensitivity do not share a node.
  - Make sure each job runs on an ephemeral node or a clean container.
  - Run two jobs one after the other on a test runner and look for left-over files.
  example: 'gh api repos/ORG/REPO/actions/runners --jq ''.runners[]|{name,labels}''; ls -la "$RUNNER_TEMP" ~/.cache  # in a test job'
  expected: Nodes are ephemeral or reset after each job. Pipelines with different sensitivity never share a node, cache or workspace.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-5
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-284
    capec:
    - CAPEC-678
    attack:
    - T1195.002
    other:
    - SSDF PO.5.1
