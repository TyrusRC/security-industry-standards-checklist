- id: CICD-PBAC-005
  sheet: CICD
  category: PBAC
  title: Test outbound network access from build nodes
  objective: Finds build nodes that can send data to any host on the internet.
  preconditions:
  - Use a test job without secrets.
  steps:
  - Read the egress rules for the build network.
  - Start a test job that connects to a harmless external host that is not on the allowlist.
  - Look at the result of the connection.
  - Make sure the allowlist holds only the registries and services that the build needs.
  example: 'curl -sS -m 5 -o /dev/null -w ''%{http_code}\n'' https://example.org  # in a test job'
  expected: Build nodes can reach only allowlisted hosts. The test connection to an unlisted host fails and the event is logged.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-5
    cheatsheet:
