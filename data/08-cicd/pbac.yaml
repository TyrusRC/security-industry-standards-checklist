- id: CICD-PBAC-002
  sheet: CICD
  category: PBAC
  title: Check the default permissions of the job token
  objective: Finds pipeline tokens that have write access to code or packages by default.
  preconditions:
  - Read access to the repository settings.
  steps:
  - Read the default token permission of the organization and the repository.
  - Make sure the default is read-only.
  - Look at each workflow for a permissions block.
  - Make sure each write permission is granted only to the job that needs it.
  example: gh api repos/ORG/REPO/actions/permissions/workflow; zizmor .github/workflows/ ; grep -rn 'permissions:' -A4 .github/workflows
  expected: The default token is read-only. Each job lists the exact permissions it needs. Write access is granted per job.
  severity: High
  test_type:
  - Config Review
  - Automated
  refs:
    cicd_top10:
    - CICD-SEC-5
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-250
    - CWE-269
    attack:
    - T1528
    nist_800_53:
    - AC-6
  sources_read:
