- id: CICD-PBAC-007
  sheet: CICD
  category: PBAC
  title: Check what controller access pipeline jobs have
  objective: Finds jobs that can read other jobs, run on the CI controller or change CI settings.
  preconditions:
  - Use a test job.
  steps:
  - Make sure no job runs on the CI controller node.
  - Read the permissions of the job identity on the CI platform.
  - From a test job, try to list other projects, credentials and nodes.
  - Make sure the request fails.
  example: 'curl -s -u JOBTOKEN: https://JENKINS/api/json?tree=jobs[name]; gh api repos/OTHER_ORG/OTHER_REPO/actions/secrets  # with the job token'
  expected: Jobs run on separate nodes. The job identity cannot list other projects, read stored credentials or change CI settings.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-5
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-269
    attack:
    - T1072
    nist_800_53:
    - AC-6
  sources_read:
