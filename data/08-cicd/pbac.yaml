- id: CICD-PBAC-001
  sheet: CICD
  category: PBAC
  title: Check that secrets are scoped to the pipeline, step and environment
  objective: Finds secrets that every pipeline or every branch can read.
  preconditions:
  - Admin read access to the CI settings.
  steps:
  - List the secrets at organization, repository and environment level.
  - Find secrets that all repositories or all branches can read.
  - Compare each secret with the pipelines that use it.
  - Make sure production secrets are only in protected environments.
  example: gh api orgs/ORG/actions/secrets --jq '.secrets[]|{name,visibility}'; gh api repos/ORG/REPO/environments --jq '.environments[].name'; glab api projects/ID/variables
  expected: Each secret is available only to the pipelines and steps that need it. Production secrets need a protected branch or environment.
  severity: High
  test_type: &id001
  - Manual
  - Config Review
  refs:
    cicd_top10:
    - CICD-SEC-5
    - CICD-SEC-6
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Secrets_Management_Cheat_Sheet
    cwe:
    - CWE-269
    - CWE-522
    attack:
    - T1552.001
    nist_800_53:
    - AC-6
    other:
    - SSDF PS.1.1
  sources_read:
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-05-Insufficient-PBAC.md
