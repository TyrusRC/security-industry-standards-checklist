- id: CICD-PBAC-008
  sheet: CICD
  category: PBAC
  title: Check that third-party build steps run in a scoped context
  objective: Finds third-party actions, plugins and scripts that run with the full rights of the job.
  preconditions:
  - Use a test branch.
  steps:
  - List the third-party actions, plugins, orbs and downloaded scripts that jobs use.
  - Find the jobs where they run together with secrets or write tokens.
  - Move the step to a job without secrets on a test branch.
  - Make sure the step still works with its limited rights.
  example: 'grep -rnE ''uses: [^./]'' .github/workflows | grep -v ''@[0-9a-f]\{40\}''; zizmor .github/workflows/'
  expected: Third-party steps run in jobs with minimal secrets, a read-only token and limited egress. They do not share a job with deploy credentials.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-5
    - CICD-SEC-8
    cheatsheet:
