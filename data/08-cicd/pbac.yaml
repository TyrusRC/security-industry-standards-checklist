- id: CICD-PBAC-006
  sheet: CICD
  category: PBAC
  title: Check network segmentation and metadata service access from jobs
  objective: Finds jobs that can reach internal systems or the cloud instance identity service.
  preconditions:
  - Use a test job. Do not run on production runners.
  steps:
  - List the internal networks and services that the runner network can reach.
  - Compare the list with the resources the pipelines need.
  - From a test job, try to reach the cloud metadata address and an unrelated internal host.
  - Make sure the instance metadata service needs a session token or is blocked.
  example: 'curl -sS -m 3 -o /dev/null -w ''%{http_code}\n'' http://169.254.169.254/latest/meta-data/  # in a test job; nmap -Pn -p 22,443 INTERNAL_HOST'
  expected: Runners reach only the systems that the pipelines need. Jobs cannot read the metadata service without a protected session token.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-5
    - CICD-SEC-7
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-284
    attack:
    - T1552.005
    nist_800_53:
    - SC-7
