- id: CICD-IAM-001
  sheet: CICD
  category: IAM
  title: Review identities and permissions across the CI/CD systems
  objective: Finds overly permissive human and programmatic identities in the SCM, CI and registries.
  preconditions:
  - Admin read access to the SCM, CI and artifact registry.
  steps:
  - List all human and programmatic identities in the SCM, CI, registry and deployment tools.
  - Record the identity provider and the permission level of each identity.
  - Compare the granted permissions with the permissions in use.
  - Find identities with organization-wide write or admin rights.
  - Create a ticket to remove unused permissions.
  example: legitify analyze --namespace ORG; gh api orgs/ORG/members --jq '.[].login'; gh api orgs/ORG/outside_collaborators
  expected: Every identity is mapped to an owner and an identity provider. Each identity holds only the permissions it uses, on the repositories it needs.
  severity: High
  test_type: &id001
  - Manual
  - Config Review
  refs:
    cicd_top10:
    - CICD-SEC-2
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-269
    - CWE-250
    attack:
    - T1078
    nist_800_53:
    - AC-2
    - AC-6
    other:
    - SSDF PS.1.1
  sources_read:
