- id: CICD-IAM-002
  sheet: CICD
  category: IAM
  title: Find stale human and service accounts and tokens
  objective: Finds unused accounts and tokens that still give access to CI/CD systems.
  preconditions:
  - Admin read access to the SCM, CI and artifact registry.
  steps:
  - Get the policy period after which an inactive identity must be disabled.
  - List the last activity date of each user, service account and token.
  - Find identities that exceed the period.
  - Make sure former employees and contractors have no active account in any CI/CD system.
  example: gh api orgs/ORG/audit-log?phrase=actor:USER; gh api /orgs/ORG/personal-access-tokens --jq '.[]|{owner:.owner.login,last_used:.token_last_used_at}'
  expected: A defined inactivity period exists. No identity exceeds it. Accounts of people who left are removed from all CI/CD systems.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-2
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-269
    attack:
    - T1078
    nist_800_53:
    - AC-2
  sources_read:
