- id: CICD-IAM-004
  sheet: CICD
  category: IAM
  title: Make sure self-registration and base permissions are off
  objective: Finds CI/CD platforms where anyone with a valid email can register and get access.
  preconditions:
  - Do not run on production. Use a test instance or get written approval.
  steps:
  - Open the sign-up page of the self-managed SCM or CI from an unauthenticated browser.
  - Try to start a registration with an address from the company domain, on a test system.
  - Read the default permission level for new users and for large groups.
  - Make sure the default permission is none.
  example: curl -sI https://git.example.org/users/sign_up; glab api application/settings | jq '.signup_enabled,.default_project_creation'
  expected: Self-registration is off or needs admin approval. New users and large groups start with no permission.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-2
    cheatsheet:
