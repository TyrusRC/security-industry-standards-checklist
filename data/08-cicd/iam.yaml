- id: CICD-IAM-006
  sheet: CICD
  category: IAM
  title: Review external collaborators and their access expiry
  objective: Finds external collaborators with permanent or excessive access to repositories and pipelines.
  preconditions:
  - Admin read access to the SCM, CI and artifact registry.
  steps:
  - List external collaborators and outside contractors on all CI/CD systems.
  - Look at the permission level and the repositories of each one.
  - Make sure each access has an expiry date and an internal sponsor.
  - Make sure access ends when the work is done.
  example: gh api orgs/ORG/outside_collaborators --paginate; gh api repos/ORG/REPO/invitations
  expected: External collaborators have least privilege on named repositories only. Each access has an expiry date and an internal owner.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
