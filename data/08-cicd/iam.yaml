- id: CICD-IAM-008
  sheet: CICD
  category: IAM
  title: Check package publishing accounts for 2FA and trusted publishing
  objective: Finds package publishing accounts and tokens that an attacker can use to push malicious versions.
  preconditions:
  - Account access to the package registry.
  steps:
  - List the accounts and tokens that can publish packages for your organization.
  - Make sure 2FA is on for each publisher account.
  - Make sure CI publishing uses trusted publishing with OIDC where the registry supports it.
  - Make sure remaining tokens are granular, short-lived and not committed.
  example: npm token list; npm profile get; npm access list collaborators PACKAGE
  expected: Publishing needs 2FA or trusted publishing. Tokens are granular, scoped to named packages and expire soon.
  severity: High
  test_type: *id001
