- id: CICD-IAM-007
  sheet: CICD
  category: IAM
  title: Check for shared accounts and shared service credentials
  objective: Finds accounts or credentials that several people or systems share.
  preconditions:
  - Admin read access to the SCM, CI and artifact registry.
  steps:
  - List service accounts and the systems that use each one.
  - Find accounts that more than one person or more than one pipeline uses.
  - Look at the audit log for one account that logs in from several locations.
  - Make sure each context has its own account with its own permissions.
  example: gh api orgs/ORG/audit-log --jq '.[]|select(.actor=="SERVICE_ACCOUNT")|.actor_ip' | sort -u
  expected: Each person and each pipeline context has its own identity. No credential is shared between people, between systems, or between people and systems.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-2
    - CICD-SEC-6
