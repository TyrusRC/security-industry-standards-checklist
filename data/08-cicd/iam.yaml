- id: CICD-IAM-003
  sheet: CICD
  category: IAM
  title: Check central IdP login, no local accounts and enforced MFA
  objective: Finds local accounts and logins without MFA on CI/CD platforms.
  preconditions:
  - Admin read access to the SCM, CI and artifact registry.
  steps:
  - Read the authentication settings of the SCM, CI and registry.
  - Make sure login uses the central IdP with SSO.
  - List local accounts that do not use the IdP.
  - Make sure MFA is required for all users and for admins.
  example: gh api orgs/ORG --jq .two_factor_requirement_enabled; gh api orgs/ORG/members?filter=2fa_disabled; curl -s https://JENKINS/securityRealm/
  expected: All users log in through the central IdP with MFA. Local accounts do not exist, or each one is documented and disabled when unused.
  severity: High
  test_type:
  - Config Review
  - Automated
  refs:
    cicd_top10:
    - CICD-SEC-2
    cheatsheet:
