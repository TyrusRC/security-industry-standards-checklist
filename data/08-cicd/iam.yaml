- id: CICD-IAM-005
  sheet: CICD
  category: IAM
  title: Check that only organization email domains are allowed
  objective: Finds accounts that use personal or external email addresses on CI/CD platforms.
  preconditions:
  - Admin read access to the SCM, CI and artifact registry.
  steps:
  - List the email address of each user in the SCM, CI and registry.
  - Find addresses outside domains that the organization owns.
  - Check for a domain restriction in the platform settings.
  - Make sure each non-organization account has a documented reason and an owner.
  example: gh api orgs/ORG/members --paginate --jq '.[].login' | xargs -I{} gh api users/{} --jq '.email'; glab api application/settings | jq .domain_allowlist
  expected: Only addresses from domains that the organization manages can hold accounts. Exceptions are documented and reviewed.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-2
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-284
