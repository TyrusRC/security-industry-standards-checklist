- id: CICD-VULN-001
  sheet: CICD
  category: VULN
  title: Check the dependency vulnerability scan gate in the pipeline
  objective: Finds pipelines that build and ship components with known vulnerabilities without a gate.
  preconditions:
  - Use a test branch.
  steps:
  - Find the SCA or vulnerability scan step in the pipeline.
  - Make sure it scans direct and transitive dependencies.
  - Make sure the step fails the build above the defined severity.
  - Add a known vulnerable test dependency on a test branch and run the pipeline.
  example: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .; grype dir:. --fail-on high; osv-scanner -r .
  expected: The pipeline scans all dependencies on every build. The build fails when a finding exceeds the allowed severity.
  severity: High
  test_type: &id001
  - Config Review
  - Automated
  refs:
    owasp_top10:
    - A03:2025
    cheatsheet:
    - Vulnerable_Dependency_Management_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    - NPM_Security_Cheat_Sheet
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-1395
    nist_800_53:
    - RA-5
    other:
    - SSDF PW.4.4
    - SSDF RV.1.1
  sources_read:
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.md
