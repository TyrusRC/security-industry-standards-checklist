  - sources/repos/CheatSheetSeries/cheatsheets/NPM_Security_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/CI_CD_Security_Cheat_Sheet.md
  - sources/nist_ssdf/ssdf.txt
  see:
  - WEB-DEP-001
  - WEB-DEP-003
- id: CICD-VULN-002
  sheet: CICD
  category: VULN
  title: Check scanning of the final build output and container images
  objective: Finds images and binaries that contain vulnerable or unauthorized components after the build.
  preconditions:
  - Read access to the artifact registry.
  steps:
  - Find the image or binary that the pipeline publishes.
  - Scan the final output, not only the source.
  - Make sure the scan covers OS packages and bundled libraries.
  - Lint the Dockerfile for a USER directive and pinned base images.
  example: trivy image --severity HIGH,CRITICAL IMAGE@sha256:DIGEST; grype IMAGE@sha256:DIGEST; hadolint Dockerfile
  expected: The pipeline scans the final image or binary before release. Findings above the limit block the release.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A03:2025
    cheatsheet:
    - Docker_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-1395
    nist_800_53:
    - RA-5
    other:
    - SSDF PW.4.4
  sources_read:
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
