- id: CICD-VULN-004
  sheet: CICD
  category: VULN
  title: Review temporary mitigations and virtual patches for vulnerable components
  objective: Finds vulnerabilities that stay open behind a mitigation that nobody tests or removes.
  preconditions:
  - Do not run bypass tests on production.
  steps:
  - List the vulnerable components that have a temporary mitigation, wrapper or virtual patch.
  - Make sure each one links to a CVE, an owner and an end date.
  - Test the mitigation with alternate inputs on a test system.
  - Make sure the scanner suppression covers only that CVE.
  example: grep -rn 'ignore\|suppress' .trivyignore .grype.yaml dependency-check-suppressions.xml; git log --since=180.days -- .trivyignore
  expected: Each mitigation has a CVE, an owner and an end date. Tests show it blocks alternate inputs. A suppression covers only its CVE.
  severity: Medium
  test_type: *id002
  refs:
    owasp_top10:
    - A03:2025
    cheatsheet:
    - Virtual_Patching_Cheat_Sheet
    - Vulnerable_Dependency_Management_Cheat_Sheet
    cwe:
    - CWE-1395
    - CWE-1329
    other:
    - SSDF RV.2.2
  sources_read:
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Virtual_Patching_Cheat_Sheet.md
