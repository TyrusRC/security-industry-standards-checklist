- id: CICD-VULN-003
  sheet: CICD
  category: VULN
  title: Check ongoing monitoring of deployed releases for new advisories
  objective: Finds released software that nobody re-checks when a new advisory appears.
  preconditions:
  - Read access to the SBOM store.
  steps:
  - Find where the release SBOMs are stored and how they map to deployed systems.
  - Make sure a job scans these SBOMs again on a schedule.
  - Look for alert subscriptions to advisory sources for the components in use.
  - Check that a new finding creates a ticket with an owner.
  example: 'grype sbom:sbom.cdx.json --fail-on high; osv-scanner --sbom=sbom.cdx.json; dependency-track API: GET /api/v1/finding/project/UUID'
  expected: Deployed releases are re-checked against advisories on a schedule. New findings create a ticket with an owner and a due date.
  severity: Medium
  test_type: &id002
  - Manual
  - Config Review
  refs:
    owasp_top10:
    - A03:2025
    cheatsheet:
    - Dependency_Graph_SBOM_Cheat_Sheet
    - Vulnerable_Dependency_Management_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-1395
    - CWE-1104
    nist_800_53:
    - RA-5
    other:
    - SSDF RV.1.1
  sources_read:
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
