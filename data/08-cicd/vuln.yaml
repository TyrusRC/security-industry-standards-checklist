- id: CICD-VULN-005
  sheet: CICD
  category: VULN
  title: Check that the pipeline scans infrastructure as code
  objective: Finds infrastructure code that reaches production without a misconfiguration scan.
  preconditions:
  - Read access to the IaC repository.
  steps:
  - Find the IaC repositories and the pipeline steps that apply them.
  - Make sure a static IaC scan runs on each pull request.
  - Make sure the scan fails the change above the defined severity.
  - Make sure IaC changes follow the same review rules as application code.
  example: trivy config --severity HIGH,CRITICAL --exit-code 1 .; checkov -d . --quiet; tflint
  expected: A static IaC scan runs on every change and blocks serious findings. IaC changes need pull request review.
  severity: Medium
  test_type: *id001
  refs:
    owasp_top10:
    - A03:2025
    cheatsheet:
    - Infrastructure_as_Code_Security_Cheat_Sheet
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-1188
    nist_800_53:
    - CM-6
    - SA-15
    other:
    - SSDF PW.7.1
  sources_read:
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.md
