- id: CICD-VULN-006
  sheet: CICD
  category: VULN
  title: Check static code analysis and secret scan steps in the pipeline
  objective: Finds pipelines that build custom code without any automated code analysis.
  preconditions:
  - Read access to the repository.
  steps:
  - Find the SAST and secret scan steps in the pipeline.
  - Make sure they run on every pull request and on the default branch.
  - Make sure the findings block the merge above the defined severity.
  - Make sure the rules and tools are updated on a schedule.
  example: semgrep scan --config auto --error --severity ERROR .; gitleaks detect --redact
  expected: Static analysis and secret scan run on each pull request. Serious findings block the merge. Rules are kept current.
  severity: Medium
  test_type: *id001
  refs:
    owasp_top10:
    - A03:2025
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
