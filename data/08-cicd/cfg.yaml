- id: CICD-CFG-011
  sheet: CICD
  category: CFG
  title: Test restore of the source code repositories from backup
  objective: Finds repositories that cannot be restored after loss or destruction.
  preconditions:
  - Restore into a test location only.
  steps:
  - Find the backup plan for the SCM and the artifact registry.
  - Restore one repository into a test location.
  - Compare the restored refs and commit hashes with the source.
  - Make sure backup access is limited and logged.
  example: git clone --mirror https://git.example.org/ORG/REPO.git && git -C REPO.git fsck --full; git ls-remote ORIGIN | sha256sum
  expected: A backup exists and restores into a complete copy with the same commit hashes. Access to backups is limited.
  severity: Low
  test_type: *id002
  refs:
    cheatsheet:
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-693
    nist_800_53:
    - CP-9
  sources_read:
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.md
