- id: CICD-CFG-010
  sheet: CICD
  category: CFG
  title: Check that infrastructure code is the only way to change infrastructure
  objective: Finds infrastructure that people change by hand and that no review covers.
  preconditions:
  - Read access to the cloud account.
  steps:
  - Find the repository for each infrastructure area.
  - Make sure changes need a pull request and review.
  - Look for resources without code or tags.
  - Make sure immutable deployment replaces changed resources.
  example: terraform plan -detailed-exitcode; aws resourcegroupstaggingapi get-resources --query 'ResourceTagMappingList[?Tags==`[]`].ResourceARN'
  expected: All infrastructure comes from reviewed code. Untagged or unmanaged resources are found and removed or adopted.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-1
    - CICD-SEC-7
    cheatsheet:
    - Infrastructure_as_Code_Security_Cheat_Sheet
    cwe:
    - CWE-1269
    nist_800_53:
    - CM-2
    - CM-3
  sources_read:
