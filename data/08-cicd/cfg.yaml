- id: CICD-CFG-002
  sheet: CICD
  category: CFG
  title: Check network exposure and transport security of CI/CD systems
  objective: Finds CI/CD systems open to the internet or using weak transport between systems.
  preconditions:
  - Get written approval before scanning.
  steps:
  - Scan the CI/CD host addresses from outside the corporate network, with approval.
  - Make sure management interfaces are not exposed.
  - Check the TLS version between the SCM and the CI system.
  - Make sure access is limited by IP or VPN where possible.
  example: nmap -Pn -p 22,80,443,8080,50000 CI_HOST; testssl.sh --protocols CI_HOST:443
  expected: CI/CD systems are not open to the internet without need. Connections use TLS 1.2 or higher. Access is limited by network rules.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-7
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-284
    nist_800_53:
    - SC-7
    - SC-8
  sources_read:
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-07-Insecure-System-Configuration.md
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/CI_CD_Security_Cheat_Sheet.md
- id: CICD-CFG-003
  sheet: CICD
  category: CFG
  title: Review CI/CD settings against hardening guides and default values
  objective: Finds platform settings that stay at an insecure default.
  preconditions:
  - Admin read access to the platforms.
  steps:
  - Get the hardening baseline, such as the CIS Benchmark, for each platform.
  - Read the security settings of each platform.
  - Find default accounts, default passwords and open defaults.
  - Document and fix each difference.
  example: legitify analyze --namespace ORG; gh api orgs/ORG --jq '{two_factor_requirement_enabled,default_repository_permission,members_can_create_public_repositories}'
  expected: No default account or default password exists. Settings match the baseline. Each exception has an owner and a reason.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-7
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-1188
    - CWE-1269
