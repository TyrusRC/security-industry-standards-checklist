- id: CICD-CFG-008
  sheet: CICD
  category: CFG
  title: Check hardening of developer workstations and IDE extensions
  objective: Finds developer machines and extensions that can steal credentials or inject code.
  preconditions:
  - Get approval before you read endpoint data.
  steps:
  - 'Read the endpoint policy for developer machines: patches, MFA and monitoring.'
  - List the IDE extensions that developers use.
  - Make sure extensions come from an approved list.
  - Make sure a restricted mode is the default for unknown projects.
  example: 'code --list-extensions --show-versions; osquery: SELECT name,version FROM vscode_extensions;'
  expected: Developer machines are patched and monitored. Only approved IDE extensions are installed. Unknown projects open in restricted mode.
  severity: Medium
  test_type: *id001
