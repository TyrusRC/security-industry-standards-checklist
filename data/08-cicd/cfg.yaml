- id: CICD-CFG-006
  sheet: CICD
  category: CFG
  title: Check repository fork and visibility restrictions
  objective: Finds repositories that users can fork out or make public by mistake.
  preconditions:
  - Admin read access to the SCM organization.
  steps:
  - Read the organization settings for forking private repositories.
  - Read who may change repository visibility to public.
  - List private repositories that have forks.
  - Make sure these actions are limited to a small group.
  example: gh api orgs/ORG --jq '{members_can_fork_private_repositories,members_can_create_public_repositories}'; gh api repos/ORG/REPO/forks --jq 'length'
  expected: Users cannot fork private repositories or change visibility to public without approval.
  severity: Medium
  test_type:
  - Config Review
  - Automated
  refs:
    cicd_top10:
    - CICD-SEC-7
    - CICD-SEC-2
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-284
