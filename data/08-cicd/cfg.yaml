- id: CICD-CFG-004
  sheet: CICD
  category: CFG
  title: Check debug and shell access to execution nodes
  objective: Finds users who can open a shell on a build node and read secrets from memory.
  preconditions:
  - Read access to the runner hosts.
  steps:
  - List the users with SSH, debug or console access to runners.
  - Check for CI features that open a session in a running job.
  - Make sure access is limited, approved and logged.
  - Make sure such access is not on nodes that hold production secrets.
  example: 'gh api repos/ORG/REPO/actions/runners; grep -E ''AllowUsers|AllowGroups'' /etc/ssh/sshd_config; last -n 20  # on the runner'
  expected: Only a small approved group can open a session on a build node. Access is logged. Nodes with production secrets have no debug access.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-7
    - CICD-SEC-5
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-250
    - CWE-269
    attack:
    - T1078
    nist_800_53:
    - AC-6
    - AU-12
