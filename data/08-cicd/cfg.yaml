- id: CICD-CFG-001
  sheet: CICD
  category: CFG
  title: Check the inventory, owners and patch level of CI/CD systems
  objective: Finds unknown or outdated CI/CD servers, runners and plugins.
  preconditions:
  - Network scan only with written approval.
  steps:
  - List all SCM, CI, registry and runner systems, including self-managed instances.
  - Record the owner and the version of each.
  - Compare each version with the vendor security advisories.
  - Include build tools and plugins in the check.
  example: curl -s https://JENKINS/pluginManager/api/json?depth=1 | jq '.plugins[]|{shortName,version}'; trivy image RUNNER_IMAGE; nmap -sV -p 80,443,8080 CIDR
  expected: Every CI/CD system has an owner and a version record. Systems and plugins have all available security patches, or access is restricted.
  severity: High
  test_type: &id001
  - Manual
  - Config Review
  refs:
    cicd_top10:
    - CICD-SEC-7
    - CICD-SEC-10
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-1104
    - CWE-1395
    attack:
    - T1072
    nist_800_53:
    - CM-8
    - RA-5
    other:
    - SSDF PO.3.2
  sources_read:
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-07-Insecure-System-Configuration.md
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-10-Insufficient-Logging-And-Visibility.md
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
