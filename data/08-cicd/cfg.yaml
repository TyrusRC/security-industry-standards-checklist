- id: CICD-CFG-009
  sheet: CICD
  category: CFG
  title: Check separation of development, build and production environments
  objective: Finds environments that share accounts, networks or data with production.
  preconditions:
  - Read access to the cloud and network settings.
  steps:
  - List the development, test, build and production environments.
  - Check for shared accounts, networks and credentials between them.
  - Make sure the build environment cannot be reached from developer workstations without control.
  - Make sure production data is not in lower environments.
  example: aws organizations list-accounts; kubectl config get-contexts; terraform state list | grep -i env
  expected: Each environment has its own accounts, network rules and credentials. Build systems are separate from production.
  severity: Medium
  test_type: *id001
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
