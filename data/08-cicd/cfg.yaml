- id: CICD-CFG-007
  sheet: CICD
  category: CFG
  title: Review change management for CI/CD settings
  objective: Finds changes to pipeline and platform settings that nobody tracks.
  preconditions:
  - Read access to the audit log.
  steps:
  - Read the change process for CI/CD settings, SBOM tools, registries and integrations.
  - Pick five recent setting changes from the audit log.
  - Find the approval and ticket for each change.
  - Make sure a review of all settings runs on a schedule.
  example: gh api orgs/ORG/audit-log?phrase=action:repo.update_actions_settings --paginate; gh api orgs/ORG/audit-log?phrase=action:org.update_actions_settings
  expected: Every setting change maps to an approved request. A scheduled review checks all security settings.
  severity: Medium
  test_type: &id002
  - Manual
  refs:
    cicd_top10:
    - CICD-SEC-7
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
