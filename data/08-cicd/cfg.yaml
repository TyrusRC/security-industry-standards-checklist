- id: CICD-CFG-005
  sheet: CICD
  category: CFG
  title: Check that self-hosted CI services run without host administrator rights
  objective: Finds CI services that run as root or administrator on the host.
  preconditions:
  - Read access to the CI hosts.
  steps:
  - Find the account that runs each CI controller and agent service.
  - Make sure it is not root or administrator.
  - Look at sudo rules and group memberships of this account.
  - Make sure the host is dedicated to the CI role.
  example: ps -o user,cmd -C java,Runner.Listener; sudo -l -U ci-runner; id ci-runner
  expected: CI services run as dedicated unprivileged accounts. The accounts have no general sudo rights.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-7
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
