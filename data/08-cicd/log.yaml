- id: CICD-LOG-002
  sheet: CICD
  category: LOG
  title: Check that audit logs are on for human and programmatic access
  objective: Finds systems that do not log logins, permission changes and token use.
  preconditions:
  - Admin read access. Use a harmless test change.
  steps:
  - For each CI/CD system, read the audit log settings.
  - Make sure logs cover user creation, login, permission changes and token creation.
  - Make sure logs cover access by apps, service accounts and tokens.
  - Run a test change and look for it in the log.
  example: gh api orgs/ORG/audit-log?per_page=5; curl -s https://JENKINS/manage/log/; glab api audit_events
  expected: Audit logging is on in each system. A test change appears in the log with the actor, time and source.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-10
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    - Secrets_Management_Cheat_Sheet
    cwe:
    - CWE-778
    attack:
    - T1078
    nist_800_53:
    - AU-2
    - AU-12
