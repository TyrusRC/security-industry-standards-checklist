- id: CICD-LOG-003
  sheet: CICD
  category: LOG
  title: Check that pipeline events go to a central log system
  objective: Finds push, build and upload events that stay in local systems where an attacker can erase them.
  preconditions:
  - Read access to the SIEM.
  steps:
  - 'List the events that matter: pushes, builds, artifact uploads, deployments.'
  - Find the log forwarder or export setting for each system.
  - Search the SIEM for a test push, build and upload.
  - Make sure events from different systems can be matched.
  example: 'gh api orgs/ORG/audit-log/streams; logger -p auth.info ''cicd-test''; SIEM search: source=ci AND repo=TEST'
  expected: Audit and application events of all CI/CD systems arrive in the central log system within the set delay.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-10
