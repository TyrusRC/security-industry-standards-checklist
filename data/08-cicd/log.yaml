- id: CICD-LOG-005
  sheet: CICD
  category: LOG
  title: Check log content, format and retention
  objective: Finds logs that hold secrets, cannot be parsed or are kept too short for an investigation.
  preconditions:
  - Handle exported logs as sensitive data.
  steps:
  - Read the log policy for CI/CD systems.
  - Make sure logs use a parsable format such as JSON or syslog.
  - Search logs for secrets and personal data.
  - Make sure the retention period fits investigation and legal needs.
  example: gitleaks detect --no-git -s exported-audit-log.json; jq . exported-audit-log.json | head
  expected: Logs are parsable, hold no secrets and are kept for the set period. Audit logs cannot be changed by pipeline users.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-10
    - CICD-SEC-6
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
