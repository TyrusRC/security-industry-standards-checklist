- id: CICD-LOG-006
  sheet: CICD
  category: LOG
  title: Check that secret manager requests trace back to the pipeline run
  objective: Finds secret reads that cannot be tied to the user, commit or job that caused them.
  preconditions:
  - Use a test secret.
  steps:
  - Run a test pipeline that reads one test secret.
  - Find the read event in the secret manager log.
  - Make sure the event holds the workflow identity, repository, branch or run.
  - Make sure unusual reads raise an alert.
  example: aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=GetSecretValue; vault audit list
  expected: Each secret read shows which pipeline run, commit or user caused it. Unusual reads raise an alert.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-10
    - CICD-SEC-6
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
    cwe:
    - CWE-778
    nist_800_53:
