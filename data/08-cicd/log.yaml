- id: CICD-LOG-007
  sheet: CICD
  category: LOG
  title: Check tamper evidence of build records
  objective: Finds build logs and records that an attacker with build access could change without trace.
  preconditions:
  - Use a test record.
  steps:
  - Find where build logs and records are stored.
  - List the accounts that can change or delete them.
  - Make sure a copy goes to write-once or separate storage.
  - Try to change a test record and look for the change event.
  example: aws s3api get-bucket-versioning --bucket LOGS; aws s3api get-object-lock-configuration --bucket LOGS
  expected: Build logs are tamper-evident. Pipeline users cannot change or delete them. Changes raise an event.
  severity: Medium
  test_type: *id001
