- id: CICD-LOG-001
  sheet: CICD
  category: LOG
  title: Build an inventory of all CI/CD systems and instances
  objective: Finds CI/CD systems that nobody monitors, such as self-managed servers run by one team.
  preconditions:
  - Get approval before network scans.
  steps:
  - List the SCM, CI, registry, package manager, CD and orchestration systems.
  - Search the network and cloud for additional instances of each.
  - Record the owner and the log status of each instance.
  - Add unknown instances to the inventory.
  example: nmap -p 8080,443 -sV --script http-title CIDR; aws ec2 describe-instances --filters Name=tag:role,Values=ci; shodan-style search of own domains
  expected: The inventory covers every CI/CD instance. Each has an owner and a log status.
  severity: Medium
  test_type: &id001
  - Manual
  - Config Review
  refs:
    cicd_top10:
    - CICD-SEC-10
    - CICD-SEC-7
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-778
    nist_800_53:
    - CM-8
  sources_read:
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-10-Insufficient-Logging-And-Visibility.md
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-07-Insecure-System-Configuration.md
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
