- id: CICD-LOG-004
  sheet: CICD
  category: LOG
  title: Test alerts for attacks on the CI/CD pipeline
  objective: Finds attacks on the pipeline that raise no alert.
  preconditions:
  - Use a test repository only. Do not run on production.
  steps:
  - List the alert rules for CI/CD, such as branch protection changes, new tokens and workflow file changes.
  - On a test repository, change a branch protection rule and create a test token.
  - Wait for the alert time and look for the alerts.
  - Add rules for the events that raised no alert.
  example: 'gh api -X DELETE repos/ORG/TEST/branches/main/protection  # test repository only; SIEM search for action:protected_branch.destroy'
  expected: Alerts exist for changes to protection rules, new tokens, new workflows, odd secret reads and odd outbound traffic. A test change raises an alert.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-10
    cheatsheet:
