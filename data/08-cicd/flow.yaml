- id: CICD-FLOW-008
  sheet: CICD
  category: FLOW
  title: Check direct write access to production outside the pipeline
  objective: Finds people and tools that can change production code or infrastructure without a pipeline run.
  preconditions:
  - Read access to cloud audit logs and IAM.
  steps:
  - List the roles with write access to production cloud accounts and clusters.
  - Look at the audit log for changes made outside the pipeline in the last 90 days.
  - Make sure a break-glass process with approval and logging exists for such access.
  - Make sure the process raises an alert when someone uses it.
  example: aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=UpdateFunctionCode; kubectl auth can-i --list --as=USER
  expected: Production changes come only from the pipeline identity. Direct access needs approval, is logged and raises an alert.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-1
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Infrastructure_as_Code_Security_Cheat_Sheet
    cwe:
    - CWE-284
    attack:
    - T1078
    nist_800_53:
    - AC-6
    - CM-5
