- id: CICD-FLOW-001
  sheet: CICD
  category: FLOW
  title: Check branch protection on every production branch
  objective: Finds production branches where one account can push or merge code without review.
  preconditions:
  - Read access to the SCM settings of the repository.
  steps:
  - List the branches that build, release or deploy to production.
  - Read the branch protection rules or rulesets for each branch.
  - Make sure pull requests and at least one approving review are required.
  - Make sure administrators and bots are not on a bypass list.
  - Make sure force pushes and branch deletion are blocked.
  example: gh api repos/ORG/REPO/branches/main/protection; gh api repos/ORG/REPO/rulesets; scorecard --repo=github.com/ORG/REPO --checks=Branch-Protection,Code-Review
  expected: Every production branch requires a reviewed pull request. No user, team or app can bypass the rule. Force pushes are blocked.
  severity: High
  test_type:
  - Config Review
  - Automated
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
    - CICD-SEC-1
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-284
    - CWE-693
    capec:
    - CAPEC-443
    attack:
    - T1195.002
    nist_800_53:
    - CM-3
    - CM-5
    other:
    - SSDF PS.1.1
  sources_read:
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-01-Insufficient-Flow-Control-Mechanisms.md
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
