- id: CICD-FLOW-002
  sheet: CICD
  category: FLOW
  title: Check that unreviewed pushers cannot trigger deployment pipelines
  objective: Finds accounts that may push unreviewed code and also start a deployment.
  preconditions:
  - Read access to the SCM and CI settings.
  steps:
  - List the users, teams and apps that may push to a protected branch without review.
  - List the users and apps that may start or approve the deployment pipelines of the same repository.
  - Compare the two lists.
  - Look at any account that appears in both lists.
  example: gh api repos/ORG/REPO/branches/main/protection/restrictions; gh api repos/ORG/REPO/collaborators --jq '.[]|{login,permissions}'
  expected: No account that may push unreviewed code can also trigger or approve a production deployment pipeline.
  severity: High
  test_type: &id001
  - Manual
  - Config Review
  refs:
    cicd_top10:
    - CICD-SEC-1
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-269
    nist_800_53:
    - AC-5
    - AC-6
  sources_read:
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-01-Insufficient-Flow-Control-Mechanisms.md
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/CI_CD_Security_Cheat_Sheet.md
- id: CICD-FLOW-003
  sheet: CICD
  category: FLOW
  title: Review auto-merge rules for bypass and third-party code
  objective: Finds auto-merge rules that can merge unreviewed code into a protected branch.
  preconditions:
  - Read access to the repository and CI configuration.
  steps:
  - List all auto-merge rules and bots in the SCM and the CI.
  - Read the code and conditions of each rule.
  - Check that the rule applies to the smallest possible set of files and users.
  - Make sure the rule does not import third-party code.
  - Make sure the rule cannot be bypassed with a crafted change.
  example: gh api repos/ORG/REPO --jq .allow_auto_merge; grep -rn 'auto-merge\|automerge\|dependabot' .github/
  expected: Auto-merge is off, or it applies to minimal contexts. The rule code is reviewed, has no third-party code and cannot be bypassed.
  severity: High
  test_type:
  - Code Review
  - Config Review
  refs:
    cicd_top10:
    - CICD-SEC-1
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-693
    attack:
    - T1195.002
  sources_read:
