- id: CICD-FLOW-009
  sheet: CICD
  category: FLOW
  title: Check staged rollout of new releases
  objective: Finds deployments that reach all systems at once, so one bad release hits everything.
  preconditions:
  - Read access to deployment configuration.
  steps:
  - Read the deployment configuration of one production service.
  - Make sure the release goes first to a canary or small group.
  - Make sure a health check or approval gates the next stage.
  - Make sure the pipeline can stop and roll back the release.
  example: kubectl rollout status deploy/NAME; argocd app get NAME; grep -rn 'canary\|strategy' deploy/
  expected: New releases roll out in stages with a gate between stages. The pipeline can stop and roll back a release.
  severity: Low
  test_type: *id001
  refs:
    cheatsheet:
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-1357
  sources_read:
  - sources/repos/Top10/2025/docs/en/A03_2025-Software_Supply_Chain_Failures.md
  - sources/repos/CheatSheetSeries/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.md
