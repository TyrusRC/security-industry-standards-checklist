- id: CICD-FLOW-007
  sheet: CICD
  category: FLOW
  title: Check separation of duties from code change to production
  objective: Finds paths where one person can write code and promote it to production alone.
  preconditions:
  - Read access to the SCM and CI settings.
  steps:
  - Draw the path from commit to production for one service.
  - Mark each step where a second person must approve.
  - Look for steps that one account can complete alone, such as self-approval or a direct deploy.
  - Make sure the author of a change cannot approve it.
  example: 'gh api repos/ORG/REPO/branches/main/protection --jq ''.required_pull_request_reviews''  # look at require_last_push_approval and dismiss_stale_reviews'
  expected: No single account can write code and promote it to production. Self-approval is blocked at each gate.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
