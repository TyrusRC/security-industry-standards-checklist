- id: CICD-FLOW-004
  sheet: CICD
  category: FLOW
  title: Check approval gates before production deployment
  objective: Finds production deployments that start without a second person approving them.
  preconditions:
  - Do not run on production. Use a test environment with the same settings.
  steps:
  - List the pipelines and jobs that deploy to production.
  - Read the environment or stage protection settings of each job.
  - Make sure a person other than the author must approve the deployment.
  - Try to start the production job from a branch that has no approval, on a test copy.
  example: gh api repos/ORG/REPO/environments/production --jq '.protection_rules'; glab api projects/ID/protected_environments
  expected: A production deployment needs approval from a required reviewer who is not the author. No account can skip the approval gate.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
    - CICD-SEC-1
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-284
    nist_800_53:
    - CM-3
