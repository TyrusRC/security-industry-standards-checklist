- id: CICD-FLOW-005
  sheet: CICD
  category: FLOW
  title: Make sure only artifacts from the CI service account reach deployment
  objective: Finds deploy stages that accept artifacts uploaded by people or other accounts.
  preconditions:
  - Write access to a non-production artifact path.
  steps:
  - Find the artifact repositories that the deploy stage reads from.
  - List the accounts that can upload to these repositories.
  - Upload a test artifact with a personal account to a non-production path.
  - Make sure the deploy stage rejects the test artifact.
  example: cosign verify --certificate-identity-regexp '^https://github.com/ORG/REPO/.github/workflows/release.yml@' --certificate-oidc-issuer https://token.actions.githubusercontent.com IMAGE@sha256:DIGEST
  expected: The deploy stage accepts only artifacts that the approved CI identity created. Artifacts from other accounts need a second review.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
    - CICD-SEC-1
    - CICD-SEC-9
    cheatsheet:
