- id: CICD-FLOW-006
  sheet: CICD
  category: FLOW
  title: Look for drift between production and its CI/CD origin
  objective: Finds production changes that did not come from the reviewed pipeline.
  preconditions:
  - Read access to production state.
  steps:
  - Pick the code, images and infrastructure that run in production.
  - Compare their digests or state with the last pipeline build.
  - Look for resources that no signed template or pipeline created.
  - Make sure each difference has a ticket and a fix.
  example: terraform plan -detailed-exitcode; kubectl diff -f manifests/; aws lambda get-function --function-name NAME --query Configuration.CodeSha256
  expected: Production matches its pipeline origin. Detected drift is reported and corrected. Unmanaged resources are removed or brought under code.
  severity: Medium
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-1
    - CICD-SEC-9
    cheatsheet:
    - Infrastructure_as_Code_Security_Cheat_Sheet
    - CI_CD_Security_Cheat_Sheet
    cwe:
    - CWE-1269
    nist_800_53:
    - CM-3
    - CM-6
  sources_read:
  - sources/repos/www-project-top-10-ci-cd-security-risks/CICD-SEC-01-Insufficient-Flow-Control-Mechanisms.md
