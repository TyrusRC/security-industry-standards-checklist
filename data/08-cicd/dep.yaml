- id: CICD-DEP-001
  sheet: CICD
  category: DEP
  title: Check that build clients pull packages only through the internal proxy
  objective: Finds build jobs and workstations that fetch packages directly from public registries.
  preconditions:
  - Read access to the repository and a test runner.
  steps:
  - List the package managers that the pipeline uses.
  - Read the registry setting of each package manager in the repository and on the runner.
  - Make sure each setting points to the internal proxy or repository.
  - Block direct internet access for the runner on a test job and run the build.
  example: npm config get registry; pip config list; mvn help:effective-settings | grep -i mirror; cat .npmrc pip.conf .yarnrc.yml
  expected: All package managers resolve through the internal proxy. The build fails when the proxy is not reachable. Direct registry access is blocked.
  severity: High
  test_type: &id001
  - Manual
  - Config Review
