- id: CICD-DEP-008
  sheet: CICD
  category: DEP
  title: Find dependencies that come from outside the registry
  objective: Finds git URL, tarball and local path dependencies that skip registry controls.
  preconditions:
  - Read access to the repository.
  steps:
  - Search the manifests and lockfiles for git URLs, tarball URLs and file or link paths.
  - Check where each source resolves.
  - Make sure each source is pinned to a commit hash or checksum.
  - Make sure each source has an owner and a review record.
  example: grep -nE '"(git\+|https?://|file:|link:)' package.json package-lock.json; grep -nE '^(-e )?git\+|@ https?://' requirements*.txt
  expected: No dependency comes from an unpinned URL or path. Each exception is pinned, reviewed and has an owner.
  severity: Medium
  test_type: *id002
