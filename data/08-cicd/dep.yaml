- id: CICD-DEP-003
  sheet: CICD
  category: DEP
  title: Make sure the pipeline installs exactly the locked dependency versions
  objective: Finds builds that resolve dependencies again and pull versions that nobody reviewed.
  preconditions:
  - Use a test branch.
  steps:
  - Make sure a lockfile exists for each package manager and is in the repository.
  - Find the install command in the pipeline.
  - Make sure the command stops when the manifest and lockfile differ.
  - Change a version in the manifest only, on a test branch, and run the pipeline.
  example: npm ci; yarn install --frozen-lockfile; pip install --require-hashes -r requirements.txt; mvn -B dependency:resolve
  expected: The pipeline uses frozen lockfile installs. A build fails when the manifest and the lockfile do not match.
  severity: Medium
  test_type: *id001
