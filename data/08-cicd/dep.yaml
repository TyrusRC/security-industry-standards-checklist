- id: CICD-DEP-007
  sheet: CICD
  category: DEP
  title: Check new dependency names for typosquatting and slopsquatting
  objective: Finds newly added packages whose names copy popular packages or names an AI tool made up.
  preconditions:
  - Read access to the repository history.
  steps:
  - List the dependencies added in the last release.
  - Compare each name with the intended package name.
  - Look at the age, download count, maintainers and repository link of each new package.
  - Make sure each new package passed a documented review.
  example: npm view PACKAGE time.created maintainers repository.url dist.tarball; git diff HEAD~50 -- package.json
  expected: Each new dependency has the intended name, a known maintainer and a review record. No package name is unknown or very new without a reason.
  severity: Medium
  test_type: *id001
