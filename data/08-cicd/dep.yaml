- id: CICD-DEP-004
  sheet: CICD
  category: DEP
  title: Check checksum and signature verification of pulled packages
  objective: Finds package installs that do not compare hashes or signatures with known good values.
  preconditions:
  - Use a test branch.
  steps:
  - Read the lockfiles for integrity hashes of each package.
  - Make sure the pipeline does not turn off hash or signature checks.
  - Change one hash in a lockfile copy on a test branch.
  - Run the build and look at the result.
  example: grep -c integrity package-lock.json; pip install --require-hashes -r requirements.txt; npm audit signatures
  expected: Every package has a hash in the lockfile. The build fails when a hash or signature does not match.
  severity: Medium
  test_type: *id001
