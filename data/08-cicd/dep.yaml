- id: CICD-DEP-006
  sheet: CICD
  category: DEP
  title: Make sure the repository contains its package manager configuration
  objective: Finds projects that depend on the insecure default configuration of a client.
  preconditions:
  - Read access to the repository.
  steps:
  - Look for .npmrc, pip.conf, settings.xml or the same file for each package manager in the repository.
  - Read the registry, scope and integrity settings in these files.
  - Make sure the file does not point to a public mirror that you do not control.
  - Make sure no credentials are in the file.
  example: git ls-files | grep -E '(^|/)(\.npmrc|pip\.conf|settings\.xml|\.yarnrc\.yml|nuget\.config)$'; gitleaks detect --no-git -s .npmrc
  expected: Each project holds its own package manager configuration with the internal registry and scopes. The files hold no credentials.
  severity: Medium
  test_type: &id002
  - Code Review
  refs:
    owasp_top10:
    - A03:2025
    cicd_top10:
