- id: CICD-DEP-002
  sheet: CICD
  category: DEP
  title: Check for dependency confusion on internal package names
  objective: Finds internal package names that a public registry can supply instead.
  preconditions:
  - Do not publish packages to a public registry during the test.
  steps:
  - List the names of internal packages from the manifests and the internal registry.
  - Look up each name on the matching public registry.
  - Make sure private packages use the organization scope or namespace.
  - Make sure clients fetch the scope only from the internal registry.
  example: npm view @org/internal-lib; pip download --no-deps internal-lib --index-url https://pypi.org/simple 2>&1 | tail -2; grep -n '@org:registry' .npmrc
  expected: Public registries have no package with an internal name, or the name is reserved. Scoped packages come only from the internal registry.
  severity: High
  test_type: *id001
