- id: CICD-DEP-005
  sheet: CICD
  category: DEP
  title: Check that package install scripts run without access to secrets
  objective: Finds installs where lifecycle scripts of third-party packages can read pipeline secrets.
  preconditions:
  - Read access to the pipeline configuration.
  steps:
  - Find the install step of each pipeline and the secrets that are in scope there.
  - Make sure lifecycle scripts are off or limited to an allowlist.
  - Make sure the install step runs in a job without secrets and without write tokens.
  - Look at the environment of the install step.
  example: npm config get ignore-scripts; grep -rn 'ignore-scripts' .npmrc .github/ ; npm ci --ignore-scripts
  expected: Install scripts are off, or only allowlisted packages run them. The install step has no access to secrets or deploy tokens.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A03:2025
