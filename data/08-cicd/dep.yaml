- id: CICD-DEP-009
  sheet: CICD
  category: DEP
  title: Check that base images and tool versions are pinned
  objective: Finds floating tags such as latest that change the build without a reviewed change.
  preconditions:
  - Read access to the repository.
  steps:
  - Search Dockerfiles, pipeline files and install scripts for latest tags and open version ranges.
  - Make sure base images are pinned by digest or exact version.
  - Make sure OS package and tool versions are pinned.
  - Make sure an update process changes pinned versions in a reviewed pull request.
  example: hadolint Dockerfile; grep -rnE 'FROM .*(:latest|[^@:]$)' Dockerfile*; grep -rn 'latest' .github/workflows
  expected: No build input uses a floating tag. Pinned versions change only through reviewed pull requests.
  severity: Medium
  test_type:
  - Code Review
  - Automated
