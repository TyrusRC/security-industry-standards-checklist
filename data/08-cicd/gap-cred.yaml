- id: CICD-CRED-016
  sheet: CICD
  category: CRED
  title: Check OIDC token permission, credential lifetime and removal of old keys
  objective: Finds jobs that can request tokens without need, long credential lifetimes and static keys that still work.
  steps:
  - 'Search the workflows for id-token: write.'
  - Make sure only the jobs that need cloud access have the permission, at job level.
  - Read the lifetime of the issued credentials. Make sure it is the shortest the job needs.
  - Make sure logs, artifacts and caches do not hold the OIDC token or issued credentials.
  - Make sure the static keys that federation replaced are revoked and removed from the pipelines.
  example: grep -rn 'id-token' .github/workflows; aws iam get-role --role-name ROLE --query Role.MaxSessionDuration; aws iam list-access-keys --user-name USER
  expected: Only jobs with cloud access can request tokens. Credential lifetime is short. Replaced static keys no longer work.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - Workload_Identity_Federation_Cheat_Sheet
    cwe:
    - CWE-522
    - CWE-532
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Workload_Identity_Federation_Cheat_Sheet.md
- id: CICD-CRED-017
  sheet: CICD
  category: CRED
  title: Check that a compromised job stops getting credentials quickly
  objective: Finds missing procedures to stop credential issuance and to end sessions that exist already.
  preconditions:
  - Use a test role only.
  steps:
  - Read the incident procedure for a compromised pipeline job.
  - Make sure the procedure lists how to stop new credential issuance.
  - Make sure the procedure lists how to revoke or restrict sessions that exist already.
  - Note that removal of the trust relationship alone does not end existing sessions.
  - Run the procedure on a test role and make sure the old session stops.
  example: 'aws iam put-role-policy --role-name TESTROLE --policy-name RevokeOlderSessions --policy-document file://deny-before-time.json  # test role only'
  expected: The team can stop new credentials and end existing sessions of a federated identity within the target time.
  severity: Medium
  test_type:
  - Manual
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - Workload_Identity_Federation_Cheat_Sheet
    - GitHub_Actions_Security_Cheat_Sheet
  sources_read:
  - sources/repos/CheatSheetSeries/cheatsheets/Workload_Identity_Federation_Cheat_Sheet.md
