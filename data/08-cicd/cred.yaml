- id: CICD-CRED-007
  sheet: CICD
  category: CRED
  title: Check that pipelines use short-lived federated credentials
  objective: Finds static cloud keys and long-lived tokens stored in CI variables.
  preconditions:
  - Read access to the CI and cloud IAM settings.
  steps:
  - List the secrets in the CI platform and mark the cloud keys and long-lived tokens.
  - Find pipelines that use OIDC federation to get temporary credentials.
  - Read the trust policy and make sure it limits repository, branch and environment.
  - Replace static keys on a test pipeline and remove the old key.
  example: aws iam get-role --role-name ROLE --query Role.AssumeRolePolicyDocument; gh api repos/ORG/REPO/actions/secrets --jq '.secrets[].name'
  expected: Pipelines get temporary credentials through OIDC. The trust policy names the exact repository, branch or environment. No static cloud key is stored.
  severity: High
  test_type: &id002
  - Manual
  - Config Review
  refs:
