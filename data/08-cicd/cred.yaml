- id: CICD-CRED-011
  sheet: CICD
  category: CRED
  title: Check that application runtime secrets do not pass through the pipeline
  objective: Finds production secrets that the pipeline holds when the service could read them itself.
  preconditions:
  - Read access to the pipeline and secret manager settings.
  steps:
  - List the production application secrets that the pipeline stores or injects.
  - Find which of them the application could get from a secret manager at run time.
  - Read the platform identity that the deployed service uses.
  - Remove the secrets that the pipeline does not need.
  example: kubectl get sa,rolebinding -n NS; aws secretsmanager list-secrets --query 'SecretList[].Name'; grep -rn 'secrets\.' .github/workflows/deploy*.yml
  expected: The pipeline deploys with a platform identity. The deployed service reads its own secrets from the secret manager at run time.
  severity: Medium
  test_type: *id002
  refs:
    cicd_top10:
    - CICD-SEC-6
