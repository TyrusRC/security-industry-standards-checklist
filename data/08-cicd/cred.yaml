- id: CICD-CRED-010
  sheet: CICD
  category: CRED
  title: Review the secret inventory, access and exposure response plan
  objective: Finds secrets without an owner and teams that cannot revoke an exposed secret quickly.
  preconditions:
  - Use a test secret for the exercise.
  steps:
  - Get the list of secrets stored in CI tools, with purpose and owner.
  - Look at who can view or change the stored secrets.
  - Make sure forks and copied jobs do not copy secrets.
  - Run a tabletop test of revoke, rotate and delete for one exposed test secret.
  example: gh api orgs/ORG/actions/secrets --jq '.secrets[]|{name,visibility}'; gh api repos/ORG/REPO/collaborators --jq '.[]|select(.permissions.admin)|.login'
  expected: Every stored secret has a purpose and an owner. Access is reviewed. The team revokes and rotates an exposed secret within the policy time.
  severity: Medium
  test_type:
  - Manual
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
    cwe:
    - CWE-798
    nist_800_53:
    - IA-5
