- id: CICD-CRED-003
  sheet: CICD
  category: CRED
  title: Look for hard-coded credentials in pipeline and infrastructure files
  objective: Finds passwords and keys in CI files, scripts, IaC and deployment manifests.
  preconditions:
  - Read access to the repository.
  steps:
  - List the CI files, build scripts, IaC and deployment manifests.
  - Search them for passwords, keys, tokens and connection strings.
  - Look for credentials in default values of pipeline variables.
  - Make sure each credential comes from the secret store.
  example: gitleaks detect --no-git -s .github/ ; semgrep scan --config p/secrets .; trivy config --scanners secret .
  expected: No file in the repository holds a credential. All pipelines read secrets from the secret store at run time.
  severity: High
  test_type:
  - Code Review
  - Automated
