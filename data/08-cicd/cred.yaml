- id: CICD-CRED-006
  sheet: CICD
  category: CRED
  title: Check built packages and charts for included secrets
  objective: Finds packages, binaries and charts that contain credentials or environment files.
  preconditions:
  - Do not publish during the test. Use dry-run or a local pack.
  steps:
  - List the package types that the pipeline publishes.
  - Create the package without publishing it and list its files.
  - Scan the package contents for secrets and environment files.
  - Make sure an allowlist, such as the files property, controls the contents.
  example: npm publish --dry-run; npm pack && tar -tzf *.tgz; trufflehog filesystem ./package; helm package CHART && gitleaks detect --no-git -s CHART
  expected: Published packages hold only the intended files and no secrets. An allowlist controls the package contents.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - NPM_Security_Cheat_Sheet
    - Secrets_Management_Cheat_Sheet
