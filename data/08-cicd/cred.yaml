- id: CICD-CRED-002
  sheet: CICD
  category: CRED
  title: Check that push protection and pre-commit scanning block new secrets
  objective: Finds repositories where a developer can push a new secret without a warning.
  preconditions:
  - Use a test repository and a fake token only.
  steps:
  - Read the secret scanning and push protection settings of the organization and repository.
  - Make sure a pre-commit or IDE check runs on developer machines.
  - On a test repository, commit a fake token with a known test format.
  - Make sure the push is blocked or flagged.
  example: gh api repos/ORG/REPO --jq .security_and_analysis; pre-commit run gitleaks --all-files; gitleaks protect --staged
  expected: Push protection and pre-commit checks are on. A fake test token is blocked or flagged before it reaches the shared branch.
  severity: Medium
  test_type: &id001
  - Config Review
  - Automated
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
