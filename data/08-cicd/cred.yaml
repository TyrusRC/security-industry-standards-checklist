- id: CICD-CRED-004
  sheet: CICD
  category: CRED
  title: Check build logs for exposed secrets and masking
  objective: Finds secrets printed in console output and shipped to log systems.
  preconditions:
  - Handle the downloaded logs as sensitive data.
  steps:
  - Download the logs of recent builds, including failed and debug builds.
  - Scan the logs for secrets.
  - Make sure the platform masks secret values in logs.
  - Make sure debug and trace mode is off for builds with secrets.
  example: gh run list --limit 50 --json databaseId --jq '.[].databaseId' | xargs -I{} gh run view {} --log > logs.txt; gitleaks detect --no-git -s logs.txt
  expected: Build logs hold no secret values. Masking is on. Debug mode is off for jobs with secrets.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Secrets_Management_Cheat_Sheet
