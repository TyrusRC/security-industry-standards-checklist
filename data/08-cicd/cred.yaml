- id: CICD-CRED-009
  sheet: CICD
  category: CRED
  title: Check that credentials work only under set conditions
  objective: Finds stolen pipeline credentials that work from any network or identity.
  preconditions:
  - Use a test credential for a test resource.
  steps:
  - List the credentials that pipelines use to reach cloud and registry services.
  - Read the conditions on each, such as source address or identity.
  - From a host outside the allowed range, use a test credential on a test resource.
  - Make sure the request is denied.
  example: aws iam get-user-policy --user-name USER --policy-name POLICY; npm token list
  expected: Credentials are limited to source addresses or identities of the pipeline. A request from outside is denied and logged.
  severity: Medium
  test_type: *id002
