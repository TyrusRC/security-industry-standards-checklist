- id: CICD-CRED-001
  sheet: CICD
  category: CRED
  title: Scan the full repository history for secrets
  objective: Finds credentials in current files and in old commits that stay readable to all repository users.
  preconditions:
  - Read access to the repository. Handle findings as sensitive data.
  steps:
  - Clone the repository with its full history, including all branches and tags.
  - Run two secret scanners on the full history.
  - Compare the results and remove false positives.
  - For each real finding, make sure the secret is revoked and rotated.
  example: gitleaks detect --redact -v; trufflehog git file://. --only-verified; git log --all --oneline | wc -l
  expected: The history holds no active secrets. Each past finding has a record of revocation and rotation.
  severity: High
  test_type:
  - Automated
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
    - CI_CD_Security_Cheat_Sheet
    - Infrastructure_as_Code_Security_Cheat_Sheet
    cwe:
    - CWE-798
    attack:
    - T1552.001
    nist_800_53:
    - IA-5
