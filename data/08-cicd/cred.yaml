- id: CICD-CRED-008
  sheet: CICD
  category: CRED
  title: Review rotation and expiry of pipeline credentials
  objective: Finds deploy keys and tokens that stay valid for years.
  preconditions:
  - Read access to the CI and cloud IAM settings.
  steps:
  - List deploy keys, tokens, service account keys and registry credentials that pipelines use.
  - Record the creation date and the expiry date of each.
  - Compare the age with the rotation policy.
  - Make sure rotation runs without a long outage.
  example: gh api repos/ORG/REPO/keys --jq '.[]|{title,created_at}'; aws iam list-access-keys --user-name USER; gh api repos/ORG/REPO/actions/secrets --jq '.secrets[]|{name,updated_at}'
  expected: Each credential has an owner, an expiry date and a rotation date within policy. Rotation is automated or tested.
  severity: Medium
  test_type: *id002
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - Secrets_Management_Cheat_Sheet
    cwe:
