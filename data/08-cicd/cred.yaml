- id: CICD-CRED-005
  sheet: CICD
  category: CRED
  title: Check container image layers and build arguments for secrets
  objective: Finds images where a secret from the build stays in a layer, a build argument or an environment value.
  preconditions:
  - Read access to the image registry.
  steps:
  - Search the Dockerfiles for ARG, ENV and COPY that handle credentials.
  - Make sure the build uses secret mounts.
  - Scan the final image and all its layers for secrets.
  - Look at the image history for credential values.
  example: trivy image --scanners secret IMAGE@sha256:DIGEST; docker history --no-trunc IMAGE; hadolint Dockerfile; trufflehog docker --image IMAGE
  expected: Images hold no secrets in any layer. Builds pass credentials only through secret mounts that are not saved in the image.
  severity: High
  test_type: *id001
  refs:
    cicd_top10:
    - CICD-SEC-6
    cheatsheet:
    - Docker_Security_Cheat_Sheet
    - Secrets_Management_Cheat_Sheet
