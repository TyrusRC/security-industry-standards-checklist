- id: CICD-ART-006
  sheet: CICD
  category: ART
  title: Check hash or signature checks for downloaded scripts and tools
  objective: Finds build steps that download and run code without a check against a published hash.
  preconditions:
  - Read access to the repository.
  steps:
  - Search pipeline files and Dockerfiles for curl or wget piped to a shell and for downloaded binaries.
  - For each, find the check of a hash or signature.
  - Make sure the expected hash comes from a trusted source.
  - Make sure a changed download fails the build.
  example: grep -rnE 'curl .*\| *(ba)?sh|wget .*\| *(ba)?sh|curl -[a-zA-Z]*O' .github Dockerfile* scripts/; sha256sum -c tool.sha256
  expected: No downloaded script runs without a hash or signature check. A changed file makes the build fail.
  severity: High
  test_type:
  - Code Review
  - Automated
