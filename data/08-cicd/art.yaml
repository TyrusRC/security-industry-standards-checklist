- id: CICD-ART-005
  sheet: CICD
  category: ART
  title: Check that one built artifact is promoted unchanged through environments
  objective: Finds pipelines that rebuild per environment, so the tested artifact is not the shipped one.
  preconditions:
  - Read access to deployment settings.
  steps:
  - Follow one release from test to production.
  - Compare the artifact digest in each environment.
  - Make sure deployments refer to the digest, not a mutable tag.
  - Make sure the build is immutable and does not rerun for production.
  example: docker buildx imagetools inspect IMAGE:TAG; kubectl get deploy NAME -o jsonpath='{.spec.template.spec.containers[*].image}'
  expected: The same digest runs in every environment. Deployments use digests. Production does not trigger a new build.
  severity: Medium
  test_type: &id002
  - Manual
  - Config Review
  refs:
    owasp_top10:
