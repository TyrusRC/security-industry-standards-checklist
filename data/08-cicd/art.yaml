- id: CICD-ART-004
  sheet: CICD
  category: ART
  title: Check the SBOM for each release and its link to the artifact
  objective: Finds releases with no SBOM, or an SBOM that nobody can tie to the shipped artifact.
  preconditions:
  - Read access to the artifact registry.
  steps:
  - Find the SBOM step in the release pipeline.
  - Generate an SBOM from the final artifact and compare it with the published one.
  - Make sure the SBOM lists transitive dependencies, hashes and generator data.
  - Make sure a signed attestation binds the SBOM to the artifact digest.
  example: syft IMAGE@sha256:DIGEST -o cyclonedx-json > sbom.json; cosign verify-attestation --type cyclonedx IMAGE@sha256:DIGEST --certificate-identity-regexp ... --certificate-oidc-issuer ...
  expected: Each release has a valid SBOM that matches the final artifact. A signed attestation binds the SBOM to the artifact digest.
  severity: Medium
  test_type: *id001
  refs:
    owasp_top10:
    - A03:2025
