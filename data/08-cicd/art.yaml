- id: CICD-ART-009
  sheet: CICD
  category: ART
  title: Check retention of release evidence
  objective: Finds releases for which the SBOM, signatures and provenance are lost.
  preconditions:
  - Read access to the artifact registry.
  steps:
  - Pick one release from the last year.
  - Find its SBOM, signatures, provenance and build logs.
  - Make sure the original files are stored with the release.
  - Make sure write access to the store is limited.
  example: oras discover IMAGE@sha256:DIGEST; cosign tree IMAGE@sha256:DIGEST
  expected: The original SBOM, signed evidence and provenance exist for each release. Write access to the store is limited.
  severity: Low
  test_type: *id002
  refs:
    owasp_top10:
