- id: CICD-ART-007
  sheet: CICD
  category: ART
  title: Check write controls and immutability of the artifact repository
  objective: Finds registries where people can overwrite released artifacts or tags.
  preconditions:
  - Use a test repository for the overwrite test.
  steps:
  - List the accounts that can write to the release repositories.
  - Make sure only the CI service account can publish releases.
  - Try to overwrite an existing release tag on a test repository.
  - Make sure retention rules keep released artifacts.
  example: gh api orgs/ORG/packages/container/NAME --jq .visibility; skopeo inspect docker://REGISTRY/NAME:TAG; jf rt curl /api/repositories/REPO
  expected: Only the CI service account can publish. Released tags and versions cannot change. Retention rules keep release artifacts.
  severity: High
  test_type: *id002
