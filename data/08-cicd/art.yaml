- id: CICD-ART-008
  sheet: CICD
  category: ART
  title: Review protection of signing keys and signing identity
  objective: Finds signing keys that unreviewed jobs or many people can use.
  preconditions:
  - Read access to the key management settings.
  steps:
  - List the signing keys and certificates and where they are stored.
  - Make sure they are in a KMS or HSM, or that signing uses short-lived keyless identity.
  - Make sure jobs that run unreviewed code cannot use them.
  - Make sure key use is logged and has an alert.
  example: cosign verify --certificate-identity ID --certificate-oidc-issuer ISSUER IMAGE; aws kms get-key-policy --key-id KEY --policy-name default
  expected: Signing keys are in hardened storage, or signing uses short-lived identity. Only reviewed release jobs can sign. Each use is logged.
  severity: High
  test_type: *id002
