- id: CICD-ART-001
  sheet: CICD
  category: ART
  title: Check that signed commits are required on protected branches
  objective: Finds branches that accept commits from unknown authors.
  preconditions:
  - Read access to the repository.
  steps:
  - Read the branch rules for signed commits.
  - List recent commits on the protected branch.
  - Look at the signature status of each.
  - Make sure unsigned commits cannot reach the branch.
  example: gh api repos/ORG/REPO/branches/main/protection/required_signatures; git log --show-signature -n 20; git log --format='%H %G?' -n 50
  expected: Protected branches require signed commits from known keys. Unsigned commits are rejected.
  severity: Medium
  test_type: &id001
  - Config Review
  - Automated
  refs:
    owasp_top10:
    - A03:2025
    - A08:2025
    cicd_top10:
