- id: CICD-ART-003
  sheet: CICD
  category: ART
  title: Check build provenance and its verification
  objective: Finds artifacts with no verifiable record of where, when and how they were built.
  preconditions:
  - Read access to the artifact registry.
  steps:
  - Find the provenance step in the build platform.
  - Make sure the build platform creates it, not a developer machine.
  - 'Check the provenance for one release: builder, source repository and build parameters.'
  - Make sure the deploy policy rejects missing or unexpected provenance.
  example: gh attestation verify ARTIFACT --repo ORG/REPO; cosign verify-attestation --type slsaprovenance IMAGE@sha256:DIGEST --certificate-identity-regexp ... --certificate-oidc-issuer ...
  expected: Each release has provenance from the build platform. The deploy policy checks builder identity, source and digest. Missing evidence is rejected.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
