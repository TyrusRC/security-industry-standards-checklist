- id: CICD-PPE-003
  sheet: CICD
  category: PPE
  title: Test indirect poisoned pipeline execution through referenced files
  objective: Finds jobs that run repository files, such as Makefile, scripts and test code, with secrets.
  preconditions:
  - Do not run on production. Use a test branch with no real secrets.
  steps:
  - List the files that the pipeline runs, such as Makefile, scripts, test code and linter configuration.
  - Find the jobs that run these files together with secrets.
  - Change a referenced script on a test branch to print a marker text.
  - Make sure the changed file runs without secrets until a reviewer approves it.
  example: grep -rnE 'make |bash |sh |python |npm run' .github/workflows Jenkinsfile; grep -rn 'secrets\.' .github/workflows
  expected: Jobs with secrets run only reviewed files. Unreviewed files run in a job without secrets, or the secret step does not run repository scripts.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A08:2025
