- id: CICD-PPE-008
  sheet: CICD
  category: PPE
  title: Make sure pipeline definitions and build scripts are in version control
  objective: Finds pipeline settings that exist only in the CI user interface with no history or review.
  preconditions:
  - Read access to the CI system.
  steps:
  - List the pipelines and jobs in the CI system.
  - Find jobs whose definition is only in the CI user interface.
  - Make sure each pipeline definition and build script is in a repository.
  - Make sure the audit log shows who changed a job setting.
  example: curl -s https://JENKINS/api/json?tree=jobs[name,_class]; gh api repos/ORG/REPO/contents/.github/workflows
  expected: Every pipeline definition and build script is in version control with review and history. No job exists only in the user interface.
  severity: Medium
  test_type: *id001
  refs:
