- id: CICD-PPE-005
  sheet: CICD
  category: PPE
  title: Check that public repository pipelines do not share runners with private ones
  objective: Finds public project builds that run on the same CI instance or runner as private projects.
  preconditions:
  - Admin read access to the CI settings.
  steps:
  - List the runners and the CI instances for public and private repositories.
  - Find runners that serve both.
  - Look for shared caches, volumes and credentials between them.
  - Make sure public builds use separate ephemeral runners.
  example: gh api orgs/ORG/actions/runner-groups --jq '.runner_groups[]|{name,visibility,allows_public_repositories}'
  expected: Public and private pipelines use separate runners, caches and credentials. Runners for public builds are ephemeral.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
