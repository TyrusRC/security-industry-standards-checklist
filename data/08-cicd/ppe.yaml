- id: CICD-PPE-002
  sheet: CICD
  category: PPE
  title: Check that CI configuration files need review before they run
  objective: Finds CI definitions that a user can change without a second person reviewing them.
  preconditions:
  - Read access to the repository settings.
  steps:
  - Find where the CI configuration file is stored.
  - Make sure a named owner must review changes to it, or that it comes from a protected source.
  - Read the CODEOWNERS file for the workflow and pipeline paths.
  - Make sure branch protection requires the code owner review.
  example: cat .github/CODEOWNERS | grep -E 'workflows|Jenkinsfile|\.gitlab-ci'; gh api repos/ORG/REPO/branches/main/protection --jq .required_pull_request_reviews.require_code_owner_reviews
  expected: CI configuration changes need code owner review. Or the pipeline reads its definition from a protected branch or a separate protected repository.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
    - CICD-SEC-4
    cheatsheet:
