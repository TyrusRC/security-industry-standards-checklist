- id: CICD-PPE-007
  sheet: CICD
  category: PPE
  title: Check user-controlled build parameters
  objective: Finds build parameters that let a user change how the build runs, for example scripts or URLs.
  preconditions:
  - Read access to the pipeline configuration.
  steps:
  - List the manual triggers and the input parameters of each pipeline.
  - Find parameters that set commands, URLs, branches or script paths.
  - Make sure only authorized users can start these triggers.
  - Remove the parameters that are not needed.
  example: grep -rn 'workflow_dispatch\|parameters {' -A8 .github/workflows Jenkinsfile
  expected: Build parameters are few. They accept only validated values and do not set commands or script locations. Only authorized users can start the build.
  severity: Medium
  test_type: *id001
