- id: CICD-PPE-006
  sheet: CICD
  category: PPE
  title: Test CI steps for injection from untrusted context values
  objective: Finds steps that put names of branches, pull request titles or commit messages into shell commands.
  preconditions:
  - Use a test repository. Use only a harmless marker text.
  steps:
  - Search the pipeline files for context values that enter run steps, such as titles, branch names and issue text.
  - Make sure the values pass through environment variables, not direct text insertion.
  - Open a test pull request with a title that holds a harmless command substitution marker.
  - Look at the run log and make sure the marker is printed as plain text.
  example: zizmor --format plain .github/workflows/ | grep -i injection; actionlint -shellcheck=; grep -rn '\${{ github.event' .github/workflows
  expected: Untrusted values never go into shell code. The marker text appears in the log as plain text.
  severity: High
  test_type:
  - Code Review
  - Automated
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
    - CICD-SEC-4
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
