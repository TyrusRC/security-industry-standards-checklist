- id: CICD-PPE-004
  sheet: CICD
  category: PPE
  title: Test public poisoned pipeline execution from forks
  objective: Finds public repositories that run code from anonymous contributors with secrets or write tokens.
  preconditions:
  - Read access to the repository settings.
  steps:
  - List the workflows that run on pull requests from forks.
  - Make sure forks do not receive secrets and get a read-only token.
  - Look for pull_request_target or similar triggers that check out and run fork code.
  - Make sure first-time contributors need manual approval before a run.
  example: zizmor --pedantic .github/workflows/; gh api repos/ORG/REPO/actions/permissions/fork-pr-contributor-approval; grep -rn 'pull_request_target' .github/workflows
  expected: Fork pull requests run without secrets and with a read-only token. Triggers with write rights never run fork code. Outside contributors need approval.
  severity: Critical
  test_type:
  - Config Review
  - Automated
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
