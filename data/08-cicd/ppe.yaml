- id: CICD-PPE-001
  sheet: CICD
  category: PPE
  title: Test direct poisoned pipeline execution from an unreviewed branch
  objective: Finds pipelines where a changed CI file on an unreviewed branch runs with secrets.
  preconditions:
  - Do not run on production. Use a test repository or a test branch with no real secrets.
  steps:
  - List the events that start each pipeline, such as push and pull request.
  - Make sure the pipeline for a push to an unprotected branch has no secrets and no deploy rights.
  - Push a harmless change to a CI file on a test branch that prints a marker text.
  - Look at the run and make sure no secret or protected environment was available.
  example: zizmor .github/workflows/; actionlint; gh api repos/ORG/REPO/actions/secrets; echo CANARY-OK in a test workflow
  expected: A changed CI file on an unreviewed branch or pull request runs without secrets, without deploy rights and without protected environments.
  severity: Critical
  test_type: &id001
  - Manual
  - Config Review
  refs:
    owasp_top10:
    - A08:2025
    cicd_top10:
    - CICD-SEC-4
    cheatsheet:
    - CI_CD_Security_Cheat_Sheet
    - Software_Supply_Chain_Security_Cheat_Sheet
    cwe:
    - CWE-94
    - CWE-77
    capec:
    - CAPEC-445
    attack:
    - T1195.002
    - T1072
    other:
    - SSDF PS.1.1
