- id: CICD-TPS-005
  sheet: CICD
  category: TPS
  title: Check assessment of third-party suppliers and components
  objective: Finds suppliers and open-source components that entered the chain without a risk review.
  preconditions:
  - Access to the supplier review records.
  steps:
  - Pick five recent new suppliers or components.
  - Look for a record of security history, upkeep and vulnerability handling.
  - Make sure the review matches the criticality of the component.
  - Make sure the process names who approves.
  example: scorecard --repo=github.com/OWNER/PROJECT; osv-scanner --lockfile=package-lock.json
  expected: Each supplier and component has a review record. High-risk items get a deeper review and a named approver.
  severity: Medium
  test_type:
  - Manual
  refs:
    owasp_top10:
    - A03:2025
    cicd_top10:
