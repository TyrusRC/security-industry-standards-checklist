- id: CICD-TPS-001
  sheet: CICD
  category: TPS
  title: List all third-party integrations in the SCM and CI
  objective: Finds integrations that nobody approved, such as apps, OAuth apps, tokens, SSH keys and webhooks.
  preconditions:
  - Admin read access to the SCM organization.
  steps:
  - List GitHub or GitLab apps, OAuth apps, personal tokens, deploy keys and webhooks.
  - Record the owner, the method and the permission level of each.
  - Find integrations without an approval record.
  - Check that webhook targets belong to known vendors and use a secret.
  example: gh api orgs/ORG/installations; gh api orgs/ORG/hooks; gh api repos/ORG/REPO/keys; gh api repos/ORG/REPO/hooks
  expected: Every integration has an approval record, an owner and a known permission level. No unknown app, key or webhook exists.
  severity: High
  test_type: &id001
  - Manual
  - Config Review
  refs:
    owasp_top10:
    - A03:2025
    cicd_top10:
    - CICD-SEC-8
    cheatsheet:
