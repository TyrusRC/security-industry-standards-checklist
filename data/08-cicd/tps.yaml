- id: CICD-TPS-004
  sheet: CICD
  category: TPS
  title: Check who can install plugins and add integrations
  objective: Finds users who can extend the CI/CD platform without vetting.
  preconditions:
  - Admin read access to the CI platform.
  steps:
  - List the roles that can install plugins, apps and integrations.
  - Make sure the group is small.
  - 'Read the vetting steps for a new plugin: vendor history, upkeep and needed settings.'
  - Look at the last three additions and find their approval record.
  example: curl -s https://JENKINS/role-strategy/strategy/getAllRoles; gh api orgs/ORG --jq .members_can_install_apps
  expected: Only a small group can add plugins and integrations. Each addition has a vetting record and enters configuration management.
  severity: Medium
  test_type: *id001
  refs:
    owasp_top10:
    - A03:2025
