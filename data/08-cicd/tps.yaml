- id: CICD-TPS-002
  sheet: CICD
  category: TPS
  title: Compare granted and used permissions of third-party integrations
  objective: Finds integrations with more access than they use.
  preconditions:
  - Admin read access to the SCM organization.
  steps:
  - For each integration, read the permissions it holds and the repositories it can reach.
  - Look at the audit log for the permissions it used in the last 90 days.
  - Mark unused and excess permissions.
  - Reduce the access to the used set.
  example: gh api orgs/ORG/installations --jq '.installations[]|{app_slug,permissions,repository_selection}'
  expected: Each integration holds only the permissions it uses, on the repositories it needs. Excess permissions are removed.
  severity: High
  test_type: *id001
  refs:
    owasp_top10:
    - A03:2025
    cicd_top10:
