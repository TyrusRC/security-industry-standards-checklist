- id: CICD-TPS-003
  sheet: CICD
  category: TPS
  title: Check that third-party actions and plugins are approved and pinned
  objective: Finds build steps that load unreviewed third-party code that can change without notice.
  preconditions:
  - Read access to the pipeline files.
  steps:
  - Read the allowed actions policy of the organization.
  - List each action, plugin or orb in the pipelines.
  - Make sure each is on an approved list.
  - Make sure each is pinned to a full commit hash or a fixed version.
  example: gh api orgs/ORG/actions/permissions --jq .allowed_actions; zizmor --pedantic .github/workflows/; pinact run --check
  expected: Only approved third-party steps are allowed. Each one is pinned to a commit hash or a fixed version, and the pin changes only through review.
  severity: High
  test_type:
  - Config Review
  - Automated
