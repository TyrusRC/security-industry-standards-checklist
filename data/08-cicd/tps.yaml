- id: CICD-TPS-006
  sheet: CICD
  category: TPS
  title: Review removal of unused integrations
  objective: Finds integrations, apps and webhooks that stay active after the need ended.
  preconditions:
  - Admin read access to the SCM organization.
  steps:
  - List integrations and their last activity date.
  - Find integrations with no activity in the policy period.
  - Make sure there is a periodic review with named owners.
  - Remove one unused test integration and check the process.
  example: gh api orgs/ORG/installations --jq '.installations[]|{app_slug,updated_at}'; gh api orgs/ORG/audit-log?phrase=action:integration_installation
  expected: A scheduled review removes unused integrations. No integration is idle longer than the policy period.
  severity: Low
  test_type: *id001
  refs:
    owasp_top10:
    - A03:2025
    cicd_top10:
