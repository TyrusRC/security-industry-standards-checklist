- id: PRIV-SHARE-001
  sheet: PRIV
  category: SHARE
  title: Find all third parties that receive personal data in application traffic
  objective: Finds trackers, widgets and SDKs that send data to third parties without notice.
  steps:
  - Start a clean browser profile and a proxy.
  - Load the main pages and log in.
  - List every third-party host in the traffic.
  - Look at the parameters sent to each host.
  example: Burp Suite HTTP history filtered by host; browser developer tools Network tab; look for e-mail, user ID, location in parameters.
  expected: Only documented recipients receive data. No personal data goes to a tracker before consent.
  severity: High
  test_type:
  - Manual
  refs:
    privacy_top10:
    - P1
    - P2
    - P4
    other:
    - GDPR Art. 6
    - GDPR Art. 7
    - GDPR Art. 13
    cwe:
    - CWE-359
    - CWE-201
    cheatsheet:
    - Third_Party_Javascript_Management_Cheat_Sheet
  see:
  - WEB-DATA-004
  - MOB-PRIV-005
  sources_read:
  - sources/repos/www-project-top-10-privacy-risks/tab_topprivacy.md
  - sources/repos/www-project-top-10-privacy-risks/OWASP_Top_10_Privacy_Risks_Countermeasures_v2.0.pdf
  - sources/extra/gdpr.html
