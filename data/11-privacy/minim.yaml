- id: PRIV-MINIM-005
  sheet: PRIV
  category: MINIM
  title: Check that the default settings collect the least data
  objective: Finds privacy-invasive defaults for tracking, profiling and visibility.
  steps:
  - Create a new account.
  - List all privacy-relevant settings and their defaults.
  - Look at profile visibility and data sharing defaults.
  - Record each setting that is more open than the purpose needs.
  example: Screenshot every settings page after fresh sign-up.
  expected: Defaults collect and share the minimum data. Personalised advertising and public profile visibility are off.
  severity: Medium
  test_type:
  - Manual
  refs:
    privacy_top10:
    - P10
    - P4
    other:
    - GDPR Art. 25
  see:
  - MOB-PRIV-011
  sources_read: *id001
