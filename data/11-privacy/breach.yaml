- id: PRIV-BREACH-005
  sheet: PRIV
  category: BREACH
  title: Check that processors tell the controller about a breach without delay
  objective: Finds contracts and channels that delay the breach message.
  steps:
  - Ask for the processor contracts.
  - Look for the breach notice clause and the contact.
  - Check the contact channel with a test message.
  - Check that the processor has a response plan.
  example: Send a test alert to the processor breach contact and note the reply time.
  expected: Each processor must tell the controller without undue delay. The test message reaches a staffed contact.
  severity: Medium
  test_type:
  - Config Review
  - Manual
  refs:
    privacy_top10:
    - P3
    other:
    - GDPR Art. 28
    - GDPR Art. 33
  sources_read: *id001
