- id: PRIV-GOV-004
  sheet: PRIV
  category: GOV
  title: Check the data quality controls for stored personal data
  objective: Finds old, wrong or duplicate personal data.
  steps:
  - Ask how the service keeps data up to date.
  - Look for periodic checks or prompts to the user.
  - Find duplicate or conflicting records in a sample.
  - Check that updates reach all copies.
  example: SQL duplicate check on a sample; review of the reminder process.
  expected: The service has a process to keep data accurate. Old and wrong data is corrected or removed.
  severity: Low
  test_type:
  - Manual
  - Config Review
  refs:
    privacy_top10:
    - P7
    other:
    - GDPR Art. 5
    - GDPR Art. 16
  sources_read: *id001
- id: PRIV-GOV-005
  sheet: PRIV
  category: GOV
  title: Check the privacy of automated decisions and profiling
  objective: Finds profiling with legal or similar effect that has no human review or explanation.
  steps:
  - List automated decisions that affect users.
  - Check the notice for the logic and its effect.
  - Check for a human review path.
  - Check that users can object.
  example: 'Document review: decision logic description, review procedure.'
  expected: Automated decisions with significant effect have a notice, a human review path and an objection path.
  severity: Medium
  test_type:
  - Config Review
  refs:
    privacy_top10:
    - P4
    - P5
    other:
    - GDPR Art. 13
    - GDPR Art. 22
  sources_read: *id001
