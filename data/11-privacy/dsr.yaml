- id: PRIV-DSR-001
  sheet: PRIV
  category: DSR
  title: Test the access request process and the content of the answer
  objective: Finds access requests that fail, come late or leave out data.
  steps:
  - Submit an access request as a test user.
  - Note the identity checks that the service asks for.
  - Compare the answer with the data in the database.
  - Check the answer for purposes, recipients, retention and source.
  example: Measure days from request to answer. Compare export with a database dump for the test user.
  expected: The answer arrives within one month and holds a copy of all data plus purposes, recipients, storage period and rights.
  severity: High
  test_type:
  - Manual
  refs:
    privacy_top10:
    - P9
    other:
    - GDPR Art. 12
    - GDPR Art. 15
  sources_read: &id001
  - sources/repos/www-project-top-10-privacy-risks/tab_topprivacy.md
  - sources/repos/www-project-top-10-privacy-risks/OWASP_Top_10_Privacy_Risks_Countermeasures_v2.0.pdf
  - sources/extra/gdpr.html
- id: PRIV-DSR-002
  sheet: PRIV
  category: DSR
  title: Make sure access requests do not expose data to another person
  objective: Finds access processes that give data to the wrong person.
  steps:
  - Submit an access request for user A while you use a different e-mail address.
  - Try to change the user identifier in the request.
  - Check that the service checks identity before it sends data.
  - Check the channel that carries the export.
  example: Burp Repeater on the export request; change the user ID parameter.
  expected: The service refuses requests that it cannot link to the data subject. The export goes only to the verified owner on a protected channel.
  severity: High
  test_type:
  - Manual
  refs:
    privacy_top10:
    - P9
    - P2
    other:
    - GDPR Art. 12
    - GDPR Art. 15
    cwe:
    - CWE-359
    - CWE-863
