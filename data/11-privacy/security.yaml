- id: PRIV-SEC-006
  sheet: PRIV
  category: SEC
  title: Check that users can see and end open sessions
  objective: Finds services that give users no control over open sessions.
  steps:
  - Log in on two devices.
  - Open the session list in the account.
  - End the other session from the first device.
  - Check that the second device lost access.
  example: Two browsers; confirm the second token returns 401 after revocation.
  expected: The user sees all open sessions and can end them. Ended sessions stop at once.
  severity: Low
  test_type:
  - Manual
  refs:
    privacy_top10:
    - P8
    other:
    - GDPR Art. 32
    cheatsheet:
    - User_Privacy_Protection_Cheat_Sheet
