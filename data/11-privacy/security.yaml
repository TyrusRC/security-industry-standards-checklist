- id: PRIV-SEC-004
  sheet: PRIV
  category: SEC
  title: Check that personal data is encrypted in transit on every channel
  objective: Finds clear-text transfers of personal data, including internal and partner links.
  steps:
  - List all channels that carry personal data.
  - Capture traffic on each channel.
  - Look for clear-text protocols.
  - Check the TLS version and certificate checks.
  example: Wireshark capture; nmap --script ssl-enum-ciphers -p 443 host.
  expected: Every channel uses current TLS with certificate checks. No personal data goes in clear text.
  severity: High
  test_type:
  - Manual
  refs:
    privacy_top10:
    - P2
    - P1
    other:
    - GDPR Art. 32
    cwe:
    - CWE-319
    cheatsheet:
    - User_Privacy_Protection_Cheat_Sheet
