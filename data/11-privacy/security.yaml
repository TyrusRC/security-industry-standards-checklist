- id: PRIV-SEC-003
  sheet: PRIV
  category: SEC
  title: Check that access to personal data follows need-to-know
  objective: Finds staff and service accounts that can read more personal data than their role needs.
  steps:
  - Ask for the role list and the access matrix for personal data.
  - List the accounts with read access to the main data store.
  - Compare the list with the roles.
  - Check that access to personal data is logged.
  example: Database grants export; IAM policy review; audit log sample.
  expected: Only needed roles can read personal data. Each access to bulk data is logged and reviewed.
  severity: High
  test_type:
  - Config Review
  refs:
    privacy_top10:
    - P2
    other:
