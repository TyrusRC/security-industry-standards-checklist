- id: PRIV-SEC-001
  sheet: PRIV
  category: SEC
  title: Make sure URLs, logs and analytics hold no personal data
  objective: Finds personal data in places that many people and systems can read.
  steps:
  - Use the application with a test user that has unique data values.
  - Search access logs, application logs and analytics events for the unique values.
  - Look for personal data in URLs and query strings.
  - Check log access rights.
  example: grep -r 'test.user@example.com' /var/log; compare analytics event payloads with the data map.
  expected: Logs, URLs and analytics events hold no clear personal data. Identifiers are masked or hashed.
  severity: Medium
  test_type:
  - Manual
  - Config Review
  refs:
    privacy_top10:
    - P2
    - P1
    other:
    - GDPR Art. 5
    - GDPR Art. 32
    cwe:
