- id: PRIV-SEC-007
  sheet: PRIV
  category: SEC
  title: Check that the privacy assessment covers the web application vulnerabilities
  objective: Finds privacy reviews that ignore technical flaws such as injection and broken access control.
  steps:
  - Ask for the last penetration test and scan reports.
  - Check that the scope includes personal data stores.
  - Check the fix status of high findings.
  - Check the patch process for components.
  example: 'Document review: pen test report, SAST/DAST results, patch SLA.'
  expected: Regular tests cover personal data paths. High findings have a fix with evidence. Patches follow a set time frame.
  severity: Medium
  test_type:
  - Config Review
  refs:
    privacy_top10:
    - P1
    other:
    - GDPR Art. 32
    cwe:
    - CWE-1395
