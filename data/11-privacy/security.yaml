- id: PRIV-SEC-005
  sheet: PRIV
  category: SEC
  title: Check that sessions end after inactivity and at logout
  objective: Finds sessions that stay open and let the service keep collecting data without user awareness.
  steps:
  - Log in and leave the session idle.
  - Check that the session ends at the documented time.
  - Log out and replay the old session token.
  - Check for a logout button on all pages.
  example: 'Burp Repeater: replay the old cookie after logout and after the timeout.'
  expected: The session ends at the idle limit and at logout. The old token is rejected. Tracking stops with the session.
  severity: Medium
  test_type:
  - Manual
  refs:
    privacy_top10:
    - P8
    other:
    - GDPR Art. 5
    - GDPR Art. 32
  see:
  - WEB-SESS-019
