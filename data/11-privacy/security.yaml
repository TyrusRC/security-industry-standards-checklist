- id: PRIV-SEC-002
  sheet: PRIV
  category: SEC
  title: Check encryption of personal data at rest and the key separation
  objective: Finds personal data stored in clear form or with keys next to the data.
  steps:
  - List the stores that hold personal data.
  - Check the encryption setting of each store and each backup.
  - Find where the keys are kept.
  - Check who can read both keys and data.
  example: Cloud console storage settings; database encryption status; key vault access policy.
  expected: All stores and backups are encrypted. Keys are kept in a separate key service with limited access.
  severity: High
  test_type:
  - Config Review
  refs:
    privacy_top10:
    - P2
    other:
    - GDPR Art. 32
    cwe:
    - CWE-311
