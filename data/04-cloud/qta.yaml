- id: CLD-QTA-001
  sheet: CLD
  category: QTA
  title: Check service quotas and budget limits per account
  objective: Finds accounts where one resource or attacker can use up quotas or run up large cost.
  steps:
  - List service quotas and current use for compute, storage and network.
  - Check budget limits and cost alerts for each account.
  - Check who can raise quotas or create large resources.
  - Check for alerts when use passes a set share of the limit.
  example: aws service-quotas list-service-quotas --service-code ec2; aws budgets describe-budgets --account-id <id>; az consumption budget list; gcloud alpha billing budgets list --billing-account <id>
  expected: Each account has quotas and budgets with alerts. Few identities can raise quotas or create large resources.
  severity: Medium
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-9
    cheatsheet:
