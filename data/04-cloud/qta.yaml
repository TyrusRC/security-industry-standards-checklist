- id: CLD-QTA-002
  sheet: CLD
  category: QTA
  title: Test rate limits and throttling on public APIs and gateways
  objective: Finds gateways that accept unlimited requests from one caller.
  preconditions:
  - Use a test environment.
  - Do not run on production.
  steps:
  - List the rate and burst settings of each gateway stage and route.
  - Send requests above the limit from one test client.
  - Check that the gateway returns a throttling response.
  - Check that limits apply per caller, not only in total.
  example: aws apigateway get-usage-plans; hey -n 1000 -c 50 https://<api>/<path>; az apim api show; gcloud api-gateway api-configs list
  expected: Each route has rate and burst limits per caller. Requests above the limit get HTTP 429 and the backend stays healthy.
  severity: Medium
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-9
    cheatsheet:
