- id: CLD-SRV-004
  sheet: CLD
  category: SRV
  title: Check execution context reuse and temporary storage
  objective: Finds functions that keep secrets or user data in global variables or /tmp between calls.
  preconditions:
  - Use a test build only.
  steps:
  - Read the function code for global variables that hold secrets or user data.
  - Call the function twice with different test users.
  - Check /tmp and memory for data from the first call.
  - Check for use of single-use environments for sensitive functions.
  example: Code review of global and static variables; invoke the function with two test identities and print the /tmp listing in a test build
  expected: No secret or user data persists between calls. Code reads secrets fresh and clears temporary files.
  severity: Medium
  test_type: Code Review
  refs:
