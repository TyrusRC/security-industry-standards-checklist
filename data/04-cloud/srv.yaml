- id: CLD-SRV-002
  sheet: CLD
  category: SRV
  title: Check authentication on every function trigger
  objective: Finds triggers that let anyone invoke a function or feed it events.
  steps:
  - 'List all triggers: API gateways, function URLs, queues, topics, buckets and schedules.'
  - Check the authorizer or access policy of each trigger.
  - Invoke each public trigger without credentials.
  - Check the resource policy for public principals.
  example: aws lambda get-policy --function-name <f>; aws lambda get-function-url-config --function-name <f>; curl -i https://<function-url>; gcloud functions get-iam-policy <f>
  expected: Every trigger needs authentication and authorization. Resource policies allow only named principals, and a call without credentials fails.
  severity: High
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-3
    cheatsheet:
