- id: CLD-IAM-007
  sheet: CLD
  category: IAM
  title: Check that the root account has no keys and a hardware MFA
  objective: Finds a root or owner account that has access keys, weak MFA or daily use.
  steps:
  - Get the account credential report.
  - Check that the root account has no access keys.
  - Check that the root account uses hardware MFA.
  - Search the audit log for root sign-ins in the last 90 days.
  - Check that the root credentials are stored in a sealed process.
  example: 'aws iam get-account-summary --query "SummaryMap.[AccountAccessKeysPresent,AccountMFAEnabled]"; aws iam generate-credential-report; aws cloudtrail lookup-events --lookup-attributes AttributeKey=Username,AttributeValue=root; Azure: az role assignment list --role Owner --scope /subscriptions/<id>; GCP: gcloud organizations get-iam-policy <org>; prowler aws --services iam'
  expected: The root account has no access keys and a hardware MFA device. No root sign-in happens in normal work. Central root credential management is on.
  severity: Critical
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-3
    tool_check:
    - prowler:aws:iam_avoid_root_usage
    - prowler:aws:iam_no_root_access_key
    - prowler:aws:iam_root_credentials_management_enabled
    - prowler:aws:iam_root_hardware_mfa_enabled
    - prowler:aws:iam_root_mfa_enabled
    cwe:
    - CWE-308
    attack:
    - T1078.004
    nist_800_53:
    - AC-2
    - IA-2
    other:
    - Microsoft cloud security benchmark v1 PA-1
    - Microsoft cloud security benchmark v1 IM-6
    - Microsoft cloud security benchmark v1 PA-5
  sources_read:
  - sources/repos/prowler/prowler/providers/aws/services/iam/iam_avoid_root_usage/iam_avoid_root_usage.metadata.json
  - sources/repos/prowler/prowler/providers/aws/services/iam/iam_root_mfa_enabled/iam_root_mfa_enabled.metadata.json
  - sources/repos/SecurityBenchmarks/Microsoft Cloud Security Benchmark/Microsoft_cloud_security_benchmark_v1.xlsx
- id: CLD-IAM-008
  sheet: CLD
  category: IAM
  title: Check MFA enforcement for console users, admins and management APIs
  objective: Finds human identities that sign in or call management APIs with one factor only.
  steps:
  - List all human users with console or portal access.
  - Find users with no MFA device or no MFA policy.
  - Check that a policy denies actions when MFA is not present.
  - Check that admin users use phishing-resistant MFA.
  - Sign in with a test user that has no MFA.
  example: aws iam list-virtual-mfa-devices; aws iam get-credential-report; az rest --method get --url https://graph.microsoft.com/v1.0/identity/conditionalAccess/policies; az rest --url https://graph.microsoft.com/v1.0/policies/authenticationMethodsPolicy; gcloud compute project-info describe --format="value(commonInstanceMetadata.items)" (enable-oslogin-2fa)
  expected: Every human identity needs MFA for sign-in and for management APIs. Admin users use hardware or passkey factors. The test user without MFA gets no access.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-3
    tool_check:
