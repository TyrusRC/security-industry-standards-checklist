- id: CLD-IAM-013
  sheet: CLD
  category: IAM
  title: Find policies that allow privilege escalation
  objective: Finds policies where a user can give themselves more rights or assume admin roles.
  steps:
  - Export all customer and inline policies.
  - Find actions such as iam:PassRole, iam:CreatePolicyVersion and sts:AssumeRole on all resources.
  - Find full access to audit log and key services.
  - Run a privilege escalation scanner on the account.
  - Try one found path with a test identity.
