- id: CLD-IAM-009
  sheet: CLD
  category: IAM
  title: Check password policy and temporary credential lifetime
  objective: Finds weak password rules and long-lived credentials for users and user pools.
  steps:
  - Get the password policy of the account and of each user pool.
  - Compare length, complexity, reuse and expiry with the company rule.
  - Find users with long-lived access keys instead of temporary credentials.
  - Check the expiry time of temporary passwords.
