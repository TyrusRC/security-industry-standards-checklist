- id: CLD-NET-004
  sheet: CLD
  category: NET
  title: Check hardening of the instance metadata service
  objective: Finds compute resources whose metadata service gives role credentials to any local process or to SSRF.
  steps:
  - List all VMs and nodes with their metadata settings.
  - Find resources that allow the old metadata version without a session token.
  - Check the hop limit for container hosts.
  - From a test workload, request the metadata address.
  example: aws ec2 describe-instances --query "Reservations[].Instances[].[InstanceId,MetadataOptions.HttpTokens,MetadataOptions.HttpPutResponseHopLimit]"; curl -m 3 http://169.254.169.254/latest/meta-data/ (test host)
  expected: All compute resources require session-token metadata access (IMDSv2) and the old version is off. Workloads cannot read role credentials without a token.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-6
    - CNAS-3
    cheatsheet:
    - Server_Side_Request_Forgery_Prevention_Cheat_Sheet
    - Secure_Cloud_Architecture_Cheat_Sheet
    cwe:
    - CWE-918
    - CWE-668
    attack:
    - T1552.005
    nist_800_53:
    - AC-6
    - SC-7
  see:
