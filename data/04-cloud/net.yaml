- id: CLD-NET-005
  sheet: CLD
  category: NET
  title: Check TLS and authentication on traffic between services
  objective: Finds east-west traffic that is plaintext or accepts any caller.
  steps:
  - List the service-to-service connections from the diagram.
  - Capture traffic between two test services.
  - Check for TLS and for mutual authentication or signed tokens.
  - Send a call with no valid identity.
  example: tcpdump -i any -A port <port> (test hosts); openssl s_client -connect <svc>:<port>; curl -v http://<svc>:<port>
  expected: Service traffic uses TLS with mutual authentication or validated signed tokens. A call with no valid identity is rejected.
  severity: Medium
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-6
    - CNAS-3
    cheatsheet:
    - Microservices_Security_Cheat_Sheet
