- id: CLD-NET-006
  sheet: CLD
  category: NET
  title: Check WAF and DDoS protection at internet-facing endpoints
  objective: Finds public endpoints with no web filter or protection against traffic floods.
  steps:
  - List all internet-facing applications and CDNs.
  - Check that a WAF with managed rules is attached to each.
  - Check custom rules for sensitive routes and rate limits.
  - Check that DDoS protection is on based on the risk of the application.
  example: aws wafv2 list-web-acls --scope REGIONAL; aws shield describe-subscription; az network application-gateway waf-policy list; gcloud compute security-policies list
  expected: Each public application has a WAF in block mode with custom rules and rate limits. DDoS protection follows the application risk.
  severity: Medium
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-6
    - CNAS-9
