- id: CLD-NET-003
  sheet: CLD
  category: NET
  title: Check egress filtering and monitoring of traffic to unknown domains
  objective: Finds workloads that can send data to any Internet host with no record.
  steps:
  - List egress routes, NAT gateways and egress firewall rules.
  - From a test workload, connect to an unlisted external domain.
  - Check for DNS and flow logs of the connection.
  - Check for an alert on traffic to unknown or bad domains.
  example: aws ec2 describe-nat-gateways; aws network-firewall list-firewalls; curl -m 3 https://example.org (from a test workload); query flow logs for the connection
  expected: Egress is limited to approved destinations. The test connection fails or raises an alert, and flow logs show the connection.
  severity: Medium
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-6
    - CNAS-10
