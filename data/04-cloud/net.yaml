- id: CLD-NET-001
  sheet: CLD
  category: NET
  title: Check the network is split into frontend, middleware and backend zones
  objective: Finds flat networks where a breach of a web server gives direct access to databases and key stores.
  steps:
  - Get the network diagram and the list of VPCs and subnets.
  - 'Map each system to a zone: frontend, middleware or backend.'
  - Check the rules between zones and the allowed flows.
  - From a frontend host, try to reach a backend host.
  example: aws ec2 describe-subnets; aws ec2 describe-route-tables; az network vnet list; gcloud compute networks subnets list; nmap -Pn -p <db-port> <backend-host>
  expected: Frontend hosts cannot reach backend systems directly. Each flow between zones is allowed by a written rule.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-6
    cheatsheet:
    - Network_Segmentation_Cheat_Sheet
    - Secure_Cloud_Architecture_Cheat_Sheet
    cwe:
    - CWE-923
    - CWE-668
    attack:
    - T1046
    nist_800_53:
    - SC-7
    - AC-4
  sources_read:
  - sources/repos/www-project-cloud-native-application-security-top-10/2022/en/src/0x06_over_permissive_network.md
  - sources/top10s/cnas_index.md
  - sources/repos/CheatSheetSeries/cheatsheets/Network_Segmentation_Cheat_Sheet.md
  - sources/repos/CheatSheetSeries/cheatsheets/Secure_Cloud_Architecture_Cheat_Sheet.md
- id: CLD-NET-002
  sheet: CLD
  category: NET
  title: Find internal services that the Internet can reach
  objective: Finds microservices, admin tools and queues exposed by load balancers, public IPs or function URLs.
  preconditions:
  - Written approval for the scan of the listed addresses.
  steps:
  - List all public IP addresses, load balancers and public endpoints.
  - Map each one to a service and an owner.
  - Scan the public addresses for open ports.
  - Mark each endpoint that is not meant to be public.
  example: aws ec2 describe-addresses; aws elbv2 describe-load-balancers --query "LoadBalancers[?Scheme==\`internet-facing\`]"; az network public-ip list; gcloud compute addresses list; nmap -sV <ip>
  expected: Only reviewed edge services are public. Internal services use private addresses or private endpoints.
  severity: High
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-6
    - CNAS-8
    cheatsheet:
