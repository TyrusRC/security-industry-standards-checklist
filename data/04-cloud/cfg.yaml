- id: CLD-CFG-005
  sheet: CLD
  category: CFG
  title: Run a cloud posture scan and review failed checks
  objective: Finds insecure defaults and drift across accounts, subscriptions and projects.
  preconditions:
  - Read-only audit role on all accounts in scope.
  steps:
  - Give a read-only audit role to the scan tool in each account.
  - Run the scan for all regions and services in scope.
  - Rank the failed checks by risk and exposure.
  - Fix each finding or record an accepted risk with an owner.
  example: prowler aws; prowler azure --az-cli-auth; prowler gcp; scout aws; scout azure --cli; scout gcp --user-account
  expected: The scan runs on a set schedule. High findings are fixed or accepted by the owner in writing.
  severity: Medium
  test_type: Automated
  refs:
    cloud_native_top10:
    - CNAS-1
