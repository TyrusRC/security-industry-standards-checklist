- id: CLD-CFG-001
  sheet: CLD
  category: CFG
  title: Check object storage for public access at account level
  objective: Finds buckets and containers that anyone on the Internet can list or read.
  steps:
  - List all storage buckets and containers in each account and region.
  - Check public access blocks and policies at account and bucket level.
  - Try an anonymous list and read request on each bucket.
  - Check that signed URLs have short lifetimes and narrow scope.
  example: aws s3api get-public-access-block --bucket <b>; aws s3api get-bucket-policy-status --bucket <b>; az storage account show -n <a> --query allowBlobPublicAccess; gsutil iam get gs://<b>; prowler aws --services s3
  expected: No bucket is public unless it holds only public, non-sensitive files by design. An anonymous request returns an access denied error.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-1
    cheatsheet:
    - Secure_Cloud_Architecture_Cheat_Sheet
    cwe:
    - CWE-732
    - CWE-668
    attack:
    - T1530
    - T1619
    nist_800_53:
    - AC-3
    - AC-6
  see:
  - WEB-CONF-012
  sources_read:
  - sources/repos/www-project-cloud-native-application-security-top-10/2022/en/src/0x01_insecure_cco_config.md
  - sources/top10s/cnas_index.md
  - sources/repos/CheatSheetSeries/cheatsheets/Secure_Cloud_Architecture_Cheat_Sheet.md
- id: CLD-CFG-002
  sheet: CLD
  category: CFG
  title: Check that data stores sit in private subnets with no public address
  objective: Finds databases, file systems and backend servers that have a public IP or a route from the Internet.
  steps:
  - List databases, caches, queues and backend instances.
  - Check each one for a public IP address or endpoint.
  - Check the subnet route tables for a route to an internet gateway.
  - Try a connection from an outside host.
  example: aws rds describe-db-instances --query "DBInstances[].[DBInstanceIdentifier,PubliclyAccessible]"; az sql server show -n <s> -g <rg> --query publicNetworkAccess; gcloud sql instances list --format="value(name,ipAddresses)"; scout aws
  expected: Data stores have no public address and sit in private subnets. They accept connections only from approved application tiers.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-1
    - CNAS-6
    cheatsheet:
    - Secure_Cloud_Architecture_Cheat_Sheet
