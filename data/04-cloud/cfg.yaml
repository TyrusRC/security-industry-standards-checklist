- id: CLD-CFG-006
  sheet: CLD
  category: CFG
  title: Check that each managed service is configured within the shared responsibility model
  objective: Finds services where the team assumed that the provider handles authentication, logging or patching.
  preconditions:
  - Interview the service owners.
  steps:
  - 'List the cloud services in use and their type: IaaS, PaaS, SaaS or serverless.'
  - For each type, list the duties that the customer holds.
  - Check that authentication, logging, patching and code security have an owner.
  - Record gaps with an owner and a date.
  example: 'Review provider documentation: AWS Lambda security, GCP Cloud Functions securing, Azure Functions app security'
  expected: Each service has a written list of provider and customer duties. Every customer duty has an owner and a control.
  severity: Medium
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-1
    - CNAS-7
    cheatsheet:
    - Secure_Cloud_Architecture_Cheat_Sheet
    cwe:
