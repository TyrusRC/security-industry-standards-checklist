- id: CLD-LOG-004
  sheet: CLD
  category: LOG
  title: Test alerts for security events and cost or usage anomalies
  objective: Finds environments where known attack steps raise no alert.
  preconditions:
  - Use a test account.
  steps:
  - List the alert rules for sign-in, IAM change, log change, key use and storage policy change.
  - Do a test action for each rule in a test account.
  - Check that the alert reaches the response team.
  - Check alerts for unusual usage of compute, functions, databases and cost.
  example: aws cloudwatch describe-alarms; aws events list-rules; aws budgets describe-budgets --account-id <id>; az monitor activity-log alert list; gcloud alpha monitoring policies list
  expected: Each test action raises an alert in the agreed time. Alerts for usage and cost anomalies exist and have an owner.
  severity: High
  test_type: Manual
