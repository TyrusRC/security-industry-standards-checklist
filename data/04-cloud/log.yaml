- id: CLD-LOG-001
  sheet: CLD
  category: LOG
  title: Check that audit logs are on in every account and region
  objective: Finds accounts and regions where cloud API activity leaves no record.
  steps:
  - List all accounts, subscriptions, projects and regions in use.
  - Check that the audit trail is on for each, with management and data events.
  - Make a test change and find its record.
  - Check that the record shows identity, source address and time.
  example: aws cloudtrail describe-trails; aws cloudtrail get-trail-status --name <t>; az monitor diagnostic-settings subscription list; gcloud logging sinks list
  expected: Audit logs cover all accounts and regions. The test change appears with identity, source address and time.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-10
    cheatsheet:
