- id: CLD-LOG-005
  sheet: CLD
  category: LOG
  title: Check that logs hold no secrets and that time sources agree
  objective: Finds logs that expose credentials or cannot be matched across systems.
  steps:
  - Search sample logs of functions, gateways and agents for tokens and keys.
  - Check the field list against the log standard.
  - Compare timestamps of one request across three systems.
  - Check the time sync setting of the hosts.
  example: grep -rIiE "password|token|secret|authorization" <log-sample>; compare timestamps of one correlation ID
  expected: Logs hold no credentials or protected personal data. Timestamps agree and every record carries a correlation ID.
  severity: Medium
  test_type: Manual
  refs:
