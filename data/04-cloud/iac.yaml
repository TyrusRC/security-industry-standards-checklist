- id: CLD-IAC-002
  sheet: CLD
  category: IAC
  title: Scan infrastructure code for misconfigurations before deploy
  objective: Finds insecure settings in templates before they reach a cloud account.
  steps:
  - Run an IaC scanner on all templates and modules.
  - Review high findings such as public access, open ports and missing encryption.
  - Check that failed checks block the merge.
  - Compare the scan result to the posture scan of the account.
  example: checkov -d <iac-dir>; trivy config <iac-dir>; tfsec <iac-dir>
  expected: Templates have no high findings without a written exception. The scan gates the deploy and matches the live posture.
  severity: Medium
  test_type: Automated
  refs:
