- id: CLD-IAC-004
  sheet: CLD
  category: IAC
  title: Check deploy-time tags, inventory and secrets handling in infrastructure code
  objective: Finds templates that create untagged resources or place secrets in code and state.
  steps:
  - Check that templates set owner and purpose tags on every resource.
  - Search templates, variables and state for secret values.
  - Check that secrets come from a secret store at deploy.
  - Check access to state files.
  example: checkov -d <iac-dir>; gitleaks detect --source <iac-repo>; grep -rIiE "password|secret|key" <iac-dir>
  expected: Every created resource has tags and an inventory entry. Templates and state hold no secrets, and state files have limited access.
  severity: Medium
  test_type: Config Review
