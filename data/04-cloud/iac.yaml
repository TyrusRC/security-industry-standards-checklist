- id: CLD-IAC-001
  sheet: CLD
  category: IAC
  title: Review who can run and change infrastructure code
  objective: Finds identities with wide rights to deploy or edit infrastructure.
  steps:
  - List the people and automation roles that can apply infrastructure changes.
  - Check that each role has only the rights its stack needs.
  - Check that changes need review and a protected branch.
  - Check that the rights granted to created resources are limited.
  example: aws iam list-attached-role-policies --role-name <deploy-role>; git log --merges <iac-repo>; checkov -d <iac-dir>
  expected: Deploy roles have limited rights per stack. Changes need review. The resources that the code creates get minimal permissions.
  severity: High
  test_type: Config Review
  refs:
