- id: CLD-LOG-006
  sheet: CLD
  category: LOG
  title: Check that threat detection runs in all regions under a central admin
  objective: Finds regions and accounts with no managed threat detection or open high findings.
  steps:
  - List the regions and accounts in use.
  - Check that the threat detection service is on in each region.
  - Check that a delegated admin manages all member accounts.
  - Open the findings and look for high severity items.
  - Create a sample finding and follow it to the response team.
  example: aws guardduty list-detectors --region <r>; aws guardduty list-members --detector-id <d>; aws guardduty list-findings --detector-id <d> --finding-criteria '{"Criterion":{"severity":{"Gte":7}}}'; aws guardduty create-sample-findings --detector-id <d>; prowler aws --services guardduty
  expected: Threat detection is on in all regions and accounts under one admin account. High findings have an owner. The sample finding reaches the response team.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-10
    tool_check:
    - prowler:aws:guardduty_centrally_managed
    - prowler:aws:guardduty_delegated_admin_enabled_all_regions
    - prowler:aws:guardduty_is_enabled
    - prowler:aws:guardduty_no_high_severity_findings
    cwe:
    - CWE-778
    attack:
    - T1685.002
    nist_800_53:
    - SI-4
    - IR-4
    other:
    - Microsoft cloud security benchmark v1 LT-1
    - Microsoft cloud security benchmark v1 LT-5
  sources_read:
  - sources/repos/prowler/prowler/providers/aws/services/guardduty/guardduty_centrally_managed/guardduty_centrally_managed.metadata.json
