- id: CLD-INJ-003
  sheet: CLD
  category: INJ
  title: Check input validation, parameterized access and least rights in handlers
  objective: Finds handler code that builds queries or commands from event data, with roles that make the damage worse.
  steps:
  - Read the handler code for string-built queries and shell calls.
  - Check for allow-list validation of type, length and format.
  - Check that data access uses parameterized calls.
  - Check that the handler role cannot reach other data.
  example: semgrep --config auto <handler-dir>; grep -rnE "os.system|subprocess|exec\(|eval\(" <handler-dir>
  expected: Handlers validate input with allow-lists and use parameterized access. The role limits the damage of a flaw.
  severity: High
  test_type: Code Review
  refs:
