- id: CLD-INJ-001
  sheet: CLD
  category: INJ
  title: List all event sources that feed code and treat each as untrusted
  objective: Finds event paths such as storage triggers, queues and topics that carry attacker-controlled data.
  steps:
  - List functions, workers and services that react to events.
  - 'Map each event source: API call, object upload, queue, topic, IoT message or schedule.'
  - Mark which fields an outside party controls, such as object names and metadata.
  - Rank sources by exposure.
  example: aws lambda list-event-source-mappings; aws s3api get-bucket-notification-configuration --bucket <b>; gcloud eventarc triggers list; az eventgrid topic list
  expected: Every event source is listed with its owner and the fields that outside parties control. Each handler validates these fields.
  severity: Medium
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-2
    cheatsheet:
    - Serverless_FaaS_Security_Cheat_Sheet
    cwe:
    - CWE-20
    attack:
    - T1648
    nist_800_53:
    - SI-10
