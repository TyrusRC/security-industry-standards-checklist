- id: CLD-INJ-002
  sheet: CLD
  category: INJ
  title: Send crafted values through event fields to the handlers
  objective: Finds handlers that pass event data into commands, queries or templates without checks.
  preconditions:
  - Use a test environment.
  - Do not run on production.
  steps:
  - Create a test object with a name that holds shell and SQL meta characters.
  - Send a queue message with the same values in each field.
  - Watch the handler logs and downstream systems for errors or changed behavior.
  - Send oversize, wrong type and extra fields.
  example: aws s3 cp test.txt "s3://<b>/a;id;.txt"; aws sqs send-message --queue-url <q> --message-body "{\"id\":\"1 OR 1=1\"}"; gcloud pubsub topics publish <t> --message "<payload>"
  expected: Handlers reject or neutralize malformed values. No command runs, no query changes, and errors show no internals.
  severity: High
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-2
    cheatsheet:
