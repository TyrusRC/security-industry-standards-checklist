- id: CLD-AST-001
  sheet: CLD
  category: AST
  title: Build and check the cloud asset inventory
  objective: Finds resources that no one owns, tracks or patches.
  steps:
  - List all resources in every account, region and project.
  - Compare the list to the asset register.
  - Find resources without owner, environment or purpose tags.
  - Add each missing resource to the register or remove it.
  example: aws resourcegroupstaggingapi get-resources; aws configservice list-discovered-resources --resource-type AWS::EC2::Instance; az resource list; gcloud asset search-all-resources --scope=projects/<p>
  expected: Every resource is in the register with an owner and tags. Untracked resources are removed.
  severity: Medium
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-8
    cheatsheet:
