- id: CLD-AST-002
  sheet: CLD
  category: AST
  title: Find undocumented APIs and microservices
  objective: Finds services and API routes that run but are not in any design or API definition.
  steps:
  - List API gateways, load balancer rules, function URLs and service names.
  - Compare them to the API definitions and the architecture document.
  - Find routes with no definition or owner.
  - Check the old versions of each API.
  example: aws apigateway get-rest-apis; aws apigatewayv2 get-apis; az apim api list -g <rg> -n <svc>; gcloud api-gateway apis list
  expected: Every running API and service is in the documents with an owner. Old API versions are removed or protected.
  severity: Medium
  test_type: Manual
  refs:
