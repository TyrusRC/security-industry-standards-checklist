- id: CLD-SUP-004
  sheet: CLD
  category: SUP
  title: Check vulnerability scanning for cloud workloads and dependencies
  objective: Finds workloads that run vulnerable libraries or images that no scan covers.
  steps:
  - 'List all workloads: VMs, containers and functions.'
  - Check that each has a scan for images, packages and dependencies.
  - Review open findings for age and exposure.
  - Check the process to fix or accept each finding.
  example: trivy image <image>; trivy fs <path>; grype <image>; aws inspector2 list-findings; dependency-check --scan <path>
  expected: All workloads have regular scans. High findings are fixed in the agreed time or accepted in writing.
  severity: High
  test_type: Automated
