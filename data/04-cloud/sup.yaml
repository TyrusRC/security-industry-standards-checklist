- id: CLD-SUP-001
  sheet: CLD
  category: SUP
  title: Check cloud container registries for access, source and transport
  objective: Finds registries that allow anonymous or wide push and pull, or that accept images from untrusted sources.
  steps:
  - List the container registries and repositories.
  - Check the access policy for each repository.
  - Try an anonymous pull and push.
  - Check that only the build system can push and that transfers use TLS.
  example: aws ecr describe-repositories; aws ecr get-repository-policy --repository-name <r>; az acr list; az acr repository list -n <acr>; gcloud artifacts repositories list
  expected: Registries need authentication. Only build identities can push, pull rights follow need, and all transfers use TLS.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-4
    cheatsheet:
    - Software_Supply_Chain_Security_Cheat_Sheet
    - Docker_Security_Cheat_Sheet
    cwe:
    - CWE-284
    - CWE-319
    attack:
    - T1525
    - T1195.002
    nist_800_53:
    - AC-3
    - SR-3
  see:
  - K8S-IMG-005
  - CICD-ART-007
  sources_read:
