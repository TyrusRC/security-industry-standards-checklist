- id: CLD-SUP-002
  sheet: CLD
  category: SUP
  title: Check that only trusted and current images run in cloud services
  objective: Finds services that run untrusted, unsigned or stale images.
  steps:
  - List images used by container services and functions.
  - Find images from public or unknown sources.
  - Check the age of each image and its last rebuild.
  - Check the rule that blocks untrusted images at deploy.
  example: aws ecs list-task-definitions; aws lambda list-functions --query "Functions[?PackageType==\`Image\`]"; az containerapp list; gcloud run services list
  expected: Services run only images from approved registries with known digests. Images are rebuilt on a set schedule.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
