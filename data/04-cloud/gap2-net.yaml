- id: CLD-NET-010
  sheet: CLD
  category: NET
  title: Check DNSSEC, domain transfer lock and mail domain signing
  objective: Finds domains with weak DNSSEC, no transfer lock or no mail signing.
  steps:
  - List domains and public DNS zones.
  - Check that DNSSEC is on and does not use RSASHA1.
  - Check that the transfer lock is on.
  - Check that privacy protection hides contact data.
  - Check DKIM for mail domains.
  example: aws route53domains get-domain-detail --domain-name <d>; gcloud dns managed-zones describe <z> --format="value(dnssecConfig)"; aws ses get-identity-dkim-attributes --identities <d>; dig +dnssec <d>; prowler gcp --services dns; prowler aws --services route53 ses
  expected: DNSSEC is on with strong algorithms. Domains have transfer lock and privacy protection. Mail domains sign with DKIM.
  severity: Medium
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-1
    tool_check:
    - prowler:aws:route53_domains_privacy_protection_enabled
    - prowler:aws:route53_domains_transferlock_enabled
    - prowler:aws:ses_identity_dkim_enabled
    - prowler:gcp:dns_dnssec_disabled
    - prowler:gcp:dns_rsasha1_in_use_to_key_sign_in_dnssec
    - prowler:gcp:dns_rsasha1_in_use_to_zone_sign_in_dnssec
    cwe:
    - CWE-345
    attack:
    - T1584.001
    - T1584.002
    nist_800_53:
    - SC-20
    - SC-21
    other:
    - Microsoft cloud security benchmark v1 NS-10
  sources_read:
  - sources/repos/prowler/prowler/providers/aws/services/route53/route53_domains_privacy_protection_enabled/route53_domains_privacy_protection_enabled.metadata.json
  - sources/repos/prowler/prowler/providers/gcp/services/dns/dns_rsasha1_in_use_to_zone_sign_in_dnssec/dns_rsasha1_in_use_to_zone_sign_in_dnssec.metadata.json
