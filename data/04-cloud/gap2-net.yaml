- id: CLD-NET-011
  sheet: CLD
  category: NET
  title: Find dangling DNS records that allow subdomain takeover
  objective: Finds DNS records that point to released IP addresses or deleted services.
  steps:
  - Export all DNS records of each zone.
  - Find records that point to cloud IP addresses or service names.
  - Check that each target still belongs to the account.
  - Try to claim one released target in a test.
  example: aws route53 list-resource-record-sets --hosted-zone-id <z>; aws ec2 describe-addresses; dig <name>; subjack -w <list>; prowler aws --check route53_dangling_ip_subdomain_takeover
  expected: Every record points to a resource that the account owns. Records for removed resources are deleted before the resource is released.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-8
    tool_check:
    - prowler:aws:route53_dangling_ip_subdomain_takeover
    cwe:
    - CWE-1188
    attack:
    - T1584.001
    - T1583.001
    nist_800_53:
    - SC-20
    - CM-8
    other:
    - Microsoft cloud security benchmark v1 NS-10
    - Microsoft cloud security benchmark v1 AM-3
  sources_read:
  - sources/repos/prowler/prowler/providers/aws/services/route53/route53_dangling_ip_subdomain_takeover/route53_dangling_ip_subdomain_takeover.metadata.json
