- id: CLD-NET-012
  sheet: CLD
  category: NET
  title: Check managed admin access to VMs and block serial ports
  objective: Finds VMs that use shared SSH keys, serial ports or open admin ports.
  steps:
  - List VMs and the admin access method of each.
  - Check that project-wide SSH keys are blocked.
  - Check that OS Login, session manager or just-in-time access is in use.
  - Check that serial port access is off.
  - Check connection logs for remote access endpoints.
  example: gcloud compute instances describe <i> --format="value(metadata.items)"; gcloud compute project-info describe; az vm show -n <v> -g <rg> --query osProfile.linuxConfiguration.disablePasswordAuthentication; az security jit-policy list; aws ssm describe-instance-information; aws ec2 describe-client-vpn-endpoints; prowler gcp --services compute
  expected: Admins reach VMs through managed channels with identity and logs. Project-wide keys and serial ports are off. Password login is off.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-6
    - CNAS-3
    tool_check:
    - prowler:aws:ec2_client_vpn_endpoint_connection_logging_enabled
    - prowler:aws:ec2_instance_managed_by_ssm
    - prowler:azure:vm_jit_access_enabled
    - prowler:azure:vm_linux_enforce_ssh_authentication
    - prowler:gcp:compute_instance_block_project_wide_ssh_keys_disabled
    - prowler:gcp:compute_instance_serial_ports_in_use
    - prowler:gcp:compute_project_os_login_enabled
    cwe:
    - CWE-798
    attack:
    - T1021
    - T1098.004
    - T1133
    nist_800_53:
    - AC-17
    - AC-2
    other:
    - Microsoft cloud security benchmark v1 PA-2
    - Microsoft cloud security benchmark v1 PA-6
    - Microsoft cloud security benchmark v1 NS-8
  sources_read:
