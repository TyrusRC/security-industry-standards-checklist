- id: CLD-NET-007
  sheet: CLD
  category: NET
  title: Check CDN origin access, dangling origins and edge settings
  objective: Finds CDN origins that anyone can reach directly or that point to buckets nobody owns.
  steps:
  - List CDN distributions and their origins.
  - Check that each storage origin allows only the CDN identity.
  - Find origins that point to deleted buckets.
  - Check the default root object and the geo restrictions.
  - Request an object directly from the origin.
  example: aws cloudfront list-distributions; aws cloudfront get-distribution-config --id <i>; aws s3api head-bucket --bucket <origin-bucket>; curl -i https://<bucket>.s3.amazonaws.com/<object>; prowler aws --services cloudfront
  expected: Storage origins accept the CDN identity only. No origin points to a missing bucket. The direct origin request is denied.
  severity: Medium
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-6
    tool_check:
    - prowler:aws:cloudfront_distributions_default_root_object
    - prowler:aws:cloudfront_distributions_geo_restrictions_enabled
    - prowler:aws:cloudfront_distributions_multiple_origin_failover_configured
    - prowler:aws:cloudfront_distributions_s3_origin_access_control
    - prowler:aws:cloudfront_distributions_s3_origin_non_existent_bucket
    cwe:
    - CWE-284
    attack:
    - T1584
    - T1530
    nist_800_53:
    - SC-7
    - AC-3
    other:
    - Microsoft cloud security benchmark v1 NS-2
    - Microsoft cloud security benchmark v1 NS-6
  sources_read:
  - sources/repos/prowler/prowler/providers/aws/services/cloudfront/cloudfront_distributions_default_root_object/cloudfront_distributions_default_root_object.metadata.json
  - sources/repos/prowler/prowler/providers/aws/services/cloudfront/cloudfront_distributions_s3_origin_non_existent_bucket/cloudfront_distributions_s3_origin_non_existent_bucket.metadata.json
  - sources/repos/SecurityBenchmarks/Microsoft Cloud Security Benchmark/Microsoft_cloud_security_benchmark_v1.xlsx
- id: CLD-NET-008
  sheet: CLD
  category: NET
  title: Check security group hygiene, peering, transit and VPC routing paths
  objective: Finds unused or wide network rules, open transit attachments and unsafe peering routes.
  steps:
  - List security groups, peering links, transit gateways and endpoints.
  - Find unused groups and groups from setup wizards.
  - Find groups with a very large number of rules.
  - Check that peering routes are limited to needed ranges.
  - Check that transit attachments need approval.
  example: aws ec2 describe-security-groups; aws ec2 describe-vpc-peering-connections; aws ec2 describe-transit-gateways --query "TransitGateways[].Options.AutoAcceptSharedAttachments"; aws ec2 describe-route-tables; gcloud compute instances describe <i> --format="value(canIpForward,networkInterfaces)"; prowler aws --services ec2 vpc
  expected: No unused or wizard-made group remains. Peering routes are least-privilege. Transit attachments need approval. Hosts have one network interface unless a design needs more.
  severity: Medium
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-6
    tool_check:
    - prowler:aws:ec2_instance_uses_single_eni
    - prowler:aws:ec2_securitygroup_from_launch_wizard
    - prowler:aws:ec2_securitygroup_with_many_ingress_egress_rules
    - prowler:aws:ec2_transitgateway_auto_accept_vpc_attachments
    - prowler:aws:vpc_endpoint_for_ec2_enabled
    - prowler:aws:vpc_peering_routing_tables_with_least_privilege
    - prowler:gcp:compute_instance_ip_forwarding_is_enabled
    - prowler:gcp:compute_instance_single_network_interface
    - prowler:gcp:compute_network_default_in_use
    - prowler:gcp:compute_network_not_legacy
    cwe:
    - CWE-923
    attack:
    - T1021.007
    - T1599
    nist_800_53:
    - SC-7
    - CM-7
    other:
    - Microsoft cloud security benchmark v1 NS-7
    - Microsoft cloud security benchmark v1 NS-1
  sources_read:
  - sources/repos/prowler/prowler/providers/aws/services/ec2/ec2_instance_uses_single_eni/ec2_instance_uses_single_eni.metadata.json
  - sources/repos/prowler/prowler/providers/gcp/services/compute/compute_instance_single_network_interface/compute_instance_single_network_interface.metadata.json
  - sources/repos/SecurityBenchmarks/Microsoft Cloud Security Benchmark/Microsoft_cloud_security_benchmark_v1.xlsx
- id: CLD-NET-009
  sheet: CLD
  category: NET
  title: Check network firewall coverage and flow visibility for each VPC
  objective: Finds VPCs with no central traffic inspection or network monitor.
  steps:
  - List VPCs and virtual networks.
  - Check that a firewall or bastion service covers each one.
  - Check the default action of firewall policies.
  - Check that rule groups are linked.
  - Check that the network monitor is on in each region.
  example: aws network-firewall list-firewalls; aws network-firewall describe-firewall-policy --firewall-policy-name <p>; az network bastion list; az network watcher list; prowler aws --services networkfirewall; prowler azure --services network
  expected: Each VPC has traffic inspection with a deny or alert default. Rule groups are linked. A network monitor runs in each region.
  severity: Medium
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-6
    tool_check:
    - prowler:aws:networkfirewall_in_all_vpc
    - prowler:aws:networkfirewall_policy_default_action_fragmented_packets
    - prowler:aws:networkfirewall_policy_default_action_full_packets
    - prowler:aws:networkfirewall_policy_rule_group_associated
    - prowler:azure:network_bastion_host_exists
    - prowler:azure:network_watcher_enabled
    cwe:
    - CWE-693
    attack:
    - T1048
    - T1071
    nist_800_53:
    - SC-7
    - SI-4
    other:
    - Microsoft cloud security benchmark v1 NS-3
    - Microsoft cloud security benchmark v1 NS-4
  sources_read:
