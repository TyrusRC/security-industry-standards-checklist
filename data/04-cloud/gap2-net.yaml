- id: CLD-NET-013
  sheet: CLD
  category: NET
  title: Check VM boot integrity, confidential computing and enclave host exposure
  objective: Finds VMs without boot integrity checks and enclave hosts that are open to the network.
  steps:
  - List VMs and their security type.
  - Check that secure boot and a virtual TPM are on.
  - Check that confidential VMs are used for sensitive work.
  - Check that enclave hosts have no public address and limited inbound rules.
  - Check the virtualization type of old instances.
  example: gcloud compute instances describe <i> --format="value(shieldedInstanceConfig,confidentialInstanceConfig)"; az vm show -n <v> -g <rg> --query securityProfile; aws ec2 describe-instances --query "Reservations[].Instances[].[InstanceId,VirtualizationType,EnclaveOptions]"; prowler gcp --services compute
  expected: Boot integrity checks are on. Sensitive work runs on confidential VMs. Enclave hosts are private with narrow inbound rules. No old paravirtual instances remain.
  severity: Medium
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-1
    tool_check:
    - prowler:aws:ec2_confidential_workload_host_not_running
    - prowler:aws:ec2_confidential_workload_host_unrestricted_ingress
    - prowler:aws:ec2_confidential_workload_host_vsock_proxy_exposed
    - prowler:aws:ec2_instance_paravirtual_type
    - prowler:azure:vm_trusted_launch_enabled
    - prowler:gcp:compute_instance_confidential_computing_enabled
    - prowler:gcp:compute_instance_shielded_vm_enabled
    cwe:
    - CWE-693
    attack:
    - T1542
    nist_800_53:
    - SI-7
    - SC-39
    other:
    - Microsoft cloud security benchmark v1 PV-3
    - Microsoft cloud security benchmark v1 PV-4
  sources_read:
