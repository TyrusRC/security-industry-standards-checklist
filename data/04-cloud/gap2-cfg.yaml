- id: CLD-CFG-007
  sheet: CLD
  category: CFG
  title: 'Check organization guardrails: SCPs, policy enforcement, tags and delegated admins'
  objective: Finds tenants where preventive guardrails are missing or in audit-only mode.
  steps:
  - List the organization policies, service control policies and policy assignments.
  - Check that deny rules block unused regions and risky actions.
  - Check that policy effects are enforced and not audit-only.
  - Check that security services use a delegated admin account.
  - Create a test resource that breaks a rule.
  example: aws organizations list-policies --filter SERVICE_CONTROL_POLICY; aws organizations list-delegated-administrators; aws fms list-policies; az policy assignment list --query "[].[name,enforcementMode]"; gcloud resource-manager org-policies list --organization=<org>; prowler aws --services organizations fms
  expected: Guardrails deny unused regions and risky actions at the root. Policies are enforced. Security services run from a delegated admin account, not the management account. The test resource is blocked.
  severity: Medium
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-1
    - CNAS-8
    tool_check:
    - prowler:aws:fms_policy_compliant
    - prowler:aws:organizations_account_part_of_organizations
    - prowler:aws:organizations_delegated_administrators
    - prowler:aws:organizations_opt_out_ai_services_policy
    - prowler:aws:organizations_scp_check_deny_regions
    - prowler:aws:organizations_security_services_delegated_admin_not_management_account
    - prowler:aws:organizations_tags_policies_enabled_and_attached
    - prowler:azure:policy_ensure_asc_enforcement_enabled
    cwe:
    - CWE-693
    attack:
    - T1535
    - T1578
    nist_800_53:
    - CM-6
    - AC-3
    other:
    - Microsoft cloud security benchmark v1 GS-2
    - Microsoft cloud security benchmark v1 PV-2
    - Microsoft cloud security benchmark v1 AM-2
