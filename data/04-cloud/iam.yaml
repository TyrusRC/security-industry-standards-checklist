- id: CLD-IAM-002
  sheet: CLD
  category: IAM
  title: Check that workloads use short-lived identities and not stored keys
  objective: Finds access keys and service credentials that stay valid after a leak.
  steps:
  - List all access keys, service account keys and client secrets.
  - Find keys older than the policy age or never used.
  - Check that workloads use role-based or federated credentials.
  - Revoke unused keys in a test or after approval.
  example: aws iam generate-credential-report; aws iam list-access-keys --user-name <u>; gcloud iam service-accounts keys list --iam-account <sa>; az ad app credential list --id <app>
  expected: Workloads use short-lived credentials from roles or workload identity federation. Remaining static keys are few, rotated and owned.
  severity: High
  test_type: Config Review
  refs:
    cloud_native_top10:
    - CNAS-3
