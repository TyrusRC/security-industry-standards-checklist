- id: CLD-IAM-006
  sheet: CLD
  category: IAM
  title: Test microservice and cloud API endpoints for missing authentication
  objective: Finds internal APIs and managed service endpoints that answer without credentials.
  steps:
  - List API gateway routes, function URLs and service endpoints.
  - Call each one with no credentials.
  - Call each internal service directly, skipping the gateway.
  - Record each response that returns data.
  example: curl -i https://<endpoint>/<path>; aws apigateway get-rest-apis; aws lambda list-function-url-configs --function-name <f>; az functionapp function show --name <f> -g <rg> -n <fn>
  expected: Every endpoint needs authentication and authorization. Calls without valid credentials return 401 or 403.
  severity: High
  test_type: Manual
  refs:
    cloud_native_top10:
    - CNAS-3
    cheatsheet:
